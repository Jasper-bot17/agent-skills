5张记忆卡片」\n**AI**：提取核心知识点 → 生成 5 张卡片（定义、过程、对比、公式、意义）→ Markdown 展示 → 提供 Anki CSV 下载。\n\n### 示例 2：批量生成 + 复习计划\n**用户**：上传一章教材，说「帮我生成卡片并安排两周复习计划」\n**AI**：提取 25 个核心知识点 → 生成 25 张卡片 → 导出 Anki CSV → 生成 14 天复习计划表（每天新卡片+复习卡片数量）。\n\n### 示例 3：仅生成高频考点\n**用户**：「从这些法律条文中提取最可能考的10个点做卡片」\n**AI**：识别高频考点（定义、构成要件、例外情形、对比）→ 生成 10 张标记「高频考点」的卡片 → 附记忆口诀。\n\n### 示例 4：优化已有卡片\n**用户**：提供一组自制卡片，说「帮我看看这些卡片质量怎么样，怎么改进」\n**AI**：逐张评估（问题明确性、答案完整性、卡片过载、重复）→ 给出改进建议 → 生成优化后的卡片。\n", "files": {"SKILL.md": "---\nname: flashcard-generator\ndescription: '记忆卡片生成助手。从学习笔记、教材章节、文章或任意文本中自动提取核心知识点，生成问答式记忆卡片（Flashcard），支持多种卡片类型（概念定义、因果关系、对比辨析、公式定理、时间线、列举题），可导出为 Anki 兼容 CSV/JSON 格式，并提供间隔重复（Spaced Repetition）复习安排建议。适用于考试备考、语言学习、技术知识学习、读书笔记复盘等场景。'\n---\n\n# 记忆卡片生成助手\n\n## 一、技能定位\n\n本技能用于**将学习材料转化为可高效复习的记忆卡片**。核心价值：\n\n- 自动从文本中提取核心知识点，无需手动逐张制作卡片\n- 生成多种类型的高质量问答卡片，覆盖不同记忆需求\n- 导出为 Anki 等主流记忆软件兼容格式，可直接导入\n- 提供间隔重复复习安排，提升记忆效率\n- 支持对已有卡片进行质量评估和优化建议\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户提供学习笔记/教材/文章，说「帮我做几张记忆卡片」「生成 flashcard」「把这段内容做成问答题」\n2. 用户说「我要备考XX，帮我从这些资料里提取知识点做卡片」\n3. 用户需要将读书笔记转化为可复习的问答卡片\n4. 用户说「帮我生成 Anki 卡片」「导出可以导入 Anki 的文件」\n5. 用户需要对某一主题进行系统复习，要求生成覆盖全面的卡片组\n6. 用户说「帮我安排一下这些卡片的复习计划」「间隔重复怎么安排」\n\n## 三、卡片类型体系\n\n### 3.1 概念定义型\n**适用**：术语、定义、理论、专有名词\n**格式**：\n- 正面：「什么是 XXX？」「XXX 的定义是什么？」\n- 背面：完整定义 + 关键特征 + 举例\n\n### 3.2 因果关系型\n**适用**：原因与结果、条件与结论、机制与效应\n**格式**：\n- 正面：「XXX 的原因是什么？」「XXX 会导致什么结果？」\n- 背面：原因/机制 + 结果 + 关键中间环节\n\n### 3.3 对比辨析型\n**适用**：易混淆概念、相似理论、不同方法的区别\n**格式**：\n- 正面：「XXX 和 YYY 的区别是什么？」\n- 背面：对比表格或分点对比（定义、特点、适用场景、优缺点）\n\n### 3.4 公式定理型\n**适用**：数学公式、物理定律、化学方程式、算法复杂度\n**格式**：\n- 正面：「XXX 公式是什么？」「XXX 定理的内容？」\n- 背面：公式/定理 + 各符号含义 + 适用条件 + 典型例题\n\n### 3.5 步骤流程型\n**适用**：操作步骤、实验流程、算法步骤、代谢途径\n**格式**：\n- 正面：「XXX 的步骤是什么？」「简述 XXX 的过程」\n- 背面：编号步骤 + 每步关键要点 + 注意事项\n\n### 3.6 列举型\n**适用**：特征、分类、优缺点、影响因素\n**格式**：\n- 正面：「XXX 的主要特征有哪些？」「XXX 分为哪几类？」\n- 背面：编号列表 + 每项简要说明\n\n### 3.7 时间线型\n**适用**：历史事件、发展历程、阶段划分\n**格式**：\n- 正面：「XXX 的发展历程？」「XXX 经历了哪些阶段？」\n- 背面：时间线（时间 - 事件 - 意义）\n\n### 3.8 填空型（cloze）\n**适用**：关键术语、数字、人名、年份\n**格式**：\n- 正面：「{{c1::XXX}} 是指……」（Anki cloze 格式）\n- 背面：完整句子 + 被填内容的解释\n\n## 四、操作步骤\n\n### 步骤 1：读取并理解学习材料\n\n1. 完整读取用户提供的文本（笔记、教材章节、文章、PDF 提取文本等）\n2. 如果文本过长，分段读取，确保不遗漏关键知识点\n3. 识别文本的主题领域（如医学、法律、计算机、历史、语言等），调整卡片风格\n4. 识别文本结构：标题层级、定义段落、公式、列表、案例等\n\n### 步骤 2：提取核心知识点\n\n从文本中提取以下类型的知识点：\n\n| 知识点类型 | 提取线索 |\n|---|---|\n| 定义/概念 | 「是指」「定义为」「称为」「XXX是」 |\n| 原因/机制 | 「因为」「由于」「导致」「机制是」「原理」 |\n| 对比/区别 | 「区别于」「不同于」「相比」「与…的区别」 |\n| 公式/定理 | 数学公式、「定理」「定律」「法则」 |\n| 步骤/流程 | 「第一步」「首先」「然后」「流程」「步骤」 |\n| 特征/分类 | 「特征」「特点」「分为」「包括」「类型」 |\n| 优缺点 | 「优点」「缺点」「优势」「局限」「不足」 |\n| 时间/事件 | 年份、「在…时期」「经历了」「发展」 |\n\n**提取原则**：\n- 优先提取考试/应用中高频的核心知识点\n- 每个知识点应能独立成一张卡片\n- 避免提取过于琐碎或显而易见的内容\n- 一张卡片只聚焦一个知识点（避免「卡片过载」）\n\n### 步骤 3：使用辅助脚本初步提取（可选）\n\n对于较长的文本，可使用 `scripts/generate_flashcards.py` 进行初步的知识点提取和卡片生成：\n\n```bash\n# 从文本文件生成卡片（文本格式输出）\npython3 scripts/generate_flashcards.py --input notes.txt --format text\n\n# 输出 Anki 兼容 CSV（正面,背面,标签）\npython3 scripts/generate_flashcards.py --input notes.txt --format anki\n\n# 输出 JSON 格式\npython3 scripts/generate_flashcards.py --input notes.txt --format json\n\n# 指定卡片数量和主题标签\npython3 scripts/generate_flashcards.py --input notes.txt --max-cards 30 --tags \"生物学,细胞\"\n```\n\n脚本会基于模式匹配提取定义、列表、对比等知识点，生成初步卡片。**注意：脚本结果仅作辅助，必须经过 AI 语义审核和优化后才能作为最终卡片。**\n\n### 步骤 4：AI 生成高质量卡片\n\n基于提取的知识点，为每个知识点生成卡片：\n\n#### 4.1 选择卡片类型\n根据知识点性质选择最合适的卡片类型（参见第三节卡片类型体系）。\n\n#### 4.2 编写正面（问题）\n- 问题明确、具体，无歧义\n- 避免「关于XXX，以下说法正确的是」这类模糊问题\n- 一个问题只问一个知识点\n- 语言简洁，不超过 30 字（中文）\n\n#### 4.3 编写背面（答案）\n- 答案准确、完整，基于原文不编造\n- 关键信息用加粗或编号突出\n- 适当补充举例、口诀、记忆技巧\n- 复杂内容用表格或分点呈现\n- 标注信息来源（如「出自教材第3章」）\n\n#### 4.4 添加标签\n为每张卡片添加标签，便于分类复习：\n- 学科/领域标签：如「医学」「法律」「计算机」\n- 主题标签：如「心血管系统」「合同法」「数据结构」\n- 难度标签：如「基础」「进阶」「高频考点」\n- 卡片类型标签：如「定义」「对比」「公式」\n\n### 步骤 5：卡片质量自检\n\n生成卡片后，逐项检查：\n\n- [ ] 每张卡片只聚焦一个知识点？\n- [ ] 正面问题是否明确、无歧义？\n- [ ] 背面答案是否准确、完整（与原文一致，不编造）？\n- [ ] 是否避免了「卡片过载」（一张卡片内容过多）？\n- [ ] 是否有重复或高度相似的卡片？\n- [ ] 卡片类型是否匹配知识点性质？\n- [ ] 关键术语、数字、人名是否准确？\n- [ ] 标签是否合理，便于分类复习？\n- [ ] 整体卡片是否覆盖了文本的核心知识点（覆盖率 ≥ 80%）？\n\n### 步骤 6：生成复习计划（如用户需要）\n\n基于间隔重复（Spaced Repetition）原理，生成复习安排：\n\n| 复习阶段 | 时间间隔 | 说明 |\n|---|---|---|\n| 初次学习 | Day 0 | 当天学习新卡片 |\n| 第一次复习 | Day 1 | 次日复习 |\n| 第二次复习 | Day 3 | 间隔2天 |\n| 第三次复习 | Day 7 | 间隔4天 |\n| 第四次复习 | Day 14 | 间隔1周 |\n| 第五次复习 | Day 30 | 间隔2周 |\n| 长期保持 | 每30天 | 已掌握卡片定期回顾 |\n\n- 标记为「困难」的卡片：缩短间隔（Day 0 → 1 → 2 → 4 → 7 → 14）\n- 标记为「简单」的卡片：延长间隔（Day 0 → 3 → 7 → 14 → 30 → 60）\n- 每天复习量建议：新卡片 ≤ 20 张/天，复习卡片 ≤ 100 张/天\n\n### 步骤 7：导出与交付\n\n1. **Markdown 格式**：直接在对话中展示卡片（适合快速预览）\n2. **Anki CSV 格式**：生成 `正面,背面,标签` 格式的 CSV 文件，可直接导入 Anki\n3. **JSON 格式**：结构化数据，便于程序处理\n4. 如用户需要，可创建飞书文档或导出为文件\n\n## 五、输出规范\n\n### 5.1 Markdown 卡片展示格式\n\n```markdown\n### 卡片 1：[概念定义] 什么是细胞呼吸？\n\n**正面（问题）**：\n什么是细胞呼吸？其本质是什么？\n\n**背面（答案）**：\n细胞呼吸是指**有机物在细胞内经过一系列氧化分解，生成二氧化碳或其他产物，释放能量并生成ATP的过程**。\n\n- **本质**：氧化分解有机物，释放能量\n- **主要场所**：线粒体（有氧呼吸）\n- **关键产物**：ATP（细胞的直接能源物质）\n- **意义**：为细胞的各项生命活动提供能量\n\n**标签**：`生物学` `细胞` `基础` `定义`\n\n---\n```\n\n### 5.2 Anki CSV 格式\n\n```csv\n正面,背面,标签\n\"什么是细胞呼吸？\",\"细胞呼吸是指有机物在细胞内经过一系列氧化分解...\",\"生物学::细胞::基础\"\n\"有氧呼吸和无氧呼吸的区别是什么？\",\"| 对比项 | 有氧呼吸 | 无氧呼吸 |...\",\"生物学::细胞::对比\"\n```\n\n**注意**：Anki 导入时选择「逗号分隔」，字段映射为「正面=字段1，背面=字段2，标签=字段3」。\n\n### 5.3 卡片统计报告\n\n生成卡片后，附简要统计：\n\n```\n📊 卡片生成统计\n- 总卡片数：25 张\n- 卡片类型分布：概念定义 10 | 因果关系 5 | 对比辨析 4 | 公式定理 3 | 步骤流程 2 | 列举 1\n- 难度分布：基础 15 | 进阶 8 | 高频考点 2\n- 知识点覆盖率：约 85%\n- 预计复习时间：初次学习约 40 分钟，每日复习约 10-15 分钟\n```\n\n## 六、常见场景处理\n\n### 场景 1：教材章节生成卡片\n**用户**：上传一章教材 PDF，说「帮我把这章内容做成记忆卡片」\n**处理**：提取文本 → 识别核心知识点 → 按章节结构组织卡片 → 生成 20-40 张卡片 → 导出 Anki CSV。\n\n### 场景 2：考试备考重点卡片\n**用户**：「我下周要考XX，帮我从这些笔记里提取高频考点做卡片」\n**处理**：优先提取高频考点、易混淆点、公式定理 → 标记「高频考点」标签 → 生成 15-25 张核心卡片 → 提供 7 天复习计划。\n\n### 场景 3：语言学习词汇卡片\n**用户**：「帮我把这些英语单词做成记忆卡片」\n**处理**：为每个单词生成「单词+音标+词性+释义+例句+记忆技巧」卡片 → 支持 cloze 填空格式 → 按主题/难度分组。\n\n### 场景 4：读书笔记卡片\n**用户**：「我读完了《XX》，帮我做几张卡片记住核心观点」\n**处理**：提取核心观点、关键概念、金句、作者论证逻辑 → 生成 10-20 张卡片 → 标注书籍来源。\n\n### 场景 5：技术知识学习卡片\n**用户**：「帮我把这篇关于React Hooks的文章做成卡片」\n**处理**：提取核心概念（useState/useEffect等）、使用规则、常见陷阱、代码示例 → 生成概念+对比+代码示例卡片 → 标签标记技术栈。\n\n## 七、间隔重复复习指南\n\n### 7.1 复习方法\n1. **主动回忆**：看正面问题，先在脑中回忆答案，再翻背面核对\n2. **诚实评分**：按「忘记/模糊/记住/熟练」四级评分\n3. **困难卡片优先**：每天先复习标记为「困难」的卡片\n4. **批量复习**：每天固定时间复习，保持节奏\n\n### 7.2 记忆技巧\n- **联想记忆**：将抽象概念与熟悉的事物关联\n- **口诀记忆**：为列举类知识点编口诀\n- **图像记忆**：为复杂过程画流程图（卡片背面可附简图描述）\n- **间隔重复**：按复习计划定期回顾，避免临时抱佛脚\n\n### 7.3 注意事项\n- 不要一次制作过多卡片（每天新卡片 ≤ 20 张）\n- 定期清理已熟练掌握的卡片（减少复习负担）\n- 卡片内容要准确，错误的卡片比没有卡片更有害\n- 结合实际应用（做题、实践）效果更佳\n\n## 八、注意事项\n\n1. **不编造知识**：卡片内容必须严格基于用户提供的材料，不得自行添加未提及的知识点或答案。如材料中信息不足，标注「待补充」。\n2. **准确性优先**：涉及数字、公式、人名、年份等关键信息时，必须与原文核对，确保准确。\n3. **卡片不过载**：一张卡片只聚焦一个知识点，避免把多个问题塞进一张卡片。\n4. **问题要具体**：避免「关于XXX，说说你的理解」这类过于宽泛的问题。\n5. **难度分层**：根据知识点的重要性和难度，合理分配基础/进阶/高频考点标签。\n6. **隐私保护**：如学习材料涉及个人隐私或敏感信息，在卡片中适当脱敏。\n7. **不替代专业指导**：本技能生成的卡片用于辅助学习，不构成专业教学或考试保证。\n8. **可定制性**：如用户对卡片数量、难度、类型有特殊要求，按用户要求调整。\n\n## 九、文件结构\n\n```\nflashcard-generator/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── flashcard-template.md             # 记忆卡片格式模板（含各类型示例）\n├── scripts/\n│   └── generate_flashcards.py            # 卡片初步生成脚本（知识点提取、卡片生成、多格式导出）\n└── examples/\n    ├── sample-biology-notes.md           # 示例：生物学学习笔记\n    └── sample-flashcards.csv             # 示例：生成的 Anki 兼容卡片\n```\n\n## 十、使用示例\n\n### 示例 1：从笔记生成卡片\n**用户**：粘贴一段关于「光合作用」的笔记，说「帮我做5张记忆卡片」\n**AI**：提取核心知识点 → 生成 5 张卡片（定义、过程、对比、公式、意义）→ Markdown 展示 → 提供 Anki CSV 下载。\n\n### 示例 2：批量生成 + 复习计划\n**用户**：上传一章教材，说「帮我生成卡片并安排两周复习计划」\n**AI**：提取 25 个核心知识点 → 生成 25 张卡片 → 导出 Anki CSV → 生成 14 天复习计划表（每天新卡片+复习卡片数量）。\n\n### 示例 3：仅生成高频考点\n**用户**：「从这些法律条文中提取最可能考的10个点做卡片」\n**AI**：识别高频考点（定义、构成要件、例外情形、对比）→ 生成 10 张标记「高频考点」的卡片 → 附记忆口诀。\n\n### 示例 4：优化已有卡片\n**用户**：提供一组自制卡片，说「帮我看看这些卡片质量怎么样，怎么改进」\n**AI**：逐张评估（问题明确性、答案完整性、卡片过载、重复）→ 给出改进建议 → 生成优化后的卡片。\n", "templates/flashcard-template.md": "# 记忆卡片格式模板\n\n> 本模板包含 8 种卡片类型的标准格式和示例，用于生成高质量记忆卡片。\n\n---\n\n## 通用格式\n\n### Markdown 展示格式\n\n```markdown\n### 卡片 N：[类型标签] 卡片标题\n\n**正面（问题）**：\n<问题内容>\n\n**背面（答案）**：\n<答案内容，关键信息用**加粗**>\n\n**标签**：`标签1` `标签2` `标签3`\n\n---\n```\n\n### Anki CSV 格式\n\n```csv\n正面,背面,标签\n\"<问题内容>\",\"<答案内容（HTML格式，支持<br>换行、<b>加粗、<table>表格）>\",\"学科::主题::难度\"\n```\n\n### JSON 格式\n\n```json\n{\n  \"id\": 1,\n  \"type\": \"concept\",\n  \"front\": \"问题内容\",\n  \"back\": \"答案内容\",\n  \"tags\": [\"标签1\", \"标签2\"],\n  \"difficulty\": \"basic\",\n  \"source\": \"教材第3章\"\n}\n```\n\n---\n\n## 类型 1：概念定义型\n\n**适用场景**：术语、定义、理论、专有名词\n\n**模板**：\n- 正面：「什么是 XXX？」「XXX 的定义是什么？」\n- 背面：完整定义 + 关键特征（3-5点）+ 举例 + 易混淆点\n\n**示例**：\n\n```markdown\n### 卡片 1：[概念定义] 什么是光合作用？\n\n**正面（问题）**：\n什么是光合作用？其总反应式是什么？\n\n**背面（答案）**：\n光合作用是指**绿色植物通过叶绿体，利用光能，把二氧化碳和水转化成储存能量的有机物（主要是淀粉），并且释放氧气的过程**。\n\n**总反应式**：\n6CO₂ + 6H₂O —(光能/叶绿体)→ C₆H₁₂O₆ + 6O₂\n\n**关键特征**：\n- 场所：叶绿体\n- 条件：光能\n- 原料：CO₂ 和 H₂O\n- 产物：有机物（糖类）和 O₂\n- 能量转化：光能 → 化学能\n\n**标签**：`生物学` `光合作用` `基础` `定义`\n```\n\n---\n\n## 类型 2：因果关系型\n\n**适用场景**：原因与结果、条件与结论、机制与效应\n\n**模板**：\n- 正面：「XXX 的原因是什么？」「XXX 会导致什么结果？」「XXX 的机制是？」\n- 背面：原因/机制（分点）→ 中间环节 → 最终结果 → 影响因素\n\n**示例**：\n\n```markdown\n### 卡片 2：[因果关系] 为什么会发生温室效应？\n\n**正面（问题）**：\n温室效应产生的原因和机制是什么？\n\n**背面（答案）**：\n**原因**：大气中温室气体（CO₂、CH₄、N₂O 等）浓度增加。\n\n**机制**：\n1. 太阳短波辐射穿过大气层到达地面\n2. 地面吸收热量后以长波辐射（红外线）形式向外释放\n3. 温室气体强烈吸收地面长波辐射\n4. 温室气体再以辐射方式向四面八方释放热量，其中一部分返回地面\n5. 地面和低层大气温度升高\n\n**结果**：全球气候变暖、海平面上升、极端天气增多\n\n**主要温室气体**：CO₂（贡献最大）、甲烷、氧化亚氮、氟利昂\n\n**标签**：`环境科学` `气候变化` `因果` `进阶`\n```\n\n---\n\n## 类型 3：对比辨析型\n\n**适用场景**：易混淆概念、相似理论、不同方法的区别\n\n**模板**：\n- 正面：「XXX 和 YYY 的区别是什么？」\n- 背面：对比表格（对比维度逐项对比）+ 记忆口诀\n\n**示例**：\n\n```markdown\n### 卡片 3：[对比辨析] 有氧呼吸和无氧呼吸的区别\n\n**正面（问题）**：\n有氧呼吸和无氧呼吸的主要区别是什么？\n\n**背面（答案）**：\n\n| 对比项 | 有氧呼吸 | 无氧呼吸 |\n|---|---|---|\n| 是否需要O₂ | 需要 | 不需要 |\n| 主要场所 | 线粒体（主要） | 细胞质基质 |\n| 分解产物 | CO₂ + H₂O | 酒精+CO₂ 或 乳酸 |\n| 释放能量 | 大量（约2870kJ/mol） | 少量（约196.65kJ/mol） |\n| ATP产量 | 约30-32个 | 2个 |\n| 发生生物 | 大多数动植物 | 乳酸菌、酵母菌（兼性） |\n\n**共同点**：\n- 第一阶段完全相同（糖酵解，在细胞质基质进行）\n- 本质都是氧化分解有机物，释放能量\n\n**记忆口诀**：有线粒体氧充足，无氧只在基质里，产酒产乳酸，能量只够塞牙缝。\n\n**标签**：`生物学` `细胞呼吸` `对比` `高频考点`\n```\n\n---\n\n## 类型 4：公式定理型\n\n**适用场景**：数学公式、物理定律、化学方程式、算法复杂度\n\n**模板**：\n- 正面：「XXX 公式/定理是什么？」\n- 背面：公式/定理 + 各符号含义 + 适用条件 + 典型例题\n\n**示例**：\n\n```markdown\n### 卡片 4：[公式定理] 牛顿第二定律\n\n**正面（问题）**：\n牛顿第二定律的内容和公式是什么？各符号含义？\n\n**背面（答案）**：\n**内容**：物体加速度的大小跟作用力成正比，跟物体的质量成反比，加速度的方向跟作用力的方向相同。\n\n**公式**：**F = ma**\n\n**符号含义**：\n- F：合外力（单位：牛顿 N）\n- m：物体质量（单位：千克 kg）\n- a：加速度（单位：m/s²）\n\n**适用条件**：\n- 惯性参考系中\n- 宏观低速物体（相对论效应可忽略）\n- F 为合外力（所有外力的矢量和）\n\n**典型例题**：\n质量为 2kg 的物体受到 10N 的合外力，求加速度？\n解：a = F/m = 10/2 = 5 m/s²\n\n**标签**：`物理学` `力学` `公式` `基础`\n```\n\n---\n\n## 类型 5：步骤流程型\n\n**适用场景**：操作步骤、实验流程、算法步骤、代谢途径\n\n**模板**：\n- 正面：「XXX 的步骤/过程是什么？」\n- 背面：编号步骤 + 每步关键要点 + 注意事项\n\n**示例**：\n\n```markdown\n### 卡片 5：[步骤流程] 有丝分裂的过程\n\n**正面（问题）**：\n简述有丝分裂各时期的主要特征。\n\n**背面（答案）**：\n有丝分裂分为**间期**和**分裂期**（前、中、后、末）：\n\n**1. 间期**（占时最长）：\n- DNA 复制和有关蛋白质合成\n- 染色体呈染色质状态\n\n**2. 前期**：\n- 染色质螺旋化形成染色体\n- 核膜、核仁逐渐消失\n- 纺锤体形成\n\n**3. 中期**：\n- 染色体的着丝点排列在赤道板上\n- 染色体形态最清晰，是观察染色体的最佳时期\n\n**4. 后期**：\n- 着丝点分裂，姐妹染色单体分开\n- 染色体在纺锤丝牵引下移向两极\n\n**5. 末期**：\n- 染色体解螺旋为染色质\n- 核膜、核仁重新出现\n- 纺锤体消失\n- 细胞质分裂（植物：细胞板；动物：缢裂）\n\n**记忆口诀**：膜仁消失现两体（前），形定数晰赤道齐（中），点裂数加均两极（后），两消两现重开始（末）。\n\n**标签**：`生物学` `细胞分裂` `步骤` `高频考点`\n```\n\n---\n\n## 类型 6：列举型\n\n**适用场景**：特征、分类、优缺点、影响因素\n\n**模板**：\n- 正面：「XXX 的主要特征/分类/优缺点有哪些？」\n- 背面：编号列表 + 每项简要说明 + 记忆口诀\n\n**示例**：\n\n```markdown\n### 卡片 6：[列举] 生物多样性的三个层次\n\n**正面（问题）**：\n生物多样性包括哪三个层次？各自的含义是什么？\n\n**背面（答案）**：\n生物多样性包括三个层次：\n\n**1. 遗传多样性（基因多样性）**：\n- 指同种生物不同个体之间的基因差异\n- 是物种多样性和生态系统多样性的基础\n- 例：不同品种的水稻\n\n**2. 物种多样性**：\n- 指一定区域内生物种类的丰富程度\n- 是最直观、最基本的多样性\n- 例：森林中有多种鸟类、昆虫、植物\n\n**3. 生态系统多样性**：\n- 指生态系统类型的多样性\n- 包括森林、草原、湿地、海洋等\n- 是生物多样性的最高层次\n\n**三者关系**：遗传多样性 → 物种多样性 → 生态系统多样性（由微观到宏观）\n\n**记忆口诀**：基因物种生态系，由小到大三层级。\n\n**标签**：`生物学` `生物多样性` `列举` `基础`\n```\n\n---\n\n## 类型 7：时间线型\n\n**适用场景**：历史事件、发展历程、阶段划分\n\n**模板**：\n- 正面：「XXX 的发展历程/经历了哪些阶段？」\n- 背面：时间线表格（时间 - 事件 - 意义）\n\n**示例**：\n\n```markdown\n### 卡片 7：[时间线] 细胞学说的建立过程\n\n**正面（问题）**：\n简述细胞学说建立的主要历程和关键人物。\n\n**背面（答案）**：\n\n| 时间 | 人物 | 贡献 | 意义 |\n|---|---|---|---|\n| 1665年 | 罗伯特·胡克 | 用显微镜观察木栓组织，发现并命名\"细胞\" | 首次发现细胞 |\n| 1680年 | 列文虎克 | 用自制显微镜观察到活细胞（细菌、原生动物等） | 首次观察活细胞 |\n| 1838年 | 施莱登 | 提出\"所有植物都是由细胞构成的\" | 植物细胞学说 |\n| 1839年 | 施旺 | 提出\"所有动物也是由细胞构成的\" | 建立细胞学说 |\n| 1858年 | 魏尔肖 | 提出\"细胞通过分裂产生新细胞\" | 完善细胞学说 |\n\n**细胞学说主要内容**：\n1. 细胞是一个有机体，一切动植物都由细胞发育而来\n2. 细胞是一个相对独立的单位\n3. 新细胞可以从老细胞中产生\n\n**标签**：`生物学` `细胞学说` `时间线` `基础`\n```\n\n---\n\n## 类型 8：填空型（Cloze）\n\n**适用场景**：关键术语、数字、人名、年份（Anki cloze 格式）\n\n**模板**：\n- 正面：包含 {{c1::答案}} 的完整句子\n- 背面：完整句子 + 被填内容的解释\n\n**示例**：\n\n```markdown\n### 卡片 8：[填空] DNA 结构\n\n**正面（问题）**：\nDNA 分子是由 {{c1::两条}} 链组成的，按 {{c2::反向平行}} 方式盘旋成 {{c3::双螺旋}} 结构。基本骨架由 {{c4::脱氧核糖和磷酸}} 交替连接构成，排列在 {{c5::外侧}}；碱基排列在 {{c6::内侧}}，通过 {{c7::氢键}} 连接。\n\n**背面（答案）**：\n完整句子：DNA 分子是由两条链组成的，按反向平行方式盘旋成双螺旋结构。基本骨架由脱氧核糖和磷酸交替连接构成，排列在外侧；碱基排列在内侧，通过氢键连接。\n\n**关键考点**：\n- 提出者：沃森和克里克（1953年）\n- 碱基配对：A-T（2个氢键），G-C（3个氢键）\n- 结构特点：稳定性、多样性、特异性\n\n**标签**：`生物学` `DNA` `填空` `高频考点`\n```\n\n---\n\n## 卡片质量检查清单\n\n生成卡片后，逐项确认：\n\n- [ ] 每张卡片只聚焦一个知识点\n- [ ] 正面问题明确、具体、无歧义\n- [ ] 背面答案准确、完整（与原文一致）\n- [ ] 关键信息已加粗或编号突出\n- [ ] 无重复或高度相似的卡片\n- [ ] 卡片类型匹配知识点性质\n- [ ] 标签合理（学科::主题::难度）\n- [ ] 整体覆盖核心知识点（≥80%）\n- [ ] 无编造内容（所有答案基于提供的材料）\n", "scripts/generate_flashcards.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\n记忆卡片生成助手 - 知识点提取与卡片初步生成脚本\n\n从学习文本中提取核心知识点，生成问答式记忆卡片。\n支持文本、Anki CSV、JSON 三种输出格式。\n\n用法：\n    python3 generate_flashcards.py --input notes.txt --format text\n    python3 generate_flashcards.py --input notes.txt --format anki\n    python3 generate_flashcards.py --input notes.txt --format json\n    python3 generate_flashcards.py --input notes.txt --max-cards 30 --tags \"生物学,细胞\"\n    cat notes.txt | python3 generate_flashcards.py --format text\n\"\"\"\n\nimport argparse\nimport csv\nimport io\nimport json\nimport re\nimport sys\nfrom collections import defaultdict\nfrom dataclasses import dataclass, field, asdict\nfrom typing import List, Optional, Dict, Tuple\n\n\n# ============================================================\n# 数据结构\n# ============================================================\n\n@dataclass\nclass Flashcard:\n    \"\"\"一张记忆卡片\"\"\"\n    id: int\n    card_type: str  # concept, causal, comparison, formula, process, list, timeline, cloze\n    front: str\n    back: str\n    tags: List[str] = field(default_factory=list)\n    difficulty: str = \"basic\"  # basic, advanced, high_frequency\n    source: str = \"\"\n    confidence: float = 0.0  # 提取置信度 0-1\n\n\n@dataclass\nclass KnowledgePoint:\n    \"\"\"提取的知识点\"\"\"\n    text: str\n    kp_type: str  # definition, list, comparison, formula, process, timeline\n    source_line: int\n    context: str = \"\"\n\n\n# ============================================================\n# 知识点提取模式\n# ============================================================\n\n# 定义模式\nDEFINITION_PATTERNS = [\n    r'(.{2,50}?)\\s*(?:是指|定义为|称为|是指|就是指|系指)\\s*(.{10,200})',\n    r'所谓\\s*(.{2,30}?)\\s*[，,]\\s*(.{10,200})',\n    r'(.{2,30}?)\\s*(?:的定义|的概念)\\s*[是：:]\\s*(.{10,200})',\n]\n\n# 列表/特征模式\nLIST_PATTERNS = [\n    r'(.{2,30}?)\\s*(?:的特征|的特点|的分类|的类型|的种类|包括|分为|有以下|主要有)\\s*[：:]\\s*(.{10,300})',\n    r'(.{2,30}?)\\s*(?:的优点|的缺点|的优势|的局限|的不足)\\s*[：:]\\s*(.{10,200})',\n]\n\n# 对比模式\nCOMPARISON_PATTERNS = [\n    r'(.{2,20}?)\\s*(?:和|与|跟)\\s*(.{2,20}?)\\s*(?:的区别|的不同|的异同|的比较)\\s*[：:，,]?\\s*(.{10,300})',\n    r'(.{2,20}?)\\s*(?:不同于|区别于)\\s*(.{2,20}?)\\s*[，,。]\\s*(.{10,200})',\n]\n\n# 因果/机制模式\nCAUSAL_PATTERNS = [\n    r'(.{2,30}?)\\s*(?:的原因|的机理|的机制|的原理|的过程)\\s*[：:]\\s*(.{10,300})',\n    r'因为\\s*(.{10,100}?)\\s*[，,]\\s*(?:所以|因此|导致|因而)\\s*(.{10,100})',\n]\n\n# 公式/定理模式\nFORMULA_PATTERNS = [\n    r'(.{2,30}?)\\s*(?:公式|定理|定律|法则|方程)\\s*[：:]\\s*(.{5,100})',\n    r'(.{2,30}?)\\s*(?:公式|定理|定律)\\s*(?:为|是)\\s*[：:]?\\s*(.{5,100})',\n]\n\n# 步骤/流程模式\nPROCESS_PATTERNS = [\n    r'(.{2,30}?)\\s*(?:的步骤|的过程|的流程|的阶段)\\s*[：:]\\s*(.{10,300})',\n    r'(?:第一步|首先|第一阶段)\\s*[：:，,]?\\s*(.{5,100})',\n]\n\n# 时间线模式\nTIMELINE_PATTERNS = [\n    r'(\\d{4}年)\\s*(.{2,50}?)\\s*(?:提出|发现|建立|发表|创立|发明)\\s*(.{0,50})',\n    r'(\\d{4}年)\\s*[，,]\\s*(.{2,30}?)\\s*(?:提出|发现|建立)\\s*(.{0,50})',\n]\n\n\n# ============================================================\n# 文本解析器\n# ============================================================\n\nclass TextParser:\n    \"\"\"解析学习文本，提取知识点\"\"\"\n\n    def __init__(self, text: str):\n        self.text = text\n        self.lines = text.split('\\n')\n        self.knowledge_points: List[KnowledgePoint] = []\n\n    def parse(self) -> List[KnowledgePoint]:\n        \"\"\"执行知识点提取\"\"\"\n        # 合并段落（按空行分割）\n        paragraphs = self._split_paragraphs()\n\n        for para_text, start_line in paragraphs:\n            # 跳过过短的段落\n            if len(para_text) < 15:\n                continue\n\n            # 尝试各种模式匹配\n            self._extract_definitions(para_text, start_line)\n            self._extract_lists(para_text, start_line)\n            self._extract_comparisons(para_text, start_line)\n            self._extract_causal(para_text, start_line)\n            self._extract_formulas(para_text, start_line)\n            self._extract_processes(para_text, start_line)\n            self._extract_timelines(para_text, start_line)\n\n        return self.knowledge_points\n\n    def _split_paragraphs(self) -> List[Tuple[str, int]]:\n        \"\"\"将文本按空行分割为段落，返回 (段落文本, 起始行号)\"\"\"\n        paragraphs = []\n        current_para = []\n        start_line = 0\n\n        for i, line in enumerate(self.lines):\n            stripped = line.strip()\n            if stripped:\n                if not current_para:\n                    start_line = i + 1\n                current_para.append(stripped)\n            else:\n                if current_para:\n                    paragraphs.append((' '.join(current_para), start_line))\n                    current_para = []\n\n        if current_para:\n            paragraphs.append((' '.join(current_para), start_line))\n\n        return paragraphs\n\n    def _add_kp(self, text: str, kp_type: str, line: int, context: str = \"\"):\n        \"\"\"添加知识点（去重）\"\"\"\n        # 简单去重：文本相似度高的跳过\n        text_clean = re.sub(r'\\s+', ' ', text).strip()\n        for existing in self.knowledge_points:\n            if existing.text[:30] == text_clean[:30] and len(text_clean) > 20:\n                return\n        self.knowledge_points.append(KnowledgePoint(\n            text=text_clean,\n            kp_type=kp_type,\n            source_line=line,\n            context=context,\n        ))\n\n    def _extract_definitions(self, text: str, line: int):\n        \"\"\"提取定义\"\"\"\n        for pattern in DEFINITION_PATTERNS:\n            matches = re.findall(pattern, text)\n            for match in matches:\n                if isinstance(match, tuple) and len(match) >= 2:\n                    term = match[0].strip()\n                    definition = match[1].strip()\n                    # 过滤掉太短或明显不是定义的\n                    if len(term) >= 2 and len(definition) >= 10:\n                        self._add_kp(\n                            f\"{term}：{definition}\",\n                            \"definition\",\n                            line,\n                            f\"术语：{term}\"\n                        )\n\n    def _extract_lists(self, text: str, line: int):\n        \"\"\"提取列表/特征\"\"\"\n        for pattern in LIST_PATTERNS:\n            matches = re.findall(pattern, text)\n            for match in matches:\n                if isinstance(match, tuple) and len(match) >= 2:\n                    topic = match[0].strip()\n                    content = match[1].strip()\n                    if len(topic) >= 2 and len(content) >= 10:\n                        self._add_kp(\n                            f\"{topic}：{content}\",\n                            \"list\",\n                            line,\n                            f\"主题：{topic}\"\n                        )\n\n    def _extract_comparisons(self, text: str, line: int):\n        \"\"\"提取对比\"\"\"\n        for pattern in COMPARISON_PATTERNS:\n            matches = re.findall(pattern, text)\n            for match in matches:\n                if isinstance(match, tuple) and len(match) >= 2:\n                    a = match[0].strip()\n                    b = match[1].strip() if len(match) > 1 else \"\"\n                    content = match[2] if len(match) > 2 else \"\"\n                    if len(a) >= 2 and len(b) >= 2:\n                        self._add_kp(\n                            f\"{a}与{b}的区别：{content}\",\n                            \"comparison\",\n                            line,\n                            f\"对比：{a} vs {b}\"\n                        )\n\n    def _extract_causal(self, text: str, line: int):\n        \"\"\"提取因果/机制\"\"\"\n        for pattern in CAUSAL_PATTERNS:\n            matches = re.findall(pattern, text)\n            for match in matches:\n                if isinstance(match, tuple) and len(match) >= 2:\n                    topic = match[0].strip()\n                    content = match[1].strip()\n                    if len(topic) >= 2 and len(content) >= 10:\n                        self._add_kp(\n                            f\"{topic}的原因/机制：{content}\",\n                            \"causal\",\n                            line,\n                            f\"主题：{topic}\"\n                        )\n\n    def _extract_formulas(self, text: str, line: int):\n        \"\"\"提取公式/定理\"\"\"\n        for pattern in FORMULA_PATTERNS:\n            matches = re.findall(pattern, text)\n            for match in matches:\n                if isinstance(match, tuple) and len(match) >= 2:\n                    name = match[0].strip()\n                    formula = match[1].strip()\n                    if len(name) >= 2 and len(formula) >= 3:\n                        self._add_kp(\n                            f\"{name}：{formula}\",\n                            \"formula\",\n                            line,\n                            f\"名称：{name}\"\n                        )\n\n    def _extract_processes(self, text: str, line: int):\n        \"\"\"提取步骤/流程\"\"\"\n        for pattern in PROCESS_PATTERNS:\n            matches = re.findall(pattern, text)\n            for match in matches:\n                if isinstance(match, tuple) and len(match) >= 2:\n                    topic = match[0].strip()\n                    content = match[1].strip()\n                    if len(topic) >= 2 and len(content) >= 10:\n                        self._add_kp(\n                            f\"{topic}的步骤：{content}\",\n                            \"process\",\n                            line,\n                            f\"主题：{topic}\"\n                        )\n\n    def _extract_timelines(self, text: str, line: int):\n        \"\"\"提取时间线\"\"\"\n        for pattern in TIMELINE_PATTERNS:\n            matches = re.findall(pattern, text)\n            for match in matches:\n                if isinstance(match, tuple) and len(match) >= 2:\n                    year = match[0].strip()\n                    person = match[1].strip()\n                    achievement = match[2] if len(match) > 2 else \"\"\n                    if year and person:\n                        self._add_kp(\n                            f\"{year} {person}：{achievement}\",\n                            \"timeline\",\n                            line,\n                            f\"时间：{year}\"\n                        )\n\n\n# ============================================================\n# 卡片生成器\n# ============================================================\n\nclass FlashcardGenerator:\n    \"\"\"将知识点转化为记忆卡片\"\"\"\n\n    # 知识点类型到卡片类型的映射\n    TYPE_MAP = {\n        \"definition\": \"concept\",\n        \"list\": \"list\",\n        \"comparison\": \"comparison\",\n        \"causal\": \"causal\",\n        \"formula\": \"formula\",\n        \"process\": \"process\",\n        \"timeline\": \"timeline\",\n    }\n\n    # 卡片类型中文名\n    TYPE_NAMES = {\n        \"concept\": \"概念定义\",\n        \"causal\": \"因果关系\",\n        \"comparison\": \"对比辨析\",\n        \"formula\": \"公式定理\",\n        \"process\": \"步骤流程\",\n        \"list\": \"列举\",\n        \"timeline\": \"时间线\",\n        \"cloze\": \"填空\",\n    }\n\n    def __init__(self, knowledge_points: List[KnowledgePoint], tags: List[str] = None,\n                 max_cards: int = 50):\n        self.kps = knowledge_points\n        self.tags = tags or []\n        self.max_cards = max_cards\n        self.cards: List[Flashcard] = []\n\n    def generate(self) -> List[Flashcard]:\n        \"\"\"生成卡片\"\"\"\n        for i, kp in enumerate(self.kps[:self.max_cards]):\n            card = self._generate_card(kp, i + 1)\n            if card:\n                self.cards.append(card)\n        return self.cards\n\n    def _generate_card(self, kp: KnowledgePoint, card_id: int) -> Optional[Flashcard]:\n        \"\"\"根据知识点生成单张卡片\"\"\"\n        card_type = self.TYPE_MAP.get(kp.kp_type, \"concept\")\n\n        # 根据类型生成不同的正面问题和背面答案\n        if kp.kp_type == \"definition\":\n            front, back = self._gen_definition_card(kp)\n        elif kp.kp_type == \"list\":\n            front, back = self._gen_list_card(kp)\n        elif kp.kp_type == \"comparison\":\n            front, back = self._gen_comparison_card(kp)\n        elif kp.kp_type == \"causal\":\n            front, back = self._gen_causal_card(kp)\n        elif kp.kp_type == \"formula\":\n            front, back = self._gen_formula_card(kp)\n        elif kp.kp_type == \"process\":\n            front, back = self._gen_process_card(kp)\n        elif kp.kp_type == \"timeline\":\n            front, back = self._gen_timeline_card(kp)\n        else:\n            front = f\"关于以下内容，你能回忆起什么？\\n{kp.text[:50]}...\"\n            back = kp.text\n\n        if not front or not back:\n            return None\n\n        # 推断难度\n        difficulty = self._infer_difficulty(kp)\n\n        return Flashcard(\n            id=card_id,\n            card_type=card_type,\n            front=front,\n            back=back,\n            tags=self.tags + [card_type, difficulty],\n            difficulty=difficulty,\n            source=f\"第{kp.source_line}行\",\n            confidence=0.6,  # 模式匹配的基础置信度\n        )\n\n    def _gen_definition_card(self, kp: KnowledgePoint) -> Tuple[str, str]:\n        \"\"\"生成定义型卡片\"\"\"\n        # 从 text 中提取术语和定义\n        match = re.match(r'(.{2,50}?)[：:]\\s*(.+)', kp.text)\n        if match:\n            term = match.group(1).strip()\n            definition = match.group(2).strip()\n            front = f\"什么是{term}？\"\n            back = f\"**{term}**：{definition}\\n\\n*出自原文第{kp.source_line}行*\"\n            return front, back\n        return f\"以下内容的定义是什么？\\n{kp.text[:80]}\", kp.text\n\n    def _gen_list_card(self, kp: KnowledgePoint) -> Tuple[str, str]:\n        \"\"\"生成列举型卡片\"\"\"\n        match = re.match(r'(.{2,50}?)[：:]\\s*(.+)', kp.text)\n        if match:\n            topic = match.group(1).strip()\n            content = match.group(2).strip()\n            front = f\"{topic}有哪些？\"\n            # 将内容分点\n            items = re.split(r'[；;。\\n]', content)\n            items = [f\"- {item.strip()}\" for item in items if item.strip()]\n            back = f\"**{topic}**：\\n\\n\" + \"\\n\".join(items) if items else content\n            return front, back\n        return f\"以下内容包括哪些要点？\", kp.text\n\n    def _gen_comparison_card(self, kp: KnowledgePoint) -> Tuple[str, str]:\n        \"\"\"生成对比型卡片\"\"\"\n        match = re.match(r'(.{2,30}?)与(.{2,30}?)的区别[：:]\\s*(.+)', kp.text)\n        if match:\n            a = match.group(1).strip()\n            b = match.group(2).strip()\n            content = match.group(3).strip()\n            front = f\"{a}和{b}的区别是什么？\"\n            back = f\"**{a} vs {b}**：\\n\\n{content}\"\n            return front, back\n        return f\"以下两者的区别是什么？\\n{kp.text[:80]}\", kp.text\n\n    def _gen_causal_card(self, kp: KnowledgePoint) -> Tuple[str, str]:\n        \"\"\"生成因果型卡片\"\"\"\n        match = re.match(r'(.{2,50}?)的原因[/／]机制[：:]\\s*(.+)', kp.text)\n        if match:\n            topic = match.group(1).strip()\n            content = match.group(2).strip()\n            front = f\"{topic}的原因/机制是什么？\"\n            back = f\"**{topic}的原因/机制**：\\n\\n{content}\"\n            return front, back\n        return f\"以下内容的原因是什么？\", kp.text\n\n    def _gen_formula_card(self, kp: KnowledgePoint) -> Tuple[str, str]:\n        \"\"\"生成公式型卡片\"\"\"\n        match = re.match(r'(.{2,50}?)[：:]\\s*(.+)', kp.text)\n        if match:\n            name = match.group(1).strip()\n            formula = match.group(2).strip()\n            front = f\"{name}的公式/内容是什么？\"\n            back = f\"**{name}**：\\n\\n`{formula}`\"\n            return front, back\n        return f\"以下公式是什么？\", kp.text\n\n    def _gen_process_card(self, kp: KnowledgePoint) -> Tuple[str, str]:\n        \"\"\"生成步骤型卡片\"\"\"\n        match = re.match(r'(.{2,50}?)的步骤[：:]\\s*(.+)', kp.text)\n        if match:\n            topic = match.group(1).strip()\n            content = match.group(2).strip()\n            front = f\"{topic}的步骤/过程是什么？\"\n            back = f\"**{topic}的步骤**：\\n\\n{content}\"\n            return front, back\n        return f\"以下内容的步骤是什么？\", kp.text\n\n    def _gen_timeline_card(self, kp: KnowledgePoint) -> Tuple[str, str]:\n        \"\"\"生成时间线卡片\"\"\"\n        front = f\"以下事件发生在什么时间？涉及谁？\\n{kp.text[:60]}...\"\n        back = kp.text\n        return front, back\n\n    @staticmethod\n    def _infer_difficulty(kp: KnowledgePoint) -> str:\n        \"\"\"推断知识点难度\"\"\"\n        text = kp.text\n        # 包含\"区别\"\"对比\"\"机制\"等词的通常较难\n        if any(kw in text for kw in [\"区别\", \"对比\", \"机制\", \"机理\", \"推导\", \"证明\", \"综合\"]):\n            return \"advanced\"\n        # 包含\"高频\"\"考点\"\"重点\"的标记为高频\n        if any(kw in text for kw in [\"高频\", \"考点\", \"重点\", \"必考\", \"常考\"]):\n            return \"high_frequency\"\n        return \"basic\"\n\n\n# ============================================================\n# 输出格式化\n# ============================================================\n\ndef format_text(cards: List[Flashcard], stats: dict) -> str:\n    \"\"\"格式化为文本输出\"\"\"\n    lines = []\n    lines.append(\"=\" * 60)\n    lines.append(\"记忆卡片生成结果\")\n    lines.append(\"=\" * 60)\n    lines.append(\"\")\n\n    for card in cards:\n        type_name = FlashcardGenerator.TYPE_NAMES.get(card.card_type, card.card_type)\n        lines.append(f\"### 卡片 {card.id}：[{type_name}]\")\n        lines.append(\"\")\n        lines.append(\"【正面（问题）】\")\n        lines.append(f\"  {card.front}\")\n        lines.append(\"\")\n        lines.append(\"【背面（答案）】\")\n        for back_line in card.back.split('\\n'):\n            lines.append(f\"  {back_line}\")\n        lines.append(\"\")\n        lines.append(f\"【标签】{' '.join(card.tags)}\")\n        lines.append(f\"【难度】{card.difficulty} | 【来源】{card.source} | 【置信度】{card.confidence}\")\n        lines.append(\"\")\n        lines.append(\"-\" * 40)\n        lines.append(\"\")\n\n    # 统计\n    lines.append(\"📊 卡片统计\")\n    lines.append(f\"  总卡片数：{stats['total']}\")\n    lines.append(f\"  类型分布：{', '.join(f'{k} {v}' for k, v in stats['type_dist'].items())}\")\n    lines.append(f\"  难度分布：{', '.join(f'{k} {v}' for k, v in stats['difficulty_dist'].items())}\")\n    lines.append(\"\")\n    lines.append(\"⚠ 注意：以上为模式匹配初步生成的卡片，需经 AI 语义审核和优化后使用。\")\n    lines.append(\"=\" * 60)\n\n    return \"\\n\".join(lines)\n\n\ndef format_anki_csv(cards: List[Flashcard]) -> str:\n    \"\"\"格式化为 Anki 兼容 CSV\"\"\"\n    output = io.StringIO()\n    writer = csv.writer(output)\n    writer.writerow([\"正面\", \"背面\", \"标签\"])\n\n    for card in cards:\n        # 将背面的换行转为 HTML <br>\n        back_html = card.back.replace('\\n', '<br>')\n        # 加粗转换\n        back_html = re.sub(r'\\*\\*(.+?)\\*\\*', r'<b>\\1</b>', back_html)\n        # 标签用 :: 分隔（Anki 层级标签）\n        tags = '::'.join(card.tags) if card.tags else ''\n        writer.writerow([card.front, back_html, tags])\n\n    return output.getvalue()\n\n\ndef format_json(cards: List[Flashcard], stats: dict) -> str:\n    \"\"\"格式化为 JSON\"\"\"\n    data = {\n        \"stats\": stats,\n        \"cards\": [\n            {\n                \"id\": c.id,\n                \"type\": c.card_type,\n                \"type_name\": FlashcardGenerator.TYPE_NAMES.get(c.card_type, c.card_type),\n                \"front\": c.front,\n                \"back\": c.back,\n                \"tags\": c.tags,\n                \"difficulty\": c.difficulty,\n                \"source\": c.source,\n                \"confidence\": c.confidence,\n            }\n            for c in cards\n        ],\n        \"note\": \"以上为模式匹配初步生成的卡片，需经 AI 语义审核和优化后使用。\",\n    }\n    return json.dumps(data, ensure_ascii=False, indent=2)\n\n\ndef compute_stats(cards: List[Flashcard]) -> dict:\n    \"\"\"计算卡片统计\"\"\"\n    type_dist = defaultdict(int)\n    difficulty_dist = defaultdict(int)\n    for c in cards:\n        type_name = FlashcardGenerator.TYPE_NAMES.get(c.card_type, c.card_type)\n        type_dist[type_name] += 1\n        difficulty_dist[c.difficulty] += 1\n    return {\n        \"total\": len(cards),\n        \"type_dist\": dict(type_dist),\n        \"difficulty_dist\": dict(difficulty_dist),\n    }\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"记忆卡片生成工具 - 从学习文本中提取知识点并生成记忆卡片\"\n    )\n    parser.add_argument(\"--input\", \"-i\", help=\"输入文本文件路径（默认从 stdin 读取）\")\n    parser.add_argument(\"--format\", \"-f\", choices=[\"text\", \"anki\", \"json\"], default=\"text\",\n                        help=\"输出格式（默认 text）\")\n    parser.add_argument(\"--max-cards\", \"-m\", type=int, default=50,\n                        help=\"最大卡片数量（默认 50）\")\n    parser.add_argument(\"--tags\", \"-t\", help=\"卡片标签，用逗号分隔（如：生物学,细胞,基础）\")\n    parser.add_argument(\"--output\", \"-o\", help=\"输出文件路径（默认输出到 stdout）\")\n    args = parser.parse_args()\n\n    # 读取输入\n    if args.input:\n        try:\n            with open(args.input, \"r\", encoding=\"utf-8\") as f:\n                text = f.read()\n        except FileNotFoundError:\n            print(f\"错误：文件 '{args.input}' 不存在\", file=sys.stderr)\n            sys.exit(1)\n        except Exception as e:\n            print(f\"错误：读取文件失败 - {e}\", file=sys.stderr)\n            sys.exit(1)\n    else:\n        text = sys.stdin.read()\n\n    if not text.strip():\n        print(\"错误：输入为空，请提供学习文本\", file=sys.stderr)\n        print(\"\\n用法示例：\", file=sys.stderr)\n        print(\"  python3 generate_flashcards.py --input notes.txt --format anki\", file=sys.stderr)\n        print(\"  cat notes.txt | python3 generate_flashcards.py --max-cards 30\", file=sys.stderr)\n        sys.exit(1)\n\n    # 解析标签\n    tags = [t.strip() for t in args.tags.split(',')] if args.tags else []\n\n    # 提取知识点\n    text_parser = TextParser(text)\n    knowledge_points = text_parser.parse()\n\n    if not knowledge_points:\n        print(\"提示：未能从文本中自动提取到知识点。\", file=sys.stderr)\n        print(\"建议：提供包含明确定义、列表、对比等结构的学习文本，或由 AI 手动生成卡片。\", file=sys.stderr)\n        sys.exit(0)\n\n    # 生成卡片\n    generator = FlashcardGenerator(knowledge_points, tags=tags, max_cards=args.max_cards)\n    cards = generator.generate()\n\n    if not cards:\n        print(\"错误：未能生成卡片\", file=sys.stderr)\n        sys.exit(1)\n\n    # 统计\n    stats = compute_stats(cards)\n\n    # 输出\n    if args.format == \"anki\":\n        output = format_anki_csv(cards)\n    elif args.format == \"json\":\n        output = format_json(cards, stats)\n    else:\n        output = format_text(cards, stats)\n\n    if args.output:\n        try:\n            with open(args.output, \"w\", encoding=\"utf-8\") as f:\n                f.write(output)\n            print(f\"结果已写入: {args.output}（{len(cards)} 张卡片）\", file=sys.stderr)\n        except Exception as e:\n            print(f\"错误：写入文件失败 - {e}\", file=sys.stderr)\n            sys.exit(1)\n    else:\n        print(output)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-flashcards.csv": "正面,背面,标签\n\"什么是酶？\",\"<b>酶</b>是指活细胞产生的具有催化作用的有机物，其中绝大多数酶是蛋白质，少数酶是RNA（核酶）。<br><br><b>关键特征</b>：<br>- 产生场所：活细胞<br>- 功能：催化作用<br>- 化学本质：绝大多数是蛋白质，少数是RNA<br>- 作用机理：降低化学反应的活化能\",\"生物学::细胞代谢::基础\"\n\"酶的特性有哪些？\",\"<b>酶的特性</b>：<br><br>1. <b>高效性</b>：酶的催化效率大约是无机催化剂的10^7～10^13倍<br>2. <b>专一性</b>：一种酶只能催化一种或一类化学反应<br>3. <b>作用条件较温和</b>：酶所催化的化学反应一般在比较温和的条件下进行<br><br><b>记忆口诀</b>：高效专一条件温\",\"生物学::细胞代谢::基础\"\n\"酶的作用机理是什么？\",\"<b>酶的作用机理</b>：降低化学反应的活化能。<br><br><b>活化能</b>：分子从常态转变为容易发生化学反应的活跃状态所需要的能量。<br><br>酶通过降低活化能，使反应在温和条件下快速进行。酶不能为反应提供能量，也不能改变反应的平衡点，只能加快反应速率。\",\"生物学::细胞代谢::进阶\"\n\"影响酶活性的因素有哪些？\",\"<b>影响酶活性的因素</b>：<br><br>1. <b>温度</b>：<br>   - 最适温度下酶活性最高<br>   - 温度过高→酶空间结构破坏→永久失活<br>   - 低温→酶活性降低→不失活→温度恢复后活性恢复<br><br>2. <b>pH值</b>：<br>   - 最适pH下酶活性最高<br>   - pH过高或过低→酶空间结构破坏→永久失活<br><br><b>考点</b>：低温和高温对酶的影响不同（低温可逆，高温不可逆）\",\"生物学::细胞代谢::高频考点\"\n\"什么是ATP？\",\"<b>ATP（三磷酸腺苷）</b>是指细胞内的一种高能磷酸化合物，是细胞生命活动的<b>直接能源物质</b>。<br><br><b>结构简式</b>：A-P～P～P<br>- A：腺苷（腺嘌呤+核糖）<br>- P：磷酸基团<br>- ～：高能磷酸键（储存大量能量）<br><br><b>功能</b>：为肌肉收缩、神经传导、物质运输、细胞分裂等生命活动直接提供能量\",\"生物学::细胞代谢::基础\"\n\"ATP与ADP如何相互转化？\",\"<b>ATP与ADP的相互转化</b>时刻不停地发生并处于动态平衡之中。<br><br><b>ATP水解</b>（释放能量）：<br>ATP → ADP + Pi + 能量<br>能量用于：各项生命活动<br><br><b>ATP合成</b>（储存能量）：<br>ADP + Pi + 能量 → ATP<br>能量来源：呼吸作用（动植物）、光合作用（植物）<br><br><b>考点</b>：ATP和ADP的转化不是可逆反应（物质可逆，能量和酶不可逆）\",\"生物学::细胞代谢::高频考点\"\n\"什么是细胞呼吸？\",\"<b>细胞呼吸</b>是指有机物在细胞内经过一系列的氧化分解，生成二氧化碳或其他产物，释放出能量并生成ATP的过程。<br><br><b>本质</b>：氧化分解有机物，释放能量，合成ATP<br><b>方式</b>：有氧呼吸和无氧呼吸<br><b>意义</b>：为生命活动提供能量，为其他化合物合成提供原料\",\"生物学::细胞呼吸::基础\"\n\"有氧呼吸的过程分为哪几个阶段？\",\"<b>有氧呼吸的三个阶段</b>：<br><br><b>第一阶段</b>：<br>- 场所：细胞质基质<br>- 反应：1分子葡萄糖 → 2分子丙酮酸 + 少量[H] + 少量能量<br><br><b>第二阶段</b>：<br>- 场所：线粒体基质<br>- 反应：丙酮酸 + 水 → CO2 + [H] + 少量能量<br><br><b>第三阶段</b>：<br>- 场所：线粒体内膜<br>- 反应：[H] + O2 → 水 + 大量能量<br><br><b>总反应式</b>：C6H12O6 + 6H2O + 6O2 →(酶) 6CO2 + 12H2O + 能量<br><br><b>记忆口诀</b>：一丙二碳三水，基质基质内膜\",\"生物学::细胞呼吸::高频考点\"\n\"有氧呼吸和无氧呼吸的区别是什么？\",\"<b>有氧呼吸 vs 无氧呼吸</b>：<br><br>| 对比项 | 有氧呼吸 | 无氧呼吸 |<br>|---|---|---|<br>| 需要O2 | 需要 | 不需要 |<br>| 主要场所 | 线粒体 | 细胞质基质 |<br>| 分解产物 | CO2 + H2O | 酒精+CO2 或 乳酸 |<br>| 释放能量 | 大量 | 少量 |<br>| ATP产量 | 约30-32个 | 2个 |<br><br><b>共同点</b>：<br>- 第一阶段完全相同（糖酵解，细胞质基质）<br>- 本质都是氧化分解有机物，释放能量<br><br><b>记忆口诀</b>：有线粒体氧充足，无氧只在基质里，产酒产乳酸，能量只够塞牙缝\",\"生物学::细胞呼吸::对比::高频考点\"\n\"什么是光合作用？\",\"<b>光合作用</b>是指绿色植物通过叶绿体，利用光能，把二氧化碳和水转化成储存能量的有机物（主要是淀粉），并且释放氧气的过程。<br><br><b>总反应式</b>：6CO2 + 6H2O —(光能/叶绿体)→ C6H12O6 + 6O2<br><br><b>关键要素</b>：<br>- 场所：叶绿体<br>- 条件：光能<br>- 原料：CO2 和 H2O<br>- 产物：有机物（糖类）和 O2<br>- 能量转化：光能 → 化学能\",\"生物学::光合作用::基础\"\n\"光合作用的过程分为哪两个阶段？\",\"<b>光合作用的两个阶段</b>：<br><br><b>一、光反应阶段</b>：<br>- 场所：叶绿体类囊体薄膜<br>- 条件：必须有光<br>- 物质变化：水的光解（2H2O → 4[H] + O2）；ATP合成<br>- 能量变化：光能 → ATP中活跃的化学能<br><br><b>二、暗反应阶段（卡尔文循环）</b>：<br>- 场所：叶绿体基质<br>- 条件：有光无光都可（但需光反应提供[H]和ATP）<br>- 物质变化：CO2固定（CO2 + C5 → 2C3）；C3还原（2C3 → (CH2O) + C5）<br>- 能量变化：ATP活跃化学能 → 有机物稳定化学能<br><br><b>联系</b>：光反应为暗反应提供[H]和ATP，暗反应为光反应提供ADP和Pi\",\"生物学::光合作用::高频考点\"\n\"光合作用的发现历程中有哪些关键人物和贡献？\",\"<b>光合作用发现历程</b>：<br><br>| 时间 | 人物 | 贡献 |<br>|---|---|---|<br>| 1771年 | 普利斯特利 | 植物可以更新因蜡烛燃烧或小鼠呼吸而变污浊的空气 |<br>| 1779年 | 英格豪斯 | 实验只有在阳光照射下才能成功，只有绿叶才能更新空气 |<br>| 1864年 | 萨克斯 | 证明光合作用产物除氧气外还有淀粉 |<br>| 1939年 | 鲁宾和卡门 | 利用同位素标记法证明光合作用释放的氧气来自水 |<br>| 1948年 | 卡尔文 | 探明CO2中的碳转化为有机物中碳的途径（卡尔文循环） |<br><br><b>记忆口诀</b>：普更新，英要光，萨淀粉，鲁卡水，卡尔文碳循环\",\"生物学::光合作用::时间线::基础\"\n\"影响光合作用的因素有哪些？\",\"<b>影响光合作用的因素</b>：<br><br>1. <b>光照强度</b>：一定范围内随光照增强而增强，达到光饱和点后不再增加<br>2. <b>CO2浓度</b>：一定范围内随CO2浓度增加而增强<br>3. <b>温度</b>：通过影响酶活性影响光合作用，最适温度时最强<br>4. <b>水分</b>：水是光合作用原料，缺水会导致气孔关闭，CO2吸收减少<br>5. <b>矿质元素</b>：如Mg是叶绿素组成成分，N是酶和ATP的组成成分<br><br><b>考点</b>：光照强度和CO2浓度的补偿点和饱和点\",\"生物学::光合作用::进阶\"\n", "examples/sample-biology-notes.md": "# 细胞的能量供应与利用 — 学习笔记\n\n## 一、酶\n\n### 1.1 酶的定义\n酶是指活细胞产生的具有催化作用的有机物，其中绝大多数酶是蛋白质，少数酶是RNA（核酶）。\n\n### 1.2 酶的特性\n酶的特性包括：高效性、专一性、作用条件较温和。\n\n- 高效性：酶的催化效率大约是无机催化剂的10^7～10^13倍。\n- 专一性：一种酶只能催化一种或一类化学反应。\n- 作用条件较温和：酶所催化的化学反应一般在比较温和的条件下进行。\n\n### 1.3 酶的作用机理\n酶的作用机理是降低化学反应的活化能。分子从常态转变为容易发生化学反应的活跃状态所需要的能量称为活化能。酶通过降低活化能，使反应在温和条件下快速进行。\n\n### 1.4 影响酶活性的因素\n影响酶活性的因素主要有温度和pH值。\n\n- 温度：在最适温度下，酶的活性最高。温度过高会使酶的空间结构遭到破坏，使酶永久失活；低温使酶的活性降低，但不会失活，温度恢复后活性可恢复。\n- pH：在最适pH下，酶的活性最高。pH过高或过低都会使酶的空间结构遭到破坏，使酶永久失活。\n\n## 二、ATP\n\n### 2.1 ATP的定义\nATP（三磷酸腺苷）是指细胞内的一种高能磷酸化合物，是细胞生命活动的直接能源物质。\n\n### 2.2 ATP的结构\nATP的结构简式为A-P～P～P，其中A代表腺苷，P代表磷酸基团，～代表高能磷酸键。ATP分子中大量的能量就储存在高能磷酸键中。\n\n### 2.3 ATP与ADP的相互转化\nATP与ADP的相互转化是时刻不停地发生并且处于动态平衡之中的。\n\n- ATP水解：ATP → ADP + Pi + 能量（释放的能量用于各项生命活动）\n- ATP合成：ADP + Pi + 能量 → ATP（能量来自呼吸作用和光合作用）\n\n### 2.4 ATP的功能\nATP的功能是为细胞的各项生命活动直接提供能量，如肌肉收缩、神经传导、物质运输、细胞分裂、生物发电等。\n\n## 三、细胞呼吸\n\n### 3.1 细胞呼吸的定义\n细胞呼吸是指有机物在细胞内经过一系列的氧化分解，生成二氧化碳或其他产物，释放出能量并生成ATP的过程。\n\n### 3.2 有氧呼吸\n有氧呼吸是指细胞在氧的参与下，通过多种酶的催化作用，把葡萄糖等有机物彻底氧化分解，产生二氧化碳和水，释放能量，生成大量ATP的过程。\n\n有氧呼吸的过程分为三个阶段：\n\n第一阶段：1分子葡萄糖分解成2分子丙酮酸，产生少量的[H]，释放少量能量，场所是细胞质基质。\n\n第二阶段：丙酮酸和水彻底分解成二氧化碳和[H]，释放少量能量，场所是线粒体基质。\n\n第三阶段：前两个阶段产生的[H]与氧结合生成水，释放大量能量，场所是线粒体内膜。\n\n总反应式：C6H12O6 + 6H2O + 6O2 →(酶) 6CO2 + 12H2O + 能量\n\n### 3.3 无氧呼吸\n无氧呼吸是指细胞在无氧条件下，通过多种酶的催化作用，把葡萄糖等有机物不彻底地氧化分解，产生酒精和二氧化碳或乳酸，释放少量能量，生成少量ATP的过程。\n\n无氧呼吸的过程分为两个阶段：\n\n第一阶段：与有氧呼吸第一阶段完全相同，场所是细胞质基质。\n\n第二阶段：丙酮酸在不同酶的催化作用下，分解成酒精和二氧化碳，或者转化成乳酸，场所是细胞质基质。\n\n### 3.4 有氧呼吸和无氧呼吸的区别\n有氧呼吸和无氧呼吸的区别主要体现在以下几个方面：需要氧气、主要场所、分解产物、释放能量多少、ATP产量。\n\n- 有氧呼吸需要氧气，主要场所是线粒体，产物是CO2和H2O，释放大量能量，产生约30-32个ATP。\n- 无氧呼吸不需要氧气，场所是细胞质基质，产物是酒精+CO2或乳酸，释放少量能量，产生2个ATP。\n\n### 3.5 细胞呼吸的意义\n细胞呼吸的意义在于为生物体的各项生命活动提供能量，为体内其他化合物的合成提供原料（如中间产物丙酮酸），维持体温。\n\n## 四、光合作用\n\n### 4.1 光合作用的定义\n光合作用是指绿色植物通过叶绿体，利用光能，把二氧化碳和水转化成储存能量的有机物，并且释放氧气的过程。\n\n### 4.2 光合作用的发现历程\n光合作用的发现经历了以下重要阶段：\n\n1771年，普利斯特利发现植物可以更新因蜡烛燃烧或小鼠呼吸而变污浊的空气。\n1779年，英格豪斯发现普利斯特利的实验只有在阳光照射下才能成功，植物体只有绿叶才能更新污浊的空气。\n1864年，萨克斯证明光合作用的产物除氧气外还有淀粉。\n1939年，鲁宾和卡门利用同位素标记法证明光合作用释放的氧气来自水。\n1948年，卡尔文探明了CO2中的碳在光合作用中转化成有机物中碳的途径（卡尔文循环）。\n\n### 4.3 光合作用的过程\n光合作用的过程分为光反应和暗反应两个阶段。\n\n光反应阶段：\n- 场所：叶绿体类囊体薄膜上\n- 条件：必须有光\n- 物质变化：水的光解（2H2O → 4[H] + O2）；ATP的合成（ADP + Pi + 光能 → ATP）\n- 能量变化：光能 → ATP中活跃的化学能\n\n暗反应阶段（卡尔文循环）：\n- 场所：叶绿体基质中\n- 条件：有光无光都能进行（但需要光反应提供的[H]和ATP）\n- 物质变化：CO2的固定（CO2 + C5 → 2C3）；C3的还原（2C3 → (CH2O) + C5，需要[H]、ATP、酶）\n- 能量变化：ATP中活跃的化学能 → 有机物中稳定的化学能\n\n### 4.4 光合作用的总反应式\n光合作用的总反应式为：6CO2 + 6H2O —(光能/叶绿体)→ C6H12O6 + 6O2\n\n### 4.5 影响光合作用的因素\n影响光合作用的因素包括光照强度、CO2浓度、温度、水分、矿质元素等。\n\n- 光照强度：在一定范围内，光合作用强度随光照强度的增加而增加，达到光饱和点后不再增加。\n- CO2浓度：在一定范围内，光合作用强度随CO2浓度的增加而增加。\n- 温度：温度通过影响酶的活性来影响光合作用，在最适温度时光合作用最强。\n"}, "file_count": 5, "script_lines": 642}, {"name": "git-commit-message-generator", "title": "git-commit-message-generator", "description": "Git 提交信息生成助手。根据 git diff（暂存区/工作区/指定 commit）自动分析代码变更，生成符合 Conventional Commits 规范的提交信息，包含 type、scope、subject、body 和 footer。支持变更类型自动识别（feat/fix/refactor/docs/style/test/chore/ci/perf）、影响范围推断、破坏性变更标记，以及提交信息规范校验。适用于日常开发提交、PR 整理、开源项目贡献等场景。", "category": "开发提效", "icon": "🔧", "color": "#8b5cf6", "skill_md": "---\nname: git-commit-message-generator\ndescription: 'Git 提交信息生成助手。根据 git diff（暂存区/工作区/指定 commit）自动分析代码变更，生成符合 Conventional Commits 规范的提交信息，包含 type、scope、subject、body 和 footer。支持变更类型自动识别（feat/fix/refactor/docs/style/test/chore/ci/perf）、影响范围推断、破坏性变更标记，以及提交信息规范校验。适用于日常开发提交、PR 整理、开源项目贡献等场景。'\n---\n\n# Git 提交信息生成助手\n\n## 一、技能定位\n\n本技能用于**根据代码变更自动生成高质量、规范化的 Git 提交信息**。核心价值：\n\n- 消除「写提交信息比写代码还难」的痛点\n- 确保提交信息符合 Conventional Commits 规范，便于自动化生成 CHANGELOG 和语义化版本\n- 从 diff 中提取关键变更点，避免提交信息过于笼统（如「update」「fix bug」）\n- 支持批量整理（如将多个零散提交整理为规范的 PR 提交信息）\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户在 Git 仓库中做了修改，说「帮我写个 commit message」「生成提交信息」「这次改动怎么写提交说明」\n2. 用户提供了 git diff 输出，要求生成提交信息\n3. 用户说「帮我整理一下这次 PR 的提交记录」「把这些提交合并成一个规范的提交信息」\n4. 用户的提交信息不规范，要求检查或修正\n5. 用户说「按照 Conventional Commits 规范生成提交信息」\n6. 用户需要生成 CHANGELOG 或语义化版本，需要规范的提交历史\n\n## 三、输入要求\n\n| 输入项 | 是否必需 | 说明 |\n|---|---|---|\n| Git 仓库或 diff 内容 | 必需 | 当前目录为 Git 仓库，或用户直接提供 diff 文本 |\n| 变更范围（scope） | 可选 | 如未提供，从变更文件路径推断 |\n| 提交类型（type） | 可选 | 如未提供，从变更内容自动识别 |\n| 关联 issue/PR | 可选 | 用于 footer 中的引用（如 `Closes #123`） |\n| 破坏性变更说明 | 可选 | 如有 API 变更、配置变更等，需在 footer 中标注 `BREAKING CHANGE` |\n\n## 四、Conventional Commits 规范\n\n提交信息格式：\n\n```\n<type>(<scope>): <subject>\n\n<body>\n\n<footer>\n```\n\n### 4.1 type（提交类型）\n\n| type | 说明 | 典型变更 |\n|---|---|---|\n| `feat` | 新功能 | 新增 API、页面、功能模块 |\n| `fix` | Bug 修复 | 修复崩溃、逻辑错误、边界问题 |\n| `docs` | 文档变更 | README、注释、文档更新 |\n| `style` | 代码格式（不影响功能） | 空格、分号、格式化、lint 修复 |\n| `refactor` | 重构（既不修复 bug 也不添加功能） | 重命名、提取函数、结构调整 |\n| `perf` | 性能优化 | 算法优化、缓存、减少查询 |\n| `test` | 测试相关 | 新增测试、修改测试、测试框架 |\n| `build` | 构建系统或外部依赖 | npm/pip 依赖、webpack、构建脚本 |\n| `ci` | CI/CD 配置 | GitHub Actions、Jenkins、Dockerfile |\n| `chore` | 杂项（不修改 src 或 test） | 配置文件、.gitignore、工具链 |\n| `revert` | 回滚提交 | `revert: feat(xxx): ...` |\n\n### 4.2 scope（影响范围）\n\n- 通常是模块名、组件名或功能区域\n- 从变更文件路径推断：如 `src/auth/` → `auth`，`components/Button/` → `button`\n- 多模块变更时用最主要的模块，或省略 scope\n- 示例：`feat(auth): 添加微信登录`、`fix(api): 修复用户接口空指针`\n\n### 4.3 subject（简短描述）\n\n- 祈使句开头（「添加」「修复」「重构」而非「添加了」「修复了」）\n- 不超过 50 个字符（中文约 25 字）\n- 句末不加句号\n- 具体而非笼统：用「修复登录页验证码不刷新」而非「fix bug」\n\n### 4.4 body（详细描述，可选）\n\n- 说明「为什么」做这个变更，而非「怎么做」的\n- 每行不超过 72 字符\n- 与 subject 之间空一行\n- 可包含背景、方案对比、影响范围\n\n### 4.5 footer（页脚，可选）\n\n- `BREAKING CHANGE: <描述>` — 破坏性变更\n- `Closes #123` / `Fixes #456` — 关联 issue\n- `Co-authored-by: 名字 <邮箱>` — 共同作者\n- 与 body 之间空一行\n\n## 五、操作步骤\n\n### 步骤 1：获取代码变更\n\n根据用户输入选择获取方式：\n\n**方式 A：当前目录为 Git 仓库**\n```bash\n# 查看暂存区变更（推荐，因为 commit 的是暂存区内容）\ngit diff --cached\n\n# 如果暂存区为空，查看工作区变更\ngit diff\n\n# 查看最近一次提交的变更\ngit show HEAD\n```\n\n**方式 B：用户直接提供 diff 文本**\n- 直接使用用户提供的内容\n\n**方式 C：用户指定 commit 或分支**\n```bash\ngit diff <base>..<head>\ngit show <commit-hash>\n```\n\n### 步骤 2：使用辅助脚本分析 diff（可选但推荐）\n\n对于较大的 diff，使用 `scripts/analyze_diff.py` 进行结构化分析：\n\n```bash\n# 分析当前暂存区\ngit diff --cached | python3 scripts/analyze_diff.py\n\n# 分析指定 diff 文件\npython3 scripts/analyze_diff.py --input changes.diff\n\n# 输出 JSON 格式（供后续处理）\npython3 scripts/analyze_diff.py --input changes.diff --format json\n```\n\n脚本会输出：\n- 变更文件列表（新增/修改/删除）\n- 每个文件的变更统计（增删行数）\n- 推断的变更类型（feat/fix/refactor 等）\n- 推断的影响范围（scope）\n- 关键变更点摘要（从新增/修改的代码行中提取）\n- 是否包含破坏性变更的线索\n\n### 步骤 3：AI 语义分析与提交信息生成\n\n基于 diff 内容和脚本分析结果，进行以下判断：\n\n#### 3.1 确定 type\n- 新增函数/类/API/页面/功能 → `feat`\n- 修改现有逻辑修复错误 → `fix`\n- 仅修改文档/注释 → `docs`\n- 仅修改格式（空格、分号、import 排序）→ `style`\n- 重构代码结构但不改变行为 → `refactor`\n- 优化性能（算法、缓存、查询）→ `perf`\n- 新增/修改测试 → `test`\n- 修改构建配置/依赖 → `build`\n- 修改 CI 配置 → `ci`\n- 杂项配置 → `chore`\n\n**混合变更处理**：如果一次提交包含多种类型，选择最主要的类型；如果变更过于分散，建议用户拆分为多个提交。\n\n#### 3.2 确定 scope\n- 从变更最集中的目录/模块推断\n- 前端项目：组件名、页面名\n- 后端项目：模块名、服务名\n- 全栈项目：`api`、`ui`、`db`、`config` 等\n- 如果变更跨多个不相关模块，可省略 scope\n\n#### 3.3 编写 subject\n- 用一句话概括「这次提交做了什么」\n- 祈使句，具体，不超过 50 字符\n- 避免：「update」「fix」「changes」「misc」等无信息词汇\n- 推荐：「添加用户头像上传功能」「修复订单列表分页越界」\n\n#### 3.4 编写 body（如需要）\n- 变更较复杂、有背景故事、有设计决策时才需要\n- 说明「为什么」而非「怎么做」\n- 可列出关键变更点（用 `-` 列表）\n\n#### 3.5 编写 footer（如需要）\n- 检测到 API 变更、配置变更、数据库迁移 → 添加 `BREAKING CHANGE`\n- 用户提到关联 issue → 添加 `Closes #xxx`\n- 破坏性变更描述需说明变更内容和迁移方案\n\n### 步骤 4：质量自检\n\n生成提交信息后，逐项检查：\n\n- [ ] type 是否在规范列表中？\n- [ ] subject 是否为祈使句？是否具体（而非「update code」）？\n- [ ] subject 长度是否 ≤ 50 字符？\n- [ ] scope 是否准确反映了变更模块？\n- [ ] body 每行是否 ≤ 72 字符？\n- [ ] 是否有破坏性变更未标注？\n- [ ] 提交信息是否与实际 diff 内容一致？（禁止编造不存在的变更）\n- [ ] 是否包含了不该出现在提交信息中的敏感信息（密码、token、内部链接）？\n\n### 步骤 5：输出与交付\n\n1. 输出生成的提交信息（代码块格式，方便复制）\n2. 简要说明选择该 type/scope 的理由\n3. 如检测到问题（如变更过于分散建议拆分、有未提交的敏感信息），主动提醒\n4. 如用户需要，可直接执行 `git commit` 命令（需用户确认）\n\n## 六、输出格式\n\n### 标准提交信息\n\n```\nfeat(auth): 添加微信扫码登录功能\n\n- 新增 WeChatAuthService 处理微信 OAuth 流程\n- 登录页添加扫码登录入口，支持二维码轮询状态\n- 用户表新增 wechat_openid 字段，兼容已有账号绑定\n\nCloses #42\n```\n\n### 破坏性变更提交信息\n\n```\nrefactor(api): 重构用户接口返回格式\n\n将 /api/users 接口返回从数组改为分页对象，\n包含 total、page、pageSize 和 data 字段。\n\nBREAKING CHANGE: /api/users 接口返回格式变更，\n前端需适配新的分页结构。旧格式将在 v2.0 移除。\n```\n\n### 简单提交信息（无需 body）\n\n```\nfix(order): 修复订单金额计算精度丢失\n```\n\n## 七、常见场景处理\n\n### 场景 1：变更过于分散\n如果 diff 涉及 5 个以上不相关模块，提醒用户：\n> 本次变更涉及多个不相关模块（auth、order、payment、docs），建议拆分为多个提交：\n> 1. `feat(auth): ...`\n> 2. `fix(order): ...`\n> 3. `docs: ...`\n\n### 场景 2：仅格式化变更\n如果 diff 全是空格、换行、import 排序：\n```\nstyle: 统一代码格式（prettier 自动格式化）\n```\n\n### 场景 3：依赖升级\n```\nbuild(deps): 升级 react 至 18.2.0\n\n- 升级 react 和 react-dom 至 18.2.0\n- 适配 createRoot 新 API\n- 移除已废弃的 ReactDOM.render 调用\n```\n\n### 场景 4：回滚提交\n```\nrevert: feat(auth): 添加微信扫码登录功能\n\n该功能导致登录页白屏，临时回滚。\n此提交回滚了 abc1234。\n```\n\n### 场景 5：修复线上紧急 bug\n```\nfix(payment): 修复支付回调重复通知导致的订单状态错误\n\n支付回调在网络重试时会重复触发，导致订单状态\n从「已支付」回退为「处理中」。添加幂等校验，\n已支付订单忽略重复回调。\n\nCloses #156\n```\n\n## 八、注意事项\n\n1. **不编造变更**：提交信息必须严格基于实际 diff 内容，不得添加不存在的功能或修复。\n2. **敏感信息检查**：如果 diff 中包含密码、API key、token 等敏感信息，提醒用户不要提交，并建议使用环境变量或 secrets 管理。\n3. **中文/英文一致性**：根据项目已有提交历史的语言风格选择语言；新项目默认与用户输入语言一致。\n4. **大文件检查**：如果 diff 中包含大文件（>10MB）或二进制文件，提醒用户考虑使用 Git LFS 或不要提交。\n5. **提交粒度建议**：如果一次变更包含多个独立功能，建议拆分为多个提交，便于 code review 和回滚。\n6. **scope 命名一致性**：参考项目已有提交中使用的 scope 命名，保持一致。\n7. **不自动执行 commit**：生成提交信息后，需用户确认后才可执行 `git commit`，不得自动提交。\n\n## 九、文件结构\n\n```\ngit-commit-message-generator/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── commit-message-template.md        # 提交信息模板（含各 type 示例）\n├── scripts/\n│   └── analyze_diff.py                   # Git diff 分析脚本（变更统计、类型推断、关键变更提取）\n└── examples/\n    ├── sample-feature.diff               # 示例：新功能 diff\n    ├── sample-bugfix.diff                # 示例：bug 修复 diff\n    └── sample-commit-messages.md         # 示例：生成的提交信息\n```\n\n## 十、使用示例\n\n### 示例 1：日常开发提交\n**用户**：（在 Git 仓库中）「帮我写个 commit message」\n**处理**：执行 `git diff --cached` 获取变更 → 分析 diff → 生成提交信息 → 输出。\n\n### 示例 2：提供 diff 文本\n**用户**：粘贴一段 diff，说「根据这个生成提交信息」\n**处理**：直接分析用户提供的 diff → 生成提交信息。\n\n### 示例 3：PR 提交整理\n**用户**：「帮我把这个 PR 的 10 个提交整理成一个规范的提交信息」\n**处理**：执行 `git log <base>..<head>` 获取所有提交 → 合并分析 → 生成一个汇总的提交信息。\n\n### 示例 4：提交信息校验\n**用户**：「帮我看看这个提交信息合不合规：`update stuff`」\n**处理**：检查 type 是否缺失、subject 是否笼统 → 给出修正建议和改进后的提交信息。\n", "files": {"SKILL.md": "---\nname: git-commit-message-generator\ndescription: 'Git 提交信息生成助手。根据 git diff（暂存区/工作区/指定 commit）自动分析代码变更，生成符合 Conventional Commits 规范的提交信息，包含 type、scope、subject、body 和 footer。支持变更类型自动识别（feat/fix/refactor/docs/style/test/chore/ci/perf）、影响范围推断、破坏性变更标记，以及提交信息规范校验。适用于日常开发提交、PR 整理、开源项目贡献等场景。'\n---\n\n# Git 提交信息生成助手\n\n## 一、技能定位\n\n本技能用于**根据代码变更自动生成高质量、规范化的 Git 提交信息**。核心价值：\n\n- 消除「写提交信息比写代码还难」的痛点\n- 确保提交信息符合 Conventional Commits 规范，便于自动化生成 CHANGELOG 和语义化版本\n- 从 diff 中提取关键变更点，避免提交信息过于笼统（如「update」「fix bug」）\n- 支持批量整理（如将多个零散提交整理为规范的 PR 提交信息）\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户在 Git 仓库中做了修改，说「帮我写个 commit message」「生成提交信息」「这次改动怎么写提交说明」\n2. 用户提供了 git diff 输出，要求生成提交信息\n3. 用户说「帮我整理一下这次 PR 的提交记录」「把这些提交合并成一个规范的提交信息」\n4. 用户的提交信息不规范，要求检查或修正\n5. 用户说「按照 Conventional Commits 规范生成提交信息」\n6. 用户需要生成 CHANGELOG 或语义化版本，需要规范的提交历史\n\n## 三、输入要求\n\n| 输入项 | 是否必需 | 说明 |\n|---|---|---|\n| Git 仓库或 diff 内容 | 必需 | 当前目录为 Git 仓库，或用户直接提供 diff 文本 |\n| 变更范围（scope） | 可选 | 如未提供，从变更文件路径推断 |\n| 提交类型（type） | 可选 | 如未提供，从变更内容自动识别 |\n| 关联 issue/PR | 可选 | 用于 footer 中的引用（如 `Closes #123`） |\n| 破坏性变更说明 | 可选 | 如有 API 变更、配置变更等，需在 footer 中标注 `BREAKING CHANGE` |\n\n## 四、Conventional Commits 规范\n\n提交信息格式：\n\n```\n<type>(<scope>): <subject>\n\n<body>\n\n<footer>\n```\n\n### 4.1 type（提交类型）\n\n| type | 说明 | 典型变更 |\n|---|---|---|\n| `feat` | 新功能 | 新增 API、页面、功能模块 |\n| `fix` | Bug 修复 | 修复崩溃、逻辑错误、边界问题 |\n| `docs` | 文档变更 | README、注释、文档更新 |\n| `style` | 代码格式（不影响功能） | 空格、分号、格式化、lint 修复 |\n| `refactor` | 重构（既不修复 bug 也不添加功能） | 重命名、提取函数、结构调整 |\n| `perf` | 性能优化 | 算法优化、缓存、减少查询 |\n| `test` | 测试相关 | 新增测试、修改测试、测试框架 |\n| `build` | 构建系统或外部依赖 | npm/pip 依赖、webpack、构建脚本 |\n| `ci` | CI/CD 配置 | GitHub Actions、Jenkins、Dockerfile |\n| `chore` | 杂项（不修改 src 或 test） | 配置文件、.gitignore、工具链 |\n| `revert` | 回滚提交 | `revert: feat(xxx): ...` |\n\n### 4.2 scope（影响范围）\n\n- 通常是模块名、组件名或功能区域\n- 从变更文件路径推断：如 `src/auth/` → `auth`，`components/Button/` → `button`\n- 多模块变更时用最主要的模块，或省略 scope\n- 示例：`feat(auth): 添加微信登录`、`fix(api): 修复用户接口空指针`\n\n### 4.3 subject（简短描述）\n\n- 祈使句开头（「添加」「修复」「重构」而非「添加了」「修复了」）\n- 不超过 50 个字符（中文约 25 字）\n- 句末不加句号\n- 具体而非笼统：用「修复登录页验证码不刷新」而非「fix bug」\n\n### 4.4 body（详细描述，可选）\n\n- 说明「为什么」做这个变更，而非「怎么做」的\n- 每行不超过 72 字符\n- 与 subject 之间空一行\n- 可包含背景、方案对比、影响范围\n\n### 4.5 footer（页脚，可选）\n\n- `BREAKING CHANGE: <描述>` — 破坏性变更\n- `Closes #123` / `Fixes #456` — 关联 issue\n- `Co-authored-by: 名字 <邮箱>` — 共同作者\n- 与 body 之间空一行\n\n## 五、操作步骤\n\n### 步骤 1：获取代码变更\n\n根据用户输入选择获取方式：\n\n**方式 A：当前目录为 Git 仓库**\n```bash\n# 查看暂存区变更（推荐，因为 commit 的是暂存区内容）\ngit diff --cached\n\n# 如果暂存区为空，查看工作区变更\ngit diff\n\n# 查看最近一次提交的变更\ngit show HEAD\n```\n\n**方式 B：用户直接提供 diff 文本**\n- 直接使用用户提供的内容\n\n**方式 C：用户指定 commit 或分支**\n```bash\ngit diff <base>..<head>\ngit show <commit-hash>\n```\n\n### 步骤 2：使用辅助脚本分析 diff（可选但推荐）\n\n对于较大的 diff，使用 `scripts/analyze_diff.py` 进行结构化分析：\n\n```bash\n# 分析当前暂存区\ngit diff --cached | python3 scripts/analyze_diff.py\n\n# 分析指定 diff 文件\npython3 scripts/analyze_diff.py --input changes.diff\n\n# 输出 JSON 格式（供后续处理）\npython3 scripts/analyze_diff.py --input changes.diff --format json\n```\n\n脚本会输出：\n- 变更文件列表（新增/修改/删除）\n- 每个文件的变更统计（增删行数）\n- 推断的变更类型（feat/fix/refactor 等）\n- 推断的影响范围（scope）\n- 关键变更点摘要（从新增/修改的代码行中提取）\n- 是否包含破坏性变更的线索\n\n### 步骤 3：AI 语义分析与提交信息生成\n\n基于 diff 内容和脚本分析结果，进行以下判断：\n\n#### 3.1 确定 type\n- 新增函数/类/API/页面/功能 → `feat`\n- 修改现有逻辑修复错误 → `fix`\n- 仅修改文档/注释 → `docs`\n- 仅修改格式（空格、分号、import 排序）→ `style`\n- 重构代码结构但不改变行为 → `refactor`\n- 优化性能（算法、缓存、查询）→ `perf`\n- 新增/修改测试 → `test`\n- 修改构建配置/依赖 → `build`\n- 修改 CI 配置 → `ci`\n- 杂项配置 → `chore`\n\n**混合变更处理**：如果一次提交包含多种类型，选择最主要的类型；如果变更过于分散，建议用户拆分为多个提交。\n\n#### 3.2 确定 scope\n- 从变更最集中的目录/模块推断\n- 前端项目：组件名、页面名\n- 后端项目：模块名、服务名\n- 全栈项目：`api`、`ui`、`db`、`config` 等\n- 如果变更跨多个不相关模块，可省略 scope\n\n#### 3.3 编写 subject\n- 用一句话概括「这次提交做了什么」\n- 祈使句，具体，不超过 50 字符\n- 避免：「update」「fix」「changes」「misc」等无信息词汇\n- 推荐：「添加用户头像上传功能」「修复订单列表分页越界」\n\n#### 3.4 编写 body（如需要）\n- 变更较复杂、有背景故事、有设计决策时才需要\n- 说明「为什么」而非「怎么做」\n- 可列出关键变更点（用 `-` 列表）\n\n#### 3.5 编写 footer（如需要）\n- 检测到 API 变更、配置变更、数据库迁移 → 添加 `BREAKING CHANGE`\n- 用户提到关联 issue → 添加 `Closes #xxx`\n- 破坏性变更描述需说明变更内容和迁移方案\n\n### 步骤 4：质量自检\n\n生成提交信息后，逐项检查：\n\n- [ ] type 是否在规范列表中？\n- [ ] subject 是否为祈使句？是否具体（而非「update code」）？\n- [ ] subject 长度是否 ≤ 50 字符？\n- [ ] scope 是否准确反映了变更模块？\n- [ ] body 每行是否 ≤ 72 字符？\n- [ ] 是否有破坏性变更未标注？\n- [ ] 提交信息是否与实际 diff 内容一致？（禁止编造不存在的变更）\n- [ ] 是否包含了不该出现在提交信息中的敏感信息（密码、token、内部链接）？\n\n### 步骤 5：输出与交付\n\n1. 输出生成的提交信息（代码块格式，方便复制）\n2. 简要说明选择该 type/scope 的理由\n3. 如检测到问题（如变更过于分散建议拆分、有未提交的敏感信息），主动提醒\n4. 如用户需要，可直接执行 `git commit` 命令（需用户确认）\n\n## 六、输出格式\n\n### 标准提交信息\n\n```\nfeat(auth): 添加微信扫码登录功能\n\n- 新增 WeChatAuthService 处理微信 OAuth 流程\n- 登录页添加扫码登录入口，支持二维码轮询状态\n- 用户表新增 wechat_openid 字段，兼容已有账号绑定\n\nCloses #42\n```\n\n### 破坏性变更提交信息\n\n```\nrefactor(api): 重构用户接口返回格式\n\n将 /api/users 接口返回从数组改为分页对象，\n包含 total、page、pageSize 和 data 字段。\n\nBREAKING CHANGE: /api/users 接口返回格式变更，\n前端需适配新的分页结构。旧格式将在 v2.0 移除。\n```\n\n### 简单提交信息（无需 body）\n\n```\nfix(order): 修复订单金额计算精度丢失\n```\n\n## 七、常见场景处理\n\n### 场景 1：变更过于分散\n如果 diff 涉及 5 个以上不相关模块，提醒用户：\n> 本次变更涉及多个不相关模块（auth、order、payment、docs），建议拆分为多个提交：\n> 1. `feat(auth): ...`\n> 2. `fix(order): ...`\n> 3. `docs: ...`\n\n### 场景 2：仅格式化变更\n如果 diff 全是空格、换行、import 排序：\n```\nstyle: 统一代码格式（prettier 自动格式化）\n```\n\n### 场景 3：依赖升级\n```\nbuild(deps): 升级 react 至 18.2.0\n\n- 升级 react 和 react-dom 至 18.2.0\n- 适配 createRoot 新 API\n- 移除已废弃的 ReactDOM.render 调用\n```\n\n### 场景 4：回滚提交\n```\nrevert: feat(auth): 添加微信扫码登录功能\n\n该功能导致登录页白屏，临时回滚。\n此提交回滚了 abc1234。\n```\n\n### 场景 5：修复线上紧急 bug\n```\nfix(payment): 修复支付回调重复通知导致的订单状态错误\n\n支付回调在网络重试时会重复触发，导致订单状态\n从「已支付」回退为「处理中」。添加幂等校验，\n已支付订单忽略重复回调。\n\nCloses #156\n```\n\n## 八、注意事项\n\n1. **不编造变更**：提交信息必须严格基于实际 diff 内容，不得添加不存在的功能或修复。\n2. **敏感信息检查**：如果 diff 中包含密码、API key、token 等敏感信息，提醒用户不要提交，并建议使用环境变量或 secrets 管理。\n3. **中文/英文一致性**：根据项目已有提交历史的语言风格选择语言；新项目默认与用户输入语言一致。\n4. **大文件检查**：如果 diff 中包含大文件（>10MB）或二进制文件，提醒用户考虑使用 Git LFS 或不要提交。\n5. **提交粒度建议**：如果一次变更包含多个独立功能，建议拆分为多个提交，便于 code review 和回滚。\n6. **scope 命名一致性**：参考项目已有提交中使用的 scope 命名，保持一致。\n7. **不自动执行 commit**：生成提交信息后，需用户确认后才可执行 `git commit`，不得自动提交。\n\n## 九、文件结构\n\n```\ngit-commit-message-generator/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── commit-message-template.md        # 提交信息模板（含各 type 示例）\n├── scripts/\n│   └── analyze_diff.py                   # Git diff 分析脚本（变更统计、类型推断、关键变更提取）\n└── examples/\n    ├── sample-feature.diff               # 示例：新功能 diff\n    ├── sample-bugfix.diff                # 示例：bug 修复 diff\n    └── sample-commit-messages.md         # 示例：生成的提交信息\n```\n\n## 十、使用示例\n\n### 示例 1：日常开发提交\n**用户**：（在 Git 仓库中）「帮我写个 commit message」\n**处理**：执行 `git diff --cached` 获取变更 → 分析 diff → 生成提交信息 → 输出。\n\n### 示例 2：提供 diff 文本\n**用户**：粘贴一段 diff，说「根据这个生成提交信息」\n**处理**：直接分析用户提供的 diff → 生成提交信息。\n\n### 示例 3：PR 提交整理\n**用户**：「帮我把这个 PR 的 10 个提交整理成一个规范的提交信息」\n**处理**：执行 `git log <base>..<head>` 获取所有提交 → 合并分析 → 生成一个汇总的提交信息。\n\n### 示例 4：提交信息校验\n**用户**：「帮我看看这个提交信息合不合规：`update stuff`」\n**处理**：检查 type 是否缺失、subject 是否笼统 → 给出修正建议和改进后的提交信息。\n", "templates/commit-message-template.md": "# Conventional Commits 提交信息模板\n\n## 通用格式\n\n```\n<type>(<scope>): <subject>\n\n<body>\n\n<footer>\n```\n\n---\n\n## 各类型提交信息模板与示例\n\n### feat（新功能）\n\n**模板：**\n```\nfeat(<scope>): <简短描述新增功能>\n\n- <关键变更点 1>\n- <关键变更点 2>\n- <关键变更点 3>\n\nCloses #<issue编号>\n```\n\n**示例：**\n```\nfeat(auth): 添加微信扫码登录功能\n\n- 新增 WeChatAuthService 处理微信 OAuth 流程\n- 登录页添加扫码登录入口，支持二维码轮询状态\n- 用户表新增 wechat_openid 字段，兼容已有账号绑定\n\nCloses #42\n```\n\n---\n\n### fix（Bug 修复）\n\n**模板：**\n```\nfix(<scope>): <简短描述修复的问题>\n\n<问题原因和修复方案说明>\n\nCloses #<issue编号>\n```\n\n**示例：**\n```\nfix(order): 修复订单金额计算精度丢失\n\n使用浮点数计算订单金额时，0.1 + 0.2 导致精度丢失。\n改用 Decimal 类型进行金额计算，保留两位小数。\n\nCloses #156\n```\n\n---\n\n### docs（文档变更）\n\n**模板：**\n```\ndocs(<scope>): <简短描述文档变更>\n\n<文档变更说明，可选>\n```\n\n**示例：**\n```\ndocs: 更新 README 中的安装说明\n\n- 添加 Python 3.11 兼容性说明\n- 补充环境变量配置示例\n- 修复快速开始中的命令错误\n```\n\n---\n\n### style（代码格式）\n\n**模板：**\n```\nstyle(<scope>): <简短描述格式变更>\n```\n\n**示例：**\n```\nstyle: 统一代码格式（prettier 自动格式化）\n```\n\n```\nstyle(import): 按字母顺序排序 import 语句\n```\n\n---\n\n### refactor（重构）\n\n**模板：**\n```\nrefactor(<scope>): <简短描述重构内容>\n\n- <重构点 1>\n- <重构点 2>\n\n<重构原因，可选>\n```\n\n**示例：**\n```\nrefactor(user): 提取用户信息查询为独立服务\n\n- 将 UserController 中的查询逻辑移至 UserQueryService\n- 统一异常处理，减少重复代码\n- 为查询服务添加单元测试\n\n不改变对外 API 行为。\n```\n\n---\n\n### perf（性能优化）\n\n**模板：**\n```\nperf(<scope>): <简短描述性能优化>\n\n<优化前/后对比数据>\n\n<优化方案说明>\n```\n\n**示例：**\n```\nperf(api): 优化订单列表查询性能\n\n- 添加 user_id + status 联合索引\n- 改用分页游标替代 OFFSET 分页\n- 查询耗时从 1200ms 降至 80ms\n\n大数据量下 OFFSET 分页性能随页数增长而下降，\n游标分页避免了扫描大量无关行。\n```\n\n---\n\n### test（测试）\n\n**模板：**\n```\ntest(<scope>): <简短描述测试变更>\n\n- <新增/修改的测试 1>\n- <新增/修改的测试 2>\n```\n\n**示例：**\n```\ntest(auth): 添加登录接口单元测试\n\n- 测试正常登录流程\n- 测试密码错误场景\n- 测试账号被锁定场景\n- 测试参数校验边界\n```\n\n---\n\n### build（构建系统/依赖）\n\n**模板：**\n```\nbuild(<scope>): <简短描述构建/依赖变更>\n\n- <变更点 1>\n- <变更点 2>\n```\n\n**示例：**\n```\nbuild(deps): 升级 react 至 18.2.0\n\n- 升级 react 和 react-dom 至 18.2.0\n- 适配 createRoot 新 API\n- 移除已废弃的 ReactDOM.render 调用\n```\n\n---\n\n### ci（CI/CD）\n\n**模板：**\n```\nci(<scope>): <简短描述 CI/CD 变更>\n```\n\n**示例：**\n```\nci: 添加 Python 3.11 到测试矩阵\n\n- GitHub Actions 测试矩阵新增 3.11\n- 修复 3.11 下的兼容性警告\n```\n\n---\n\n### chore（杂项）\n\n**模板：**\n```\nchore(<scope>): <简短描述杂项变更>\n```\n\n**示例：**\n```\nchore: 更新 .gitignore，忽略 .env.local 文件\n```\n\n```\nchore(release): 发布 v1.2.0\n```\n\n---\n\n### revert（回滚）\n\n**模板：**\n```\nrevert: <被回滚提交的 subject>\n\n<回滚原因>\n\n此提交回滚了 <commit-hash>。\n```\n\n**示例：**\n```\nrevert: feat(auth): 添加微信扫码登录功能\n\n该功能导致登录页白屏，临时回滚。\n此提交回滚了 abc1234。\n```\n\n---\n\n## 破坏性变更模板\n\n```\n<type>(<scope>): <subject>\n\n<body>\n\nBREAKING CHANGE: <破坏性变更描述>\n\n<迁移方案说明>\n```\n\n**示例：**\n```\nrefactor(api): 重构用户接口返回格式\n\n将 /api/users 接口返回从数组改为分页对象，\n包含 total、page、pageSize 和 data 字段。\n\nBREAKING CHANGE: /api/users 接口返回格式变更，\n前端需适配新的分页结构。旧格式将在 v2.0 移除。\n\n迁移方案：将 `res.data` 改为 `res.data.data`，\n分页信息从 `res.data.total` 获取。\n```\n\n---\n\n## 提交信息检查清单\n\n生成提交信息后，逐项确认：\n\n- [ ] type 为以下之一：feat / fix / docs / style / refactor / perf / test / build / ci / chore / revert\n- [ ] subject 为祈使句（「添加」而非「添加了」）\n- [ ] subject 具体而非笼统（不用「update」「fix」「changes」）\n- [ ] subject 长度 ≤ 50 字符\n- [ ] subject 句末无句号\n- [ ] scope 准确反映变更模块（或合理省略）\n- [ ] body 每行 ≤ 72 字符（如有 body）\n- [ ] body 说明「为什么」而非「怎么做」（如有 body）\n- [ ] 破坏性变更已标注 `BREAKING CHANGE`\n- [ ] 关联 issue 已在 footer 标注（如有）\n- [ ] 提交信息与实际 diff 内容一致\n- [ ] 无敏感信息（密码、token、内部链接）\n", "scripts/analyze_diff.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nGit 提交信息生成助手 - Diff 分析脚本\n\n解析 git diff 输出，提取变更统计、推断提交类型和影响范围、\n提取关键变更点，为 AI 生成规范提交信息提供结构化输入。\n\n用法：\n    git diff --cached | python3 analyze_diff.py\n    git diff HEAD~1 | python3 analyze_diff.py\n    python3 analyze_diff.py --input changes.diff\n    python3 analyze_diff.py --input changes.diff --format json\n    python3 analyze_diff.py --input changes.diff --format text\n\"\"\"\n\nimport argparse\nimport json\nimport re\nimport sys\nfrom collections import defaultdict\nfrom dataclasses import dataclass, field, asdict\nfrom typing import List, Optional, Dict, Tuple\n\n\n# ============================================================\n# 数据结构\n# ============================================================\n\n@dataclass\nclass FileChange:\n    \"\"\"单个文件的变更信息\"\"\"\n    path: str\n    status: str  # added, modified, deleted, renamed\n    additions: int = 0\n    deletions: int = 0\n    added_lines: List[str] = field(default_factory=list)\n    deleted_lines: List[str] = field(default_factory=list)\n    extension: str = \"\"\n\n    @property\n    def total_changes(self) -> int:\n        return self.additions + self.deletions\n\n\n@dataclass\nclass DiffAnalysis:\n    \"\"\"完整的 diff 分析结果\"\"\"\n    files: List[FileChange] = field(default_factory=list)\n    total_additions: int = 0\n    total_deletions: int = 0\n    total_files: int = 0\n    inferred_type: str = \"\"\n    inferred_scope: str = \"\"\n    type_confidence: str = \"\"  # high, medium, low\n    key_changes: List[str] = field(default_factory=list)\n    potential_breaking_changes: List[str] = field(default_factory=list)\n    warnings: List[str] = field(default_factory=list)\n    suggestions: List[str] = field(default_factory=list)\n\n\n# ============================================================\n# 文件扩展名到语言/类型的映射\n# ============================================================\n\nEXTENSION_MAP = {\n    # 源代码\n    '.py': 'python', '.js': 'javascript', '.jsx': 'javascript',\n    '.ts': 'typescript', '.tsx': 'typescript', '.java': 'java',\n    '.go': 'go', '.rs': 'rust', '.c': 'c', '.cpp': 'cpp',\n    '.cs': 'csharp', '.php': 'php', '.rb': 'ruby', '.swift': 'swift',\n    '.kt': 'kotlin', '.scala': 'scala', '.r': 'r', '.m': 'objective-c',\n    # 前端\n    '.html': 'html', '.css': 'css', '.scss': 'css', '.sass': 'css',\n    '.less': 'css', '.vue': 'vue', '.svelte': 'svelte',\n    # 数据/配置\n    '.json': 'json', '.yaml': 'yaml', '.yml': 'yaml', '.toml': 'toml',\n    '.xml': 'xml', '.csv': 'csv', '.ini': 'ini', '.cfg': 'config',\n    '.conf': 'config', '.env': 'config',\n    # 文档\n    '.md': 'markdown', '.rst': 'restructuredtext', '.txt': 'text',\n    '.adoc': 'asciidoc',\n    # 构建/CI\n    'Dockerfile': 'docker', '.dockerfile': 'docker',\n    'Makefile': 'makefile', 'CMakeLists.txt': 'cmake',\n    # 测试\n    '.test.js': 'test', '.test.ts': 'test', '.spec.js': 'test',\n    '.spec.ts': 'test', '_test.go': 'test', '.test.py': 'test',\n    '_test.py': 'test',\n}\n\n# 测试文件路径模式\nTEST_PATH_PATTERNS = [\n    r'/test[s]?/', r'/__tests__/', r'/spec[s]?/',\n    r'\\.test\\.', r'\\.spec\\.', r'_test\\.', r'test_',\n]\n\n# 文档文件路径模式\nDOC_PATH_PATTERNS = [\n    r'/doc[s]?/', r'/docs/', r'README', r'CHANGELOG',\n    r'LICENSE', r'CONTRIBUTING', r'CODE_OF_CONDUCT',\n]\n\n# CI/CD 文件模式\nCI_PATH_PATTERNS = [\n    r'\\.github/workflows/', r'\\.gitlab-ci\\.yml', r'Jenkinsfile',\n    r'\\.circleci/', r'\\.travis\\.yml', r'docker-compose',\n    r'\\.drone\\.yml', r'azure-pipelines',\n]\n\n# 构建/依赖文件模式\nBUILD_PATH_PATTERNS = [\n    r'package\\.json$', r'package-lock\\.json$', r'yarn\\.lock$',\n    r'pnpm-lock\\.yaml$', r'requirements\\.txt$', r'Pipfile',\n    r'pyproject\\.toml$', r'setup\\.py$', r'setup\\.cfg$',\n    r'Gemfile$', r'Cargo\\.toml$', r'go\\.mod$', r'go\\.sum$',\n    r'pom\\.xml$', r'build\\.gradle', r'build\\.sbt$',\n    r'webpack\\.config', r'vite\\.config', r'rollup\\.config',\n    r'tsconfig\\.json$', r'jsconfig\\.json$', r'\\.babelrc',\n    r'next\\.config', r'nuxt\\.config',\n]\n\n# 配置文件模式\nCONFIG_PATH_PATTERNS = [\n    r'\\.gitignore$', r'\\.eslintrc', r'\\.prettierrc',\n    r'\\.editorconfig$', r'\\.env', r'\\.flake8',\n    r'\\.pylintrc', r'setup\\.cfg$', r'\\.mocharc',\n    r'jest\\.config', r'vitest\\.config', r'cypress\\.config',\n    r'playwright\\.config', r'postcss\\.config', r'tailwind\\.config',\n]\n\n\n# ============================================================\n# Diff 解析器\n# ============================================================\n\nclass DiffParser:\n    \"\"\"解析 unified diff 格式\"\"\"\n\n    def __init__(self, diff_text: str):\n        self.diff_text = diff_text\n        self.files: List[FileChange] = []\n\n    def parse(self) -> List[FileChange]:\n        lines = self.diff_text.split('\\n')\n        i = 0\n        current_file: Optional[FileChange] = None\n\n        while i < len(lines):\n            line = lines[i]\n\n            # 新文件开始：diff --git a/path b/path\n            if line.startswith('diff --git '):\n                if current_file:\n                    self.files.append(current_file)\n                match = re.match(r'diff --git a/(.+?) b/(.+)', line)\n                if match:\n                    path = match.group(2)\n                    current_file = FileChange(\n                        path=path,\n                        status='modified',\n                        extension=self._get_extension(path),\n                    )\n                i += 1\n                continue\n\n            if current_file is None:\n                i += 1\n                continue\n\n            # 文件状态检测\n            if line.startswith('new file mode'):\n                current_file.status = 'added'\n            elif line.startswith('deleted file mode'):\n                current_file.status = 'deleted'\n            elif line.startswith('rename from'):\n                current_file.status = 'renamed'\n            elif line.startswith('Binary files'):\n                current_file.status = 'binary'\n                current_file.added_lines.append('[二进制文件变更]')\n\n            # 变更行\n            if line.startswith('+') and not line.startswith('+++'):\n                current_file.additions += 1\n                content = line[1:].strip()\n                if content and len(content) < 200:\n                    current_file.added_lines.append(content)\n            elif line.startswith('-') and not line.startswith('---'):\n                current_file.deletions += 1\n                content = line[1:].strip()\n                if content and len(content) < 200:\n                    current_file.deleted_lines.append(content)\n\n            i += 1\n\n        if current_file:\n            self.files.append(current_file)\n\n        return self.files\n\n    @staticmethod\n    def _get_extension(path: str) -> str:\n        \"\"\"获取文件扩展名，处理特殊文件名\"\"\"\n        basename = path.split('/')[-1]\n        if basename in EXTENSION_MAP:\n            return EXTENSION_MAP[basename]\n        # 检查双扩展名如 .test.js\n        for ext in ['.test.js', '.test.ts', '.spec.js', '.spec.ts',\n                    '.test.py', '_test.go', '_test.py']:\n            if basename.endswith(ext):\n                return 'test'\n        idx = basename.rfind('.')\n        if idx > 0:\n            return basename[idx:].lower()\n        return ''\n\n\n# ============================================================\n# 提交类型推断\n# ============================================================\n\nclass TypeInferrer:\n    \"\"\"根据变更文件和内容推断提交类型\"\"\"\n\n    def __init__(self, files: List[FileChange]):\n        self.files = files\n\n    def infer(self) -> Tuple[str, str]:\n        \"\"\"返回 (type, confidence)\"\"\"\n        scores: Dict[str, float] = defaultdict(float)\n\n        for f in self.files:\n            # 按路径模式判断\n            if self._matches_any(f.path, TEST_PATH_PATTERNS) or f.extension == 'test':\n                scores['test'] += 3\n            if self._matches_any(f.path, DOC_PATH_PATTERNS) or f.extension in ('markdown', 'restructuredtext', 'asciidoc', 'text'):\n                scores['docs'] += 3\n            if self._matches_any(f.path, CI_PATH_PATTERNS):\n                scores['ci'] += 4\n            if self._matches_any(f.path, BUILD_PATH_PATTERNS):\n                scores['build'] += 3\n            if self._matches_any(f.path, CONFIG_PATH_PATTERNS):\n                scores['chore'] += 2\n\n            # 新增文件倾向 feat\n            if f.status == 'added' and f.extension in ('py', 'js', 'ts', 'jsx', 'tsx', 'go', 'java', 'rs', 'vue'):\n                scores['feat'] += 1.5\n\n            # 删除文件倾向 refactor 或 chore\n            if f.status == 'deleted':\n                scores['refactor'] += 1\n                scores['chore'] += 0.5\n\n        # 内容层面判断\n        all_added = '\\n'.join(l for f in self.files for l in f.added_lines)\n        all_deleted = '\\n'.join(l for f in self.files for l in f.deleted_lines)\n\n        # 检测 fix 关键词\n        fix_keywords = [r'fix', r'bug', r'error', r'issue', r'修复', r'问题',\n                         r'崩溃', r'异常', r'失败', r'crash', r'null', r'undefined',\n                         r'边界', r'兼容', r'修复了', r'hotfix', r'patch']\n        for kw in fix_keywords:\n            if re.search(kw, all_added + all_deleted, re.IGNORECASE):\n                scores['fix'] += 0.5\n                break\n\n        # 检测 perf 关键词\n        perf_keywords = [r'perf', r'performance', r'优化', r'性能', r'缓存',\n                          r'cache', r'索引', r'index', r'耗时', r'提速',\n                          r'latency', r'throughput', r'qps']\n        for kw in perf_keywords:\n            if re.search(kw, all_added + all_deleted, re.IGNORECASE):\n                scores['perf'] += 1\n                break\n\n        # 检测 refactor 关键词\n        refactor_keywords = [r'refactor', r'rename', r'重构', r'提取', r'extract',\n                              r'move', r'移动', r'拆分', r'split', r'合并', r'merge',\n                              r'cleanup', r'清理', r'simplify', r'简化']\n        for kw in refactor_keywords:\n            if re.search(kw, all_added + all_deleted, re.IGNORECASE):\n                scores['refactor'] += 1\n                break\n\n        # 纯格式变更检测（style）\n        if self._is_style_only():\n            scores['style'] += 5\n\n        # 如果没有明显特征，根据变更量判断\n        if not scores:\n            total_added = sum(f.additions for f in self.files)\n            total_deleted = sum(f.deletions for f in self.files)\n            if total_added > total_deleted * 2 and total_added > 10:\n                scores['feat'] = 1\n            elif total_deleted > total_added * 2:\n                scores['refactor'] = 1\n            else:\n                scores['fix'] = 0.5\n\n        # 取最高分\n        if scores:\n            best_type = max(scores, key=scores.get)\n            best_score = scores[best_type]\n            second_score = sorted(scores.values(), reverse=True)[1] if len(scores) > 1 else 0\n            confidence = 'high' if best_score >= 3 and best_score > second_score * 1.5 else \\\n                         'medium' if best_score >= 2 else 'low'\n            return best_type, confidence\n\n        return 'chore', 'low'\n\n    @staticmethod\n    def _matches_any(path: str, patterns: List[str]) -> bool:\n        return any(re.search(p, path, re.IGNORECASE) for p in patterns)\n\n    def _is_style_only(self) -> bool:\n        \"\"\"判断是否为纯格式变更\"\"\"\n        for f in self.files:\n            if f.extension not in ('py', 'js', 'ts', 'jsx', 'tsx', 'css', 'scss', 'java', 'go'):\n                return False\n            # 检查变更行是否只包含空白/分号/import 排序变化\n            for line in f.added_lines + f.deleted_lines:\n                stripped = re.sub(r'[\\s;,\\(\\)\\{\\}]', '', line)\n                if stripped and not re.match(r'^(import|from|require|//|#|/\\*|\\*)', line):\n                    # 有实际代码变更\n                    if len(stripped) > 5:\n                        return False\n        # 所有文件都是小变更且主要是空白\n        total = sum(f.total_changes for f in self.files)\n        return total < 50\n\n\n# ============================================================\n# Scope 推断\n# ============================================================\n\nclass ScopeInferrer:\n    \"\"\"从变更文件路径推断影响范围\"\"\"\n\n    # 常见目录名到 scope 的映射\n    SCOPE_MAP = {\n        'auth': 'auth', 'authentication': 'auth', 'login': 'auth',\n        'user': 'user', 'users': 'user', 'account': 'account',\n        'order': 'order', 'orders': 'order', 'payment': 'payment',\n        'pay': 'payment', 'product': 'product', 'products': 'product',\n        'cart': 'cart', 'shopping': 'cart',\n        'api': 'api', 'controller': 'api', 'controllers': 'api',\n        'route': 'api', 'routes': 'api', 'endpoint': 'api',\n        'service': 'service', 'services': 'service',\n        'model': 'model', 'models': 'model', 'db': 'db',\n        'database': 'db', 'migration': 'db', 'migrations': 'db',\n        'config': 'config', 'configuration': 'config',\n        'utils': 'utils', 'util': 'utils', 'helpers': 'utils',\n        'helper': 'utils', 'common': 'common', 'shared': 'common',\n        'components': 'ui', 'component': 'ui', 'ui': 'ui',\n        'pages': 'ui', 'page': 'ui', 'views': 'ui', 'view': 'ui',\n        'layouts': 'ui', 'layout': 'ui',\n        'assets': 'assets', 'static': 'assets', 'public': 'assets',\n        'styles': 'style', 'css': 'style', 'theme': 'style',\n        'test': 'test', 'tests': 'test', 'spec': 'test',\n        'docs': 'docs', 'doc': 'docs', 'documentation': 'docs',\n        'scripts': 'scripts', 'script': 'scripts', 'tools': 'scripts',\n        'ci': 'ci', 'deploy': 'ci', 'deployment': 'ci',\n        'docker': 'ci', 'kubernetes': 'ci', 'k8s': 'ci',\n        'notification': 'notification', 'notify': 'notification',\n        'email': 'notification', 'sms': 'notification',\n        'search': 'search', 'analytics': 'analytics',\n        'report': 'report', 'reports': 'report',\n        'export': 'export', 'import': 'import',\n        'upload': 'upload', 'download': 'download',\n        'file': 'file', 'files': 'file', 'storage': 'file',\n        'cache': 'cache', 'queue': 'queue', 'job': 'queue',\n        'worker': 'queue', 'task': 'queue',\n        'log': 'log', 'logging': 'log', 'logger': 'log',\n        'monitor': 'monitor', 'metrics': 'monitor',\n        'alert': 'monitor', 'tracing': 'monitor',\n        'i18n': 'i18n', 'locale': 'i18n', 'translation': 'i18n',\n        'security': 'security', 'authz': 'security',\n        'permission': 'security', 'role': 'security',\n        'middleware': 'middleware', 'plugin': 'plugin',\n        'extension': 'plugin', 'hook': 'plugin',\n        'websocket': 'realtime', 'socket': 'realtime',\n        'realtime': 'realtime', 'stream': 'realtime',\n    }\n\n    def infer(self, files: List[FileChange]) -> str:\n        \"\"\"推断最主要的 scope\"\"\"\n        scope_counts: Dict[str, int] = defaultdict(int)\n\n        for f in files:\n            parts = f.path.lower().split('/')\n            for part in parts:\n                # 去掉扩展名\n                part = re.sub(r'\\.[^.]+$', '', part)\n                if part in self.SCOPE_MAP:\n                    scope_counts[self.SCOPE_MAP[part]] += f.total_changes\n\n            # 检查文件名本身\n            basename = parts[-1] if parts else ''\n            basename_no_ext = re.sub(r'\\.[^.]+$', '', basename)\n            if basename_no_ext in self.SCOPE_MAP:\n                scope_counts[self.SCOPE_MAP[basename_no_ext]] += f.total_changes\n\n        if scope_counts:\n            return max(scope_counts, key=scope_counts.get)\n\n        # 如果没有匹配到已知 scope，取最顶层目录名\n        top_dirs: Dict[str, int] = defaultdict(int)\n        for f in files:\n            parts = f.path.split('/')\n            if len(parts) > 1:\n                top_dirs[parts[0]] += f.total_changes\n\n        if top_dirs:\n            return max(top_dirs, key=top_dirs.get)\n\n        return ''\n\n\n# ============================================================\n# 关键变更点提取\n# ============================================================\n\nclass KeyChangeExtractor:\n    \"\"\"从新增/修改的代码行中提取关键变更点\"\"\"\n\n    # 值得关注的代码模式\n    INTERESTING_PATTERNS = [\n        # 函数/方法定义\n        (r'(?:def|function|func|fn|public|private|protected)\\s+(\\w+)\\s*\\(', '函数定义: {0}'),\n        # 类定义\n        (r'(?:class|interface|struct|enum)\\s+(\\w+)', '类型定义: {0}'),\n        # 新增 API 路由\n        (r'(?:app\\.(?:get|post|put|delete|patch)|router\\.(?:get|post|put|delete|patch)|@(?:Get|Post|Put|Delete|Patch)Mapping)\\s*[\\(]\\s*[\"\\']([^\"\\']+)', '新增接口: {0}'),\n        # 常量/配置\n        (r'(?:const|let|var)\\s+(\\w+)\\s*=', '新增变量: {0}'),\n        # 数据库表/字段\n        (r'(?:CREATE TABLE|ALTER TABLE|ADD COLUMN)\\s+(\\w+)', '数据库变更: {0}'),\n        # 导入新模块\n        (r'(?:import|from)\\s+(.+?)(?:\\s+import|$)', '新增依赖: {0}'),\n        # 错误处理\n        (r'(?:try|catch|throw|raise|except)\\b', '错误处理变更'),\n        # 异步/并发\n        (r'(?:async|await|Promise|goroutine|go\\s+func)', '异步/并发变更'),\n        # 正则\n        (r'(?:new RegExp|re\\.compile|Pattern\\.compile)', '正则表达式变更'),\n        # 加密/安全\n        (r'(?:encrypt|decrypt|hash|salt|token|jwt|password|secret)', '安全相关变更'),\n        # 日志\n        (r'(?:console\\.(?:log|error|warn)|logger\\.(?:info|error|warn)|log\\.Printf)', '日志变更'),\n        # 注释中的 TODO/FIXME\n        (r'(?:TODO|FIXME|HACK|XXX):?\\s*(.+)', '待办: {0}'),\n    ]\n\n    def extract(self, files: List[FileChange], max_items: int = 15) -> List[str]:\n        \"\"\"提取关键变更点\"\"\"\n        changes = []\n        seen = set()\n\n        for f in files:\n            # 跳过测试和文档文件的详细分析\n            if f.extension in ('markdown', 'test') or re.search(r'/test[s]?/', f.path):\n                continue\n\n            for line in f.added_lines:\n                for pattern, template in self.INTERESTING_PATTERNS:\n                    match = re.search(pattern, line, re.IGNORECASE)\n                    if match:\n                        try:\n                            text = template.format(*match.groups()) if match.groups() else template\n                        except (IndexError, KeyError):\n                            text = template\n                        if text not in seen and len(text) < 120:\n                            seen.add(text)\n                            changes.append(f\"[{f.path}] {text}\")\n                        break\n\n                if len(changes) >= max_items:\n                    return changes\n\n        return changes\n\n\n# ============================================================\n# 破坏性变更检测\n# ============================================================\n\nclass BreakingChangeDetector:\n    \"\"\"检测潜在的破坏性变更\"\"\"\n\n    BREAKING_PATTERNS = [\n        # API 变更\n        (r'(?:remove|delete|deprecate)\\s+(?:api|endpoint|route|parameter|param|field)',\n         '移除了 API/参数/字段，可能是破坏性变更'),\n        (r'(?:改|变更).{0,10}(?:接口|API|返回|参数|字段)',\n         '修改了接口/返回格式/参数，可能是破坏性变更'),\n        # 数据库\n        (r'(?:DROP|ALTER).{0,20}(?:TABLE|COLUMN|INDEX)',\n         '数据库表/字段结构变更，可能是破坏性变更'),\n        (r'(?:删除|移除).{0,10}(?:表|字段|列|索引)',\n         '删除数据库表/字段，可能是破坏性变更'),\n        # 配置\n        (r'(?:remove|delete|rename).{0,20}(?:config|env|variable|option|setting)',\n         '配置项变更/移除，可能是破坏性变更'),\n        # 类型/接口\n        (r'(?:interface|type|struct).{0,30}(?:remove|delete|change|rename)',\n         '类型/接口定义变更，可能是破坏性变更'),\n        # 版本\n        (r'(?:v1|v2|version).{0,20}(?:upgrade|migrate|breaking)',\n         '版本升级/迁移，可能是破坏性变更'),\n        # 函数签名\n        (r'(?:def|function|func).{0,50}\\)\\s*:',\n         None),  # 函数签名变更需要对比，这里不直接判断\n    ]\n\n    def detect(self, files: List[FileChange]) -> List[str]:\n        \"\"\"检测潜在破坏性变更\"\"\"\n        breaking = []\n        seen = set()\n\n        for f in files:\n            all_lines = f.added_lines + f.deleted_lines\n            for line in all_lines:\n                for pattern, message in self.BREAKING_PATTERNS:\n                    if message is None:\n                        continue\n                    if re.search(pattern, line, re.IGNORECASE):\n                        if mes
