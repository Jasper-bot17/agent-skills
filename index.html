s)} 个片段\", file=sys.stderr)\n\n    # 过滤\n    filtered = filter_snippets(snippets, search=args.search, tag=args.tag,\n                               language=args.language, category=args.category)\n\n    # 输出\n    if args.stats:\n        output = format_stats(filtered)\n    elif args.format == 'markdown':\n        output = generate_markdown(filtered)\n    elif args.format == 'vscode':\n        output = generate_vscode(filtered)\n    elif args.format == 'json':\n        output = json.dumps([s.to_dict() for s in filtered],\n                            ensure_ascii=False, indent=2)\n    elif args.search or args.tag or args.language or args.category:\n        output = format_search_results(filtered, keyword=args.search)\n    else:\n        output = format_list(filtered)\n\n    print(output)\n\n    if args.output:\n        with open(args.output, 'w', encoding='utf-8') as f:\n            f.write(output + \"\\n\")\n        print(f\"\\n已保存到：{args.output}\", file=sys.stderr)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-library.md": "# 代码片段库\n\n> 共 6 个代码片段\n\n## 目录\n\n- [C++ 片段](#c-片段)（3 个）\n  - [快速排序](#快速排序)\n  - [二分查找](#二分查找)\n  - [链表反转](#链表反转)\n- [Python 片段](#python-片段)（3 个）\n  - [计时器装饰器](#计时器装饰器)\n  - [读取大文件](#读取大文件)\n  - [字典默认值](#字典默认值)\n\n---\n\n## C++ 片段\n\n### 快速排序\n\n**描述**：快速排序算法实现，平均时间复杂度 O(n log n)\n\n**标签**：排序、算法、分治\n\n**文件**：`/runtime/user_skills/snippet-manager/examples/snippets/algorithms.cpp:2`\n\n```cpp\nvoid quickSort(int arr[], int low, int high) {\n    if (low < high) {\n        int pivot = arr[high];\n        int i = low - 1;\n        for (int j = low; j < high; j++) {\n            if (arr[j] <= pivot) {\n                i++;\n                int temp = arr[i];\n                arr[i] = arr[j];\n                arr[j] = temp;\n            }\n        }\n        int temp = arr[i + 1];\n        arr[i + 1] = arr[high];\n        arr[high] = temp;\n        int pi = i + 1;\n        quickSort(arr, low, pi - 1);\n        quickSort(arr, pi + 1, high);\n    }\n}\n```\n\n---\n\n### 二分查找\n\n**描述**：在有序数组中查找目标值，时间复杂度 O(log n)\n\n**标签**：查找、算法、二分\n\n**文件**：`/runtime/user_skills/snippet-manager/examples/snippets/algorithms.cpp:25`\n\n```cpp\nint binarySearch(int arr[], int n, int target) {\n    int left = 0, right = n - 1;\n    while (left <= right) {\n        int mid = left + (right - left) / 2;\n        if (arr[mid] == target) return mid;\n        if (arr[mid] < target) left = mid + 1;\n        else right = mid - 1;\n    }\n    return -1;\n}\n```\n\n---\n\n### 链表反转\n\n**描述**：反转单链表，时间复杂度 O(n)\n\n**标签**：链表、数据结构、指针\n\n**文件**：`/runtime/user_skills/snippet-manager/examples/snippets/algorithms.cpp:38`\n\n```cpp\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode(int x) : val(x), next(nullptr) {}\n};\n\nListNode* reverseList(ListNode* head) {\n    ListNode* prev = nullptr;\n    ListNode* curr = head;\n    while (curr) {\n        ListNode* next = curr->next;\n        curr->next = prev;\n        prev = curr;\n        curr = next;\n    }\n    return prev;\n}\n```\n\n---\n\n## Python 片段\n\n### 计时器装饰器\n\n**描述**：用于测量函数执行时间的装饰器\n\n**标签**：装饰器、工具、性能\n\n**文件**：`/runtime/user_skills/snippet-manager/examples/snippets/utils.py:3`\n\n```python\nimport time\nfrom functools import wraps\n\ndef timer(func):\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        start = time.time()\n        result = func(*args, **kwargs)\n        elapsed = time.time() - start\n        print(f\"{func.__name__} 耗时: {elapsed:.4f}秒\")\n        return result\n    return wrapper\n```\n\n---\n\n### 读取大文件\n\n**描述**：逐行读取大文件，避免内存溢出\n\n**标签**：文件、IO、性能\n\n**文件**：`/runtime/user_skills/snippet-manager/examples/snippets/utils.py:18`\n\n```python\ndef read_large_file(filepath, encoding='utf-8'):\n    with open(filepath, 'r', encoding=encoding) as f:\n        for line in f:\n            yield line.strip()\n```\n\n---\n\n### 字典默认值\n\n**描述**：安全获取字典值，支持默认值和嵌套访问\n\n**标签**：字典、工具\n\n**文件**：`/runtime/user_skills/snippet-manager/examples/snippets/utils.py:25`\n\n```python\ndef get_nested(d, keys, default=None):\n    current = d\n    for key in keys:\n        if isinstance(current, dict) and key in current:\n            current = current[key]\n        else:\n            return default\n    return current\n```\n\n---\n\n", "examples/snippets/algorithms.cpp": "// 常用算法模板\n// @snippet(title=\"快速排序\", desc=\"快速排序算法实现，平均时间复杂度 O(n log n)\", tags=[\"排序\",\"算法\",\"分治\"])\nvoid quickSort(int arr[], int low, int high) {\n    if (low < high) {\n        int pivot = arr[high];\n        int i = low - 1;\n        for (int j = low; j < high; j++) {\n            if (arr[j] <= pivot) {\n                i++;\n                int temp = arr[i];\n                arr[i] = arr[j];\n                arr[j] = temp;\n            }\n        }\n        int temp = arr[i + 1];\n        arr[i + 1] = arr[high];\n        arr[high] = temp;\n        int pi = i + 1;\n        quickSort(arr, low, pi - 1);\n        quickSort(arr, pi + 1, high);\n    }\n}\n// @end-snippet\n\n// @snippet(title=\"二分查找\", desc=\"在有序数组中查找目标值，时间复杂度 O(log n)\", tags=[\"查找\",\"算法\",\"二分\"])\nint binarySearch(int arr[], int n, int target) {\n    int left = 0, right = n - 1;\n    while (left <= right) {\n        int mid = left + (right - left) / 2;\n        if (arr[mid] == target) return mid;\n        if (arr[mid] < target) left = mid + 1;\n        else right = mid - 1;\n    }\n    return -1;\n}\n// @end-snippet\n\n// @snippet\n// title: 链表反转\n// desc: 反转单链表，时间复杂度 O(n)\n// tags: 链表,数据结构,指针\nstruct ListNode {\n    int val;\n    ListNode* next;\n    ListNode(int x) : val(x), next(nullptr) {}\n};\n\nListNode* reverseList(ListNode* head) {\n    ListNode* prev = nullptr;\n    ListNode* curr = head;\n    while (curr) {\n        ListNode* next = curr->next;\n        curr->next = prev;\n        prev = curr;\n        curr = next;\n    }\n    return prev;\n}\n// @end-snippet\n", "examples/snippets/utils.py": "# Python 常用工具函数\n\n# @snippet(title=\"计时器装饰器\", desc=\"用于测量函数执行时间的装饰器\", tags=[\"装饰器\",\"工具\",\"性能\"])\nimport time\nfrom functools import wraps\n\ndef timer(func):\n    @wraps(func)\n    def wrapper(*args, **kwargs):\n        start = time.time()\n        result = func(*args, **kwargs)\n        elapsed = time.time() - start\n        print(f\"{func.__name__} 耗时: {elapsed:.4f}秒\")\n        return result\n    return wrapper\n# @end-snippet\n\n# @snippet(title=\"读取大文件\", desc=\"逐行读取大文件，避免内存溢出\", tags=[\"文件\",\"IO\",\"性能\"])\ndef read_large_file(filepath, encoding='utf-8'):\n    with open(filepath, 'r', encoding=encoding) as f:\n        for line in f:\n            yield line.strip()\n# @end-snippet\n\n# @snippet\n# title: 字典默认值\n# desc: 安全获取字典值，支持默认值和嵌套访问\n# tags: 字典,工具\ndef get_nested(d, keys, default=None):\n    current = d\n    for key in keys:\n        if isinstance(current, dict) and key in current:\n            current = current[key]\n        else:\n            return default\n    return current\n# @end-snippet\n"}, "file_count": 6, "script_lines": 653}, {"name": "sql-formatter", "title": "sql-formatter", "description": "SQL 格式化与分析助手。对 SQL 查询进行专业格式化（关键字大写、缩进对齐、换行规范），支持多种 SQL 方言（MySQL/PostgreSQL/SQLite/Oracle/SQL Server），提供语法校验（括号匹配、关键字检查、常见错误检测），自动提取查询中的表名和列名，解释查询结构（SELECT/FROM/WHERE/GROUP BY/ORDER BY/JOIN 等子句分析），支持压缩输出和 FROM 子句美化。适用于 SQL 代码美化、查询审查、表结构分析、SQL 学习等场景。", "category": "其他", "icon": "📦", "color": "#6b7280", "skill_md": "---\nname: sql-formatter\ndescription: 'SQL 格式化与分析助手。对 SQL 查询进行专业格式化（关键字大写、缩进对齐、换行规范），支持多种 SQL 方言（MySQL/PostgreSQL/SQLite/Oracle/SQL Server），提供语法校验（括号匹配、关键字检查、常见错误检测），自动提取查询中的表名和列名，解释查询结构（SELECT/FROM/WHERE/GROUP BY/ORDER BY/JOIN 等子句分析），支持压缩输出和 FROM 子句美化。适用于 SQL 代码美化、查询审查、表结构分析、SQL 学习等场景。'\n---\n\n# SQL 格式化与分析助手\n\n## 一、技能定位\n\n本技能用于**SQL 查询的格式化、校验与分析**。核心价值：\n\n- 专业格式化：关键字大写、缩进对齐、换行规范\n- 多方言支持：MySQL / PostgreSQL / SQLite / Oracle / SQL Server\n- 语法校验：括号匹配、关键字检查、常见错误检测\n- 表列提取：自动识别查询中的表名和列名\n- 结构解释：分析各子句（SELECT/FROM/WHERE/GROUP BY/ORDER BY/JOIN）\n- 压缩输出：去除多余空格和换行，生成紧凑 SQL\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「格式化 SQL」「美化 SQL」「整理一下这条 SQL」\n2. 用户说「检查 SQL 语法」「这条 SQL 有没有问题」\n3. 用户说「提取 SQL 中的表」「看看查了哪些表和字段」\n4. 用户说「解释这条 SQL」「分析一下查询结构」\n5. 用户说「压缩 SQL」「把 SQL 变成一行」\n6. 用户说「SQL 代码审查」「看看这条查询效率如何」\n7. 用户上传 .sql 文件要求处理\n\n## 三、SQL 关键字与格式化规范\n\n### 3.1 关键字大写\n\n以下关键字统一大写：\n\n- **查询类**：SELECT、FROM、WHERE、GROUP BY、HAVING、ORDER BY、LIMIT、OFFSET、DISTINCT、UNION、UNION ALL、INTERSECT、EXCEPT\n- **连接类**：JOIN、INNER JOIN、LEFT JOIN、RIGHT JOIN、FULL JOIN、CROSS JOIN、ON、USING\n- **条件类**：AND、OR、NOT、IN、EXISTS、BETWEEN、LIKE、IS NULL、IS NOT NULL、AS\n- **聚合类**：COUNT、SUM、AVG、MIN、MAX、GROUP_CONCAT\n- **函数类**：COALESCE、NULLIF、CAST、CONVERT、CASE、WHEN、THEN、ELSE、END\n- **数据操作**：INSERT、UPDATE、DELETE、MERGE、INTO、VALUES、SET\n- **数据定义**：CREATE、ALTER、DROP、TABLE、INDEX、VIEW、DATABASE、SCHEMA\n- **事务类**：BEGIN、COMMIT、ROLLBACK、TRANSACTION\n- **其他**：WITH、RECURSIVE、ASC、DESC、ALL、ANY、SOME\n\n### 3.2 格式化示例\n\n**格式化前：**\n```sql\nselect u.id,u.name,u.email,count(o.id) as order_count from users u left join orders o on u.id=o.user_id where u.status='active' and o.created_at>='2024-01-01' group by u.id,u.name,u.email having count(o.id)>5 order by order_count desc limit 10\n```\n\n**格式化后：**\n```sql\nSELECT\n    u.id,\n    u.name,\n    u.email,\n    COUNT(o.id) AS order_count\nFROM\n    users u\nLEFT JOIN\n    orders o ON u.id = o.user_id\nWHERE\n    u.status = 'active'\n    AND o.created_at >= '2024-01-01'\nGROUP BY\n    u.id,\n    u.name,\n    u.email\nHAVING\n    COUNT(o.id) > 5\nORDER BY\n    order_count DESC\nLIMIT 10\n```\n\n## 四、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 格式化 / 校验 / 提取表列 / 解释结构 / 压缩\n- SQL 方言（默认通用 SQL）\n- 输入方式（直接输入 / 文件）\n\n### 步骤 2：运行脚本\n\n使用 `scripts/format_sql.py`：\n\n```bash\n# 格式化 SQL（从文件）\npython3 scripts/format_sql.py --file query.sql\n\n# 格式化 SQL（直接输入）\npython3 scripts/format_sql.py --sql \"select * from users where id=1\"\n\n# 指定 SQL 方言\npython3 scripts/format_sql.py --file query.sql --dialect mysql\n\n# 语法校验\npython3 scripts/format_sql.py --file query.sql --check\n\n# 提取表和列\npython3 scripts/format_sql.py --file query.sql --extract\n\n# 解释查询结构\npython3 scripts/format_sql.py --file query.sql --explain\n\n# 压缩输出\npython3 scripts/format_sql.py --file query.sql --minify\n\n# 保存到文件\npython3 scripts/format_sql.py --file query.sql --output formatted.sql\n\n# 全部功能（格式化+校验+提取+解释）\npython3 scripts/format_sql.py --file query.sql --all\n```\n\n### 步骤 3：解读结果\n\n- **格式化输出**：规范的 SQL 代码\n- **校验报告**：语法错误、警告、建议\n- **表列提取**：涉及的表名、列名、JOIN 关系\n- **结构解释**：各子句的作用和执行顺序\n- **压缩输出**：单行紧凑 SQL\n\n### 步骤 4：安全提示\n\n1. 本技能只做静态分析，不执行 SQL，不会连接数据库\n2. SQL 中可能包含敏感信息（表名、字段名、数据），处理后请注意清理\n3. 语法校验为基础检查，不能替代数据库的实际执行验证\n\n## 五、输出规范\n\n### 5.1 格式化输出\n\n```sql\nSELECT\n    column1,\n    column2\nFROM\n    table1\nWHERE\n    condition\nORDER BY\n    column1 ASC\n```\n\n### 5.2 校验报告\n\n```\n📋 SQL 语法校验报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n✅ 括号匹配：通过\n✅ 关键字检查：通过\n⚠️  警告：SELECT * 不建议在生产环境使用\n💡 建议：为表添加别名以提高可读性\n━━━━━━━━━━━━━━━━━━━━━━━━\n结果：通过（1 个警告，1 条建议）\n```\n\n### 5.3 表列提取\n\n```\n📊 查询分析\n━━━━━━━━━━━━━━━━━━━━━━━━\n涉及表（2个）：\n  1. users (别名 u)\n  2. orders (别名 o)\n\n涉及列（5个）：\n  - users.id\n  - users.name\n  - users.email\n  - orders.id\n  - orders.user_id\n\nJOIN 关系：\n  users.id = orders.user_id (LEFT JOIN)\n\nWHERE 条件：\n  - users.status = 'active'\n  - orders.created_at >= '2024-01-01'\n```\n\n### 5.4 结构解释\n\n```\n🔍 查询结构解释\n━━━━━━━━━━━━━━━━━━━━━━━━\n执行顺序：\n  1. FROM/JOIN：从 users 表左连接 orders 表\n  2. WHERE：筛选 status='active' 且 2024年后的订单\n  3. GROUP BY：按用户分组\n  4. HAVING：筛选订单数 > 5 的用户\n  5. SELECT：选择用户信息和订单数\n  6. ORDER BY：按订单数降序\n  7. LIMIT：取前 10 条\n\n子句分析：\n  - SELECT：5 个字段，1 个聚合函数\n  - FROM：1 个主表\n  - JOIN：1 个左连接\n  - WHERE：2 个条件\n  - GROUP BY：3 个分组字段\n  - HAVING：1 个聚合条件\n  - ORDER BY：1 个排序字段\n  - LIMIT：10 条\n```\n\n## 六、常见场景处理\n\n### 场景 1：格式化复杂 SQL\n**用户**：「帮我把这条 SQL 格式化一下」\n**处理**：运行格式化 → 输出规范 SQL → 如有问题给出建议。\n\n### 场景 2：SQL 语法检查\n**用户**：「这条 SQL 有没有语法错误」\n**处理**：运行校验 → 检查括号匹配、关键字、常见错误 → 输出报告。\n\n### 场景 3：分析查询涉及的表\n**用户**：「看看这条 SQL 查了哪些表和字段」\n**处理**：运行提取 → 列出表名、列名、JOIN 关系、WHERE 条件。\n\n### 场景 4：解释 SQL 执行逻辑\n**用户**：「解释一下这条 SQL 是怎么执行的」\n**处理**：运行解释 → 按执行顺序分析各子句 → 说明查询逻辑。\n\n### 场景 5：压缩 SQL\n**用户**：「把这条 SQL 变成一行，我要放到代码里」\n**处理**：运行压缩 → 去除多余空格和换行 → 输出单行 SQL。\n\n## 七、注意事项\n\n1. **静态分析**：本技能只做静态文本分析，不连接数据库，不执行 SQL。\n2. **方言差异**：不同数据库的 SQL 语法有差异，指定方言可获得更准确的结果。\n3. **复杂 SQL**：嵌套子查询、CTE、窗口函数等复杂语法可能无法完全解析。\n4. **动态 SQL**：包含变量、模板、拼接的 SQL 可能无法正确解析。\n5. **格式化风格**：默认使用 4 空格缩进，关键字大写，可通过参数调整。\n6. **编码**：SQL 文件默认使用 UTF-8 编码，其他编码可能出现乱码。\n7. **不修改文件**：默认输出到终端，使用 --output 才会写入文件。\n8. **大文件**：SQL 文件过大时可能需要较长时间，建议分批处理。\n\n## 八、文件结构\n\n```\nsql-formatter/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── sql-style-guide.md                 # SQL 编码规范与风格指南\n├── scripts/\n│   └── format_sql.py                      # SQL 格式化与分析脚本\n└── examples/\n    ├── sample-query.sql                   # 示例 SQL 查询\n    ├── sample-formatted.sql               # 示例格式化输出\n    └── sample-analysis-report.md          # 示例分析报告\n```\n\n## 九、使用示例\n\n### 示例 1：快速格式化\n**用户**：「格式化这条 SQL：select * from users where age > 18」\n**AI**：运行 `--sql` → 输出格式化后的 SQL。\n\n### 示例 2：全面分析\n**用户**：「帮我看看这条 SQL，格式化一下，再检查有没有问题」\n**AI**：运行 `--all` → 输出格式化 SQL + 校验报告 + 表列提取 + 结构解释。\n\n### 示例 3：压缩 SQL\n**用户**：「把这个 SQL 文件压缩成一行」\n**AI**：运行 `--minify --output compact.sql` → 生成单行 SQL 文件。\n", "files": {"SKILL.md": "---\nname: sql-formatter\ndescription: 'SQL 格式化与分析助手。对 SQL 查询进行专业格式化（关键字大写、缩进对齐、换行规范），支持多种 SQL 方言（MySQL/PostgreSQL/SQLite/Oracle/SQL Server），提供语法校验（括号匹配、关键字检查、常见错误检测），自动提取查询中的表名和列名，解释查询结构（SELECT/FROM/WHERE/GROUP BY/ORDER BY/JOIN 等子句分析），支持压缩输出和 FROM 子句美化。适用于 SQL 代码美化、查询审查、表结构分析、SQL 学习等场景。'\n---\n\n# SQL 格式化与分析助手\n\n## 一、技能定位\n\n本技能用于**SQL 查询的格式化、校验与分析**。核心价值：\n\n- 专业格式化：关键字大写、缩进对齐、换行规范\n- 多方言支持：MySQL / PostgreSQL / SQLite / Oracle / SQL Server\n- 语法校验：括号匹配、关键字检查、常见错误检测\n- 表列提取：自动识别查询中的表名和列名\n- 结构解释：分析各子句（SELECT/FROM/WHERE/GROUP BY/ORDER BY/JOIN）\n- 压缩输出：去除多余空格和换行，生成紧凑 SQL\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「格式化 SQL」「美化 SQL」「整理一下这条 SQL」\n2. 用户说「检查 SQL 语法」「这条 SQL 有没有问题」\n3. 用户说「提取 SQL 中的表」「看看查了哪些表和字段」\n4. 用户说「解释这条 SQL」「分析一下查询结构」\n5. 用户说「压缩 SQL」「把 SQL 变成一行」\n6. 用户说「SQL 代码审查」「看看这条查询效率如何」\n7. 用户上传 .sql 文件要求处理\n\n## 三、SQL 关键字与格式化规范\n\n### 3.1 关键字大写\n\n以下关键字统一大写：\n\n- **查询类**：SELECT、FROM、WHERE、GROUP BY、HAVING、ORDER BY、LIMIT、OFFSET、DISTINCT、UNION、UNION ALL、INTERSECT、EXCEPT\n- **连接类**：JOIN、INNER JOIN、LEFT JOIN、RIGHT JOIN、FULL JOIN、CROSS JOIN、ON、USING\n- **条件类**：AND、OR、NOT、IN、EXISTS、BETWEEN、LIKE、IS NULL、IS NOT NULL、AS\n- **聚合类**：COUNT、SUM、AVG、MIN、MAX、GROUP_CONCAT\n- **函数类**：COALESCE、NULLIF、CAST、CONVERT、CASE、WHEN、THEN、ELSE、END\n- **数据操作**：INSERT、UPDATE、DELETE、MERGE、INTO、VALUES、SET\n- **数据定义**：CREATE、ALTER、DROP、TABLE、INDEX、VIEW、DATABASE、SCHEMA\n- **事务类**：BEGIN、COMMIT、ROLLBACK、TRANSACTION\n- **其他**：WITH、RECURSIVE、ASC、DESC、ALL、ANY、SOME\n\n### 3.2 格式化示例\n\n**格式化前：**\n```sql\nselect u.id,u.name,u.email,count(o.id) as order_count from users u left join orders o on u.id=o.user_id where u.status='active' and o.created_at>='2024-01-01' group by u.id,u.name,u.email having count(o.id)>5 order by order_count desc limit 10\n```\n\n**格式化后：**\n```sql\nSELECT\n    u.id,\n    u.name,\n    u.email,\n    COUNT(o.id) AS order_count\nFROM\n    users u\nLEFT JOIN\n    orders o ON u.id = o.user_id\nWHERE\n    u.status = 'active'\n    AND o.created_at >= '2024-01-01'\nGROUP BY\n    u.id,\n    u.name,\n    u.email\nHAVING\n    COUNT(o.id) > 5\nORDER BY\n    order_count DESC\nLIMIT 10\n```\n\n## 四、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 格式化 / 校验 / 提取表列 / 解释结构 / 压缩\n- SQL 方言（默认通用 SQL）\n- 输入方式（直接输入 / 文件）\n\n### 步骤 2：运行脚本\n\n使用 `scripts/format_sql.py`：\n\n```bash\n# 格式化 SQL（从文件）\npython3 scripts/format_sql.py --file query.sql\n\n# 格式化 SQL（直接输入）\npython3 scripts/format_sql.py --sql \"select * from users where id=1\"\n\n# 指定 SQL 方言\npython3 scripts/format_sql.py --file query.sql --dialect mysql\n\n# 语法校验\npython3 scripts/format_sql.py --file query.sql --check\n\n# 提取表和列\npython3 scripts/format_sql.py --file query.sql --extract\n\n# 解释查询结构\npython3 scripts/format_sql.py --file query.sql --explain\n\n# 压缩输出\npython3 scripts/format_sql.py --file query.sql --minify\n\n# 保存到文件\npython3 scripts/format_sql.py --file query.sql --output formatted.sql\n\n# 全部功能（格式化+校验+提取+解释）\npython3 scripts/format_sql.py --file query.sql --all\n```\n\n### 步骤 3：解读结果\n\n- **格式化输出**：规范的 SQL 代码\n- **校验报告**：语法错误、警告、建议\n- **表列提取**：涉及的表名、列名、JOIN 关系\n- **结构解释**：各子句的作用和执行顺序\n- **压缩输出**：单行紧凑 SQL\n\n### 步骤 4：安全提示\n\n1. 本技能只做静态分析，不执行 SQL，不会连接数据库\n2. SQL 中可能包含敏感信息（表名、字段名、数据），处理后请注意清理\n3. 语法校验为基础检查，不能替代数据库的实际执行验证\n\n## 五、输出规范\n\n### 5.1 格式化输出\n\n```sql\nSELECT\n    column1,\n    column2\nFROM\n    table1\nWHERE\n    condition\nORDER BY\n    column1 ASC\n```\n\n### 5.2 校验报告\n\n```\n📋 SQL 语法校验报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n✅ 括号匹配：通过\n✅ 关键字检查：通过\n⚠️  警告：SELECT * 不建议在生产环境使用\n💡 建议：为表添加别名以提高可读性\n━━━━━━━━━━━━━━━━━━━━━━━━\n结果：通过（1 个警告，1 条建议）\n```\n\n### 5.3 表列提取\n\n```\n📊 查询分析\n━━━━━━━━━━━━━━━━━━━━━━━━\n涉及表（2个）：\n  1. users (别名 u)\n  2. orders (别名 o)\n\n涉及列（5个）：\n  - users.id\n  - users.name\n  - users.email\n  - orders.id\n  - orders.user_id\n\nJOIN 关系：\n  users.id = orders.user_id (LEFT JOIN)\n\nWHERE 条件：\n  - users.status = 'active'\n  - orders.created_at >= '2024-01-01'\n```\n\n### 5.4 结构解释\n\n```\n🔍 查询结构解释\n━━━━━━━━━━━━━━━━━━━━━━━━\n执行顺序：\n  1. FROM/JOIN：从 users 表左连接 orders 表\n  2. WHERE：筛选 status='active' 且 2024年后的订单\n  3. GROUP BY：按用户分组\n  4. HAVING：筛选订单数 > 5 的用户\n  5. SELECT：选择用户信息和订单数\n  6. ORDER BY：按订单数降序\n  7. LIMIT：取前 10 条\n\n子句分析：\n  - SELECT：5 个字段，1 个聚合函数\n  - FROM：1 个主表\n  - JOIN：1 个左连接\n  - WHERE：2 个条件\n  - GROUP BY：3 个分组字段\n  - HAVING：1 个聚合条件\n  - ORDER BY：1 个排序字段\n  - LIMIT：10 条\n```\n\n## 六、常见场景处理\n\n### 场景 1：格式化复杂 SQL\n**用户**：「帮我把这条 SQL 格式化一下」\n**处理**：运行格式化 → 输出规范 SQL → 如有问题给出建议。\n\n### 场景 2：SQL 语法检查\n**用户**：「这条 SQL 有没有语法错误」\n**处理**：运行校验 → 检查括号匹配、关键字、常见错误 → 输出报告。\n\n### 场景 3：分析查询涉及的表\n**用户**：「看看这条 SQL 查了哪些表和字段」\n**处理**：运行提取 → 列出表名、列名、JOIN 关系、WHERE 条件。\n\n### 场景 4：解释 SQL 执行逻辑\n**用户**：「解释一下这条 SQL 是怎么执行的」\n**处理**：运行解释 → 按执行顺序分析各子句 → 说明查询逻辑。\n\n### 场景 5：压缩 SQL\n**用户**：「把这条 SQL 变成一行，我要放到代码里」\n**处理**：运行压缩 → 去除多余空格和换行 → 输出单行 SQL。\n\n## 七、注意事项\n\n1. **静态分析**：本技能只做静态文本分析，不连接数据库，不执行 SQL。\n2. **方言差异**：不同数据库的 SQL 语法有差异，指定方言可获得更准确的结果。\n3. **复杂 SQL**：嵌套子查询、CTE、窗口函数等复杂语法可能无法完全解析。\n4. **动态 SQL**：包含变量、模板、拼接的 SQL 可能无法正确解析。\n5. **格式化风格**：默认使用 4 空格缩进，关键字大写，可通过参数调整。\n6. **编码**：SQL 文件默认使用 UTF-8 编码，其他编码可能出现乱码。\n7. **不修改文件**：默认输出到终端，使用 --output 才会写入文件。\n8. **大文件**：SQL 文件过大时可能需要较长时间，建议分批处理。\n\n## 八、文件结构\n\n```\nsql-formatter/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── sql-style-guide.md                 # SQL 编码规范与风格指南\n├── scripts/\n│   └── format_sql.py                      # SQL 格式化与分析脚本\n└── examples/\n    ├── sample-query.sql                   # 示例 SQL 查询\n    ├── sample-formatted.sql               # 示例格式化输出\n    └── sample-analysis-report.md          # 示例分析报告\n```\n\n## 九、使用示例\n\n### 示例 1：快速格式化\n**用户**：「格式化这条 SQL：select * from users where age > 18」\n**AI**：运行 `--sql` → 输出格式化后的 SQL。\n\n### 示例 2：全面分析\n**用户**：「帮我看看这条 SQL，格式化一下，再检查有没有问题」\n**AI**：运行 `--all` → 输出格式化 SQL + 校验报告 + 表列提取 + 结构解释。\n\n### 示例 3：压缩 SQL\n**用户**：「把这个 SQL 文件压缩成一行」\n**AI**：运行 `--minify --output compact.sql` → 生成单行 SQL 文件。\n", "templates/sql-style-guide.md": "# SQL 编码规范与风格指南\n\n> 适用于 MySQL / PostgreSQL / SQLite / Oracle / SQL Server 等主流数据库。\n\n---\n\n## 一、命名规范\n\n### 1.1 表名\n- 使用小写字母和下划线，如 `user_info`、`order_items`\n- 使用复数形式，如 `users`、`orders`\n- 避免使用保留字，如 `order` → `orders`、`user` → `users`\n- 前缀区分模块，如 `prod_products`、`ord_orders`\n\n### 1.2 列名\n- 使用小写字母和下划线，如 `created_at`、`user_name`\n- 主键统一用 `id`\n- 外键用 `表名_id`，如 `user_id`、`order_id`\n- 布尔值用 `is_` 前缀，如 `is_active`、`is_deleted`\n- 时间戳用 `_at` 后缀，如 `created_at`、`updated_at`\n\n### 1.3 别名\n- 表别名使用有意义的缩写，如 `users u`、`orders o`、`order_items oi`\n- 列别名使用 AS 关键字，如 `COUNT(*) AS total`\n\n---\n\n## 二、格式规范\n\n### 2.1 关键字大写\n所有 SQL 关键字大写：\n```sql\nSELECT id, name FROM users WHERE status = 'active';\n```\n\n### 2.2 缩进\n- 使用 4 空格缩进\n- 子查询缩进一级\n- SELECT 列各占一行并缩进\n\n```sql\nSELECT\n    u.id,\n    u.name,\n    COUNT(o.id) AS order_count\nFROM\n    users u\nLEFT JOIN\n    orders o ON u.id = o.user_id\nWHERE\n    u.status = 'active'\nGROUP BY\n    u.id,\n    u.name\nORDER BY\n    order_count DESC\nLIMIT 10;\n```\n\n### 2.3 空格\n- 运算符两侧加空格：`id = 1`、`age > 18`\n- 逗号后加空格：`id, name, email`\n- 括号内不加空格：`COUNT(id)`、`WHERE id IN (1, 2, 3)`\n\n### 2.4 换行\n- 每个顶层子句（SELECT/FROM/WHERE/GROUP BY/HAVING/ORDER BY/LIMIT）单独成行\n- SELECT 列各占一行\n- 多个 AND/OR 条件各占一行\n- 语句末尾加分号\n\n---\n\n## 三、查询规范\n\n### 3.1 避免 SELECT *\n明确指定需要的列：\n```sql\n-- 不推荐\nSELECT * FROM users;\n\n-- 推荐\nSELECT id, name, email FROM users;\n```\n\n### 3.2 使用表别名\n多表查询时使用别名：\n```sql\nSELECT u.id, u.name, o.total\nFROM users u\nJOIN orders o ON u.id = o.user_id;\n```\n\n### 3.3 WHERE 条件\n- 避免在列上使用函数，导致索引失效\n- 范围查询使用 BETWEEN 或 >= / <=\n- 模糊查询避免前导通配符\n\n```sql\n-- 不推荐（索引失效）\nWHERE YEAR(created_at) = 2024\nWHERE name LIKE '%张%'\n\n-- 推荐\nWHERE created_at >= '2024-01-01' AND created_at < '2025-01-01'\nWHERE name LIKE '张%'\n```\n\n### 3.4 JOIN 规范\n- 明确指定 JOIN 类型（INNER/LEFT/RIGHT/FULL）\n- ON 子句写连接条件，WHERE 写过滤条件\n- 避免超过 3 个表的 JOIN\n\n### 3.5 排序与分页\n- ORDER BY 必须指定 ASC/DESC\n- 大表分页避免深偏移（LIMIT 100000, 10）\n- 使用游标分页或延迟关联优化深分页\n\n---\n\n## 四、性能建议\n\n### 4.1 索引\n- WHERE、JOIN、ORDER BY、GROUP BY 涉及的列考虑加索引\n- 联合索引遵循最左前缀原则\n- 避免在索引列上使用函数或隐式类型转换\n\n### 4.2 子查询 vs JOIN\n- 优先使用 JOIN 替代子查询（大多数情况）\n- IN 子查询在数据量大时可能性能较差\n- EXISTS 比 IN 更适合外表大、内表小的场景\n\n### 4.3 聚合查询\n- 聚合前尽量过滤数据\n- 避免在 HAVING 中使用复杂条件\n- 考虑使用覆盖索引\n\n---\n\n## 五、安全规范\n\n### 5.1 防止 SQL 注入\n- 使用参数化查询/预编译语句\n- 禁止拼接用户输入到 SQL\n- 对输入进行白名单校验\n\n### 5.2 权限控制\n- 应用账号只授予必要权限\n- 禁止使用 root/sa 账号运行应用\n- 敏感字段加密存储\n\n### 5.3 数据保护\n- 生产环境查询避免 SELECT *\n- 导出数据前脱敏\n- 日志中不记录完整 SQL 参数\n\n---\n\n## 六、常见错误\n\n| 错误 | 说明 | 修正 |\n|---|---|---|\n| 引号未闭合 | 字符串缺少结束引号 | 检查单引号配对 |\n| 括号不匹配 | 函数或子查询括号未闭合 | 逐层检查括号 |\n| 缺少 FROM | SELECT 语句没有 FROM（非常量查询） | 添加 FROM 子句 |\n| 列名歧义 | 多表查询中列名不唯一 | 使用表别名限定列名 |\n| 保留字冲突 | 表名或列名使用了 SQL 保留字 | 重命名或加引号 |\n| 类型不匹配 | 比较运算符两侧类型不一致 | 显式转换类型 |\n| GROUP BY 错误 | SELECT 中非聚合列未在 GROUP BY 中 | 添加到 GROUP BY 或使用聚合函数 |\n\n---\n\n*规范参考由 sql-formatter 技能提供*\n", "scripts/format_sql.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\nSQL 格式化与分析脚本\n\n功能：\n- SQL 格式化（关键字大写、缩进对齐、换行规范）\n- 语法校验（括号匹配、关键字检查、常见错误检测）\n- 表和列提取\n- 查询结构解释\n- 压缩输出\n- 多种 SQL 方言支持（MySQL/PostgreSQL/SQLite/Oracle/SQL Server）\n\n用法：\n  python3 format_sql.py --file query.sql\n  python3 format_sql.py --sql \"select * from users where id=1\"\n  python3 format_sql.py --file query.sql --dialect mysql\n  python3 format_sql.py --file query.sql --check\n  python3 format_sql.py --file query.sql --extract\n  python3 format_sql.py --file query.sql --explain\n  python3 format_sql.py --file query.sql --minify\n  python3 format_sql.py --file query.sql --output formatted.sql\n  python3 format_sql.py --file query.sql --all\n\"\"\"\n\nimport argparse\nimport re\nimport sys\nfrom typing import Dict, List, Optional, Set, Tuple\n\n\n# ============================================================\n# SQL 关键字定义\n# ============================================================\n\n# 需要大写的关键字\nSQL_KEYWORDS = {\n    # 查询\n    \"SELECT\", \"FROM\", \"WHERE\", \"GROUP\", \"BY\", \"HAVING\", \"ORDER\",\n    \"LIMIT\", \"OFFSET\", \"DISTINCT\", \"UNION\", \"INTERSECT\", \"EXCEPT\",\n    \"ALL\", \"AS\", \"INTO\",\n    # 连接\n    \"JOIN\", \"INNER\", \"LEFT\", \"RIGHT\", \"FULL\", \"CROSS\", \"ON\", \"USING\",\n    \"NATURAL\",\n    # 条件\n    \"AND\", \"OR\", \"NOT\", \"IN\", \"EXISTS\", \"BETWEEN\", \"LIKE\", \"IS\",\n    \"NULL\", \"TRUE\", \"FALSE\", \"UNKNOWN\",\n    # 聚合\n    \"COUNT\", \"SUM\", \"AVG\", \"MIN\", \"MAX\",\n    # 函数\n    \"COALESCE\", \"NULLIF\", \"CAST\", \"CONVERT\", \"CASE\", \"WHEN\", \"THEN\",\n    \"ELSE\", \"END\", \"DECODE\", \"NVL\", \"IFNULL\",\n    # 数据操作\n    \"INSERT\", \"UPDATE\", \"DELETE\", \"MERGE\", \"VALUES\", \"SET\",\n    # 数据定义\n    \"CREATE\", \"ALTER\", \"DROP\", \"TABLE\", \"INDEX\", \"VIEW\", \"DATABASE\",\n    \"SCHEMA\", \"SEQUENCE\", \"TRIGGER\", \"PROCEDURE\", \"FUNCTION\",\n    \"PRIMARY\", \"KEY\", \"FOREIGN\", \"REFERENCES\", \"UNIQUE\", \"CHECK\",\n    \"DEFAULT\", \"CONSTRAINT\", \"AUTO_INCREMENT\", \"SERIAL\",\n    # 事务\n    \"BEGIN\", \"COMMIT\", \"ROLLBACK\", \"TRANSACTION\", \"SAVEPOINT\",\n    # 排序\n    \"ASC\", \"DESC\",\n    # 其他\n    \"WITH\", \"RECURSIVE\", \"ANY\", \"SOME\", \"OVER\", \"PARTITION\", \"WINDOW\",\n    \"ROW\", \"ROWS\", \"RANGE\", \"PRECEDING\", \"FOLLOWING\", \"UNBOUNDED\",\n    \"CURRENT\", \"ROW_NUMBER\", \"RANK\", \"DENSE_RANK\", \"LAG\", \"LEAD\",\n    \"FIRST_VALUE\", \"LAST_VALUE\", \"NTILE\", \"CUME_DIST\", \"PERCENT_RANK\",\n    \"RETURNING\", \"CONFLICT\", \"DO\", \"NOTHING\", \"REPLACE\",\n}\n\n# 顶层子句（触发换行和缩进减少）\nTOP_LEVEL_CLAUSES = {\n    \"SELECT\", \"FROM\", \"WHERE\", \"GROUP BY\", \"ORDER BY\", \"HAVING\",\n    \"LIMIT\", \"OFFSET\", \"UNION\", \"UNION ALL\", \"INTERSECT\", \"EXCEPT\",\n    \"INSERT INTO\", \"UPDATE\", \"DELETE FROM\", \"VALUES\", \"SET\",\n    \"WITH\", \"RETURNING\",\n}\n\n# JOIN 子句\nJOIN_CLAUSES = {\n    \"JOIN\", \"INNER JOIN\", \"LEFT JOIN\", \"RIGHT JOIN\", \"FULL JOIN\",\n    \"CROSS JOIN\", \"NATURAL JOIN\", \"LEFT OUTER JOIN\", \"RIGHT OUTER JOIN\",\n    \"FULL OUTER JOIN\",\n}\n\n# 支持的方言\nDIALECTS = {\"generic\", \"mysql\", \"postgresql\", \"sqlite\", \"oracle\", \"sqlserver\"}\n\n\n# ============================================================\n# SQL 分词器\n# ============================================================\n\nclass SQLToken:\n    \"\"\"SQL 词法单元\"\"\"\n    def __init__(self, token_type: str, value: str, position: int):\n        self.type = token_type  # keyword, identifier, string, number, operator, punctuation, whitespace, comment\n        self.value = value\n        self.position = position\n\n    def __repr__(self):\n        return f\"Token({self.type}, {self.value!r})\"\n\n\ndef tokenize_sql(sql: str) -> List[SQLToken]:\n    \"\"\"将 SQL 文本分词\"\"\"\n    tokens = []\n    pos = 0\n    n = len(sql)\n\n    while pos < n:\n        ch = sql[pos]\n\n        # 空白\n        if ch in \" \\t\\n\\r\":\n            start = pos\n            while pos < n and sql[pos] in \" \\t\\n\\r\":\n                pos += 1\n            tokens.append(SQLToken(\"whitespace\", sql[start:pos], start))\n            continue\n\n        # 单行注释 --\n        if ch == \"-\" and pos + 1 < n and sql[pos + 1] == \"-\":\n            start = pos\n            while pos < n and sql[pos] != \"\\n\":\n                pos += 1\n            tokens.append(SQLToken(\"comment\", sql[start:pos], start))\n            continue\n\n        # 多行注释 /* */\n        if ch == \"/\" and pos + 1 < n and sql[pos + 1] == \"*\":\n            start = pos\n            pos += 2\n            while pos < n - 1 and not (sql[pos] == \"*\" and sql[pos + 1] == \"/\"):\n                pos += 1\n            pos = min(pos + 2, n)\n            tokens.append(SQLToken(\"comment\", sql[start:pos], start))\n            continue\n\n        # 字符串 '...'\n        if ch == \"'\":\n            start = pos\n            pos += 1\n            while pos < n:\n                if sql[pos] == \"'\":\n                    if pos + 1 < n and sql[pos + 1] == \"'\":\n                        pos += 2  # 转义的单引号\n                        continue\n                    pos += 1\n                    break\n                pos += 1\n            tokens.append(SQLToken(\"string\", sql[start:pos], start))\n            continue\n\n        # 双引号标识符 \"...\"\n        if ch == '\"':\n            start = pos\n            pos += 1\n            while pos < n and sql[pos] != '\"':\n                pos += 1\n            pos = min(pos + 1, n)\n            tokens.append(SQLToken(\"identifier\", sql[start:pos], start))\n            continue\n\n        # 反引号标识符 `...` (MySQL)\n        if ch == \"`\":\n            start = pos\n            pos += 1\n            while pos < n and sql[pos] != \"`\":\n                pos += 1\n            pos = min(pos + 1, n)\n            tokens.append(SQLToken(\"identifier\", sql[start:pos], start))\n            continue\n\n        # 数字\n        if ch.isdigit() or (ch == \".\" and pos + 1 < n and sql[pos + 1].isdigit()):\n            start = pos\n            while pos < n and (sql[pos].isdigit() or sql[pos] in \".eE+-\"):\n                # 避免 + - 被误吞\n                if sql[pos] in \"+-\" and pos > start and sql[pos - 1] not in \"eE\":\n                    break\n                pos += 1\n            tokens.append(SQLToken(\"number\", sql[start:pos], start))\n            continue\n\n        # 标识符/关键字\n        if ch.isalpha() or ch == \"_\":\n            start = pos\n            while pos < n and (sql[pos].isalnum() or sql[pos] == \"_\"):\n                pos += 1\n            word = sql[start:pos]\n            token_type = \"keyword\" if word.upper() in SQL_KEYWORDS else \"identifier\"\n            tokens.append(SQLToken(token_type, word, start))\n            continue\n\n        # 操作符\n        if ch in \"=<>!+-*/%&|^~\":\n            start = pos\n            # 多字符操作符\n            if pos + 1 < n and sql[pos:pos + 2] in (\"<=\", \">=\", \"!=\", \"<>\", \"||\", \"::\"):\n                pos += 2\n            else:\n                pos += 1\n            tokens.append(SQLToken(\"operator\", sql[start:pos], start))\n            continue\n\n        # 标点\n        if ch in \"(),;.\":\n            tokens.append(SQLToken(\"punctuation\", ch, pos))\n            pos += 1\n            continue\n\n        # 其他字符（保留原样）\n        tokens.append(SQLToken(\"other\", ch, pos))\n        pos += 1\n\n    return tokens\n\n\n# ============================================================\n# SQL 格式化\n# ============================================================\n\ndef format_sql(sql: str, indent: int = 4, dialect: str = \"generic\") -> str:\n    \"\"\"格式化 SQL\"\"\"\n    tokens = tokenize_sql(sql)\n    lines = []\n    current_line = []\n    indent_level = 0\n    list_indent = 0  # 列列表缩进（SELECT/GROUP BY/ORDER BY 后的列）\n    func_paren_depth = 0  # 函数调用括号深度\n    i = 0\n\n    def flush_line():\n        nonlocal current_line\n        if current_line:\n            # 去除行尾空白\n            line = \"\".join(current_line).rstrip()\n            if line:\n                total_indent = (indent_level + list_indent) * indent\n                lines.append(\" \" * total_indent + line)\n            current_line = []\n\n    # 函数名集合（用于判断括号是否为函数调用）\n    FUNCTION_NAMES = {\"COUNT\", \"SUM\", \"AVG\", \"MIN\", \"MAX\", \"COALESCE\", \"NULLIF\",\n                      \"CAST\", \"CONVERT\", \"CASE\", \"DECODE\", \"NVL\", \"IFNULL\",\n                      \"GROUP_CONCAT\", \"CONCAT\", \"SUBSTRING\", \"TRIM\", \"UPPER\",\n                      \"LOWER\", \"LENGTH\", \"ROUND\", \"FLOOR\", \"CEIL\", \"ABS\",\n                      \"NOW\", \"CURDATE\", \"CURTIME\", \"DATE\", \"YEAR\", \"MONTH\",\n                      \"DAY\", \"HOUR\", \"MINUTE\", \"SECOND\", \"EXTRACT\", \"DATE_FORMAT\",\n                      \"IF\", \"IFNULL\", \"NULLIF\", \"GREATEST\", \"LEAST\", \"ROW_NUMBER\",\n                      \"RANK\", \"DENSE_RANK\", \"LAG\", \"LEAD\", \"FIRST_VALUE\", \"LAST_VALUE\",\n                      \"NTILE\", \"CUME_DIST\", \"PERCENT_RANK\", \"OVER\"}\n\n    def is_function_call(idx: int) -> bool:\n        \"\"\"检查 idx 位置的 '(' 是否为函数调用\"\"\"\n        j = idx - 1\n        while j >= 0 and tokens[j].type == \"whitespace\":\n            j -= 1\n        if j >= 0:\n            prev = tokens[j]\n            if prev.type == \"identifier\":\n                return True\n            if prev.type == \"keyword\" and prev.value.upper() in FUNCTION_NAMES:\n                return True\n        return False\n\n    while i < len(tokens):\n        token = tokens[i]\n\n        # 跳过多余空白\n        if token.type == \"whitespace\":\n            if current_line and not current_line[-1].endswith(\" \"):\n                current_line.append(\" \")\n            i += 1\n            continue\n\n        # 注释单独成行\n        if token.type == \"comment\":\n            flush_line()\n            lines.append(\" \" * (indent_level * indent) + token.value.strip())\n            i += 1\n            continue\n\n        # 分号：结束语句\n        if token.type == \"punctuation\" and token.value == \";\":\n            current_line.append(\";\")\n            flush_line()\n            lines.append(\"\")  # 空行分隔语句\n            indent_level = 0\n            list_indent = 0\n            i += 1\n            continue\n\n        # 左括号\n        if token.type == \"punctuation\" and token.value == \"(\":\n            if is_function_call(i):\n                # 函数调用：不换行，保持在同一行\n                current_line.append(\"(\")\n                func_paren_depth += 1\n                i += 1\n                continue\n            else:\n                # 子查询或表达式分组：换行并增加缩进\n                current_line.append(\"(\")\n                flush_line()\n                indent_level += 1\n                i += 1\n                continue\n\n        # 右括号\n        if token.type == \"punctuation\" and token.value == \")\":\n            if func_paren_depth > 0:\n                # 函数调用的右括号：跟在当前行后面\n                current_line.append(\")\")\n                func_paren_depth -= 1\n            else:\n                flush_line()\n                indent_level = max(0, indent_level - 1)\n                current_line.append(\")\")\n            i += 1\n            continue\n\n        # 逗号：换行（在 SELECT 列表、GROUP BY 等中，但函数调用内不换行）\n        if token.type == \"punctuation\" and token.value == \",\":\n            current_line.append(\",\")\n            if func_paren_depth == 0:\n                flush_line()\n            i += 1\n            continue\n\n        # 检查是否为顶层子句（需要换行）\n        if token.type == \"keyword\":\n            # 组合关键字（GROUP BY, ORDER BY, INNER JOIN 等）\n            combined = token.value.upper()\n            j = i + 1\n            # 跳过空白\n            while j < len(tokens) and tokens[j].type == \"whitespace\":\n                j += 1\n            if j < len(tokens) and tokens[j].type == \"keyword\":\n                test_combined = combined + \" \" + tokens[j].value.upper()\n                if test_combined in TOP_LEVEL_CLAUSES or test_combined in JOIN_CLAUSES:\n                    combined = test_combined\n                    i = j  # 跳过第二个关键字\n\n            if combined in TOP_LEVEL_CLAUSES or combined in JOIN_CLAUSES:\n                flush_line()\n                # 管理列列表缩进\n                if combined in (\"FROM\", \"WHERE\", \"HAVING\", \"LIMIT\", \"OFFSET\"):\n                    list_indent = 0\n                current_line.append(combined)\n                # SELECT/GROUP BY/ORDER BY 关键字单独成行，列在下一行\n                if combined in (\"SELECT\", \"GROUP BY\", \"ORDER BY\"):\n                    flush_line()\n                    list_indent = 1\n                # ON 子句跟在 JOIN 后面\n                i += 1\n                continue\n\n            # AND / OR：在 WHERE 中换行\n            if combined in (\"AND\", \"OR\") and current_line:\n                flush_line()\n                current_line.append(combined)\n                i += 1\n                continue\n\n        # 普通 token\n        if token.type == \"keyword\":\n            current_line.append(token.value.upper())\n        else:\n            current_line.append(token.value)\n\n        i += 1\n\n    flush_line()\n\n    # 清理多余空行\n    result = []\n    prev_empty = False\n    for line in lines:\n        if line.strip() == \"\":\n            if not prev_empty:\n                result.append(\"\")\n            prev_empty = True\n        else:\n            result.append(line)\n            prev_empty = False\n\n    return \"\\n\".join(result).strip() + \"\\n\"\n\n\n# ============================================================\n# SQL 语法校验\n# ============================================================\n\ndef check_sql(sql: str, dialect: str = \"generic\") -> Dict:\n    \"\"\"校验 SQL 语法\"\"\"\n    errors = []\n    warnings = []\n    suggestions = []\n\n    # 去除注释\n    sql_no_comments = re.sub(r'--.*?$', '', sql, flags=re.MULTILINE)\n    sql_no_comments = re.sub(r'/\\*.*?\\*/', '', sql_no_comments, flags=re.DOTALL)\n\n    # 1. 括号匹配\n    paren_stack = []\n    for i, ch in enumerate(sql_no_comments):\n        if ch == \"(\":\n            paren_stack.append(i)\n        elif ch == \")\":\n            if not paren_stack:\n                errors.append(f\"位置 {i}：多余的右括号 ')'\")\n            else:\n                paren_stack.pop()\n    if paren_stack:\n        errors.append(f\"位置 {paren_stack[-1]}：未闭合的左括号 '('\")\n\n    # 2. 引号匹配\n    quote_count = sql_no_comments.count(\"'\")\n    if quote_count % 2 != 0:\n        errors.append(\"单引号未闭合（奇数个单引号）\")\n\n    # 3. 关键字检查\n    sql_upper = sql_no_comments.upper()\n\n    # 检查 SELECT 是否存在\n    if \"SELECT\" in sql_upper and \"FROM\" not in sql_upper:\n        # 可能是 SELECT 常量，只警告\n        if not re.search(r\"SELECT\\s+[\\d'\\\"]\", sql_upper, re.IGNORECASE):\n            warnings.append(\"SELECT 语句缺少 FROM 子句\")\n\n    # 检查 SELECT *\n    if re.search(r\"SELECT\\s+\\*\", sql_no_comments, re.IGNORECASE):\n        warnings.append(\"使用了 SELECT *，建议在生产环境明确指定列名\")\n\n    # 检查 WHERE 1=1\n    if re.search(r\"WHERE\\s+1\\s*=\\s*1\", sql_no_comments, re.IGNORECASE):\n        warnings.append(\"使用了 WHERE 1=1，确认是否为动态 SQL 拼接\")\n\n    # 检查没有 WHERE 的 DELETE/UPDATE\n    if re.search(r\"^(DELETE\\s+FROM|UPDATE)\\s+\\w+\", sql_no_comments, re.IGNORECASE | re.MULTILINE):\n        if \"WHERE\" not in sql_upper:\n            warnings.append(\"DELETE/UPDATE 语句没有 WHERE 条件，可能影响全部数据\")\n\n    # 检查 ORDER BY 缺少 ASC/DESC\n    if \"ORDER BY\" in sql_upper:\n        order_match = re.search(r\"ORDER\\s+BY\\s+(.+?)(LIMIT|;|$)\", sql_no_comments,\n                                 re.IGNORECASE | re.DOTALL)\n        if order_match:\n            order_cols = order_match.group(1)\n            if \"ASC\" not in order_cols.upper() and \"DESC\" not in order_cols.upper():\n                suggestions.append(\"ORDER BY 未指定 ASC/DESC，默认 ASC，建议显式指定\")\n\n    # 4. 分号检查\n    if sql_no_comments.strip() and not sql_no_comments.strip().endswith(\";\"):\n        suggestions.append(\"建议在 SQL 语句末尾添加分号 ';'\")\n\n    # 5. 表别名建议\n    if \"JOIN\" in sql_upper:\n        from_match = re.search(r\"FROM\\s+(\\w+)(\\s+(?!JOIN|ON|WHERE|GROUP|ORDER|HAVING|LIMIT)\\w+)?\",\n                                sql_no_comments, re.IGNORECASE)\n        if from_match and not from_match.group(2):\n            suggestions.append(\"多表查询建议为表添加别名以提高可读性\")\n\n    return {\n        \"errors\": errors,\n        \"warnings\": warnings,\n        \"suggestions\": suggestions,\n        \"passed\": len(errors) == 0,\n    }\n\n\ndef format_check_report(result: Dict) -> str:\n    \"\"\"格式化校验报告\"\"\"\n    lines = []\n    lines.append(\"📋 SQL 语法校验报告\")\n    lines.append(\"━\" * 40)\n\n    if result[\"errors\"]:\n        lines.append(\"❌ 错误：\")\n        for e in result[\"errors\"]:\n            lines.append(f\"   - {e}\")\n    else:\n        lines.append(\"✅ 括号匹配：通过\")\n        lines.append(\"✅ 引号匹配：通过\")\n        lines.append(\"✅ 关键字检查：通过\")\n\n    if result[\"warnings\"]:\n        lines.append(\"\")\n        lines.append(\"⚠️  警告：\")\n        for w in result[\"warnings\"]:\n            lines.append(f\"   - {w}\")\n\n    if result[\"suggestions\"]:\n        lines.append(\"\")\n        lines.append(\"💡 建议：\")\n        for s in result[\"suggestions\"]:\n            lines.append(f\"   - {s}\")\n\n    lines.append(\"\")\n    lines.append(\"━\" * 40)\n    status = \"通过\" if result[\"passed\"] else \"未通过\"\n    lines.append(f\"结果：{status}（{len(result['errors'])} 个错误，\"\n                 f\"{len(result['warnings'])} 个警告，{len(result['suggestions'])} 条建议）\")\n\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 表和列提取\n# ============================================================\n\ndef extract_tables_columns(sql: str) -> Dict:\n    \"\"\"提取 SQL 中的表和列\"\"\"\n    sql_no_comments = re.sub(r'--.*?$', '', sql, flags=re.MULTILINE)\n    sql_no_comments = re.sub(r'/\\*.*?\\*/', '', sql_no_comments, flags=re.DOTALL)\n    sql_upper = sql_no_comments.upper()\n\n    tables = {}  # name -> alias\n    columns = set()\n    joins = []\n    where_conditions = []\n\n    # 提取 FROM 子句中的表\n    from_pattern = r\"FROM\\s+([\\w`\\\"']+)(?:\\s+(?:AS\\s+)?([\\w`\\\"']+))?\"\n    for match in re.finditer(from_pattern, sql_no_comments, re.IGNORECASE):\n        table_name = match.group(1).strip(\"`\\\"'\")\n        alias = match.group(2)\n        if alias and alias.upper() not in (\"WHERE\", \"GROUP\", \"ORDER\", \"HAVING\",\n                                             \"LIMIT\", \"JOIN\", \"ON\", \"INNER\", \"LEFT\",\n                                             \"RIGHT\", \"FULL\", \"CROSS\", \"UNION\"):\n            tables[table_name] = alias.strip(\"`\\\"'\")\n        else:\n            tables[table_name] = None\n\n    # 提取 JOIN 中的表\n    join_pattern = r\"(?:INNER|LEFT|RIGHT|FULL|CROSS|NATURAL)?\\s*JOIN\\s+([\\w`\\\"']+)(?:\\s+(?:AS\\s+)?([\\w`\\\"']+))?\"\n    for match in re.finditer(join_pattern, sql_no_comments, re.IGNORECASE):\n        table_name = match.group(1).strip(\"`\\\"'\")\n        alias = match.group(2)\n        if alias and alias.upper() not in (\"ON\", \"USING\", \"WHERE\"):\n            tables[table_name] = alias.strip(\"`\\\"'\")\n        elif table_name not in tables:\n            tables[table_name] = None\n\n    # 提取 JOIN ON 条件\n    on_pattern = r\"JOIN\\s+[\\w`\\\"']+\\s+(?:AS\\s+)?[\\w`\\\"']*\\s*ON\\s+([\\w.]+)\\s*=\\s*([\\w.]+)\"\n    for match in re.finditer(on_pattern, sql_no_comments, re.IGNORECASE):\n        joins.append(f\"{match.group(1)} = {match.group(2)}\")\n\n    # 提取 SELECT 列\n    select_match = re.search(r\"SELECT\\s+(.+?)\\s+FROM\\s\", sql_no_comments,\n                              re.IGNORECASE | re.DOTALL)\n    if select_match:\n        select_cols = select_match.group(1)\n        if \"*\" not in select_cols:\n            for col in re.split(r\",(?![^()]*\\))\", select_cols):\n                col = col.strip()\n                if col:\n                    # 去除 AS 别名\n                    col = re.sub(r\"\\s+AS\\s+\\w+$\", \"\", col, flags=re.IGNORECASE).strip()\n                    columns.add(col)\n\n    # 提取 WHERE 条件\n    where_match = re.search(r\"WHERE\\s+(.+?)(?:GROUP\\s+BY|ORDER\\s+BY|HAVING|LIMIT|;|$)\",\n                            sql_no_comments, re.IGNORECASE | re.DOTALL)\n    if where_match:\n        where_text = where_match.group(1).strip()\n        # 按 AND/OR 分割\n        conditions = re.split(r\"\\s+(?:AND|OR)\\s+\", where_text, flags=re.IGNORECASE)\n        for cond in conditions:\n            cond = cond.strip().rstrip(\")\")\n            if cond:\n                where_conditions.append(cond)\n\n    # 提取 GROUP BY 列\n    group_match = re.search(r\"GROUP\\s+BY\\s+(.+?)(?:HAVING|ORDER\\s+BY|LIMIT|;|$)\",\n                             sql_no_comments, re.IGNORECASE | re.DOTALL)\n    group_cols = []\n    if group_match:\n        for col in group_match.group(1).split(\",\"):\n            col = col.strip()\n            if col:\n                group_cols.append(col)\n\n    # 提取 ORDER BY 列\n    order_match = re.search(r\"ORDER\\s+BY\\s+(.+?)(?:LIMIT|;|$)\",\n                            sql_no_comments, re.IGNORECASE | re.DOTALL)\n    order_cols = []\n    if order_match:\n        for col in order_match.group(1).split(\",\"):\n            col = col.strip()\n            if col:\n                order_cols.append(col)\n\n    return {\n        \"tables\": tables,\n        \"columns\": sorted(columns),\n        \"joins\": joins,\n        \"where_conditions\": where_conditions,\n        \"group_by\": group_cols,\n        \"order_by\": order_cols,\n    }\n\n\ndef format_extract_report(result: Dict) -> str:\n    \"\"\"格式化提取报告\"\"\"\n    lines = []\n    lines.append(\"📊 查询分析\")\n    lines.append(\"━\" * 40)\n\n    lines.append(f\"涉及表（{len(result['tables'])}个）：\")\n    for i, (table, alias) in enumerate(result[\"tables\"].items(), 1):\n        alias_str = f\" (别名 {alias})\" if alias else \"\"\n        lines.append(f\"  {i}. {table}{alias_str}\")\n\n    if result[\"columns\"]:\n        lines.append(\"\")\n        lines.append(f\"涉及列（{len(result['columns'])}个）：\")\n        for col in result[\"columns\"]:\n            lines.append(f\"  - {col}\")\n\n    if result[\"joins\"]:\n        lines.append(\"\")\n        lines.append(\"JOIN 关系：\")\n        for join in result[\"joins\"]:\n            lines.append(f\"  - {join}\")\n\n    if result[\"where_conditions\"]:\n        lines.append(\"\")\n        lines.append(\"WHERE 条件：\")\n        for cond in result[\"where_conditions\"]:\n            lines.append(f\"  - {cond}\")\n\n    if result[\"group_by\"]:\n        lines.append(\"\")\n        lines.append(f\"GROUP BY（{len(result['group_by'])}个字段）：\")\n        for col in result[\"group_by\"]:\n            lines.append(f\"  - {col}\")\n\n    if result[\"order_by\"]:\n        lines.append(\"\")\n        lines.append(f\"ORDER BY（{len(result['order_by'])}个字段）：\")\n        for col in result[\"order_by\"]:\n            lines.append(f\"  - {col}\")\n\n    lines.append(\"\")\n    lines.append(\"━\" * 40)\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 查询结构解释\n# ============================================================\n\ndef explain_sql(sql: str) -> Dict:\n    \"\"\"解释 SQL 查询结构\"\"\"\n    sql_no_comments = re.sub(r'--.*?$', '', sql, flags=re.MULTILINE)\n    sql_no_comments = re.sub(r'/\\*.*?\\*/', '', sql_no_comments, flags=re.DOTALL)\n    sql_upper = sql_no_comments.upper()\n\n    clauses = []\n\n    # 检测各子句\n    if \"WITH\" in sql_upper and re.search(r\"^\\s*WITH\\s\", sql_no_comments, re.IGNORECASE):\n        clauses.append((\"WITH\", \"定义公共表表达式（CTE）\"))\n\n    if re.search(r\"SELECT\\s\", sql_upper):\n        select_match = re.search(r\"SELECT\\s+(.+?)\\s+FROM\\s\", sql_no_comments,\n                                  re.IGNORECASE | re.DOTALL)\n        if select_match:\n            cols_text = select_match.group(1)\n            col_count = len([c for c in cols_text.split(\",\") if c.strip()])\n            has_agg = any(agg in sql_upper for agg in (\"COUNT(\", \"SUM(\", \"AVG(\", \"MIN(\", \"MAX(\"))\n            desc = f\"选择 {col_count} 个字段\"\n            if has_agg:\n                desc += \"，包含聚合函数\"\n            if \"DISTINCT\" in sql_upper:\n                desc += \"，去重\"\n            clauses.append((\"SELECT\", desc))\n\n    if \"FROM\" in sql_upper:\n        from_match = re.search(r\"FROM\\s+([\\w`\\\"']+)\", sql_no_comments, re.IGNORECASE)\n        if from_match:\n            table = from_match.group(1).strip(\"`\\\"'\")\n            join_count = len(re.findall(r\"\\bJOIN\\b\", sql_upper))\n            desc = f\"从 {table} 表查询\"\n            if join_count > 0:\n                desc += f\"，连接 {join_count} 个表\"\n            clauses.append((\"FROM/JOIN\", desc))\n\n    if \"WHERE\" in sql_upper:\n        where_match = re.search(r\"WHERE\\s+(.+?)(?:GROUP\\s+BY|ORDER\\s+BY|HAVING|LIMIT|;|$)\",\n                                sql_no_comments, re.IGNORECASE | re.DOTALL)\n        if where_match:\n            cond_count = len(re.split(r\"\\s+(?:AND|OR)\\s+\", where_match.group(1).strip()))\n            clauses.append((\"WHERE\", f\"筛选 {cond_count} 个条件\"))\n\n    if \"GROUP BY\" in sql_upper:\n        group_match = re.search(r\"GROUP\\s+BY\\s+(.+?)(?:HAVING|ORDER\\s+BY|LIMIT|;|$)\",\n                                 sql_no_comments, re.IGNORECASE | re.DOTALL)\n        if group_match:\n            col_count = len([c for c in group_match.group(1).split(\",\") if c.strip()])\n            clauses.append((\"GROUP BY\", f\"按 {col_count} 个字段分组\"))\n\n    if \"HAVING\" in sql_upper:\n        clauses.append((\"HAVING\", \"筛选分组结果\"))\n\n    if \"ORDER BY\" in sql_upper:\n        order_match = re.search(r\"ORDER\\s+BY\\s+(.+?)(?:LIMIT|;|$)\",\n                                 sql_no_comments, re.IGNORECASE | re.DOTALL)\n        if order_match:\n            col_count = len([c for c in order_match.group(1).split(\",\") if c.strip()])\n            desc_text = order_match.group(1).upper()\n            direction = \"降序\" if \"DESC\" in desc_text else \"升序\"\n            clauses.append((\"ORDER BY\", f\"按 {col_count} 个字段{direction}排序\"))\n\n    if \"LIMIT\" in sql_upper:\n        limit_match = re.search(r\"LIMIT\\s+(\\d+)\", sql_no_comments, re.IGNORECASE)\n        if limit_match:\n            clauses.append((\"LIMIT\", f\"取前 {limit_match.group(1)} 条\"))\n\n    # 执行顺序\n    exec_order = []\n    clause_order = [\"WITH\", \"FROM/JOIN\", \"WHERE\", \"GROUP BY\", \"HAVING\",\n                    \"SELECT\", \"ORDER BY\", \"LIMIT\"]\n    clause_dict = dict(clauses)\n    for name in clause_order:\n        if name in clause_dict:\n            exec_order.append((name, clause_dict[name]))\n\n    return {\n        \"clauses\": clauses,\n        \"exec_order\": exec_order,\n    }\n\n\ndef format_explain_report(result: Dict) -> str:\n    \"\"\"格式化解释报告\"\"\"\n    lines = []\n    lines.append(\"🔍 查询结构解释\")\n    lines.append(\"━\" * 40)\n\n    lines.append(\"执行顺序：\")\n    for i, (name, desc) in enumerate(result[\"exec_order\"], 1):\n        lines.append(f\"  {i}. {name}：{desc}\")\n\n    lines.append(\"\")\n    lines.append(\"子句分析：\")\n    for name, desc in result[\"clauses\"]:\n        lines.append(f\"  - {name}：{desc}\")\n\n    lines.append(\"\")\n    lines.append(\"━\" * 40)\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 压缩 SQL\n# ============================================================\n\ndef minify_sql(sql: str) -> str:\n    \"\"\"压缩 SQL 为单行\"\"\"\n    # 去除注释\n    sql = re.sub(r'--.*?$', '', sql, flags=re.MULTILINE)\n    sql = re.sub(r'/\\*.*?\\*/', '', sql, flags=re.DOTALL)\n    # 合并空白\n    sql = re.sub(r'\\s+', ' ', sql)\n    # 去除逗号后空格前的多余空格（保留逗号后一个空格）\n    sql = re.sub(r'\\s*,\\s*', ', ', sql)\n    # 去除括号内外多余空格\n    sql = re.sub(r'\\s*\\(\\s*', '(', sql)\n    sql = re.sub(r'\\s*\\)\\s*', ')', sql)\n    return sql.strip()\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"SQL 格式化与分析工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--file\", \"-f\", default=\"\", help=\"SQL 文件路径\")\n    parser.add_argument(\"--sql\", \"-s\", default=\"\", help=\"直接输入 SQL 语句\")\n    parser.add_argument(\"--dialect\", \"-d\", default=\"generic\",\n                        choices=list(DIALECTS), help=\"SQL 方言（默认 generic）\")\n    parser.add_argument(\"--indent\", type=int, default=4, help=\"缩进空格数（默认 4）\")\n    parser.add_argument(\"--check\", action=\"store_true\", help=\"语法校验\")\n    parser.add_argument(\"--extract\", action=\"store_true\", help=\"提取表和列\")\n    parser.add_argument(\"--explain\", action=\"store_true\", help=\"解释查询结构\")\n    parser.add_argument(\"--minify\", action=\"store_true\", help=\"压缩输出\")\n    parser.add_argument(\"--all\", action=\"store_true\", help=\"全部功能（格式化+校验+提取+解释）\")\n    parser.add_argument(\"--output\", \"-o\", metavar=\"FILE\", help=\"输出到文件\")\n    args = parser.parse_args()\n\n    # 读取 SQL\n    if args.file:\n        try:\n            with open(args.file, 'r', encoding='utf-8') as f:\n                sql = f.read()\n        except (OSError, IOError) as e:\n            print(f\"错误：无法读取文件 {args.file}: {e}\", file=sys.stderr)\n            sys.exit(1)\n    elif args.sql:\n        sql = args.sql\n    else:\n        print(\"错误：请通过 --file 或 --sql 提供 SQL 输入\", file=sys.stderr)\n        parser.print_help()\n        sys.exit(1)\n\n    if not sql.strip():\n        print(\"错误：SQL 内容为空\", file=sys.stderr)\n        sys.exit(1)\n\n    output_parts = []\n\n    # 格式化（默认或 --all）\n    if not (args.check or args.extract or args.explain or args.minify) or args.all:\n        if args.minify:\n            formatted = minify_sql(sql)\n        else:\n            formatted = format_sql(sql, indent=args.indent, dialect=args.dialect)\n        output_parts.append(formatted)\n\n    # 压缩\n    if args.minify and not args.all:\n        output_parts.append(minify_sql(sql))\n\n    # 校验\n    if args.check or args.all:\n        result = check_sql(sql, dialect=args.dialect)\n        output_parts.append(format_check_report(result))\n\n    # 提取\n    if args.extract or args.all:\n        result = extract_tables_columns(sql)\n        output_parts.append(format_extract_report(result))\n\n    # 解释\n    if args.explain or args.all:\n        result = explain_sql(sql)\n        output_parts.append(format_explain_report(result))\n\n    # 合并输出\n    output = \"\\n\\n\".join(output_parts)\n\n    print(output)\n\n    if args.output:\n        try:\n            with open(args.output, 'w', encoding='utf-8') as f:\n                f.write(output + \"\\n\")\n            print(f\"\\n已保存到：{args.output}\", file=sys.stderr)\n        except (OSError, IOError) as e:\n            print(f\"错误：无法写入文件 {args.output}: {e}\", file=sys.stderr)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-formatted.sql": "SELECT\n    u.id,\n    u.name,\n    u.email,\n    COUNT(o.id) AS order_count,\n    SUM(o.total) AS total_spent\nFROM users u\nLEFT JOIN orders o ON u.id=o.user_id\nWHERE u.status='active'\nAND o.created_at>='2024-01-01'\nGROUP BY\n    u.id,\n    u.name,\n    u.email\nHAVING COUNT(o.id)>5\nORDER BY\n    total_spent DESC\nLIMIT 10\n\n", "examples/sample-analysis-report.md": "SELECT\n    u.id,\n    u.name,\n    u.email,\n    COUNT(o.id) AS order_count,\n    SUM(o.total) AS total_spent\nFROM users u\nLEFT JOIN orders o ON u.id=o.user_id\nWHERE u.status='active'\nAND o.created_at>='2024-01-01'\nGROUP BY\n    u.id,\n    u.name,\n    u.email\nHAVING COUNT(o.id)>5\nORDER BY\n    total_spent DESC\nLIMIT 10\n\n\n📋 SQL 语法校验报告\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n✅ 括号匹配：通过\n✅ 引号匹配：通过\n✅ 关键字检查：通过\n\n💡 建议：\n   - 建议在 SQL 语句末尾添加分号 ';'\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n结果：通过（0 个错误，0 个警告，1 条建议）\n\n📊 查询分析\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n涉及表（2个）：\n  1. users (别名 u)\n  2. orders (别名 o)\n\n涉及列（5个）：\n  - count(o.id)\n  - sum(o.total)\n  - u.email\n  - u.id\n  - u.name\n\nJOIN 关系：\n  - u.id = o.user_id\n\nWHERE 条件：\n  - u.status='active'\n  - o.created_at>='2024-01-01'\n\nGROUP BY（3个字段）：\n  - u.id\n  - u.name\n  - u.email\n\nORDER BY（1个字段）：\n  - total_spent desc\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n🔍 查询结构解释\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n执行顺序：\n  1. FROM/JOIN：从 users 表查询，连接 1 个表\n  2. WHERE：筛选 1 个条件\n  3. GROUP BY：按 3 个字段分组\n  4. HAVING：筛选分组结果\n  5. SELECT：选择 5 个字段，包含聚合函数\n  6. ORDER BY：按 1 个字段降序排序\n  7. LIMIT：取前 10 条\n\n子句分析：\n  - SELECT：选择 5 个字段，包含聚合函数\n  - FROM/JOIN：从 users 表查询，连接 1 个表\n  - WHERE：筛选 1 个条件\n  - GROUP BY：按 3 个字段分组\n  - HAVING：筛选分组结果\n  - ORDER BY：按 1 个字段降序排序\n  - LIMIT：取前 10 条\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n", "examples/sample-query.sql": "select u.id,u.name,u.email,count(o.id) as order_count,sum(o.total) as total_spent from users u left join orders o on u.id=o.user_id where u.status='active' and o.created_at>='2024-01-01' group by u.id,u.name,u.email having count(o.id)>5 order by total_spent desc limit 10\n"}, "file_count": 6, "script_lines": 865}, {"name": "task-prioritizer", "title": "task-prioritizer", "description": "任务优先级排序助手。将一堆待办事项按艾森豪威尔矩阵（紧急/重要）自动分类到四个象限（立即做、计划做、委托做、删除），结合任务耗时、截止日期、上下文依赖，输出执行顺序建议和每日时间分配方案。支持从纯文本/CSV导入待办，识别截止日期和预计耗时，生成优先级排序报告。适用于每日规划、项目任务排序、待办清单整理、工作优先级判断等场景。", "category": "时间管理", "icon": "📋", "color": "#f97316", "skill_md": "---\nname: task-prioritizer\ndescription: '任务优先级排序助手。将一堆待办事项按艾森豪威尔矩阵（紧急/重要）自动分类到四个象限（立即做、计划做、委托做、删除），结合任务耗时、截止日期、上下文依赖，输出执行顺序建议和每日时间分配方案。支持从纯文本/CSV导入待办，识别截止日期和预计耗时，生成优先级排序报告。适用于每日规划、项目任务排序、待办清单整理、工作优先级判断等场景。'\n---\n\n# 任务优先级排序助手\n\n## 一、技能定位\n\n本技能用于**帮助用户从一堆待办事项中理清优先级**。核心价值：\n\n- 艾森豪威尔矩阵：自动按\"紧急×重要\"将任务分到四个象限\n- 智能评分：综合截止日期、预计耗时、依赖关系、任务影响度计算优先级分数\n- 执行顺序：输出推荐的执行顺序，避免\"先做容易的事\"陷阱\n- 时间分配：根据工作时间总量，给出每日/每时段的时间分配建议\n- 一键导入：从纯文本或 CSV 快速导入待办事项\n-  actionable：不是泛泛的\"四象限图\"，而是具体到\"今天先做哪个、花多久\"\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「我有一堆事要做，不知道先做哪个」「帮我排个优先级」\n2. 用户说「今天/这周任务太多了，帮我理一理」\n3. 用户说「帮我用四象限法分类一下这些任务」\n4. 用户说「这些待办哪些该立即做，哪些可以延后」\n5. 用户说「帮我做个今日计划/本周计划」\n6. 用户说「我太忙了，帮我看看哪些可以不做或委托」\n7. 用户说「帮我排一下工作顺序」「这个任务和那个任务哪个先做」\n8. 用户给出一串待办事项，要求排序或分类\n\n## 三、核心方法：艾森豪威尔矩阵\n\n### 四象限分类\n\n| | **紧急** | **不紧急** |\n|---|---|---|\n| **重要** | **Q1 立即做** | **Q2 计划做** |\n| | 截止日期今天/明天 | 有截止日期但较远 |\n| | 阻塞他人/项目 | 长期价值、规划、学习 |\n| | 危机处理 | 预防、关系建设 |\n| **不重要** | **Q3 委托做** | **Q4 删除/减少** |\n| | 紧急但不影响目标 | 忙碌但无价值 |\n| | 部分会议、邮件 | 无意义刷手机、无效会议 |\n| | 可委托他人 | 可直接不做 |\n\n### 分类原则\n\n- **重要**：是否影响核心目标、关键结果、长期价值\n- **紧急**：是否有近期截止日期、是否阻塞他人、是否有时间压力\n- 不要把\"紧急\"等同于\"重要\"——这是优先级判断最常见的错误\n\n## 四、任务评分模型\n\n脚本使用综合评分（0-100），加权计算：\n\n| 维度 | 权重 | 说明 |\n|---|---|---|\n| 截止日期临近度 | 35% | 距截止日期越近分数越高（今天=100，7天=50，30天=20，无截止=10） |\n| 重要度 | 30% | 用户标注的重要程度（高=100/中=60/低=30） |\n| 紧急度 | 20% | 用户标注的紧急程度（立即=100/本周=60/本月=30） |\n| 耗时惩罚 | 10% | 耗时越长分数越低（>2小时扣分，防止拖延困难任务） |\n| 阻塞他人 | 5% | 是否阻塞其他任务或同事（是=+20分） |\n\n## 五、操作步骤\n\n### 步骤 1：收集待办事项\n\n从用户输入中提取任务列表。支持多种输入格式：\n\n**纯文本列表**：\n```\n完成季度报告（周五截止，重要）\n回复客户邮件（今天内）\n准备下周三的演示\n和团队同步进度\n```\n\n**CSV 文件**：\n```csv\n任务,重要度,紧急度,预计耗时,截止日期,备注\n完成季度报告,高,本周,3小时,2026-09-20,\n回复客户邮件,中,今天,30分钟,,客户在等\n准备演示,高,本月,2小时,2026-09-25,\n```\n\n**一句话描述**：\n```\n我现在有：写周报、修一个 bug、回复三条消息、准备明天的会议、报销上个月的发票\n```\n\n### 步骤 2：运行排序脚本\n\n使用 `scripts/prioritize_tasks.py` 进行分析：\n\n```bash\n# 从文本文件读取任务\npython3 scripts/prioritize_tasks.py --file tasks.txt\n\n# 从 CSV 读取任务（带结构化信息）\npython3 scripts/prioritize_tasks.py --file tasks.csv --format csv\n\n# 直接传入任务列表\npython3 scripts/prioritize_tasks.py --task \"完成季度报告\" --task \"回复客户邮件\" --task \"准备演示\"\n\n# 指定每日可用工作时间（默认8小时）\npython3 scripts/prioritize_tasks.py --file tasks.txt --work-hours 6\n\n# 从 stdin 读取\ncat tasks.txt | python3 scripts/prioritize_tasks.py\n\n# 输出 JSON 格式（便于二次处理）\npython3 scripts/prioritize_tasks.py --file tasks.csv --format csv --output json\n```\n\n### 步骤 3：解读分类结果\n\n脚本输出包含：\n\n```\n📋 任务优先级分析报告\n━━━━━━━━━━━━━━━━━━\n总任务数：8 | 总预计耗时：12.5小时\n每日可用时间：6小时\n\n🟥 Q1 立即做（2个，共2.5小时）：\n  1. 回复客户邮件 [30分钟] [今天截止]\n     → 客户在等，阻塞项目进度\n  2. 修登录bug [2小时] [紧急]\n     → 阻塞所有用户登录\n\n🟧 Q2 计划做（3个，共7小时）：\n  3. 完成季度报告 [3小时] [周五截止]\n  4. 准备演示 [2小时] [下周三]\n  5. 写周报 [1小时] [本周五]\n\n🟨 Q3 委托/快做（2个，共1小时）：\n  6. 回复三条消息 [30分钟]\n  7. 报销发票 [30分钟]\n\n🟩 Q4 删除/延后（1个）：\n  8. 整理桌面文件夹\n     → 无明确价值，延后或不做\n\n⏱ 今日执行建议（6小时）：\n  上午（3小时）：\n    1. 回复客户邮件（30分钟）\n    2. 修登录bug（2小时）\n    3. 写周报（30分钟）\n  下午（3小时）：\n    4. 完成季度报告（3小时）\n```\n\n### 步骤 4：与用户确认调整\n\n根据脚本结果，与用户确认：\n\n1. **分类是否合理**：有没有任务放错象限？用户对重要度/紧急度的判断是否和脚本一致？\n2. **截止日期是否准确**：有没有遗漏的截止日期？\n3. **耗时估计是否合理**：任务估计耗时是否需要调整？\n4. **哪些可以委托/删除**：Q3/Q4 任务是否真的可以不做或交给别人？\n\n### 步骤 5：输出最终计划\n\n根据用户反馈调整后，输出最终的：\n- 今日/本周执行顺序\n- 每段时间做什么\n- 哪些任务可以不做\n- 哪些任务需要委托\n\n## 六、输出规范\n\n### 6.1 优先级报告\n\n```\n📋 任务优先级分析报告\n━━━━━━━━━━━━━━━━━━━━━━\n总任务数：X | 总预计耗时：X小时\n每日可用时间：X小时\n\n🟥 Q1 立即做（X个，共X小时）：\n  序号. 任务名 [耗时] [截止日期]\n     → 理由\n\n🟧 Q2 计划做（X个，共X小时）：\n  ...\n\n🟨 Q3 委托/快做（X个，共X小时）：\n  ...\n\n🟩 Q4 删除/延后（X个）：\n  ...\n\n⏱ 今日执行建议（X小时）：\n  上午（X小时）：\n    1. 任务名（耗时）\n    2. 任务名（耗时）\n  下午（X小时）：\n    3. 任务名（耗时）\n```\n\n### 6.2 单任务详细分析\n\n```\n任务：完成季度报告\n━━━━━━━━━━━━━━━━━━━━\n象限：Q2 计划做\n评分：72/100\n预计耗时：3小时\n截止日期：2026-09-20（还剩2天）\n重要度：高 | 紧急度：本周\n阻塞：否\n建议：明天下午集中处理，预留2.5小时\n```\n\n## 七、常见场景处理\n\n### 场景 1：任务太多不知道从哪开始\n**用户**：「我今天有10件事要做，完全不知道从哪开始」\n**处理**：收集所有任务 → 脚本评分排序 → 输出 Q1 任务和今日执行建议 → 帮用户聚焦最紧急的 2-3 件事。\n\n### 场景 2：用四象限法分类\n**用户**：「帮我用四象限法把这些任务分一下」\n**处理**：按紧急×重要分到四个象限 → 标注每类任务的处理策略 → 给出建议。\n\n### 场景 3：识别可以不做的事\n**用户**：「我是不是太忙了？哪些可以不做？」\n**处理**：分析 Q4 象限 → 识别低价值任务 → 建议删除、延后或委托 → 减轻负担。\n\n### 场景 4：制定每日计划\n**用户**：「帮我做个今天的工作计划」\n**处理**：输入待办和可用时间 → 脚本生成时间段分配 → 输出上午/下午各做什么。\n\n### 场景 5：判断两个任务哪个先做\n**用户**：「我应该先写报告还是先回邮件？」\n**处理**：分析两个任务的截止日期、阻塞关系、耗时 → 给出排序建议和理由。\n\n## 八、注意事项\n\n1. **不替用户做决策**：脚本给出建议，最终判断由用户做。如果用户对分类有不同看法，以用户为准。\n2. **重要度需用户确认**：脚本根据关键词推断重要度（如\"老板\"\"客户\"\"截止\"），但可能不准确，需与用户确认。\n3. **避免分析瘫痪**：任务超过 15 个时，建议先只看 Q1，不要被全部分类淹没。\n4. **预留缓冲时间**：实际执行时间通常比预估长，建议计划时间打 8 折，预留缓冲。\n5. **Q2 是重点**：高效人士把时间主要花在 Q2（重要不紧急），而不是一直救火 Q1。\n6. **定期清理 Q4**：每周检查一次 Q4，主动删除低价值任务。\n7. **不要同时做太多**：一次专注一个任务，批量处理 Q3 小任务。\n8. **任务粒度**：超过 2 小时的任务建议拆分成子任务。\n9. **不是 productivity 教条**：这是辅助工具，不是生活方式指导。\n10. **用户偏好优先**：如果用户有特定的做事习惯（如先做简单的），在脚本基础上调整。\n\n## 九、文件结构\n\n```\ntask-prioritizer/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── daily-plan-template.md            # 每日计划模板\n├── scripts/\n│   └── prioritize_tasks.py              # 任务优先级排序脚本\n└── examples/\n    ├── sample-tasks.txt                 # 示例：待办事项列表\n    └── sample-prioritization-report.md   # 示例：优先级报告\n```\n\n## 十、使用示例\n\n### 示例 1：快速排序\n**用户**：「我有这些事要做：写周报、回邮件、修bug、准备会议、报销」\n**AI**：收集任务 → 脚本排序 → 输出四象限分类和今日建议。\n\n### 示例 2：CSV 导入\n**用户**：「这是我的任务清单（附 CSV），帮我排一下」\n**AI**：读取 CSV → 按字段评分 → 输出优先级报告。\n\n### 示例 3：每日计划\n**用户**：「我今天只有4小时工作时间，帮我安排一下」\n**AI**：指定 --work-hours 4 → 输出4小时内的任务分配。\n", "files": {"SKILL.md": "---\nname: task-prioritizer\ndescription: '任务优先级排序助手。将一堆待办事项按艾森豪威尔矩阵（紧急/重要）自动分类到四个象限（立即做、计划做、委托做、删除），结合任务耗时、截止日期、上下文依赖，输出执行顺序建议和每日时间分配方案。支持从纯文本/CSV导入待办，识别截止日期和预计耗时，生成优先级排序报告。适用于每日规划、项目任务排序、待办清单整理、工作优先级判断等场景。'\n---\n\n# 任务优先级排序助手\n\n## 一、技能定位\n\n本技能用于**帮助用户从一堆待办事项中理清优先级**。核心价值：\n\n- 艾森豪威尔矩阵：自动按\"紧急×重要\"将任务分到四个象限\n- 智能评分：综合截止日期、预计耗时、依赖关系、任务影响度计算优先级分数\n- 执行顺序：输出推荐的执行顺序，避免\"先做容易的事\"陷阱\n- 时间分配：根据工作时间总量，给出每日/每时段的时间分配建议\n- 一键导入：从纯文本或 CSV 快速导入待办事项\n-  actionable：不是泛泛的\"四象限图\"，而是具体到\"今天先做哪个、花多久\"\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「我有一堆事要做，不知道先做哪个」「帮我排个优先级」\n2. 用户说「今天/这周任务太多了，帮我理一理」\n3. 用户说「帮我用四象限法分类一下这些任务」\n4. 用户说「这些待办哪些该立即做，哪些可以延后」\n5. 用户说「帮我做个今日计划/本周计划」\n6. 用户说「我太忙了，帮我看看哪些可以不做或委托」\n7. 用户说「帮我排一下工作顺序」「这个任务和那个任务哪个先做」\n8. 用户给出一串待办事项，要求排序或分类\n\n## 三、核心方法：艾森豪威尔矩阵\n\n### 四象限分类\n\n| | **紧急** | **不紧急** |\n|---|---|---|\n| **重要** | **Q1 立即做** | **Q2 计划做** |\n| | 截止日期今天/明天 | 有截止日期但较远 |\n| | 阻塞他人/项目 | 长期价值、规划、学习 |\n| | 危机处理 | 预防、关系建设 |\n| **不重要** | **Q3 委托做** | **Q4 删除/减少** |\n| | 紧急但不影响目标 | 忙碌但无价值 |\n| | 部分会议、邮件 | 无意义刷手机、无效会议 |\n| | 可委托他人 | 可直接不做 |\n\n### 分类原则\n\n- **重要**：是否影响核心目标、关键结果、长期价值\n- **紧急**：是否有近期截止日期、是否阻塞他人、是否有时间压力\n- 不要把\"紧急\"等同于\"重要\"——这是优先级判断最常见的错误\n\n## 四、任务评分模型\n\n脚本使用综合评分（0-100），加权计算：\n\n| 维度 | 权重 | 说明 |\n|---|---|---|\n| 截止日期临近度 | 35% | 距截止日期越近分数越高（今天=100，7天=50，30天=20，无截止=10） |\n| 重要度 | 30% | 用户标注的重要程度（高=100/中=60/低=30） |\n| 紧急度 | 20% | 用户标注的紧急程度（立即=100/本周=60/本月=30） |\n| 耗时惩罚 | 10% | 耗时越长分数越低（>2小时扣分，防止拖延困难任务） |\n| 阻塞他人 | 5% | 是否阻塞其他任务或同事（是=+20分） |\n\n## 五、操作步骤\n\n### 步骤 1：收集待办事项\n\n从用户输入中提取任务列表。支持多种输入格式：\n\n**纯文本列表**：\n```\n完成季度报告（周五截止，重要）\n回复客户邮件（今天内）\n准备下周三的演示\n和团队同步进度\n```\n\n**CSV 文件**：\n```csv\n任务,重要度,紧急度,预计耗时,截止日期,备注\n完成季度报告,高,本周,3小时,2026-09-20,\n回复客户邮件,中,今天,30分钟,,客户在等\n准备演示,高,本月,2小时,2026-09-25,\n```\n\n**一句话描述**：\n```\n我现在有：写周报、修一个 bug、回复三条消息、准备明天的会议、报销上个月的发票\n```\n\n### 步骤 2：运行排序脚本\n\n使用 `scripts/prioritize_tasks.py` 进行分析：\n\n```bash\n# 从文本文件读取任务\npython3 scripts/prioritize_tasks.py --file tasks.txt\n\n# 从 CSV 读取任务（带结构化信息）\npython3 scripts/prioritize_tasks.py --file tasks.csv --format csv\n\n# 直接传入任务列表\npython3 scripts/prioritize_tasks.py --task \"完成季度报告\" --task \"回复客户邮件\" --task \"准备演示\"\n\n# 指定每日可用工作时间（默认8小时）\npython3 scripts/prioritize_tasks.py --file tasks.txt --work-hours 6\n\n# 从 stdin 读取\ncat tasks.txt | python3 scripts/prioritize_tasks.py\n\n# 输出 JSON 格式（便于二次处理）\npython3 scripts/prioritize_tasks.py --file tasks.csv --format csv --output json\n```\n\n### 步骤 3：解读分类结果\n\n脚本输出包含：\n\n```\n📋 任务优先级分析报告\n━━━━━━━━━━━━━━━━━━\n总任务数：8 | 总预计耗时：12.5小时\n每日可用时间：6小时\n\n🟥 Q1 立即做（2个，共2.5小时）：\n  1. 回复客户邮件 [30分钟] [今天截止]\n     → 客户在等，阻塞项目进度\n  2. 修登录bug [2小时] [紧急]\n     → 阻塞所有用户登录\n\n🟧 Q2 计划做（3个，共7小时）：\n  3. 完成季度报告 [3小时] [周五截止]\n  4. 准备演示 [2小时] [下周三]\n  5. 写周报 [1小时] [本周五]\n\n🟨 Q3 委托/快做（2个，共1小时）：\n  6. 回复三条消息 [30分钟]\n  7. 报销发票 [30分钟]\n\n🟩 Q4 删除/延后（1个）：\n  8. 整理桌面文件夹\n     → 无明确价值，延后或不做\n\n⏱ 今日执行建议（6小时）：\n  上午（3小时）：\n    1. 回复客户邮件（30分钟）\n    2. 修登录bug（2小时）\n    3. 写周报（30分钟）\n  下午（3小时）：\n    4. 完成季度报告（3小时）\n```\n\n### 步骤 4：与用户确认调整\n\n根据脚本结果，与用户确认：\n\n1. **分类是否合理**：有没有任务放错象限？用户对重要度/紧急度的判断是否和脚本一致？\n2. **截止日期是否准确**：有没有遗漏的截止日期？\n3. **耗时估计是否合理**：任务估计耗时是否需要调整？\n4. **哪些可以委托/删除**：Q3/Q4 任务是否真的可以不做或交给别人？\n\n### 步骤 5：输出最终计划\n\n根据用户反馈调整后，输出最终的：\n- 今日/本周执行顺序\n- 每段时间做什么\n- 哪些任务可以不做\n- 哪些任务需要委托\n\n## 六、输出规范\n\n### 6.1 优先级报告\n\n```\n📋 任务优先级分析报告\n━━━━━━━━━━━━━━━━━━━━━━\n总任务数：X | 总预计耗时：X小时\n每日可用时间：X小时\n\n🟥 Q1 立即做（X个，共X小时）：\n  序号. 任务名 [耗时] [截止日期]\n     → 理由\n\n🟧 Q2 计划做（X个，共X小时）：\n  ...\n\n🟨 Q3 委托/快做（X个，共X小时）：\n  ...\n\n🟩 Q4 删除/延后（X个）：\n  ...\n\n⏱ 今日执行建议（X小时）：\n  上午（X小时）：\n    1. 任务名（耗时）\n    2. 任务名（耗时）\n  下午（X小时）：\n    3. 任务名（耗时）\n```\n\n### 6.2 单任务详细分析\n\n```\n任务：完成季度报告\n━━━━━━━━━━━━━━━━━━━━\n象限：Q2 计划做\n评分：72/100\n预计耗时：3小时\n截止日期：2026-09-20（还剩2天）\n重要度：高 | 紧急度：本周\n阻塞：否\n建议：明天下午集中处理，预留2.5小时\n```\n\n## 七、常见场景处理\n\n### 场景 1：任务太多不知道从哪开始\n**用户**：「我今天有10件事要做，完全不知道从哪开始」\n**处理**：收集所有任务 → 脚本评分排序 → 输出 Q1 任务和今日执行建议 → 帮用户聚焦最紧急的 2-3 件事。\n\n### 场景 2：用四象限法分类\n**用户**：「帮我用四象限法把这些任务分一下」\n**处理**：按紧急×重要分到四个象限 → 标注每类任务的处理策略 → 给出建议。\n\n### 场景 3：识别可以不做的事\n**用户**：「我是不是太忙了？哪些可以不做？」\n**处理**：分析 Q4 象限 → 识别低价值任务 → 建议删除、延后或委托 → 减轻负担。\n\n### 场景 4：制定每日计划\n**用户**：「帮我做个今天的工作计划」\n**处理**：输入待办和可用时间 → 脚本生成时间段分配 → 输出上午/下午各做什么。\n\n### 场景 5：判断两个任务哪个先做\n**用户**：「我应该先写报告还是先回邮件？」\n**处理**：分析两个任务的截止日期、阻塞关系、耗时 → 给出排序建议和理由。\n\n## 八、注意事项\n\n1. **不替用户做决策**：脚本给出建议，最终判断由用户做。如果用户对分类有不同看法，以用户为准。\n2. **重要度需用户确认**：脚本根据关键词推断重要度（如\"老板\"\"客户\"\"截止\"），但可能不准确，需与用户确认。\n3. **避免分析瘫痪**：任务超过 15 个时，建议先只看 Q1，不要被全部分类淹没。\n4. **预留缓冲时间**：实际执行时间通常比预估长，建议计划时间打 8 折，预留缓冲。\n5. **Q2 是重点**：高效人士把时间主要花在 Q2（重要不紧急），而不是一直救火 Q1。\n6. **定期清理 Q4**：每周检查一次 Q4，主动删除低价值任务。\n7. **不要同时做太多**：一次专注一个任务，批量处理 Q3 小任务。\n8. **任务粒度**：超过 2 小时的任务建议拆分成子任务。\n9. **不是 productivity 教条**：这是辅助工具，不是生活方式指导。\n10. **用户偏好优先**：如果用户有特定的做事习惯（如先做简单的），在脚本基础上调整。\n\n## 九、文件结构\n\n```\ntask-prioritizer/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── daily-plan-template.md            # 每日计划模板\n├── scripts/\n│   └── prioritize_tasks.py              # 任务优先级排序脚本\n└── examples/\n    ├── sample-tasks.txt                 # 示例：待办事项列表\n    └── sample-prioritization-report.md   # 示例：优先级报告\n```\n\n## 十、使用示例\n\n### 示例 1：快速排序\n**用户**：「我有这些事要做：写周报、回邮件、修bug、准备会议、报销」\n**AI**：收集任务 → 脚本排序 → 输出四象限分类和今日建议。\n\n### 示例 2：CSV 导入\n**用户**：「这是我的任务清单（附 CSV），帮我排一下」\n**AI**：读取 CSV → 按字段评分 → 输出优先级报告。\n\n### 示例 3：每日计划\n**用户**：「我今天只有4小时工作时间，帮我安排一下」\n**AI**：指定 --work-hours 4 → 输出4小时内的任务分配。\n", "templates/daily-plan-template.md": "# 每日工作计划模板\n\n> 使用 task-prioritizer 技能生成后，填入以下模板。\n\n## 📅 今日计划\n\n**日期**：YYYY-MM-DD\n**可用时间**：X 小时\n**核心目标**：今天最想完成的 1 件事是？\n\n---\n\n### 🟥 Q1 立即做（紧急且重要）\n\n| 时间 | 任务 | 预计耗时 | 完成 |\n|---|---|---|---|\n| 09:00-09:30 | | | ☐ |\n| 09:30-11:30 | | | ☐ |\n\n### 🟧 Q2 计划做（重要不紧急）\n\n| 时间 | 任务 | 预计耗时 | 完成 |\n|---|---|---|---|\n| 14:00-15:00 | | | ☐ |\n| 15:00-17:00 | | | ☐ |\n\n### 🟨 Q3 快速处理（紧急不重要）\n\n| 时间 | 任务 | 预计耗时 | 完成 |\n|---|---|---|---|\n| | 回邮件/消息 | 15分钟 | ☐ |\n\n### 🟩 Q4 不做/延后\n\n- [ ] \n\n---\n\n## 📝 今日复盘（下班前填写）\n\n- **完成了什么**：\n- **未完成什么**：\n- **明天第一件事**：\n- **效率心得**：\n\n---\n\n*模板由 task-prioritizer 技能提供*\n", "scripts/prioritize_tasks.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\n任务优先级排序脚本\n\n将待办事项按艾森豪威尔矩阵（紧急×重要）分类，综合评分后输出执行顺序。\n\n用法：\n  python3 prioritize_tasks.py --file tasks.txt\n  python3 prioritize_tasks.py --file tasks.csv --format csv\n  python3 prioritize_tasks.py --task \"完成报告\" --task \"回邮件\"\n  python3 prioritize_tasks.py --file tasks.txt --work-hours 6\n  cat tasks.txt | python3 prioritize_tasks.py\n  python3 prioritize_tasks.py --file tasks.csv --format csv --output json\n\"\"\"\n\nimport argparse\nimport csv\nimport json\nimport re\nimport sys\nfrom datetime import datetime, date\nfrom typing import List, Optional, Tuple\n\n\n# ============================================================\n# 任务数据结构\n# ============================================================\n\nclass Task:\n    \"\"\"单个任务\"\"\"\n    def __init__(self, name: str, importance: str = \"中\", urgency: str = \"本周\",\n                 duration_min: int = 30, deadline: Optional[str] = None,\n                 blocks_others: bool = False, note: str = \"\"):\n        self.name = name\n        self.importance = importance  # 高/中/低\n        self.urgency = urgency       # 立即/本周/本月/无\n        self.duration_min = duration_min\n        self.deadline = deadline     # YYYY-MM-DD 或 None\n        self.blocks_others = blocks_others\n        self.note = note\n        self.score = 0.0\n        self.quadrant = \"\"\n\n    def __repr__(self):\n        return f\"<Task {self.name}>\"\n\n\n# ============================================================\n# 文本解析\n# ============================================================\n\n# 重要度关键词\nHIGH_IMPORTANCE = {\"重要\", \"关键\", \"核心\", \"紧急\", \"必须\", \"老板\", \"客户\", \"项目\", \"截止\", \"deadline\"}\nLOW_IMPORTANCE = {\"可以\", \"有空\", \"顺便\", \"不急\", \"有空再\", \"可选\", \"有空的话\"}\n\n# 紧急度关键词\nURGENT_NOW = {\"今天\", \"今天内\", \"立即\", \"马上\", \"立刻\", \"now\", \"今天就要\", \"今天截止\"}\nURGENT_WEEK = {\"本周\", \"这周\", \"周五\", \"周一\", \"明天\", \"后天\", \"这周内\"}\nURGENT_MONTH = {\"本月\", \"这个月\", \"下周\", \"月底\", \"月底前\"}\n\n\ndef parse_duration(text: str) -> int:\n    \"\"\"从文本中解析预计耗时，返回分钟数\"\"\"\n    text = text.lower()\n    # X小时/X h/Xh\n    m = re.search(r'(\\d+(?:\\.\\d+)?)\\s*(?:小时|h|hour)', text)\n    if m:\n        return int(float(m.group(1)) * 60)\n    # X分钟/X min/X分钟\n    m = re.search(r'(\\d+)\\s*(?:分钟|min|分钟)', text)\n    if m:\n        return int(m.group(1))\n    # X个小时\n    m = re.search(r'(\\d+(?:\\.\\d+)?)\\s*个?\\s*小时', text)\n    if m:\n        return int(float(m.group(1)) * 60)\n    return 30  # 默认30分钟\n\n\ndef parse_deadline(text: str) -> Optional[str]:\n    \"\"\"从文本中解析截止日期\"\"\"\n    # YYYY-MM-DD 或 YYYY/MM/DD\n    m = re.search(r'(\\d{4})[-/](\\d{1,2})[-/](\\d{1,2})', text)\n    if m:\n        return f\"{m.group(1)}-{int(m.group(2)):02d}-{int(m.group(3)):02d}\"\n    return None\n\n\ndef infer_importance(text: str) -> str:\n    \"\"\"推断重要度\"\"\"\n    for kw in HIGH_IMPORTANCE:\n        if kw in text:\n            return \"高\"\n    for kw in LOW_IMPORTANCE:\n        if kw in text:\n            return \"低\"\n    return \"中\"\n\n\ndef infer_urgency(text: str) -> str:\n    \"\"\"推断紧急度\"\"\"\n    for kw in URGENT_NOW:\n        if kw in text:\n            return \"立即\"\n    for kw in URGENT_WEEK:\n        if kw in text:\n            return \"本周\"\n    for kw in URGENT_MONTH:\n        if kw in text:\n            return \"本月\"\n    return \"无\"\n\n\ndef parse_text_tasks(text: str) -> List[Task]:\n    \"\"\"从纯文本解析任务列表\"\"\"\n    tasks = []\n    for line in text.strip().split('\\n'):\n        line = line.strip()\n        if not line:\n            continue\n        # 去掉列表符号\n        line = re.sub(r'^[-*•\\d.)\\s]+', '', line).strip()\n        if not line:\n            continue\n\n        duration = parse_duration(line)\n        deadline = parse_deadline(line)\n        importance = infer_importance(line)\n        urgency = infer_urgency(line)\n        blocks = any(kw in line for kw in {\"阻塞\", \"等待\", \"别人\", \"团队在等\"})\n\n        # 清理任务名（去掉耗时/日期等附加信息）\n        name = re.sub(r'\\d+(?:\\.\\d+)?\\s*(?:小时|分钟|h|min)', '', line)\n        name = re.sub(r'\\d{4}[-/]\\d{1,2}[-/]\\d{1,2}', '', name)\n        name = re.sub(r'[（(].*?[）)]', '', name)\n        name = name.strip(' ，。、,')\n\n        if name:\n            tasks.append(Task(\n                name=name,\n                importance=importance,\n                urgency=urgency,\n                duration_min=duration,\n                deadline=deadline,\n                blocks_others=blocks,\n            ))\n    return tasks\n\n\ndef parse_csv_tasks(filepath: str) -> List[Task]:\n    \"\"\"从 CSV 解析任务\"\"\"\n    tasks = []\n    with open(filepath, 'r', encoding='utf-8-sig') as f:\n        reader = csv.DictReader(f)\n        for row in reader:\n            name = row.get('任务', row.get('task', '')).strip()\n            if not name:\n                continue\n            importance = row.get('重要度', row.get('importance', '中')).strip() or '中'\n            urgency = row.get('紧急度', row.get('urgency', '本周')).strip() or '本周'\n            duration_str = row.get('预计耗时', row.get('duration', '30分钟')).strip()\n            duration = parse_duration(duration_str)\n            deadline = row.get('截止日期', row.get('deadline', '')).strip() or None\n            note = row.get('备注', row.get('note', '')).strip()\n            blocks = any(kw in note for kw in {\"阻塞\", \"等待\", \"别人在等\"})\n\n            tasks.append(Task(\n                name=name,\n                importance=importance,\n                urgency=urgency,\n                duration_min=duration,\n                deadline=deadline,\n                blocks_others=blocks,\n                note=note,\n            ))\n    return tasks\n\n\n# ============================================================\n# 评分与分类\n# ============================================================\n\ndef days_until(deadline: Optional[str], today: date) -> float:\n    \"\"\"计算距截止日期的天数\"\"\"\n    if not deadline:\n        return 365  # 无截止日期，很远\n    try:\n        dl = datetime.strptime(deadline, '%Y-%m-%d').date()\n        return (dl - today).days\n    except ValueError:\n        return 365\n\n\ndef importance_score(importance: str) -> float:\n    \"\"\"重要度分数\"\"\"\n    return {\"高\": 100, \"中\": 60, \"低\": 30}.get(importance, 60)\n\n\ndef urgency_score(urgency: str) -> float:\n    \"\"\"紧急度分数\"\"\"\n    return {\"立即\": 100, \"本周\": 60, \"本月\": 30, \"无\": 10}.get(urgency, 60)\n\n\ndef deadline_score(deadline: Optional[str], today: date) -> float:\n    \"\"\"截止日期临近度分数\"\"\"\n    days = days_until(deadline, today)\n    if days < 0:\n        return 100  # 已过期\n    if days == 0:\n        return 100\n    if days <= 1:\n        return 90\n    if days <= 3:\n        return 75\n    if days <= 7:\n        return 55\n    if days <= 14:\n        return 35\n    if days <= 30:\n        return 20\n    return 10\n\n\ndef duration_penalty(duration_min: int) -> float:\n    \"\"\"耗时惩罚（越长分越低，防止拖延困难任务）\"\"\"\n    if duration_min <= 30:\n        return 100\n    if duration_min <= 60:\n        return 85\n    if duration_min <= 120:\n        return 65\n    if duration_min <= 180:\n        return 45\n    return 30\n\n\ndef calculate_score(task: Task, today: date) -> float:\n    \"\"\"计算综合优先级分数（0-100）\"\"\"\n    dl_score = deadline_score(task.deadline, today)\n    imp_score = importance_score(task.importance)\n    urg_score = urgency_score(task.urgency)\n    dur_penalty = duration_penalty(task.duration_min)\n    block_bonus = 20 if task.blocks_others else 0\n\n    score = (\n        dl_score * 0.35 +\n        imp_score * 0.30 +\n        urg_score * 0.20 +\n        dur_penalty * 0.10 +\n        block_bonus * 0.05\n    )\n    return round(min(score, 100), 1)\n\n\ndef assign_quadrant(task: Task) -> str:\n    \"\"\"分配到艾森豪威尔象限\"\"\"\n    important = task.importance in (\"高\",)\n    urgent = task.urgency in (\"立即\",) or deadline_score(task.deadline, date.today()) >= 75\n\n    if important and urgent:\n        return \"Q1\"\n    elif important and not urgent:\n        return \"Q2\"\n    elif not important and urgent:\n        return \"Q3\"\n    else:\n        return \"Q4\"\n\n\n# ============================================================\n# 报告格式化\n# ============================================================\n\nQUADRANT_INFO = {\n    \"Q1\": (\"🟥\", \"立即做\", \"紧急且重要——今天就做\"),\n    \"Q2\": (\"🟧\", \"计划做\", \"重要不紧急——安排时间专注做\"),\n    \"Q3\": (\"🟨\", \"委托/快做\", \"紧急不重要——批量处理或委托\"),\n    \"Q4\": (\"🟩\", \"删除/延后\", \"不紧急不重要——考虑不做\"),\n}\n\n\ndef format_duration(minutes: int) -> str:\n    \"\"\"格式化耗时\"\"\"\n    if minutes < 60:\n        return f\"{minutes}分钟\"\n    hours = minutes / 60\n    if hours == int(hours):\n        return f\"{int(hours)}小时\"\n    return f\"{hours:.1f}小时\"\n\n\ndef format_deadline(deadline: Optional[str], today: date) -> str:\n    \"\"\"格式化截止日期\"\"\"\n    if not deadline:\n        return \"无截止\"\n    days = days_until(deadline, today)\n    if days < 0:\n        return f\"{deadline}（已逾期{-int(days)}天）\"\n    if days == 0:\n        return f\"{deadline}（今天截止）\"\n    if days == 1:\n        return f\"{deadline}（明天截止）\"\n    return f\"{deadline}（还剩{int(days)}天）\"\n\n\ndef format_report(tasks: List[Task], work_hours: float) -> str:\n    \"\"\"格式化优先级报告\"\"\"\n    today = date.today()\n\n    # 计算分数和象限\n    for task in tasks:\n        task.score = calculate_score(task, today)\n        task.quadrant = assign_quadrant(task)\n\n    # 按象限分组\n    quadrants = {\"Q1\": [], \"Q2\": [], \"Q3\": [], \"Q4\": []}\n    for task in tasks:\n        quadrants[task.quadrant].append(task)\n\n    # 每个象限内按分数排序\n    for q in quadrants.values():\n        q.sort(key=lambda t: t.score, reverse=True)\n\n    total_minutes = sum(t.duration_min for t in tasks)\n    work_minutes = int(work_hours * 60)\n\n    lines = []\n    lines.append(\"=\" * 60)\n    lines.append(\"📋 任务优先级分析报告\")\n    lines.append(\"=\" * 60)\n    lines.append(\"\")\n    lines.append(f\"总任务数：{len(tasks)} | 总预计耗时：{format_duration(total_minutes)}\")\n    lines.append(f\"每日可用时间：{work_hours}小时\")\n    lines.append(\"\")\n\n    # 各象限\n    for qid in [\"Q1\", \"Q2\", \"Q3\", \"Q4\"]:\n        q_tasks = quadrants[qid]\n        icon, qname, qdesc = QUADRANT_INFO[qid]\n        q_minutes = sum(t.duration_min for t in q_tasks)\n        lines.append(f\"{icon} {qname}（{len(q_tasks)}个，共{format_duration(q_minutes)}）\")\n        lines.append(f\"   {qdesc}\")\n        if not q_tasks:\n            lines.append(\"   （无）\")\n        for i, t in enumerate(q_tasks, 1):\n            dl = format_deadline(t.deadline, today)\n            note = f\" → {t.note}\" if t.note else \"\"\n            if t.blocks_others:\n                note += \"（阻塞他人）\"\n            lines.append(f\"   {i}. {t.name} [{format_duration(t.duration_min)}] [{dl}]\")\n            lines.append(f\"      评分：{t.score}/100 | 重要度：{t.importance} | 紧急度：{t.urgency}{note}\")\n        lines.append(\"\")\n\n    # 今日执行建议\n    lines.append(f\"⏱ 今日执行建议（{work_hours}小时）：\")\n    remaining = work_minutes\n    line_num = 1\n    # Q1 全部安排\n    for t in quadrants[\"Q1\"]:\n        if remaining <= 0:\n            break\n        actual = min(t.duration_min, remaining)\n        lines.append(f\"  {line_num}. {t.name}（{format_duration(actual)}）\")\n        remaining -= actual\n        line_num += 1\n    # Q2 安排前几个\n    for t in quadrants[\"Q2\"]:\n        if remaining <= 0:\n            break\n        if t.duration_min <= remaining:\n            lines.append(f\"  {line_num}. {t.name}（{format_duration(t.duration_min)}）\")\n            remaining -= t.duration_min\n            line_num += 1\n    # Q3 快速处理\n    if remaining > 0 and quadrants[\"Q3\"]:\n        q3_time = min(remaining, 30)\n        q3_names = \"、\".join(t.name for t in quadrants[\"Q3\"])\n        lines.append(f\"  {line_num}. 快速处理：{q3_names}（{format_duration(q3_time)}）\")\n        remaining -= q3_time\n        line_num += 1\n\n    if remaining > 0:\n        lines.append(f\"  （剩余 {format_duration(remaining)} 可用于休息或处理突发）\")\n\n    lines.append(\"\")\n    lines.append(\"=\" * 60)\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"任务优先级排序工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--file\", \"-f\", help=\"任务文件路径（txt 或 csv）\")\n    parser.add_argument(\"--format\", choices=[\"auto\", \"txt\", \"csv\"], default=\"auto\",\n                        help=\"文件格式（默认自动检测）\")\n    parser.add_argument(\"--task\", \"-t\", action=\"append\", default=[],\n                        help=\"直接传入任务（可多次）\")\n    parser.add_argument(\"--work-hours\", \"-w\", type=float, default=8.0,\n                        help=\"每日可用工作时间（小时，默认8）\")\n    parser.add_argument(\"--output\", choices=[\"text\", \"json\"], default=\"text\",\n                        help=\"输出格式（默认text）\")\n    args = parser.parse_args()\n\n    tasks = []\n\n    # 从 --task 直接传入\n    if args.task:\n
