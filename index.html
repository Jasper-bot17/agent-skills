费\", \"考证\", \"exam\", \"certification\"],\n            \"书籍\": [\"教材\", \"参考书\", \"课本\", \"textbook\"],\n            \"学习工具\": [\"学习\", \"知识付费\", \"得到\", \"极客时间\", \"learning\", \"tool\"],\n        }\n    },\n    \"人情\": {\n        \"icon\": \"🧧\",\n        \"subcategories\": {\n            \"红包\": [\"红包\", \"red packet\", \"red envelope\"],\n            \"礼物\": [\"礼物\", \"礼品\", \"gift\", \"present\"],\n            \"请客\": [\"请客\", \"treat\"],\n            \"捐赠\": [\"捐赠\", \"捐款\", \"慈善\", \"donation\", \"charity\"],\n            \"份子钱\": [\"份子\", \"随礼\", \"wedding gift\"],\n        }\n    },\n    \"通讯\": {\n        \"icon\": \"📱\",\n        \"subcategories\": {\n            \"手机话费\": [\"话费\", \"充值\", \"手机费\", \"phone bill\", \"mobile\"],\n            \"流量包\": [\"流量\", \"data plan\"],\n            \"网络服务\": [\"网络\", \"宽带费\", \"network\"],\n        }\n    },\n    \"金融\": {\n        \"icon\": \"💰\",\n        \"subcategories\": {\n            \"保险\": [\"保险\", \"保费\", \"insurance\", \"premium\"],\n            \"理财\": [\"理财\", \"基金\", \"股票\", \"investment\", \"fund\", \"stock\"],\n            \"贷款还款\": [\"贷款\", \"还款\", \"月供\", \"loan\", \"repayment\"],\n            \"手续费\": [\"手续费\", \"利息\", \"fee\", \"interest\", \"charge\"],\n        }\n    },\n    \"宠物\": {\n        \"icon\": \"🐾\",\n        \"subcategories\": {\n            \"宠物食品\": [\"猫粮\", \"狗粮\", \"宠物粮\", \"pet food\"],\n            \"宠物医疗\": [\"宠物医院\", \"疫苗\", \"驱虫\", \"vet\", \"pet medical\"],\n            \"宠物用品\": [\"猫砂\", \"狗窝\", \"宠物用品\", \"pet supplies\"],\n            \"宠物美容\": [\"宠物美容\", \"洗澡\", \"grooming\"],\n        }\n    },\n    \"育儿\": {\n        \"icon\": \"🚼\",\n        \"subcategories\": {\n            \"奶粉尿布\": [\"奶粉\", \"尿布\", \"尿不湿\", \"milk powder\", \"diaper\"],\n            \"玩具\": [\"玩具\", \"toy\"],\n            \"童装\": [\"童装\", \"宝宝衣服\", \"baby clothes\"],\n            \"早教\": [\"早教\", \"幼儿园\", \"daycare\", \"kindergarten\"],\n            \"学费\": [\"学费\", \"school fee\"],\n        }\n    },\n}\n\n# 商家名称映射（常见商家 -> 类别）\nMERCHANT_CATEGORY = {\n    \"星巴克\": (\"餐饮\", \"零食饮料\"), \"瑞幸\": (\"餐饮\", \"零食饮料\"),\n    \"麦当劳\": (\"餐饮\", \"午餐\"), \"肯德基\": (\"餐饮\", \"午餐\"),\n    \"海底捞\": (\"餐饮\", \"晚餐\"), \"美团\": (\"餐饮\", \"外卖\"),\n    \"饿了么\": (\"餐饮\", \"外卖\"), \"滴滴\": (\"交通\", \"打车\"),\n    \"高德\": (\"交通\", \"打车\"), \"12306\": (\"交通\", \"火车票\"),\n    \"携程\": (\"娱乐\", \"旅游\"), \"飞猪\": (\"娱乐\", \"旅游\"),\n    \"淘宝\": (\"购物\", \"日用品\"), \"天猫\": (\"购物\", \"日用品\"),\n    \"京东\": (\"购物\", \"数码产品\"), \"拼多多\": (\"购物\", \"日用品\"),\n    \"网易云\": (\"娱乐\", \"会员订阅\"), \"qq音乐\": (\"娱乐\", \"会员订阅\"),\n    \"b站\": (\"娱乐\", \"会员订阅\"), \"bilibili\": (\"娱乐\", \"会员订阅\"),\n    \"爱奇艺\": (\"娱乐\", \"会员订阅\"), \"腾讯视频\": (\"娱乐\", \"会员订阅\"),\n    \"steam\": (\"娱乐\", \"游戏充值\"), \"微信\": (\"其他\", \"\"),\n    \"支付宝\": (\"其他\", \"\"), \"apple\": (\"购物\", \"数码产品\"),\n    \"华为\": (\"购物\", \"数码产品\"), \"小米\": (\"购物\", \"数码产品\"),\n}\n\n# 收入关键词\nINCOME_KEYWORDS = [\"工资\", \"薪水\", \"薪资\", \"奖金\", \"收入\", \"报销\", \"退款\",\n                   \"红包收入\", \"理财收益\", \"利息\", \"salary\", \"income\", \"bonus\",\n                   \"refund\", \"reimbursement\", \"dividend\"]\n\n\n# ============================================================\n# 解析器\n# ============================================================\n\nclass ExpenseParser:\n    \"\"\"解析消费记录\"\"\"\n\n    def __init__(self):\n        self.expenses: List[Expense] = []\n\n    def parse_csv(self, filepath: str) -> List[Expense]:\n        \"\"\"解析 CSV 文件\"\"\"\n        expenses = []\n        with open(filepath, \"r\", encoding=\"utf-8-sig\") as f:\n            # 检测是否有表头\n            first_line = f.readline().strip()\n            f.seek(0)\n\n            has_header = False\n            if first_line:\n                # 检查第一行是否包含常见表头关键词\n                header_keywords = [\"date\", \"日期\", \"amount\", \"金额\", \"category\", \"类别\", \"描述\", \"description\"]\n                if any(kw in first_line.lower() for kw in header_keywords):\n                    has_header = True\n\n            if has_header:\n                reader = csv.DictReader(f)\n                for row in reader:\n                    expense = self._parse_csv_row(row)\n                    if expense:\n                        expenses.append(expense)\n            else:\n                # 无表头，按位置解析：date,amount,category,description,payment\n                reader = csv.reader(f)\n                for row in reader:\n                    if len(row) >= 2:\n                        expense = self._parse_plain_row(row)\n                        if expense:\n                            expenses.append(expense)\n\n        return expenses\n\n    def _parse_csv_row(self, row: dict) -> Optional[Expense]:\n        \"\"\"解析 CSV 行（DictReader）\"\"\"\n        # 兼容不同的列名\n        date_str = row.get(\"date\") or row.get(\"日期\") or row.get(\"time\") or \"\"\n        amount_str = row.get(\"amount\") or row.get(\"金额\") or row.get(\"money\") or \"0\"\n        category = row.get(\"category\") or row.get(\"类别\") or row.get(\"分类\") or \"\"\n        description = row.get(\"description\") or row.get(\"描述\") or row.get(\"备注\") or row.get(\"item\") or \"\"\n        payment = row.get(\"payment\") or row.get(\"支付方式\") or row.get(\"method\") or \"\"\n        exp_type = row.get(\"type\") or row.get(\"类型\") or \"\"\n\n        try:\n            amount = float(amount_str)\n        except (ValueError, TypeError):\n            return None\n\n        if amount == 0:\n            return None\n\n        date = self._normalize_date(date_str)\n        if not date:\n            date = date.today().strftime(\"%Y-%m-%d\") if hasattr(date, 'today') else \"2026-01-01\"\n\n        # 判断收入/支出\n        if not exp_type:\n            exp_type = self._detect_type(description, amount)\n\n        # 自动分类\n        if not category or category == \"其他\":\n            category, subcategory = self._auto_categorize(description, amount)\n        else:\n            subcategory = row.get(\"subcategory\") or row.get(\"子类别\") or \"\"\n\n        return Expense(\n            date=date,\n            amount=abs(amount),\n            type=exp_type,\n            category=category,\n            subcategory=subcategory,\n            description=description,\n            payment_method=payment,\n            raw_text=\",\".join(str(v) for v in row.values()),\n        )\n\n    def _parse_plain_row(self, row: list) -> Optional[Expense]:\n        \"\"\"解析无表头的 CSV 行\"\"\"\n        if len(row) < 2:\n            return None\n\n        date_str = row[0].strip()\n        amount_str = row[1].strip()\n        category = row[2].strip() if len(row) > 2 else \"\"\n        description = row[3].strip() if len(row) > 3 else \"\"\n        payment = row[4].strip() if len(row) > 4 else \"\"\n\n        try:\n            amount = float(amount_str)\n        except ValueError:\n            return None\n\n        date = self._normalize_date(date_str)\n        exp_type = self._detect_type(description, amount)\n\n        if not category:\n            category, subcategory = self._auto_categorize(description, amount)\n        else:\n            subcategory = \"\"\n\n        return Expense(\n            date=date,\n            amount=abs(amount),\n            type=exp_type,\n            category=category,\n            subcategory=subcategory,\n            description=description,\n            payment_method=payment,\n            raw_text=\" \".join(row),\n        )\n\n    def parse_text(self, text: str) -> List[Expense]:\n        \"\"\"解析纯文本格式（每行一笔）\"\"\"\n        expenses = []\n        for line in text.strip().split(\"\\n\"):\n            line = line.strip()\n            if not line or line.startswith(\"#\"):\n                continue\n            expense = self._parse_text_line(line)\n            if expense:\n                expenses.append(expense)\n        return expenses\n\n    def _parse_text_line(self, line: str) -> Optional[Expense]:\n        \"\"\"解析单行文本记录\"\"\"\n        # 匹配日期\n        date_match = re.search(\n            r'(\\d{4}[-/年]\\d{1,2}[-/月]\\d{1,2}日?|\\d{1,2}[-/月]\\d{1,2}日?|\\d{1,2}/\\d{1,2})',\n            line\n        )\n        date_str = date_match.group(1) if date_match else \"\"\n        rest = line[date_match.end():].strip() if date_match else line\n\n        # 匹配金额\n        amount_match = re.search(r'(\\d+\\.?\\d*)\\s*(?:元|块|rmb|￥|¥)?', rest, re.IGNORECASE)\n        if not amount_match:\n            return None\n\n        amount = float(amount_match.group(1))\n        # 描述是去掉日期和金额后的部分\n        description = rest[:amount_match.start()].strip() + rest[amount_match.end():].strip()\n        description = description.strip(\" -—,，。.\")\n\n        date = self._normalize_date(date_str)\n        exp_type = self._detect_type(description, amount)\n        category, subcategory = self._auto_categorize(description, amount)\n\n        return Expense(\n            date=date,\n            amount=amount,\n            type=exp_type,\n            category=category,\n            subcategory=subcategory,\n            description=description or line,\n            raw_text=line,\n        )\n\n    @staticmethod\n    def _normalize_date(date_str: str) -> str:\n        \"\"\"将各种日期格式统一为 YYYY-MM-DD\"\"\"\n        if not date_str:\n            return date.today().strftime(\"%Y-%m-%d\")\n\n        date_str = date_str.strip()\n\n        # 2026-09-01 / 2026/09/01 / 2026年9月1日\n        m = re.match(r'(\\d{4})[-/年](\\d{1,2})[-/月](\\d{1,2})', date_str)\n        if m:\n            return f\"{m.group(1)}-{int(m.group(2)):02d}-{int(m.group(3)):02d}\"\n\n        # 09-01 / 9/1 / 9月1日\n        m = re.match(r'(\\d{1,2})[-/月](\\d{1,2})', date_str)\n        if m:\n            month = int(m.group(1))\n            day = int(m.group(2))\n            if 1 <= month <= 12 and 1 <= day <= 31:\n                return f\"2026-{month:02d}-{day:02d}\"\n\n        return date.today().strftime(\"%Y-%m-%d\")\n\n    @staticmethod\n    def _detect_type(description: str, amount: float) -> str:\n        \"\"\"判断是收入还是支出\"\"\"\n        desc_lower = description.lower()\n        for kw in INCOME_KEYWORDS:\n            if kw in desc_lower:\n                return \"收入\"\n        # 负数金额视为收入（退款等）\n        if amount < 0:\n            return \"收入\"\n        return \"支出\"\n\n    @staticmethod\n    def _auto_categorize(description: str, amount: float) -> Tuple[str, str]:\n        \"\"\"根据描述自动分类\"\"\"\n        if not description:\n            return \"其他\", \"\"\n\n        desc_lower = description.lower()\n\n        # 先匹配商家\n        for merchant, (cat, subcat) in MERCHANT_CATEGORY.items():\n            if merchant in desc_lower:\n                return cat, subcat\n\n        # 再匹配关键词\n        best_category = \"其他\"\n        best_subcategory = \"\"\n        best_score = 0\n\n        for cat_name, cat_info in CATEGORY_KEYWORDS.items():\n            for subcat_name, keywords in cat_info[\"subcategories\"].items():\n                for kw in keywords:\n                    if kw in desc_lower:\n                        score = len(kw)  # 更长的关键词匹配更精确\n                        if score > best_score:\n                            best_score = score\n                            best_category = cat_name\n                            best_subcategory = subcat_name\n\n        return best_category, best_subcategory\n\n\n# ============================================================\n# 分析器\n# ============================================================\n\nclass ExpenseAnalyzer:\n    \"\"\"消费记录分析器\"\"\"\n\n    def __init__(self, expenses: List[Expense]):\n        self.expenses = expenses\n        self.result = AnalysisResult()\n\n    def analyze(self, month: Optional[str] = None, week: Optional[str] = None,\n                budget: Optional[float] = None) -> AnalysisResult:\n        \"\"\"执行分析\"\"\"\n        # 过滤时间段\n        filtered = self.expenses\n        if month:\n            filtered = [e for e in filtered if e.date.startswith(month)]\n            self.result.period = f\"{month} 月度\"\n        elif week:\n            # 简化处理：按周过滤需要计算日期范围\n            filtered = [e for e in filtered if e.date.startswith(week[:4])]\n            self.result.period = f\"{week} 周度\"\n        else:\n            self.result.period = \"全部数据\"\n\n        if not filtered:\n            self.result.warnings.append(\"所选时间段内没有消费记录\")\n            return self.result\n\n        # 统计收入支出\n        expenses_only = [e for e in filtered if e.type == \"支出\"]\n        income_only = [e for e in filtered if e.type == \"收入\"]\n\n        self.result.total_expense = sum(e.amount for e in expenses_only)\n        self.result.total_income = sum(e.amount for e in income_only)\n        self.result.balance = self.result.total_income - self.result.total_expense\n        self.result.expense_count = len(expenses_only)\n        self.result.income_count = len(income_only)\n\n        # 计算天数\n        dates = sorted(set(e.date for e in filtered))\n        if dates:\n            first = datetime.strptime(dates[0], \"%Y-%m-%d\")\n            last = datetime.strptime(dates[-1], \"%Y-%m-%d\")\n            self.result.days_in_period = (last - first).days + 1\n        else:\n            self.result.days_in_period = 1\n\n        if self.result.days_in_period > 0:\n            self.result.daily_avg = self.result.total_expense / self.result.days_in_period\n\n        # 最大单笔支出\n        if expenses_only:\n            self.result.max_expense = max(expenses_only, key=lambda e: e.amount)\n\n        # 分类统计\n        for e in expenses_only:\n            if e.category not in self.result.categories:\n                icon = CATEGORY_KEYWORDS.get(e.category, {}).get(\"icon\", \"📦\")\n                self.result.categories[e.category] = CategoryStat(name=f\"{icon} {e.category}\")\n            cat = self.result.categories[e.category]\n            cat.total += e.amount\n            cat.count += 1\n            cat.max_single = max(cat.max_single, e.amount)\n            cat.expenses.append(e)\n            if e.category == \"其他\":\n                self.result.uncategorized.append(e)\n\n        # 计算占比和日均\n        for cat in self.result.categories.values():\n            cat.percentage = (cat.total / self.result.total_expense * 100) if self.result.total_expense > 0 else 0\n            cat.daily_avg = cat.total / self.result.days_in_period if self.result.days_in_period > 0 else 0\n\n        # 每日支出\n        daily = defaultdict(float)\n        for e in expenses_only:\n            daily[e.date] += e.amount\n        self.result.daily_expenses = dict(sorted(daily.items()))\n\n        # Top 5 支出\n        self.result.top_expenses = sorted(expenses_only, key=lambda e: e.amount, reverse=True)[:5]\n\n        # 预算分析\n        if budget and budget > 0:\n            self.result.budget = budget\n            self.result.budget_remaining = budget - self.result.total_expense\n            self.result.budget_usage_pct = (self.result.total_expense / budget * 100) if budget > 0 else 0\n\n        # 异常检测\n        self._detect_anomalies()\n\n        return self.result\n\n    def _detect_anomalies(self):\n        \"\"\"检测异常消费\"\"\"\n        # 单笔超过总支出15%\n        if self.result.max_expense and self.result.total_expense > 0:\n            pct = self.result.max_expense.amount / self.result.total_expense * 100\n            if pct > 15:\n                self.result.warnings.append(\n                    f\"大额支出提醒：{self.result.max_expense.date} \"\n                    f\"{self.result.max_expense.description} ¥{self.result.max_expense.amount:.2f}，\"\n                    f\"占总支出 {pct:.1f}%\"\n                )\n\n        # 某类别占比超过40%\n        for cat in self.result.categories.values():\n            if cat.percentage > 40:\n                self.result.warnings.append(\n                    f\"类别集中：{cat.name} 占比 {cat.percentage:.1f}%，\"\n                    f\"支出 ¥{cat.total:.2f}，建议关注\"\n                )\n\n        # 未分类支出\n        if self.result.uncategorized:\n            self.result.warnings.append(\n                f\"有 {len(self.result.uncategorized)} 笔支出未明确分类（归入「其他」），\"\n                f\"建议补充描述以便更精确分析\"\n            )\n\n\n# ============================================================\n# 报告格式化\n# ============================================================\n\ndef format_report(result: AnalysisResult) -> str:\n    \"\"\"格式化为文本报告\"\"\"\n    lines = []\n    lines.append(\"=\" * 60)\n    lines.append(f\"消费分析报告 - {result.period}\")\n    lines.append(\"=\" * 60)\n    lines.append(\"\")\n\n    # 概览\n    lines.append(\"【本月概览】\")\n    lines.append(f\"  总收入: ¥{result.total_income:,.2f} ({result.income_count} 笔)\")\n    lines.append(f\"  总支出: ¥{result.total_expense:,.2f} ({result.expense_count} 笔)\")\n    lines.append(f\"  结余:   ¥{result.balance:,.2f}\")\n    lines.append(f\"  日均支出: ¥{result.daily_avg:,.2f} (共 {result.days_in_period} 天)\")\n    if result.max_expense:\n        lines.append(f\"  最大单笔: ¥{result.max_expense.amount:,.2f} ({result.max_expense.description})\")\n    if result.budget is not None:\n        status = \"超支\" if result.budget_remaining < 0 else \"正常\"\n        lines.append(f\"  预算执行: ¥{result.total_expense:,.2f} / ¥{result.budget:,.2f} \"\n                     f\"({result.budget_usage_pct:.1f}%) - {status}\")\n        if result.budget_remaining is not None and result.budget_remaining >= 0:\n            lines.append(f\"  剩余预算: ¥{result.budget_remaining:,.2f}\")\n    lines.append(\"\")\n\n    # 分类统计\n    lines.append(\"【分类支出】\")\n    sorted_cats = sorted(result.categories.values(), key=lambda c: c.total, reverse=True)\n    for i, cat in enumerate(sorted_cats, 1):\n        bar = \"█\" * int(cat.percentage / 2) + \"░\" * (25 - int(cat.percentage / 2))\n        lines.append(f\"  {i:2d}. {cat.name:<12} ¥{cat.total:>9,.2f}  \"\n                     f\"{cat.percentage:>5.1f}%  {bar}  ({cat.count}笔)\")\n    lines.append(\"\")\n\n    # 每日趋势（只显示有支出的日期）\n    lines.append(\"【每日支出趋势】\")\n    for d, amount in list(result.daily_expenses.items())[:10]:\n        bar = \"▓\" * min(int(amount / result.daily_avg), 30) if result.daily_avg > 0 else \"\"\n        lines.append(f\"  {d}  ¥{amount:>8,.2f}  {bar}\")\n    if len(result.daily_expenses) > 10:\n        lines.append(f\"  ... 共 {len(result.daily_expenses)} 天有支出记录\")\n    lines.append(\"\")\n\n    # Top 5\n    lines.append(\"【大额支出 Top 5】\")\n    for i, e in enumerate(result.top_expenses, 1):\n        pct = e.amount / result.total_expense * 100 if result.total_expense > 0 else 0\n        lines.append(f\"  {i}. {e.date}  {e.category}>{e.subcategory or '—'}  \"\n                     f\"¥{e.amount:>8,.2f}  ({pct:.1f}%)  {e.description}\")\n    lines.append(\"\")\n\n    # 异常提醒\n    if result.warnings:\n        lines.append(\"【⚠ 异常提醒】\")\n        for w in result.warnings:\n            lines.append(f\"  ⚠ {w}\")\n        lines.append(\"\")\n\n    # 省钱建议（基于数据）\n    lines.append(\"【消费洞察与建议】\")\n    suggestions = _generate_suggestions(result)\n    for i, s in enumerate(suggestions, 1):\n        lines.append(f\"  {i}. {s}\")\n    lines.append(\"\")\n\n    lines.append(\"=\" * 60)\n    lines.append(\"* 本报告由消费记录自动生成，省钱建议仅供参考，不构成投资建议。\")\n    lines.append(\"=\" * 60)\n\n    return \"\\n\".join(lines)\n\n\ndef _generate_suggestions(result: AnalysisResult) -> List[str]:\n    \"\"\"基于数据生成省钱建议\"\"\"\n    suggestions = []\n\n    # 餐饮占比过高\n    food = result.categories.get(\"🍜 餐饮\") or result.categories.get(\"餐饮\")\n    if food and food.percentage > 30:\n        suggestions.append(\n            f\"餐饮支出占比 {food.percentage:.1f}%（¥{food.total:,.2f}），\"\n            f\"建议减少外卖频次，每周自己做饭 2-3 次，预计可省 ¥{food.total * 0.15:,.0f}/月\"\n        )\n\n    # 购物占比过高\n    shopping = result.categories.get(\"🛒 购物\") or result.categories.get(\"购物\")\n    if shopping and shopping.percentage > 20:\n        suggestions.append(\n            f\"购物支出占比 {shopping.percentage:.1f}%（¥{shopping.total:,.2f}），\"\n            f\"建议购物前列清单，设置 24 小时冷静期，避免冲动消费\"\n        )\n\n    # 娱乐占比过高\n    ent = result.categories.get(\"🎮 娱乐\") or result.categories.get(\"娱乐\")\n    if ent and ent.percentage > 15:\n        suggestions.append(\n            f\"娱乐支出占比 {ent.percentage:.1f}%（¥{ent.total:,.2f}），\"\n            f\"建议清理不常用的会员订阅，选择免费替代活动\"\n        )\n\n    # 交通打车\n    transport = result.categories.get(\"🚇 交通\") or result.categories.get(\"交通\")\n    if transport:\n        taxi_count = sum(1 for e in transport.expenses if e.subcategory == \"打车\")\n        if taxi_count >= 5:\n            suggestions.append(\n                f\"本月打车 {taxi_count} 次，建议短途改用公共交通或共享单车，\"\n                f\"预计可省 ¥{taxi_count * 15:,.0f}/月\"\n            )\n\n    # 通用建议\n    if not suggestions:\n        suggestions.append(\"本月消费结构较为均衡，继续保持记账习惯，定期复盘消费趋势\")\n\n    # 预算建议\n    if result.budget and result.budget_remaining is not None and result.budget_remaining < 0:\n        suggestions.append(\n            f\"⚠ 本月已超支 ¥{abs(result.budget_remaining):,.2f}，\"\n            f\"建议下月压缩非必要支出，优先保障必要开支\"\n        )\n\n    return suggestions\n\n\ndef format_json(result: AnalysisResult) -> str:\n    \"\"\"格式化为 JSON\"\"\"\n    data = {\n        \"period\": result.period,\n        \"summary\": {\n            \"total_income\": round(result.total_income, 2),\n            \"total_expense\": round(result.total_expense, 2),\n            \"balance\": round(result.balance, 2),\n            \"expense_count\": result.expense_count,\n            \"income_count\": result.income_count,\n            \"days_in_period\": result.days_in_period,\n            \"daily_avg\": round(result.daily_avg, 2),\n        },\n        \"categories\": {\n            name: {\n                \"total\": round(cat.total, 2),\n                \"count\": cat.count,\n                \"percentage\": round(cat.percentage, 2),\n                \"daily_avg\": round(cat.daily_avg, 2),\n                \"max_single\": round(cat.max_single, 2),\n            }\n            for name, cat in result.categories.items()\n        },\n        \"daily_expenses\": {d: round(a, 2) for d, a in result.daily_expenses.items()},\n        \"top_expenses\": [\n            {\n                \"date\": e.date,\n                \"amount\": round(e.amount, 2),\n                \"category\": e.category,\n                \"subcategory\": e.subcategory,\n                \"description\": e.description,\n            }\n            for e in result.top_expenses\n        ],\n        \"budget\": {\n            \"total\": result.budget,\n            \"spent\": round(result.total_expense, 2),\n            \"remaining\": round(result.budget_remaining, 2) if result.budget_remaining is not None else None,\n            \"usage_pct\": round(result.budget_usage_pct, 2) if result.budget_usage_pct is not None else None,\n        } if result.budget else None,\n        \"warnings\": result.warnings,\n        \"uncategorized_count\": len(result.uncategorized),\n    }\n    return json.dumps(data, ensure_ascii=False, indent=2)\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"个人记账与消费分析工具 - 解析消费记录并生成统计报告\"\n    )\n    parser.add_argument(\"--input\", \"-i\", help=\"输入文件路径（CSV 或文本，默认从 stdin 读取）\")\n    parser.add_argument(\"--month\", \"-m\", help=\"过滤月份，格式 YYYY-MM（如 2026-09）\")\n    parser.add_argument(\"--week\", \"-w\", help=\"过滤周，格式 YYYY-Www（如 2026-W37）\")\n    parser.add_argument(\"--budget\", \"-b\", type=float, help=\"本月总预算（元）\")\n    parser.add_argument(\"--format\", \"-f\", choices=[\"report\", \"json\"], default=\"report\",\n                        help=\"输出格式（默认 report）\")\n    args = parser.parse_args()\n\n    # 读取输入\n    if args.input:\n        try:\n            with open(args.input, \"r\", encoding=\"utf-8-sig\") as f:\n                content = f.read()\n        except FileNotFoundError:\n            print(f\"错误：文件 '{args.input}' 不存在\", file=sys.stderr)\n            sys.exit(1)\n        except Exception as e:\n            print(f\"错误：读取文件失败 - {e}\", file=sys.stderr)\n            sys.exit(1)\n\n        # 根据扩展名判断格式\n        if args.input.lower().endswith(\".csv\"):\n            expense_parser = ExpenseParser()\n            expenses = expense_parser.parse_csv(args.input)\n        else:\n            expense_parser = ExpenseParser()\n            expenses = expense_parser.parse_text(content)\n    else:\n        content = sys.stdin.read()\n        if not content.strip():\n            print(\"错误：输入为空，请提供消费记录\", file=sys.stderr)\n            print(\"\\n用法示例：\", file=sys.stderr)\n            print(\"  python3 analyze_expenses.py --input expenses.csv --month 2026-09\", file=sys.stderr)\n            print(\"  cat expenses.txt | python3 analyze_expenses.py --budget 8000\", file=sys.stderr)\n            sys.exit(1)\n        expense_parser = ExpenseParser()\n        expenses = expense_parser.parse_text(content)\n\n    if not expenses:\n        print(\"错误：未能解析出任何消费记录，请检查输入格式\", file=sys.stderr)\n        sys.exit(1)\n\n    # 分析\n    analyzer = ExpenseAnalyzer(expenses)\n    result = analyzer.analyze(month=args.month, week=args.week, budget=args.budget)\n\n    # 输出\n    if args.format == \"json\":\n        print(format_json(result))\n    else:\n        print(format_report(result))\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-expenses.csv": "date,amount,category,description,payment_method\n2026-09-01,8.00,餐饮,早餐包子豆浆,微信\n2026-09-01,6.00,交通,地铁上下班,公交卡\n2026-09-01,25.00,餐饮,午餐黄焖鸡米饭,支付宝\n2026-09-01,18.00,餐饮,晚餐麻辣烫,微信\n2026-09-02,10.00,餐饮,早餐煎饼果子,微信\n2026-09-02,6.00,交通,地铁,公交卡\n2026-09-02,32.00,餐饮,午餐公司楼下快餐,支付宝\n2026-09-02,28.00,交通,打车回家,滴滴\n2026-09-03,12.00,餐饮,早餐,微信\n2026-09-03,6.00,交通,地铁,公交卡\n2026-09-03,28.00,餐饮,午餐拉面,支付宝\n2026-09-03,45.00,餐饮,晚餐和朋友聚餐,微信\n2026-09-04,156.50,购物,超市采购日用品和食材,支付宝\n2026-09-04,6.00,交通,地铁,公交卡\n2026-09-04,35.00,餐饮,午餐,支付宝\n2026-09-05,0,餐饮,早餐,\n2026-09-05,6.00,交通,地铁,公交卡\n2026-09-05,30.00,餐饮,午餐,支付宝\n2026-09-05,120.00,娱乐,电影票两张,淘票票\n2026-09-05,88.00,餐饮,晚餐火锅,微信\n2026-09-06,25.00,餐饮,早餐+午餐,微信\n2026-09-06,15.00,交通,地铁+公交,公交卡\n2026-09 交通或共享单车，预计可省 ¥80/月\n4. **周末预算控制**：周末日均支出 ¥245.50，建议设置周末单日支出上限（如¥150），避免大额非必要消费\n\n### 预计节省金额\n如采纳以上建议，预计每月可节省 ¥540，占本月支出的 23.0%。\n\n---\n\n## 八、下月预算建议\n\n基于本月消费数据，建议下月预算分配如下：\n\n| 类别 | 本月实际（13天） | 预计全月 | 建议预算 | 调整说明 |\n|---|---|---|---|---|\n| 🍜 餐饮 | ¥1,071.00 | ¥2,462.00 | ¥1,800 | 减少外卖，控制在¥1,800内 |\n| 🚇 交通 | ¥177.00 | ¥407.00 | ¥400 | 保持，减少打车 |\n| 🛒 购物 | ¥611.50 | ¥1,406.00 | ¥800 | 控制非计划性消费 |\n| 🏠 住房 | ¥0.00 | ¥1,200.00 | ¥1,200 | 固定支出 |\n| 🎮 娱乐 | ¥145.00 | ¥333.00 | ¥300 | 保持适度娱乐 |\n| 💊 医疗 | ¥199.00 | ¥199.00 | ¥300 | 预留体检/药品 |\n| 其他 | ¥146.00 | ¥336.00 | ¥200 | 精确分类后应减少 |\n| **合计** | **¥2,349.50** | **¥6,343.00** | **¥5,000** | |\n\n---\n\n*本报告由消费记录自动生成，金额以原始记录为准。如有遗漏请补充记录。*\n*省钱建议仅供参考，不构成任何金融或投资建议。*\n"}, "file_count": 5, "script_lines": 829}, {"name": "file-organizer", "title": "file-organizer", "description": "文件整理助手。扫描指定目录，自动按文件类型（文档、图片、视频、音频、压缩包、代码、安装包等）分类统计，识别大文件、重复文件、长期未使用文件，生成整理方案（按类型/按日期/自定义规则），支持 dry-run 预览和安全执行（移动/归档/删除），输出整理报告。适用于清理下载文件夹、整理桌面、归档项目文件、释放磁盘空间等场景。", "category": "效率工具", "icon": "📁", "color": "#06b6d4", "skill_md": "---\nname: file-organizer\ndescription: '文件整理助手。扫描指定目录，自动按文件类型（文档、图片、视频、音频、压缩包、代码、安装包等）分类统计，识别大文件、重复文件、长期未使用文件，生成整理方案（按类型/按日期/自定义规则），支持 dry-run 预览和安全执行（移动/归档/删除），输出整理报告。适用于清理下载文件夹、整理桌面、归档项目文件、释放磁盘空间等场景。'\n---\n\n# 文件整理助手\n\n## 一、技能定位\n\n本技能用于**自动化扫描、分类和整理本地文件目录**。核心价值：\n\n- 自动识别文件类型并分类统计，无需手动逐个查看\n- 识别大文件、重复文件、长期未使用文件，精准定位空间占用\n- 生成可预览的整理方案（dry-run），确认后再执行，避免误操作\n- 支持多种整理策略：按类型、按日期、按项目、自定义规则\n- 生成整理报告，记录移动/删除/归档的文件清单\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我整理一下下载文件夹」「桌面太乱了，帮我收拾一下」\n2. 用户说「这个目录里文件太多了，帮我分类整理」\n3. 用户说「帮我看看哪些文件占空间大」「找出大文件」「清理磁盘空间」\n4. 用户说「帮我找出重复文件」「这些文件有没有重复的」\n5. 用户说「帮我把文件按日期归档」「按类型分文件夹」\n6. 用户说「这个目录里有什么文件」「帮我分析一下这个文件夹的内容」\n7. 用户说「清理一下临时文件」「删除没用的文件」\n\n## 三、文件分类体系\n\n### 3.1 一级分类（12 类）\n\n| 分类 | 说明 | 典型扩展名 |\n|---|---|---|\n| 文档 | 文字处理、表格、演示、PDF | .doc, .docx, .xls, .xlsx, .ppt, .pptx, .pdf, .txt, .md, .rtf, .odt, .csv |\n| 图片 | 图像、照片、设计稿 | .jpg, .jpeg, .png, .gif, .bmp, .svg, .webp, .ico, .tiff, .psd, .ai, .raw, .heic |\n| 视频 | 视频、电影、动画 | .mp4, .avi, .mkv, .mov, .wmv, .flv, .webm, .m4v, .mpg, .mpeg, .3gp |\n| 音频 | 音乐、录音、播客 | .mp3, .wav, .flac, .aac, .ogg, .wma, .m4a, .ape, .opus, .mid |\n| 压缩包 | 归档、压缩文件 | .zip, .rar, .7z, .tar, .gz, .bz2, .xz, .tgz, .tbz2, .iso |\n| 代码 | 源代码、脚本、配置 | .py, .js, .ts, .java, .c, .cpp, .h, .go, .rs, .rb, .php, .html, .css, .json, .xml, .yaml, .yml, .sh, .sql |\n| 可执行/安装包 | 程序、安装包、镜像 | .exe, .msi, .dmg, .pkg, .deb, .rpm, .appimage, .apk, .bat, .cmd |\n| 电子书 | 电子书、漫画 | .epub, .mobi, .azw, .azw3, .cbz, .cbr, .djvu |\n| 字体 | 字体文件 | .ttf, .otf, .woff, .woff2, .eot |\n| 数据/数据库 | 数据文件、数据库 | .db, .sqlite, .mdb, .accdb, .parquet, .feather, .h5, .mat |\n| 系统/临时 | 系统文件、临时文件、缓存 | .tmp, .temp, .log, .bak, .old, .swp, .swo, .ds_store, .thumbs.db, .lock |\n| 其他 | 未识别类型 | 无匹配扩展名的文件 |\n\n### 3.2 二级分类（部分示例）\n\n- 文档 → 办公文档 / PDF / 纯文本 / Markdown\n- 图片 → 照片 / 截图 / 设计稿 / 图标\n- 视频 → 电影 / 短视频 / 录屏 / 教程\n- 代码 → 前端 / 后端 / 配置 / 脚本\n\n## 四、操作步骤\n\n### 步骤 1：确认整理范围和安全边界\n\n1. 确认用户要整理的目录路径（必须是明确的绝对路径或相对路径）\n2. 确认整理范围：仅当前目录 / 递归子目录 / 排除某些子目录\n3. 确认操作模式：\n   - **仅分析**：只扫描统计，不移动/删除任何文件\n   - **预览（dry-run）**：生成整理方案，展示将移动/删除的文件，但不实际执行\n   - **执行**：实际移动/删除文件（需用户明确确认）\n4. **安全检查**：\n   - 禁止整理系统关键目录（`/`, `/usr`, `/etc`, `/bin`, `/sbin`, `/var` 等）\n   - 禁止整理当前工作目录的上级目录（避免误操作）\n   - 删除操作必须二次确认，且默认先移到回收站/临时目录而非直接删除\n   - 隐藏文件（`.` 开头）默认不移动，除非用户明确要求\n\n### 步骤 2：扫描目录并生成统计\n\n使用 `scripts/organize_files.py` 扫描目录：\n\n```bash\n# 仅分析（统计分类、大小、大文件）\npython3 scripts/organize_files.py --dir /path/to/folder --mode analyze\n\n# 预览整理方案（dry-run，不实际移动）\npython3 scripts/organize_files.py --dir /path/to/folder --mode dry-run --strategy type\n\n# 执行整理（按类型分类）\npython3 scripts/organize_files.py --dir /path/to/folder --mode execute --strategy type\n\n# 按日期归档\npython3 scripts/organize_files.py --dir /path/to/folder --mode dry-run --strategy date\n\n# 找出大文件（>100MB）\npython3 scripts/organize_files.py --dir /path/to/folder --mode analyze --large-threshold 100\n\n# 排除特定目录\npython3 scripts/organize_files.py --dir /path/to/folder --mode analyze --exclude node_modules,.git,__pycache__\n```\n\n扫描结果包含：\n- 文件总数、总大小、目录数\n- 按类型分类的文件数量和占用空间\n- Top 10 大文件\n- 按修改时间分布（最近7天/30天/90天/90天以上）\n- 重复文件检测（基于文件大小+MD5，可选）\n- 长期未使用文件（>90天未访问，可选）\n\n### 步骤 3：选择整理策略\n\n根据扫描结果和用户需求，选择整理策略：\n\n| 策略 | 说明 | 适用场景 |\n|---|---|---|\n| `type`（按类型） | 创建 `文档/`、`图片/`、`视频/` 等子目录，按文件类型移动 | 通用整理、下载文件夹、桌面 |\n| `date`（按日期） | 创建 `2024-01/`、`2024-02/` 等子目录，按修改日期归档 | 照片归档、长期文件归档 |\n| `type-date`（类型+日期） | 先按类型分，类型内再按日期分 | 大量混合文件的深度整理 |\n| `project`（按项目） | 根据文件名关键词或用户指定规则分组 | 项目文件整理 |\n| `custom`（自定义） | 用户自定义分类规则 | 特殊需求 |\n\n### 步骤 4：生成整理方案并预览\n\n1. 基于选择的策略，生成每个文件的目标路径\n2. 处理文件名冲突：\n   - 同名文件自动重命名（`filename (1).ext`、`filename (2).ext`）\n   - 或提示用户选择覆盖/跳过/重命名\n3. 生成整理方案摘要：\n   - 将移动的文件数量和总大小\n   - 将创建的目录列表\n   - 每个分类的文件数量\n   - 预计释放/整理的空间\n4. **以 dry-run 模式展示方案**，列出将移动的文件（或前 50 个，超出部分汇总）\n5. 请用户确认后再执行\n\n### 步骤 5：执行整理（需用户确认）\n\n1. 用户明确确认后，切换到 `execute` 模式\n2. 按方案创建目标目录\n3. 逐个移动文件（使用 `shutil.move`，跨文件系统也能处理）\n4. 记录每个文件的操作结果（成功/失败/跳过）\n5. 处理失败文件：记录原因，不中断整体流程\n6. 执行完成后，生成整理报告\n\n### 步骤 6：生成整理报告\n\n整理报告包含：\n\n```\n📊 文件整理报告\n━━━━━━━━━━━━━━━━━━━━\n整理目录：/path/to/folder\n整理时间：2026-09-15 14:30:00\n整理策略：按类型分类\n\n📈 整理前统计：\n  文件总数：247 个\n  总大小：3.2 GB\n  目录数：12 个\n\n📁 分类统计：\n  文档：45 个 (120 MB)\n  图片：89 个 (350 MB)\n  视频：12 个 (2.1 GB)\n  音频：23 个 (180 MB)\n  压缩包：18 个 (280 MB)\n  代码：35 个 (45 MB)\n  其他：25 个 (125 MB)\n\n🔝 Top 5 大文件：\n  1. movie.mp4 - 1.2 GB (视频)\n  2. backup.zip - 450 MB (压缩包)\n  ...\n\n✅ 执行结果：\n  成功移动：235 个文件\n  跳过（已存在）：8 个\n  失败：4 个（见下方详情）\n  创建目录：7 个\n\n⚠ 失败文件：\n  - /path/to/file1.ext：权限不足\n  - /path/to/file2.ext：文件被占用\n\n📂 创建的目录结构：\n  folder/\n  ├── 文档/\n  ├── 图片/\n  ├── 视频/\n  ├── 音频/\n  ├── 压缩包/\n  ├── 代码/\n  └── 其他/\n```\n\n## 五、输出规范\n\n### 5.1 分析模式输出\n\n```\n📂 目录分析：/path/to/folder\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n📊 总览：文件 247 个 | 总大小 3.2 GB | 目录 12 个\n\n📁 按类型分布：\n  类型      数量    大小      占比\n  ─────────────────────────────\n  视频      12      2.1 GB    65.6%\n  图片      89      350 MB    10.9%\n  压缩包    18      280 MB    8.8%\n  音频      23      180 MB    5.6%\n  文档      45      120 MB    3.8%\n  其他      25      125 MB    3.9%\n  代码      35      45 MB     1.4%\n\n🔝 Top 10 大文件：\n  1. movie.mp4              1.2 GB    视频    2026-01-15\n  2. backup_2025.zip        450 MB    压缩包  2025-12-01\n  ...\n\n📅 按修改时间分布：\n  最近7天：12 个 (85 MB)\n  7-30天：34 个 (420 MB)\n  30-90天：56 个 (680 MB)\n  90天以上：145 个 (2.1 GB)\n\n💡 整理建议：\n  - 视频文件占 65.6% 空间，优先处理\n  - 90天以上未修改的文件有 145 个，可考虑归档\n  - 检测到 3 个可能的重复文件（建议进一步确认）\n```\n\n### 5.2 预览模式（dry-run）输出\n\n```\n🔍 整理方案预览（dry-run，未实际执行）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n整理策略：按类型分类\n目标目录：/path/to/folder\n\n📋 将执行的操作：\n  创建目录：7 个\n  移动文件：235 个 (3.1 GB)\n  跳过文件：12 个（已在目标位置）\n\n📂 目录结构预览：\n  folder/\n  ├── 文档/ (45 个文件, 120 MB)\n  ├── 图片/ (89 个文件, 350 MB)\n  ├── 视频/ (12 个文件, 2.1 GB)\n  ├── 音频/ (23 个文件, 180 MB)\n  ├── 压缩包/ (18 个文件, 280 MB)\n  ├── 代码/ (35 个文件, 45 MB)\n  └── 其他/ (13 个文件, 25 MB)\n\n📝 移动示例（前 10 个）：\n  report.pdf → 文档/report.pdf\n  photo.jpg → 图片/photo.jpg\n  video.mp4 → 视频/video.mp4\n  ...\n\n⚠ 注意：以上为预览，未实际移动任何文件。\n确认执行后将实际移动文件。是否继续？\n```\n\n## 六、常见场景处理\n\n### 场景 1：整理下载文件夹\n**用户**：「帮我整理一下 ~/Downloads」\n**处理**：扫描 → 按类型分类 → dry-run 预览 → 用户确认 → 执行 → 生成报告。默认排除 `.app`、`.dmg` 等已安装的安装包（可提示是否删除）。\n\n### 场景 2：清理桌面\n**用户**：「桌面太乱了，帮我收拾一下」\n**处理**：扫描桌面 → 识别快捷方式/文件/文件夹 → 按类型分类 → 注意保留系统文件和快捷方式 → dry-run → 执行。\n\n### 场景 3：找出大文件释放空间\n**用户**：「磁盘快满了，帮我找出大文件」\n**处理**：扫描指定目录（如 home 目录）→ 按大小排序 → 列出 Top 20 大文件 → 标注文件类型和最后修改时间 → 建议可删除/归档的文件 → 用户确认后处理。\n\n### 场景 4：照片按日期归档\n**用户**：「帮我把这些照片按日期整理」\n**处理**：扫描图片目录 → 优先读取 EXIF 拍摄日期，无 EXIF 则用修改日期 → 创建 `YYYY-MM/` 目录 → 移动照片 → dry-run → 执行 → 报告。\n\n### 场景 5：检测重复文件\n**用户**：「帮我看看这个目录里有没有重复的文件」\n**处理**：扫描目录 → 先按文件大小分组（大小相同才可能重复）→ 对大小相同的文件计算 MD5 → 列出重复文件组 → 建议保留最新/最大/路径最短的版本 → 用户确认后删除多余副本。\n\n### 场景 6：清理临时/缓存文件\n**用户**：「帮我清理一下临时文件和缓存」\n**处理**：扫描常见临时目录（`/tmp`、`~/.cache`、项目的 `node_modules`、`__pycache__`、`.git` 等）→ 统计可清理空间 → 列出将删除的内容 → 用户确认 → 删除（或移到回收站）→ 报告释放空间。\n\n## 七、安全规则\n\n### 7.1 绝对禁止\n- 禁止整理或删除系统关键目录（`/`, `/usr`, `/etc`, `/bin`, `/sbin`, `/lib`, `/var`, `/boot`, `/dev`, `/proc`, `/sys`）\n- 禁止删除用户主目录下的隐藏配置文件（`.bashrc`, `.profile`, `.ssh`, `.config` 等），除非用户明确要求\n- 禁止在未确认的情况下执行删除操作\n- 禁止跨用户目录操作（如从 `/home/user1` 移到 `/home/user2`）\n\n### 7.2 默认安全策略\n- **删除 = 移动到回收站**：默认将\"删除\"的文件移到 `~/.Trash/` 或临时目录，而非直接 `rm`\n- **dry-run 优先**：所有移动/删除操作先预览，用户确认后再执行\n- **隐藏文件保护**：`.` 开头的文件默认不移动、不删除\n- **文件名冲突**：遇到同名文件自动重命名，不覆盖\n- **操作日志**：记录所有移动/删除操作，可回滚（生成 undo 脚本）\n- **大小阈值**：单个文件 > 1GB 或总操作 > 5GB 时，额外提醒用户确认\n\n### 7.3 回滚机制\n- 每次执行整理时，生成 `undo_YYYYMMDD_HHMMSS.sh` 脚本\n- 脚本记录所有移动操作的源路径和目标路径\n- 用户可运行该脚本将文件移回原位\n- 回滚脚本保存在整理目录的 `.file-organizer-backup/` 下\n\n## 八、注意事项\n\n1. **路径确认**：整理前必须确认目录路径正确，避免整理错误目录。\n2. **权限检查**：如目录需要管理员权限，提示用户，不擅自使用 `sudo`。\n3. **大文件处理**：移动大文件（>1GB）可能耗时较长，告知用户预计时间。\n4. **跨文件系统**：源和目标在不同磁盘/分区时，移动 = 复制+删除，耗时更长且需要足够空间。\n5. **文件占用**：被其他程序占用的文件可能无法移动，记录并跳过。\n6. **符号链接**：默认不跟随符号链接，避免循环引用和误操作。\n7. **空目录处理**：整理后留下的空目录，可提示用户是否删除。\n8. **不替代专业工具**：本技能适用于常规文件整理，不替代专业的数据恢复、磁盘分区等工具。\n9. **隐私保护**：整理过程中不读取文件内容，仅基于文件名、扩展名、大小、时间等元数据操作。\n10. **操作不可逆提醒**：虽然提供回滚脚本，但删除（移到回收站）的文件可能被系统清理，重要文件建议先备份。\n\n## 九、文件结构\n\n```\nfile-organizer/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── organization-report-template.md   # 整理报告模板\n├── scripts/\n│   └── organize_files.py                 # 文件扫描、分类、整理脚本（支持 analyze/dry-run/execute）\n└── examples/\n    ├── sample-directory-structure.txt    # 示例：整理前的目录结构\n    └── sample-organization-report.md     # 示例：整理后的报告\n```\n\n## 十、使用示例\n\n### 示例 1：整理下载文件夹\n**用户**：「帮我整理一下 ~/Downloads，文件太乱了」\n**AI**：\n1. 确认路径：`/home/user/Downloads`\n2. 扫描分析：247 个文件，3.2 GB，视频占 65.6%\n3. 建议策略：按类型分类\n4. dry-run 预览：将创建 7 个目录，移动 235 个文件\n5. 用户确认后执行\n6. 生成整理报告：成功 235 个，跳过 8 个，失败 4 个\n\n### 示例 2：找出大文件\n**用户**：「帮我看看 home 目录下哪些文件占空间最大」\n**AI**：\n1. 扫描 `/home/user`（排除 `.cache`、`.git` 等）\n2. 列出 Top 20 大文件，标注类型、大小、最后修改时间\n3. 建议：`video.mp4` (1.2GB, 2025年) 可归档/删除，`backup.zip` (450MB) 可移到外接硬盘\n4. 用户选择处理后，执行移动/删除\n\n### 示例 3：照片按日期归档\n**用户**：「把 ~/Photos 里的照片按拍摄日期整理」\n**AI**：\n1. 扫描图片文件（.jpg, .png, .heic 等）\n2. 读取 EXIF 拍摄日期，无 EXIF 用修改日期\n3. 创建 `2024-01/`、`2024-02/` 等目录\n4. dry-run 预览：156 张照片将分到 12 个月份目录\n5. 用户确认后执行\n6. 报告：成功 150 张，跳过 6 张（无日期信息，放入 `未分类/`）\n\n### 示例 4：仅分析不整理\n**用户**：「帮我看看这个项目目录里都有什么文件，不用整理」\n**AI**：\n1. 扫描目录，仅 analyze 模式\n2. 输出分类统计、大文件、时间分布\n3. 给出整理建议（但不执行）\n", "files": {"SKILL.md": "---\nname: file-organizer\ndescription: '文件整理助手。扫描指定目录，自动按文件类型（文档、图片、视频、音频、压缩包、代码、安装包等）分类统计，识别大文件、重复文件、长期未使用文件，生成整理方案（按类型/按日期/自定义规则），支持 dry-run 预览和安全执行（移动/归档/删除），输出整理报告。适用于清理下载文件夹、整理桌面、归档项目文件、释放磁盘空间等场景。'\n---\n\n# 文件整理助手\n\n## 一、技能定位\n\n本技能用于**自动化扫描、分类和整理本地文件目录**。核心价值：\n\n- 自动识别文件类型并分类统计，无需手动逐个查看\n- 识别大文件、重复文件、长期未使用文件，精准定位空间占用\n- 生成可预览的整理方案（dry-run），确认后再执行，避免误操作\n- 支持多种整理策略：按类型、按日期、按项目、自定义规则\n- 生成整理报告，记录移动/删除/归档的文件清单\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我整理一下下载文件夹」「桌面太乱了，帮我收拾一下」\n2. 用户说「这个目录里文件太多了，帮我分类整理」\n3. 用户说「帮我看看哪些文件占空间大」「找出大文件」「清理磁盘空间」\n4. 用户说「帮我找出重复文件」「这些文件有没有重复的」\n5. 用户说「帮我把文件按日期归档」「按类型分文件夹」\n6. 用户说「这个目录里有什么文件」「帮我分析一下这个文件夹的内容」\n7. 用户说「清理一下临时文件」「删除没用的文件」\n\n## 三、文件分类体系\n\n### 3.1 一级分类（12 类）\n\n| 分类 | 说明 | 典型扩展名 |\n|---|---|---|\n| 文档 | 文字处理、表格、演示、PDF | .doc, .docx, .xls, .xlsx, .ppt, .pptx, .pdf, .txt, .md, .rtf, .odt, .csv |\n| 图片 | 图像、照片、设计稿 | .jpg, .jpeg, .png, .gif, .bmp, .svg, .webp, .ico, .tiff, .psd, .ai, .raw, .heic |\n| 视频 | 视频、电影、动画 | .mp4, .avi, .mkv, .mov, .wmv, .flv, .webm, .m4v, .mpg, .mpeg, .3gp |\n| 音频 | 音乐、录音、播客 | .mp3, .wav, .flac, .aac, .ogg, .wma, .m4a, .ape, .opus, .mid |\n| 压缩包 | 归档、压缩文件 | .zip, .rar, .7z, .tar, .gz, .bz2, .xz, .tgz, .tbz2, .iso |\n| 代码 | 源代码、脚本、配置 | .py, .js, .ts, .java, .c, .cpp, .h, .go, .rs, .rb, .php, .html, .css, .json, .xml, .yaml, .yml, .sh, .sql |\n| 可执行/安装包 | 程序、安装包、镜像 | .exe, .msi, .dmg, .pkg, .deb, .rpm, .appimage, .apk, .bat, .cmd |\n| 电子书 | 电子书、漫画 | .epub, .mobi, .azw, .azw3, .cbz, .cbr, .djvu |\n| 字体 | 字体文件 | .ttf, .otf, .woff, .woff2, .eot |\n| 数据/数据库 | 数据文件、数据库 | .db, .sqlite, .mdb, .accdb, .parquet, .feather, .h5, .mat |\n| 系统/临时 | 系统文件、临时文件、缓存 | .tmp, .temp, .log, .bak, .old, .swp, .swo, .ds_store, .thumbs.db, .lock |\n| 其他 | 未识别类型 | 无匹配扩展名的文件 |\n\n### 3.2 二级分类（部分示例）\n\n- 文档 → 办公文档 / PDF / 纯文本 / Markdown\n- 图片 → 照片 / 截图 / 设计稿 / 图标\n- 视频 → 电影 / 短视频 / 录屏 / 教程\n- 代码 → 前端 / 后端 / 配置 / 脚本\n\n## 四、操作步骤\n\n### 步骤 1：确认整理范围和安全边界\n\n1. 确认用户要整理的目录路径（必须是明确的绝对路径或相对路径）\n2. 确认整理范围：仅当前目录 / 递归子目录 / 排除某些子目录\n3. 确认操作模式：\n   - **仅分析**：只扫描统计，不移动/删除任何文件\n   - **预览（dry-run）**：生成整理方案，展示将移动/删除的文件，但不实际执行\n   - **执行**：实际移动/删除文件（需用户明确确认）\n4. **安全检查**：\n   - 禁止整理系统关键目录（`/`, `/usr`, `/etc`, `/bin`, `/sbin`, `/var` 等）\n   - 禁止整理当前工作目录的上级目录（避免误操作）\n   - 删除操作必须二次确认，且默认先移到回收站/临时目录而非直接删除\n   - 隐藏文件（`.` 开头）默认不移动，除非用户明确要求\n\n### 步骤 2：扫描目录并生成统计\n\n使用 `scripts/organize_files.py` 扫描目录：\n\n```bash\n# 仅分析（统计分类、大小、大文件）\npython3 scripts/organize_files.py --dir /path/to/folder --mode analyze\n\n# 预览整理方案（dry-run，不实际移动）\npython3 scripts/organize_files.py --dir /path/to/folder --mode dry-run --strategy type\n\n# 执行整理（按类型分类）\npython3 scripts/organize_files.py --dir /path/to/folder --mode execute --strategy type\n\n# 按日期归档\npython3 scripts/organize_files.py --dir /path/to/folder --mode dry-run --strategy date\n\n# 找出大文件（>100MB）\npython3 scripts/organize_files.py --dir /path/to/folder --mode analyze --large-threshold 100\n\n# 排除特定目录\npython3 scripts/organize_files.py --dir /path/to/folder --mode analyze --exclude node_modules,.git,__pycache__\n```\n\n扫描结果包含：\n- 文件总数、总大小、目录数\n- 按类型分类的文件数量和占用空间\n- Top 10 大文件\n- 按修改时间分布（最近7天/30天/90天/90天以上）\n- 重复文件检测（基于文件大小+MD5，可选）\n- 长期未使用文件（>90天未访问，可选）\n\n### 步骤 3：选择整理策略\n\n根据扫描结果和用户需求，选择整理策略：\n\n| 策略 | 说明 | 适用场景 |\n|---|---|---|\n| `type`（按类型） | 创建 `文档/`、`图片/`、`视频/` 等子目录，按文件类型移动 | 通用整理、下载文件夹、桌面 |\n| `date`（按日期） | 创建 `2024-01/`、`2024-02/` 等子目录，按修改日期归档 | 照片归档、长期文件归档 |\n| `type-date`（类型+日期） | 先按类型分，类型内再按日期分 | 大量混合文件的深度整理 |\n| `project`（按项目） | 根据文件名关键词或用户指定规则分组 | 项目文件整理 |\n| `custom`（自定义） | 用户自定义分类规则 | 特殊需求 |\n\n### 步骤 4：生成整理方案并预览\n\n1. 基于选择的策略，生成每个文件的目标路径\n2. 处理文件名冲突：\n   - 同名文件自动重命名（`filename (1).ext`、`filename (2).ext`）\n   - 或提示用户选择覆盖/跳过/重命名\n3. 生成整理方案摘要：\n   - 将移动的文件数量和总大小\n   - 将创建的目录列表\n   - 每个分类的文件数量\n   - 预计释放/整理的空间\n4. **以 dry-run 模式展示方案**，列出将移动的文件（或前 50 个，超出部分汇总）\n5. 请用户确认后再执行\n\n### 步骤 5：执行整理（需用户确认）\n\n1. 用户明确确认后，切换到 `execute` 模式\n2. 按方案创建目标目录\n3. 逐个移动文件（使用 `shutil.move`，跨文件系统也能处理）\n4. 记录每个文件的操作结果（成功/失败/跳过）\n5. 处理失败文件：记录原因，不中断整体流程\n6. 执行完成后，生成整理报告\n\n### 步骤 6：生成整理报告\n\n整理报告包含：\n\n```\n📊 文件整理报告\n━━━━━━━━━━━━━━━━━━━━\n整理目录：/path/to/folder\n整理时间：2026-09-15 14:30:00\n整理策略：按类型分类\n\n📈 整理前统计：\n  文件总数：247 个\n  总大小：3.2 GB\n  目录数：12 个\n\n📁 分类统计：\n  文档：45 个 (120 MB)\n  图片：89 个 (350 MB)\n  视频：12 个 (2.1 GB)\n  音频：23 个 (180 MB)\n  压缩包：18 个 (280 MB)\n  代码：35 个 (45 MB)\n  其他：25 个 (125 MB)\n\n🔝 Top 5 大文件：\n  1. movie.mp4 - 1.2 GB (视频)\n  2. backup.zip - 450 MB (压缩包)\n  ...\n\n✅ 执行结果：\n  成功移动：235 个文件\n  跳过（已存在）：8 个\n  失败：4 个（见下方详情）\n  创建目录：7 个\n\n⚠ 失败文件：\n  - /path/to/file1.ext：权限不足\n  - /path/to/file2.ext：文件被占用\n\n📂 创建的目录结构：\n  folder/\n  ├── 文档/\n  ├── 图片/\n  ├── 视频/\n  ├── 音频/\n  ├── 压缩包/\n  ├── 代码/\n  └── 其他/\n```\n\n## 五、输出规范\n\n### 5.1 分析模式输出\n\n```\n📂 目录分析：/path/to/folder\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n📊 总览：文件 247 个 | 总大小 3.2 GB | 目录 12 个\n\n📁 按类型分布：\n  类型      数量    大小      占比\n  ─────────────────────────────\n  视频      12      2.1 GB    65.6%\n  图片      89      350 MB    10.9%\n  压缩包    18      280 MB    8.8%\n  音频      23      180 MB    5.6%\n  文档      45      120 MB    3.8%\n  其他      25      125 MB    3.9%\n  代码      35      45 MB     1.4%\n\n🔝 Top 10 大文件：\n  1. movie.mp4              1.2 GB    视频    2026-01-15\n  2. backup_2025.zip        450 MB    压缩包  2025-12-01\n  ...\n\n📅 按修改时间分布：\n  最近7天：12 个 (85 MB)\n  7-30天：34 个 (420 MB)\n  30-90天：56 个 (680 MB)\n  90天以上：145 个 (2.1 GB)\n\n💡 整理建议：\n  - 视频文件占 65.6% 空间，优先处理\n  - 90天以上未修改的文件有 145 个，可考虑归档\n  - 检测到 3 个可能的重复文件（建议进一步确认）\n```\n\n### 5.2 预览模式（dry-run）输出\n\n```\n🔍 整理方案预览（dry-run，未实际执行）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n整理策略：按类型分类\n目标目录：/path/to/folder\n\n📋 将执行的操作：\n  创建目录：7 个\n  移动文件：235 个 (3.1 GB)\n  跳过文件：12 个（已在目标位置）\n\n📂 目录结构预览：\n  folder/\n  ├── 文档/ (45 个文件, 120 MB)\n  ├── 图片/ (89 个文件, 350 MB)\n  ├── 视频/ (12 个文件, 2.1 GB)\n  ├── 音频/ (23 个文件, 180 MB)\n  ├── 压缩包/ (18 个文件, 280 MB)\n  ├── 代码/ (35 个文件, 45 MB)\n  └── 其他/ (13 个文件, 25 MB)\n\n📝 移动示例（前 10 个）：\n  report.pdf → 文档/report.pdf\n  photo.jpg → 图片/photo.jpg\n  video.mp4 → 视频/video.mp4\n  ...\n\n⚠ 注意：以上为预览，未实际移动任何文件。\n确认执行后将实际移动文件。是否继续？\n```\n\n## 六、常见场景处理\n\n### 场景 1：整理下载文件夹\n**用户**：「帮我整理一下 ~/Downloads」\n**处理**：扫描 → 按类型分类 → dry-run 预览 → 用户确认 → 执行 → 生成报告。默认排除 `.app`、`.dmg` 等已安装的安装包（可提示是否删除）。\n\n### 场景 2：清理桌面\n**用户**：「桌面太乱了，帮我收拾一下」\n**处理**：扫描桌面 → 识别快捷方式/文件/文件夹 → 按类型分类 → 注意保留系统文件和快捷方式 → dry-run → 执行。\n\n### 场景 3：找出大文件释放空间\n**用户**：「磁盘快满了，帮我找出大文件」\n**处理**：扫描指定目录（如 home 目录）→ 按大小排序 → 列出 Top 20 大文件 → 标注文件类型和最后修改时间 → 建议可删除/归档的文件 → 用户确认后处理。\n\n### 场景 4：照片按日期归档\n**用户**：「帮我把这些照片按日期整理」\n**处理**：扫描图片目录 → 优先读取 EXIF 拍摄日期，无 EXIF 则用修改日期 → 创建 `YYYY-MM/` 目录 → 移动照片 → dry-run → 执行 → 报告。\n\n### 场景 5：检测重复文件\n**用户**：「帮我看看这个目录里有没有重复的文件」\n**处理**：扫描目录 → 先按文件大小分组（大小相同才可能重复）→ 对大小相同的文件计算 MD5 → 列出重复文件组 → 建议保留最新/最大/路径最短的版本 → 用户确认后删除多余副本。\n\n### 场景 6：清理临时/缓存文件\n**用户**：「帮我清理一下临时文件和缓存」\n**处理**：扫描常见临时目录（`/tmp`、`~/.cache`、项目的 `node_modules`、`__pycache__`、`.git` 等）→ 统计可清理空间 → 列出将删除的内容 → 用户确认 → 删除（或移到回收站）→ 报告释放空间。\n\n## 七、安全规则\n\n### 7.1 绝对禁止\n- 禁止整理或删除系统关键目录（`/`, `/usr`, `/etc`, `/bin`, `/sbin`, `/lib`, `/var`, `/boot`, `/dev`, `/proc`, `/sys`）\n- 禁止删除用户主目录下的隐藏配置文件（`.bashrc`, `.profile`, `.ssh`, `.config` 等），除非用户明确要求\n- 禁止在未确认的情况下执行删除操作\n- 禁止跨用户目录操作（如从 `/home/user1` 移到 `/home/user2`）\n\n### 7.2 默认安全策略\n- **删除 = 移动到回收站**：默认将\"删除\"的文件移到 `~/.Trash/` 或临时目录，而非直接 `rm`\n- **dry-run 优先**：所有移动/删除操作先预览，用户确认后再执行\n- **隐藏文件保护**：`.` 开头的文件默认不移动、不删除\n- **文件名冲突**：遇到同名文件自动重命名，不覆盖\n- **操作日志**：记录所有移动/删除操作，可回滚（生成 undo 脚本）\n- **大小阈值**：单个文件 > 1GB 或总操作 > 5GB 时，额外提醒用户确认\n\n### 7.3 回滚机制\n- 每次执行整理时，生成 `undo_YYYYMMDD_HHMMSS.sh` 脚本\n- 脚本记录所有移动操作的源路径和目标路径\n- 用户可运行该脚本将文件移回原位\n- 回滚脚本保存在整理目录的 `.file-organizer-backup/` 下\n\n## 八、注意事项\n\n1. **路径确认**：整理前必须确认目录路径正确，避免整理错误目录。\n2. **权限检查**：如目录需要管理员权限，提示用户，不擅自使用 `sudo`。\n3. **大文件处理**：移动大文件（>1GB）可能耗时较长，告知用户预计时间。\n4. **跨文件系统**：源和目标在不同磁盘/分区时，移动 = 复制+删除，耗时更长且需要足够空间。\n5. **文件占用**：被其他程序占用的文件可能无法移动，记录并跳过。\n6. **符号链接**：默认不跟随符号链接，避免循环引用和误操作。\n7. **空目录处理**：整理后留下的空目录，可提示用户是否删除。\n8. **不替代专业工具**：本技能适用于常规文件整理，不替代专业的数据恢复、磁盘分区等工具。\n9. **隐私保护**：整理过程中不读取文件内容，仅基于文件名、扩展名、大小、时间等元数据操作。\n10. **操作不可逆提醒**：虽然提供回滚脚本，但删除（移到回收站）的文件可能被系统清理，重要文件建议先备份。\n\n## 九、文件结构\n\n```\nfile-organizer/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── organization-report-template.md   # 整理报告模板\n├── scripts/\n│   └── organize_files.py                 # 文件扫描、分类、整理脚本（支持 analyze/dry-run/execute）\n└── examples/\n    ├── sample-directory-structure.txt    # 示例：整理前的目录结构\n    └── sample-organization-report.md     # 示例：整理后的报告\n```\n\n## 十、使用示例\n\n### 示例 1：整理下载文件夹\n**用户**：「帮我整理一下 ~/Downloads，文件太乱了」\n**AI**：\n1. 确认路径：`/home/user/Downloads`\n2. 扫描分析：247 个文件，3.2 GB，视频占 65.6%\n3. 建议策略：按类型分类\n4. dry-run 预览：将创建 7 个目录，移动 235 个文件\n5. 用户确认后执行\n6. 生成整理报告：成功 235 个，跳过 8 个，失败 4 个\n\n### 示例 2：找出大文件\n**用户**：「帮我看看 home 目录下哪些文件占空间最大」\n**AI**：\n1. 扫描 `/home/user`（排除 `.cache`、`.git` 等）\n2. 列出 Top 20 大文件，标注类型、大小、最后修改时间\n3. 建议：`video.mp4` (1.2GB, 2025年) 可归档/删除，`backup.zip` (450MB) 可移到外接硬盘\n4. 用户选择处理后，执行移动/删除\n\n### 示例 3：照片按日期归档\n**用户**：「把 ~/Photos 里的照片按拍摄日期整理」\n**AI**：\n1. 扫描图片文件（.jpg, .png, .heic 等）\n2. 读取 EXIF 拍摄日期，无 EXIF 用修改日期\n3. 创建 `2024-01/`、`2024-02/` 等目录\n4. dry-run 预览：156 张照片将分到 12 个月份目录\n5. 用户确认后执行\n6. 报告：成功 150 张，跳过 6 张（无日期信息，放入 `未分类/`）\n\n### 示例 4：仅分析不整理\n**用户**：「帮我看看这个项目目录里都有什么文件，不用整理」\n**AI**：\n1. 扫描目录，仅 analyze 模式\n2. 输出分类统计、大文件、时间分布\n3. 给出整理建议（但不执行）\n", "templates/organization-report-template.md": "# 文件整理报告模板\n\n> 本模板用于生成标准化的文件整理报告，可根据实际情况填充内容。\n\n---\n\n## 📊 文件整理报告\n\n**整理目录**：`/path/to/folder`\n**整理时间**：YYYY-MM-DD HH:MM:SS\n**整理策略**：按类型分类 / 按日期归档 / 类型+日期\n**操作模式**：仅分析 / 预览(dry-run) / 已执行\n\n---\n\n### 📈 整理前统计\n\n| 指标 | 数值 |\n|---|---|\n| 文件总数 | XXX 个 |\n| 总大小 | X.X GB |\n| 目录数 | XX 个 |\n| 扫描错误 | X 个（权限不足等） |\n\n---\n\n### 📁 分类统计\n\n| 类型 | 数量 | 大小 | 占比 |\n|---|---|---|---|\n| 视频 | XX | X.X GB | XX.X% |\n| 图片 e\n  python3 organize_files.py --dir ~/Photos --mode dry-run --strategy date\n  python3 organize_files.py --dir ~/Downloads --mode analyze --large-threshold 100\n  python3 organize_files.py --dir ~/Downloads --mode analyze --detect-duplicates\n\"\"\"\n\nimport argparse\nimport hashlib\nimport os\nimport shutil\nimport sys\nfrom collections import defaultdict\nfrom datetime import datetime\nfrom pathlib import Path\nfrom typing import Dict, List, Optional, Tuple\n\n\n# ============================================================\n# 文件分类定义\n# ============================================================\n\nFILE_CATEGORIES = {\n    \"文档\": {\n        \"extensions\": {\".doc\", \".docx\", \".xls\", \".xlsx\", \".ppt\", \".pptx\", \".pdf\",\n                       \".txt\", \".md\", \".rtf\", \".odt\", \".ods\", \".odp\", \".csv\", \".tsv\",\n                       \".wps\", \".et\", \".dps\", \".pages\", \".numbers\", \".key\"},\n        \"color\": \"\\033[34m\",\n    },\n    \"图片\": {\n        \"extensions\": {\".jpg\", \".jpeg\", \".png\", \".gif\", \".bmp\", \".svg\", \".webp\",\n                       \".ico\", \".tiff\", \".tif\", \".psd\", \".ai\", \".raw\", \".heic\",\n                       \".heif\", \".indd\", \".eps\", \".cr2\", \".nef\", \".arw\", \".dng\"},\n        \"color\": \"\\033[35m\",\n    },\n    \"视频\": {\n        \"extensions\": {\".mp4\", \".avi\", \".mkv\", \".mov\", \".wmv\", \".flv\", \".webm\",\n                       \".m4v\", \".mpg\", \".mpeg\", \".3gp\", \".m2ts\", \".ts\", \".vob\",\n                       \".ogv\", \".rm\", \".rmvb\", \".asf\", \".f4v\"},\n        \"color\": \"\\033[31m\",\n    },\n    \"音频\": {\n        \"extensions\": {\".mp3\", \".wav\", \".flac\", \".aac\", \".ogg\", \".wma\", \".m4a\",\n                       \".ape\", \".opus\", \".mid\", \".midi\", \".aiff\", \".alac\", \".dsf\"},\n        \"color\": \"\\033[33m\",\n    },\n    \"压缩包\": {\n        \"extensions\": {\".zip\", \".rar\", \".7z\", \".tar\", \".gz\", \".bz2\", \".xz\",\n                       \".tgz\", \".tbz2\", \".iso\", \".dmg\", \".img\", \".cab\", \".lz\",\n                       \".zst\", \".arj\", \".lha\"},\n        \"color\": \"\\033[36m\",\n    },\n    \"代码\": {\n        \"extensions\": {\".py\", \".js\", \".ts\", \".jsx\", \".tsx\", \".java\", \".c\", \".cpp\",\n                       \".h\", \".hpp\", \".go\", \".rs\", \".rb\", \".php\", \".html\", \".htm\",\n                       \".css\", \".scss\", \".less\", \".json\", \".xml\", \".yaml\", \".yml\",\n                       \".sh\", \".bash\", \".zsh\", \".fish\", \".sql\", \".r\", \".m\", \".swift\",\n                       \".kt\", \".dart\", \".lua\", \".pl\", \".scala\", \".clj\", \".ex\", \".exs\",\n                       \".vue\", \".svelte\", \".wasm\", \".sol\", \".toml\", \".ini\", \".cfg\",\n                       \".conf\", \".env\", \".lock\", \".gradle\", \".cmake\", \".makefile\"},\n        \"color\": \"\\033[32m\",\n    },\n    \"可执行/安装包\": {\n        \"extensions\": {\".exe\", \".msi\", \".app\", \".pkg\", \".deb\", \".rpm\", \".appimage\",\n                       \".apk\", \".bat\", \".cmd\", \".com\", \".scr\", \".dll\", \".so\", \".dylib\",\n                       \".bin\", \".run\", \".sh\", \".command\"},\n        \"color\": \"\\033[91m\",\n    },\n    \"电子书\": {\n        \"extensions\": {\".epub\", \".mobi\", \".azw\", \".azw3\", \".cbz\", \".cbr\", \".djvu\",\n                       \".fb2\", \".ibooks\", \".lrf\", \".lrx\"},\n        \"color\": \"\\033[94m\",\n    },\n    \"字体\": {\n        \"extensions\": {\".ttf\", \".otf\", \".woff\", \".woff2\", \".eot\", \".fon\", \".fnt\"},\n        \"color\": \"\\033[95m\",\n    },\n    \"数据/数据库\": {\n        \"extensions\": {\".db\", \".sqlite\", \".sqlite3\", \".mdb\", \".accdb\", \".parquet\",\n                       \".feather\", \".h5\", \".hdf5\", \".mat\", \".nc\", \".grib\", \".dbf\"},\n        \"color\": \"\\033[96m\",\n    },\n    \"系统/临时\": {\n        \"extensions\": {\".tmp\", \".temp\", \".log\", \".bak\", \".old\", \".swp\", \".swo\",\n                       \".ds_store\", \".thumbs.db\", \".lock\", \".part\", \".crdownload\",\n                       \".download\", \".cache\", \".dat\"},\n        \"color\": \"\\033[90m\",\n    },\n}\n\n# 扩展名到分类的映射（构建一次）\n_EXT_TO_CATEGORY: Dict[str, str] = {}\nfor cat, info in FILE_CATEGORIES.items():\n    for ext in info[\"extensions\"]:\n        _EXT_TO_CATEGORY[ext] = cat\n\n# 系统关键目录（禁止整理）\n# 注意：不包含 /home 和 /tmp，用户主目录和临时目录允许整理\nFORBIDDEN_DIRS = {\n    \"/\", \"/usr\", \"/etc\", \"/bin\", \"/sbin\", \"/lib\", \"/lib64\",\n    \"/var\", \"/boot\", \"/dev\", \"/proc\", \"/sys\", \"/run\",\n    \"/root\", \"/Applications\", \"/System\", \"/Library\",\n}\n\n\n# ============================================================\n# 工具函数\n# ============================================================\n\ndef human_size(size_bytes: int) -> str:\n    \"\"\"将字节数转换为人类可读的大小\"\"\"\n    if size_bytes < 0:\n        return \"0 B\"\n    units = [\"B\", \"KB\", \"MB\", \"GB\", \"TB\", \"PB\"]\n    size = float(size_bytes)\n    for unit in units:\n        if size < 1024.0:\n            return f\"{size:.1f} {unit}\" if unit != \"B\" else f\"{int(size)} {unit}\"\n        size /= 1024.0\n    return f\"{size:.1f} EB\"\n\n\ndef get_category(filepath: str) -> str:\n    \"\"\"根据文件扩展名获取分类\"\"\"\n    ext = Path(filepath).suffix.lower()\n    return _EXT_TO_CATEGORY.get(ext, \"其他\")\n\n\ndef get_file_hash(filepath: str, chunk_size: int = 8192) -> Optional[str]:\n    \"\"\"计算文件 MD5 哈希（用于重复文件检测）\"\"\"\n    try:\n        h = hashlib.md5()\n        with open(filepath, \"rb\") as f:\n            while True:\n                chunk = f.read(chunk_size)\n                if not chunk:\n                    break\n                h.update(chunk)\n        return h.hexdigest()\n    except (OSError, PermissionError):\n        return None\n\n\ndef is_hidden(filepath: str) -> bool:\n    \"\"\"判断是否为隐藏文件（. 开头）\"\"\"\n    return os.path.basename(filepath).startswith(\".\")\n\n\ndef is_forbidden_dir(target_dir: str) -> bool:\n    \"\"\"判断是否为禁止整理的系统目录\"\"\"\n    resolved = os.path.realpath(target_dir)\n    for forbidden in FORBIDDEN_DIRS:\n        if resolved == forbidden or resolved.startswith(forbidden + \"/\"):\n            return True\n    return False\n\n\n# ============================================================\n# 目录扫描器\n# ============================================================\n\nclass DirectoryScanner:\n    \"\"\"扫描目录，收集文件信息\"\"\"\n\n    def __init__(self, target_dir: str, exclude_dirs: List[str] = None,\n                 include_hidden: bool = False):\n        self.target_dir = os.path.realpath(target_dir)\n        self.exclude_dirs = set(exclude_dirs or [])\n        self.include_hidden = include_hidden\n        self.files: List[dict] = []\n        self.total_size = 0\n        self.errors: List[str] = []\n\n    def scan(self) -> List[dict]:\n        \"\"\"执行扫描\"\"\"\n        for root, dirs, filenames in os.walk(self.target_dir):\n            # 过滤排除目录\n            dirs[:] = [d for d in dirs if d not in self.exclude_dirs\n                       and not d.startswith(\".\")]\n            # 跳过隐藏目录（除非包含）\n            if not self.include_hidden:\n                dirs[:] = [d for d in dirs if not d.startswith(\".\")]\n\n            for filename in filenames:\n                if not self.include_hidden and filename.startswith(\".\"):\n                    continue\n                filepath = os.path.join(root, filename)\n                try:\n                    stat = os.stat(filepath)\n                    # 跳过符号链接\n                    if os.path.islink(filepath):\n                        continue\n                    file_info = {\n                        \"path\": filepath,\n                        \"name\": filename,\n                        \"size\": stat.st_size,\n                        \"ext\": Path(filename).suffix.lower(),\n                        \"category\": get_category(filepath),\n                        \"mtime\": stat.st_mtime,\n                        \"atime\": stat.st_atime,\n                        \"ctime\": stat.st_ctime,\n                    }\n                    self.files.append(file_info)\n                    self.total_size += stat.st_size\n                except (OSError, PermissionError) as e:\n                    self.errors.append(f\"{filepath}: {e}\")\n\n        # 按大小降序排序\n        self.files.sort(key=lambda x: x[\"size\"], reverse=True)\n        return self.files\n\n    def get_category_stats(self) -> Dict[str, dict]:\n        \"\"\"按分类统计\"\"\"\n        stats = defaultdict(lambda: {\"count\": 0, \"size\": 0})\n        for f in self.files:\n            cat = f[\"category\"]\n            stats[cat][\"count\"] += 1\n            stats[cat][\"size\"] += f[\"size\"]\n        return dict(stats)\n\n    def get_large_files(self, threshold_mb: int = 100) -> List[dict]:\n        \"\"\"获取大文件（超过阈值）\"\"\"\n        threshold_bytes = threshold_mb * 1024 * 1024\n        return [f for f in self.files if f[\"size\"] >= threshold_bytes]\n\n    def get_time_distribution(self) -> Dict[str, dict]:\n        \"\"\"按修改时间分布\"\"\"\n        now = datetime.now().timestamp()\n        dist = {\n            \"最近7天\": {\"count\": 0, \"size\": 0},\n            \"7-30天\": {\"count\": 0, \"size\": 0},\n            \"30-90天\": {\"count\": 0, \"size\": 0},\n            \"90天以上\": {\"count\": 0, \"size\": 0},\n        }\n        for f in self.files:\n            age_days = (now - f[\"mtime\"]) / 86400\n            if age_days <= 7:\n                key = \"最近7天\"\n            elif age_days <= 30:\n                key = \"7-30天\"\n            elif age_days <= 90:\n                key = \"30-90天\"\n            else:\n                key = \"90天以上\"\n            dist[key][\"count\"] += 1\n            dist[key][\"size\"] += f[\"size\"]\n        return dist\n\n    def find_duplicates(self) -> Dict[str, List[dict]]:\n        \"\"\"检测重复文件（先按大小分组，再计算 MD5）\"\"\"\n        # 按大小分组\n        size_groups = defaultdict(list)\n        for f in self.files:\n            if f[\"size\"] > 0:\n                size_groups[f[\"size\"]].append(f)\n\n        # 只对大小相同的文件计算哈希\n        duplicates = defaultdict(list)\n        for size, group in size_groups.items():\n            if len(group) < 2:\n                continue\n            hash_groups = defaultdict(list)\n            for f in group:\n                file_hash = get_file_hash(f[\"path\"])\n                if file_hash:\n                    hash_groups[file_hash].append(f)\n            for h, files in hash_groups.items():\n                if len(files) > 1:\n                    duplicates[h] = files\n\n        return dict(duplicates)\n\n\n# ============================================================\n# 整理方案生成器\n# ============================================================\n\nclass OrganizationPlanner:\n    \"\"\"生成文件整理方案\"\"\"\n\n    def __init__(self, scanner: DirectoryScanner, strategy: str = \"type\"):\n        self.scanner = scanner\n        self.strategy = strategy\n        self.plan: List[dict] = []  # 每个元素: {source, target, category, size}\n        self.target_dirs: set = set()\n\n    def generate(self) -> List[dict]:\n        \"\"\"生成整理方案\"\"\"\n        for f in self.scanner.files:\n            target_path = self._get_target_path(f)\n            if target_path and target_path != f[\"path\"]:\n                self.plan.append({\n                    \"source\": f[\"path\"],\n                    \"target\": target_path,\n                    \"category\": f[\"category\"],\n                    \"size\": f[\"size\"],\n                    \"name\": f[\"name\"],\n                })\n                self.target_dirs.add(os.path.dirname(target_path))\n        return self.plan\n\n    def _get_target_path(self, file_info: dict) -> Optional[str]:\n        \"\"\"根据策略计算目标路径\"\"\"\n        base_dir = self.scanner.target_dir\n\n        if self.strategy == \"type\":\n            category = file_info[\"category\"]\n            target_dir = os.path.join(base_dir, category)\n            target_path = os.path.join(target_dir, file_info[\"name\"])\n            # 处理同名冲突\n            target_path = self._resolve_conflict(target_path)\n            return target_path\n\n        elif self.strategy == \"date\":\n            mtime = datetime.fromtimestamp(file_info[\"mtime\"])\n            date_dir = mtime.strftime(\"%Y-%m\")\n            target_dir = os.path.join(base_dir, date_dir)\n            target_path = os.path.join(target_dir, file_info[\"name\"])\n            target_path = self._resolve_conflict(target_path)\n            return target_path\n\n        elif self.strategy == \"type-date\":\n            category = file_info[\"category\"]\n            mtime = datetime.fromtimestamp(file_info[\"mtime\"])\n            date_dir = mtime.strftime(\"%Y-%m\")\n            target_dir = os.path.join(base_dir, category, date_dir)\n            target_path = os.path.join(target_dir, file_info[\"name\"])\n            target_path = self._resolve_conflict(target_path)\n            return target_path\n\n        return None\n\n    def _resolve_conflict(self, target_path: str) -> str:\n        \"\"\"处理文件名冲突（自动重命名）\"\"\"\n        if not os.path.exists(target_path):\n            return target_path\n        # 检查是否已经在 plan 中\n        planned_targets = {p[\"target\"] for p in self.plan}\n        if target_path not in planned_targets and not os.path.exists(target_path):\n            return target_path\n\n        base, ext = os.path.splitext(target_path)\n        counter = 1\n        while True:\n            new_path = f\"{base} ({counter}){ext}\"\n            if not os.path.exists(new_path) and new_path not in planned_targets:\n                return new_path\n            counter += 1\n\n    def get_summary(self) -> dict:\n        \"\"\"获取方案摘要\"\"\"\n        category_stats = defaultdict(lambda: {\"count\": 0, \"size\": 0})\n        for p in self.plan:\n            cat = p[\"category\"]\n            category_stats[cat][\"count\"] += 1\n            category_stats[cat][\"size\"] += p[\"size\"]\n\n        total_size = sum(p[\"size\"] for p in self.plan)\n        return {\n            \"total_files\": len(self.plan),\n            \"total_size\": total_size,\n            \"target_dirs\": sorted(self.target_dirs),\n            \"category_stats\": dict(category_stats),\n        }\n\n\n# ============================================================\n# 整理执行器\n# ============================================================\n\nclass OrganizationExecutor:\n    \"\"\"执行文件整理\"\"\"\n\n    def __init__(self, plan: List[dict], target_dir: str):\n        self.plan = plan\n        self.target_dir = target_dir\n        self.results = {\"success\": [], \"failed\": [], \"skipped\": []}\n        self.undo_commands: List[str] = []\n\n    def execute(self) -> dict:\n        \"\"\"执行整理方案\"\"\"\n        backup_dir = os.path.join(self.target_dir, \".file-organizer-backup\")\n        os.makedirs(backup_dir, exist_ok=True)\n        timestamp = datetime.now().strftime(\"%Y%m%d_%H%M%S\")\n        undo_file = os.path.join(backup_dir, f\"undo_{timestamp}.sh\")\n\n        for item in self.plan:\n            source = item[\"source\"]\n            target = item[\"target\"]\n            try:\n                # 创建目标目录\n                os.makedirs(os.path.dirname(target), exist_ok=True)\n                # 移动文件\n                shutil.move(source, target)\n                self.results[\"success\"].append(item)\n                # 记录 undo 命令\n                self.undo_commands.append(\n                    f'mv \"{target}\" \"{source}\"'\n                )\n            except (OSError, shutil.Error) as e:\n                self.results[\"failed\"].append({**item, \"error\": str(e)})\n\n        # 写入 undo 脚本\n        with open(undo_file, \"w\", encoding=\"utf-8\") as f:\n            f.write(\"#!/bin/bash\\n\")\n            f.write(f\"# 文件整理回滚脚本 - 生成于 {timestamp}\\n\")\n            f.write(f\"# 整理目录: {self.target_dir}\\n\")\n            f.write(f\"# 共 {len(self.undo_commands)} 个操作\\n\\n\")\n            for cmd in reversed(self.undo_commands):\n                f.write(cmd + \"\\n\")\n        os.chmod(undo_file, 0o755)\n\n        self.results[\"undo_file\"] = undo_file\n        return self.results\n\n\n# ============================================================\n# 报告生成器\n# ============================================================\n\nclass ReportGenerator:\n    \"\"\"生成整理报告\"\"\"\n\n    @staticmethod\n    def analyze_report(scanner: DirectoryScanner, large_threshold: int = 100,\n                       duplicates: Dict = None) -> str:\n        \"\"\"生成分析报告\"\"\"\n        lines = []\n        lines.append(\"=\" * 60)\n        lines.append(\"📂 目录分析报告\")\n        lines.append(\"=\" * 60)\n        lines.append(f\"目录: {scanner.target_dir}\")\n        lines.append(f\"扫描时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\")\n        lines.append(\"\")\n\n        # 总览\n        lines.append(\"📊 总览\")\n        lines.append(f\"  文件总数: {len(scanner.files)} 个\")\n        lines.append(f\"  总大小: {human_size(scanner.total_size)}\")\n        if scanner.errors:\n            lines.append(f\"  扫描错误: {len(scanner.errors)} 个（权限不足等）\")\n        lines.append(\"\")\n\n        # 按类型分布\n        lines.append(\"📁 按类型分布\")\n        cat_stats = scanner.get_category_stats()\n        sorted_cats = sorted(cat_stats.items(), key=lambda x: x[1][\"size\"], reverse=True)\n        lines.append(f\"  {'类型':<12} {'数量':>6} {'大小':>10} {'占比':>8}\")\n        lines.append(\"  \" + \"-\" * 40)\n        for cat, info in sorted_cats:\n            pct = (info[\"size\"] / scanner.total_size * 100) if scanner.total_size > 0 else 0\n            lines.append(f\"  {cat:<12} {info['count']:>6} {human_size(info['size']):>10} {pct:>7.1f}%\")\n        lines.append(\"\")\n\n        # Top 10 大文件\n        lines.append(f\"🔝 Top 10 大文件\")\n        for i, f in enumerate(scanner.files[:10], 1):\n            mtime = datetime.fromtimestamp(f[\"mtime\"]).strftime(\"%Y-%m-%d\")\n            lines.append(f\"  {i:2d}. {f['name']:<40} {human_size(f['size']):>10}  {f['category']:<8} {mtime}\")\n        lines.append(\"\")\n\n        # 大文件（超过阈值）\n        large_files = scanner.get_large_files(large_threshold)\n        if large_files:\n            lines.append(f\"⚠  大文件（>{large_threshold}MB）: {len(large_files)} 个，共 {human_size(sum(f['size'] for f in large_files))}\")\n            lines.append(\"\")\n\n        # 按时间分布\n        lines.append(\"📅 按修改时间分布\")\n        time_dist = scanner.get_time_distribution()\n        for period, info in time_dist.items():\n            lines.append(f\"  {period}: {info['count']} 个 ({human_size(info['size'])})\")\n        lines.append(\"\")\n\n        # 重复文件\n        if duplicates:\n            lines.append(f\"🔄 重复文件: {len(duplicates)} 组\")\n            for i, (h, files) in enumerate(list(duplicates.items())[:5], 1):\n                lines.append(f\"  组 {i}: {len(files)} 个文件，每个 {human_size(files[0]['size'])}，浪费 {human_size(files[0]['size'] * (len(files)-1))}\")\n                for f in files[:3]:\n                    lines.append(f\"    - {f['path']}\")\n                if len(files) > 3:\n                    lines.append(f\"    ... 还有 {len(files)-3} 个\")\n            lines.append(\"\")\n\n        # 整理建议\n        lines.append(\"💡 整理建议\")\n        if scanner.total_size > 0:\n            # 找占比最大的类型\n            top_cat = sorted_cats[0] if sorted_cats else None\n            if top_cat:\n                pct = top_cat[1][\"size\"] / scanner.total_size * 100\n                if pct > 50:\n                    lines.append(f\"  - {top_cat[0]}占 {pct:.1f}% 空间，优先处理此类文件\")\n            # 长期未使用\n            old_files = time_dist.get(\"90天以上\", {\"count\": 0})\n            if old_files[\"count\"] > len(scanner.files) * 0.3:\n                lines.append(f\"  - {old_files['count']} 个文件超过90天未修改，可考虑归档\")\n            # 大文件\n            if large_files:\n                lines.append(f\"  - {len(large_files)} 个大文件（>{large_threshold}MB），可移到外接存储或删除\")\n            # 重复\n            if duplicates:\n                wasted = sum(files[0][\"size\"] * (len(files) - 1) for files in duplicates.values())\n                lines.append(f\"  - 检测到 {len(duplicates)} 组重复文件，可释放 {human_size(wasted)} 空间\")\n        lines.append(\"\")\n        lines.append(\"=\" * 60)\n        return \"\\n\".join(lines)\n\n    @staticmethod\n    def dry_run_report(planner: OrganizationPlanner, scanner: DirectoryScanner) -> str:\n        \"\"\"生成预览报告\"\"\"\n        lines = []\n        summary = planner.get_summary()\n\n        lines.append(\"=\" * 60)\n        lines.append(\"🔍 整理方案预览（dry-run，未实际执行）\")\n        lines.append(\"=\" * 60)\n        lines.append(f\"目录: {scanner.target_dir}\")\n        lines.append(f\"策略: {planner.strategy}\")\n        lines.append(f\"预览时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\")\n        lines.append(\"\")\n\n        lines.append(\"📋 方案摘要\")\n        lines.append(f\"  将移动文件: {summary['total_files']} 个\")\n        lines.append(f\"  总大小: {human_size(summary['total_size'])}\")\n        lines.append(f\"  将创建目录: {len(summary['target_dirs'])} 个\")\n        skipped = len(scanner.files) - summary['total_files']\n        if skipped > 0:\n            lines.append(f\"  跳过（已在目标位置）: {skipped} 个\")\n        lines.append(\"\")\n\n        lines.append(\"📂 目标目录结构\")\n        for d in summary[\"target_dirs\"]:\n            rel = os.path.relpath(d, scanner.target_dir)\n            lines.append(f\"  {rel}/\")\n        lines.append(\"\")\n\n        lines.append(\"📁 分类统计\")\n        for cat, info in sorted(summary[\"category_stats\"].items(), key=lambda x: x[1][\"size\"], reverse=True):\n            lines.append(f\"  {cat}: {info['count']} 个 ({human_size(info['size'])})\")\n        lines.append(\"\")\n\n        # 移动示例（前 20 个）\n        lines.append(\"📝 移动示例（前 20 个）\")\n        for i, p in enumerate(planner.plan[:20], 1):\n            src_name = p[\"name\"]\n            dst_rel = os.path.relpath(p[\"target\"], scanner.target_dir)\n            lines.append(f\"  {i:2d}. {src_name} → {dst_rel}\")\n        if len(planner.plan) > 20:\n            lines.append(f\"  ... 还有 {len(planner.plan) - 20} 个文件\")\n        lines.append(\"\")\n\n        lines.append(\"⚠  以上为预览，未实际移动任何文件。\")\n        lines.append(\"   确认执行后将实际移动文件。建议先备份重要文件。\")\n        lines.append(\"=\" * 60)\n        return \"\\n\".join(lines)\n\n    @staticmethod\n    def execute_report(results: dict, scanner: DirectoryScanner, strategy: str) -> str:\n        \"\"\"生成执行报告\"\"\"\n        lines = []\n        lines.append(\"=\" * 60)\n        lines.append(\"✅ 文件整理执行报告\")\n        lines.append(\"=\" * 60)\n        lines.append(f\"目录: {scanner.target_dir}\")\n        lines.append(f\"策略: {strategy}\")\n        lines.append(f\"执行时间: {datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\")\n        lines.append(\"\")\n\n        lines.append(\"📊 执行结果\")\n        lines.append(f\"  成功移动: {len(results['success'])} 个\")\n        lines.append(f\"  失败: {len(results['failed'])} 个\")\n        lines.append(f\"  跳过: {len(results['skipped'])} 个\")\n        success_size = sum(p[\"size\"] for p in results[\"success\"])\n        lines.append(f\"  成功移动总大小: {human_size(success_size)}\")\n        lines.append(\"\")\n\n        if results[\"failed\"]:\n            lines.append(\"⚠  失败文件\")\n            for f in results[\"failed\"][:10]:\n                lines.append(f\"  - {f['name']}: {f.get('error', '未知错误')}\")\n            if len(results[\"failed\"]) > 10:\n                lines.append(f\"  ... 还有 {len(results['failed']) - 10} 个\")\n            lines.append(\"\")\n\n        if \"undo_file\" in results:\n            lines.append(\"🔄 回滚\")\n            lines.append(f\"  如需撤销，运行: {results['undo_file']}\")\n            lines.append(\"\")\n\n        lines.append(\"=\" * 60)\n        return \"\\n\".join(lines)\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"文件整理助手 - 扫描、分类、整理文件目录\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n        epilog=\"\"\"\n示例:\n  %(prog)s --dir ~/Downloads --mode analyze\n  %(prog)s --dir ~/Downloads --mode dry-run --strategy type\n  %(prog)s --dir ~/Downloads --mode execute --strategy type\n  %(prog)s --dir ~/Photos --mode dry-run --strategy date\n  %(prog)s --dir ~/Downloads --mode analyze --large-threshold 100\n  %(prog)s --dir ~/Downloads --mode analyze --detect-duplicates\n        \"\"\",\n    )\n    parser.add_argument(\"--dir\", \"-d\", required=True, help=\"目标目录路径\")\n    parser.add_argument(\"--mode\", \"-m\", choices=[\"analyze\", \"dry-run\", \"execute\"],\n                        default=\"analyze\", help=\"运行模式（默认 analyze）\")\n    parser.add_argument(\"--strategy\", \"-s\", choices=[\"type\", \"date\", \"type-date\"],\n                        default=\"type\", help=\"整理策略（默认 type）\")\n    parser.add_argument(\"--exclude\", \"-e\", nargs=\"*\", default=[],\n                        help=\"排除的子目录名（如 node_modules .git __pycache__）\")\n    parser.add_argument(\"--large-threshold\", \"-L\", type=int, default=100,\n                        help=\"大文件阈值（MB，默认 100）\")\n    parser.add_argument(\"--detect-duplicates\", action=\"store_true\",\n                        help=\"检测重复文件（可能较慢）\")\n    parser.add_argument(\"--include-hidden\", action=\"store_true\",\n                        help=\"包含隐藏文件（默认不包含）\")\n    parser.add_argument(\"--output\", \"-o\", help=\"将报告写入文件\")\n    parser.add_argument(\"--yes\", \"-y\", action=\"store_true\",\n                        help=\"execute 模式下跳过确认（危险，慎用）\")\n\n    args = parser.parse_args()\n\n    # 解析目录路径\n    target_dir = os.path.expanduser(args.dir)\n    if not os.path.exists(target_dir):\n        print(f\"错误：目录不存在 - {target_dir}\", file=sys.stderr)\n        sys.exit(1)\n    if not os.path.isdir(target_dir):\n        print(f\"错误：不是目录 - {target_dir}\", file=sys.stderr)\n        sys.exit(1)\n\n    # 安全检查：禁止系统目录\n    if is_forbidden_dir(target_dir):\n        print(f\"错误：禁止整理系统关键目录 - {target_dir}\", file=sys.stderr)\n        print(\"为安全起见，本工具不支持整理系统目录。\", file=sys.stderr)\n        sys.exit(1)\n\n    # execute 模式确认\n    if args.mode == \"execute\" and not args.yes:\n        print(f\"⚠  即将实际整理目录: {target_dir}\")\n        print(f\"   策略: {args.strategy}\")\n        print(\"   此操作将移动文件，建议先备份。\")\n        confirm = input(\"   确认执行？(yes/no): \").strip().lower()\n        if confirm not in (\"yes\", \"y\"):\n            print(\"已取消。\")\n            sys.exit(0)\n\n    # 扫描目录\n    print(f\"正在扫描目录: {target_dir} ...\", file=sys.stderr)\n    scanner = DirectoryScanner(\n        target_dir,\n        exclude_dirs=args.exclude,\n        include_hidden=args.include_hidden,\n    )\n    scanner.scan()\n    print(f\"扫描完成: {len(scanner.files)} 个文件，{human_size(scanner.total_size)}\",\n          file=sys.stderr)\n\n    # 重复文件检测\n    duplicates = None\n    if args.detect_duplicates:\n        print(\"正在检测重复文件（可能较慢）...\", file=sys.stderr)\n        duplicates = scanner.find_duplicates()\n        print(f\"检测完成: {len(duplicates)} 组重复文件\", file=sys.stderr)\n\n    # 根据模式生成报告\n    if args.mode == \"analyze\":\n        report = ReportGenerator.analyze_report(\n            scanner, args.large_threshold, duplicates\n        )\n    elif args.mode == \"dry-run\":\n        planner = OrganizationPlanner(scanner, args.strategy)\n        planner.generate()\n        report = ReportGenerator.dry_run_report(planner, scanner)\n    elif args.mode == \"execute\":\n        planner = OrganizationPlanner(scanner, args.strategy)\n        planner.generate()\n        print(f\"正在执行整理: {len(planner.plan)} 个文件 ...\", file=sys.stderr)\n        executor = OrganizationExecutor(planner.plan, target_dir)\n        results = executor.execute()\n        report = ReportGenerator.execute_report(results, scanner, args.strategy)\n\n    # 输出\n    if args.output:\n        with o 型\n**适用**：术语、定义、理论、专有名词\n**格式**：\n- 正面：「什么是 XXX？」「XXX 的定义是什么？」\n- 背面：完整定义 + 关键特征 + 举例\n\n### 3.2 因果关系型\n**适用**：原因与结果、条件与结论、机制与效应\n**格式**：\n- 正面：「XXX 的原因是什么？」「XXX 会导致什么结果？」\n- 背面：原因/机制 + 结果 + 关键中间环节\n\n### 3.3 对比辨析型\n**适用**：易混淆概念、相似理论、不同方法的区别\n**格式**：\n- 正面：「XXX 和 YYY 的区别是什么？」\n- 背面：对比表格或分点对比（定义、特点、适用场景、优缺点）\n\n### 3.4 公式定理型\n**适用**：数学公式、物理定律、化学方程式、算法复杂度\n**格式**：\n- 正面：「XXX 公式是什么？」「XXX 定理的内容？」\n- 背面：公式/定理 + 各符号含义 + 适用条件 + 典型例题\n\n### 3.5 步骤流程型\n**适用**：操作步骤、实验流程、算法步骤、代谢途径\n**格式**：\n- 正面：「XXX 的步骤是什么？」「简述 XXX 的过程」\n- 背面：编号步骤 + 每步关键要点 + 注意事项\n\n### 3.6 列举型\n**适用**：特征、分类、优缺点、影响因素\n**格式**：\n- 正面：「XXX 的主要特征有哪些？」「XXX 分为哪几类？」\n- 背面：编号列表 + 每项简要说明\n\n### 3.7 时间线型\n**适用**：历史事件、发展历程、阶段划分\n**格式**：\n- 正面：「XXX 的发展历程？」「XXX 经历了哪些阶段？」\n- 背面：时间线（时间 - 事件 - 意义）\n\n### 3.8 填空型（cloze）\n**适用**：关键术语、数字、人名、年份\n**格式**：\n- 正面：「{{c1::XXX}} 是指……」（Anki cloze 格式）\n- 背面：完整句子 + 被填内容的解释\n\n## 四、操作步骤\n\n### 步骤 1：读取并理解学习材料\n\n1. 完整读取用户提供的文本（笔记、教材章节、文章、PDF 提取文本等）\n2. 如果文本过长，分段读取，确保不遗漏关键知识点\n3. 识别文本的主题领域（如医学、法律、计算机、历史、语言等），调整卡片风格\n4. 识别文本结构：标题层级、定义段落、公式、列表、案例等\n\n### 步骤 2：提取核心知识点\n\n从文本中提取以下类型的知识点：\n\n| 知识点类型 | 提取线索 |\n|---|---|\n| 定义/概念 | 「是指」「定义为」「称为」「XXX是」 |\n| 原因/机制 | 「因为」「由于」「导致」「机制是」「原理」 |\n| 对比/区别 | 「区别于」「不同于」「相比」「与…的区别」 |\n| 公式/定理 | 数学公式、「定理」「定律」「法则」 |\n| 步骤/流程 | 「第一步」「首先」「然后」「流程」「步骤」 |\n| 特征/分类 | 「特征」「特点」「分为」「包括」「类型」 |\n| 优缺点 | 「优点」「缺点」「优势」「局限」「不足」 |\n| 时间/事件 | 年份、「在…时期」「经历了」「发展」 |\n\n**提取原则**：\n- 优先提取考试/应用中高频的核心知识点\n- 每个知识点应能独立成一张卡片\n- 避免提取过于琐碎或显而易见的内容\n- 一张卡片只聚焦一个知识点（避免「卡片过载」）\n\n### 步骤 3：使用辅助脚本初步提取（可选）\n\n对于较长的文本，可使用 `scripts/generate_flashcards.py` 进行初步的知识点提取和卡片生成：\n\n```bash\n# 从文本文件生成卡片（文本格式输出）\npython3 scripts/generate_flashcards.py --input notes.txt --format text\n\n# 输出 Anki 兼容 CSV（正面,背面,标签）\npython3 scripts/generate_flashcards.py --input notes.txt --format anki\n\n# 输出 JSON 格式\npython3 scripts/generate_flashcards.py --input notes.txt --format json\n\n# 指定卡片数量和主题标签\npython3 scripts/generate_flashcards.py --input notes.txt --max-cards 30 --tags \"生物学,细胞\"\n```\n\n脚本会基于模式匹配提取定义、列表、对比等知识点，生成初步卡片。**注意：脚本结果仅作辅助，必须经过 AI 语义审核和优化后才能作为最终卡片。**\n\n### 步骤 4：AI 生成高质量卡片\n\n基于提取的知识点，为每个知识点生成卡片：\n\n#### 4.1 选择卡片类型\n根据知识点性质选择最合适的卡片类型（参见第三节卡片类型体系）。\n\n#### 4.2 编写正面（问题）\n- 问题明确、具体，无歧义\n- 避免「关于XXX，以下说法正确的是」这类模糊问题\n- 一个问题只问一个知识点\n- 语言简洁，不超过 30 字（中文）\n\n#### 4.3 编写背面（答案）\n- 答案准确、完整，基于原文不编造\n- 关键信息用加粗或编号突出\n- 适当补充举例、口诀、记忆技巧\n- 复杂内容用表格或分点呈现\n- 标注信息来源（如「出自教材第3章」）\n\n#### 4.4 添加标签\n为每张卡片添加标签，便于分类复习：\n- 学科/领域标签：如「医学」「法律」「计算机」\n- 主题标签：如「心血管系统」「合同法」「数据结构」\n- 难度标签：如「基础」「进阶」「高频考点」\n- 卡片类型标签：如「定义」「对比」「公式」\n\n### 步骤 5：卡片质量自检\n\n生成卡片后，逐项检查：\n\n- [ ] 每张卡片只聚焦一个知识点？\n- [ ] 正面问题是否明确、无歧义？\n- [ ] 背面答案是否准确、完整（与原文一致，不编造）？\n- [ ] 是否避免了「卡片过载」（一张卡片内容过多）？\n- [ ] 是否有重复或高度相似的卡片？\n- [ ] 卡片类型是否匹配知识点性质？\n- [ ] 关键术语、数字、人名是否准确？\n- [ ] 标签是否合理，便于分类复习？\n- [ ] 整体卡片是否覆盖了文本的核心知识点（覆盖率 ≥ 80%）？\n\n### 步骤 6：生成复习计划（如用户需要）\n\n基于间隔重复（Spaced Repetition）原理，生成复习安排：\n\n| 复习阶段 | 时间间隔 | 说明 |\n|---|---|---|\n| 初次学习 | Day 0 | 当天学习新卡片 |\n| 第一次复习 | Day 1 | 次日复习 |\n| 第二次复习 | Day 3 | 间隔2天 |\n| 第三次复习 | Day 7 | 间隔4天 |\n| 第四次复习 | Day 14 | 间隔1周 |\n| 第五次复习 | Day 30 | 间隔2周 |\n| 长期保持 | 每30天 | 已掌握卡片定期回顾 |\n\n- 标记为「困难」的卡片：缩短间隔（Day 0 → 1 → 2 → 4 → 7 → 14）\n- 标记为「简单」的卡片：延长间隔（Day 0 → 3 → 7 → 14 → 30 → 60）\n- 每天复习量建议：新卡片 ≤ 20 张/天，复习卡片 ≤ 100 张/天\n\n### 步骤 7：导出与交付\n\n1. **Markdown 格式**：直接在对话中展示卡片（适合快速预览）\n2. **Anki CSV 格式**：生成 `正面,背面,标签` 格式的 CSV 文件，可直接导入 Anki\n3. **JSON 格式**：结构化数据，便于程序处理\n4. 如用户需要，可创建飞书文档或导出为文件\n\n## 五、输出规范\n\n### 5.1 Markdown 卡片展示格式\n\n```markdown\n### 卡片 1：[概念定义] 什么是细胞呼吸？\n\n**正面（问题）**：\n什么是细胞呼吸？其本质是什么？\n\n**背面（答案）**：\n细胞呼吸是指**有机物在细胞内经过一系列氧化分解，生成二氧化碳或其他产物，释放能量并生成ATP的过程**。\n\n- **本质**：氧化分解有机物，释放能量\n- **主要场所**：线粒体（有氧呼吸）\n- **关键产物**：ATP（细胞的直接能源物质）\n- **意义**：为细胞的各项生命活动提供能量\n\n**标签**：`生物学` `细胞` `基础` `定义`\n\n---\n```\n\n### 5.2 Anki CSV 格式\n\n```csv\n正面,背面,标签\n\"什么是细胞呼吸？\",\"细胞呼吸是指有机物在细胞内经过一系列氧化分解...\",\"生物学::细胞::基础\"\n\"有氧呼吸和无氧呼吸的区别是什么？\",\"| 对比项 | 有氧呼吸 | 无氧呼吸 |...\",\"生物学::细胞::对比\"\n```\n\n**注意**：Anki 导入时选择「逗号分隔」，字段映射为「正面=字段1，背面=字段2，标签=字段3」。\n\n### 5.3 卡片统计报告\n\n生成卡片后，附简要统计：\n\n```\n📊 卡片生成统计\n- 总卡片数：25 张\n- 卡片类型分布：概念定义 10 | 因果关系 5 | 对比辨析 4 | 公式定理 3 | 步骤流程 2 | 列举 1\n- 难度分布：基础 15 | 进阶 8 | 高频考点 2\n- 知识点覆盖率：约 85%\n- 预计复习时间：初次学习约 40 分钟，每日复习约 10-15 分钟\n```\n\n## 六、常见场景处理\n\n### 场景 1：教材章节生成卡片\n**用户**：上传一章教材 PDF，说「帮我把这章内容做成记忆卡片」\n**处理**：提取文本 → 识别核心知识点 → 按章节结构组织卡片 → 生成 20-40 张卡片 → 导出 Anki CSV。\n\n### 场景 2：考试备考重点卡片\n**用户**：「我下周要考XX，帮我从这些笔记里提取高频考点做卡片」\n**处理**：优先提取高频考点、易混淆点、公式定理 → 标记「高频考点」标签 → 生成 15-25 张核心卡片 → 提供 7 天复习计划。\n\n### 场景 3：语言学习词汇卡片\n**用户**：「帮我把这些英语单词做成记忆卡片」\n**处理**：为每个单词生成「单词+音标+词性+释义+例句+记忆技巧」卡片 → 支持 cloze 填空格式 → 按主题/难度分组。\n\n### 场景 4：读书笔记卡片\n**用户**：「我读完了《XX》，帮我做几张卡片记住核心观点」\n**处理**：提取核心观点、关键概念、金句、作者论证逻辑 → 生成 10-20 张卡片 → 标注书籍来源。\n\n### 场景 5：技术知识学习卡片\n**用户**：「帮我把这篇关于React Hooks的文章做成卡片」\n**处理**：提取核心概念（useState/useEffect等）、使用规则、常见陷阱、代码示例 → 生成概念+对比+代码示例卡片 → 标签标记技术栈。\n\n## 七、间隔重复复习指南\n\n### 7.1 复习方法\n1. **主动回忆**：看正面问题，先在脑中回忆答案，再翻背面核对\n2. **诚实评分**：按「忘记/模糊/记住/熟练」四级评分\n3. **困难卡片优先**：每天先复习标记为「困难」的卡片\n4. **批量复习**：每天固定时间复习，保持节奏\n\n### 7.2 记忆技巧\n- **联想记忆**：将抽象概念与熟悉的事物关联\n- **口诀记忆**：为列举类知识点编口诀\n- **图像记忆**：为复杂过程画流程图（卡片背面可附简图描述）\n- **间隔重复**：按复习计划定期回顾，避免临时抱佛脚\n\n### 7.3 注意事项\n- 不要一次制作过多卡片（每天新卡片 ≤ 20 张）\n- 定期清理已熟练掌握的卡片（减少复习负担）\n- 卡片内容要准确，错误的卡片比没有卡片更有害\n- 结合实际应用（做题、实践）效果更佳\n\n## 八、注意事项\n\n1. **不编造知识**：卡片内容必须严格基于用户提供的材料，不得自行添加未提及的知识点或答案。如材料中信息不足，标注「待补充」。\n2. **准确性优先**：涉及数字、公式、人名、年份等关键信息时，必须与原文核对，确保准确。\n3. **卡片不过载**：一张卡片只聚焦一个知识点，避免把多个问题塞进一张卡片。\n4. **问题要具体**：避免「关于XXX，说说你的理解」这类过于宽泛的问题。\n5. **难度分层**：根据知识点的重要性和难度，合理分配基础/进阶/高频考点标签。\n6. **隐私保护**：如学习材料涉及个人隐私或敏感信息，在卡片中适当脱敏。\n7. **不替代专业指导**：本技能生成的卡片用于辅助学习，不构成专业教学或考试保证。\n8. **可定制性**：如用户对卡片数量、难度、类型有特殊要求，按用户要求调整。\n\n## 九、文件结构\n\n```\nflashcard-generator/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── flashcard-template.md             # 记忆卡片格式模板（含各类型示例）\n├── scripts/\n│   └── generate_flashcards.py            # 卡片初步生成脚本（知识点提取、卡片生成、多格式导出）\n└── examples/\n    ├── sample-biology-notes.md           # 示例：生物学学习笔记\n    └── sample-flashcards.csv             # 示例：生成的 Anki 兼容卡片\n```\n\n## 十、使用示例\n\n### 示例 1：从笔记生成卡片\n**用户**：粘贴一段关于「光合作用」的笔记，说「帮我做
