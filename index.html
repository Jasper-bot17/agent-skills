提取日期周围的上下文\"\"\"\n    # 去掉日期本身，提取前后的描述\n    context = line.replace(date_match, '').strip()\n    # 去掉常见前缀\n    context = re.sub(r'^(截止|deadline|日期|时间|before|by)\\s*[:：]?\\s*', '', context, flags=re.IGNORECASE)\n    context = re.sub(r'[:：]\\s*$', '', context)\n    # 限制长度\n    if len(context) > 50:\n        context = context[:50] + '...'\n    return context if context else '（无描述）'\n\n\ndef extract_dates_from_text(text: str, today: date) -> List[DateItem]:\n    \"\"\"从文本中提取所有日期\"\"\"\n    items = []\n    lines = text.split('\\n')\n\n    # 日期模式列表（按优先级排序）\n    patterns = [\n        # 标准日期\n        (r'\\d{4}[-/.]\\d{1,2}[-/.]\\d{1,2}(?:\\s+\\d{1,2}:\\d{2})?', 'standard'),\n        # 中文日期（带年份）\n        (r'\\d{4}年\\d{1,2}月\\d{1,2}日', 'chinese'),\n        # 中文日期（不带年份）\n        (r'\\d{1,2}月\\d{1,2}日', 'chinese'),\n        # 相对日期\n        (r'(?:今天|今日|明天|明日|后天|本周[一二三四五六日天]|下周[一二三四五六日天]|月底|月末|本周|这周|本周内|月底前)', 'relative'),\n        # X天后\n        (r'\\d+天后', 'relative'),\n        # YYYYMMDD\n        (r'\\b\\d{8}\\b', 'standard'),\n    ]\n\n    for line in lines:\n        line = line.strip()\n        if not line:\n            continue\n\n        for pattern, ptype in patterns:\n            for m in re.finditer(pattern, line):\n                date_text = m.group(0)\n                parsed = None\n\n                if ptype == 'standard':\n                    parsed = parse_standard_date(date_text, today)\n                elif ptype == 'chinese':\n                    parsed = parse_chinese_date(date_text, today)\n                elif ptype == 'relative':\n                    parsed = parse_relative_date(date_text, today)\n\n                if parsed:\n                    context = extract_context(line, date_text)\n                    items.append(DateItem(\n                        date_str=date_text,\n                        context=context,\n                        raw_text=line,\n                        parsed_date=parsed,\n                        relative=(ptype == 'relative'),\n                    ))\n\n    # 去重（按日期和上下文）\n    seen = set()\n    unique_items = []\n    for item in items:\n        key = (item.parsed_date, item.context)\n        if key not in seen:\n            seen.add(key)\n            unique_items.append(item)\n\n    # 计算倒计时\n    for item in unique_items:\n        if item.parsed_date:\n            item.days_until = (item.parsed_date - today).days\n\n    return unique_items\n\n\n# ============================================================\n# 报告格式化\n# ============================================================\n\ndef format_countdown(days: int) -> str:\n    \"\"\"格式化倒计时\"\"\"\n    if days < 0:\n        return f\"已过期 {-days} 天\"\n    elif days == 0:\n        return \"就是今天\"\n    elif days == 1:\n        return \"明天\"\n    else:\n        return f\"{days} 天后\"\n\n\ndef urgency_icon(days: int) -> str:\n    \"\"\"根据天数返回紧急度图标\"\"\"\n    if days < 0:\n        return \"🔴\"  # 已过期\n    elif days <= 3:\n        return \"🔴\"  # 3天内\n    elif days <= 7:\n        return \"🟡\"  # 一周内\n    elif days <= 30:\n        return \"🟢\"  # 一个月内\n    else:\n        return \"⚪\"  # 较远\n\n\nWEEKDAY_CN = [\"周一\", \"周二\", \"周三\", \"周四\", \"周五\", \"周六\", \"周日\"]\n\n\ndef format_date(d: date) -> str:\n    \"\"\"格式化日期显示\"\"\"\n    return f\"{d.month:02d}-{d.day:02d} {WEEKDAY_CN[d.weekday()]}\"\n\n\ndef format_report(items: List[DateItem], today: date,\n                  within_days: Optional[int] = None,\n                  include_overdue: bool = True) -> str:\n    \"\"\"格式化倒计时报告\"\"\"\n    # 过滤\n    upcoming = []\n    overdue = []\n\n    for item in items:\n        if item.days_until is None:\n            continue\n        if item.days_until < 0:\n            if include_overdue:\n                overdue.append(item)\n        else:\n            if within_days is None or item.days_until <= within_days:\n                upcoming.append(item)\n\n    # 排序\n    upcoming.sort(key=lambda x: x.days_until)\n    overdue.sort(key=lambda x: x.days_until)\n\n    lines = []\n    lines.append(\"=\" * 60)\n    lines.append(\"📅 日期与截止事项倒计时清单\")\n    lines.append(\"=\" * 60)\n    lines.append(\"\")\n    lines.append(f\"分析日期：{today.strftime('%Y-%m-%d')}\")\n    lines.append(f\"共发现 {len(upcoming) + len(overdue)} 个日期事项\")\n    if within_days:\n        lines.append(f\"筛选范围：未来 {within_days} 天内\")\n    lines.append(\"\")\n\n    # 即将到来\n    if upcoming:\n        lines.append(\"⏳ 即将到来（按时间排序）：\")\n        lines.append(\"\")\n        for item in upcoming:\n            icon = urgency_icon(item.days_until)\n            lines.append(f\"  {icon} {format_countdown(item.days_until)}（{format_date(item.parsed_date)}）\")\n            lines.append(f\"     {item.context}\")\n            lines.append(f\"     原文：\\\"{item.raw_text[:60]}\\\"\")\n            lines.append(\"\")\n    else:\n        lines.append(\"✅ 未来一段时间内没有截止事项。\")\n        lines.append(\"\")\n\n    # 已过期\n    if overdue and include_overdue:\n        lines.append(\"⚠ 已过期：\")\n        lines.append(\"\")\n        for item in overdue:\n            lines.append(f\"  🔴 {format_countdown(item.days_until)}（{format_date(item.parsed_date)}）\")\n            lines.append(f\"     {item.context}\")\n            lines.append(f\"     原文：\\\"{item.raw_text[:60]}\\\"\")\n            lines.append(\"\")\n\n    # 统计\n    lines.append(\"📊 统计：\")\n    in_7 = sum(1 for i in upcoming if i.days_until <= 7)\n    in_30 = sum(1 for i in upcoming if i.days_until <= 30)\n    lines.append(f\"  未来7天内：{in_7} 项\")\n    lines.append(f\"  未来30天内：{in_30} 项\")\n    lines.append(f\"  已过期：{len(overdue)} 项\")\n    lines.append(\"\")\n    lines.append(\"=\" * 60)\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"日期提取与倒计时工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--file\", \"-f\", help=\"文本文件路径\")\n    parser.add_argument(\"--text\", \"-t\", help=\"直接传入文本\")\n    parser.add_argument(\"--within-days\", \"-w\", type=int, default=None,\n                        help=\"只显示未来N天内的事项\")\n    parser.add_argument(\"--include-overdue\", action=\"store_true\", default=True,\n                        help=\"包含已过期事项（默认开启）\")\n    parser.add_argument(\"--hide-overdue\", action=\"store_true\",\n                        help=\"不显示已过期事项\")\n    parser.add_argument(\"--output\", choices=[\"text\", \"json\"], default=\"text\",\n                        help=\"输出格式（默认text）\")\n    args = parser.parse_args()\n\n    # 获取文本\n    text = \"\"\n    if args.file:\n        with open(args.file, 'r', encoding='utf-8') as f:\n            text = f.read()\n    elif args.text:\n        text = args.text\n    elif not sys.stdin.isatty():\n        text = sys.stdin.read()\n\n    if not text.strip():\n        print(\"错误：未提供文本。请使用 --file、--text 或 stdin 传入\", file=sys.stderr)\n        print(\"用法：\", file=sys.stderr)\n        print(\"  python3 extract_dates.py --file notes.txt\", file=sys.stderr)\n        print(\"  python3 extract_dates.py --text '报告截止3月15日'\", file=sys.stderr)\n        sys.exit(1)\n\n    today = date.today()\n    items = extract_dates_from_text(text, today)\n    include_overdue = not args.hide_overdue\n\n    if args.output == \"json\":\n        result = []\n        for item in items:\n            result.append({\n                \"date_text\": item.date_str,\n                \"context\": item.context,\n                \"raw_text\": item.raw_text,\n                \"parsed_date\": item.parsed_date.isoformat() if item.parsed_date else None,\n                \"days_until\": item.days_until,\n                \"relative\": item.relative,\n            })\n        print(json.dumps(result, ensure_ascii=False, indent=2))\n    else:\n        print(format_report(items, today, args.within_days, include_overdue))\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-countdown-report.md": "# 示例：日期提取与倒计时报告\n\n> 本示例展示使用 `extract_dates.py` 对 `sample-notes.txt` 进行分析的输出。\n> 示例为一份项目会议纪要，包含多种日期格式和截止事项。\n\n---\n\n## 输入文本摘要\n\n```\n项目会议纪要 - 2026-09-20\n\n1. 提交季度报告 - 截止9月23日（本周二）\n2. 回复客户合同 - 今天内完成\n3. 修复登录bug - 明天前上线\n4. 项目演示准备 - 下周三\n5. 团队团建 - 月底前安排\n6. 产品发布会 - 10月15日\n7. Q3总结会议 - 2026年10月10日\n8. 月度数据报表 - 9月18日前提交（已逾期）\n```\n\n---\n\n## 分析结果\n\n**分析日期**：2026-09-20\n**共发现**：10+ 个日期事项\n\n### 🔴 紧急（3天内）\n\n| 事项 | 日期 | 倒计时 | 原文 |\n|---|---|---|---|\n| 回复客户合同 | 09-20 | 今天 | \"今天内完成\" |\n| 修复登录bug | 09-21 | 明天 | \"明天前上线\" |\n| 提交季度报告 | 09-23 | 3天 | \"截止9月23日\" |\n| 项目演示准备 | 09-23 | 3天 | \"下周三\" |\n\n### 🟡 本周内（7天）\n\n| 事项 | 日期 | 倒计时 |\n|---|---|---|\n| 周五下午周会 | 09-25 | 5天 |\n\n### 🟢 本月内（30天）\n\n| 事项 | 日期 | 倒计时 |\n|---|---|---|\n| 团队团建 | 09-30 | 10天 |\n| 新员工入职培训 | 10-08 | 18天 |\n| Q3总结会议 | 10-10 | 20天 |\n| 产品发布会 | 10-15 | 25天 |\n| 年度预算审批 | 10-31 | 41天 |\n\n### ⚪ 较远\n\n| 事项 | 日期 | 倒计时 |\n|---|---|---|\n| 年度规划启动 | 11-01 | 42天 |\n| 圣诞活动筹备 | 12-25 | 96天 |\n\n### ⚠ 已过期\n\n| 事项 | 日期 | 逾期 |\n|---|---|---|\n| 月度数据报表 | 09-18 | 2天 |\n\n---\n\n## 关键建议\n\n1. **今天优先**：回复客户合同（今天截止）\n2. **明天完成**：修复登录bug（阻塞用户）\n3. **本周重点**：季度报告和项目演示（都是9月23日）\n4. **已逾期跟进**：月度数据报表需立即补交\n5. **下月提前准备**：产品发布会（10月15日）需提前两周准备\n\n---\n\n*报告由 date-extractor 技能生成*\n", "examples/sample-notes.txt": "项目会议纪要\n\n时间：2026-09-20\n地点：会议室A\n\n一、本周待办事项\n\n1. 提交季度报告 - 截止9月23日（本周二）\n2. 回复客户合同 - 今天内完成\n3. 修复登录bug - 明天前上线\n4. 项目演示准备 - 下周三\n5. 团队团建 - 月底前安排\n\n二、下月计划\n\n1. 产品发布会 - 10月15日\n2. Q3总结会议 - 2026年10月10日\n3. 年度预算审批 - 10月底前\n4. 新员工入职培训 - 10月8日\n\n三、已逾期事项（需跟进）\n\n1. 月度数据报表 - 9月18日前提交（已逾期）\n2. 客户回访 - 本周三前（已过）\n\n四、其他\n\n- 周五下午周会\n- 2026/11/01 年度规划启动\n- 12月25日 圣诞活动筹备\n"}, "file_count": 5, "script_lines": 404}, {"name": "env-manager", "title": "env-manager", "description": "环境变量管理助手。解析和管理 .env 配置文件，支持多环境对比（dev/staging/prod）、缺失变量检测、重复变量检测、格式校验（URL/端口/邮箱/路径等）、密钥脱敏显示、生成 .env.example 模板、导出为 shell/JSON/Docker/YAML 格式。适用于项目配置管理、多环境部署、配置审计、密钥安全检查等场景。", "category": "其他", "icon": "📦", "color": "#6b7280", "skill_md": "---\nname: env-manager\ndescription: '环境变量管理助手。解析和管理 .env 配置文件，支持多环境对比（dev/staging/prod）、缺失变量检测、重复变量检测、格式校验（URL/端口/邮箱/路径等）、密钥脱敏显示、生成 .env.example 模板、导出为 shell/JSON/Docker/YAML 格式。适用于项目配置管理、多环境部署、配置审计、密钥安全检查等场景。'\n---\n\n# 环境变量管理助手\n\n## 一、技能定位\n\n本技能用于**管理和审计环境变量配置文件**。核心价值：\n\n- 解析 `.env` 文件，支持注释、引号、多行值\n- 多环境对比，快速发现配置差异\n- 自动检测缺失变量、重复变量、空值\n- 格式校验（URL、端口、邮箱、路径、布尔值等）\n- 密钥脱敏，安全展示配置\n- 生成 `.env.example` 模板\n- 多格式导出（shell / JSON / Docker / YAML）\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我看看这个 .env 文件」「检查一下环境变量配置」\n2. 用户说「对比一下开发和生产环境的配置」「看看 staging 和 prod 有什么不同」\n3. 用户说「生成一个 .env.example」「把敏感信息去掉做个模板」\n4. 用户说「检查一下哪些变量没填」「看看有没有缺失的配置」\n5. 用户说「把 .env 转成 JSON / YAML / Docker 格式」\n6. 用户说「这个配置有没有问题」「帮我审计一下环境变量」\n7. 用户说「哪些是密钥需要脱敏」「安全检查一下配置」\n\n## 三、支持的功能\n\n### 3.1 .env 文件解析\n\n- 支持 `KEY=VALUE` 格式\n- 支持注释（`#` 开头）\n- 支持引号包裹的值（单引号、双引号）\n- 支持 `export KEY=VALUE` 格式\n- 保留原始顺序和注释\n- 支持空值和默认值\n\n### 3.2 多环境对比\n\n- 对比两个或多个 .env 文件\n- 找出仅在 A 中存在的变量\n- 找出仅在 B 中存在的变量\n- 找出值不同的变量\n- 输出差异报告\n\n### 3.3 配置审计\n\n- **缺失检测**：值为空的变量\n- **重复检测**：同名变量多次定义\n- **格式校验**：\n  - URL 格式（http/https）\n  - 端口范围（1-65535）\n  - 邮箱格式\n  - 文件路径存在性\n  - 布尔值（true/false/yes/no/1/0）\n  - 整数范围\n- **密钥检测**：识别可能的密钥/Token（含 key、secret、token、password 等关键词）\n\n### 3.4 密钥脱敏\n\n- 自动识别敏感变量\n- 显示时替换为 `***`\n- 可自定义脱敏规则\n- 支持部分显示（如前4后4）\n\n### 3.5 模板生成\n\n- 从 .env 生成 .env.example\n- 自动移除敏感值\n- 保留注释和结构\n- 添加填写说明\n\n### 3.6 多格式导出\n\n- **Shell**：`export KEY=VALUE`\n- **JSON**：`{\"KEY\": \"VALUE\"}`\n- **Docker**：`-e KEY=VALUE` 或 Docker Compose 格式\n- **YAML**：键值对格式\n\n## 四、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 解析单个文件 / 对比多个文件 / 生成模板 / 格式转换 / 安全审计\n- 文件路径\n- 输出格式\n\n### 步骤 2：运行脚本\n\n使用 `scripts/manage_env.py`：\n\n```bash\n# 解析并显示 .env（自动脱敏）\npython3 scripts/manage_env.py --file .env\n\n# 对比两个环境\npython3 scripts/manage_env.py --file .env.dev --compare .env.prod\n\n# 生成 .env.example\npython3 scripts/manage_env.py --file .env --template\n\n# 格式校验\npython3 scripts/manage_env.py --file .env --validate\n\n# 导出为 JSON\npython3 scripts/manage_env.py --file .env --export json\n\n# 导出为 Docker 格式\npython3 scripts/manage_env.py --file .env --export docker\n\n# 导出为 YAML\npython3 scripts/manage_env.py --file .env --export yaml\n\n# 完整审计报告\npython3 scripts/manage_env.py --file .env --audit\n\n# 不脱敏显示（谨慎使用）\npython3 scripts/manage_env.py --file .env --no-mask\n```\n\n### 步骤 3：解读结果\n\n- **解析模式**：显示所有变量，密钥自动脱敏\n- **对比模式**：输出差异列表（仅A有、仅B有、值不同）\n- **审计模式**：输出问题清单（缺失、重复、格式错误、密钥未脱敏）\n- **模板模式**：生成可分享的 .env.example\n\n### 步骤 4：安全提示\n\n1. 不要将包含真实密钥的 .env 文件提交到 Git\n2. .env 文件应加入 .gitignore\n3. 生产环境密钥应使用密钥管理服务（如 Vault、AWS Secrets Manager）\n4. 定期轮换密钥\n5. 不同环境使用不同密钥\n\n## 五、输出规范\n\n### 5.1 解析结果\n\n```\n📋 环境变量解析结果\n━━━━━━━━━━━━━━━━━━━━━━━━\n文件：.env\n变量数：12\n注释行：3\n空行：2\n\n🔐 敏感变量（已脱敏）：\n  DATABASE_URL=postgresql://user:***@localhost:5432/db\n  API_KEY=sk-***4f2a\n  SECRET_KEY=***\n\n📝 普通变量：\n  NODE_ENV=production\n  PORT=3000\n  LOG_LEVEL=info\n  DEBUG=false\n```\n\n### 5.2 对比结果\n\n```\n🔍 环境对比报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n文件 A：.env.dev（15 个变量）\n文件 B：.env.prod（18 个变量）\n\n⚠️  仅在 A 中存在（3 个）：\n  - DEBUG=true\n  - DEV_MODE=enabled\n  - LOCAL_CACHE=true\n\n⚠️  仅在 B 中存在（6 个）：\n  - PRODUCTION_SECRET=***\n  - CDN_URL=https://cdn.example.com\n  - SSL_CERT_PATH=/etc/ssl/cert.pem\n  ...\n\n❌ 值不同（2 个）：\n  - NODE_ENV: A=development, B=production\n  - PORT: A=3000, B=8080\n\n✅ 相同（10 个）\n```\n\n### 5.3 审计报告\n\n```\n🔒 配置审计报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n文件：.env\n总变量数：15\n\n❌ 问题发现：\n\n1. 空值变量（2 个）：\n   - EMAIL_PASSWORD=（未填写）\n   - BACKUP_KEY=（未填写）\n\n2. 重复定义（1 个）：\n   - PORT 定义了 2 次（第 5 行、第 12 行）\n\n3. 格式错误（1 个）：\n   - PORT=99999（超出范围 1-65535）\n   - API_URL=not-a-url（不是有效的 URL）\n\n4. 疑似密钥（4 个）：\n   - DATABASE_URL（含密码）\n   - API_KEY\n   - SECRET_KEY\n   - JWT_SECRET\n\n✅ 校验通过：11 个变量\n\n💡 建议：\n  - 空值变量请尽快填写\n  - 重复定义会导致后值覆盖前值\n  - 确保 .env 已加入 .gitignore\n```\n\n## 六、常见场景处理\n\n### 场景 1：新项目初始化\n**用户**：「帮我从这个 .env 生成一个可以提交到 Git 的模板」\n**处理**：运行 `--template` → 生成 .env.example → 提醒将 .env 加入 .gitignore。\n\n### 场景 2：部署前检查\n**用户**：「上线前帮我检查一下生产环境配置」\n**处理**：运行 `--audit` → 检查空值、格式、密钥 → 输出问题清单。\n\n### 场景 3：多环境同步\n**用户**：「看看开发和生产环境配置差了什么」\n**处理**：运行 `--compare` → 输出差异 → 提醒同步必要变量。\n\n### 场景 4：格式转换\n**用户**：「把 .env 转成 Docker Compose 能用的格式」\n**处理**：运行 `--export docker` → 输出 environment 块格式。\n\n### 场景 5：安全审计\n**用户**：「检查一下有没有密钥泄露风险」\n**处理**：运行 `--audit` → 识别所有密钥变量 → 检查是否有硬编码 → 给出安全建议。\n\n## 七、注意事项\n\n1. **安全第一**：默认所有输出自动脱敏，使用 `--no-mask` 时需提醒用户风险。\n2. **不修改原文件**：脚本默认只读，生成模板或导出时写入新文件，不覆盖原 .env。\n3. **格式容错**：解析时容忍常见格式问题（多余空格、缺少引号等），但会在审计中报告。\n4. **密钥识别**：基于变量名关键词（key、secret、token、password、pass、auth、credential 等）和值特征识别，可能有误报，审计时需人工确认。\n5. **路径校验**：检查文件路径是否存在时，基于当前运行环境，不同机器结果可能不同。\n6. **多行值**：支持双引号包裹的多行值，但不支持未闭合的引号。\n7. **编码**：默认 UTF-8 编码读取，其他编码可能需要转换。\n8. **大文件**：支持任意大小的 .env 文件，但建议变量数不超过 500 个以便阅读。\n9. **不执行**：脚本不会执行 .env 中的任何命令或变量替换，仅做文本解析。\n10. **导出格式**：导出时保留原始值（不脱敏），导出文件需妥善保管。\n\n## 八、文件结构\n\n```\nenv-manager/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── env-example-template.md            # .env.example 模板说明\n├── scripts/\n│   └── manage_env.py                     # 环境变量管理脚本\n└── examples/\n    ├── sample.env                         # 示例 .env 文件\n    └── sample-audit-report.md             # 示例审计报告\n```\n\n## 九、使用示例\n\n### 示例 1：快速查看\n**用户**：「看看这个 .env 里有什么」\n**AI**：运行 `--file .env` → 显示所有变量（密钥脱敏）→ 统计变量数和类型。\n\n### 示例 2：生成模板\n**用户**：「生成一个 .env.example，把敏感信息去掉」\n**AI**：运行 `--file .env --template` → 生成 .env.example → 提醒加入 .gitignore。\n\n### 示例 3：环境对比\n**用户**：「对比 .env.dev 和 .env.prod」\n**AI**：运行 `--compare` → 输出差异 → 提醒生产环境缺少的变量。\n", "files": {"SKILL.md": "---\nname: env-manager\ndescription: '环境变量管理助手。解析和管理 .env 配置文件，支持多环境对比（dev/staging/prod）、缺失变量检测、重复变量检测、格式校验（URL/端口/邮箱/路径等）、密钥脱敏显示、生成 .env.example 模板、导出为 shell/JSON/Docker/YAML 格式。适用于项目配置管理、多环境部署、配置审计、密钥安全检查等场景。'\n---\n\n# 环境变量管理助手\n\n## 一、技能定位\n\n本技能用于**管理和审计环境变量配置文件**。核心价值：\n\n- 解析 `.env` 文件，支持注释、引号、多行值\n- 多环境对比，快速发现配置差异\n- 自动检测缺失变量、重复变量、空值\n- 格式校验（URL、端口、邮箱、路径、布尔值等）\n- 密钥脱敏，安全展示配置\n- 生成 `.env.example` 模板\n- 多格式导出（shell / JSON / Docker / YAML）\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我看看这个 .env 文件」「检查一下环境变量配置」\n2. 用户说「对比一下开发和生产环境的配置」「看看 staging 和 prod 有什么不同」\n3. 用户说「生成一个 .env.example」「把敏感信息去掉做个模板」\n4. 用户说「检查一下哪些变量没填」「看看有没有缺失的配置」\n5. 用户说「把 .env 转成 JSON / YAML / Docker 格式」\n6. 用户说「这个配置有没有问题」「帮我审计一下环境变量」\n7. 用户说「哪些是密钥需要脱敏」「安全检查一下配置」\n\n## 三、支持的功能\n\n### 3.1 .env 文件解析\n\n- 支持 `KEY=VALUE` 格式\n- 支持注释（`#` 开头）\n- 支持引号包裹的值（单引号、双引号）\n- 支持 `export KEY=VALUE` 格式\n- 保留原始顺序和注释\n- 支持空值和默认值\n\n### 3.2 多环境对比\n\n- 对比两个或多个 .env 文件\n- 找出仅在 A 中存在的变量\n- 找出仅在 B 中存在的变量\n- 找出值不同的变量\n- 输出差异报告\n\n### 3.3 配置审计\n\n- **缺失检测**：值为空的变量\n- **重复检测**：同名变量多次定义\n- **格式校验**：\n  - URL 格式（http/https）\n  - 端口范围（1-65535）\n  - 邮箱格式\n  - 文件路径存在性\n  - 布尔值（true/false/yes/no/1/0）\n  - 整数范围\n- **密钥检测**：识别可能的密钥/Token（含 key、secret、token、password 等关键词）\n\n### 3.4 密钥脱敏\n\n- 自动识别敏感变量\n- 显示时替换为 `***`\n- 可自定义脱敏规则\n- 支持部分显示（如前4后4）\n\n### 3.5 模板生成\n\n- 从 .env 生成 .env.example\n- 自动移除敏感值\n- 保留注释和结构\n- 添加填写说明\n\n### 3.6 多格式导出\n\n- **Shell**：`export KEY=VALUE`\n- **JSON**：`{\"KEY\": \"VALUE\"}`\n- **Docker**：`-e KEY=VALUE` 或 Docker Compose 格式\n- **YAML**：键值对格式\n\n## 四、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 解析单个文件 / 对比多个文件 / 生成模板 / 格式转换 / 安全审计\n- 文件路径\n- 输出格式\n\n### 步骤 2：运行脚本\n\n使用 `scripts/manage_env.py`：\n\n```bash\n# 解析并显示 .env（自动脱敏）\npython3 scripts/manage_env.py --file .env\n\n# 对比两个环境\npython3 scripts/manage_env.py --file .env.dev --compare .env.prod\n\n# 生成 .env.example\npython3 scripts/manage_env.py --file .env --template\n\n# 格式校验\npython3 scripts/manage_env.py --file .env --validate\n\n# 导出为 JSON\npython3 scripts/manage_env.py --file .env --export json\n\n# 导出为 Docker 格式\npython3 scripts/manage_env.py --file .env --export docker\n\n# 导出为 YAML\npython3 scripts/manage_env.py --file .env --export yaml\n\n# 完整审计报告\npython3 scripts/manage_env.py --file .env --audit\n\n# 不脱敏显示（谨慎使用）\npython3 scripts/manage_env.py --file .env --no-mask\n```\n\n### 步骤 3：解读结果\n\n- **解析模式**：显示所有变量，密钥自动脱敏\n- **对比模式**：输出差异列表（仅A有、仅B有、值不同）\n- **审计模式**：输出问题清单（缺失、重复、格式错误、密钥未脱敏）\n- **模板模式**：生成可分享的 .env.example\n\n### 步骤 4：安全提示\n\n1. 不要将包含真实密钥的 .env 文件提交到 Git\n2. .env 文件应加入 .gitignore\n3. 生产环境密钥应使用密钥管理服务（如 Vault、AWS Secrets Manager）\n4. 定期轮换密钥\n5. 不同环境使用不同密钥\n\n## 五、输出规范\n\n### 5.1 解析结果\n\n```\n📋 环境变量解析结果\n━━━━━━━━━━━━━━━━━━━━━━━━\n文件：.env\n变量数：12\n注释行：3\n空行：2\n\n🔐 敏感变量（已脱敏）：\n  DATABASE_URL=postgresql://user:***@localhost:5432/db\n  API_KEY=sk-***4f2a\n  SECRET_KEY=***\n\n📝 普通变量：\n  NODE_ENV=production\n  PORT=3000\n  LOG_LEVEL=info\n  DEBUG=false\n```\n\n### 5.2 对比结果\n\n```\n🔍 环境对比报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n文件 A：.env.dev（15 个变量）\n文件 B：.env.prod（18 个变量）\n\n⚠️  仅在 A 中存在（3 个）：\n  - DEBUG=true\n  - DEV_MODE=enabled\n  - LOCAL_CACHE=true\n\n⚠️  仅在 B 中存在（6 个）：\n  - PRODUCTION_SECRET=***\n  - CDN_URL=https://cdn.example.com\n  - SSL_CERT_PATH=/etc/ssl/cert.pem\n  ...\n\n❌ 值不同（2 个）：\n  - NODE_ENV: A=development, B=production\n  - PORT: A=3000, B=8080\n\n✅ 相同（10 个）\n```\n\n### 5.3 审计报告\n\n```\n🔒 配置审计报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n文件：.env\n总变量数：15\n\n❌ 问题发现：\n\n1. 空值变量（2 个）：\n   - EMAIL_PASSWORD=（未填写）\n   - BACKUP_KEY=（未填写）\n\n2. 重复定义（1 个）：\n   - PORT 定义了 2 次（第 5 行、第 12 行）\n\n3. 格式错误（1 个）：\n   - PORT=99999（超出范围 1-65535）\n   - API_URL=not-a-url（不是有效的 URL）\n\n4. 疑似密钥（4 个）：\n   - DATABASE_URL（含密码）\n   - API_KEY\n   - SECRET_KEY\n   - JWT_SECRET\n\n✅ 校验通过：11 个变量\n\n💡 建议：\n  - 空值变量请尽快填写\n  - 重复定义会导致后值覆盖前值\n  - 确保 .env 已加入 .gitignore\n```\n\n## 六、常见场景处理\n\n### 场景 1：新项目初始化\n**用户**：「帮我从这个 .env 生成一个可以提交到 Git 的模板」\n**处理**：运行 `--template` → 生成 .env.example → 提醒将 .env 加入 .gitignore。\n\n### 场景 2：部署前检查\n**用户**：「上线前帮我检查一下生产环境配置」\n**处理**：运行 `--audit` → 检查空值、格式、密钥 → 输出问题清单。\n\n### 场景 3：多环境同步\n**用户**：「看看开发和生产环境配置差了什么」\n**处理**：运行 `--compare` → 输出差异 → 提醒同步必要变量。\n\n### 场景 4：格式转换\n**用户**：「把 .env 转成 Docker Compose 能用的格式」\n**处理**：运行 `--export docker` → 输出 environment 块格式。\n\n### 场景 5：安全审计\n**用户**：「检查一下有没有密钥泄露风险」\n**处理**：运行 `--audit` → 识别所有密钥变量 → 检查是否有硬编码 → 给出安全建议。\n\n## 七、注意事项\n\n1. **安全第一**：默认所有输出自动脱敏，使用 `--no-mask` 时需提醒用户风险。\n2. **不修改原文件**：脚本默认只读，生成模板或导出时写入新文件，不覆盖原 .env。\n3. **格式容错**：解析时容忍常见格式问题（多余空格、缺少引号等），但会在审计中报告。\n4. **密钥识别**：基于变量名关键词（key、secret、token、password、pass、auth、credential 等）和值特征识别，可能有误报，审计时需人工确认。\n5. **路径校验**：检查文件路径是否存在时，基于当前运行环境，不同机器结果可能不同。\n6. **多行值**：支持双引号包裹的多行值，但不支持未闭合的引号。\n7. **编码**：默认 UTF-8 编码读取，其他编码可能需要转换。\n8. **大文件**：支持任意大小的 .env 文件，但建议变量数不超过 500 个以便阅读。\n9. **不执行**：脚本不会执行 .env 中的任何命令或变量替换，仅做文本解析。\n10. **导出格式**：导出时保留原始值（不脱敏），导出文件需妥善保管。\n\n## 八、文件结构\n\n```\nenv-manager/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── env-example-template.md            # .env.example 模板说明\n├── scripts/\n│   └── manage_env.py                     # 环境变量管理脚本\n└── examples/\n    ├── sample.env                         # 示例 .env 文件\n    └── sample-audit-report.md             # 示例审计报告\n```\n\n## 九、使用示例\n\n### 示例 1：快速查看\n**用户**：「看看这个 .env 里有什么」\n**AI**：运行 `--file .env` → 显示所有变量（密钥脱敏）→ 统计变量数和类型。\n\n### 示例 2：生成模板\n**用户**：「生成一个 .env.example，把敏感信息去掉」\n**AI**：运行 `--file .env --template` → 生成 .env.example → 提醒加入 .gitignore。\n\n### 示例 3：环境对比\n**用户**：「对比 .env.dev 和 .env.prod」\n**AI**：运行 `--compare` → 输出差异 → 提醒生产环境缺少的变量。\n", "templates/env-example-template.md": "# .env.example 模板说明\n\n> 复制此文件为 `.env`，填写实际值后使用。\n> **切勿**将包含真实密钥的 `.env` 文件提交到版本控制。\n\n---\n\n## 模板结构\n\n```\n# 分组注释\n# 说明这个分组的用途\n\n# 变量说明（可选）\nVARIABLE_NAME=value\n\n# 密钥变量（留空，部署时填写）\nSECRET_KEY=\n```\n\n## 最佳实践\n\n### 1. 分组管理\n\n按功能分组，每组前加注释：\n\n```\n# === 数据库 ===\nDB_HOST=localhost\nDB_PORT=5432\nDB_NAME=myapp\n\n# === 认证 ===\nJWT_SECRET=\nAPI_KEY=\n```\n\n### 2. 密钥留空\n\n所有密钥、密码、Token 在模板中留空：\n\n```\nDATABASE_URL=\nAWS_SECRET_ACCESS_KEY=\nSTRIPE_API_KEY=\n```\n\n### 3. 提供默认值\n\n非敏感变量提供合理默认值：\n\n```\nPORT=3000\nLOG_LEVEL=info\nNODE_ENV=development\n```\n\n### 4. 添加注释说明\n\n每个变量前说明用途和可选值：\n\n```\n# 日志级别：debug, info, warn, error\nLOG_LEVEL=info\n\n# 是否启用调试模式：true, false\nDEBUG=false\n```\n\n### 5. .gitignore 配置\n\n确保 `.env` 已加入 `.gitignore`：\n\n```\n# .gitignore\n.env\n.env.local\n.env.*.local\n*.pem\n*.key\n```\n\n## 生成命令\n\n```bash\n# 从现有 .env 生成模板\npython3 manage_env.py --file .env --template --output .env.example\n```\n\n## 检查清单\n\n- [ ] 所有密钥已留空或替换为占位符\n- [ ] 非敏感变量有合理默认值\n- [ ] 每个分组有注释说明\n- [ ] .env 已加入 .gitignore\n- [ ] 模板可直接复制使用\n\n---\n\n*模板由 env-manager 技能提供*\n", "scripts/manage_env.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\n环境变量管理脚本\n\n功能：\n- 解析 .env 文件（支持注释、引号、export 前缀）\n- 多环境对比（差异检测）\n- 配置审计（空值、重复、格式校验、密钥检测）\n- 生成 .env.example 模板\n- 多格式导出（shell/json/docker/yaml）\n- 密钥脱敏显示\n\n用法：\n  python3 manage_env.py --file .env\n  python3 manage_env.py --file .env --compare .env.prod\n  python3 manage_env.py --file .env --template\n  python3 manage_env.py --file .env --validate\n  python3 manage_env.py --file .env --audit\n  python3 manage_env.py --file .env --export json\n  python3 manage_env.py --file .env --export docker\n  python3 manage_env.py --file .env --no-mask\n\"\"\"\n\nimport argparse\nimport json\nimport os\nimport re\nimport sys\nfrom typing import Dict, List, Optional, Tuple\n\n\n# ============================================================\n# 密钥关键词\n# ============================================================\n\nSECRET_KEYWORDS = [\n    \"secret\", \"password\", \"passwd\", \"token\", \"api_key\", \"apikey\",\n    \"private_key\", \"access_key\", \"auth\", \"credential\", \"credentials\",\n    \"db_pass\", \"database_url\", \"connection_string\", \"jwt\", \"signing_key\",\n    \"encryption_key\", \"aws_secret\", \"azure_key\", \"gcp_key\",\n]\n\n# 值中包含密码的模式（如 user:pass@host）\nPASSWORD_IN_VALUE = re.compile(r'://[^:]+:([^@]+)@')\n\n\n# ============================================================\n# .env 解析\n# ============================================================\n\nclass EnvEntry:\n    \"\"\"单个环境变量条目\"\"\"\n    def __init__(self, key: str, value: str, line_num: int,\n                 raw_line: str, comment: str = \"\", is_export: bool = False):\n        self.key = key\n        self.value = value\n        self.line_num = line_num\n        self.raw_line = raw_line\n        self.comment = comment\n        self.is_export = is_export\n\n\ndef parse_env_file(filepath: str) -> Tuple[List[EnvEntry], List[str]]:\n    \"\"\"\n    解析 .env 文件\n    返回 (条目列表, 原始行列表)\n    \"\"\"\n    entries = []\n    raw_lines = []\n\n    if not os.path.exists(filepath):\n        print(f\"错误：文件不存在：{filepath}\", file=sys.stderr)\n        sys.exit(1)\n\n    with open(filepath, 'r', encoding='utf-8') as f:\n        lines = f.readlines()\n\n    current_comment = \"\"\n    for i, line in enumerate(lines, 1):\n        raw_lines.append(line.rstrip('\\n'))\n        stripped = line.strip()\n\n        # 空行\n        if not stripped:\n            current_comment = \"\"\n            continue\n\n        # 注释行\n        if stripped.startswith('#'):\n            current_comment = stripped.lstrip('#').strip()\n            continue\n\n        # export 前缀\n        is_export = False\n        if stripped.startswith('export '):\n            is_export = True\n            stripped = stripped[7:].strip()\n\n        # 解析 KEY=VALUE\n        if '=' not in stripped:\n            continue\n\n        key, _, value = stripped.partition('=')\n        key = key.strip()\n\n        # 移除行内注释（值中 # 前有空格才算注释）\n        comment = \"\"\n        if ' #' in value:\n            value, comment = value.split(' #', 1)\n            value = value.strip()\n            comment = comment.strip()\n\n        # 去除引号\n        value = value.strip()\n        if len(value) >= 2:\n            if (value.startswith('\"') and value.endswith('\"')) or \\\n               (value.startswith(\"'\") and value.endswith(\"'\")):\n                value = value[1:-1]\n\n        if not key or not re.match(r'^[A-Za-z_][A-Za-z0-9_]*$', key):\n            continue\n\n        entries.append(EnvEntry(\n            key=key,\n            value=value,\n            line_num=i,\n            raw_line=line.rstrip('\\n'),\n            comment=comment or current_comment,\n            is_export=is_export,\n        ))\n        current_comment = \"\"\n\n    return entries, raw_lines\n\n\ndef entries_to_dict(entries: List[EnvEntry]) -> Dict[str, str]:\n    \"\"\"转换为字典（后值覆盖前值）\"\"\"\n    result = {}\n    for e in entries:\n        result[e.key] = e.value\n    return result\n\n\n# ============================================================\n# 密钥检测与脱敏\n# ============================================================\n\ndef is_secret_key(key: str) -> bool:\n    \"\"\"判断变量名是否可能是密钥\"\"\"\n    key_lower = key.lower()\n    return any(kw in key_lower for kw in SECRET_KEYWORDS)\n\n\ndef mask_value(key: str, value: str) -> str:\n    \"\"\"脱敏处理\"\"\"\n    if not value:\n        return \"(空)\"\n\n    # URL 中的密码\n    url_match = PASSWORD_IN_VALUE.search(value)\n    if url_match:\n        password = url_match.group(1)\n        return value.replace(password, '***')\n\n    # 密钥变量\n    if is_secret_key(key):\n        if len(value) <= 8:\n            return '***'\n        return value[:4] + '***' + value[-4:]\n\n    return value\n\n\n# ============================================================\n# 格式校验\n# ============================================================\n\ndef validate_entry(entry: EnvEntry) -> List[str]:\n    \"\"\"校验单个变量，返回问题列表\"\"\"\n    issues = []\n    key = entry.key\n    value = entry.value\n    key_lower = key.lower()\n\n    # 空值\n    if not value:\n        issues.append(\"值为空\")\n        return issues\n\n    # 端口校验\n    if 'port' in key_lower:\n        try:\n            port = int(value)\n            if port < 1 or port > 65535:\n                issues.append(f\"端口超出范围（1-65535）：{port}\")\n        except ValueError:\n            issues.append(f\"端口不是有效整数：{value}\")\n\n    # URL 校验\n    if any(kw in key_lower for kw in ['url', 'uri', 'endpoint', 'host']):\n        if not re.match(r'^https?://', value) and not re.match(r'^[a-zA-Z0-9.-]+:\\d+$', value):\n            if '://' not in value and not value.startswith('/'):\n                issues.append(f\"可能不是有效的 URL：{value[:50]}\")\n\n    # 邮箱校验\n    if 'email' in key_lower or 'mail' in key_lower:\n        if not re.match(r'^[^@]+@[^@]+\\.[^@]+$', value):\n            issues.append(f\"可能不是有效的邮箱：{value[:50]}\")\n\n    # 布尔值校验\n    if any(kw in key_lower for kw in ['enable', 'disable', 'debug', 'ssl', 'tls', 'cache']):\n        if value.lower() not in ('true', 'false', 'yes', 'no', '1', '0', 'on', 'off'):\n            if len(value) < 20:  # 短值才提示\n                issues.append(f\"可能不是有效的布尔值：{value}\")\n\n    # 路径校验\n    if any(kw in key_lower for kw in ['path', 'dir', 'file', 'cert', 'key_file']):\n        if value.startswith('/') or value.startswith('./') or value.startswith('../'):\n            if not os.path.exists(value):\n                issues.append(f\"路径不存在：{value}\")\n\n    return issues\n\n\n# ============================================================\n# 审计\n# ============================================================\n\ndef audit_env(entries: List[EnvEntry]) -> Dict:\n    \"\"\"审计 .env 文件\"\"\"\n    result = {\n        \"total\": len(entries),\n        \"empty\": [],\n        \"duplicates\": {},\n        \"format_issues\": [],\n        \"secrets\": [],\n        \"passed\": [],\n    }\n\n    # 检测重复\n    key_counts = {}\n    for e in entries:\n        key_counts.setdefault(e.key, []).append(e.line_num)\n\n    for key, lines in key_counts.items():\n        if len(lines) > 1:\n            result[\"duplicates\"][key] = lines\n\n    # 逐项检查\n    seen_keys = set()\n    for e in entries:\n        # 空值\n        if not e.value:\n            result[\"empty\"].append({\"key\": e.key, \"line\": e.line_num})\n            continue\n\n        # 格式校验\n        issues = validate_entry(e)\n        if issues:\n            result[\"format_issues\"].append({\n                \"key\": e.key,\n                \"line\": e.line_num,\n                \"value\": e.value[:60],\n                \"issues\": issues,\n            })\n\n        # 密钥检测\n        if is_secret_key(e.key) or PASSWORD_IN_VALUE.search(e.value):\n            result[\"secrets\"].append({\n                \"key\": e.key,\n                \"line\": e.line_num,\n                \"masked\": mask_value(e.key, e.value),\n            })\n\n        if e.key not in seen_keys and e.value:\n            result[\"passed\"].append(e.key)\n            seen_keys.add(e.key)\n\n    return result\n\n\n# ============================================================\n# 对比\n# ============================================================\n\ndef compare_env(entries_a: List[EnvEntry], entries_b: List[EnvEntry]) -> Dict:\n    \"\"\"对比两个 .env 文件\"\"\"\n    dict_a = entries_to_dict(entries_a)\n    dict_b = entries_to_dict(entries_b)\n\n    keys_a = set(dict_a.keys())\n    keys_b = set(dict_b.keys())\n\n    only_a = sorted(keys_a - keys_b)\n    only_b = sorted(keys_b - keys_a)\n    common = sorted(keys_a & keys_b)\n\n    different = []\n    same = []\n    for key in common:\n        if dict_a[key] != dict_b[key]:\n            different.append({\n                \"key\": key,\n                \"value_a\": mask_value(key, dict_a[key]),\n                \"value_b\": mask_value(key, dict_b[key]),\n            })\n        else:\n            same.append(key)\n\n    return {\n        \"only_a\": only_a,\n        \"only_b\": only_b,\n        \"different\": different,\n        \"same\": same,\n        \"count_a\": len(dict_a),\n        \"count_b\": len(dict_b),\n    }\n\n\n# ============================================================\n# 模板生成\n# ============================================================\n\ndef generate_template(entries: List[EnvEntry], raw_lines: List[str]) -> str:\n    \"\"\"生成 .env.example\"\"\"\n    lines = []\n    lines.append(\"# 环境变量模板\")\n    lines.append(\"# 复制此文件为 .env 并填写实际值\")\n    lines.append(\"# 请勿将包含真实密钥的 .env 文件提交到版本控制\")\n    lines.append(\"\")\n\n    for e in entries:\n        # 保留注释\n        if e.comment:\n            lines.append(f\"# {e.comment}\")\n\n        if is_secret_key(e.key) or PASSWORD_IN_VALUE.search(e.value):\n            # 密钥变量：清空值，给提示\n            lines.append(f\"{e.key}=\")\n        else:\n            # 普通变量：保留示例值\n            lines.append(f\"{e.key}={e.value}\")\n        lines.append(\"\")\n\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 导出\n# ============================================================\n\ndef export_shell(entries: List[EnvEntry]) -> str:\n    \"\"\"导出为 shell 格式\"\"\"\n    lines = [\"#!/bin/bash\", \"# 环境变量导出\", \"\"]\n    for e in entries:\n        value = e.value.replace(\"'\", \"'\\\\''\")\n        lines.append(f\"export {e.key}='{value}'\")\n    return \"\\n\".join(lines)\n\n\ndef export_json(entries: List[EnvEntry]) -> str:\n    \"\"\"导出为 JSON\"\"\"\n    data = entries_to_dict(entries)\n    return json.dumps(data, ensure_ascii=False, indent=2)\n\n\ndef export_docker(entries: List[EnvEntry]) -> str:\n    \"\"\"导出为 Docker Compose 格式\"\"\"\n    lines = [\"environment:\"]\n    for e in entries:\n        lines.append(f\"  - {e.key}={e.value}\")\n    return \"\\n\".join(lines)\n\n\ndef export_yaml(entries: List[EnvEntry]) -> str:\n    \"\"\"导出为 YAML\"\"\"\n    lines = [\"env:\"]\n    for e in entries:\n        lines.append(f\"  {e.key}: \\\"{e.value}\\\"\")\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 输出格式化\n# ============================================================\n\ndef format_parse(entries: List[EnvEntry], mask: bool = True) -> str:\n    \"\"\"格式化解析结果\"\"\"\n    lines = []\n    lines.append(\"📋 环境变量解析结果\")\n    lines.append(\"━\" * 40)\n    lines.append(f\"变量数：{len(entries)}\")\n\n    secrets = []\n    normal = []\n    for e in entries:\n        if is_secret_key(e.key) or PASSWORD_IN_VALUE.search(e.value):\n            secrets.append(e)\n        else:\n            normal.append(e)\n\n    if secrets:\n        lines.append(\"\")\n        lines.append(f\"🔐 敏感变量（{len(secrets)} 个，已脱敏）：\")\n        for e in secrets:\n            val = mask_value(e.key, e.value) if mask else e.value\n            lines.append(f\"  {e.key}={val}\")\n\n    if normal:\n        lines.append(\"\")\n        lines.append(f\"📝 普通变量（{len(normal)} 个）：\")\n        for e in normal:\n            val = e.value\n            if len(val) > 60:\n                val = val[:57] + \"...\"\n            lines.append(f\"  {e.key}={val}\")\n\n    lines.append(\"\")\n    lines.append(\"━\" * 40)\n    return \"\\n\".join(lines)\n\n\ndef format_compare(result: Dict, name_a: str, name_b: str) -> str:\n    \"\"\"格式化对比结果\"\"\"\n    lines = []\n    lines.append(\"🔍 环境对比报告\")\n    lines.append(\"━\" * 40)\n    lines.append(f\"文件 A：{name_a}（{result['count_a']} 个变量）\")\n    lines.append(f\"文件 B：{name_b}（{result['count_b']} 个变量）\")\n\n    if result[\"only_a\"]:\n        lines.append(\"\")\n        lines.append(f\"⚠️  仅在 A 中存在（{len(result['only_a'])} 个）：\")\n        for k in result[\"only_a\"]:\n            lines.append(f\"  - {k}\")\n\n    if result[\"only_b\"]:\n        lines.append(\"\")\n        lines.append(f\"⚠️  仅在 B 中存在（{len(result['only_b'])} 个）：\")\n        for k in result[\"only_b\"]:\n            lines.append(f\"  - {k}\")\n\n    if result[\"different\"]:\n        lines.append(\"\")\n        lines.append(f\"❌ 值不同（{len(result['different'])} 个）：\")\n        for d in result[\"different\"]:\n            lines.append(f\"  - {d['key']}: A={d['value_a']}, B={d['value_b']}\")\n\n    lines.append(\"\")\n    lines.append(f\"✅ 相同（{len(result['same'])} 个）\")\n    lines.append(\"━\" * 40)\n    return \"\\n\".join(lines)\n\n\ndef format_audit(result: Dict) -> str:\n    \"\"\"格式化审计结果\"\"\"\n    lines = []\n    lines.append(\"🔒 配置审计报告\")\n    lines.append(\"━\" * 40)\n    lines.append(f\"总变量数：{result['total']}\")\n\n    has_issues = False\n\n    if result[\"empty\"]:\n        has_issues = True\n        lines.append(\"\")\n        lines.append(f\"❌ 空值变量（{len(result['empty'])} 个）：\")\n        for e in result[\"empty\"]:\n            lines.append(f\"  - {e['key']}=（第 {e['line']} 行，未填写）\")\n\n    if result[\"duplicates\"]:\n        has_issues = True\n        lines.append(\"\")\n        lines.append(f\"❌ 重复定义（{len(result['duplicates'])} 个）：\")\n        for key, lines_list in result[\"duplicates\"].items():\n            lines.append(f\"  - {key}：定义于第 {', '.join(map(str, lines_list))} 行\")\n\n    if result[\"format_issues\"]:\n        has_issues = True\n        lines.append(\"\")\n        lines.append(f\"❌ 格式问题（{len(result['format_issues'])} 个）：\")\n        for fi in result[\"format_issues\"]:\n            lines.append(f\"  - {fi['key']}（第 {fi['line']} 行）：\")\n            for issue in fi[\"issues\"]:\n                lines.append(f\"    · {issue}\")\n\n    if result[\"secrets\"]:\n        lines.append(\"\")\n        lines.append(f\"🔐 疑似密钥（{len(result['secrets'])} 个）：\")\n        for s in result[\"secrets\"]:\n            lines.append(f\"  - {s['key']}（第 {s['line']} 行）：{s['masked']}\")\n\n    if not has_issues:\n        lines.append(\"\")\n        lines.append(\"✅ 未发现问题\")\n\n    lines.append(\"\")\n    lines.append(f\"✅ 校验通过：{len(result['passed'])} 个变量\")\n    lines.append(\"\")\n    lines.append(\"💡 建议：\")\n    lines.append(\"  - 确保 .env 已加入 .gitignore\")\n    lines.append(\"  - 空值变量请尽快填写\")\n    lines.append(\"  - 生产环境密钥建议使用密钥管理服务\")\n    lines.append(\"━\" * 40)\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"环境变量管理工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--file\", \"-f\", required=True, help=\".env 文件路径\")\n    parser.add_argument(\"--compare\", \"-c\", metavar=\"FILE\", help=\"对比另一个 .env 文件\")\n    parser.add_argument(\"--template\", \"-t\", action=\"store_true\", help=\"生成 .env.example\")\n    parser.add_argument(\"--validate\", \"-v\", action=\"store_true\", help=\"格式校验\")\n    parser.add_argument(\"--audit\", \"-a\", action=\"store_true\", help=\"完整审计\")\n    parser.add_argument(\"--export\", \"-e\", choices=[\"shell\", \"json\", \"docker\", \"yaml\"],\n                        help=\"导出格式\")\n    parser.add_argument(\"--no-mask\", action=\"store_true\", help=\"不脱敏显示（谨慎使用）\")\n    parser.add_argument(\"--output\", \"-o\", metavar=\"FILE\", help=\"输出到文件\")\n    args = parser.parse_args()\n\n    # 解析文件\n    entries, raw_lines = parse_env_file(args.file)\n\n    output = \"\"\n\n    # 对比模式\n    if args.compare:\n        entries_b, _ = parse_env_file(args.compare)\n        result = compare_env(entries, entries_b)\n        output = format_compare(result, os.path.basename(args.file),\n                                os.path.basename(args.compare))\n\n    # 模板模式\n    elif args.template:\n        output = generate_template(entries, raw_lines)\n\n    # 审计模式\n    elif args.audit:\n        result = audit_env(entries)\n        output = format_audit(result)\n\n    # 校验模式\n    elif args.validate:\n        result = audit_env(entries)\n        # 只显示格式问题\n        issues = result[\"format_issues\"]\n        if issues:\n            output = f\"📋 格式校验：发现 {len(issues)} 个问题\\n\"\n            output += \"━\" * 40 + \"\\n\"\n            for fi in issues:\n                output += f\"  - {fi['key']}（第 {fi['line']} 行）：\\n\"\n                for issue in fi[\"issues\"]:\n                    output += f\"    · {issue}\\n\"\n        else:\n            output = \"✅ 格式校验通过，未发现问题\"\n\n    # 导出模式\n    elif args.export:\n        if args.export == \"shell\":\n            output = export_shell(entries)\n        elif args.export == \"json\":\n            output = export_json(entries)\n        elif args.export == \"docker\":\n            output = export_docker(entries)\n        elif args.export == \"yaml\":\n            output = export_yaml(entries)\n\n    # 默认：解析显示\n    else:\n        output = format_parse(entries, mask=not args.no_mask)\n\n    # 输出\n    print(output)\n\n    if args.output:\n        with open(args.output, 'w', encoding='utf-8') as f:\n            f.write(output + \"\\n\")\n        print(f\"\\n已保存到：{args.output}\", file=sys.stderr)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-audit-report.md": "# 示例：环境变量审计报告\n\n> 使用 `manage_env.py --file sample.env --audit` 生成。\n\n---\n\n## 基本信息\n\n| 项目 | 值 |\n|---|---|\n| 文件 | sample.env |\n| 总变量数 | 26 |\n| 敏感变量 | 8 个 |\n| 空值变量 | 1 个 |\n| 格式问题 | 4 个（含误报） |\n\n---\n\n## 问题清单\n\n### 1. 空值变量\n\n| 变量名 | 行号 | 说明 |\n|---|---|---|\n| `EMAIL_PASSWORD` | 42 | 未填写，邮件功能将无法使用 |\n\n**建议**：填写 SMTP 密码，或如果不使用邮件功能，移除相关配置。\n\n### 2. 疑似密钥（已脱敏）\n\n| 变量名 | 行号 | 脱敏值 |\n|---|---|---|\n| `DATABASE_URL` | 15 | `postgresql://app_user:***@db.example.com:5432/production` |\n| `JWT_SECRET` | 20 | `my-s***2026` |\n| `API_KEY` | 22 | `sk-l***1d0e` |\n| `STRIPE_SECRET_KEY` | 25 | `sk_t***9r0q` |\n| `SENDGRID_API_KEY` | 26 | `SG.a***9012` |\n| `AWS_ACCESS_KEY_ID` | 27 | `AKIA***MPLE` |\n| `AWS_SECRET_ACCESS_KEY` | 28 | `wJal***EKEY` |\n\n**建议**：\n- 生产环境密钥建议使用密钥管理服务（Vault / AWS Secrets Manager）\n- 定期轮换密钥\n- 确保 .env 已加入 .gitignore\n\n### 3. 格式提示（可能为误报）\n\n| 变量名 | 提示 | 说明 |\n|---|---|---|\n| `HOST=0.0.0.0` | 可能不是有效 URL | 实际为绑定地址，属正常配置 |\n| `CACHE_TTL=3600` | 可能不是布尔值 | 实际为秒数，变量名含 cache 触发误报 |\n| `EMAIL_HOST=smtp.example.com` | 可能不是有效 URL/邮箱 | 实际为 SMTP 主机名，属正常 |\n\n> 注：格式校验基于启发式规则，可能存在误报，请结合实际场景判断。\n\n---\n\n## 安全建议\n\n1. **立即行动**：填写 `EMAIL_PASSWORD` 空值\n2. **短期改进**：将 8 个密钥迁移到密钥管理服务\n3. **长期规划**：建立密钥轮换机制，每 90 天轮换一次\n4. **版本控制**：确认 `.env` 已加入 `.gitignore`，检查 Git 历史中是否有泄露\n\n---\n\n## 校验通过的变量（25 个）\n\n`NODE_ENV`, `DEBUG`, `PORT`, `API_URL`, `DB_POOL_SIZE`, `DB_TIMEOUT`, `JWT_EXPIRES_IN`, `LOG_LEVEL`, `LOG_FORMAT`, `REDIS_URL`, `CACHE_TTL`, `EMAIL_HOST`, `EMAIL_PORT`, `EMAIL_USER`, `ENABLE_ANALYTICS`, `ENABLE_SSL`, `MAINTENANCE_MODE` 等。\n\n---\n\n*报告由 env-manager 技能生成*\n", "examples/sample.env": "# 应用配置\n# 环境：production\n# 更新日期：2026-09-30\n\n# 运行环境\nNODE_ENV=production\nDEBUG=false\n\n# 服务配置\nPORT=3000\nHOST=0.0.0.0\nAPI_URL=https://api.example.com/v1\n\n# 数据库配置\nDATABASE_URL=postgresql://app_user:SuperSecret123@db.example.com:5432/production\nDB_POOL_SIZE=20\nDB_TIMEOUT=30000\n\n# 认证配置\nJWT_SECRET=my-super-secret-jwt-key-2026\nJWT_EXPIRES_IN=86400\nAPI_KEY=sk-live-4f2a9b8c7d6e5f4a3b2c1d0e\n\n# 第三方服务\nSTRIPE_SECRET_KEY=sk_test_51H7x2y3z4w5v6u7t8s9r0q\nSENDGRID_API_KEY=SG.abcdef123456.ghijkl789012\nAWS_ACCESS_KEY_ID=AKIAIOSFODNN7EXAMPLE\nAWS_SECRET_ACCESS_KEY=wJalrXUtnFEMI/K7MDENG/bPxRfiCYEXAMPLEKEY\n\n# 日志配置\nLOG_LEVEL=info\nLOG_FORMAT=json\n\n# 缓存配置\nREDIS_URL=redis://localhost:6379/0\nCACHE_TTL=3600\n\n# 邮件配置（待填写）\nEMAIL_HOST=smtp.example.com\nEMAIL_PORT=587\nEMAIL_USER=noreply@example.com\nEMAIL_PASSWORD=\n\n# 功能开关\nENABLE_ANALYTICS=true\nENABLE_SSL=true\nMAINTENANCE_MODE=false\n"}, "file_count": 5, "script_lines": 591}, {"name": "expense-tracker", "title": "expense-tracker", "description": "个人记账与消费分析助手。帮助用户记录日常支出收入，自动按类别归类（餐饮、交通、购物、住房、娱乐、医疗、教育等），生成月度/周度消费报告，分析消费趋势，识别异常支出，提供预算执行情况和省钱建议。适用于个人记账、家庭开支管理、月度消费复盘、预算控制等场景。", "category": "生活管理", "icon": "💰", "color": "#10b981", "skill_md": "---\nname: expense-tracker\ndescription: '个人记账与消费分析助手。帮助用户记录日常支出收入，自动按类别归类（餐饮、交通、购物、住房、娱乐、医疗、教育等），生成月度/周度消费报告，分析消费趋势，识别异常支出，提供预算执行情况和省钱建议。适用于个人记账、家庭开支管理、月度消费复盘、预算控制等场景。'\n---\n\n# 个人记账与消费分析助手\n\n## 一、技能定位\n\n本技能用于**个人和家庭的日常收支记录与消费分析**。核心价值：\n\n- 降低记账门槛：用户用自然语言描述消费即可，AI 自动解析金额、类别、日期\n- 自动分类：根据消费描述智能匹配消费类别，无需手动选择\n- 可视化报告：按月/周生成消费报告，包含分类占比、趋势对比、预算执行\n- 异常识别：标记超出常规的大额支出或异常消费\n- 省钱建议：基于消费数据给出可操作的节省建议\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我记一笔账」「今天花了XX钱」「午餐35元」等记账需求\n2. 用户提供消费记录（文本、CSV、截图），要求整理或分析\n3. 用户说「帮我看看这个月花了多少钱」「生成月度消费报告」「分析一下我的消费」\n4. 用户说「我这个月预算超了吗」「帮我看看哪里花多了」「有什么省钱建议」\n5. 用户需要将散乱的消费记录整理成结构化的表格\n6. 用户说「帮我做个记账模板」「设置每月预算」\n\n## 三、消费类别体系\n\n### 3.1 标准类别\n\n| 一级类别 | 二级类别/典型消费 |\n|---|---|\n| 🍜 餐饮 | 早餐、午餐、晚餐、零食饮料、外卖、咖啡奶茶、水果、食材 |\n| 🚇 交通 | 地铁公交、打车、加油、停车、过路费、火车票、机票、共享单车 |\n| 🛒 购物 | 服饰鞋包、美妆护肤、日用品、数码产品、家居用品、书籍文具 |\n| 🏠 住房 | 房租/房贷、水电燃气、物业费、宽带、家具家电、维修 |\n| 🎮 娱乐 | 电影演出、游戏充值、会员订阅、旅游、运动健身、聚会社交 |\n| 💊 医疗 | 门诊挂号、药品、体检、保健品、牙科、眼科 |\n| 📚 教育 | 课程培训、考试报名、书籍、学习工具、在线课程 |\n| 🧧 人情 | 红包、礼物、请客、捐赠、份子钱 |\n| 📱 通讯 | 手机话费、流量包、网络服务 |\n| 💰 金融 | 保险、理财、贷款还款、手续费、利息 |\n| 🐾 宠物 | 宠物食品、医疗、用品、美容 |\n| 🚼 育儿 | 奶粉尿布、玩具、童装、早教、学费 |\n| 📦 其他 | 无法归类的杂项支出 |\n\n### 3.2 收入类别\n\n| 类别 | 典型收入 |\n|---|---|\n| 💰 工资 | 基本工资、奖金、津贴、加班费 |\n| 📈 理财 | 利息、股息、基金收益、租金收入 |\n| 🎁 其他 | 红包、退款、报销、兼职、二手出售 |\n\n## 四、操作步骤\n\n### 步骤 1：接收并解析消费记录\n\n根据用户输入形式选择处理方式：\n\n**方式 A：自然语言单笔记账**\n用户输入如「今天午餐35元」「打车回家28块」「买了件衣服299」。\nAI 解析出：日期、金额、类别、描述、支付方式（如有）。\n\n**方式 B：批量文本记录**\n用户提供多行消费记录，如：\n```\n9/1 早餐 8\n9/1 地铁 6\n9/1 午餐 35\n9/2 超市 156.5\n```\nAI 逐行解析，统一格式。\n\n**方式 C：CSV/表格文件**\n用户提供 CSV 或 Excel 文件，使用 `scripts/analyze_expenses.py` 解析。\n```bash\npython3 scripts/analyze_expenses.py --input expenses.csv --format report\n```\n\n**方式 D：消费截图**\n用户提供账单截图（支付宝/微信/银行），AI 通过 OCR 识别消费记录。\n\n### 步骤 2：自动分类\n\n对每笔消费进行类别匹配：\n\n1. **关键词匹配**：根据消费描述中的关键词匹配二级类别\n   - 「午餐/吃饭/外卖/咖啡」→ 餐饮\n   - 「地铁/打车/加油/机票」→ 交通\n   - 「衣服/口红/面膜/手机」→ 购物\n   - 「房租/水电/物业」→ 住房\n   - 「电影/游戏/旅游/健身」→ 娱乐\n2. **金额辅助判断**：结合金额范围辅助分类（如大额「衣服」更可能是购物而非餐饮）\n3. **商家名称识别**：识别常见商家名称（星巴克→餐饮，滴滴→交通，淘宝→购物）\n4. **无法确定时**：归入「其他」类别，并在报告中标注建议用户确认\n\n### 步骤 3：数据结构化\n\n将所有消费记录整理为统一格式：\n\n| 字段 | 说明 | 示例 |\n|---|---|---|\n| 日期 | YYYY-MM-DD | 2026-09-01 |\n| 金额 | 数值（支出为正，收入为负或单独标记） | 35.00 |\n| 类型 | 支出/收入 | 支出 |\n| 一级类别 | 标准类别 | 餐饮 |\n| 二级类别 | 细分类别 | 午餐 |\n| 描述 | 原始消费描述 | 公司楼下快餐 |\n| 支付方式 | 微信/支付宝/现金/信用卡（可选） | 微信 |\n| 备注 | 用户补充信息（可选） | 客户请客 |\n\n### 步骤 4：使用辅助脚本分析（推荐）\n\n对于批量数据，使用 `scripts/analyze_expenses.py` 进行统计分析：\n\n```bash\n# 生成月度消费报告（文本格式）\npython3 scripts/analyze_expenses.py --input expenses.csv --month 2026-09 --format report\n\n# 输出 JSON 格式（供后续处理）\npython3 scripts/analyze_expenses.py --input expenses.csv --month 2026-09 --format json\n\n# 设置预算进行预算执行分析\npython3 scripts/analyze_expenses.py --input expenses.csv --month 2026-09 --budget 8000\n\n# 按周统计\npython3 scripts/analyze_expenses.py --input expenses.csv --week 2026-W37\n```\n\n脚本输出包含：\n- 总支出/总收入/结余\n- 各分类支出金额和占比\n- 每日支出趋势\n- 最大单笔支出 Top 5\n- 预算执行情况（如设置了预算）\n- 与上月对比（如有上月数据）\n\n### 步骤 5：生成消费报告\n\n根据分析结果生成结构化报告，包含以下章节：\n\n1. **本月概览**：总收入、总支出、结余、日均支出\n2. **分类占比**：各一级类别支出金额和占比（饼图描述）\n3. **消费趋势**：每日/每周支出走势，标注高峰日\n4. **大额支出**：Top 5 单笔支出及占总支出比例\n5. **预算执行**：各分类预算 vs 实际，超支标记\n6. **异常提醒**：超出常规范围的消费类别或单笔\n7. **省钱建议**：基于数据的可操作建议（如「餐饮占比42%，建议减少外卖」）\n8. **下月预算建议**：基于本月数据给出下月各分类预算参考\n\n### 步骤 6：质量自检\n\n- [ ] 每笔消费的金额是否准确（与原始记录一致）？\n- [ ] 类别分类是否合理？不确定的是否标注「待确认」？\n- [ ] 日期是否正确解析（相对日期如「昨天」「上周五」是否转换为具体日期）？\n- [ ] 收入和支出是否区分清楚？\n- [ ] 总金额计算是否正确（用工具核算，不手算）？\n- [ ] 报告中的百分比是否与金额一致？\n- [ ] 省钱建议是否基于实际数据，而非泛泛而谈？\n- [ ] 是否保护了用户隐私（不在报告中暴露完整卡号等敏感信息）？\n\n## 五、输出规范\n\n### 5.1 单笔记账确认格式\n\n```\n✅ 已记录：\n  日期：2026-09-13\n  金额：¥35.00\n  类别：餐饮 > 午餐\n  描述：公司楼下快餐\n  支付：微信\n\n本月累计支出：¥2,345.67（共 42 笔）\n```\n\n### 5.2 月度报告格式\n\n使用 `templates/monthly-report-template.md` 作为模板。\n\n### 5.3 消费表格格式\n\n当用户需要查看明细时，使用 Markdown 表格：\n\n| 日期 | 类别 | 描述 | 金额 | 支付方式 |\n|---|---|---|---|---|\n| 09-01 | 餐饮 > 早餐 | 包子豆浆 | ¥8.00 | 微信 |\n| 09-01 | 交通 > 地铁 | 上下班 | ¥6.00 | 公交卡 |\n| 09-01 | 餐饮 > 午餐 | 黄焖鸡米饭 | ¥25.00 | 支付宝 |\n\n## 六、常见场景处理\n\n### 场景 1：自然语言记账\n**用户**：「今天中午吃了个麻辣烫32，下午买了杯奶茶18」\n**处理**：解析为两笔记录，分别归类为「餐饮 > 午餐」和「餐饮 > 零食饮料」，确认后记录。\n\n### 场景 2：批量导入\n**用户**：粘贴一个月的消费记录文本，说「帮我整理一下这个月的消费」\n**处理**：逐行解析 → 自动分类 → 生成结构化表格 → 输出月度报告。\n\n### 场景 3：月度复盘\n**用户**：「帮我分析一下8月份的消费，看看哪里花多了」\n**处理**：读取8月数据 → 分类统计 → 识别超支类别 → 给出针对性建议。\n\n### 场景 4：预算控制\n**用户**：「我这个月预算5000，帮我看看还能花多少」\n**处理**：计算已支出 → 剩余预算 → 按剩余天数计算日均可用额度 → 提醒超支类别。\n\n### 场景 5：消费趋势\n**用户**：「帮我看看最近三个月的消费趋势」\n**处理**：按月汇总 → 生成趋势对比表 → 分析变化原因（如某月有大额旅游支出）。\n\n## 七、预算参考标准\n\n根据用户收入水平提供合理的预算分配参考（50/30/20 法则为基础）：\n\n| 类别 | 建议占比 | 说明 |\n|---|---|---|\n| 必要支出（住房+餐饮+交通+通讯+医疗） | 50% | 生活必需 |\n| 弹性支出（购物+娱乐+教育+人情） | 30% | 可调节 |\n| 储蓄/理财 | 20% | 强制储蓄 |\n\n**注意**：以上为通用参考，实际预算应根据用户所在城市、收入水平、家庭状况个性化调整。AI 应基于用户历史数据给出建议，而非机械套用比例。\n\n## 八、注意事项\n\n1. **金额准确性**：所有金额计算必须使用工具（calculator 或脚本），禁止心算。报告中的合计、占比、平均值必须可复现。\n2. **不编造数据**：用户未提供的消费记录不得自行补充。缺失数据明确标注。\n3. **日期解析**：相对日期（「昨天」「上周」「月初」）必须基于当前实际日期转换，禁止凭记忆推断。\n4. **隐私保护**：报告中不暴露完整银行卡号、身份证号等敏感信息；消费描述中的敏感信息（如医院名称涉及隐私）可适当脱敏。\n5. **分类歧义**：一笔消费可能属于多个类别时（如「买了本编程书」既可算教育也可算购物），选择最主要的类别，并在备注中说明。\n6. **收入处理**：收入单独统计，不与支出混在一起。结余 = 收入 - 支出。\n7. **退款/报销**：退款和报销记为收入或冲减对应类别支出，需在备注中标注。\n8. **不提供投资建议**：本技能只做消费记录和分析，不提供具体的投资、理财、金融产品建议。\n9. **数据持久化**：本技能不自动保存用户数据到外部。如用户需要长期记账，建议导出为 CSV 文件保存，或使用专门的记账 App。\n\n## 九、文件结构\n\n```\nexpense-tracker/\n├── SKILL.md                            # 本文件，技能定义与使用说明\n├── templates/\n│   └── monthly-report-template.md      # 月度消费报告模板\n├── scripts/\n│   └── analyze_expenses.py             # 消费记录分析脚本（分类、统计、报告生成）\n└── examples/\n    ├── sample-expenses.csv             # 示例：一个月的消费记录\n    └── sample-monthly-report.md        # 示例：生成的月度消费报告\n```\n\n## 十、使用示例\n\n### 示例 1：快速记账\n**用户**：「刚打车花了26块」\n**AI**：解析为 2026-09-13 交通 > 打车 ¥26.00，确认记录，更新本月累计。\n\n### 示例 2：批量记录+月度报告\n**用户**：粘贴30行消费记录，说「帮我整理成表格并分析一下」\n**AI**：逐行解析 → 自动分类 → 输出明细表 → 生成月度消费报告（含分类占比、趋势、大额支出、省钱建议）。\n\n### 示例 3：预算检查\n**用户**：「我每月预算6000，这个月还剩多少可以花？」\n**AI**：读取本月已记录支出 → 计算剩余预算 → 按剩余天数计算日均额度 → 提醒已超支类别。\n\n### 示例 4：CSV 分析\n**用户**：上传 expenses.csv，说「帮我分析一下这个文件里的消费」\n**AI**：使用脚本解析 CSV → 自动分类补全 → 生成统计报告 → 输出可视化描述和建议。\n", "files": {"SKILL.md": "---\nname: expense-tracker\ndescription: '个人记账与消费分析助手。帮助用户记录日常支出收入，自动按类别归类（餐饮、交通、购物、住房、娱乐、医疗、教育等），生成月度/周度消费报告，分析消费趋势，识别异常支出，提供预算执行情况和省钱建议。适用于个人记账、家庭开支管理、月度消费复盘、预算控制等场景。'\n---\n\n# 个人记账与消费分析助手\n\n## 一、技能定位\n\n本技能用于**个人和家庭的日常收支记录与消费分析**。核心价值：\n\n- 降低记账门槛：用户用自然语言描述消费即可，AI 自动解析金额、类别、日期\n- 自动分类：根据消费描述智能匹配消费类别，无需手动选择\n- 可视化报告：按月/周生成消费报告，包含分类占比、趋势对比、预算执行\n- 异常识别：标记超出常规的大额支出或异常消费\n- 省钱建议：基于消费数据给出可操作的节省建议\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我记一笔账」「今天花了XX钱」「午餐35元」等记账需求\n2. 用户提供消费记录（文本、CSV、截图），要求整理或分析\n3. 用户说「帮我看看这个月花了多少钱」「生成月度消费报告」「分析一下我的消费」\n4. 用户说「我这个月预算超了吗」「帮我看看哪里花多了」「有什么省钱建议」\n5. 用户需要将散乱的消费记录整理成结构化的表格\n6. 用户说「帮我做个记账模板」「设置每月预算」\n\n## 三、消费类别体系\n\n### 3.1 标准类别\n\n| 一级类别 | 二级类别/典型消费 |\n|---|---|\n| 🍜 餐饮 | 早餐、午餐、晚餐、零食饮料、外卖、咖啡奶茶、水果、食材 |\n| 🚇 交通 | 地铁公交、打车、加油、停车、过路费、火车票、机票、共享单车 |\n| 🛒 购物 | 服饰鞋包、美妆护肤、日用品、数码产品、家居用品、书籍文具 |\n| 🏠 住房 | 房租/房贷、水电燃气、物业费、宽带、家具家电、维修 |\n| 🎮 娱乐 | 电影演出、游戏充值、会员订阅、旅游、运动健身、聚会社交 |\n| 💊 医疗 | 门诊挂号、药品、体检、保健品、牙科、眼科 |\n| 📚 教育 | 课程培训、考试报名、书籍、学习工具、在线课程 |\n| 🧧 人情 | 红包、礼物、请客、捐赠、份子钱 |\n| 📱 通讯 | 手机话费、流量包、网络服务 |\n| 💰 金融 | 保险、理财、贷款还款、手续费、利息 |\n| 🐾 宠物 | 宠物食品、医疗、用品、美容 |\n| 🚼 育儿 | 奶粉尿布、玩具、童装、早教、学费 |\n| 📦 其他 | 无法归类的杂项支出 |\n\n### 3.2 收入类别\n\n| 类别 | 典型收入 |\n|---|---|\n| 💰 工资 | 基本工资、奖金、津贴、加班费 |\n| 📈 理财 | 利息、股息、基金收益、租金收入 |\n| 🎁 其他 | 红包、退款、报销、兼职、二手出售 |\n\n## 四、操作步骤\n\n### 步骤 1：接收并解析消费记录\n\n根据用户输入形式选择处理方式：\n\n**方式 A：自然语言单笔记账**\n用户输入如「今天午餐35元」「打车回家28块」「买了件衣服299」。\nAI 解析出：日期、金额、类别、描述、支付方式（如有）。\n\n**方式 B：批量文本记录**\n用户提供多行消费记录，如：\n```\n9/1 早餐 8\n9/1 地铁 6\n9/1 午餐 35\n9/2 超市 156.5\n```\nAI 逐行解析，统一格式。\n\n**方式 C：CSV/表格文件**\n用户提供 CSV 或 Excel 文件，使用 `scripts/analyze_expenses.py` 解析。\n```bash\npython3 scripts/analyze_expenses.py --input expenses.csv --format report\n```\n\n**方式 D：消费截图**\n用户提供账单截图（支付宝/微信/银行），AI 通过 OCR 识别消费记录。\n\n### 步骤 2：自动分类\n\n对每笔消费进行类别匹配：\n\n1. **关键词匹配**：根据消费描述中的关键词匹配二级类别\n   - 「午餐/吃饭/外卖/咖啡」→ 餐饮\n   - 「地铁/打车/加油/机票」→ 交通\n   - 「衣服/口红/面膜/手机」→ 购物\n   - 「房租/水电/物业」→ 住房\n   - 「电影/游戏/旅游/健身」→ 娱乐\n2. **金额辅助判断**：结合金额范围辅助分类（如大额「衣服」更可能是购物而非餐饮）\n3. **商家名称识别**：识别常见商家名称（星巴克→餐饮，滴滴→交通，淘宝→购物）\n4. **无法确定时**：归入「其他」类别，并在报告中标注建议用户确认\n\n### 步骤 3：数据结构化\n\n将所有消费记录整理为统一格式：\n\n| 字段 | 说明 | 示例 |\n|---|---|---|\n| 日期 | YYYY-MM-DD | 2026-09-01 |\n| 金额 | 数值（支出为正，收入为负或单独标记） | 35.00 |\n| 类型 | 支出/收入 | 支出 |\n| 一级类别 | 标准类别 | 餐饮 |\n| 二级类别 | 细分类别 | 午餐 |\n| 描述 | 原始消费描述 | 公司楼下快餐 |\n| 支付方式 | 微信/支付宝/现金/信用卡（可选） | 微信 |\n| 备注 | 用户补充信息（可选） | 客户请客 |\n\n### 步骤 4：使用辅助脚本分析（推荐）\n\n对于批量数据，使用 `scripts/analyze_expenses.py` 进行统计分析：\n\n```bash\n# 生成月度消费报告（文本格式）\npython3 scripts/analyze_expenses.py --input expenses.csv --month 2026-09 --format report\n\n# 输出 JSON 格式（供后续处理）\npython3 scripts/analyze_expenses.py --input expenses.csv --month 2026-09 --format json\n\n# 设置预算进行预算执行分析\npython3 scripts/analyze_expenses.py --input expenses.csv --month 2026-09 --budget 8000\n\n# 按周统计\npython3 scripts/analyze_expenses.py --input expenses.csv --week 2026-W37\n```\n\n脚本输出包含：\n- 总支出/总收入/结余\n- 各分类支出金额和占比\n- 每日支出趋势\n- 最大单笔支出 Top 5\n- 预算执行情况（如设置了预算）\n- 与上月对比（如有上月数据）\n\n### 步骤 5：生成消费报告\n\n根据分析结果生成结构化报告，包含以下章节：\n\n1. **本月概览**：总收入、总支出、结余、日均支出\n2. **分类占比**：各一级类别支出金额和占比（饼图描述）\n3. **消费趋势**：每日/每周支出走势，标注高峰日\n4. **大额支出**：Top 5 单笔支出及占总支出比例\n5. **预算执行**：各分类预算 vs 实际，超支标记\n6. **异常提醒**：超出常规范围的消费类别或单笔\n7. **省钱建议**：基于数据的可操作建议（如「餐饮占比42%，建议减少外卖」）\n8. **下月预算建议**：基于本月数据给出下月各分类预算参考\n\n### 步骤 6：质量自检\n\n- [ ] 每笔消费的金额是否准确（与原始记录一致）？\n- [ ] 类别分类是否合理？不确定的是否标注「待确认」？\n- [ ] 日期是否正确解析（相对日期如「昨天」「上周五」是否转换为具体日期）？\n- [ ] 收入和支出是否区分清楚？\n- [ ] 总金额计算是否正确（用工具核算，不手算）？\n- [ ] 报告中的百分比是否与金额一致？\n- [ ] 省钱建议是否基于实际数据，而非泛泛而谈？\n- [ ] 是否保护了用户隐私（不在报告中暴露完整卡号等敏感信息）？\n\n## 五、输出规范\n\n### 5.1 单笔记账确认格式\n\n```\n✅ 已记录：\n  日期：2026-09-13\n  金额：¥35.00\n  类别：餐饮 > 午餐\n  描述：公司楼下快餐\n  支付：微信\n\n本月累计支出：¥2,345.67（共 42 笔）\n```\n\n### 5.2 月度报告格式\n\n使用 `templates/monthly-report-template.md` 作为模板。\n\n### 5.3 消费表格格式\n\n当用户需要查看明细时，使用 Markdown 表格：\n\n| 日期 | 类别 | 描述 | 金额 | 支付方式 |\n|---|---|---|---|---|\n| 09-01 | 餐饮 > 早餐 | 包子豆浆 | ¥8.00 | 微信 |\n| 09-01 | 交通 > 地铁 | 上下班 | ¥6.00 | 公交卡 |\n| 09-01 | 餐饮 > 午餐 | 黄焖鸡米饭 | ¥25.00 | 支付宝 |\n\n## 六、常见场景处理\n\n### 场景 1：自然语言记账\n**用户**：「今天中午吃了个麻辣烫32，下午买了杯奶茶18」\n**处理**：解析为两笔记录，分别归类为「餐饮 > 午餐」和「餐饮 > 零食饮料」，确认后记录。\n\n### 场景 2：批量导入\n**用户**：粘贴一个月的消费记录文本，说「帮我整理一下这个月的消费」\n**处理**：逐行解析 → 自动分类 → 生成结构化表格 → 输出月度报告。\n\n### 场景 3：月度复盘\n**用户**：「帮我分析一下8月份的消费，看看哪里花多了」\n**处理**：读取8月数据 → 分类统计 → 识别超支类别 → 给出针对性建议。\n\n### 场景 4：预算控制\n**用户**：「我这个月预算5000，帮我看看还能花多少」\n**处理**：计算已支出 → 剩余预算 → 按剩余天数计算日均可用额度 → 提醒超支类别。\n\n### 场景 5：消费趋势\n**用户**：「帮我看看最近三个月的消费趋势」\n**处理**：按月汇总 → 生成趋势对比表 → 分析变化原因（如某月有大额旅游支出）。\n\n## 七、预算参考标准\n\n根据用户收入水平提供合理的预算分配参考（50/30/20 法则为基础）：\n\n| 类别 | 建议占比 | 说明 |\n|---|---|---|\n| 必要支出（住房+餐饮+交通+通讯+医疗） | 50% | 生活必需 |\n| 弹性支出（购物+娱乐+教育+人情） | 30% | 可调节 |\n| 储蓄/理财 | 20% | 强制储蓄 |\n\n**注意**：以上为通用参考，实际预算应根据用户所在城市、收入水平、家庭状况个性化调整。AI 应基于用户历史数据给出建议，而非机械套用比例。\n\n## 八、注意事项\n\n1. **金额准确性**：所有金额计算必须使用工具（calculator 或脚本），禁止心算。报告中的合计、占比、平均值必须可复现。\n2. **不编造数据**：用户未提供的消费记录不得自行补充。缺失数据明确标注。\n3. **日期解析**：相对日期（「昨天」「上周」「月初」）必须基于当前实际日期转换，禁止凭记忆推断。\n4. **隐私保护**：报告中不暴露完整银行卡号、身份证号等敏感信息；消费描述中的敏感信息（如医院名称涉及隐私）可适当脱敏。\n5. **分类歧义**：一笔消费可能属于多个类别时（如「买了本编程书」既可算教育也可算购物），选择最主要的类别，并在备注中说明。\n6. **收入处理**：收入单独统计，不与支出混在一起。结余 = 收入 - 支出。\n7. **退款/报销**：退款和报销记为收入或冲减对应类别支出，需在备注中标注。\n8. **不提供投资建议**：本技能只做消费记录和分析，不提供具体的投资、理财、金融产品建议。\n9. **数据持久化**：本技能不自动保存用户数据到外部。如用户需要长期记账，建议导出为 CSV 文件保存，或使用专门的记账 App。\n\n## 九、文件结构\n\n```\nexpense-tracker/\n├── SKILL.md                            # 本文件，技能定义与使用说明\n├── templates/\n│   └── monthly-report-template.md      # 月度消费报告模板\n├── scripts/\n│   └── analyze_expenses.py             # 消费记录分析脚本（分类、统计、报告生成）\n└── examples/\n    ├── sample-expenses.csv             # 示例：一个月的消费记录\n    └── sample-monthly-report.md        # 示例：生成的月度消费报告\n```\n\n## 十、使用示例\n\n### 示例 1：快速记账\n**用户**：「刚打车花了26块」\n**AI**：解析为 2026-09-13 交通 > 打车 ¥26.00，确认记录，更新本月累计。\n\n### 示例 2：批量记录+月度报告\n**用户**：粘贴30行消费记录，说「帮我整理成表格并分析一下」\n**AI**：逐行解析 → 自动分类 → 输出明细表 → 生成月度消费报告（含分类占比、趋势、大额支出、省钱建议）。\n\n### 示例 3：预算检查\n**用户**：「我每月预算6000，这个月还剩多少可以花？」\n**AI**：读取本月已记录支出 → 计算剩余预算 → 按剩余天数计算日均额度 → 提醒已超支类别。\n\n### 示例 4：CSV 分析\n**用户**：上传 expenses.csv，说「帮我分析一下这个文件里的消费」\n**AI**：使用脚本解析 CSV → 自动分类补全 → 生成统计报告 → 输出可视化描述和建议。\n", "templates/monthly-report-template.md": "# {YYYY年MM月} 消费报告\n\n> 报告生成时间：{YYYY-MM-DD} | 数据范围：{YYYY-MM-01} 至 {YYYY-MM-DD}\n\n---\n\n## 一、本月概览\n\n| 指标 | 金额 | 说明 |\n|---|---|---|\n| 总收入 | ¥{income_total} | {收入笔数} 笔 |\n| 总支出 | ¥{expense_total} | {支出笔数} 笔 |\n| 结余 | ¥{balance} | 收入 - 支出 |\n| 日均支出 | ¥{daily_avg} | 按 {days} 天计算 |\n| 单笔最大支出 | ¥{max_expense} | {max_expense_desc} |\n| 预算执行 | {budget_status} | 预算 ¥{budget} / 已支出 ¥{expense_total} |\n\n---\n\n## 二、分类支出占比\n\n| 排名 | 类别 | 金额 | 占比 | 笔数 | 日均 |\n|---|---|---|---|---|---|\n| 1 | 🍜 餐饮 | ¥{food_amount} | {food_pct}% | {food_count} | ¥{food_daily} |\n| 2 | 🚇 交通 | ¥{transport_amount} | {transport_pct}% | {transport_count} | ¥{transport_daily} |\n| 3 | 🛒 购物 | ¥{shopping_amount} | {shopping_pct}% | {shopping_count} | ¥{shopping_daily} |\n| 4 | 🏠 住房 | ¥{housing_amount} | {housing_pct}% | {housing_count} | ¥{housing_daily} |\n| 5 | 🎮 娱乐 | ¥{entertainment_amount} | {entertainment_pct}% | {entertainment_count} | ¥{entertainment_daily} |\n| 6 | 💊 医疗 | ¥{medical_amount} | {medical_pct}% | {medical_count} | ¥{medical_daily} |\n| 7 | 📚 教育 | ¥{education_amount} | {education_pct}% | {education_count} | ¥{education_daily} |\n| 8 | 🧧 人情 | ¥{social_amount} | {social_pct}% | {social_count} | ¥{social_daily} |\n| 9 | 📱 通讯 | ¥{communication_amount} | {communication_pct}% | {communication_count} | ¥{communication_daily} |\n| 10 | 其他 | ¥{other_amount} | {other_pct}% | {other_count} | ¥{other_daily} |\n\n**支出结构说明**：{简要描述本月支出结构特点，如「餐饮占比最高，达35%，主要因为外卖频次较高」}\n\n---\n\n## 三、每日支出趋势\n\n| 日期 | 支出金额 | 主要消费 |\n|---|---|---|\n| {MM-DD} | ¥{amount} | {主要消费类别} |\n| ... | ... | ... |\n\n**趋势分析**：\n- 支出最高日：{MM-DD}，¥{max_day_amount}（{原因}）\n- 支出最低日：{MM-DD}，¥{min_day_amount}\n- 周末 vs 工作日：周末日均 ¥{weekend_avg}，工作日日均 ¥{weekday_avg}\n- {其他趋势观察}\n\n---\n\n## 四、大额支出 Top 5\n\n| 排名 | 日期 | 类别 | 描述 | 金额 | 占总支出 |\n|---|---|---|---|---|---|\n| 1 | {MM-DD} | {类别} | {描述} | ¥{amount} | {pct}% |\n| 2 | {MM-DD} | {类别} | {描述} | ¥{amount} | {pct}% |\n| 3 | {MM-DD} | {类别} | {描述} | ¥{amount} | {pct}% |\n| 4 | {MM-DD} | {类别} | {描述} | ¥{amount} | {pct}% |\n| 5 | {MM-DD} | {类别} | {描述} | ¥{amount} | {pct}% |\n\n---\n\n## 五、预算执行情况\n\n> 本月总预算：¥{budget}\n\n| 类别 | 预算 | 实际支出 | 剩余/超支 | 执行率 | 状态 |\n|---|---|---|---|---|---|\n| 🍜 餐饮 | ¥{food_budget} | ¥{food_actual} | ¥{food_diff} | {food_rate}% | {正常/超支/结余} |\n| 🚇 交通 | ¥{transport_budget} | ¥{transport_actual} | ¥{transport_diff} | {transport_rate}% | {状态} |\n| 🛒 购物 | ¥{shopping_budget} | ¥{shopping_actual} | ¥{shopping_diff} | {shopping_rate}% | {状态} |\n| 🏠 住房 | ¥{housing_budget} | ¥{housing_actual} | ¥{housing_diff} | {housing_rate}% | {状态} |\n| 🎮 娱乐 | ¥{entertainment_budget} | ¥{entertainment_actual} | ¥{entertainment_diff} | {entertainment_rate}% | {状态} |\n| 其他 | ¥{other_budget} | ¥{other_actual} | ¥{other_diff} | {other_rate}% | {状态} |\n| **合计** | **¥{budget}** | **¥{actual_total}** | **¥{total_diff}** | **{total_rate}%** | **{总状态}** |\n\n**预算分析**：\n- {超支类别说明及原因}\n- {结余类别说明}\n- {剩余天数日均可用额度：¥{remaining_daily}/天}\n\n---\n\n## 六、异常消费提醒\n\n{如无异常，写「本月未发现明显异常消费。」}\n\n- ⚠ {异常1：类别/金额/原因说明}\n- ⚠ {异常2：某类别支出环比增长超过50%}\n- ⚠ {异常3：单笔支出超过月收入10%}\n\n---\n\n## 七、消费洞察与省钱建议\n\n### 本月消费特点\n1. {特点1：如「餐饮支出占比35%，其中外卖占餐饮的60%」}\n2. {特点2：如「周末支出是工作日的1.8倍，主要集中在娱乐和购物」}\n3. {特点3：如「购物类有3笔超过500元的大额支出」}\n\n### 可操作的省钱建议\n1. **{建议1}**：{具体说明，如「减少外卖频次，每周自己做饭2-3次，预计可省¥300/月」}\n2. **{建议2}**：{具体说明，如「购物前列清单，避免冲动消费，设置每月购物上限」}\n3. **{建议3}**：{具体说明，如「使用公共交通替代打车，预计可省¥150/月」}\n4. **{建议4}**：{具体说明，如「订阅服务定期清理，取消不常用的会员」}\n\n### 预计节省金额\n如采纳以上建议，预计每月可节省 ¥{estimated_savings}，占本月支出的 {savings_pct}%。\n\n---\n\n## 八、下月预算建议\n\n基于本月消费数据，建议下月预算分配如下：\n\n| 类别 | 本月实际 | 建议预算 | 调整说明 |\n|---|---|---|---|\n| 🍜 餐饮 | ¥{food_actual} | ¥{food_suggested} | {调整原因} |\n| 🚇 交通 | ¥{transport_actual} | ¥{transport_suggested} | {调整原因} |\n| 🛒 购物 | ¥{shopping_actual} | ¥{shopping_suggested} | {调整原因} |\n| 🏠 住房 | ¥{housing_actual} | ¥{housing_suggested} | {调整原因} |\n| 🎮 娱乐 | ¥{entertainment_actual} | ¥{entertainment_suggested} | {调整原因} |\n| 其他 | ¥{other_actual} | ¥{other_suggested} | {调整原因} |\n| **合计** | **¥{actual_total}** | **¥{suggested_total}** | |\n\n---\n\n## 附录：消费明细\n\n> 完整明细见附件 CSV 文件。以下为按类别汇总的明细预览。\n\n### 🍜 餐饮（{food_count}笔，¥{food_amount}）\n| 日期 | 描述 | 金额 |\n|---|---|---|\n| ... | ... | ... |\n\n### 🚇 交通（{transport_count}笔，¥{transport_amount}）\n| 日期 | 描述 | 金额 |\n|---|---|---|\n| ... | ... | ... |\n\n---\n\n*本报告由消费记录自动生成，金额以原始记录为准。如有遗漏请补充记录。*\n*省钱建议仅供参考，不构成任何金融或投资建议。*\n", "scripts/analyze_expenses.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\n个人记账与消费分析助手 - 消费记录分析脚本\n\n解析消费记录（CSV/文本），自动分类，生成统计报告。\n\n用法：\n    python3 analyze_expenses.py --input expenses.csv --month 2026-09 --format report\n    python3 analyze_expenses.py --input expenses.csv --format json\n    python3 analyze_expenses.py --input expenses.csv --budget 8000\n    cat expenses.txt | python3 analyze_expenses.py --format report\n\nCSV 格式（表头可选）：\n    date,amount,category,description,payment_method\n    2026-09-01,35.00,餐饮,午餐,微信\n\n纯文本格式（每行一笔）：\n    2026-09-01 午餐 35\n    9/1 地铁 6\n    9月2日 超市购物 156.5\n\"\"\"\n\nimport argparse\nimport csv\nimport json\nimport re\nimport sys\nfrom collections import defaultdict\nfrom dataclasses import dataclass, field, asdict\nfrom datetime import datetime, date\nfrom typing import List, Optional, Dict, Tuple\n\n\n# ============================================================\n# 数据结构\n# ============================================================\n\n@dataclass\nclass Expense:\n    \"\"\"单笔消费记录\"\"\"\n    date: str\n    amount: float\n    type: str  # 支出 / 收入\n    category: str  # 一级类别\n    subcategory: str  # 二级类别\n    description: str\n    payment_method: str = \"\"\n    raw_text: str = \"\"\n\n\n@dataclass\nclass CategoryStat:\n    \"\"\"类别统计\"\"\"\n    name: str\n    total: float = 0.0\n    count: int = 0\n    daily_avg: float = 0.0\n    percentage: float = 0.0\n    max_single: float = 0.0\n    expenses: List[Expense] = field(default_factory=list)\n\n\n@dataclass\nclass AnalysisResult:\n    \"\"\"完整分析结果\"\"\"\n    period: str = \"\"\n    total_income: float = 0.0\n    total_expense: float = 0.0\n    balance: float = 0.0\n    expense_count: int = 0\n    income_count: int = 0\n    days_in_period: int = 0\n    daily_avg: float = 0.0\n    max_expense: Optional[Expense] = None\n    categories: Dict[str, CategoryStat] = field(default_factory=dict)\n    daily_expenses: Dict[str, float] = field(default_factory=dict)\n    top_expenses: List[Expense] = field(default_factory=list)\n    budget: Optional[float] = None\n    budget_remaining: Optional[float] = None\n    budget_usage_pct: Optional[float] = None\n    uncategorized: List[Expense] = field(default_factory=list)\n    warnings: List[str] = field(default_factory=list)\n\n\n# ============================================================\n# 消费类别关键词映射\n# ============================================================\n\nCATEGORY_KEYWORDS = {\n    \"餐饮\": {\n        \"icon\": \"🍜\",\n        \"subcategories\": {\n            \"早餐\": [\"早餐\", \"早饭\", \"包子\", \"豆浆\", \"油条\", \"煎饼\", \"面包\", \"牛奶\", \"breakfast\"],\n            \"午餐\": [\"午餐\", \"午饭\", \"中饭\", \"快餐\", \"黄焖鸡\", \"拉面\", \"外卖\", \"lunch\"],\n            \"晚餐\": [\"晚餐\", \"晚饭\", \"夜宵\", \"烧烤\", \"火锅\", \"dinner\"],\n            \"零食饮料\": [\"奶茶\", \"咖啡\", \"星巴克\", \"瑞幸\", \"零食\", \"饮料\", \"可乐\", \"冰淇淋\", \"甜品\", \"蛋糕\", \"coffee\", \"milk tea\"],\n            \"水果\": [\"水果\", \"苹果\", \"香蕉\", \"葡萄\", \"西瓜\", \"fruit\"],\n            \"食材\": [\"超市\", \"菜场\", \"买菜\", \"食材\", \"肉\", \"蔬菜\", \"grocery\"],\n        }\n    },\n    \"交通\": {\n        \"icon\": \"🚇\",\n        \"subcategories\": {\n            \"地铁公交\": [\"地铁\", \"公交\", \"公交通\", \"metro\", \"bus\", \"subway\"],\n            \"打车\": [\"打车\", \"滴滴\", \"出租车\", \"网约车\", \"uber\", \"taxi\", \"ride\"],\n            \"加油\": [\"加油\", \"油费\", \"gas\", \"fuel\"],\n            \"停车\": [\"停车\", \"停车费\", \"parking\"],\n            \"过路费\": [\"过路费\", \"高速费\", \"toll\"],\n            \"火车票\": [\"火车\", \"高铁\", \"动车\", \"12306\", \"train\", \"railway\"],\n            \"机票\": [\"机票\", \"飞机\", \"航班\", \"flight\", \"airline\"],\n            \"共享单车\": [\"共享单车\", \"哈啰\", \"美团单车\", \"青桔\", \"bike\"],\n        }\n    },\n    \"购物\": {\n        \"icon\": \"🛒\",\n        \"subcategories\": {\n            \"服饰鞋包\": [\"衣服\", \"裤子\", \"鞋子\", \"包包\", \"外套\", \"T恤\", \"裙子\", \"内衣\", \"袜子\", \"clothes\", \"shoes\", \"bag\"],\n            \"美妆护肤\": [\"口红\", \"面膜\", \"护肤品\", \"化妆品\", \"香水\", \"洗面奶\", \"美妆\", \"skincare\", \"cosmetics\"],\n            \"日用品\": [\"日用品\", \"纸巾\", \"洗衣液\", \"洗发水\", \"沐浴露\", \"牙膏\", \"牙刷\", \"household\", \"daily necessities\"],\n            \"数码产品\": [\"手机\", \"电脑\", \"耳机\", \"键盘\", \"鼠标\", \"充电器\", \"数据线\", \"平板\", \"相机\", \"electronics\", \"gadget\"],\n            \"家居用品\": [\"家具\", \"家电\", \"床单\", \"被子\", \"枕头\", \"灯具\", \"收纳\", \"home\", \"furniture\"],\n            \"书籍文具\": [\"书\", \"
