<script>
const SKILLS = [{"name": "backup-planner", "title": "backup-planner", "description": "备份计划助手。扫描指定目录，统计文件数量和总大小，识别大文件和大目录，分析文件类型分布，生成完整备份/增量备份方案，估算备份时间和存储空间，自动生成 tar/rsync 备份脚本，提供排除规则建议和备份频率推荐。适用于个人文件备份、项目代码备份、服务器数据备份、迁移前评估等场景。", "category": "其他", "icon": "📦", "color": "#6b7280", "skill_md": "---\nname: backup-planner\ndescription: '备份计划助手。扫描指定目录，统计文件数量和总大小，识别大文件和大目录，分析文件类型分布，生成完整备份/增量备份方案，估算备份时间和存储空间，自动生成 tar/rsync 备份脚本，提供排除规则建议和备份频率推荐。适用于个人文件备份、项目代码备份、服务器数据备份、迁移前评估等场景。'\n---\n\n# 备份计划助手\n\n## 一、技能定位\n\n本技能用于**制定和生成数据备份方案**。核心价值：\n\n- 扫描目录，统计文件数量、总大小、类型分布\n- 识别大文件和大目录，找出备份重点\n- 生成完整备份和增量备份方案\n- 估算备份时间和所需存储空间\n- 自动生成 tar / rsync 备份脚本\n- 提供排除规则建议和备份频率推荐\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我看看这个目录有多大」「统计一下文件」\n2. 用户说「帮我做个备份计划」「怎么备份这些文件」\n3. 用户说「生成一个备份脚本」「写个 tar/rsync 备份命令」\n4. 用户说「哪些文件最大」「找出大文件」\n5. 用户说「迁移前评估一下」「看看要备份多少数据」\n6. 用户说「增量备份怎么做」「哪些文件变化了」\n7. 用户说「备份需要多长时间」「需要多大空间」\n\n## 三、支持的功能\n\n### 3.1 目录扫描\n\n- 递归扫描指定目录\n- 统计文件数量、总大小、目录数量\n- 按文件类型分类统计（文档、图片、视频、音频、代码、压缩包等）\n- 统计文件修改时间分布\n\n### 3.2 大文件识别\n\n- 找出 Top N 最大文件\n- 找出 Top N 最大子目录\n- 可自定义大小阈值\n- 标记可压缩文件类型\n\n### 3.3 备份方案生成\n\n- **完整备份**：备份所有文件\n- **增量备份**：仅备份最近 N 天修改的文件\n- **差异备份**：仅备份与上次备份不同的文件\n- 可自定义排除规则（排除 node_modules、.git、临时文件等）\n\n### 3.4 时间与空间估算\n\n- 基于文件大小估算备份时间（按假设传输速度）\n- 计算压缩后预估大小（按类型压缩率估算）\n- 计算保留多份备份所需总空间\n- 支持自定义传输速度和压缩率\n\n### 3.5 备份脚本生成\n\n- 生成 tar 备份脚本（支持压缩、排除、时间戳命名）\n- 生成 rsync 备份脚本（支持增量、远程同步、删除同步）\n- 生成备份清单（manifest）\n- 脚本可直接执行\n\n### 3.6 排除规则建议\n\n- 自动识别应排除的目录（node_modules、.git、__pycache__、vendor 等）\n- 自动识别应排除的文件类型（.tmp、.log、.cache、.swp 等）\n- 生成 .gitignore 风格的排除列表\n- 可自定义排除模式\n\n## 四、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 扫描目录 / 生成备份方案 / 生成备份脚本 / 大文件分析\n- 目标目录路径\n- 备份类型（完整/增量）\n- 输出格式（报告/脚本）\n\n### 步骤 2：运行脚本\n\n使用 `scripts/plan_backup.py`：\n\n```bash\n# 扫描目录并生成报告\npython3 scripts/plan_backup.py --dir /path/to/data\n\n# 只显示前 20 个大文件\npython3 scripts/plan_backup.py --dir /path/to/data --top 20\n\n# 生成增量备份方案（最近 7 天）\npython3 scripts/plan_backup.py --dir /path/to/data --incremental 7\n\n# 生成 tar 备份脚本\npython3 scripts/plan_backup.py --dir /path/to/data --script tar --output backup.sh\n\n# 生成 rsync 备份脚本（远程目标）\npython3 scripts/plan_backup.py --dir /path/to/data --script rsync --remote user@server:/backup/\n\n# 自定义排除规则\npython3 scripts/plan_backup.py --dir /path/to/data --exclude \"*.log,node_modules,.git\"\n\n# 估算备份时间（假设 100MB/s 传输速度）\npython3 scripts/plan_backup.py --dir /path/to/data --speed 100\n\n# JSON 格式输出\npython3 scripts/plan_backup.py --dir /path/to/data --format json\n```\n\n### 步骤 3：解读结果\n\n- **扫描报告**：文件统计、类型分布、大文件列表\n- **备份方案**：备份范围、预估大小、预估时间、排除规则\n- **备份脚本**：可直接执行的 shell 脚本\n\n### 步骤 4：安全提示\n\n1. 备份前确认目标空间充足\n2. 重要数据遵循 3-2-1 原则（3份副本、2种介质、1份异地）\n3. 定期验证备份可恢复性\n4. 敏感数据备份应加密\n5. 不要将备份存储在同一物理设备上\n\n## 五、输出规范\n\n### 5.1 扫描报告\n\n```\n📊 目录扫描报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n目录：/path/to/data\n总大小：2.34 GB\n文件数：1,234\n目录数：89\n扫描用时：0.3 秒\n\n📁 类型分布：\n  文档：234 个，456 MB (19.5%)\n  图片：156 个，789 MB (33.7%)\n  视频：12 个，678 MB (29.0%)\n  代码：345 个，123 MB (5.3%)\n  其他：487 个，294 MB (12.5%)\n\n📈 大文件 Top 5：\n  1. /path/to/data/video/intro.mp4 — 234 MB\n  2. /path/to/data/backup.tar.gz — 156 MB\n  3. /path/to/data/docs/manual.pdf — 89 MB\n  4. /path/to/data/images/photo.raw — 67 MB\n  5. /path/to/data/data/dataset.csv — 45 MB\n\n💡 建议：\n  - 视频文件占比最大（29%），可考虑单独备份\n  - 建议排除 node_modules（123 MB）和 .git（45 MB）\n  - 压缩后预估大小：约 1.8 GB\n```\n\n### 5.2 备份方案\n\n```\n💾 备份方案\n━━━━━━━━━━━━━━━━━━━━━━━━\n备份类型：完整备份\n源目录：/path/to/data\n目标位置：/backup/\n\n📦 备份范围：\n  文件数：1,234\n  总大小：2.34 GB\n  排除后大小：2.17 GB（排除 167 MB）\n\n🚫 排除规则：\n  - node_modules/\n  - .git/\n  - __pycache__/\n  - *.log\n  - *.tmp\n\n⏱️  时间估算：\n  未压缩：约 22 秒（按 100 MB/s）\n  压缩后：约 1.8 GB，约 45 秒（含压缩时间）\n\n📋 建议：\n  - 备份频率：每周一次完整备份\n  - 保留份数：至少 3 份\n  - 存储介质：外接硬盘 + 云存储\n  - 验证恢复：每月验证一次\n```\n\n### 5.3 备份脚本\n\n```bash\n#!/bin/bash\n# 自动生成的备份脚本\n# 源目录：/path/to/data\n# 生成时间：2026-10-02\n\nSOURCE=\"/path/to/data\"\nDEST=\"/backup\"\nTIMESTAMP=$(date +%Y%m%d_%H%M%S)\nBACKUP_NAME=\"backup_${TIMESTAMP}.tar.gz\"\n\necho \"开始备份：${SOURCE}\"\necho \"目标文件：${DEST}/${BACKUP_NAME}\"\n\ntar -czf \"${DEST}/${BACKUP_NAME}\" \\\n  --exclude=\"node_modules\" \\\n  --exclude=\".git\" \\\n  --exclude=\"__pycache__\" \\\n  --exclude=\"*.log\" \\\n  --exclude=\"*.tmp\" \\\n  -C \"$(dirname \"${SOURCE}\")\" \\\n  \"$(basename \"${SOURCE}\")\"\n\nif [ $? -eq 0 ]; then\n  echo \"✅ 备份完成：${BACKUP_NAME}\"\n  echo \"文件大小：$(du -h \"${DEST}/${BACKUP_NAME}\" | cut -f1)\"\nelse\n  echo \"❌ 备份失败\"\n  exit 1\nfi\n```\n\n## 六、常见场景处理\n\n### 场景 1：个人文件备份\n**用户**：「帮我看看 Documents 目录有多大，做个备份计划」\n**处理**：扫描目录 → 生成报告 → 推荐每周完整备份 → 生成 tar 脚本。\n\n### 场景 2：项目代码备份\n**用户**：「这个项目怎么备份，要排除 node_modules」\n**处理**：扫描目录 → 自动识别排除规则 → 生成 rsync 增量备份脚本。\n\n### 场景 3：服务器数据迁移\n**用户**：「迁移前评估一下服务器数据量」\n**处理**：扫描目录 → 统计总大小和类型 → 估算传输时间 → 推荐分批迁移策略。\n\n### 场景 4：大文件清理\n**用户**：「找出最大的 10 个文件」\n**处理**：扫描目录 → 输出 Top 10 大文件 → 标记可删除/可压缩项。\n\n### 场景 5：增量备份\n**用户**：「只备份最近 7 天修改的文件」\n**处理**：扫描目录 → 按修改时间过滤 → 生成增量备份脚本 → 估算增量大小。\n\n## 七、注意事项\n\n1. **权限问题**：扫描需要读取权限，无权限的文件会被跳过并在报告中说明。\n2. **符号链接**：默认不跟随符号链接，避免循环引用和重复备份。\n3. **大目录扫描**：扫描数十万文件可能需要较长时间，建议先指定子目录。\n4. **时间估算**：备份时间基于假设传输速度，实际时间受磁盘 IO、CPU、网络影响。\n5. **压缩率估算**：不同文件类型压缩率差异大（文本 70%、图片 5%、视频 0%），估算仅供参考。\n6. **排除规则**：默认排除常见开发依赖目录和临时文件，可通过 `--exclude` 自定义。\n7. **脚本安全**：生成的脚本包含 `rm` 等危险命令时会加注释提醒，执行前请仔细检查。\n8. **不执行备份**：本技能只生成方案和脚本，不实际执行备份操作。\n9. **路径处理**：支持相对路径和绝对路径，脚本中会转换为绝对路径。\n10. **跨平台**：生成的 tar/rsync 脚本适用于 Linux/macOS，Windows 用户需使用 WSL 或对应工具。\n\n## 八、文件结构\n\n```\nbackup-planner/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── backup-policy-template.md          # 备份策略模板\n├── scripts/\n│   └── plan_backup.py                    # 备份计划脚本\n└── examples/\n    ├── sample-scan-report.md              # 示例扫描报告\n    └── sample-backup-script.sh            # 示例备份脚本\n```\n\n## 九、使用示例\n\n### 示例 1：快速扫描\n**用户**：「看看这个目录有多大」\n**AI**：运行 `--dir /path/to/data` → 输出文件统计和大文件列表。\n\n### 示例 2：生成备份脚本\n**用户**：「生成一个备份脚本，排除 node_modules 和 .git」\n**AI**：运行 `--script tar --exclude \"node_modules,.git\"` → 生成可执行脚本。\n\n### 示例 3：增量备份\n**用户**：「只备份最近 3 天的文件」\n**AI**：运行 `--incremental 3` → 过滤近期文件 → 生成增量备份方案。\n", "files": {"SKILL.md": "---\nname: backup-planner\ndescription: '备份计划助手。扫描指定目录，统计文件数量和总大小，识别大文件和大目录，分析文件类型分布，生成完整备份/增量备份方案，估算备份时间和存储空间，自动生成 tar/rsync 备份脚本，提供排除规则建议和备份频率推荐。适用于个人文件备份、项目代码备份、服务器数据备份、迁移前评估等场景。'\n---\n\n# 备份计划助手\n\n## 一、技能定位\n\n本技能用于**制定和生成数据备份方案**。核心价值：\n\n- 扫描目录，统计文件数量、总大小、类型分布\n- 识别大文件和大目录，找出备份重点\n- 生成完整备份和增量备份方案\n- 估算备份时间和所需存储空间\n- 自动生成 tar / rsync 备份脚本\n- 提供排除规则建议和备份频率推荐\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我看看这个目录有多大」「统计一下文件」\n2. 用户说「帮我做个备份计划」「怎么备份这些文件」\n3. 用户说「生成一个备份脚本」「写个 tar/rsync 备份命令」\n4. 用户说「哪些文件最大」「找出大文件」\n5. 用户说「迁移前评估一下」「看看要备份多少数据」\n6. 用户说「增量备份怎么做」「哪些文件变化了」\n7. 用户说「备份需要多长时间」「需要多大空间」\n\n## 三、支持的功能\n\n### 3.1 目录扫描\n\n- 递归扫描指定目录\n- 统计文件数量、总大小、目录数量\n- 按文件类型分类统计（文档、图片、视频、音频、代码、压缩包等）\n- 统计文件修改时间分布\n\n### 3.2 大文件识别\n\n- 找出 Top N 最大文件\n- 找出 Top N 最大子目录\n- 可自定义大小阈值\n- 标记可压缩文件类型\n\n### 3.3 备份方案生成\n\n- **完整备份**：备份所有文件\n- **增量备份**：仅备份最近 N 天修改的文件\n- **差异备份**：仅备份与上次备份不同的文件\n- 可自定义排除规则（排除 node_modules、.git、临时文件等）\n\n### 3.4 时间与空间估算\n\n- 基于文件大小估算备份时间（按假设传输速度）\n- 计算压缩后预估大小（按类型压缩率估算）\n- 计算保留多份备份所需总空间\n- 支持自定义传输速度和压缩率\n\n### 3.5 备份脚本生成\n\n- 生成 tar 备份脚本（支持压缩、排除、时间戳命名）\n- 生成 rsync 备份脚本（支持增量、远程同步、删除同步）\n- 生成备份清单（manifest）\n- 脚本可直接执行\n\n### 3.6 排除规则建议\n\n- 自动识别应排除的目录（node_modules、.git、__pycache__、vendor 等）\n- 自动识别应排除的文件类型（.tmp、.log、.cache、.swp 等）\n- 生成 .gitignore 风格的排除列表\n- 可自定义排除模式\n\n## 四、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 扫描目录 / 生成备份方案 / 生成备份脚本 / 大文件分析\n- 目标目录路径\n- 备份类型（完整/增量）\n- 输出格式（报告/脚本）\n\n### 步骤 2：运行脚本\n\n使用 `scripts/plan_backup.py`：\n\n```bash\n# 扫描目录并生成报告\npython3 scripts/plan_backup.py --dir /path/to/data\n\n# 只显示前 20 个大文件\npython3 scripts/plan_backup.py --dir /path/to/data --top 20\n\n# 生成增量备份方案（最近 7 天）\npython3 scripts/plan_backup.py --dir /path/to/data --incremental 7\n\n# 生成 tar 备份脚本\npython3 scripts/plan_backup.py --dir /path/to/data --script tar --output backup.sh\n\n# 生成 rsync 备份脚本（远程目标）\npython3 scripts/plan_backup.py --dir /path/to/data --script rsync --remote user@server:/backup/\n\n# 自定义排除规则\npython3 scripts/plan_backup.py --dir /path/to/data --exclude \"*.log,node_modules,.git\"\n\n# 估算备份时间（假设 100MB/s 传输速度）\npython3 scripts/plan_backup.py --dir /path/to/data --speed 100\n\n# JSON 格式输出\npython3 scripts/plan_backup.py --dir /path/to/data --format json\n```\n\n### 步骤 3：解读结果\n\n- **扫描报告**：文件统计、类型分布、大文件列表\n- **备份方案**：备份范围、预估大小、预估时间、排除规则\n- **备份脚本**：可直接执行的 shell 脚本\n\n### 步骤 4：安全提示\n\n1. 备份前确认目标空间充足\n2. 重要数据遵循 3-2-1 原则（3份副本、2种介质、1份异地）\n3. 定期验证备份可恢复性\n4. 敏感数据备份应加密\n5. 不要将备份存储在同一物理设备上\n\n## 五、输出规范\n\n### 5.1 扫描报告\n\n```\n📊 目录扫描报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n目录：/path/to/data\n总大小：2.34 GB\n文件数：1,234\n目录数：89\n扫描用时：0.3 秒\n\n📁 类型分布：\n  文档：234 个，456 MB (19.5%)\n  图片：156 个，789 MB (33.7%)\n  视频：12 个，678 MB (29.0%)\n  代码：345 个，123 MB (5.3%)\n  其他：487 个，294 MB (12.5%)\n\n📈 大文件 Top 5：\n  1. /path/to/data/video/intro.mp4 — 234 MB\n  2. /path/to/data/backup.tar.gz — 156 MB\n  3. /path/to/data/docs/manual.pdf — 89 MB\n  4. /path/to/data/images/photo.raw — 67 MB\n  5. /path/to/data/data/dataset.csv — 45 MB\n\n💡 建议：\n  - 视频文件占比最大（29%），可考虑单独备份\n  - 建议排除 node_modules（123 MB）和 .git（45 MB）\n  - 压缩后预估大小：约 1.8 GB\n```\n\n### 5.2 备份方案\n\n```\n💾 备份方案\n━━━━━━━━━━━━━━━━━━━━━━━━\n备份类型：完整备份\n源目录：/path/to/data\n目标位置：/backup/\n\n📦 备份范围：\n  文件数：1,234\n  总大小：2.34 GB\n  排除后大小：2.17 GB（排除 167 MB）\n\n🚫 排除规则：\n  - node_modules/\n  - .git/\n  - __pycache__/\n  - *.log\n  - *.tmp\n\n⏱️  时间估算：\n  未压缩：约 22 秒（按 100 MB/s）\n  压缩后：约 1.8 GB，约 45 秒（含压缩时间）\n\n📋 建议：\n  - 备份频率：每周一次完整备份\n  - 保留份数：至少 3 份\n  - 存储介质：外接硬盘 + 云存储\n  - 验证恢复：每月验证一次\n```\n\n### 5.3 备份脚本\n\n```bash\n#!/bin/bash\n# 自动生成的备份脚本\n# 源目录：/path/to/data\n# 生成时间：2026-10-02\n\nSOURCE=\"/path/to/data\"\nDEST=\"/backup\"\nTIMESTAMP=$(date +%Y%m%d_%H%M%S)\nBACKUP_NAME=\"backup_${TIMESTAMP}.tar.gz\"\n\necho \"开始备份：${SOURCE}\"\necho \"目标文件：${DEST}/${BACKUP_NAME}\"\n\ntar -czf \"${DEST}/${BACKUP_NAME}\" \\\n  --exclude=\"node_modules\" \\\n  --exclude=\".git\" \\\n  --exclude=\"__pycache__\" \\\n  --exclude=\"*.log\" \\\n  --exclude=\"*.tmp\" \\\n  -C \"$(dirname \"${SOURCE}\")\" \\\n  \"$(basename \"${SOURCE}\")\"\n\nif [ $? -eq 0 ]; then\n  echo \"✅ 备份完成：${BACKUP_NAME}\"\n  echo \"文件大小：$(du -h \"${DEST}/${BACKUP_NAME}\" | cut -f1)\"\nelse\n  echo \"❌ 备份失败\"\n  exit 1\nfi\n```\n\n## 六、常见场景处理\n\n### 场景 1：个人文件备份\n**用户**：「帮我看看 Documents 目录有多大，做个备份计划」\n**处理**：扫描目录 → 生成报告 → 推荐每周完整备份 → 生成 tar 脚本。\n\n### 场景 2：项目代码备份\n**用户**：「这个项目怎么备份，要排除 node_modules」\n**处理**：扫描目录 → 自动识别排除规则 → 生成 rsync 增量备份脚本。\n\n### 场景 3：服务器数据迁移\n**用户**：「迁移前评估一下服务器数据量」\n**处理**：扫描目录 → 统计总大小和类型 → 估算传输时间 → 推荐分批迁移策略。\n\n### 场景 4：大文件清理\n**用户**：「找出最大的 10 个文件」\n**处理**：扫描目录 → 输出 Top 10 大文件 → 标记可删除/可压缩项。\n\n### 场景 5：增量备份\n**用户**：「只备份最近 7 天修改的文件」\n**处理**：扫描目录 → 按修改时间过滤 → 生成增量备份脚本 → 估算增量大小。\n\n## 七、注意事项\n\n1. **权限问题**：扫描需要读取权限，无权限的文件会被跳过并在报告中说明。\n2. **符号链接**：默认不跟随符号链接，避免循环引用和重复备份。\n3. **大目录扫描**：扫描数十万文件可能需要较长时间，建议先指定子目录。\n4. **时间估算**：备份时间基于假设传输速度，实际时间受磁盘 IO、CPU、网络影响。\n5. **压缩率估算**：不同文件类型压缩率差异大（文本 70%、图片 5%、视频 0%），估算仅供参考。\n6. **排除规则**：默认排除常见开发依赖目录和临时文件，可通过 `--exclude` 自定义。\n7. **脚本安全**：生成的脚本包含 `rm` 等危险命令时会加注释提醒，执行前请仔细检查。\n8. **不执行备份**：本技能只生成方案和脚本，不实际执行备份操作。\n9. **路径处理**：支持相对路径和绝对路径，脚本中会转换为绝对路径。\n10. **跨平台**：生成的 tar/rsync 脚本适用于 Linux/macOS，Windows 用户需使用 WSL 或对应工具。\n\n## 八、文件结构\n\n```\nbackup-planner/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── backup-policy-template.md          # 备份策略模板\n├── scripts/\n│   └── plan_backup.py                    # 备份计划脚本\n└── examples/\n    ├── sample-scan-report.md              # 示例扫描报告\n    └── sample-backup-script.sh            # 示例备份脚本\n```\n\n## 九、使用示例\n\n### 示例 1：快速扫描\n**用户**：「看看这个目录有多大」\n**AI**：运行 `--dir /path/to/data` → 输出文件统计和大文件列表。\n\n### 示例 2：生成备份脚本\n**用户**：「生成一个备份脚本，排除 node_modules 和 .git」\n**AI**：运行 `--script tar --exclude \"node_modules,.git\"` → 生成可执行脚本。\n\n### 示例 3：增量备份\n**用户**：「只备份最近 3 天的文件」\n**AI**：运行 `--incremental 3` → 过滤近期文件 → 生成增量备份方案。\n", "templates/backup-policy-template.md": "# 备份策略模板\n\n> 复制此模板，根据实际需求修改。遵循 3-2-1 备份原则。\n\n---\n\n## 3-2-1 备份原则\n\n| 原则 | 说明 |\n|---|---|\n| **3 份副本** | 原始数据 + 2 份备份 |\n| **2 种介质** | 不同类型的存储介质（如硬盘 + 云存储） |\n| **1 份异地** | 至少一份备份存放在不同地理位置 |\n\n---\n\n## 备份对象清单\n\n| 数据类型 | 路径 | 重要性 | 备份频率 | 保留份数 |\n|---|---|---|---|---|\n| 项目代码 | `/home/user/projects/` | 高 | 每日 | 30 天 |\n| 文档 | `/home/user/Documents/` | 高 | 每日 | 90 天 |\n| 照片 | `/home/user/Pictures/` | 中 | 每周 | 1 年 |\n| 配置文件 | `/home/user/.config/` | 中 | 每周 | 30 天 |\n| 数据库 | `/var/lib/postgresql/` | 高 | 每日 | 30 天 |\n| 日志 | `/var/log/` | 低 | 每月 | 7 天 |\n\n---\n\n## 备份方式\n\n### 完整备份\n- **频率**：每周一次（周日凌晨）\n- **范围**：所有指定目录\n- **保留**：最近 4 份\n- **压缩**：tar.gz\n\n### 增量备份\n- **频率**：每日一次（凌晨 2 点）\n- **范围**：最近 24 小时修改的文件\n- **保留**：最近 30 份\n- **工具**：rsync\n\n### 异地备份\n- **频率**：每周一次\n- **目标**：云存储 / 远程服务器\n- **加密**：必须加密\n- **验证**：每月验证可恢复性\n\n---\n\n## 排除规则\n\n```\n# 依赖目录\nnode_modules/\nvendor/\n__pycache__/\n.venv/\nvenv/\n\n# 版本控制\n.git/\n.svn/\n\n# 构建产物\ndist/\nbuild/\nout/\ntarget/\n\n# 临时文件\n*.log\n*.tmp\n*.temp\n*.swp\n*~\n\n# 系统文件\n.DS_Store\nThumbs.db\ndesktop.ini\n\n# 缓存\n.cache/\n.next/\n.nuxt/\n.idea/\n.vscode/\n```\n\n---\n\n## 恢复验证计划\n\n| 验证项 | 频率 | 负责人 | 方法 |\n|---|---|---|---|\n| 备份文件完整性 | 每周 | 系统管理员 | 检查文件大小和校验和 |\n| 随机文件恢复 | 每月 | 系统管理员 | 恢复 3 个随机文件并验证 |\n| 完整系统恢复 | 每季度 | 系统管理员 | 在测试环境完整恢复 |\n| 异地备份验证 | 每季度 | 系统管理员 | 从异地备份恢复 |\n\n---\n\n## 应急预案\n\n### 数据丢失时\n1. 立即停止写入操作\n2. 确认最近可用备份\n3. 在隔离环境恢复验证\n4. 确认数据完整后恢复生产\n5. 分析丢失原因，改进备份策略\n\n### 备份失败时\n1. 检查磁盘空间\n2. 检查权限和路径\n3. 查看错误日志\n4. 手动执行一次备份\n5. 如持续失败，切换备用备份方案\n\n---\n\n*模板由 backup-planner 技能提供*\n", "scripts/plan_backup.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\n备份计划脚本\n\n功能：\n- 扫描目录，统计文件数量、总大小、类型分布\n- 识别大文件和大目录\n- 生成完整/增量备份方案\n- 估算备份时间和压缩后大小\n- 生成 tar/rsync 备份脚本\n- 自动建议排除规则\n\n用法：\n  python3 plan_backup.py --dir /path/to/data\n  python3 plan_backup.py --dir /path/to/data --top 20\n  python3 plan_backup.py --dir /path/to/data --incremental 7\n  python3 plan_backup.py --dir /path/to/data --script tar --output backup.sh\n  python3 plan_backup.py --dir /path/to/data --script rsync --remote user@server:/backup/\n  python3 plan_backup.py --dir /path/to/data --exclude \"*.log,node_modules\"\n  python3 plan_backup.py --dir /path/to/data --speed 100\n  python3 plan_backup.py --dir /path/to/data --format json\n\"\"\"\n\nimport argparse\nimport json\nimport os\nimport sys\nimport time\nfrom collections import defaultdict\nfrom datetime import datetime, timedelta\nfrom typing import Dict, List, Optional, Tuple\n\n\n# ============================================================\n# 文件类型分类\n# ============================================================\n\nFILE_CATEGORIES = {\n    \"文档\": [\".pdf\", \".doc\", \".docx\", \".txt\", \".md\", \".rtf\", \".odt\",\n             \".xls\", \".xlsx\", \".ppt\", \".pptx\", \".csv\", \".epub\"],\n    \"图片\": [\".jpg\", \".jpeg\", \".png\", \".gif\", \".bmp\", \".svg\", \".webp\",\n             \".tiff\", \".raw\", \".ico\", \".heic\", \".psd\", \".ai\"],\n    \"视频\": [\".mp4\", \".avi\", \".mkv\", \".mov\", \".wmv\", \".flv\", \".webm\",\n             \".m4v\", \".mpg\", \".mpeg\", \".3gp\"],\n    \"音频\": [\".mp3\", \".wav\", \".flac\", \".aac\", \".ogg\", \".wma\", \".m4a\",\n             \".ape\", \".opus\"],\n    \"代码\": [\".py\", \".js\", \".ts\", \".java\", \".c\", \".cpp\", \".h\", \".hpp\",\n             \".go\", \".rs\", \".rb\", \".php\", \".swift\", \".kt\", \".sh\", \".bash\",\n             \".html\", \".css\", \".scss\", \".less\", \".vue\", \".jsx\", \".tsx\",\n             \".sql\", \".json\", \".xml\", \".yaml\", \".yml\", \".toml\", \".ini\",\n             \".cfg\", \".conf\", \".makefile\", \".dockerfile\"],\n    \"压缩包\": [\".zip\", \".tar\", \".gz\", \".bz2\", \".xz\", \".7z\", \".rar\",\n               \".tgz\", \".tbz2\", \".zst\"],\n    \"安装包\": [\".exe\", \".msi\", \".dmg\", \".pkg\", \".deb\", \".rpm\", \".apk\",\n               \".ipa\", \".appimage\"],\n    \"字体\": [\".ttf\", \".otf\", \".woff\", \".woff2\", \".eot\"],\n    \"数据库\": [\".db\", \".sqlite\", \".sqlite3\", \".mdb\", \".accdb\"],\n    \"其他\": [],\n}\n\n# 默认排除目录\nDEFAULT_EXCLUDE_DIRS = {\n    \"node_modules\", \".git\", \"__pycache__\", \".venv\", \"venv\", \"env\",\n    \".idea\", \".vscode\", \".vs\", \"vendor\", \"bower_components\",\n    \".next\", \".nuxt\", \"dist\", \"build\", \"out\", \".cache\",\n    \".pytest_cache\", \".mypy_cache\", \".ruff_cache\",\n    \"target\", \".gradle\", \".maven\", \"Cargo\",\n}\n\n# 默认排除文件模式\nDEFAULT_EXCLUDE_FILES = [\n    \"*.log\", \"*.tmp\", \"*.temp\", \"*.swp\", \"*.swo\", \"*~\",\n    \".DS_Store\", \"Thumbs.db\", \"desktop.ini\",\n    \"*.pyc\", \"*.pyo\", \"*.class\",\n    \"*.bak\", \"*.old\", \"*.orig\",\n]\n\n# 各类型压缩率估算（0-1，1表示完全压缩）\nCOMPRESSION_RATIOS = {\n    \"文档\": 0.7,\n    \"图片\": 0.05,\n    \"视频\": 0.0,\n    \"音频\": 0.1,\n    \"代码\": 0.6,\n    \"压缩包\": 0.0,\n    \"安装包\": 0.0,\n    \"字体\": 0.3,\n    \"数据库\": 0.5,\n    \"其他\": 0.3,\n}\n\n\n# ============================================================\n# 工具函数\n# ============================================================\n\ndef format_size(size_bytes: int) -> str:\n    \"\"\"格式化文件大小\"\"\"\n    if size_bytes < 1024:\n        return f\"{size_bytes} B\"\n    elif size_bytes < 1024 * 1024:\n        return f\"{size_bytes / 1024:.1f} KB\"\n    elif size_bytes < 1024 * 1024 * 1024:\n        return f\"{size_bytes / (1024 * 1024):.1f} MB\"\n    elif size_bytes < 1024 * 1024 * 1024 * 1024:\n        return f\"{size_bytes / (1024 * 1024 * 1024):.2f} GB\"\n    else:\n        return f\"{size_bytes / (1024 * 1024 * 1024 * 1024):.2f} TB\"\n\n\ndef format_duration(seconds: float) -> str:\n    \"\"\"格式化时长\"\"\"\n    if seconds < 1:\n        return \"不到 1 秒\"\n    elif seconds < 60:\n        return f\"{seconds:.0f} 秒\"\n    elif seconds < 3600:\n        return f\"{seconds / 60:.1f} 分钟\"\n    else:\n        return f\"{seconds / 3600:.1f} 小时\"\n\n\ndef get_category(ext: str) -> str:\n    \"\"\"获取文件类型分类\"\"\"\n    ext = ext.lower()\n    for category, exts in FILE_CATEGORIES.items():\n        if ext in exts:\n            return category\n    return \"其他\"\n\n\ndef should_exclude(name: str, exclude_patterns: List[str]) -> bool:\n    \"\"\"判断是否应排除\"\"\"\n    import fnmatch\n    for pattern in exclude_patterns:\n        if fnmatch.fnmatch(name, pattern):\n            return True\n    return False\n\n\n# ============================================================\n# 目录扫描\n# ============================================================\n\nclass ScanResult:\n    \"\"\"扫描结果\"\"\"\n    def __init__(self):\n        self.total_files = 0\n        self.total_dirs = 0\n        self.total_size = 0\n        self.category_stats = defaultdict(lambda: {\"count\": 0, \"size\": 0})\n        self.large_files = []  # (path, size)\n        self.large_dirs = defaultdict(int)  # dir_path -> size\n        self.skipped = 0\n        self.scan_time = 0.0\n        self.modified_recently = 0  # 最近 N 天修改的文件数\n        self.modified_recently_size = 0\n\n\ndef scan_directory(dir_path: str, exclude_dirs: set,\n                   exclude_files: List[str],\n                   incremental_days: int = 0,\n                   top_n: int = 10) -> ScanResult:\n    \"\"\"扫描目录\"\"\"\n    result = ScanResult()\n    start_time = time.time()\n\n    cutoff_time = None\n    if incremental_days > 0:\n        cutoff_time = (datetime.now() - timedelta(days=incremental_days)).timestamp()\n\n    abs_dir = os.path.abspath(dir_path)\n\n    for root, dirs, files in os.walk(abs_dir, followlinks=False):\n        # 过滤排除目录\n        dirs[:] = [d for d in dirs if d not in exclude_dirs]\n        result.total_dirs += len(dirs)\n\n        for fname in files:\n            if should_exclude(fname, exclude_files):\n                result.skipped += 1\n                continue\n\n            fpath = os.path.join(root, fname)\n            try:\n                stat = os.lstat(fpath)\n                if os.path.islink(fpath):\n                    result.skipped += 1\n                    continue\n\n                size = stat.st_size\n                result.total_files += 1\n                result.total_size += size\n\n                # 分类统计\n                ext = os.path.splitext(fname)[1]\n                cat = get_category(ext)\n                result.category_stats[cat][\"count\"] += 1\n                result.category_stats[cat][\"size\"] += size\n\n                # 大文件\n                result.large_files.append((fpath, size))\n\n                # 大目录（直接父目录）\n                parent = os.path.dirname(fpath)\n                result.large_dirs[parent] += size\n\n                # 增量备份过滤\n                if cutoff_time and stat.st_mtime >= cutoff_time:\n                    result.modified_recently += 1\n                    result.modified_recently_size += size\n\n            except (OSError, PermissionError):\n                result.skipped += 1\n                continue\n\n    # 排序大文件\n    result.large_files.sort(key=lambda x: x[1], reverse=True)\n    result.large_files = result.large_files[:top_n]\n\n    # 排序大目录\n    result.large_dirs = sorted(result.large_dirs.items(),\n                                key=lambda x: x[1], reverse=True)[:top_n]\n\n    result.scan_time = time.time() - start_time\n    return result\n\n\n# ============================================================\n# 备份方案生成\n# ============================================================\n\ndef estimate_compressed_size(result: ScanResult) -> int:\n    \"\"\"估算压缩后大小\"\"\"\n    compressed = 0\n    for cat, stats in result.category_stats.items():\n        ratio = COMPRESSION_RATIOS.get(cat, 0.3)\n        compressed += int(stats[\"size\"] * (1 - ratio))\n    return compressed\n\n\ndef estimate_backup_time(total_size: int, speed_mbps: float,\n                          compressed: bool = False) -> float:\n    \"\"\"估算备份时间（秒）\"\"\"\n    if speed_mbps <= 0:\n        speed_mbps = 100\n    size_mb = total_size / (1024 * 1024)\n    time_sec = size_mb / speed_mbps\n    if compressed:\n        time_sec *= 1.5  # 压缩需要额外时间\n    return time_sec\n\n\n# ============================================================\n# 备份脚本生成\n# ============================================================\n\ndef generate_tar_script(source: str, exclude_dirs: set,\n                        exclude_files: List[str],\n                        incremental_days: int = 0) -> str:\n    \"\"\"生成 tar 备份脚本\"\"\"\n    abs_source = os.path.abspath(source)\n    source_dir = os.path.dirname(abs_source)\n    source_name = os.path.basename(abs_source)\n\n    lines = [\n        \"#!/bin/bash\",\n        \"# 自动生成的 tar 备份脚本\",\n        f\"# 源目录：{abs_source}\",\n        f\"# 生成时间：{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\",\n        \"\",\n        f'SOURCE=\"{abs_source}\"',\n        'DEST=\"${DEST:-/backup}\"',\n        'TIMESTAMP=$(date +%Y%m%d_%H%M%S)',\n        'BACKUP_NAME=\"backup_${TIMESTAMP}.tar.gz\"',\n        \"\",\n        'echo \"开始备份：${SOURCE}\"',\n        'echo \"目标文件：${DEST}/${BACKUP_NAME}\"',\n        \"\",\n        \"tar -czf \\\"${DEST}/${BACKUP_NAME}\\\" \\\\\",\n    ]\n\n    # 排除规则\n    for d in sorted(exclude_dirs):\n        lines.append(f'  --exclude=\"{d}\" \\\\')\n    for f in exclude_files:\n        if not f.startswith(\".\"):\n            lines.append(f'  --exclude=\"{f}\" \\\\')\n\n    # 增量备份\n    if incremental_days > 0:\n        lines.append(f'  --newer-mtime=\"-{incremental_days} days\" \\\\')\n\n    lines.extend([\n        f'  -C \"{source_dir}\" \\\\',\n        f'  \"{source_name}\"',\n        \"\",\n        \"if [ $? -eq 0 ]; then\",\n        '  echo \"✅ 备份完成：${BACKUP_NAME}\"',\n        '  echo \"文件大小：$(du -h \"${DEST}/${BACKUP_NAME}\" | cut -f1)\"',\n        \"else\",\n        '  echo \"❌ 备份失败\"',\n        \"  exit 1\",\n        \"fi\",\n    ])\n\n    return \"\\n\".join(lines)\n\n\ndef generate_rsync_script(source: str, exclude_dirs: set,\n                          exclude_files: List[str],\n                          remote: str = \"\",\n                          incremental: bool = True) -> str:\n    \"\"\"生成 rsync 备份脚本\"\"\"\n    abs_source = os.path.abspath(source)\n    if not abs_source.endswith(\"/\"):\n        abs_source += \"/\"\n\n    lines = [\n        \"#!/bin/bash\",\n        \"# 自动生成的 rsync 备份脚本\",\n        f\"# 源目录：{abs_source}\",\n        f\"# 生成时间：{datetime.now().strftime('%Y-%m-%d %H:%M:%S')}\",\n        \"\",\n        f'SOURCE=\"{abs_source}\"',\n    ]\n\n    if remote:\n        lines.append(f'DEST=\"{remote}\"')\n    else:\n        lines.append('DEST=\"${DEST:-/backup/}\"')\n\n    lines.extend([\n        \"\",\n        'echo \"开始同步：${SOURCE} -> ${DEST}\"',\n        \"\",\n        \"rsync -avz --progress \\\\\",\n        \"  --delete \\\\\",\n    ])\n\n    for d in sorted(exclude_dirs):\n        lines.append(f'  --exclude=\"{d}/\" \\\\')\n    for f in exclude_files:\n        lines.append(f'  --exclude=\"{f}\" \\\\')\n\n    lines.extend([\n        '  \"${SOURCE}\" \"${DEST}\"',\n        \"\",\n        \"if [ $? -eq 0 ]; then\",\n        '  echo \"✅ 同步完成\"',\n        \"else\",\n        '  echo \"❌ 同步失败\"',\n        \"  exit 1\",\n        \"fi\",\n    ])\n\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 输出格式化\n# ============================================================\n\ndef format_scan_report(result: ScanResult, dir_path: str,\n                       incremental_days: int = 0) -> str:\n    \"\"\"格式化扫描报告\"\"\"\n    lines = []\n    lines.append(\"📊 目录扫描报告\")\n    lines.append(\"━\" * 40)\n    lines.append(f\"目录：{os.path.abspath(dir_path)}\")\n    lines.append(f\"总大小：{format_size(result.total_size)}\")\n    lines.append(f\"文件数：{result.total_files:,}\")\n    lines.append(f\"目录数：{result.total_dirs:,}\")\n    if result.skipped > 0:\n        lines.append(f\"跳过：{result.skipped} 个（排除/无权限/符号链接）\")\n    lines.append(f\"扫描用时：{result.scan_time:.2f} 秒\")\n\n    if incremental_days > 0:\n        lines.append(\"\")\n        lines.append(f\"📅 最近 {incremental_days} 天修改：\")\n        lines.append(f\"  文件数：{result.modified_recently:,}\")\n        lines.append(f\"  大小：{format_size(result.modified_recently_size)}\")\n\n    # 类型分布\n    lines.append(\"\")\n    lines.append(\"📁 类型分布：\")\n    sorted_cats = sorted(result.category_stats.items(),\n                         key=lambda x: x[1][\"size\"], reverse=True)\n    for cat, stats in sorted_cats:\n        if stats[\"count\"] > 0:\n            pct = stats[\"size\"] / result.total_size * 100 if result.total_size > 0 else 0\n            lines.append(f\"  {cat}：{stats['count']:,} 个，{format_size(stats['size'])} ({pct:.1f}%)\")\n\n    # 大文件\n    if result.large_files:\n        lines.append(\"\")\n        lines.append(f\"📈 大文件 Top {len(result.large_files)}：\")\n        for i, (fpath, size) in enumerate(result.large_files, 1):\n            display = fpath\n            if len(display) > 60:\n                display = \"...\" + display[-57:]\n            lines.append(f\"  {i}. {display} — {format_size(size)}\")\n\n    # 大目录\n    if result.large_dirs:\n        lines.append(\"\")\n        lines.append(f\"📂 大目录 Top {min(5, len(result.large_dirs))}：\")\n        for i, (dpath, size) in enumerate(result.large_dirs[:5], 1):\n            display = dpath\n            if len(display) > 60:\n                display = \"...\" + display[-57:]\n            lines.append(f\"  {i}. {display} — {format_size(size)}\")\n\n    # 建议\n    lines.append(\"\")\n    lines.append(\"💡 建议：\")\n    # 找出占比最大的类型\n    if sorted_cats:\n        top_cat = sorted_cats[0]\n        lines.append(f\"  - {top_cat[0]}文件占比最大（{top_cat[1]['size']/result.total_size*100:.0f}%），可考虑单独备份\")\n    lines.append(\"  - 建议排除 node_modules、.git 等依赖目录\")\n    compressed = estimate_compressed_size(result)\n    lines.append(f\"  - 压缩后预估大小：约 {format_size(compressed)}\")\n    lines.append(\"━\" * 40)\n    return \"\\n\".join(lines)\n\n\ndef format_backup_plan(result: ScanResult, dir_path: str,\n                       incremental_days: int = 0,\n                       speed_mbps: float = 100) -> str:\n    \"\"\"格式化备份方案\"\"\"\n    lines = []\n    lines.append(\"💾 备份方案\")\n    lines.append(\"━\" * 40)\n\n    if incremental_days > 0:\n        lines.append(f\"备份类型：增量备份（最近 {incremental_days} 天）\")\n        backup_size = result.modified_recently_size\n        backup_count = result.modified_recently\n    else:\n        lines.append(\"备份类型：完整备份\")\n        backup_size = result.total_size\n        backup_count = result.total_files\n\n    lines.append(f\"源目录：{os.path.abspath(dir_path)}\")\n    lines.append(\"\")\n    lines.append(\"📦 备份范围：\")\n    lines.append(f\"  文件数：{backup_count:,}\")\n    lines.append(f\"  总大小：{format_size(backup_size)}\")\n\n    compressed = estimate_compressed_size(result)\n    if incremental_days > 0:\n        compressed = int(compressed * result.modified_recently_size / result.total_size) if result.total_size > 0 else 0\n    lines.append(f\"  压缩后预估：约 {format_size(compressed)}\")\n\n    lines.append(\"\")\n    lines.append(\"🚫 排除规则：\")\n    for d in sorted(DEFAULT_EXCLUDE_DIRS):\n        lines.append(f\"  - {d}/\")\n    for f in DEFAULT_EXCLUDE_FILES[:5]:\n        lines.append(f\"  - {f}\")\n    if len(DEFAULT_EXCLUDE_FILES) > 5:\n        lines.append(f\"  - ... 等 {len(DEFAULT_EXCLUDE_FILES)} 种文件模式\")\n\n    lines.append(\"\")\n    lines.append(\"⏱️  时间估算：\")\n    raw_time = estimate_backup_time(backup_size, speed_mbps, compressed=False)\n    comp_time = estimate_backup_time(compressed, speed_mbps, compressed=True)\n    lines.append(f\"  未压缩：约 {format_duration(raw_time)}（按 {speed_mbps} MB/s）\")\n    lines.append(f\"  压缩后：约 {format_duration(comp_time)}（含压缩时间）\")\n\n    lines.append(\"\")\n    lines.append(\"📋 建议：\")\n    if backup_size > 10 * 1024 * 1024 * 1024:  # > 10GB\n        lines.append(\"  - 数据量较大，建议使用增量备份\")\n        lines.append(\"  - 备份频率：每周完整 + 每日增量\")\n    elif backup_size > 1 * 1024 * 1024 * 1024:  # > 1GB\n        lines.append(\"  - 备份频率：每周一次完整备份\")\n    else:\n        lines.append(\"  - 备份频率：每日一次完整备份\")\n    lines.append(\"  - 保留份数：至少 3 份（遵循 3-2-1 原则）\")\n    lines.append(\"  - 存储介质：外接硬盘 + 云存储\")\n    lines.append(\"  - 验证恢复：每月验证一次备份可恢复性\")\n    lines.append(\"━\" * 40)\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"备份计划工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--dir\", \"-d\", required=True, help=\"要扫描的目录路径\")\n    parser.add_argument(\"--top\", \"-n\", type=int, default=10, help=\"显示前 N 个大文件（默认 10）\")\n    parser.add_argument(\"--incremental\", \"-i\", type=int, default=0, metavar=\"DAYS\",\n                        help=\"增量备份：仅包含最近 N 天修改的文件\")\n    parser.add_argument(\"--script\", \"-s\", choices=[\"tar\", \"rsync\"],\n                        help=\"生成备份脚本类型\")\n    parser.add_argument(\"--remote\", \"-r\", default=\"\",\n                        help=\"rsync 远程目标（如 user@server:/backup/）\")\n    parser.add_argument(\"--exclude\", \"-e\", default=\"\",\n                        help=\"额外排除规则，逗号分隔（如 *.log,node_modules）\")\n    parser.add_argument(\"--speed\", type=float, default=100,\n                        help=\"假设传输速度 MB/s（默认 100）\")\n    parser.add_argument(\"--format\", \"-f\", choices=[\"text\", \"json\"], default=\"text\",\n                        help=\"输出格式\")\n    parser.add_argument(\"--output\", \"-o\", metavar=\"FILE\", help=\"输出到文件\")\n    args = parser.parse_args()\n\n    # 检查目录\n    if not os.path.isdir(args.dir):\n        print(f\"错误：目录不存在：{args.dir}\", file=sys.stderr)\n        sys.exit(1)\n\n    # 解析排除规则\n    exclude_dirs = set(DEFAULT_EXCLUDE_DIRS)\n    exclude_files = list(DEFAULT_EXCLUDE_FILES)\n    if args.exclude:\n        for item in args.exclude.split(\",\"):\n            item = item.strip()\n            if item:\n                if \".\" in item or \"*\" in item:\n                    exclude_files.append(item)\n                else:\n                    exclude_dirs.add(item)\n\n    # 扫描\n    print(f\"正在扫描：{args.dir} ...\", file=sys.stderr)\n    result = scan_directory(args.dir, exclude_dirs, exclude_files,\n                            incremental_days=args.incremental,\n                            top_n=args.top)\n\n    # 输出\n    output = \"\"\n\n    if args.script:\n        if args.script == \"tar\":\n            output = generate_tar_script(args.dir, exclude_dirs, exclude_files,\n                                          incremental_days=args.incremental)\n        else:\n            output = generate_rsync_script(args.dir, exclude_dirs, exclude_files,\n                                            remote=args.remote,\n                                            incremental=(args.incremental > 0))\n    elif args.format == \"json\":\n        data = {\n            \"directory\": os.path.abspath(args.dir),\n            \"total_files\": result.total_files,\n            \"total_dirs\": result.total_dirs,\n            \"total_size\": result.total_size,\n            \"total_size_human\": format_size(result.total_size),\n            \"skipped\": result.skipped,\n            \"scan_time\": round(result.scan_time, 2),\n            \"categories\": {k: dict(v) for k, v in result.category_stats.items()},\n            \"large_files\": [{\"path\": p, \"size\": s, \"size_human\": format_size(s)}\n                            for p, s in result.large_files],\n            \"compressed_estimate\": estimate_compressed_size(result),\n            \"incremental_days\": args.incremental,\n            \"modified_recently\": result.modified_recently,\n            \"modified_recently_size\": result.modified_recently_size,\n        }\n        output = json.dumps(data, ensure_ascii=False, indent=2)\n    else:\n        output = format_scan_report(result, args.dir, args.incremental)\n        output += \"\\n\\n\"\n        output += format_backup_plan(result, args.dir, args.incremental, args.speed)\n\n    print(output)\n\n    if args.output:\n        with open(args.output, 'w', encoding='utf-8') as f:\n            f.write(output + \"\\n\")\n        print(f\"\\n已保存到：{args.output}\", file=sys.stderr)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-scan-report.md": "# 示例：目录扫描报告\n\n> 使用 `plan_backup.py --dir /path/to/data --top 10` 生成。\n\n---\n\n## 基本信息\n\n| 项目 | 值 |\n|---|---|\n| 目录 | `/home/user/data/` |\n| 总大小 | 12.34 GB |\n| 文件数 | 8,456 |\n| 目录数 | 342 |\n| 跳过 | 23 个（排除/无权限） |\n| 扫描用时 | 2.3 秒 |\n\n---\n\n## 类型分布\n\n| 类型 | 文件数 | 大小 | 占比 |\n|---|---|---|---|\n| 视频 | 45 | 6.78 GB | 55.0% |\n| 图片 | 1,234 | 2.34 GB | 19.0% |\n| 文档 | 2,345 | 1.56 GB | 12.6% |\n| 代码 | 3,456 | 890 MB | 7.2% |\n| 压缩包 | 123 | 567 MB | 4.6% |\n| 其他 | 1,253 | 200 MB | 1.6% |\n\n---\n\n## 大文件 Top 10\n\n| # | 文件路径 | 大小 | 类型 |\n|---|---|---|---|\n| 1 | `/data/video/tutorial_01.mp4` | 1.23 GB | 视频 |\n| 2 | `/data/video/tutorial_02.mp4` | 987 MB | 视频 |\n| 3 | `/data/backup/old_system.tar.gz` | 756 MB | 压缩包 |\n| 4 | `/data/video/tutorial_03.mp4` | 654 MB | 视频 |\n| 5 | `/data/docs/design_source.psd` | 345 MB | 图片 |\n| 6 | `/data/video/tutorial_04.mp4` | 234 MB | 视频 |\n| 7 | `/data/data/dataset_large.csv` | 189 MB | 文档 |\n| 8 | `/data/images/photo_raw_01.raw` | 156 MB | 图片 |\n| 9 | `/data/video/tutorial_05.mp4` | 134 MB | 视频 |\n| 10 | `/data/backup/database_dump.sql` | 98 MB | 文档 |\n\n---\n\n## 大目录 Top 5\n\n| # | 目录路径 | 大小 |\n|---|---|---|\n| 1 | `/data/video/` | 6.78 GB |\n| 2 | `/data/images/` | 2.34 GB |\n| 3 | `/data/docs/` | 1.56 GB |\n| 4 | `/data/backup/` | 854 MB |\n| 5 | `/data/code/` | 890 MB |\n\n---\n\n## 备份建议\n\n1. **视频文件占比最大（55%）**，建议单独备份或使用增量备份\n2. `/data/backup/` 目录包含旧备份，建议排除或单独处理\n3. 压缩后预估大小：约 8.5 GB（视频几乎不可压缩）\n4. 建议使用外接硬盘 + 云存储的双备份策略\n5. 备份频率：每周完整 + 每日增量\n\n---\n\n*报告由 backup-planner 技能生成*\n", "examples/sample-backup-script.sh": "#!/bin/bash\n# 自动生成的 tar 备份脚本\n# 源目录：/home/user/data\n# 生成时间：2026-10-02 20:30:00\n# 用法：./backup.sh [目标目录]\n#   默认目标：/backup\n\nSOURCE=\"/home/user/data\"\nDEST=\"${1:-/backup}\"\nTIMESTAMP=$(date +%Y%m%d_%H%M%S)\nBACKUP_NAME=\"backup_${TIMESTAMP}.tar.gz\"\nLOG_FILE=\"${DEST}/backup_${TIMESTAMP}.log\"\n\necho \"========================================\"\necho \"  备份开始\"\necho \"========================================\"\necho \"源目录：${SOURCE}\"\necho \"目标文件：${DEST}/${BACKUP_NAME}\"\necho \"开始时间：$(date '+%Y-%m-%d %H:%M:%S')\"\necho \"\"\n\n# 检查源目录\nif [ ! -d \"${SOURCE}\" ]; then\n    echo \"❌ 错误：源目录不存在：${SOURCE}\"\n    exit 1\nfi\n\n# 检查目标目录\nif [ ! -d \"${DEST}\" ]; then\n    echo \"⚠️  目标目录不存在，正在创建：${DEST}\"\n    mkdir -p \"${DEST}\"\nfi\n\n# 检查磁盘空间（至少需要源目录大小的 1.5 倍）\nSOURCE_SIZE=$(du -sb \"${SOURCE}\" | cut -f1)\nREQUIRED_SIZE=$((SOURCE_SIZE * 3 / 2))\nAVAILABLE_SIZE=$(df -B1 \"${DEST}\" | tail -1 | awk '{print $4}')\n\nif [ \"${AVAILABLE_SIZE}\" -lt \"${REQUIRED_SIZE}\" ]; then\n    echo \"❌ 错误：磁盘空间不足\"\n    echo \"  需要：$((REQUIRED_SIZE / 1024 / 1024)) MB\"\n    echo \"  可用：$((AVAILABLE_SIZE / 1024 / 1024)) MB\"\n    exit 1\nfi\n\n# 执行备份\necho \"正在备份...\"\ntar -czf \"${DEST}/${BACKUP_NAME}\" \\\n    --exclude=\"node_modules\" \\\n    --exclude=\".git\" \\\n    --exclude=\"__pycache__\" \\\n    --exclude=\".venv\" \\\n    --exclude=\"venv\" \\\n    --exclude=\"dist\" \\\n    --exclude=\"build\" \\\n    --exclude=\"*.log\" \\\n    --exclude=\"*.tmp\" \\\n    --exclude=\".DS_Store\" \\\n    --exclude=\"Thumbs.db\" \\\n    -C \"$(dirname \"${SOURCE}\")\" \\\n    \"$(basename \"${SOURCE}\")\" 2>&1 | tee \"${LOG_FILE}\"\n\nTAR_EXIT=$?\n\necho \"\"\nif [ ${TAR_EXIT} -eq 0 ]; then\n    BACKUP_SIZE=$(du -h \"${DEST}/${BACKUP_NAME}\" | cut -f1)\n    echo \"✅ 备份完成！\"\n    echo \"  文件：${BACKUP_NAME}\"\n    echo \"  大小：${BACKUP_SIZE}\"\n    echo \"  日志：${LOG_FILE}\"\n    echo \"  结束时间：$(date '+%Y-%m-%d %H:%M:%S')\"\n\n    # 生成校验和\n    echo \"\"\n    echo \"正在生成校验和...\"\n    sha256sum \"${DEST}/${BACKUP_NAME}\" > \"${DEST}/${BACKUP_NAME}.sha256\"\n    echo \"  校验和：${DEST}/${BACKUP_NAME}.sha256\"\n\n    # 清理旧备份（保留最近 7 份）\n    echo \"\"\n    echo \"清理旧备份（保留最近 7 份）...\"\n    cd \"${DEST}\" && ls -t backup_*.tar.gz 2>/dev/null | tail -n +8 | while read old; do\n        rm -f \"${old}\" \"${old}.sha256\" \"backup_$(echo ${old} | sed 's/backup_//;s/.tar.gz//').log\"\n        echo \"  已删除：${old}\"\n    done\n\n    echo \"\"\n    echo \"========================================\"\n    echo \"  备份成功\"\n    echo \"========================================\"\n    exit 0\nelse\n    echo \"❌ 备份失败（退出码：${TAR_EXIT}）\"\n    echo \"  请查看日志：${LOG_FILE}\"\n    echo \"========================================\"\n    echo \"  备份失败\"\n    echo \"========================================\"\n    exit 1\nfi\n"}, "file_count": 5, "script_lines": 582}, {"name": "changelog-generator", "title": "changelog-generator", "description": "变更日志生成助手。解析 Git 仓库提交历史，按 Conventional Commits 规范自动分类（feat/fix/docs/style/refactor/perf/test/chore/build/ci），支持按版本标签或日期范围分组，生成符合 Keep a Changelog 规范的 Markdown 变更日志，提供提交类型统计、作者贡献统计、未发布变更管理，可指定输出格式和版本号。适用于项目发布前生成 CHANGELOG.md、版本发布说明、提交历史回顾等场景。", "category": "其他", "icon": "📦", "color": "#6b7280", "skill_md": "---\nname: changelog-generator\ndescription: '变更日志生成助手。解析 Git 仓库提交历史，按 Conventional Commits 规范自动分类（feat/fix/docs/style/refactor/perf/test/chore/build/ci），支持按版本标签或日期范围分组，生成符合 Keep a Changelog 规范的 Markdown 变更日志，提供提交类型统计、作者贡献统计、未发布变更管理，可指定输出格式和版本号。适用于项目发布前生成 CHANGELOG.md、版本发布说明、提交历史回顾等场景。'\n---\n\n# 变更日志生成助手\n\n## 一、技能定位\n\n本技能用于**从 Git 提交历史自动生成变更日志**。核心价值：\n\n- 解析 Git log，提取提交信息、日期、作者\n- 按 Conventional Commits 规范自动分类\n- 按版本标签或日期范围分组\n- 生成 Keep a Changelog 格式的 Markdown 文档\n- 提交统计（按类型、按作者）\n- 未发布变更管理\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「生成变更日志」「写 CHANGELOG」「生成本次更新说明」\n2. 用户说「整理一下这个版本的提交」「版本发布说明」\n3. 用户说「看看最近改了什么」「提交历史回顾」\n4. 用户说「统计一下提交记录」「谁提交得多」\n5. 用户说「生成 release notes」「发布公告」\n6. 用户说「按类型分类提交」「feat 和 fix 分开列」\n\n## 三、Conventional Commits 规范\n\n提交信息格式：`<type>(<scope>): <subject>`\n\n### 3.1 支持的类型\n\n| 类型 | 说明 | 变更日志分类 |\n|---|---|---|\n| `feat` | 新功能 | ✨ 新增功能 |\n| `fix` | Bug 修复 | 🐛 问题修复 |\n| `docs` | 文档变更 | 📝 文档更新 |\n| `style` | 代码格式（不影响功能） | 💄 样式调整 |\n| `refactor` | 重构（既不修复 bug 也不增加功能） | ♻️ 代码重构 |\n| `perf` | 性能优化 | ⚡ 性能提升 |\n| `test` | 测试相关 | ✅ 测试更新 |\n| `build` | 构建系统或外部依赖 | 📦 构建变更 |\n| `ci` | CI 配置 | 🔧 CI/CD |\n| `chore` | 杂项（不修改 src 或测试） | 🔨 杂项 |\n| `revert` | 回退提交 | ⏪️ 回退 |\n\n### 3.2 示例\n\n```\nfeat(auth): 添加用户登录功能\nfix(api): 修复用户列表分页错误\ndocs(readme): 更新安装说明\nrefactor(user): 重构用户服务层\nperf(query): 优化数据库查询性能\n```\n\n## 四、Keep a Changelog 格式\n\n```markdown\n# 更新日志\n\n所有显著变更都记录在此文件中。\n\n格式基于 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，\n本项目遵循 [语义化版本](https://semver.org/lang/zh-CN/)。\n\n## [未发布]\n\n### ✨ 新增功能\n- 用户登录功能\n\n## [1.0.0] - 2024-01-15\n\n### ✨ 新增功能\n- 用户注册\n- 密码重置\n\n### 🐛 问题修复\n- 修复登录页面样式问题\n```\n\n## 五、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 生成变更日志 / 提交统计 / 发布说明\n- Git 仓库路径（默认当前目录）\n- 版本范围（标签/日期/全部）\n- 输出格式（Markdown/JSON/纯文本）\n\n### 步骤 2：运行脚本\n\n使用 `scripts/generate_changelog.py`：\n\n```bash\n# 生成完整变更日志（所有标签 + 未发布）\npython3 scripts/generate_changelog.py --repo /path/to/repo\n\n# 只生成未发布的变更\npython3 scripts/generate_changelog.py --repo /path/to/repo --unreleased\n\n# 指定版本范围\npython3 scripts/generate_changelog.py --repo /path/to/repo --from v1.0.0 --to v2.0.0\n\n# 指定日期范围\npython3 scripts/generate_changelog.py --repo /path/to/repo --since 2024-01-01 --until 2024-06-30\n\n# 指定版本号（用于未发布变更的标题）\npython3 scripts/generate_changelog.py --repo /path/to/repo --version 1.2.0\n\n# 显示提交统计\npython3 scripts/generate_changelog.py --repo /path/to/repo --stats\n\n# JSON 格式输出\npython3 scripts/generate_changelog.py --repo /path/to/repo --format json\n\n# 保存到文件\npython3 scripts/generate_changelog.py --repo /path/to/repo --output CHANGELOG.md\n```\n\n### 步骤 3：解读结果\n\n- **变更日志**：按版本分组，每个版本内按类型分类\n- **提交统计**：各类型提交数量、作者贡献排名\n- **未发布变更**：最新标签之后的所有提交\n\n### 步骤 4：安全提示\n\n1. 本技能只读取 Git 历史，不修改任何文件\n2. 提交信息可能包含敏感信息，生成的日志请检查后再发布\n3. 建议遵循 Conventional Commits 规范以获得最佳分类效果\n\n## 六、输出规范\n\n### 6.1 完整变更日志\n\n```\n# 更新日志\n\n## [未发布]\n\n### ✨ 新增功能\n- feat(auth): 添加 OAuth 登录 (@alice)\n- feat(api): 新增用户批量导出接口 (@bob)\n\n### 🐛 问题修复\n- fix(ui): 修复移动端导航栏显示问题 (@alice)\n\n## [1.2.0] - 2024-06-15\n\n### ✨ 新增功能\n- feat(search): 添加全文搜索功能\n\n### ⚡ 性能提升\n- perf(db): 优化查询性能 40%\n\n### 🐛 问题修复\n- fix(auth): 修复 token 过期处理\n```\n\n### 6.2 提交统计\n\n```\n📊 提交统计\n━━━━━━━━━━━━━━━━━━━━━━━━\n总提交数：156\n\n按类型分布：\n  ✨ feat:        45 (28.8%) ████████████\n  🐛 fix:         38 (24.4%) ██████████\n  📝 docs:        22 (14.1%) ██████\n  ♻️ refactor:    18 (11.5%) █████\n  ⚡ perf:        12 ( 7.7%) ███\n  ✅ test:        10 ( 6.4%) ██\n  🔧 ci:           6 ( 3.8%) █\n  🔨 chore:        5 ( 3.2%) █\n\n作者贡献：\n  1. alice@example.com    68 (43.6%)\n  2. bob@example.com      52 (33.3%)\n  3. charlie@example.com  36 (23.1%)\n```\n\n## 七、常见场景处理\n\n### 场景 1：发布前生成 CHANGELOG\n**用户**：「准备发布 v2.0，帮我生成变更日志」\n**处理**：扫描 Git 历史 → 按标签分组 → 生成 Keep a Changelog 格式 → 保存为 CHANGELOG.md。\n\n### 场景 2：只看未发布的变更\n**用户**：「看看上次发布后改了什么」\n**处理**：找到最新标签 → 提取之后的所有提交 → 按类型分类 → 输出未发布变更。\n\n### 场景 3：版本发布说明\n**用户**：「生成 v1.5.0 的发布说明」\n**处理**：提取 v1.4.0 到 v1.5.0 之间的提交 → 按类型分类 → 生成发布说明。\n\n### 场景 4：提交统计\n**用户**：「统计一下这个月的提交情况」\n**处理**：指定日期范围 → 统计类型分布和作者贡献 → 输出统计报告。\n\n### 场景 5：非规范提交\n**用户**：「我的提交信息不规范，能生成吗」\n**处理**：尝试解析 Conventional Commits 格式 → 无法解析的归入「其他变更」→ 建议遵循规范。\n\n## 八、注意事项\n\n1. **Git 仓库**：必须在 Git 仓库中运行，或通过 --repo 指定仓库路径。\n2. **提交规范**：最佳效果需要遵循 Conventional Commits 规范；不规范的提交会归入「其他变更」。\n3. **版本标签**：按版本分组需要 Git 标签（如 v1.0.0）；没有标签时按日期或全部输出。\n4. **日期格式**：使用 YYYY-MM-DD 格式，如 2024-01-15。\n5. **作者信息**：使用 Git 配置的 user.email 作为作者标识。\n6. **大仓库**：提交数量很多时可能需要较长时间，建议指定版本或日期范围。\n7. **合并提交**：默认包含合并提交，可通过 --no-merges 排除。\n8. **编码**：提交信息默认使用 UTF-8 编码，其他编码可能出现乱码。\n9. **不修改文件**：本技能只读取 Git 历史，不会修改任何文件或提交。\n10. **输出检查**：生成的变更日志请检查后再发布，确保不包含敏感信息。\n\n## 九、文件结构\n\n```\nchangelog-generator/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── changelog-template.md              # CHANGELOG 模板与规范参考\n├── scripts/\n│   └── generate_changelog.py              # 变更日志生成脚本\n└── examples/\n    ├── sample-git-log.txt                 # 示例 Git 日志输出\n    └── sample-changelog.md                # 示例生成的变更日志\n```\n\n## 十、使用示例\n\n### 示例 1：快速生成\n**用户**：「在当前项目生成变更日志」\n**AI**：运行 `--repo .` → 输出完整变更日志。\n\n### 示例 2：未发布变更\n**用户**：「看看上次发布后改了什么」\n**AI**：运行 `--unreleased` → 输出最新标签之后的所有变更。\n\n### 示例 3：发布说明\n**用户**：「生成 v2.0.0 的发布说明」\n**AI**：运行 `--from v1.0.0 --to v2.0.0 --version 2.0.0` → 输出版本发布说明。\n", "files": {"SKILL.md": "---\nname: changelog-generator\ndescription: '变更日志生成助手。解析 Git 仓库提交历史，按 Conventional Commits 规范自动分类（feat/fix/docs/style/refactor/perf/test/chore/build/ci），支持按版本标签或日期范围分组，生成符合 Keep a Changelog 规范的 Markdown 变更日志，提供提交类型统计、作者贡献统计、未发布变更管理，可指定输出格式和版本号。适用于项目发布前生成 CHANGELOG.md、版本发布说明、提交历史回顾等场景。'\n---\n\n# 变更日志生成助手\n\n## 一、技能定位\n\n本技能用于**从 Git 提交历史自动生成变更日志**。核心价值：\n\n- 解析 Git log，提取提交信息、日期、作者\n- 按 Conventional Commits 规范自动分类\n- 按版本标签或日期范围分组\n- 生成 Keep a Changelog 格式的 Markdown 文档\n- 提交统计（按类型、按作者）\n- 未发布变更管理\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「生成变更日志」「写 CHANGELOG」「生成本次更新说明」\n2. 用户说「整理一下这个版本的提交」「版本发布说明」\n3. 用户说「看看最近改了什么」「提交历史回顾」\n4. 用户说「统计一下提交记录」「谁提交得多」\n5. 用户说「生成 release notes」「发布公告」\n6. 用户说「按类型分类提交」「feat 和 fix 分开列」\n\n## 三、Conventional Commits 规范\n\n提交信息格式：`<type>(<scope>): <subject>`\n\n### 3.1 支持的类型\n\n| 类型 | 说明 | 变更日志分类 |\n|---|---|---|\n| `feat` | 新功能 | ✨ 新增功能 |\n| `fix` | Bug 修复 | 🐛 问题修复 |\n| `docs` | 文档变更 | 📝 文档更新 |\n| `style` | 代码格式（不影响功能） | 💄 样式调整 |\n| `refactor` | 重构（既不修复 bug 也不增加功能） | ♻️ 代码重构 |\n| `perf` | 性能优化 | ⚡ 性能提升 |\n| `test` | 测试相关 | ✅ 测试更新 |\n| `build` | 构建系统或外部依赖 | 📦 构建变更 |\n| `ci` | CI 配置 | 🔧 CI/CD |\n| `chore` | 杂项（不修改 src 或测试） | 🔨 杂项 |\n| `revert` | 回退提交 | ⏪️ 回退 |\n\n### 3.2 示例\n\n```\nfeat(auth): 添加用户登录功能\nfix(api): 修复用户列表分页错误\ndocs(readme): 更新安装说明\nrefactor(user): 重构用户服务层\nperf(query): 优化数据库查询性能\n```\n\n## 四、Keep a Changelog 格式\n\n```markdown\n# 更新日志\n\n所有显著变更都记录在此文件中。\n\n格式基于 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，\n本项目遵循 [语义化版本](https://semver.org/lang/zh-CN/)。\n\n## [未发布]\n\n### ✨ 新增功能\n- 用户登录功能\n\n## [1.0.0] - 2024-01-15\n\n### ✨ 新增功能\n- 用户注册\n- 密码重置\n\n### 🐛 问题修复\n- 修复登录页面样式问题\n```\n\n## 五、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 生成变更日志 / 提交统计 / 发布说明\n- Git 仓库路径（默认当前目录）\n- 版本范围（标签/日期/全部）\n- 输出格式（Markdown/JSON/纯文本）\n\n### 步骤 2：运行脚本\n\n使用 `scripts/generate_changelog.py`：\n\n```bash\n# 生成完整变更日志（所有标签 + 未发布）\npython3 scripts/generate_changelog.py --repo /path/to/repo\n\n# 只生成未发布的变更\npython3 scripts/generate_changelog.py --repo /path/to/repo --unreleased\n\n# 指定版本范围\npython3 scripts/generate_changelog.py --repo /path/to/repo --from v1.0.0 --to v2.0.0\n\n# 指定日期范围\npython3 scripts/generate_changelog.py --repo /path/to/repo --since 2024-01-01 --until 2024-06-30\n\n# 指定版本号（用于未发布变更的标题）\npython3 scripts/generate_changelog.py --repo /path/to/repo --version 1.2.0\n\n# 显示提交统计\npython3 scripts/generate_changelog.py --repo /path/to/repo --stats\n\n# JSON 格式输出\npython3 scripts/generate_changelog.py --repo /path/to/repo --format json\n\n# 保存到文件\npython3 scripts/generate_changelog.py --repo /path/to/repo --output CHANGELOG.md\n```\n\n### 步骤 3：解读结果\n\n- **变更日志**：按版本分组，每个版本内按类型分类\n- **提交统计**：各类型提交数量、作者贡献排名\n- **未发布变更**：最新标签之后的所有提交\n\n### 步骤 4：安全提示\n\n1. 本技能只读取 Git 历史，不修改任何文件\n2. 提交信息可能包含敏感信息，生成的日志请检查后再发布\n3. 建议遵循 Conventional Commits 规范以获得最佳分类效果\n\n## 六、输出规范\n\n### 6.1 完整变更日志\n\n```\n# 更新日志\n\n## [未发布]\n\n### ✨ 新增功能\n- feat(auth): 添加 OAuth 登录 (@alice)\n- feat(api): 新增用户批量导出接口 (@bob)\n\n### 🐛 问题修复\n- fix(ui): 修复移动端导航栏显示问题 (@alice)\n\n## [1.2.0] - 2024-06-15\n\n### ✨ 新增功能\n- feat(search): 添加全文搜索功能\n\n### ⚡ 性能提升\n- perf(db): 优化查询性能 40%\n\n### 🐛 问题修复\n- fix(auth): 修复 token 过期处理\n```\n\n### 6.2 提交统计\n\n```\n📊 提交统计\n━━━━━━━━━━━━━━━━━━━━━━━━\n总提交数：156\n\n按类型分布：\n  ✨ feat:        45 (28.8%) ████████████\n  🐛 fix:         38 (24.4%) ██████████\n  📝 docs:        22 (14.1%) ██████\n  ♻️ refactor:    18 (11.5%) █████\n  ⚡ perf:        12 ( 7.7%) ███\n  ✅ test:        10 ( 6.4%) ██\n  🔧 ci:           6 ( 3.8%) █\n  🔨 chore:        5 ( 3.2%) █\n\n作者贡献：\n  1. alice@example.com    68 (43.6%)\n  2. bob@example.com      52 (33.3%)\n  3. charlie@example.com  36 (23.1%)\n```\n\n## 七、常见场景处理\n\n### 场景 1：发布前生成 CHANGELOG\n**用户**：「准备发布 v2.0，帮我生成变更日志」\n**处理**：扫描 Git 历史 → 按标签分组 → 生成 Keep a Changelog 格式 → 保存为 CHANGELOG.md。\n\n### 场景 2：只看未发布的变更\n**用户**：「看看上次发布后改了什么」\n**处理**：找到最新标签 → 提取之后的所有提交 → 按类型分类 → 输出未发布变更。\n\n### 场景 3：版本发布说明\n**用户**：「生成 v1.5.0 的发布说明」\n**处理**：提取 v1.4.0 到 v1.5.0 之间的提交 → 按类型分类 → 生成发布说明。\n\n### 场景 4：提交统计\n**用户**：「统计一下这个月的提交情况」\n**处理**：指定日期范围 → 统计类型分布和作者贡献 → 输出统计报告。\n\n### 场景 5：非规范提交\n**用户**：「我的提交信息不规范，能生成吗」\n**处理**：尝试解析 Conventional Commits 格式 → 无法解析的归入「其他变更」→ 建议遵循规范。\n\n## 八、注意事项\n\n1. **Git 仓库**：必须在 Git 仓库中运行，或通过 --repo 指定仓库路径。\n2. **提交规范**：最佳效果需要遵循 Conventional Commits 规范；不规范的提交会归入「其他变更」。\n3. **版本标签**：按版本分组需要 Git 标签（如 v1.0.0）；没有标签时按日期或全部输出。\n4. **日期格式**：使用 YYYY-MM-DD 格式，如 2024-01-15。\n5. **作者信息**：使用 Git 配置的 user.email 作为作者标识。\n6. **大仓库**：提交数量很多时可能需要较长时间，建议指定版本或日期范围。\n7. **合并提交**：默认包含合并提交，可通过 --no-merges 排除。\n8. **编码**：提交信息默认使用 UTF-8 编码，其他编码可能出现乱码。\n9. **不修改文件**：本技能只读取 Git 历史，不会修改任何文件或提交。\n10. **输出检查**：生成的变更日志请检查后再发布，确保不包含敏感信息。\n\n## 九、文件结构\n\n```\nchangelog-generator/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── changelog-template.md              # CHANGELOG 模板与规范参考\n├── scripts/\n│   └── generate_changelog.py              # 变更日志生成脚本\n└── examples/\n    ├── sample-git-log.txt                 # 示例 Git 日志输出\n    └── sample-changelog.md                # 示例生成的变更日志\n```\n\n## 十、使用示例\n\n### 示例 1：快速生成\n**用户**：「在当前项目生成变更日志」\n**AI**：运行 `--repo .` → 输出完整变更日志。\n\n### 示例 2：未发布变更\n**用户**：「看看上次发布后改了什么」\n**AI**：运行 `--unreleased` → 输出最新标签之后的所有变更。\n\n### 示例 3：发布说明\n**用户**：「生成 v2.0.0 的发布说明」\n**AI**：运行 `--from v1.0.0 --to v2.0.0 --version 2.0.0` → 输出版本发布说明。\n", "templates/changelog-template.md": "# CHANGELOG 模板与规范参考\n\n> 遵循 Keep a Changelog 规范和 Conventional Commits 规范。\n\n---\n\n## 一、CHANGELOG.md 模板\n\n```markdown\n# 更新日志\n\n所有显著变更都记录在此文件中。\n\n格式基于 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，\n本项目遵循 [语义化版本](https://semver.org/lang/zh-CN/)。\n\n## [未发布]\n\n### ✨ 新增功能\n- 待添加的新功能\n\n## [1.0.0] - 2024-01-15\n\n### ✨ 新增功能\n- 用户注册功能\n- 密码重置功能\n\n### 🐛 问题修复\n- 修复登录页面样式问题\n\n### ⚡ 性能提升\n- 优化首页加载速度\n\n### 📝 文档更新\n- 更新 API 文档\n```\n\n---\n\n## 二、Conventional Commits 提交规范\n\n### 2.1 格式\n\n```\n<type>(<scope>): <subject>\n\n<body>\n\n<footer>\n```\n\n### 2.2 类型说明\n\n| 类型 | 说明 | 示例 |\n|---|---|---|\n| `feat` | 新功能 | `feat(auth): 添加登录功能` |\n| `fix` | Bug 修复 | `fix(api): 修复分页错误` |\n| `docs` | 文档变更 | `docs(readme): 更新安装说明` |\n| `style` | 代码格式（不影响功能） | `style(format): 统一缩进` |\n| `refactor` | 重构 | `refactor(user): 重构用户服务` |\n| `perf` | 性能优化 | `perf(query): 优化查询性能` |\n| `test` | 测试相关 | `test(auth): 添加登录测试` |\n| `build` | 构建系统/依赖 | `build(webpack): 优化构建配置` |\n| `ci` | CI 配置 | `ci(pipeline): 添加自动部署` |\n| `chore` | 杂项 | `chore(deps): 更新依赖` |\n| `revert` | 回退 | `revert: 回退上次提交` |\n\n### 2.3 不兼容变更\n\n在类型后加 `!` 标记：\n\n```\nfeat(api)!: 重构 API 接口（不兼容变更）\n```\n\n或在 body 中添加 `BREAKING CHANGE:`：\n\n```\nfeat(api): 重构 API 接口\n\nBREAKING CHANGE: /api/v1 接口已移除，请使用 /api/v2\n```\n\n### 2.4 范围（scope）\n\n可选，用于说明影响的模块：\n\n```\nfeat(auth): 添加 OAuth 登录\nfix(user/profile): 修复头像上传\n```\n\n---\n\n## 三、语义化版本（SemVer）\n\n```\nMAJOR.MINOR.PATCH\n  │     │     │\n  │     │     └─ PATCH：Bug 修复（向后兼容）\n  │     └─────── MINOR：新增功能（向后兼容）\n  └───────────── MAJOR：不兼容变更\n```\n\n- **MAJOR**：有不兼容的 API 变更\n- **MINOR**：向后兼容的新增功能\n- **PATCH**：向后兼容的 Bug 修复\n\n预发布版本：`1.0.0-alpha.1`、`1.0.0-beta.2`、`1.0.0-rc.1`\n\n---\n\n## 四、版本发布流程\n\n1. 确保所有功能已合并到主分支\n2. 更新版本号（package.json / pom.xml 等）\n3. 运行 `python3 generate_changelog.py --unreleased --version 1.2.0` 生成变更日志\n4. 将变更日志追加到 CHANGELOG.md\n5. 提交：`git commit -m \"chore(release): 发布 v1.2.0\"`\n6. 打标签：`git tag -a v1.2.0 -m \"Release v1.2.0\"`\n7. 推送：`git push && git push --tags`\n\n---\n\n## 五、常见问题\n\n**Q: 提交信息不规范怎么办？**\nA: 不规范的提交会归入「其他变更」分类。建议团队统一使用 Conventional Commits 规范。\n\n**Q: 如何只看某个版本的变更？**\nA: 使用 `--from v1.0.0 --to v2.0.0` 指定版本范围。\n\n**Q: 如何看上次发布后的所有变更？**\nA: 使用 `--unreleased` 参数，会自动获取最新标签之后的所有提交。\n\n---\n\n*规范参考由 changelog-generator 技能提供*\n", "scripts/generate_changelog.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\n变更日志生成脚本\n\n功能：\n- 解析 Git 提交历史\n- 按 Conventional Commits 规范分类（feat/fix/docs/style/refactor/perf/test/chore/build/ci/revert）\n- 按版本标签或日期范围分组\n- 生成 Keep a Changelog 格式的 Markdown 变更日志\n- 提交统计（按类型、按作者）\n- 未发布变更管理\n- JSON 格式输出\n\n用法：\n  python3 generate_changelog.py --repo /path/to/repo\n  python3 generate_changelog.py --repo /path/to/repo --unreleased\n  python3 generate_changelog.py --repo /path/to/repo --from v1.0.0 --to v2.0.0\n  python3 generate_changelog.py --repo /path/to/repo --since 2024-01-01 --until 2024-06-30\n  python3 generate_changelog.py --repo /path/to/repo --version 1.2.0\n  python3 generate_changelog.py --repo /path/to/repo --stats\n  python3 generate_changelog.py --repo /path/to/repo --format json\n  python3 generate_changelog.py --repo /path/to/repo --output CHANGELOG.md\n  python3 generate_changelog.py --log-file sample-git-log.txt\n\"\"\"\n\nimport argparse\nimport json\nimport os\nimport re\nimport subprocess\nimport sys\nfrom collections import defaultdict\nfrom datetime import datetime\nfrom typing import Dict, List, Optional, Tuple\n\n\n# ============================================================\n# Conventional Commits 类型定义\n# ============================================================\n\nCOMMIT_TYPES = {\n    \"feat\":     {\"emoji\": \"✨\", \"label\": \"新增功能\", \"section\": \"✨ 新增功能\"},\n    \"fix\":      {\"emoji\": \"🐛\", \"label\": \"问题修复\", \"section\": \"🐛 问题修复\"},\n    \"docs\":     {\"emoji\": \"📝\", \"label\": \"文档更新\", \"section\": \"📝 文档更新\"},\n    \"style\":    {\"emoji\": \"💄\", \"label\": \"样式调整\", \"section\": \"💄 样式调整\"},\n    \"refactor\": {\"emoji\": \"♻️\", \"label\": \"代码重构\", \"section\": \"♻️ 代码重构\"},\n    \"perf\":     {\"emoji\": \"⚡\", \"label\": \"性能提升\", \"section\": \"⚡ 性能提升\"},\n    \"test\":     {\"emoji\": \"✅\", \"label\": \"测试更新\", \"section\": \"✅ 测试更新\"},\n    \"build\":    {\"emoji\": \"📦\", \"label\": \"构建变更\", \"section\": \"📦 构建变更\"},\n    \"ci\":       {\"emoji\": \"🔧\", \"label\": \"CI/CD\", \"section\": \"🔧 CI/CD\"},\n    \"chore\":    {\"emoji\": \"🔨\", \"label\": \"杂项\", \"section\": \"🔨 杂项\"},\n    \"revert\":   {\"emoji\": \"⏪️\", \"label\": \"回退\", \"section\": \"⏪️ 回退\"},\n    \"other\":    {\"emoji\": \"📌\", \"label\": \"其他变更\", \"section\": \"📌 其他变更\"},\n}\n\n# 变更日志中显示的类型顺序\nDISPLAY_ORDER = [\"feat\", \"fix\", \"perf\", \"refactor\", \"docs\", \"test\",\n                  \"style\", \"build\", \"ci\", \"chore\", \"revert\", \"other\"]\n\n\n# ============================================================\n# 提交数据结构\n# ============================================================\n\nclass Commit:\n    \"\"\"Git 提交\"\"\"\n    def __init__(self, hash_str: str, date: str, author: str, subject: str, body: str = \"\"):\n        self.hash = hash_str\n        self.date = date  # YYYY-MM-DD\n        self.author = author\n        self.subject = subject\n        self.body = body\n        self.type = \"other\"\n        self.scope = \"\"\n        self.description = subject\n        self.breaking = False\n        self._parse_conventional()\n\n    def _parse_conventional(self):\n        \"\"\"解析 Conventional Commits 格式\"\"\"\n        # 匹配 type(scope)!: subject 或 type!: subject 或 type: subject\n        pattern = r'^(\\w+)(?:\\(([^)]+)\\))?(!)?:\\s*(.+)$'\n        match = re.match(pattern, self.subject)\n        if match:\n            commit_type = match.group(1).lower()\n            if commit_type in COMMIT_TYPES:\n                self.type = commit_type\n            else:\n                self.type = \"other\"\n            self.scope = match.group(2) or \"\"\n            self.breaking = match.group(3) == \"!\"\n            self.description = match.group(4).strip()\n        else:\n            self.type = \"other\"\n            self.description = self.subject\n\n        # 检查 body 中的 BREAKING CHANGE\n        if \"BREAKING CHANGE\" in self.body or \"BREAKING-CHANGE\" in self.body:\n            self.breaking = True\n\n    def short_hash(self) -> str:\n        return self.hash[:7]\n\n    def to_dict(self) -> dict:\n        return {\n            \"hash\": self.hash,\n            \"short_hash\": self.short_hash(),\n            \"date\": self.date,\n            \"author\": self.author,\n            \"type\": self.type,\n            \"scope\": self.scope,\n            \"description\": self.description,\n            \"subject\": self.subject,\n            \"breaking\": self.breaking,\n        }\n\n\n# ============================================================\n# Git 操作\n# ============================================================\n\ndef run_git(repo: str, args: List[str]) -> str:\n    \"\"\"运行 Git 命令\"\"\"\n    cmd = [\"git\", \"-C\", repo] + args\n    try:\n        result = subprocess.run(cmd, capture_output=True, text=True,\n                                encoding=\"utf-8\", errors=\"replace\", timeout=30)\n        return result.stdout\n    except (subprocess.TimeoutExpired, OSError) as e:\n        print(f\"Git 命令执行失败: {' '.join(cmd)}\\n{e}\", file=sys.stderr)\n        return \"\"\n\n\ndef get_tags(repo: str) -> List[Tuple[str, str]]:\n    \"\"\"获取所有标签及对应日期，按日期排序（旧→新）\"\"\"\n    output = run_git(repo, [\"tag\", \"--sort=creatordate\", \"--format=%(creatordate:short)|%(refname:short)\"])\n    tags = []\n    for line in output.strip().split(\"\\n\"):\n        if \"|\" in line:\n            date, name = line.split(\"|\", 1)\n            tags.append((name.strip(), date.strip()))\n    return tags\n\n\ndef get_commits(repo: str, revision_range: str = \"\",\n                 since: str = \"\", until: str = \"\",\n                 no_merges: bool = False) -> List[Commit]:\n    \"\"\"获取提交列表\"\"\"\n    args = [\"log\", \"--pretty=format:%H|%ad|%ae|%s%n%b---END---\",\n            \"--date=format:%Y-%m-%d\"]\n\n    if no_merges:\n        args.append(\"--no-merges\")\n\n    if since:\n        args.append(f\"--since={since}\")\n    if until:\n        args.append(f\"--until={until}\")\n\n    if revision_range:\n        args.append(revision_range)\n\n    output = run_git(repo, args)\n    commits = []\n\n    # 解析输出\n    blocks = output.split(\"---END---\")\n    for block in blocks:\n        block = block.strip()\n        if not block:\n            continue\n\n        lines = block.split(\"\\n\")\n        if not lines:\n            continue\n\n        # 第一行包含 hash|date|author|subject\n        first_line = lines[0]\n        parts = first_line.split(\"|\", 3)\n        if len(parts) < 4:\n            continue\n\n        hash_str, date, author, subject = parts[0], parts[1], parts[2], parts[3]\n        body = \"\\n\".join(lines[1:]).strip() if len(lines) > 1 else \"\"\n\n        commit = Commit(hash_str, date, author, subject, body)\n        commits.append(commit)\n\n    return commits\n\n\ndef get_latest_tag(repo: str) -> Optional[str]:\n    \"\"\"获取最新标签\"\"\"\n    tags = get_tags(repo)\n    return tags[-1][0] if tags else None\n\n\n# ============================================================\n# 变更日志生成\n# ============================================================\n\ndef group_commits_by_type(commits: List[Commit]) -> Dict[str, List[Commit]]:\n    \"\"\"按类型分组提交\"\"\"\n    groups = defaultdict(list)\n    for commit in commits:\n        groups[commit.type].append(commit)\n    return dict(groups)\n\n\ndef format_commit_line(commit: Commit, show_author: bool = True) -> str:\n    \"\"\"格式化单行提交信息\"\"\"\n    scope_str = f\"({commit.scope})\" if commit.scope else \"\"\n    breaking_str = \" **[BREAKING]**\" if commit.breaking else \"\"\n    author_str = f\" (@{commit.author.split('@')[0]})\" if show_author else \"\"\n    return f\"- {commit.type}{scope_str}: {commit.description}{breaking_str}{author_str}\"\n\n\ndef generate_version_section(version: str, date: str,\n                             commits: List[Commit]) -> str:\n    \"\"\"生成单个版本的变更日志段落\"\"\"\n    lines = []\n\n    if version == \"未发布\":\n        lines.append(f\"## [未发布]\")\n    else:\n        lines.append(f\"## [{version}] - {date}\")\n\n    lines.append(\"\")\n\n    groups = group_commits_by_type(commits)\n\n    # 按显示顺序输出\n    has_content = False\n    for commit_type in DISPLAY_ORDER:\n        if commit_type not in groups:\n            continue\n        type_commits = groups[commit_type]\n        if not type_commits:\n            continue\n\n        info = COMMIT_TYPES[commit_type]\n        lines.append(f\"### {info['section']}\")\n        lines.append(\"\")\n        for commit in type_commits:\n            lines.append(format_commit_line(commit))\n        lines.append(\"\")\n        has_content = True\n\n    if not has_content:\n        lines.append(\"_此版本无显著变更_\")\n        lines.append(\"\")\n\n    return \"\\n\".join(lines)\n\n\ndef generate_changelog(repo: str, unreleased_only: bool = False,\n                       from_tag: str = \"\", to_tag: str = \"\",\n                       since: str = \"\", until: str = \"\",\n                       version: str = \"\", show_stats: bool = False) -> str:\n    \"\"\"生成完整变更日志\"\"\"\n    lines = []\n    lines.append(\"# 更新日志\")\n    lines.append(\"\")\n    lines.append(\"所有显著变更都记录在此文件中。\")\n    lines.append(\"\")\n    lines.append(\"格式基于 [Keep a Changelog](https://keepachangelog.com/zh-CN/1.1.0/)，\")\n    lines.append(\"本项目遵循 [语义化版本](https://semver.org/lang/zh-CN/)。\")\n    lines.append(\"\")\n\n    all_commits = []\n\n    # 模式 1：指定版本范围\n    if from_tag or to_tag:\n        revision = f\"{from_tag}..{to_tag}\" if from_tag and to_tag else (to_tag or from_tag)\n        commits = get_commits(repo, revision_range=revision)\n        version_name = version or to_tag or \"指定范围\"\n        version_date = commits[0].date if commits else datetime.now().strftime(\"%Y-%m-%d\")\n        lines.append(generate_version_section(version_name, version_date, commits))\n        all_commits = commits\n\n    # 模式 2：只显示未发布\n    elif unreleased_only:\n        latest = get_latest_tag(repo)\n        revision = f\"{latest}..HEAD\" if latest else \"HEAD\"\n        commits = get_commits(repo, revision_range=revision)\n        version_name = version or \"未发布\"\n        lines.append(generate_version_section(version_name, \"\", commits))\n        all_commits = commits\n\n    # 模式 3：日期范围\n    elif since or until:\n        commits = get_commits(repo, since=since, until=until)\n        version_name = version or f\"{since or '开始'} ~ {until or '至今'}\"\n        version_date = until or datetime.now().strftime(\"%Y-%m-%d\")\n        lines.append(generate_version_section(version_name, version_date, commits))\n        all_commits = commits\n\n    # 模式 4：完整变更日志（按标签分组）\n    else:\n        tags = get_tags(repo)\n\n        # 未发布部分\n        latest_tag = tags[-1][0] if tags else None\n        if latest_tag:\n            unreleased = get_commits(repo, revision_range=f\"{latest_tag}..HEAD\")\n        else:\n            unreleased = get_commits(repo)\n\n        if unreleased:\n            lines.append(generate_version_section(\"未发布\", \"\", unreleased))\n            all_commits.extend(unreleased)\n\n        # 按标签分组\n        for i in range(len(tags) - 1, -1, -1):\n            tag_name, tag_date = tags[i]\n            if i > 0:\n                prev_tag = tags[i - 1][0]\n                revision = f\"{prev_tag}..{tag_name}\"\n            else:\n                revision = tag_name\n\n            commits = get_commits(repo, revision_range=revision)\n            if commits:\n                lines.append(generate_version_section(tag_name, tag_date, commits))\n                all_commits.extend(commits)\n\n    # 统计信息\n    if show_stats and all_commits:\n        lines.append(\"---\")\n        lines.append(\"\")\n        lines.append(generate_stats(all_commits))\n\n    return \"\\n\".join(lines)\n\n\ndef generate_stats(commits: List[Commit]) -> str:\n    \"\"\"生成提交统计\"\"\"\n    lines = []\n    lines.append(\"📊 提交统计\")\n    lines.append(\"━\" * 40)\n    lines.append(f\"总提交数：{len(commits)}\")\n    lines.append(\"\")\n\n    # 按类型统计\n    type_counts = defaultdict(int)\n    for commit in commits:\n        type_counts[commit.type] += 1\n\n    lines.append(\"按类型分布：\")\n    max_count = max(type_counts.values()) if type_counts else 1\n    for commit_type in DISPLAY_ORDER:\n        if commit_type not in type_counts:\n            continue\n        count = type_counts[commit_type]\n        pct = count / len(commits) * 100\n        bar_len = int(count / max_count * 20)\n        bar = \"█\" * bar_len + \"░\" * (20 - bar_len)\n        info = COMMIT_TYPES[commit_type]\n        lines.append(f\"  {info['emoji']} {commit_type:10s}: {count:4d}  {pct:5.1f}%  {bar}\")\n\n    # 按作者统计\n    author_counts = defaultdict(int)\n    for commit in commits:\n        author_counts[commit.author] += 1\n\n    lines.append(\"\")\n    lines.append(\"作者贡献：\")\n    sorted_authors = sorted(author_counts.items(), key=lambda x: x[1], reverse=True)\n    for i, (author, count) in enumerate(sorted_authors[:10], 1):\n        pct = count / len(commits) * 100\n        lines.append(f\"  {i:2d}. {author:30s} {count:4d}  {pct:5.1f}%\")\n\n    lines.append(\"\")\n    lines.append(\"━\" * 40)\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 从日志文件解析（用于测试/示例）\n# ============================================================\n\ndef parse_log_file(filepath: str) -> List[Commit]:\n    \"\"\"从 git log 文本文件解析提交（格式：hash|date|author|subject）\"\"\"\n    commits = []\n    try:\n        with open(filepath, 'r', encoding='utf-8') as f:\n            for line in f:\n                line = line.strip()\n                if not line or line.startswith(\"#\"):\n                    continue\n                parts = line.split(\"|\", 3)\n                if len(parts) >= 4:\n                    commit = Commit(parts[0], parts[1], parts[2], parts[3])\n                    commits.append(commit)\n    except (OSError, IOError) as e:\n        print(f\"读取日志文件失败: {e}\", file=sys.stderr)\n    return commits\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"变更日志生成工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--repo\", \"-r\", default=\".\", help=\"Git 仓库路径（默认当前目录）\")\n    parser.add_argument(\"--unreleased\", action=\"store_true\", help=\"只显示未发布的变更\")\n    parser.add_argument(\"--from\", dest=\"from_tag\", default=\"\", help=\"起始版本标签\")\n    parser.add_argument(\"--to\", dest=\"to_tag\", default=\"\", help=\"结束版本标签\")\n    parser.add_argument(\"--since\", default=\"\", help=\"起始日期（YYYY-MM-DD）\")\n    parser.add_argument(\"--until\", default=\"\", help=\"结束日期（YYYY-MM-DD）\")\n    parser.add_argument(\"--version\", \"-v\", default=\"\", help=\"版本号（用于标题）\")\n    parser.add_argument(\"--stats\", action=\"store_true\", help=\"显示提交统计\")\n    parser.add_argument(\"--no-merges\", action=\"store_true\", help=\"排除合并提交\")\n    parser.add_argument(\"--format\", \"-f\", choices=[\"markdown\", \"json\"],\n                        default=\"markdown\", help=\"输出格式\")\n    parser.add_argument(\"--output\", \"-o\", metavar=\"FILE\", help=\"输出到文件\")\n    parser.add_argument(\"--log-file\", default=\"\", help=\"从日志文件读取（用于测试）\")\n    args = parser.parse_args()\n\n    # 从日志文件读取（测试模式）\n    if args.log_file:\n        commits = parse_log_file(args.log_file)\n        if args.format == \"json\":\n            result = {\n                \"total\": len(commits),\n                \"commits\": [c.to_dict() for c in commits],\n            }\n            print(json.dumps(result, ensure_ascii=False, indent=2))\n        else:\n            print(generate_version_section(args.version or \"示例版本\",\n                                            commits[0].date if commits else \"\", commits))\n            if args.stats:\n                print(\"\")\n                print(generate_stats(commits))\n        return\n\n    # 检查是否为 Git 仓库\n    repo = os.path.abspath(args.repo)\n    if not os.path.isdir(os.path.join(repo, \".git\")):\n        print(f\"错误：{repo} 不是 Git 仓库（未找到 .git 目录）\", file=sys.stderr)\n        sys.exit(1)\n\n    # JSON 格式\n    if args.format == \"json\":\n        if args.unreleased:\n            latest = get_latest_tag(repo)\n            revision = f\"{latest}..HEAD\" if latest else \"HEAD\"\n            commits = get_commits(repo, revision_range=revision, no_merges=args.no_merges)\n        elif args.from_tag or args.to_tag:\n            revision = f\"{args.from_tag}..{args.to_tag}\" if args.from_tag and args.to_tag else (args.to_tag or args.from_tag)\n            commits = get_commits(repo, revision_range=revision, no_merges=args.no_merges)\n        elif args.since or args.until:\n            commits = get_commits(repo, since=args.since, until=args.until, no_merges=args.no_merges)\n        else:\n            commits = get_commits(repo, no_merges=args.no_merges)\n\n        result = {\n            \"total\": len(commits),\n            \"commits\": [c.to_dict() for c in commits],\n        }\n        print(json.dumps(result, ensure_ascii=False, indent=2))\n        return\n\n    # Markdown 格式\n    output = generate_changelog(\n        repo,\n        unreleased_only=args.unreleased,\n        from_tag=args.from_tag,\n        to_tag=args.to_tag,\n        since=args.since,\n        until=args.until,\n        version=args.version,\n        show_stats=args.stats,\n    )\n\n    print(output)\n\n    if args.output:\n        with open(args.output, 'w', encoding='utf-8') as f:\n            f.write(output + \"\\n\")\n        print(f\"\\n已保存到：{args.output}\", file=sys.stderr)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-git-log.txt": "# 格式：hash|date|author|subject\na1b2c3d|2024-06-15|alice@example.com|feat(auth): 添加 OAuth 登录功能\nb2c3d4e|2024-06-14|bob@example.com|fix(api): 修复用户列表分页错误\nc3d4e5f|2024-06-13|alice@example.com|docs(readme): 更新安装说明\nd4e5f6a|2024-06-12|charlie@example.com|refactor(user): 重构用户服务层\ne5f6a7b|2024-06-11|alice@example.com|perf(query): 优化数据库查询性能\nf6a7b8c|2024-06-10|bob@example.com|test(auth): 添加登录单元测试\na7b8c9d|2024-06-09|alice@example.com|feat(search): 添加全文搜索功能\nb8c9d0e|2024-06-08|charlie@example.com|fix(ui): 修复移动端导航栏显示问题\nc9d0e1f|2024-06-07|alice@example.com|style(format): 统一代码格式\nd0e1f2a|2024-06-06|bob@example.com|chore(deps): 更新依赖版本\ne1f2a3b|2024-06-05|alice@example.com|feat(api)!: 重构 API 接口（不兼容变更）\nf2a3b4c|2024-06-04|charlie@example.com|ci(pipeline): 添加自动化部署\na3b4c5d|2024-06-03|bob@example.com|build(webpack): 优化构建配置\nb4c5d6e|2024-06-02|alice@example.com|这是一个不规范的提交信息\n", "examples/sample-changelog.md": "## [1.2.0] - 2024-06-15\n\n### ✨ 新增功能\n\n- feat(auth): 添加 OAuth 登录功能 (@alice)\n- feat(search): 添加全文搜索功能 (@alice)\n- feat(api): 重构 API 接口（不兼容变更） **[BREAKING]** (@alice)\n\n### 🐛 问题修复\n\n- fix(api): 修复用户列表分页错误 (@bob)\n- fix(ui): 修复移动端导航栏显示问题 (@charlie)\n\n### ⚡ 性能提升\n\n- perf(query): 优化数据库查询性能 (@alice)\n\n### ♻️ 代码重构\n\n- refactor(user): 重构用户服务层 (@charlie)\n\n### 📝 文档更新\n\n- docs(readme): 更新安装说明 (@alice)\n\n### ✅ 测试更新\n\n- test(auth): 添加登录单元测试 (@bob)\n\n### 💄 样式调整\n\n- style(format): 统一代码格式 (@alice)\n\n### 📦 构建变更\n\n- build(webpack): 优化构建配置 (@bob)\n\n### 🔧 CI/CD\n\n- ci(pipeline): 添加自动化部署 (@charlie)\n\n### 🔨 杂项\n\n- chore(deps): 更新依赖版本 (@bob)\n\n### 📌 其他变更\n\n- other: 这是一个不规范的提交信息 (@alice)\n\n\n📊 提交统计\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n总提交数：14\n\n按类型分布：\n  ✨ feat      :    3   21.4%  ████████████████████\n  🐛 fix       :    2   14.3%  █████████████░░░░░░░\n  ⚡ perf      :    1    7.1%  ██████░░░░░░░░░░░░░░\n  ♻️ refactor  :    1    7.1%  ██████░░░░░░░░░░░░░░\n  📝 docs      :    1    7.1%  ██████░░░░░░░░░░░░░░\n  ✅ test      :    1    7.1%  ██████░░░░░░░░░░░░░░\n  💄 style     :    1    7.1%  ██████░░░░░░░░░░░░░░\n  📦 build     :    1    7.1%  ██████░░░░░░░░░░░░░░\n  🔧 ci        :    1    7.1%  ██████░░░░░░░░░░░░░░\n  🔨 chore     :    1    7.1%  ██████░░░░░░░░░░░░░░\n  📌 other     :    1    7.1%  ██████░░░░░░░░░░░░░░\n\n作者贡献：\n   1. alice@example.com                 7   50.0%\n   2. bob@example.com                   4   28.6%\n   3. charlie@example.com               3   21.4%\n\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n"}, "file_count": 5, "script_lines": 491}, {"name": "color-palette-generator", "title": "color-palette-generator", "description": "配色方案生成助手。输入一个基础颜色（HEX/RGB/HSL），自动生成多种配色方案（互补色、类比色、三角色、四角色、分裂互补、单色渐变），支持颜色格式互转（HEX/RGB/HSL/HSV），计算 WCAG 对比度比率并检查无障碍合规性（AA/AAA 标准），生成 CSS 变量和 Tailwind 配置，终端可视化预览配色效果。适用于网页设计、UI 设计、品牌配色、数据可视化配色等场景。", "category": "其他", "icon": "📦", "color": "#6b7280", "skill_md": "---\nname: color-palette-generator\ndescription: '配色方案生成助手。输入一个基础颜色（HEX/RGB/HSL），自动生成多种配色方案（互补色、类比色、三角色、四角色、分裂互补、单色渐变），支持颜色格式互转（HEX/RGB/HSL/HSV），计算 WCAG 对比度比率并检查无障碍合规性（AA/AAA 标准），生成 CSS 变量和 Tailwind 配置，终端可视化预览配色效果。适用于网页设计、UI 设计、品牌配色、数据可视化配色等场景。'\n---\n\n# 配色方案生成助手\n\n## 一、技能定位\n\n本技能用于**生成和分析配色方案**。核心价值：\n\n- 从一个基础颜色自动生成 6 种专业配色方案\n- 颜色格式互转（HEX / RGB / HSL / HSV）\n- WCAG 对比度计算与无障碍合规检查\n- 生成 CSS 变量和 Tailwind 配置\n- 终端可视化预览配色效果\n- 保存和加载配色方案\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我生成一个配色方案」「选个配色」\n2. 用户说「这个颜色的互补色是什么」「生成类比色」\n3. 用户说「检查一下这两个颜色的对比度」「是否符合无障碍标准」\n4. 用户说「把这个颜色转成 RGB/HSL」「颜色格式转换」\n5. 用户说「生成 CSS 变量」「生成 Tailwind 配色配置」\n6. 用户说「帮我设计一个网站配色」「品牌配色方案」\n7. 用户说「数据可视化用什么颜色好」「图表配色」\n\n## 三、支持的配色方案\n\n### 3.1 互补色（Complementary）\n基础色与色轮上对面 180° 的颜色组合，对比强烈，适合需要突出重点的场景。\n\n### 3.2 类比色（Analogous）\n色轮上相邻的 3-5 个颜色，和谐统一，适合背景和大面积使用。\n\n### 3.3 三角色（Triadic）\n色轮上等距 120° 的三个颜色，平衡且富有活力，适合需要多种主色的设计。\n\n### 3.4 四角色（Tetradic / Square）\n色轮上等距 90° 的四个颜色，丰富多变，适合复杂的多色设计。\n\n### 3.5 分裂互补（Split Complementary）\n基础色 + 互补色两侧的颜色，比互补色更柔和，对比仍然明显。\n\n### 3.6 单色渐变（Monochromatic）\n同一色相的不同明度和饱和度变化，简约高级，适合极简风格。\n\n## 四、颜色格式\n\n| 格式 | 示例 | 说明 |\n|---|---|---|\n| HEX | `#3498DB` | 十六进制，网页最常用 |\n| RGB | `rgb(52, 152, 219)` | 红绿蓝，0-255 |\n| HSL | `hsl(204, 70%, 53%)` | 色相/饱和度/明度 |\n| HSV | `hsv(204, 76%, 86%)` | 色相/饱和度/明度（不同算法） |\n\n## 五、WCAG 无障碍标准\n\n### 5.1 对比度等级\n\n| 等级 | 普通文本 | 大文本（18pt+ 或 14pt+粗体） |\n|---|---|---|\n| AA（最低标准） | ≥ 4.5:1 | ≥ 3:1 |\n| AAA（最高标准） | ≥ 7:1 | ≥ 4.5:1 |\n\n### 5.2 对比度计算公式\n\n```\nL = 0.2126 × R + 0.7152 × G + 0.0722 × B\n（其中 R/G/B 需先做 gamma 校正）\n对比度 = (L1 + 0.05) / (L2 + 0.05)\n（L1 为较亮颜色的相对亮度，L2 为较暗颜色）\n```\n\n## 六、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 生成配色方案 / 颜色格式转换 / 对比度检查 / 生成配置文件\n- 基础颜色（HEX/RGB/HSL 格式）\n- 配色方案类型（默认全部生成）\n- 输出格式\n\n### 步骤 2：运行脚本\n\n使用 `scripts/generate_palette.py`：\n\n```bash\n# 生成所有配色方案（输入 HEX 颜色）\npython3 scripts/generate_palette.py --color \"#3498DB\"\n\n# 输入 RGB 颜色\npython3 scripts/generate_palette.py --color \"rgb(52,152,219)\"\n\n# 输入 HSL 颜色\npython3 scripts/generate_palette.py --color \"hsl(204,70%,53%)\"\n\n# 只生成特定方案\npython3 scripts/generate_palette.py --color \"#3498DB\" --scheme complementary,triadic\n\n# 颜色格式转换\npython3 scripts/generate_palette.py --color \"#3498DB\" --convert\n\n# 对比度检查（前景色 vs 背景色）\npython3 scripts/generate_palette.py --color \"#FFFFFF\" --contrast \"#3498DB\"\n\n# 生成 CSS 变量\npython3 scripts/generate_palette.py --color \"#3498DB\" --format css\n\n# 生成 Tailwind 配置\npython3 scripts/generate_palette.py --color \"#3498DB\" --format tailwind\n\n# 保存配色方案到文件\npython3 scripts/generate_palette.py --color \"#3498DB\" --save my-palette.json\n\n# 从文件加载配色方案\npython3 scripts/generate_palette.py --load my-palette.json\n\n# JSON 格式输出\npython3 scripts/generate_palette.py --color \"#3498DB\" --format json\n```\n\n### 步骤 3：解读结果\n\n- **配色方案**：每种方案包含多个颜色，每个颜色显示 HEX/RGB/HSL\n- **终端预览**：用 ANSI 颜色块直观展示配色效果\n- **对比度报告**：显示对比度比率和 AA/AAA 合规性\n- **CSS/Tailwind**：可直接复制使用的配置代码\n\n### 步骤 4：安全提示\n\n1. 本技能只做颜色计算和生成，不涉及网络请求\n2. 配色方案仅供参考，最终效果需在实际设计中验证\n3. 无障碍检查基于 WCAG 2.1 标准，实际可读性还受字体、大小等因素影响\n\n## 七、输出规范\n\n### 7.1 配色方案列表\n\n```\n🎨 配色方案生成\n━━━━━━━━━━━━━━━━━━━━━━━━\n基础颜色：#3498DB (RGB: 52,152,219 | HSL: 204°,70%,53%)\n\n【互补色 Complementary】\n  #3498DB  ████████  主色\n  #DB7734  ████████  互补色\n\n【类比色 Analogous】\n  #34DBBF  ████████  类比色1\n  #3498DB  ████████  主色\n  #3451DB  ████████  类比色2\n\n【三角色 Triadic】\n  #3498DB  ████████  主色\n  #98DB34  ████████  三角色1\n  #DB3498  ████████  三角色2\n...\n```\n\n### 7.2 对比度报告\n\n```\n📊 对比度检查\n━━━━━━━━━━━━━━━━━━━━━━━━\n前景色：#FFFFFF (白色)\n背景色：#3498DB (蓝色)\n\n对比度比率：4.34 : 1\n\n无障碍合规性：\n  ✅ AA 大文本：通过 (≥ 3:1)\n  ❌ AA 普通文本：未通过 (需要 ≥ 4.5:1)\n  ❌ AAA 大文本：未通过 (需要 ≥ 4.5:1)\n  ❌ AAA 普通文本：未通过 (需要 ≥ 7:1)\n\n建议：\n  - 用于大文本或图形元素\n  - 如需用于普通文本，建议加深背景色至 #2980B9 (对比度 5.12:1)\n```\n\n### 7.3 CSS 变量输出\n\n```css\n:root {\n  /* 主色 */\n  --color-primary: #3498DB;\n  --color-primary-light: #5DADE2;\n  --color-primary-dark: #2980B9;\n\n  /* 互补色 */\n  --color-complementary: #DB7734;\n\n  /* 三角色 */\n  --color-triadic-1: #98DB34;\n  --color-triadic-2: #DB3498;\n\n  /* 中性色 */\n  --color-bg: #F8F9FA;\n  --color-text: #2C3E50;\n  --color-muted: #7F8C8D;\n}\n```\n\n### 7.4 Tailwind 配置输出\n\n```javascript\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n        primary: {\n          50: '#EBF5FB',\n          100: '#D6EAF8',\n          200: '#AED6F1',\n          300: '#85C1E9',\n          400: '#5DADE2',\n          500: '#3498DB',\n          600: '#2E86C1',\n          700: '#2874A6',\n          800: '#21618C',\n          900: '#1B4F72',\n        },\n      },\n    },\n  },\n}\n```\n\n## 八、常见场景处理\n\n### 场景 1：网站主色配色\n**用户**：「我选了 #3498DB 作为网站主色，帮我生成完整配色」\n**处理**：生成所有配色方案 → 生成 CSS 变量 → 检查主色与白色/黑色的对比度 → 给出使用建议。\n\n### 场景 2：无障碍检查\n**用户**：「这个文字颜色在这个背景上能看清吗」\n**处理**：计算对比度比率 → 检查 AA/AAA 合规性 → 如不通过，给出调整建议（加深/变亮）。\n\n### 场景 3：颜色格式转换\n**用户**：「把 #FF5733 转成 RGB 和 HSL」\n**处理**：解析 HEX → 转换为 RGB → 转换为 HSL/HSV → 输出所有格式。\n\n### 场景 4：数据可视化配色\n**用户**：「做图表需要 5 个区分度高的颜色」\n**处理**：生成三角色/四角色方案 → 检查颜色间的区分度 → 给出 5 色方案。\n\n### 场景 5：品牌配色\n**用户**：「帮我设计一个科技感的品牌配色」\n**处理**：以蓝色/紫色为基础 → 生成互补/类比方案 → 生成完整 CSS 配置 → 终端预览。\n\n## 九、注意事项\n\n1. **颜色输入格式**：支持 `#RRGGBB`、`#RGB`、`rgb(r,g,b)`、`hsl(h,s%,l%)` 四种格式。\n2. **终端预览**：颜色块预览需要终端支持 24-bit 真彩色，不支持时会退化为 HEX 文本显示。\n3. **对比度计算**：基于 WCAG 2.1 相对亮度公式，结果精确到小数点后两位。
