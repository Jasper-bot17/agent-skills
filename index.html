  for t in args.task:\n            tasks.extend(parse_text_tasks(t))\n\n    # 从文件读取\n    if args.file:\n        fmt = args.format\n        if fmt == \"auto\":\n            fmt = \"csv\" if args.file.endswith(\".csv\") else \"txt\"\n\n        if fmt == \"csv\":\n            tasks = parse_csv_tasks(args.file)\n        else:\n            with open(args.file, 'r', encoding='utf-8') as f:\n                tasks = parse_text_tasks(f.read())\n\n    # 从 stdin 读取\n    if not tasks and not sys.stdin.isatty():\n        text = sys.stdin.read()\n        if text.strip():\n            tasks = parse_text_tasks(text)\n\n    if not tasks:\n        print(\"错误：未提供任务。请使用 --file、--task 或 stdin 传入任务\", file=sys.stderr)\n        print(\"用法：\", file=sys.stderr)\n        print(\"  python3 prioritize_tasks.py --file tasks.txt\", file=sys.stderr)\n        print(\"  python3 prioritize_tasks.py --task '完成报告' --task '回邮件'\", file=sys.stderr)\n        sys.exit(1)\n\n    # 输出\n    if args.output == \"json\":\n        today = date.today()\n        result = []\n        for t in tasks:\n            t.score = calculate_score(t, today)\n            t.quadrant = assign_quadrant(t)\n            result.append({\n                \"name\": t.name,\n                \"importance\": t.importance,\n                \"urgency\": t.urgency,\n                \"duration_min\": t.duration_min,\n                \"deadline\": t.deadline,\n                \"blocks_others\": t.blocks_others,\n                \"score\": t.score,\n                \"quadrant\": t.quadrant,\n            })\n        print(json.dumps(result, ensure_ascii=False, indent=2))\n    else:\n        print(format_report(tasks, args.work_hours))\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-tasks.txt": "完成季度报告（3小时，周五截止，重要）\n回复客户邮件（30分钟，今天内，客户在等）\n修复登录bug（2小时，紧急，阻塞所有用户）\n准备下周三的演示（2小时）\n写周报（1小时，本周五）\n和团队同步进度（30分钟，本周）\n报销上个月的发票（30分钟）\n回复三条同事消息（15分钟）\n整理桌面文件夹（有空再做）\n看行业文章（1小时，有空）\n\n", "examples/sample-prioritization-report.md": "# 示例：任务优先级分析报告\n\n> 本示例展示使用 `prioritize_tasks.py` 对 `sample-tasks.txt` 进行分析的输出。\n> 示例为一位职场人士的 10 项待办事项。\n\n---\n\n## 输入任务\n\n```\n完成季度报告（3小时，周五截止，重要）\n回复客户邮件（30分钟，今天内，客户在等）\n修复登录bug（2小时，紧急，阻塞所有用户）\n准备下周三的演示（2小时）\n写周报（1小时，本周五）\n和团队同步进度（30分钟，本周）\n报销上个月的发票（30分钟）\n回复三条同事消息（15分钟）\n整理桌面文件夹（有空再做）\n看行业文章（1小时，有空）\n```\n\n---\n\n## 分析结果\n\n### 🟥 Q1 立即做（紧急且重要）\n\n| 任务 | 耗时 | 理由 |\n|---|---|---|\n| 回复客户邮件 | 30分钟 | 客户在等，今天内必须回复 |\n\n### 🟧 Q2 计划做（重要不紧急）\n\n| 任务 | 耗时 | 理由 |\n|---|---|---|\n| 完成季度报告 | 3小时 | 周五截止，核心工作 |\n| 修复登录bug | 2小时 | 阻塞所有用户，需尽快处理 |\n\n### 🟨 Q3 委托/快做（紧急不重要）\n\n| 任务 | 耗时 | 建议 |\n|---|---|---|\n| 回复三条同事消息 | 15分钟 | 批量快速处理 |\n| 和团队同步进度 | 30分钟 | 可委托给团队助理 |\n\n### 🟩 Q4 删除/延后（不紧急不重要）\n\n| 任务 | 耗时 | 建议 |\n|---|---|---|\n| 写周报 | 1小时 | 周五再做，不急 |\n| 准备演示 | 2小时 | 下周三才用，安排到周初 |\n| 报销发票 | 30分钟 | 攒着一起报 |\n| 整理桌面文件夹 | 30分钟 | 有空再说 |\n| 看行业文章 | 1小时 | 通勤时看 |\n\n---\n\n## 今日执行建议（6小时工作时间）\n\n| 时间段 | 任务 | 耗时 |\n|---|---|---|\n| 09:00-09:30 | 回复客户邮件 | 30分钟 |\n| 09:30-12:30 | 完成季度报告（专注） | 3小时 |\n| 14:00-16:00 | 修复登录bug | 2小时 |\n| 16:00-16:30 | 快速回复同事消息 + 休息 | 30分钟 |\n\n---\n\n## 关键建议\n\n1. **先做 Q1**：回复客户邮件只需 30 分钟，完成后消除心理负担\n2. **Q2 深度工作**：季度报告需要整块时间，安排在上午精力最好时\n3. **Q3 批量处理**：邮件和消息集中在一个时段回复，不要随时打断\n4. **Q4 果断延后**：整理文件夹、看文章等可以推到周末或通勤时间\n5. **预留缓冲**：最后 30 分钟处理突发事项\n\n---\n\n*报告由 task-prioritizer 技能生成*\n"}, "file_count": 5, "script_lines": 467}, {"name": "text-readability-analyzer", "title": "text-readability-analyzer", "description": "文本可读性分析助手。对中文/英文文本进行多维度可读性分析：统计字数/句数/段落数、平均句长、长句检测、阅读时间估算、高频词与重复用词、段落结构评估、被动句与填充词检测、可读性评分，并针对问题给出具体修改建议。适用于文章润色、公文检查、报告自查、文案优化、写作教学、学术论文初稿检查等场景。", "category": "内容创作", "icon": "📖", "color": "#ec4899", "skill_md": "---\nname: text-readability-analyzer\ndescription: '文本可读性分析助手。对中文/英文文本进行多维度可读性分析：统计字数/句数/段落数、平均句长、长句检测、阅读时间估算、高频词与重复用词、段落结构评估、被动句与填充词检测、可读性评分，并针对问题给出具体修改建议。适用于文章润色、公文检查、报告自查、文案优化、写作教学、学术论文初稿检查等场景。'\n---\n\n# 文本可读性分析助手\n\n## 一、技能定位\n\n本技能用于**量化分析文本质量并给出可操作的改进建议**。核心价值：\n\n- 多维度量化指标：字数、句长、段长、阅读时间、词汇复杂度\n- 自动定位问题：过长句子、重复用词、填充词、被动句、冗长表达\n- 可读性评分：综合评分 + 分项雷达式评估\n- 具体改进建议：不仅指出问题，还给出修改方向和示例\n- 中英文双支持：中文按字/词分析，英文按词/音节分析\n- 适配多种文体：公文、学术、公众号、技术文档、商业文案\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户提供一段文本，说「帮我看看这段文字写得怎么样」「分析一下这段文字」\n2. 用户说「帮我润色一下这段文字」「这段文字有什么问题」\n3. 用户说「帮我检查一下文章可读性」「这段文字好懂吗」\n4. 用户说「我的文章太长了，帮我看看哪里可以精简」\n5. 用户说「帮我分析一下这篇公众号文章的写作质量」\n6. 用户说「这段文字有多少字？读多久？」\n7. 用户说「帮我看看有没有重复用词」\n8. 用户写完报告/邮件/文章后说「帮我检查一下」\n\n## 三、分析维度体系\n\n### 3.1 基础统计\n\n| 指标 | 说明 | 健康参考值（中文） |\n|---|---|---|\n| 总字符数 | 去除空白后的字符数 | — |\n| 总字数 | 中文按字、英文按词 | — |\n| 句子数 | 按句号/问号/叹号/分号分割 | — |\n| 段落数 | 按换行分割 | — |\n| 平均句长 | 总字数 / 句子数 | 15-30 字为佳 |\n| 平均段长 | 总字数 / 段落数 | 100-300 字为佳 |\n| 阅读时间 | 总字数 / 阅读速度 | 中文约 300 字/分钟 |\n\n### 3.2 句子质量\n\n| 指标 | 说明 | 预警阈值 |\n|---|---|---|\n| 长句数量 | 超过 40 字的句子 | 占比 > 20% |\n| 超长句数量 | 超过 60 字的句子 | 占比 > 5% |\n| 短句数量 | 少于 8 字的句子 | 过多（>30%）也需注意 |\n| 句长变异系数 | 句长标准差/均值，反映节奏变化 | < 0.5 为节奏单一 |\n\n### 3.3 词汇与表达\n\n| 指标 | 说明 | 关注点 |\n|---|---|---|\n| 高频词 Top 20 | 出现频率最高的词 | 检查是否过度重复 |\n| 重复词组 | 连续出现或高频重复的短语 | 避免啰嗦 |\n| 填充词检测 | 「的」「了」「是」「进行」「相关」等 | 过多影响简洁度 |\n| 被动句检测 | 「被」「受」「为…所」「由…所」 | 过多显得生硬 |\n| 冗长表达 | 「由于…的原因」「在…方面」「对于…来说」 | 可精简 |\n\n### 3.4 可读性评分（0-100）\n\n综合以下因素计算：\n\n- 句子长度合理性（30%）：平均句长是否在合理范围\n- 句子变化性（15%）：句长是否有节奏变化\n- 段落结构合理性（15%）：段落是否过长或过碎\n- 词汇丰富度（20%）：是否有过度重复的词\n- 表达简洁度（20%）：填充词和冗长表达的比例\n\n| 分数区间 | 等级 | 含义 |\n|---|---|---|\n| 90-100 | A | 优秀，表达清晰流畅 |\n| 75-89 | B | 良好，少量可改进 |\n| 60-74 | C | 一般，有明显改进空间 |\n| 40-59 | D | 较差，需重点修改 |\n| 0-39 | E | 很差，建议重写部分内容 |\n\n## 四、操作步骤\n\n### 步骤 1：接收文本并确认分析需求\n\n1. 读取用户提供的文本（直接粘贴、文件路径、或对话中的段落）\n2. 确认文体类型（如用户未说明，根据内容自动判断）：\n   - 公文/正式报告\n   - 学术论文\n   - 公众号/新媒体文章\n   - 技术文档\n   - 商业文案/营销\n   - 日常沟通/邮件\n3. 确认是否需要：\n   - 完整分析报告\n   - 仅问题列表\n   - 润色建议（直接给出修改后的文本）\n\n### 步骤 2：运行辅助分析脚本\n\n使用 `scripts/analyze_readability.py` 进行量化分析：\n\n```bash\n# 分析文本文件（默认文本输出）\npython3 scripts/analyze_readability.py --input article.txt\n\n# 分析并指定文体\npython3 scripts/analyze_readability.py --input article.txt --style academic\n\n# JSON 格式输出（便于程序处理）\npython3 scripts/analyze_readability.py --input article.txt --format json\n\n# 从 stdin 读取\necho \"这是一段测试文本。\" | python3 scripts/analyze_readability.py\n\n# 仅输出问题列表\npython3 scripts/analyze_readability.py --input article.txt --issues-only\n```\n\n脚本输出内容：\n- 基础统计（字数、句数、段数、阅读时间）\n- 句子质量分析（长句列表、句长分布）\n- 高频词与重复词组\n- 填充词/被动句/冗长表达检测\n- 可读性评分\n- 改进建议列表\n\n### 步骤 3：AI 深度分析\n\n基于脚本输出的量化数据，进行深度语义分析：\n\n#### 3.1 结构分析\n- 开头是否吸引读者？\n- 段落之间是否有逻辑过渡？\n- 结尾是否收束有力？\n- 是否有偏离主题的内容？\n\n#### 3.2 表达分析\n- 哪些句子可以更简洁？（给出修改前后对比）\n- 哪些词汇可以替换为更精确的表达？\n- 是否有歧义或模糊表述？\n- 语气是否适合目标读者？\n\n#### 3.3 可读性分析\n- 对非专业读者是否友好？\n- 专业术语是否需要解释？\n- 信息密度是否合适？（太密则难读，太疏则浪费时间）\n\n### 步骤 4：生成分析报告\n\n按照以下结构输出报告：\n\n```\n📊 文本可读性分析报告\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n文体：公众号文章\n字数：2,345 字 | 句子：89 句 | 段落：15 段\n预计阅读时间：约 8 分钟\n\n📈 可读性评分：78 / 100（B级：良好）\n\n📋 分项评分：\n  句子长度合理性  ███████░░░  75/100\n  句子变化性      ████████░░  82/100\n  段落结构        ███████░░░  70/100\n  词汇丰富度      ████████░░  85/100\n  表达简洁度      ██████░░░░  65/100\n\n⚠ 发现的问题：\n  1. 5个长句超过40字（最长72字），建议拆分\n  2. \"进行\"出现12次，可替换为更具体的动词\n  3. 第3段过长（380字），建议拆分\n  4. 3处被动句，可改为主动语态\n  5. \"在...方面\"出现4次，可精简\n\n💡 改进建议：\n  ...具体修改建议...\n```\n\n### 步骤 5：提供润色示例（如用户需要）\n\n针对发现的问题，给出具体的修改示例：\n\n**原句**（68字，过长）：\n> 我们在进行项目管理的过程中，需要对各个部门之间的沟通协调机制进行系统性的优化和完善，以便能够在确保项目按时交付的同时，也能够有效地控制项目的整体成本和风险。\n\n**修改后**（35字，更简洁）：\n> 项目管理中需优化跨部门沟通机制，以确保按时交付、控制成本与风险。\n\n## 五、文体适配标准\n\n### 5.1 公文/正式报告\n- 平均句长可偏长（25-40字），但需逻辑清晰\n- 专业术语可保留，但需首次出现时解释\n- 填充词「进行」「相关」「开展」可适当使用（正式语体需要）\n- 评分基准：严谨 > 简洁\n\n### 5.2 学术论文\n- 句子可长，但需结构严谨\n- 被动句和客观表达可接受\n- 专业术语必须准确\n- 评分基准：准确 > 简洁\n\n### 5.3 公众号/新媒体文章\n- 平均句长 15-25 字，短句为主\n- 段落不超过 150 字，多分段\n- 少用专业术语，多用口语化表达\n- 评分基准：易读 > 严谨\n\n### 5.4 技术文档\n- 句子简洁明确，每句一个信息点\n- 多用列表、步骤、代码块\n- 避免歧义，精确描述\n- 评分基准：准确 > 文采\n\n### 5.5 商业文案/营销\n- 短句为主，节奏感强\n- 情绪化和感染力优先\n- 少用填充词和被动句\n- 评分基准：有力 > 完整\n\n## 六、常见场景处理\n\n### 场景 1：公众号文章润色\n**用户**：粘贴一段公众号文章，说「帮我看看这篇文章写得怎么样」\n**处理**：完整分析 → 评分 → 定位长句和长段落 → 给出拆分建议 → 提供修改示例。\n\n### 场景 2：报告/公文检查\n**用户**：粘贴一段工作报告，说「帮我检查一下这段公文」\n**处理**：按公文标准分析 → 重点检查措辞是否正式、逻辑是否清晰 → 给出修改建议。\n\n### 场景 3：邮件优化\n**用户**：「帮我看看这封邮件写得行不行」\n**处理**：分析语气是否得体 → 是否过长 → 关键信息是否突出 → 给出精简建议。\n\n### 场景 4：写作教学\n**用户**：「帮我分析一下这段学生作文的问题」\n**处理**：全面分析 → 标注具体问题位置 → 给出教学式建议 → 提供改写示例。\n\n### 场景 5：快速字数/时间查询\n**用户**：「这段文字多少字？读多久？」\n**处理**：仅输出基础统计（字数、句数、阅读时间），不做完整分析。\n\n## 七、输出规范\n\n### 7.1 完整分析报告\n\n```\n📊 文本可读性分析报告\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n【基本信息】\n- 文体：自动判断 / 用户指定\n- 总字符数：X,XXX\n- 总字数：X,XXX\n- 句子数：XX\n- 段落数：XX\n- 预计阅读时间：约 X 分钟\n\n【可读性评分】XX / 100（X级）\n\n【分项评分】\n- 句子长度合理性：XX/100\n- 句子变化性：XX/100\n- 段落结构：XX/100\n- 词汇丰富度：XX/100\n- 表达简洁度：XX/100\n\n【句子分析】\n- 平均句长：XX 字\n- 长句（>40字）：X 句，占比 XX%\n- 超长句（>60字）：X 句，占比 XX%\n- 句长分布：短（<15字）XX% | 中（15-30字）XX% | 长（>30字）XX%\n\n【词汇分析】\n- 高频词 Top 10：...\n- 重复词组：...\n- 填充词统计：\"的\" XX次 | \"了\" XX次 | \"进行\" XX次 ...\n- 被动句：X 处\n- 冗长表达：X 处\n\n【段落分析】\n- 平均段长：XX 字\n- 最长段落：XXX 字（第X段）\n- 最短段落：XX 字\n\n【发现的问题】\n1. ...\n2. ...\n3. ...\n\n【改进建议】\n1. ...\n2. ...\n```\n\n### 7.2 问题列表模式\n\n```\n⚠ 文本问题列表（共 X 项）\n\n【长句】（X 句）\n- 第X句（XX字）：...\"前30字\"...\n  → 建议：拆分为2-3句\n\n【重复用词】\n- \"进行\" 出现 XX 次：...\n  → 建议：替换为具体动词（开展/实施/执行/做）\n\n【冗长表达】\n- 第X句：\"由于...的原因\"\n  → 建议：精简为\"由于...\"\n\n【被动句】（X 处）\n- 第X句：\"被...所...\"\n  → 建议：改为主动语态\n```\n\n## 八、注意事项\n\n1. **量化是辅助，语义是核心**：脚本提供数据，AI 做语义判断。不要仅凭数字下结论。\n2. **文体适配**：不同文体对句长、正式度的要求不同，评分标准需按文体调整。\n3. **不改变原意**：润色建议应保持作者原意，仅改善表达，不改变观点。\n4. **中文分词局限**：脚本基于规则分词，可能不够精确。AI 需结合上下文修正。\n5. **不替代编辑**：本技能提供参考建议，最终修改由用户决定。\n6. **长文本处理**：超过 5000 字的文本，分段分析，避免遗漏。\n7. **隐私保护**：分析过程中不存储文本，仅在当前会话中处理。\n8. **客观中立**：评分基于通用可读性标准，不做主观审美判断。\n9. **中英混排**：对中英混排文本，中文按字、英文按词分别统计后合并。\n10. **不过度修改**：问题应聚焦真正影响可读性的地方，不为了改而改。\n\n## 九、文件结构\n\n```\ntext-readability-analyzer/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── analysis-report-template.md       # 分析报告模板\n├── scripts/\n│   └── analyze_readability.py            # 可读性分析脚本\n└── examples/\n    ├── sample-article.txt                # 示例：待分析的文章\n    └── sample-analysis-report.md         # 示例：分析报告\n```\n\n## 十、使用示例\n\n### 示例 1：分析一段文章\n**用户**：粘贴一段文章，说「帮我看看这段文字写得怎么样」\n**AI**：运行脚本分析 → 生成评分和问题列表 → 给出具体修改建议 → 提供修改前后对比。\n\n### 示例 2：检查公文\n**用户**：粘贴一段工作报告，说「帮我检查一下这段公文」\n**AI**：按公文标准分析 → 检查措辞、逻辑、正式度 → 给出修改建议。\n\n### 示例 3：仅查字数和阅读时间\n**用户**：「这段文字多少字？读多久？」\n**AI**：输出基础统计，不做完整分析。\n\n### 示例 4：对比修改前后\n**用户**：提供原文和修改稿，说「帮我对比一下修改前后的可读性变化」\n**AI**：分别分析两版 → 对比评分变化 → 指出改进点和可能的不足。\n", "files": {"SKILL.md": "---\nname: text-readability-analyzer\ndescription: '文本可读性分析助手。对中文/英文文本进行多维度可读性分析：统计字数/句数/段落数、平均句长、长句检测、阅读时间估算、高频词与重复用词、段落结构评估、被动句与填充词检测、可读性评分，并针对问题给出具体修改建议。适用于文章润色、公文检查、报告自查、文案优化、写作教学、学术论文初稿检查等场景。'\n---\n\n# 文本可读性分析助手\n\n## 一、技能定位\n\n本技能用于**量化分析文本质量并给出可操作的改进建议**。核心价值：\n\n- 多维度量化指标：字数、句长、段长、阅读时间、词汇复杂度\n- 自动定位问题：过长句子、重复用词、填充词、被动句、冗长表达\n- 可读性评分：综合评分 + 分项雷达式评估\n- 具体改进建议：不仅指出问题，还给出修改方向和示例\n- 中英文双支持：中文按字/词分析，英文按词/音节分析\n- 适配多种文体：公文、学术、公众号、技术文档、商业文案\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户提供一段文本，说「帮我看看这段文字写得怎么样」「分析一下这段文字」\n2. 用户说「帮我润色一下这段文字」「这段文字有什么问题」\n3. 用户说「帮我检查一下文章可读性」「这段文字好懂吗」\n4. 用户说「我的文章太长了，帮我看看哪里可以精简」\n5. 用户说「帮我分析一下这篇公众号文章的写作质量」\n6. 用户说「这段文字有多少字？读多久？」\n7. 用户说「帮我看看有没有重复用词」\n8. 用户写完报告/邮件/文章后说「帮我检查一下」\n\n## 三、分析维度体系\n\n### 3.1 基础统计\n\n| 指标 | 说明 | 健康参考值（中文） |\n|---|---|---|\n| 总字符数 | 去除空白后的字符数 | — |\n| 总字数 | 中文按字、英文按词 | — |\n| 句子数 | 按句号/问号/叹号/分号分割 | — |\n| 段落数 | 按换行分割 | — |\n| 平均句长 | 总字数 / 句子数 | 15-30 字为佳 |\n| 平均段长 | 总字数 / 段落数 | 100-300 字为佳 |\n| 阅读时间 | 总字数 / 阅读速度 | 中文约 300 字/分钟 |\n\n### 3.2 句子质量\n\n| 指标 | 说明 | 预警阈值 |\n|---|---|---|\n| 长句数量 | 超过 40 字的句子 | 占比 > 20% |\n| 超长句数量 | 超过 60 字的句子 | 占比 > 5% |\n| 短句数量 | 少于 8 字的句子 | 过多（>30%）也需注意 |\n| 句长变异系数 | 句长标准差/均值，反映节奏变化 | < 0.5 为节奏单一 |\n\n### 3.3 词汇与表达\n\n| 指标 | 说明 | 关注点 |\n|---|---|---|\n| 高频词 Top 20 | 出现频率最高的词 | 检查是否过度重复 |\n| 重复词组 | 连续出现或高频重复的短语 | 避免啰嗦 |\n| 填充词检测 | 「的」「了」「是」「进行」「相关」等 | 过多影响简洁度 |\n| 被动句检测 | 「被」「受」「为…所」「由…所」 | 过多显得生硬 |\n| 冗长表达 | 「由于…的原因」「在…方面」「对于…来说」 | 可精简 |\n\n### 3.4 可读性评分（0-100）\n\n综合以下因素计算：\n\n- 句子长度合理性（30%）：平均句长是否在合理范围\n- 句子变化性（15%）：句长是否有节奏变化\n- 段落结构合理性（15%）：段落是否过长或过碎\n- 词汇丰富度（20%）：是否有过度重复的词\n- 表达简洁度（20%）：填充词和冗长表达的比例\n\n| 分数区间 | 等级 | 含义 |\n|---|---|---|\n| 90-100 | A | 优秀，表达清晰流畅 |\n| 75-89 | B | 良好，少量可改进 |\n| 60-74 | C | 一般，有明显改进空间 |\n| 40-59 | D | 较差，需重点修改 |\n| 0-39 | E | 很差，建议重写部分内容 |\n\n## 四、操作步骤\n\n### 步骤 1：接收文本并确认分析需求\n\n1. 读取用户提供的文本（直接粘贴、文件路径、或对话中的段落）\n2. 确认文体类型（如用户未说明，根据内容自动判断）：\n   - 公文/正式报告\n   - 学术论文\n   - 公众号/新媒体文章\n   - 技术文档\n   - 商业文案/营销\n   - 日常沟通/邮件\n3. 确认是否需要：\n   - 完整分析报告\n   - 仅问题列表\n   - 润色建议（直接给出修改后的文本）\n\n### 步骤 2：运行辅助分析脚本\n\n使用 `scripts/analyze_readability.py` 进行量化分析：\n\n```bash\n# 分析文本文件（默认文本输出）\npython3 scripts/analyze_readability.py --input article.txt\n\n# 分析并指定文体\npython3 scripts/analyze_readability.py --input article.txt --style academic\n\n# JSON 格式输出（便于程序处理）\npython3 scripts/analyze_readability.py --input article.txt --format json\n\n# 从 stdin 读取\necho \"这是一段测试文本。\" | python3 scripts/analyze_readability.py\n\n# 仅输出问题列表\npython3 scripts/analyze_readability.py --input article.txt --issues-only\n```\n\n脚本输出内容：\n- 基础统计（字数、句数、段数、阅读时间）\n- 句子质量分析（长句列表、句长分布）\n- 高频词与重复词组\n- 填充词/被动句/冗长表达检测\n- 可读性评分\n- 改进建议列表\n\n### 步骤 3：AI 深度分析\n\n基于脚本输出的量化数据，进行深度语义分析：\n\n#### 3.1 结构分析\n- 开头是否吸引读者？\n- 段落之间是否有逻辑过渡？\n- 结尾是否收束有力？\n- 是否有偏离主题的内容？\n\n#### 3.2 表达分析\n- 哪些句子可以更简洁？（给出修改前后对比）\n- 哪些词汇可以替换为更精确的表达？\n- 是否有歧义或模糊表述？\n- 语气是否适合目标读者？\n\n#### 3.3 可读性分析\n- 对非专业读者是否友好？\n- 专业术语是否需要解释？\n- 信息密度是否合适？（太密则难读，太疏则浪费时间）\n\n### 步骤 4：生成分析报告\n\n按照以下结构输出报告：\n\n```\n📊 文本可读性分析报告\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n文体：公众号文章\n字数：2,345 字 | 句子：89 句 | 段落：15 段\n预计阅读时间：约 8 分钟\n\n📈 可读性评分：78 / 100（B级：良好）\n\n📋 分项评分：\n  句子长度合理性  ███████░░░  75/100\n  句子变化性      ████████░░  82/100\n  段落结构        ███████░░░  70/100\n  词汇丰富度      ████████░░  85/100\n  表达简洁度      ██████░░░░  65/100\n\n⚠ 发现的问题：\n  1. 5个长句超过40字（最长72字），建议拆分\n  2. \"进行\"出现12次，可替换为更具体的动词\n  3. 第3段过长（380字），建议拆分\n  4. 3处被动句，可改为主动语态\n  5. \"在...方面\"出现4次，可精简\n\n💡 改进建议：\n  ...具体修改建议...\n```\n\n### 步骤 5：提供润色示例（如用户需要）\n\n针对发现的问题，给出具体的修改示例：\n\n**原句**（68字，过长）：\n> 我们在进行项目管理的过程中，需要对各个部门之间的沟通协调机制进行系统性的优化和完善，以便能够在确保项目按时交付的同时，也能够有效地控制项目的整体成本和风险。\n\n**修改后**（35字，更简洁）：\n> 项目管理中需优化跨部门沟通机制，以确保按时交付、控制成本与风险。\n\n## 五、文体适配标准\n\n### 5.1 公文/正式报告\n- 平均句长可偏长（25-40字），但需逻辑清晰\n- 专业术语可保留，但需首次出现时解释\n- 填充词「进行」「相关」「开展」可适当使用（正式语体需要）\n- 评分基准：严谨 > 简洁\n\n### 5.2 学术论文\n- 句子可长，但需结构严谨\n- 被动句和客观表达可接受\n- 专业术语必须准确\n- 评分基准：准确 > 简洁\n\n### 5.3 公众号/新媒体文章\n- 平均句长 15-25 字，短句为主\n- 段落不超过 150 字，多分段\n- 少用专业术语，多用口语化表达\n- 评分基准：易读 > 严谨\n\n### 5.4 技术文档\n- 句子简洁明确，每句一个信息点\n- 多用列表、步骤、代码块\n- 避免歧义，精确描述\n- 评分基准：准确 > 文采\n\n### 5.5 商业文案/营销\n- 短句为主，节奏感强\n- 情绪化和感染力优先\n- 少用填充词和被动句\n- 评分基准：有力 > 完整\n\n## 六、常见场景处理\n\n### 场景 1：公众号文章润色\n**用户**：粘贴一段公众号文章，说「帮我看看这篇文章写得怎么样」\n**处理**：完整分析 → 评分 → 定位长句和长段落 → 给出拆分建议 → 提供修改示例。\n\n### 场景 2：报告/公文检查\n**用户**：粘贴一段工作报告，说「帮我检查一下这段公文」\n**处理**：按公文标准分析 → 重点检查措辞是否正式、逻辑是否清晰 → 给出修改建议。\n\n### 场景 3：邮件优化\n**用户**：「帮我看看这封邮件写得行不行」\n**处理**：分析语气是否得体 → 是否过长 → 关键信息是否突出 → 给出精简建议。\n\n### 场景 4：写作教学\n**用户**：「帮我分析一下这段学生作文的问题」\n**处理**：全面分析 → 标注具体问题位置 → 给出教学式建议 → 提供改写示例。\n\n### 场景 5：快速字数/时间查询\n**用户**：「这段文字多少字？读多久？」\n**处理**：仅输出基础统计（字数、句数、阅读时间），不做完整分析。\n\n## 七、输出规范\n\n### 7.1 完整分析报告\n\n```\n📊 文本可读性分析报告\n━━━━━━━━━━━━━━━━━━━━━━━━━━\n\n【基本信息】\n- 文体：自动判断 / 用户指定\n- 总字符数：X,XXX\n- 总字数：X,XXX\n- 句子数：XX\n- 段落数：XX\n- 预计阅读时间：约 X 分钟\n\n【可读性评分】XX / 100（X级）\n\n【分项评分】\n- 句子长度合理性：XX/100\n- 句子变化性：XX/100\n- 段落结构：XX/100\n- 词汇丰富度：XX/100\n- 表达简洁度：XX/100\n\n【句子分析】\n- 平均句长：XX 字\n- 长句（>40字）：X 句，占比 XX%\n- 超长句（>60字）：X 句，占比 XX%\n- 句长分布：短（<15字）XX% | 中（15-30字）XX% | 长（>30字）XX%\n\n【词汇分析】\n- 高频词 Top 10：...\n- 重复词组：...\n- 填充词统计：\"的\" XX次 | \"了\" XX次 | \"进行\" XX次 ...\n- 被动句：X 处\n- 冗长表达：X 处\n\n【段落分析】\n- 平均段长：XX 字\n- 最长段落：XXX 字（第X段）\n- 最短段落：XX 字\n\n【发现的问题】\n1. ...\n2. ...\n3. ...\n\n【改进建议】\n1. ...\n2. ...\n```\n\n### 7.2 问题列表模式\n\n```\n⚠ 文本问题列表（共 X 项）\n\n【长句】（X 句）\n- 第X句（XX字）：...\"前30字\"...\n  → 建议：拆分为2-3句\n\n【重复用词】\n- \"进行\" 出现 XX 次：...\n  → 建议：替换为具体动词（开展/实施/执行/做）\n\n【冗长表达】\n- 第X句：\"由于...的原因\"\n  → 建议：精简为\"由于...\"\n\n【被动句】（X 处）\n- 第X句：\"被...所...\"\n  → 建议：改为主动语态\n```\n\n## 八、注意事项\n\n1. **量化是辅助，语义是核心**：脚本提供数据，AI 做语义判断。不要仅凭数字下结论。\n2. **文体适配**：不同文体对句长、正式度的要求不同，评分标准需按文体调整。\n3. **不改变原意**：润色建议应保持作者原意，仅改善表达，不改变观点。\n4. **中文分词局限**：脚本基于规则分词，可能不够精确。AI 需结合上下文修正。\n5. **不替代编辑**：本技能提供参考建议，最终修改由用户决定。\n6. **长文本处理**：超过 5000 字的文本，分段分析，避免遗漏。\n7. **隐私保护**：分析过程中不存储文本，仅在当前会话中处理。\n8. **客观中立**：评分基于通用可读性标准，不做主观审美判断。\n9. **中英混排**：对中英混排文本，中文按字、英文按词分别统计后合并。\n10. **不过度修改**：问题应聚焦真正影响可读性的地方，不为了改而改。\n\n## 九、文件结构\n\n```\ntext-readability-analyzer/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── analysis-report-template.md       # 分析报告模板\n├── scripts/\n│   └── analyze_readability.py            # 可读性分析脚本\n└── examples/\n    ├── sample-article.txt                # 示例：待分析的文章\n    └── sample-analysis-report.md         # 示例：分析报告\n```\n\n## 十、使用示例\n\n### 示例 1：分析一段文章\n**用户**：粘贴一段文章，说「帮我看看这段文字写得怎么样」\n**AI**：运行脚本分析 → 生成评分和问题列表 → 给出具体修改建议 → 提供修改前后对比。\n\n### 示例 2：检查公文\n**用户**：粘贴一段工作报告，说「帮我检查一下这段公文」\n**AI**：按公文标准分析 → 检查措辞、逻辑、正式度 → 给出修改建议。\n\n### 示例 3：仅查字数和阅读时间\n**用户**：「这段文字多少字？读多久？」\n**AI**：输出基础统计，不做完整分析。\n\n### 示例 4：对比修改前后\n**用户**：提供原文和修改稿，说「帮我对比一下修改前后的可读性变化」\n**AI**：分别分析两版 → 对比评分变化 → 指出改进点和可能的不足。\n", "templates/analysis-report-template.md": "# 可读性分析报告模板\n\n> 本模板用于生成标准化的文本可读性分析报告。\n\n---\n\n## 📊 文本可读性分析报告\n\n**分析时间**：YYYY-MM-DD HH:MM:SS\n**文体判断**：自动判断 / 用户指定\n**文本长度**：X,XXX 字\n\n---\n\n### 一、基本信息\n\n| 指标 | 数值 |\n|---|---|\n| 总字符数 | X,XXX |\n| 总字数 | X,XXX |\n| 句子数 | XX |\n| 段落数 | XX |\n| 预计阅读时间 | 约 X 分钟 |\n\n---\n\n### 二、可读性评分\n\n**总分：XX / 100（X级）**\n\n| 评分项 | 得分 | 满分 | 评价 |\n|---|---|---|---|\n| 句子长度合理性 | XX | 30 | 优/良/中/差 |\n| 句子变化性 | XX | 15 | 优/良/中/差 |\n| 段落结构 | XX | 15 | 优/良/中/差 |\n| 词汇丰富度 | XX | 20 | 优/良/中/差 |\n| 表达简洁度 | XX | 20 | 优/良/中/差 |\n\n---\n\n### 三、句子分析\n\n- **平均句长**：XX 字\n- **句长标准差**：XX（变异系数 X.XX）\n- **长句（>40字）**：X 句（XX.X%）\n- **超长句（>60字）**：X 句（XX.X%）\n- **句长分布**：\n  - 短句（<15字）：XX%\n  - 中句（15-30字）：XX%\n  - 长句（>30字）：XX%\n\n**超长句示例**：\n1. 第X句（XX字）：...\"前30字\"...\n   - 建议：拆分为2-3个短句\n\n---\n\n### 四、段落分析\n\n| 指标 | 数值 |\n|---|---|\n| 段落数 | XX |\n| 平均段长 | XX 字 |\n| 最长段落 | XXX 字 |\n| 最短段落 | XX 字 |\n\n**过长段落**：\n- 第X段（XXX字）：...前60字...\n  - 建议：拆分为 X 个短段落\n\n---\n\n### 五、词汇分析\n\n**高频词 Top 10**：\n1. 词1：XX 次\n2. 词2：XX 次\n3. ...\n\n**填充词统计**：\n| 填充词 | 出现次数 | 说明 |\n|---|---|---|\n| 进行 | XX | 可替换为具体动词 |\n| 相关 | XX | 应具体化 |\n| ... | ... | ... |\n\n---\n\n### 六、问题与建议\n\n| # | 严重度 | 问题类型 | 问题描述 | 修改建议 |\n|---|---|---|---|---|\n| 1 | 🔴 高 | 超长句 | 有X个超长句（>60字） | 拆分为短句 |\n| 2 | 🟡 中 | 长句过多 | 长句占比XX% | 增加短句 |\n| 3 | 🟡 中 | 段落过长 | X个段落超300字 | 拆分段落 |\n| 4 | 🟡 中 | 填充词过多 | \"进行\"出现XX次 | 替换为具体动词 |\n| 5 | 🟢 低 | 被动句 | X处被动句 | 改主动语态 |\n\n---\n\n### 七、润色示例\n\n**原句**（XX字）：\n> 原文内容...\n\n**修改后**（XX字）：\n> 修改后内容...\n\n**说明**：修改了什么，为什么这样改更好。\n\n---\n\n*报告由 text-readability-analyzer 技能自动生成*\n", "scripts/analyze_readability.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\n文本可读性分析脚本\n\n对中文/英文文本进行多维度可读性分析：\n- 基础统计（字符数、字数、句数、段数、阅读时间）\n- 句子质量（平均句长、长句检测、句长分布）\n- 词汇分析（高频词、填充词、被动句、冗长表达）\n- 段落分析（平均段长、最长段落）\n- 可读性评分（0-100）\n\n用法：\n  python3 analyze_readability.py --input article.txt\n  python3 analyze_readability.py --input article.txt --format json\n  python3 analyze_readability.py --input article.txt --style academic\n  python3 analyze_readability.py --input article.txt --issues-only\n  cat article.txt | python3 analyze_readability.py\n\"\"\"\n\nimport argparse\nimport json\nimport re\nimport sys\nfrom collections import Counter\nfrom typing import Dict, List, Optional, Tuple\n\n\n# ============================================================\n# 词汇库\n# ============================================================\n\n# 中文填充词/弱义词（出现过多说明表达不够精炼）\nCHINESE_FILLER_WORDS = {\n    \"的\": \"结构助词，过多说明修饰语冗余\",\n    \"了\": \"动态助词，过多说明啰嗦\",\n    \"是\": \"判断动词，过多可精简\",\n    \"在\": \"介词，过多可精简\",\n    \"和\": \"连词，过多说明并列过多\",\n    \"进行\": \"虚化动词，可替换为具体动词\",\n    \"相关\": \"模糊词，应具体化\",\n    \"通过\": \"介词，过多可精简\",\n    \"对于\": \"介词，可精简\",\n    \"关于\": \"介词，可精简\",\n    \"以及\": \"连词，可替换为顿号\",\n    \"等等\": \"列举词，应具体\",\n    \"非常\": \"程度副词，可删或替换\",\n    \"十分\": \"程度副词，可删或替换\",\n    \"可以\": \"能愿动词，可精简\",\n    \"能够\": \"能愿动词，可精简\",\n    \"需要\": \"能愿动词，视情况精简\",\n    \"应该\": \"能愿动词，视情况精简\",\n    \"一些\": \"数量词，模糊，应具体化\",\n    \"一定的\": \"模糊修饰，应具体化\",\n    \"方面\": \"后缀词，可精简\",\n    \"问题\": \"高频词，检查是否过度使用\",\n    \"工作\": \"高频词，检查是否过度使用\",\n    \"情况\": \"模糊词，应具体化\",\n}\n\n# 中文被动句模式\nCHINESE_PASSIVE_PATTERNS = [\n    (r'被[\\u4e00-\\u9fff]{1,8}(?:所|地|地)?', \"被字句\"),\n    (r'受[\\u4e00-\\u9fff]{1,6}(?:所|的)?', \"受字句\"),\n    (r'为[\\u4e00-\\u9fff]{1,6}所[\\u4e00-\\u9fff]{1,8}', \"为...所...\"),\n    (r'由[\\u4e00-\\u9fff]{1,8}(?:来|去)?(?:完成|执行|负责|进行|处理)', \"由...来...\"),\n]\n\n# 中文冗长表达模式\nCHINESE_VERBOSE_PATTERNS = [\n    (r'由于.{1,15}的原因', \"由于...的原因（语义重复，可删'的原因'）\"),\n    (r'在.{1,15}方面', \"在...方面（可精简为直接表述）\"),\n    (r'对于.{1,15}来说', \"对于...来说（可精简）\"),\n    (r'为了.{1,15}的目的', \"为了...的目的（语义重复）\"),\n    (r'进行了.{1,10}', \"进行了...（可直接用动词）\"),\n    (r'作出了.{1,10}', \"作出了...（可直接用动词）\"),\n    (r'予以.{1,8}', \"予以...（公文套话，可精简）\"),\n    (r'加以.{1,8}', \"加以...（公文套话，可精简）\"),\n    (r'相关的.{1,8}', \"相关的...（模糊，应具体化）\"),\n    (r'一定程度上', \"一定程度上（模糊，应具体说明程度）\"),\n    (r'在一定程度上', \"在一定程度上（模糊）\"),\n    (r'从某种意义上说', \"从某种意义上说（模糊套话）\"),\n    (r'众所周知', \"众所周知（空泛，可删）\"),\n    (r'毋庸置疑', \"毋庸置疑（空泛，可删）\"),\n]\n\n# 英文填充词\nENGLISH_FILLER_WORDS = {\n    \"very\": \"程度副词，可删或替换\",\n    \"really\": \"程度副词，可删\",\n    \"quite\": \"程度副词，可删\",\n    \"actually\": \"填充词，可删\",\n    \"basically\": \"填充词，可删\",\n    \"literally\": \"填充词，可删\",\n    \"just\": \"填充词，可删\",\n    \"maybe\": \"模糊词，应具体化\",\n    \"perhaps\": \"模糊词，应具体化\",\n    \"things\": \"模糊词，应具体化\",\n    \"stuff\": \"模糊词，应具体化\",\n    \"a lot of\": \"模糊量词，应具体化\",\n    \"lots of\": \"模糊量词，应具体化\",\n    \"kind of\": \"模糊词，应删\",\n    \"sort of\": \"模糊词，应删\",\n    \"in order to\": \"冗长，可用to\",\n    \"due to the fact that\": \"冗长，可用because\",\n    \"in spite of the fact that\": \"冗长，可用although\",\n}\n\n# 英文句子结束标点\nEN_SENTENCE_ENDERS = \".!?\"\n\n# 中文句子结束标点\nZH_SENTENCE_ENDERS = \"。！？；\"\n\n\n# ============================================================\n# 文本分析器\n# ============================================================\n\nclass TextAnalyzer:\n    \"\"\"文本可读性分析器\"\"\"\n\n    def __init__(self, text: str, style: str = \"auto\"):\n        self.text = text.strip()\n        self.style = style\n        # 分析结果\n        self.chars = 0\n        self.words = 0\n        self.sentences: List[str] = []\n        self.paragraphs: List[str] = []\n        self.zh_char_count = 0\n        self.en_word_count = 0\n        self.is_chinese_dominant = True\n\n    def analyze(self) -> dict:\n        \"\"\"执行完整分析，返回结果字典\"\"\"\n        self._basic_stats()\n        self._sentence_analysis()\n        self._paragraph_analysis()\n        self._word_analysis()\n        self._passive_detection()\n        self._verbose_detection()\n        score = self._calculate_score()\n        issues = self._collect_issues()\n\n        return {\n            \"basic_stats\": {\n                \"chars\": self.chars,\n                \"words\": self.words,\n                \"sentences\": len(self.sentences),\n                \"paragraphs\": len(self.paragraphs),\n                \"reading_time_min\": self._estimate_reading_time(),\n            },\n            \"sentence_analysis\": self._sentence_stats(),\n            \"paragraph_analysis\": self._paragraph_stats(),\n            \"word_analysis\": self._word_stats(),\n            \"passive_voice\": self.passive_results,\n            \"verbose_expressions\": self.verbose_results,\n            \"readability_score\": score,\n            \"issues\": issues,\n        }\n\n    def _basic_stats(self):\n        \"\"\"基础统计\"\"\"\n        # 去除空白\n        text_no_space = re.sub(r'\\s+', '', self.text)\n        self.chars = len(text_no_space)\n\n        # 统计中文字符和英文单词\n        self.zh_char_count = len(re.findall(r'[\\u4e00-\\u9fff]', self.text))\n        en_words = re.findall(r'[a-zA-Z]+(?:[\\'-][a-zA-Z]+)*', self.text)\n        self.en_word_count = len(en_words)\n\n        # 总字数：中文字符 + 英文单词\n        self.words = self.zh_char_count + self.en_word_count\n\n        # 判断是否以中文为主\n        self.is_chinese_dominant = self.zh_char_count > self.en_word_count\n\n        # 分段\n        self.paragraphs = [p.strip() for p in self.text.split('\\n') if p.strip()]\n\n    def _split_sentences(self) -> List[str]:\n        \"\"\"将文本拆分为句子\"\"\"\n        # 统一换行\n        text = self.text.replace('\\n', ' ')\n        # 按中文句号、问号、叹号、分号分割\n        # 保留分隔符\n        sentences = re.split(r'(?<=[。！？；!?;])', text)\n        # 清理\n        result = []\n        for s in sentences:\n            s = s.strip()\n            # 去除前后空白和标点\n            s = re.sub(r'^[\\s，,。！？；:：]+', '', s)\n            s = re.sub(r'[\\s]+$', '', s)\n            if len(s) >= 2:  # 至少2个字才算句子\n                result.append(s)\n        return result\n\n    def _sentence_analysis(self):\n        \"\"\"句子分析\"\"\"\n        self.sentences = self._split_sentences()\n\n    def _paragraph_analysis(self):\n        \"\"\"段落分析\"\"\"\n        pass  # 在 _paragraph_stats 中计算\n\n    def _get_sentence_length(self, sentence: str) -> int:\n        \"\"\"计算句子长度（中文字符+英文单词数）\"\"\"\n        zh = len(re.findall(r'[\\u4e00-\\u9fff]', sentence))\n        en = len(re.findall(r'[a-zA-Z]+(?:[\\'-][a-zA-Z]+)*', sentence))\n        return zh + en\n\n    def _sentence_stats(self) -> dict:\n        \"\"\"句子统计\"\"\"\n        if not self.sentences:\n            return {\"avg_length\": 0, \"long_sentences\": [], \"super_long\": [], \"distribution\": {}}\n\n        lengths = [self._get_sentence_length(s) for s in self.sentences]\n        avg_len = sum(lengths) / len(lengths)\n\n        # 标准差\n        variance = sum((l - avg_len) ** 2 for l in lengths) / len(lengths)\n        std_dev = variance ** 0.5\n        cv = std_dev / avg_len if avg_len > 0 else 0\n\n        # 长句阈值（中文：40字；英文按词数类似处理）\n        long_threshold = 40 if self.is_chinese_dominant else 30\n        super_long_threshold = 60 if self.is_chinese_dominant else 45\n\n        long_sents = []\n        super_long_sents = []\n        for i, (sent, length) in enumerate(zip(self.sentences, lengths), 1):\n            if length >= super_long_threshold:\n                super_long_sents.append({\"index\": i, \"length\": length, \"text\": sent[:80]})\n            elif length >= long_threshold:\n                long_sents.append({\"index\": i, \"length\": length, \"text\": sent[:80]})\n\n        # 分布\n        short_count = sum(1 for l in lengths if l < 15)\n        mid_count = sum(1 for l in lengths if 15 <= l < 30)\n        long_count = sum(1 for l in lengths if l >= 30)\n        total = len(lengths)\n\n        return {\n            \"avg_length\": round(avg_len, 1),\n            \"std_dev\": round(std_dev, 1),\n            \"cv\": round(cv, 2),\n            \"long_count\": len(long_sents),\n            \"super_long_count\": len(super_long_sents),\n            \"long_pct\": round(len(long_sents) / total * 100, 1),\n            \"super_long_pct\": round(len(super_long_sents) / total * 100, 1),\n            \"long_sentences\": long_sents[:10],\n            \"super_long_sentences\": super_long_sents[:10],\n            \"distribution\": {\n                \"short_lt15\": round(short_count / total * 100, 1),\n                \"mid_15to30\": round(mid_count / total * 100, 1),\n                \"long_ge30\": round(long_count / total * 100, 1),\n            },\n        }\n\n    def _paragraph_stats(self) -> dict:\n        \"\"\"段落统计\"\"\"\n        if not self.paragraphs:\n            return {\"avg_length\": 0, \"longest\": 0, \"shortest\": 0, \"long_paragraphs\": []}\n\n        lengths = [self._get_sentence_length(p) for p in self.paragraphs]\n        avg_len = sum(lengths) / len(lengths)\n\n        # 长段落阈值（中文：300字）\n        long_threshold = 300 if self.is_chinese_dominant else 200\n        long_paras = []\n        for i, (para, length) in enumerate(zip(self.paragraphs, lengths), 1):\n            if length >= long_threshold:\n                long_paras.append({\"index\": i, \"length\": length, \"preview\": para[:60]})\n\n        return {\n            \"count\": len(self.paragraphs),\n            \"avg_length\": round(avg_len, 1),\n            \"longest\": max(lengths),\n            \"shortest\": min(lengths),\n            \"long_paragraphs\": long_paras[:5],\n        }\n\n    def _extract_chinese_words(self) -> List[str]:\n        \"\"\"简易中文分词：提取常见双字词和四字词\"\"\"\n        words = []\n        # 提取2-4字的中文词组（基于2-4字滑窗，保留有意义的）\n        # 这里用简单的频率统计：提取所有2字词\n        text = self.text\n        # 提取所有2字组合\n        two_grams = re.findall(r'[\\u4e00-\\u9fff]{2}', text)\n        words.extend(two_grams)\n        # 提取3字组合\n        three_grams = re.findall(r'[\\u4e00-\\u9fff]{3}', text)\n        words.extend(three_grams)\n        return words\n\n    def _word_analysis(self):\n        \"\"\"词汇分析\"\"\"\n        self.filler_stats = {}\n        self.hot_words = []\n\n        if self.is_chinese_dominant:\n            # 填充词统计\n            for word, desc in CHINESE_FILLER_WORDS.items():\n                count = self.text.count(word)\n                if count > 0:\n                    self.filler_stats[word] = {\"count\": count, \"desc\": desc}\n\n            # 高频词（2字词）\n            two_grams = re.findall(r'[\\u4e00-\\u9fff]{2}', self.text)\n            # 过滤掉常见无意义组合\n            stop_2grams = {\"我们\", \"你们\", \"他们\", \"这个\", \"那个\", \"就是\", \"不是\",\n                          \"可以\", \"因为\", \"所以\", \"但是\", \"而且\", \"或者\", \"如果\",\n                          \"虽然\", \"然而\", \"同时\", \"其中\", \"以上\", \"以下\", \"目前\",\n                          \"已经\", \"正在\", \"将要\", \"应该\", \"需要\", \"能够\", \"进行\",\n                          \"相关\", \"通过\", \"对于\", \"关于\", \"由于\", \"为了\", \"根据\",\n                          \"按照\", \"基于\", \"处于\", \"属于\", \"位于\", \"在于\", \"在于\"}\n            filtered = [w for w in two_grams if w not in stop_2grams]\n            counter = Counter(filtered)\n            self.hot_words = counter.most_common(20)\n        else:\n            # 英文填充词\n            text_lower = self.text.lower()\n            for phrase, desc in ENGLISH_FILLER_WORDS.items():\n                count = len(re.findall(r'\\b' + re.escape(phrase) + r'\\b', text_lower))\n                if count > 0:\n                    self.filler_stats[phrase] = {\"count\": count, \"desc\": desc}\n\n            # 高频英文词\n            words = re.findall(r'[a-zA-Z]+', self.text.lower())\n            stop_words = {\"the\", \"a\", \"an\", \"is\", \"are\", \"was\", \"were\", \"be\",\n                         \"been\", \"being\", \"have\", \"has\", \"had\", \"do\", \"does\", \"did\",\n                         \"will\", \"would\", \"could\", \"should\", \"may\", \"might\", \"must\",\n                         \"shall\", \"can\", \"need\", \"dare\", \"ought\", \"used\", \"to\", \"of\",\n                         \"in\", \"for\", \"on\", \"with\", \"at\", \"by\", \"from\", \"as\", \"into\",\n                         \"through\", \"during\", \"before\", \"after\", \"above\", \"below\",\n                         \"and\", \"but\", \"or\", \"nor\", \"not\", \"so\", \"yet\", \"both\",\n                         \"either\", \"neither\", \"each\", \"every\", \"all\", \"any\", \"few\",\n                         \"more\", \"most\", \"other\", \"some\", \"such\", \"no\", \"only\",\n                         \"own\", \"same\", \"than\", \"too\", \"very\", \"just\", \"because\",\n                         \"if\", \"when\", \"where\", \"how\", \"what\", \"which\", \"who\", \"whom\",\n                         \"this\", \"that\", \"these\", \"those\", \"i\", \"me\", \"my\", \"we\",\n                         \"our\", \"you\", \"your\", \"he\", \"him\", \"his\", \"she\", \"her\",\n                         \"it\", \"its\", \"they\", \"them\", \"their\"}\n            filtered = [w for w in words if w not in stop_words and len(w) > 2]\n            counter = Counter(filtered)\n            self.hot_words = counter.most_common(20)\n\n    def _word_stats(self) -> dict:\n        \"\"\"词汇统计\"\"\"\n        # 填充词总数\n        total_filler = sum(v[\"count\"] for v in self.filler_stats.values())\n        # 主要问题填充词（出现>=5次）\n        problem_fillers = {k: v for k, v in self.filler_stats.items() if v[\"count\"] >= 3}\n\n        return {\n            \"hot_words\": self.hot_words[:15],\n            \"filler_total\": total_filler,\n            \"filler_ratio\": round(total_filler / max(self.words, 1) * 100, 1),\n            \"problem_fillers\": problem_fillers,\n        }\n\n    def _passive_detection(self):\n        \"\"\"被动句检测\"\"\"\n        self.passive_results = []\n        if not self.is_chinese_dominant:\n            return\n\n        for pattern, label in CHINESE_PASSIVE_PATTERNS:\n            matches = re.finditer(pattern, self.text)\n            for m in matches:\n                context_start = max(0, m.start() - 10)\n                context_end = min(len(self.text), m.end() + 10)\n                self.passive_results.append({\n                    \"pattern\": label,\n                    \"match\": m.group(),\n                    \"context\": self.text[context_start:context_end],\n                })\n\n    def _verbose_detection(self):\n        \"\"\"冗长表达检测\"\"\"\n        self.verbose_results = []\n        if not self.is_chinese_dominant:\n            return\n\n        for pattern, description in CHINESE_VERBOSE_PATTERNS:\n            matches = re.finditer(pattern, self.text)\n            for m in matches:\n                self.verbose_results.append({\n                    \"description\": description,\n                    \"match\": m.group(),\n                })\n\n    def _estimate_reading_time(self) -> float:\n        \"\"\"估算阅读时间（分钟）\"\"\"\n        if self.is_chinese_dominant:\n            # 中文约 300 字/分钟\n            minutes = self.words / 300.0\n        else:\n            # 英文约 200 词/分钟\n            minutes = self.words / 200.0\n        return round(minutes, 1)\n\n    def _calculate_score(self) -> dict:\n        \"\"\"计算可读性评分\"\"\"\n        scores = {}\n\n        # 1. 句子长度合理性 (30分)\n        s = self._sentence_stats()\n        avg = s[\"avg_length\"]\n        if self.is_chinese_dominant:\n            # 理想平均句长 15-30 字\n            if 15 <= avg <= 30:\n                len_score = 30\n            elif 12 <= avg < 15 or 30 < avg <= 40:\n                len_score = 22\n            elif 10 <= avg < 12 or 40 < avg <= 50:\n                len_score = 15\n            else:\n                len_score = 8\n        else:\n            if 12 <= avg <= 20:\n                len_score = 30\n            elif 8 <= avg < 12 or 20 < avg <= 28:\n                len_score = 22\n            elif 6 <= avg < 8 or 28 < avg <= 35:\n                len_score = 15\n            else:\n                len_score = 8\n        # 长句扣分\n        long_penalty = s[\"long_pct\"] * 0.3 + s[\"super_long_pct\"] * 0.5\n        len_score = max(0, len_score - long_penalty)\n        scores[\"sentence_length\"] = round(len_score)\n\n        # 2. 句子变化性 (15分)\n        cv = s[\"cv\"]\n        if cv >= 0.6:\n            var_score = 15\n        elif cv >= 0.4:\n            var_score = 12\n        elif cv >= 0.25:\n            var_score = 8\n        else:\n            var_score = 4\n        scores[\"sentence_variety\"] = round(var_score)\n\n        # 3. 段落结构 (15分)\n        p = self._paragraph_stats()\n        if p[\"count\"] == 0:\n            para_score = 7\n        else:\n            avg_para = p[\"avg_length\"]\n            if self.is_chinese_dominant:\n                if 80 <= avg_para <= 250:\n                    para_score = 15\n                elif 50 <= avg_para < 80 or 250 < avg_para <= 400:\n                    para_score = 11\n                else:\n                    para_score = 6\n            else:\n                if 60 <= avg_para <= 180:\n                    para_score = 15\n                elif 40 <= avg_para < 60 or 180 < avg_para <= 300:\n                    para_score = 11\n                else:\n                    para_score = 6\n            # 长段落扣分\n            if len(p[\"long_paragraphs\"]) > 0:\n                para_score = max(0, para_score - len(p[\"long_paragraphs\"]) * 2)\n        scores[\"paragraph_structure\"] = round(para_score)\n\n        # 4. 词汇丰富度 (20分)\n        w = self._word_stats()\n        # 填充词比例扣分\n        filler_ratio = w[\"filler_ratio\"]\n        if filler_ratio <= 5:\n            vocab_score = 20\n        elif filler_ratio <= 10:\n            vocab_score = 15\n        elif filler_ratio <= 15:\n            vocab_score = 10\n        else:\n            vocab_score = 5\n        scores[\"vocabulary\"] = round(vocab_score)\n\n        # 5. 表达简洁度 (20分)\n        brevity_score = 20\n        # 被动句扣分\n        brevity_score -= len(self.passive_results) * 1.5\n        # 冗长表达扣分\n        brevity_score -= len(self.verbose_results) * 2\n        brevity_score = max(0, brevity_score)\n        scores[\"brevity\"] = round(brevity_score)\n\n        total = sum(scores.values())\n        if total >= 90:\n            grade = \"A\"\n        elif total >= 75:\n            grade = \"B\"\n        elif total >= 60:\n            grade = \"C\"\n        elif total >= 40:\n            grade = \"D\"\n        else:\n            grade = \"E\"\n\n        return {\n            \"total\": total,\n            \"grade\": grade,\n            \"breakdown\": scores,\n        }\n\n    def _collect_issues(self) -> List[dict]:\n        \"\"\"收集所有问题\"\"\"\n        issues = []\n\n        s = self._sentence_stats()\n        p = self._paragraph_stats()\n        w = self._word_stats()\n\n        # 长句问题\n        if s[\"super_long_count\"] > 0:\n            issues.append({\n                \"type\": \"超长句\",\n                \"severity\": \"high\",\n                \"message\": f\"有 {s['super_long_count']} 个超长句（>60字），最长 {s['super_long_sentences'][0]['length'] if s['super_long_sentences'] else 0} 字\",\n                \"suggestion\": \"将超长句拆分为2-3个短句，每句只表达一个意思\",\n            })\n        if s[\"long_pct\"] > 20:\n            issues.append({\n                \"type\": \"长句过多\",\n                \"severity\": \"medium\",\n                \"message\": f\"长句占比 {s['long_pct']}%，超过 20% 的建议线\",\n                \"suggestion\": \"适当拆分长句，增加短句，改善阅读节奏\",\n            })\n\n        # 句长单一\n        if s[\"cv\"] < 0.3:\n            issues.append({\n                \"type\": \"句长单一\",\n                \"severity\": \"low\",\n                \"message\": f\"句长变异系数 {s['cv']}，句式节奏较单一\",\n                \"suggestion\": \"穿插使用长短句，增加阅读节奏感\",\n            })\n\n        # 长段落\n        if p.get(\"long_paragraphs\"):\n            issues.append({\n                \"type\": \"段落过长\",\n                \"severity\": \"medium\",\n                \"message\": f\"有 {len(p['long_paragraphs'])} 个段落超过 300 字\",\n                \"suggestion\": \"将长段落拆分为多个短段落，每段一个主题\",\n            })\n\n        # 填充词\n        problem_fillers = w[\"problem_fillers\"]\n        if problem_fillers:\n            top_filler = max(problem_fillers.items(), key=lambda x: x[1][\"count\"])\n            issues.append({\n                \"type\": \"填充词过多\",\n                \"severity\": \"medium\",\n                \"message\": f\"'{top_filler[0]}' 出现 {top_filler[1]['count']} 次（{top_filler[1]['desc']}）\",\n                \"suggestion\": f\"减少'{top_filler[0]}'的使用，替换为更具体的表达\",\n            })\n\n        # 被动句\n        if len(self.passive_results) >= 3:\n            issues.append({\n                \"type\": \"被动句过多\",\n                \"severity\": \"low\",\n                \"message\": f\"检测到 {len(self.passive_results)} 处被动句\",\n                \"suggestion\": \"适当改为主动语态，使表达更直接有力\",\n            })\n\n        # 冗长表达\n        if self.verbose_results:\n            issues.append({\n                \"type\": \"冗长表达\",\n                \"severity\": \"medium\",\n                \"message\": f\"检测到 {len(self.verbose_results)} 处冗长表达（如'{self.verbose_results[0]['match']}'）\",\n                \"suggestion\": \"精简冗余表达，如'由于...的原因'改为'由于...'\",\n            })\n\n        # 平均句长过高\n        if self.is_chinese_dominant and s[\"avg_length\"] > 35:\n            issues.append({\n                \"type\": \"平均句长偏长\",\n                \"severity\": \"medium\",\n                \"message\": f\"平均句长 {s['avg_length']} 字，偏长\",\n                \"suggestion\": \"将平均句长控制在 15-30 字，每句表达一个要点\",\n            })\n\n        return issues\n\n\n# ============================================================\n# 报告格式化\n# ============================================================\n\ndef format_report(result: dict) -> str:\n    \"\"\"格式化为文本报告\"\"\"\n    lines = []\n    b = result[\"basic_stats\"]\n    sc = result[\"sentence_analysis\"]\n    pa = result[\"paragraph_analysis\"]\n    wa = result[\"word_analysis\"]\n    score = result[\"readability_score\"]\n    issues = result[\"issues\"]\n\n    lines.append(\"=\" * 60)\n    lines.append(\"📊 文本可读性分析报告\")\n    lines.append(\"=\" * 60)\n    lines.append(\"\")\n\n    # 基本信息\n    lines.append(\"【基本信息】\")\n    lines.append(f\"  总字符数：{b['chars']:,}\")\n    lines.append(f\"  总字数：{b['words']:,}\")\n    lines.append(f\"  句子数：{b['sentences']}\")\n    lines.append(f\"  段落数：{b['paragraphs']}\")\n    lines.append(f\"  预计阅读时间：约 {b['reading_time_min']} 分钟\")\n    lines.append(\"\")\n\n    # 评分\n    lines.append(\"【可读性评分】\")\n    lines.append(f\"  总分：{score['total']}/100（{score['grade']}级）\")\n    lines.append(\"\")\n    lines.append(\"  分项评分：\")\n    names = {\n        \"sentence_length\": \"句子长度合理性\",\n        \"sentence_variety\": \"句子变化性\",\n        \"paragraph_structure\": \"段落结构\",\n        \"vocabulary\": \"词汇丰富度\",\n        \"brevity\": \"表达简洁度\",\n    }\n    max_scores = {\"sentence_length\": 30, \"sentence_variety\": 15,\n                  \"paragraph_structure\": 15, \"vocabulary\": 20, \"brevity\": 20}\n    for key, name in names.items():\n        val = score[\"breakdown\"].get(key, 0)\n        mx = max_scores[key]\n        bar_filled = int(val / mx * 10)\n        bar = \"█\" * bar_filled + \"░\" * (10 - bar_filled)\n        lines.append(f\"  {name:<16} {bar} {val}/{mx}\")\n    lines.append(\"\")\n\n    # 句子分析\n    lines.append(\"【句子分析】\")\n    lines.append(f\"  平均句长：{sc['avg_length']} 字\")\n    lines.append(f\"  句长标准差：{sc['std_dev']}（变异系数 {sc['cv']}）\")\n    lines.append(f\"  长句（>40字）：{s let currentSkill = null;
let currentFilter = 'all';

// 初始化
function init() {
  const categories = [...new Set(SKILLS.map(s => s.category))];
  const filterContainer = document.querySelector('.filters');
  categories.forEach(cat => {
    const btn = document.createElement('button');
    btn.className = 'filter-btn';
    btn.dataset.cat = cat;
    btn.textContent = cat;
    btn.onclick = () => setFilter(cat, btn);
    filterContainer.insertBefore(btn, filterContainer.querySelector('.search-box').nextSibling);
  });

  document.getElementById('total-skills').textContent = SKILLS.length;
  document.getElementById('total-categories').textContent = categories.length;
  document.getElementById('total-files').textContent = SKILLS.reduce((a, s) => a + s.file_count, 0);
  document.getElementById('footer-count').textContent = SKILLS.length;

  renderSkills();
}

function setFilter(cat, btn) {
  currentFilter = cat;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderSkills();
}

function renderSkills() {
  const search = document.getElementById('search').value.toLowerCase();
  const grid = document.getElementById('skill-grid');
  const filtered = SKILLS.filter(s => {
    const matchCat = currentFilter === 'all' || s.category === currentFilter;
    const matchSearch = !search || s.name.toLowerCase().includes(search) || s.description.toLowerCase().includes(search);
    return matchCat && matchSearch;
  });

  grid.innerHTML = filtered.map(s => `
    <div class="skill-card" style="--card-color: ${s.color}" onclick="openModal('${s.name}')">
      <div class="skill-header">
        <span class="skill-icon">${s.icon}</span>
        <div>
          <div class="skill-name">${s.name}</div>
          <span class="skill-category" style="background: ${s.color}">${s.category}</span>
        </div>
      </div>
      <div class="skill-desc">${s.description}</div>
      <div class="skill-meta">
        <span>📄 ${s.file_count} 个文件</span>
        <span>📝 ${s.script_lines} 行代码</span>
      </div>
      <div class="skill-actions">
        <button class="btn btn-primary" onclick="event.stopPropagation();openModal('${s.name}')">查看详情</button>
        <button class="btn btn-secondary" onclick="event.stopPropagation();downloadSkillByName('${s.name}')">下载</button>
      </div>
    </div>
  `).join('');
}

// 简单 Markdown 渲染
function renderMarkdown(text) {
  // 移除 frontmatter
  text = text.replace(/^---\n[\s\S]*?\n---\n/, '');
  let html = text;
  // 代码块
  html = html.replace(/```(\w*)\n([\s\S]*?)```/g, '<pre><code class="lang-$1">$2</code></pre>');
  // 行内代码
  html = html.replace(/`([^`]+)`/g, '<code>$1</code>');
  // 标题
  html = html.replace(/^###### (.*)$/gm, '<h6>$1</h6>');
  html = html.replace(/^##### (.*)$/gm, '<h5>$1</h5>');
  html = html.replace(/^#### (.*)$/gm, '<h4>$1</h4>');
  html = html.replace(/^### (.*)$/gm, '<h3>$1</h3>');
  html = html.replace(/^## (.*)$/gm, '<h2>$1</h2>');
  html = html.replace(/^# (.*)$/gm, '<h1>$1</h1>');
  // 粗体和斜体
  html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
  html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
  // 引用
  html = html.replace(/^> (.*)$/gm, '<blockquote>$1</blockquote>');
  // 表格
  html = html.replace(/\|(.+)\|\n\|[\s\-:|]+\|\n((?:\|.+\|\n?)*)/g, (m, header, body) => {
    const ths = header.split('|').filter(Boolean).map(h => `<th>${h.trim()}</th>`).join('');
    const trs = body.trim().split('\n').map(row => {
      const tds = row.split('|').filter(Boolean).map(d => `<td>${d.trim()}</td>`).join('');
      return `<tr>${tds}</tr>`;
    }).join('');
    return `<table><thead><tr>${ths}</tr></thead><tbody>${trs}</tbody></table>`;
  });
  // 列表
  html = html.replace(/^- (.*)$/gm, '<li>$1</li>');
  html = html.replace(/(<li>.*<\/li>\n?)+/g, m => `<ul>${m}</ul>`);
  html = html.replace(/^\d+\. (.*)$/gm, '<li>$1</li>');
  // 段落
  html = html.replace(/\n\n/g, '</p><p>');
  html = '<p>' + html + '</p>';
  // 清理空段落
  html = html.replace(/<p><\/p>/g, '');
  return html;
}

function openModal(name) {
  const skill = SKILLS.find(s => s.name === name);
  if (!skill) return;
  currentSkill = skill;
  document.getElementById('modal-icon').textContent = skill.icon;
  document.getElementById('modal-name').textContent = skill.name;
  const catEl = document.getElementById('modal-category');
  catEl.textContent = skill.category;
  catEl.style.background = skill.color;

  let body = renderMarkdown(skill.skill_md);
  // 文件列表
  body += '<div class="file-list"><h4>📁 包含文件</h4>';
  for (const [fname, fcontent] of Object.entries(skill.files)) {
    const size = new Blob([fcontent]).size;
    body += `<div class="file-item"><span class="file-name">${fname}</span><span class="file-size">${size} bytes</span></div>`;
  }
  body += '</div>';
  document.getElementById('modal-body').innerHTML = body;
  document.getElementById('modal').classList.add('active');
}

function closeModal() {
  document.getElementById('modal').classList.remove('active');
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

async function downloadSkill(skill) {
  const zip = new JSZip();
  const folder = zip.folder(skill.name);
  for (const [fname, fcontent] of Object.entries(skill.files)) {
    folder.file(fname, fcontent);
  }
  const blob = await zip.generateAsync({type: 'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = skill.name + '.zip';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已下载 ' + skill.name + '.zip');
}

function downloadSkillByName(name) {
  const skill = SKILLS.find(s => s.name === name);
  if (skill) downloadSkill(skill);
}

async function downloadAll() {
  showToast('正在打包全部技能...');
  const zip = new JSZip();
  for (const skill of SKILLS) {
    const folder = zip.folder(skill.name);
    for (const [fname, fcontent] of Object.entries(skill.files)) {
      folder.file(fname, fcontent);
    }
  }
  // 添加 README
  zip.file('README.md', '# AI Agent 技能合集\n\n共 ' + SKILLS.length + ' 个技能。\n\n每个技能目录包含 SKILL.md（技能定义）、scripts/（可执行脚本）、templates/（模板）、examples/（示例）。\n\n使用方法：将技能目录放入 AI 的 skills 目录，或直接阅读 SKILL.md 按说明使用。');
  const blob = await zip.generateAsync({type: 'blob'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'ai-agent-skills-collection.zip';
  a.click();
  URL.revokeObjectURL(url);
  showToast('已下载全部技能合集');
}

function copySkillMd() {
  if (!currentSkill) return;
  navigator.clipboard.writeText(currentSkill.skill_md).then(() => {
    showToast('SKILL.md 已复制到剪贴板');
  });
}

// ESC 关闭弹窗
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') closeModal();
});

init();
</script>
</body>
</html>
