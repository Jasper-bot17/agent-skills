\n4. **大文本定义**：WCAG 定义大文本为 18pt（约 24px）以上，或 14pt（约 18.66px）粗体以上。\n5. **配色方案理论**：基于传统色轮理论（RYB），实际视觉效果可能因屏幕和色彩空间而异。\n6. **单色渐变**：生成 5 个明度阶梯（100-900），类似 Tailwind 的色阶体系。\n7. **保存格式**：配色方案保存为 JSON 文件，包含所有颜色的 HEX/RGB/HSL 信息。\n8. **CSS 输出**：包含主色、浅色、深色变体，以及互补色和中性色，可直接使用。\n9. **Tailwind 输出**：生成 50-900 共 10 个色阶，符合 Tailwind 配色规范。\n10. **不修改文件**：本技能只读取输入和生成输出，不会修改任何已有文件。\n\n## 十、文件结构\n\n```\ncolor-palette-generator/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── color-theory-reference.md          # 色彩理论参考与配色指南\n├── scripts/\n│   └── generate_palette.py                # 配色方案生成脚本\n└── examples/\n    ├── sample-palette.json                # 示例配色方案（JSON）\n    ├── sample-css-variables.css           # 示例 CSS 变量输出\n    └── sample-contrast-report.md          # 示例对比度检查报告\n```\n\n## 十一、使用示例\n\n### 示例 1：快速生成配色\n**用户**：「用 #2ECC71 生成配色方案」\n**AI**：运行 `--color \"#2ECC71\"` → 输出 6 种配色方案 + 终端预览。\n\n### 示例 2：对比度检查\n**用户**：「白色文字在 #E74C3C 背景上能看清吗」\n**AI**：运行 `--color \"#FFFFFF\" --contrast \"#E74C3C\"` → 输出对比度比率和合规性。\n\n### 示例 3：生成配置\n**用户**：「生成 Tailwind 配色配置」\n**AI**：运行 `--color \"#9B59B6\" --format tailwind` → 输出可直接复制的 Tailwind 配置。\n", "files": {"SKILL.md": "---\nname: color-palette-generator\ndescription: '配色方案生成助手。输入一个基础颜色（HEX/RGB/HSL），自动生成多种配色方案（互补色、类比色、三角色、四角色、分裂互补、单色渐变），支持颜色格式互转（HEX/RGB/HSL/HSV），计算 WCAG 对比度比率并检查无障碍合规性（AA/AAA 标准），生成 CSS 变量和 Tailwind 配置，终端可视化预览配色效果。适用于网页设计、UI 设计、品牌配色、数据可视化配色等场景。'\n---\n\n# 配色方案生成助手\n\n## 一、技能定位\n\n本技能用于**生成和分析配色方案**。核心价值：\n\n- 从一个基础颜色自动生成 6 种专业配色方案\n- 颜色格式互转（HEX / RGB / HSL / HSV）\n- WCAG 对比度计算与无障碍合规检查\n- 生成 CSS 变量和 Tailwind 配置\n- 终端可视化预览配色效果\n- 保存和加载配色方案\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我生成一个配色方案」「选个配色」\n2. 用户说「这个颜色的互补色是什么」「生成类比色」\n3. 用户说「检查一下这两个颜色的对比度」「是否符合无障碍标准」\n4. 用户说「把这个颜色转成 RGB/HSL」「颜色格式转换」\n5. 用户说「生成 CSS 变量」「生成 Tailwind 配色配置」\n6. 用户说「帮我设计一个网站配色」「品牌配色方案」\n7. 用户说「数据可视化用什么颜色好」「图表配色」\n\n## 三、支持的配色方案\n\n### 3.1 互补色（Complementary）\n基础色与色轮上对面 180° 的颜色组合，对比强烈，适合需要突出重点的场景。\n\n### 3.2 类比色（Analogous）\n色轮上相邻的 3-5 个颜色，和谐统一，适合背景和大面积使用。\n\n### 3.3 三角色（Triadic）\n色轮上等距 120° 的三个颜色，平衡且富有活力，适合需要多种主色的设计。\n\n### 3.4 四角色（Tetradic / Square）\n色轮上等距 90° 的四个颜色，丰富多变，适合复杂的多色设计。\n\n### 3.5 分裂互补（Split Complementary）\n基础色 + 互补色两侧的颜色，比互补色更柔和，对比仍然明显。\n\n### 3.6 单色渐变（Monochromatic）\n同一色相的不同明度和饱和度变化，简约高级，适合极简风格。\n\n## 四、颜色格式\n\n| 格式 | 示例 | 说明 |\n|---|---|---|\n| HEX | `#3498DB` | 十六进制，网页最常用 |\n| RGB | `rgb(52, 152, 219)` | 红绿蓝，0-255 |\n| HSL | `hsl(204, 70%, 53%)` | 色相/饱和度/明度 |\n| HSV | `hsv(204, 76%, 86%)` | 色相/饱和度/明度（不同算法） |\n\n## 五、WCAG 无障碍标准\n\n### 5.1 对比度等级\n\n| 等级 | 普通文本 | 大文本（18pt+ 或 14pt+粗体） |\n|---|---|---|\n| AA（最低标准） | ≥ 4.5:1 | ≥ 3:1 |\n| AAA（最高标准） | ≥ 7:1 | ≥ 4.5:1 |\n\n### 5.2 对比度计算公式\n\n```\nL = 0.2126 × R + 0.7152 × G + 0.0722 × B\n（其中 R/G/B 需先做 gamma 校正）\n对比度 = (L1 + 0.05) / (L2 + 0.05)\n（L1 为较亮颜色的相对亮度，L2 为较暗颜色）\n```\n\n## 六、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 生成配色方案 / 颜色格式转换 / 对比度检查 / 生成配置文件\n- 基础颜色（HEX/RGB/HSL 格式）\n- 配色方案类型（默认全部生成）\n- 输出格式\n\n### 步骤 2：运行脚本\n\n使用 `scripts/generate_palette.py`：\n\n```bash\n# 生成所有配色方案（输入 HEX 颜色）\npython3 scripts/generate_palette.py --color \"#3498DB\"\n\n# 输入 RGB 颜色\npython3 scripts/generate_palette.py --color \"rgb(52,152,219)\"\n\n# 输入 HSL 颜色\npython3 scripts/generate_palette.py --color \"hsl(204,70%,53%)\"\n\n# 只生成特定方案\npython3 scripts/generate_palette.py --color \"#3498DB\" --scheme complementary,triadic\n\n# 颜色格式转换\npython3 scripts/generate_palette.py --color \"#3498DB\" --convert\n\n# 对比度检查（前景色 vs 背景色）\npython3 scripts/generate_palette.py --color \"#FFFFFF\" --contrast \"#3498DB\"\n\n# 生成 CSS 变量\npython3 scripts/generate_palette.py --color \"#3498DB\" --format css\n\n# 生成 Tailwind 配置\npython3 scripts/generate_palette.py --color \"#3498DB\" --format tailwind\n\n# 保存配色方案到文件\npython3 scripts/generate_palette.py --color \"#3498DB\" --save my-palette.json\n\n# 从文件加载配色方案\npython3 scripts/generate_palette.py --load my-palette.json\n\n# JSON 格式输出\npython3 scripts/generate_palette.py --color \"#3498DB\" --format json\n```\n\n### 步骤 3：解读结果\n\n- **配色方案**：每种方案包含多个颜色，每个颜色显示 HEX/RGB/HSL\n- **终端预览**：用 ANSI 颜色块直观展示配色效果\n- **对比度报告**：显示对比度比率和 AA/AAA 合规性\n- **CSS/Tailwind**：可直接复制使用的配置代码\n\n### 步骤 4：安全提示\n\n1. 本技能只做颜色计算和生成，不涉及网络请求\n2. 配色方案仅供参考，最终效果需在实际设计中验证\n3. 无障碍检查基于 WCAG 2.1 标准，实际可读性还受字体、大小等因素影响\n\n## 七、输出规范\n\n### 7.1 配色方案列表\n\n```\n🎨 配色方案生成\n━━━━━━━━━━━━━━━━━━━━━━━━\n基础颜色：#3498DB (RGB: 52,152,219 | HSL: 204°,70%,53%)\n\n【互补色 Complementary】\n  #3498DB  ████████  主色\n  #DB7734  ████████  互补色\n\n【类比色 Analogous】\n  #34DBBF  ████████  类比色1\n  #3498DB  ████████  主色\n  #3451DB  ████████  类比色2\n\n【三角色 Triadic】\n  #3498DB  ████████  主色\n  #98DB34  ████████  三角色1\n  #DB3498  ████████  三角色2\n...\n```\n\n### 7.2 对比度报告\n\n```\n📊 对比度检查\n━━━━━━━━━━━━━━━━━━━━━━━━\n前景色：#FFFFFF (白色)\n背景色：#3498DB (蓝色)\n\n对比度比率：4.34 : 1\n\n无障碍合规性：\n  ✅ AA 大文本：通过 (≥ 3:1)\n  ❌ AA 普通文本：未通过 (需要 ≥ 4.5:1)\n  ❌ AAA 大文本：未通过 (需要 ≥ 4.5:1)\n  ❌ AAA 普通文本：未通过 (需要 ≥ 7:1)\n\n建议：\n  - 用于大文本或图形元素\n  - 如需用于普通文本，建议加深背景色至 #2980B9 (对比度 5.12:1)\n```\n\n### 7.3 CSS 变量输出\n\n```css\n:root {\n  /* 主色 */\n  --color-primary: #3498DB;\n  --color-primary-light: #5DADE2;\n  --color-primary-dark: #2980B9;\n\n  /* 互补色 */\n  --color-complementary: #DB7734;\n\n  /* 三角色 */\n  --color-triadic-1: #98DB34;\n  --color-triadic-2: #DB3498;\n\n  /* 中性色 */\n  --color-bg: #F8F9FA;\n  --color-text: #2C3E50;\n  --color-muted: #7F8C8D;\n}\n```\n\n### 7.4 Tailwind 配置输出\n\n```javascript\nmodule.exports = {\n  theme: {\n    extend: {\n      colors: {\n        primary: {\n          50: '#EBF5FB',\n          100: '#D6EAF8',\n          200: '#AED6F1',\n          300: '#85C1E9',\n          400: '#5DADE2',\n          500: '#3498DB',\n          600: '#2E86C1',\n          700: '#2874A6',\n          800: '#21618C',\n          900: '#1B4F72',\n        },\n      },\n    },\n  },\n}\n```\n\n## 八、常见场景处理\n\n### 场景 1：网站主色配色\n**用户**：「我选了 #3498DB 作为网站主色，帮我生成完整配色」\n**处理**：生成所有配色方案 → 生成 CSS 变量 → 检查主色与白色/黑色的对比度 → 给出使用建议。\n\n### 场景 2：无障碍检查\n**用户**：「这个文字颜色在这个背景上能看清吗」\n**处理**：计算对比度比率 → 检查 AA/AAA 合规性 → 如不通过，给出调整建议（加深/变亮）。\n\n### 场景 3：颜色格式转换\n**用户**：「把 #FF5733 转成 RGB 和 HSL」\n**处理**：解析 HEX → 转换为 RGB → 转换为 HSL/HSV → 输出所有格式。\n\n### 场景 4：数据可视化配色\n**用户**：「做图表需要 5 个区分度高的颜色」\n**处理**：生成三角色/四角色方案 → 检查颜色间的区分度 → 给出 5 色方案。\n\n### 场景 5：品牌配色\n**用户**：「帮我设计一个科技感的品牌配色」\n**处理**：以蓝色/紫色为基础 → 生成互补/类比方案 → 生成完整 CSS 配置 → 终端预览。\n\n## 九、注意事项\n\n1. **颜色输入格式**：支持 `#RRGGBB`、`#RGB`、`rgb(r,g,b)`、`hsl(h,s%,l%)` 四种格式。\n2. **终端预览**：颜色块预览需要终端支持 24-bit 真彩色，不支持时会退化为 HEX 文本显示。\n3. **对比度计算**：基于 WCAG 2.1 相对亮度公式，结果精确到小数点后两位。\n4. **大文本定义**：WCAG 定义大文本为 18pt（约 24px）以上，或 14pt（约 18.66px）粗体以上。\n5. **配色方案理论**：基于传统色轮理论（RYB），实际视觉效果可能因屏幕和色彩空间而异。\n6. **单色渐变**：生成 5 个明度阶梯（100-900），类似 Tailwind 的色阶体系。\n7. **保存格式**：配色方案保存为 JSON 文件，包含所有颜色的 HEX/RGB/HSL 信息。\n8. **CSS 输出**：包含主色、浅色、深色变体，以及互补色和中性色，可直接使用。\n9. **Tailwind 输出**：生成 50-900 共 10 个色阶，符合 Tailwind 配色规范。\n10. **不修改文件**：本技能只读取输入和生成输出，不会修改任何已有文件。\n\n## 十、文件结构\n\n```\ncolor-palette-generator/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── color-theory-reference.md          # 色彩理论参考与配色指南\n├── scripts/\n│   └── generate_palette.py                # 配色方案生成脚本\n└── examples/\n    ├── sample-palette.json                # 示例配色方案（JSON）\n    ├── sample-css-variables.css           # 示例 CSS 变量输出\n    └── sample-contrast-report.md          # 示例对比度检查报告\n```\n\n## 十一、使用示例\n\n### 示例 1：快速生成配色\n**用户**：「用 #2ECC71 生成配色方案」\n**AI**：运行 `--color \"#2ECC71\"` → 输出 6 种配色方案 + 终端预览。\n\n### 示例 2：对比度检查\n**用户**：「白色文字在 #E74C3C 背景上能看清吗」\n**AI**：运行 `--color \"#FFFFFF\" --contrast \"#E74C3C\"` → 输出对比度比率和合规性。\n\n### 示例 3：生成配置\n**用户**：「生成 Tailwind 配色配置」\n**AI**：运行 `--color \"#9B59B6\" --format tailwind` → 输出可直接复制的 Tailwind 配置。\n", "templates/color-theory-reference.md": "# 色彩理论参考与配色指南\n\n> 理解色彩基础，做出更好的配色决策。\n\n---\n\n## 一、色彩基础\n\n### 1.1 颜色三要素\n\n| 要素 | 说明 | 范围 |\n|---|---|---|\n| 色相（Hue） | 颜色的基本相貌（红、绿、蓝等） | 0° - 360° |\n| 饱和度（Saturation） | 颜色的鲜艳程度 | 0% - 100% |\n| 明度（Lightness/Value） | 颜色的明暗程度 | 0% - 100% |\n\n### 1.2 常用颜色空间\n\n- **RGB**：加色模型，用于屏幕显示（红+绿+蓝=白）\n- **CMYK**：减色模型，用于印刷（青+品红+黄+黑）\n- **HSL**：色相-饱和度-明度，直观易用\n- **HSV**：色相-饱和度-明度，与 HSL 算法不同\n- **HEX**：十六进制表示，网页开发最常用\n\n---\n\n## 二、色轮与配色方案\n\n### 2.1 色轮基础\n\n```\n          0° 红\n         /    \\\n   300° 品红  60° 黄\n       |        |\n   240° 蓝    120° 绿\n         \\    /\n          180° 青\n```\n\n### 2.2 六种经典配色方案\n\n| 方案 | 角度关系 | 特点 | 适用场景 |\n|---|---|---|---|\n| 互补色 | 180° | 对比强烈，视觉冲击 | 按钮、强调色、CTA |\n| 类比色 | ±30° | 和谐统一，自然舒适 | 背景、大面积色块 |\n| 三角色 | 120° | 平衡活泼，色彩丰富 | 品牌主色、插画 |\n| 四角色 | 90° | 多彩多变，层次丰富 | 复杂界面、数据可视化 |\n| 分裂互补 | 150°/210° | 比互补柔和，仍有对比 | 比互补色更易驾驭 |\n| 单色渐变 | 同色相 | 简约高级，统一感强 | 极简设计、按钮状态 |\n\n---\n\n## 三、无障碍设计（WCAG）\n\n### 3.1 对比度标准\n\n| 等级 | 普通文本 | 大文本 |\n|---|---|---|\n| AA（最低） | ≥ 4.5:1 | ≥ 3:1 |\n| AAA（最高） | ≥ 7:1 | ≥ 4.5:1 |\n\n**大文本定义**：18pt（约 24px）以上，或 14pt（约 18.66px）粗体以上。\n\n### 3.2 对比度计算公式\n\n```\n相对亮度 L = 0.2126 × R + 0.7152 × G + 0.0722 × B\n（R/G/B 需先做 gamma 校正：sRGB ≤ 0.03928 时线性，否则 ((sRGB+0.055)/1.055)^2.4）\n\n对比度 = (L_light + 0.05) / (L_dark + 0.05)\n```\n\n### 3.3 常见配色对比度参考\n\n| 前景 | 背景 | 对比度 | AA普通 | AA大文本 |\n|---|---|---|---|---|\n| 白色 #FFF | 深蓝 #0D47A1 | 12.6 | ✅ | ✅ |\n| 白色 #FFF | 蓝色 #2196F3 | 4.5 | ✅ | ✅ |\n| 白色 #FFF | 浅蓝 #90CAF9 | 1.8 | ❌ | ❌ |\n| 黑色 #000 | 黄色 #FFEB3B | 19.5 | ✅ | ✅ |\n| 黑色 #000 | 浅灰 #BDBDBD | 8.5 | ✅ | ✅ |\n| 白色 #FFF | 红色 #F44336 | 4.0 | ❌ | ✅ |\n\n---\n\n## 四、配色实践建议\n\n### 4.1 60-30-10 法则\n\n- **60%** 主色（背景、大面积）\n- **30%** 辅助色（侧边栏、卡片）\n- **10%** 强调色（按钮、链接、CTA）\n\n### 4.2 数据可视化配色\n\n- 分类数据：使用区分度高的定性色板（如 Tableau 10 色）\n- 顺序数据：使用单色渐变（浅→深）\n- 发散数据：使用双色渐变（如红→白→蓝）\n- 色盲友好：避免红绿组合，使用蓝橙组合\n\n### 4.3 深色模式配色\n\n- 背景：深灰（#121212）而非纯黑，减少视觉疲劳\n- 表面：比背景亮 5-10%（#1E1E1E, #2A2A2A）\n- 文字：高亮度灰白（#E0E0E0）而非纯白\n- 主色：降低饱和度（如 #64B5F6 而非 #2196F3）\n\n### 4.4 品牌配色\n\n- 选择 1 个主色代表品牌个性\n- 搭配 1-2 个辅助色增加层次\n- 准备 5-10 个色阶（50-900）用于不同场景\n- 确保主色在白底和深底上都有足够对比度\n\n---\n\n## 五、常用配色方案参考\n\n### 5.1 科技感\n- 主色：#2196F3（蓝）\n- 辅助：#00BCD4（青）、#3F51B5（靛蓝）\n- 强调：#FF5722（橙红）\n\n### 5.2 自然清新\n- 主色：#4CAF50（绿）\n- 辅助：#8BC34A（浅绿）、#009688（青绿）\n- 强调：#FFC107（琥珀）\n\n### 5.3 温暖活力\n- 主色：#FF5722（橙红）\n- 辅助：#FF9800（橙）、#FFC107（琥珀）\n- 强调：#795548（棕）\n\n### 5.4 优雅高端\n- 主色：#607D8B（蓝灰）\n- 辅助：#455A64（深蓝灰）、#90A4AE（浅蓝灰）\n- 强调：#FFD700（金）\n\n---\n\n*色彩理论参考由 color-palette-generator 技能提供*\n", "scripts/generate_palette.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\n配色方案生成脚本\n\n功能：\n- 解析颜色输入（HEX/RGB/HSL）\n- 颜色格式互转（HEX/RGB/HSL/HSV）\n- 生成 6 种配色方案（互补/类比/三角色/四角色/分裂互补/单色渐变）\n- WCAG 对比度计算与无障碍合规检查\n- 生成 CSS 变量和 Tailwind 配置\n- 终端可视化预览（ANSI 真彩色）\n- 保存/加载配色方案（JSON）\n\n用法：\n  python3 generate_palette.py --color \"#3498DB\"\n  python3 generate_palette.py --color \"rgb(52,152,219)\"\n  python3 generate_palette.py --color \"hsl(204,70%,53%)\"\n  python3 generate_palette.py --color \"#3498DB\" --scheme complementary,triadic\n  python3 generate_palette.py --color \"#3498DB\" --convert\n  python3 generate_palette.py --color \"#FFFFFF\" --contrast \"#3498DB\"\n  python3 generate_palette.py --color \"#3498DB\" --format css\n  python3 generate_palette.py --color \"#3498DB\" --format tailwind\n  python3 generate_palette.py --color \"#3498DB\" --save palette.json\n  python3 generate_palette.py --load palette.json\n  python3 generate_palette.py --color \"#3498DB\" --format json\n\"\"\"\n\nimport argparse\nimport json\nimport math\nimport os\nimport re\nimport sys\nfrom typing import Dict, List, Optional, Tuple\n\n\n# ============================================================\n# 颜色解析\n# ============================================================\n\ndef parse_color(color_str: str) -> Tuple[int, int, int]:\n    \"\"\"解析颜色字符串，返回 (R, G, B)\"\"\"\n    s = color_str.strip()\n\n    # HEX 格式: #RRGGBB 或 #RGB\n    hex_match = re.match(r'^#?([0-9a-fA-F]{3}|[0-9a-fA-F]{6})$', s)\n    if hex_match:\n        hex_val = hex_match.group(1)\n        if len(hex_val) == 3:\n            hex_val = ''.join(c * 2 for c in hex_val)\n        return (int(hex_val[0:2], 16), int(hex_val[2:4], 16), int(hex_val[4:6], 16))\n\n    # RGB 格式: rgb(r, g, b)\n    rgb_match = re.match(r'^rgba?\\(\\s*(\\d+)\\s*,\\s*(\\d+)\\s*,\\s*(\\d+)', s, re.IGNORECASE)\n    if rgb_match:\n        r = max(0, min(255, int(rgb_match.group(1))))\n        g = max(0, min(255, int(rgb_match.group(2))))\n        b = max(0, min(255, int(rgb_match.group(3))))\n        return (r, g, b)\n\n    # HSL 格式: hsl(h, s%, l%)\n    hsl_match = re.match(r'^hsla?\\(\\s*(\\d+(?:\\.\\d+)?)\\s*,\\s*(\\d+(?:\\.\\d+)?)\\s*%?\\s*,\\s*(\\d+(?:\\.\\d+)?)\\s*%?', s, re.IGNORECASE)\n    if hsl_match:\n        h = float(hsl_match.group(1)) % 360\n        s_pct = float(hsl_match.group(2)) / 100.0\n        l_pct = float(hsl_match.group(3)) / 100.0\n        return hsl_to_rgb(h, s_pct, l_pct)\n\n    raise ValueError(f\"无法解析颜色：{color_str}。支持格式：#RRGGBB, rgb(r,g,b), hsl(h,s%,l%)\")\n\n\n# ============================================================\n# 颜色格式转换\n# ============================================================\n\ndef rgb_to_hex(r: int, g: int, b: int) -> str:\n    \"\"\"RGB 转 HEX\"\"\"\n    return f\"#{r:02X}{g:02X}{b:02X}\"\n\n\ndef rgb_to_hsl(r: int, g: int, b: int) -> Tuple[float, float, float]:\n    \"\"\"RGB 转 HSL，返回 (H[0-360], S[0-1], L[0-1])\"\"\"\n    r_f, g_f, b_f = r / 255.0, g / 255.0, b / 255.0\n    max_val = max(r_f, g_f, b_f)\n    min_val = min(r_f, g_f, b_f)\n    h, s, l = 0, 0, (max_val + min_val) / 2\n\n    if max_val != min_val:\n        d = max_val - min_val\n        s = d / (2 - max_val - min_val) if l > 0.5 else d / (max_val + min_val)\n        if max_val == r_f:\n            h = (g_f - b_f) / d + (6 if g_f < b_f else 0)\n        elif max_val == g_f:\n            h = (b_f - r_f) / d + 2\n        else:\n            h = (r_f - g_f) / d + 4\n        h /= 6\n\n    return (h * 360, s, l)\n\n\ndef hsl_to_rgb(h: float, s: float, l: float) -> Tuple[int, int, int]:\n    \"\"\"HSL 转 RGB\"\"\"\n    h = h % 360\n    c = (1 - abs(2 * l - 1)) * s\n    x = c * (1 - abs((h / 60) % 2 - 1))\n    m = l - c / 2\n\n    if h < 60:\n        r1, g1, b1 = c, x, 0\n    elif h < 120:\n        r1, g1, b1 = x, c, 0\n    elif h < 180:\n        r1, g1, b1 = 0, c, x\n    elif h < 240:\n        r1, g1, b1 = 0, x, c\n    elif h < 300:\n        r1, g1, b1 = x, 0, c\n    else:\n        r1, g1, b1 = c, 0, x\n\n    return (\n        int(round((r1 + m) * 255)),\n        int(round((g1 + m) * 255)),\n        int(round((b1 + m) * 255)),\n    )\n\n\ndef rgb_to_hsv(r: int, g: int, b: int) -> Tuple[float, float, float]:\n    \"\"\"RGB 转 HSV，返回 (H[0-360], S[0-1], V[0-1])\"\"\"\n    r_f, g_f, b_f = r / 255.0, g / 255.0, b / 255.0\n    max_val = max(r_f, g_f, b_f)\n    min_val = min(r_f, g_f, b_f)\n    d = max_val - min_val\n    h = 0\n    s = 0 if max_val == 0 else d / max_val\n    v = max_val\n\n    if d != 0:\n        if max_val == r_f:\n            h = ((g_f - b_f) / d) % 6\n        elif max_val == g_f:\n            h = (b_f - r_f) / d + 2\n        else:\n            h = (r_f - g_f) / d + 4\n        h *= 60\n\n    return (h, s, v)\n\n\ndef format_color_info(r: int, g: int, b: int) -> Dict:\n    \"\"\"格式化颜色信息\"\"\"\n    h, s, l = rgb_to_hsl(r, g, b)\n    hv, sv, vv = rgb_to_hsv(r, g, b)\n    return {\n        \"hex\": rgb_to_hex(r, g, b),\n        \"rgb\": f\"rgb({r},{g},{b})\",\n        \"hsl\": f\"hsl({h:.0f},{s*100:.0f}%,{l*100:.0f}%)\",\n        \"hsv\": f\"hsv({hv:.0f},{sv*100:.0f}%,{vv*100:.0f}%)\",\n        \"r\": r, \"g\": g, \"b\": b,\n        \"h\": h, \"s\": s, \"l\": l,\n    }\n\n\n# ============================================================\n# 配色方案生成\n# ============================================================\n\ndef generate_complementary(r: int, g: int, b: int) -> List[Tuple[int, int, int]]:\n    \"\"\"互补色：基础色 + 180° 对面色\"\"\"\n    h, s, l = rgb_to_hsl(r, g, b)\n    h2 = (h + 180) % 360\n    return [(r, g, b), hsl_to_rgb(h2, s, l)]\n\n\ndef generate_analogous(r: int, g: int, b: int) -> List[Tuple[int, int, int]]:\n    \"\"\"类比色：基础色 ± 30° 相邻色\"\"\"\n    h, s, l = rgb_to_hsl(r, g, b)\n    return [\n        hsl_to_rgb((h - 30) % 360, s, l),\n        (r, g, b),\n        hsl_to_rgb((h + 30) % 360, s, l),\n    ]\n\n\ndef generate_triadic(r: int, g: int, b: int) -> List[Tuple[int, int, int]]:\n    \"\"\"三角色：等距 120°\"\"\"\n    h, s, l = rgb_to_hsl(r, g, b)\n    return [\n        (r, g, b),\n        hsl_to_rgb((h + 120) % 360, s, l),\n        hsl_to_rgb((h + 240) % 360, s, l),\n    ]\n\n\ndef generate_tetradic(r: int, g: int, b: int) -> List[Tuple[int, int, int]]:\n    \"\"\"四角色：等距 90°\"\"\"\n    h, s, l = rgb_to_hsl(r, g, b)\n    return [\n        (r, g, b),\n        hsl_to_rgb((h + 90) % 360, s, l),\n        hsl_to_rgb((h + 180) % 360, s, l),\n        hsl_to_rgb((h + 270) % 360, s, l),\n    ]\n\n\ndef generate_split_complementary(r: int, g: int, b: int) -> List[Tuple[int, int, int]]:\n    \"\"\"分裂互补：基础色 + 互补色 ± 30°\"\"\"\n    h, s, l = rgb_to_hsl(r, g, b)\n    return [\n        (r, g, b),\n        hsl_to_rgb((h + 150) % 360, s, l),\n        hsl_to_rgb((h + 210) % 360, s, l),\n    ]\n\n\ndef generate_monochromatic(r: int, g: int, b: int) -> List[Tuple[int, int, int]]:\n    \"\"\"单色渐变：同一色相的 5 个明度阶梯\"\"\"\n    h, s, _ = rgb_to_hsl(r, g, b)\n    lightnesses = [0.20, 0.35, 0.50, 0.65, 0.80]\n    return [hsl_to_rgb(h, s, l) for l in lightnesses]\n\n\nSCHEME_GENERATORS = {\n    \"complementary\": (\"互补色\", generate_complementary),\n    \"analogous\": (\"类比色\", generate_analogous),\n    \"triadic\": (\"三角色\", generate_triadic),\n    \"tetradic\": (\"四角色\", generate_tetradic),\n    \"split-complementary\": (\"分裂互补\", generate_split_complementary),\n    \"monochromatic\": (\"单色渐变\", generate_monochromatic),\n}\n\n\n# ============================================================\n# WCAG 对比度计算\n# ============================================================\n\ndef relative_luminance(r: int, g: int, b: int) -> float:\n    \"\"\"计算相对亮度（WCAG 2.1）\"\"\"\n    def channel(c: int) -> float:\n        c_srgb = c / 255.0\n        return c_srgb / 12.92 if c_srgb <= 0.03928 else ((c_srgb + 0.055) / 1.055) ** 2.4\n\n    return 0.2126 * channel(r) + 0.7152 * channel(g) + 0.0722 * channel(b)\n\n\ndef contrast_ratio(color1: Tuple[int, int, int], color2: Tuple[int, int, int]) -> float:\n    \"\"\"计算两个颜色的对比度比率\"\"\"\n    l1 = relative_luminance(*color1)\n    l2 = relative_luminance(*color2)\n    lighter = max(l1, l2)\n    darker = min(l1, l2)\n    return (lighter + 0.05) / (darker + 0.05)\n\n\ndef check_accessibility(ratio: float) -> Dict[str, bool]:\n    \"\"\"检查无障碍合规性\"\"\"\n    return {\n        \"aa_large\": ratio >= 3.0,\n        \"aa_normal\": ratio >= 4.5,\n        \"aaa_large\": ratio >= 4.5,\n        \"aaa_normal\": ratio >= 7.0,\n    }\n\n\ndef suggest_improvement(fg: Tuple[int, int, int], bg: Tuple[int, int, int],\n                         target: float = 4.5) -> Optional[Tuple[int, int, int]]:\n    \"\"\"建议调整背景色以达到目标对比度\"\"\"\n    # 尝试加深或变亮背景色\n    h, s, l = rgb_to_hsl(*bg)\n    best = None\n    best_ratio = contrast_ratio(fg, bg)\n\n    # 尝试调整明度\n    for delta in range(5, 50, 5):\n        for direction in [-1, 1]:\n            new_l = max(0.05, min(0.95, l + direction * delta / 100.0))\n            new_bg = hsl_to_rgb(h, s, new_l)\n            r = contrast_ratio(fg, new_bg)\n            if r >= target and (best is None or abs(new_l - l) < abs(rgb_to_hsl(*best)[2] - l)):\n                best = new_bg\n                best_ratio = r\n\n    return best\n\n\n# ============================================================\n# 输出生成\n# ============================================================\n\ndef ansi_color_block(r: int, g: int, b: int, width: int = 8) -> str:\n    \"\"\"生成 ANSI 真彩色背景块\"\"\"\n    return f\"\\033[48;2;{r};{g};{b}m{' ' * width}\\033[0m\"\n\n\ndef format_palette(r: int, g: int, b: int, schemes: Optional[List[str]] = None) -> str:\n    \"\"\"格式化配色方案输出\"\"\"\n    lines = []\n    info = format_color_info(r, g, b)\n\n    lines.append(\"🎨 配色方案生成\")\n    lines.append(\"━\" * 50)\n    lines.append(f\"基础颜色：{info['hex']}\")\n    lines.append(f\"  RGB: {info['rgb']}\")\n    lines.append(f\"  HSL: {info['hsl']}\")\n    lines.append(f\"  HSV: {info['hsv']}\")\n    lines.append(\"\")\n\n    scheme_list = schemes if schemes else list(SCHEME_GENERATORS.keys())\n\n    for scheme_key in scheme_list:\n        if scheme_key not in SCHEME_GENERATORS:\n            continue\n        name, generator = SCHEME_GENERATORS[scheme_key]\n        colors = generator(r, g, b)\n\n        lines.append(f\"【{name} {scheme_key.capitalize()}】\")\n        for i, (cr, cg, cb) in enumerate(colors):\n            ci = format_color_info(cr, cg, cb)\n            label = \"主色\" if i == 0 else f\"{scheme_key}-{i}\"\n            block = ansi_color_block(cr, cg, cb)\n            lines.append(f\"  {ci['hex']}  {block}  {label}\")\n        lines.append(\"\")\n\n    lines.append(\"━\" * 50)\n    return \"\\n\".join(lines)\n\n\ndef format_conversion(r: int, g: int, b: int) -> str:\n    \"\"\"格式化颜色转换输出\"\"\"\n    info = format_color_info(r, g, b)\n    lines = []\n    lines.append(\"🔄 颜色格式转换\")\n    lines.append(\"━\" * 50)\n    lines.append(f\"  HEX: {info['hex']}\")\n    lines.append(f\"  RGB: {info['rgb']}\")\n    lines.append(f\"  HSL: {info['hsl']}\")\n    lines.append(f\"  HSV: {info['hsv']}\")\n    lines.append(\"\")\n    lines.append(f\"  R = {info['r']}, G = {info['g']}, B = {info['b']}\")\n    lines.append(f\"  H = {info['h']:.1f}°, S = {info['s']*100:.1f}%, L = {info['l']*100:.1f}%\")\n    lines.append(\"━\" * 50)\n    return \"\\n\".join(lines)\n\n\ndef format_contrast(fg: Tuple[int, int, int], bg: Tuple[int, int, int]) -> str:\n    \"\"\"格式化对比度检查输出\"\"\"\n    fg_info = format_color_info(*fg)\n    bg_info = format_color_info(*bg)\n    ratio = contrast_ratio(fg, bg)\n    acc = check_accessibility(ratio)\n\n    lines = []\n    lines.append(\"📊 对比度检查\")\n    lines.append(\"━\" * 50)\n    lines.append(f\"前景色：{fg_info['hex']} {ansi_color_block(*fg)}\")\n    lines.append(f\"背景色：{bg_info['hex']} {ansi_color_block(*bg)}\")\n    lines.append(\"\")\n    lines.append(f\"对比度比率：{ratio:.2f} : 1\")\n    lines.append(\"\")\n    lines.append(\"无障碍合规性（WCAG 2.1）：\")\n    lines.append(f\"  {'✅' if acc['aa_large'] else '❌'} AA 大文本：{'通过' if acc['aa_large'] else '未通过'} (需要 ≥ 3:1)\")\n    lines.append(f\"  {'✅' if acc['aa_normal'] else '❌'} AA 普通文本：{'通过' if acc['aa_normal'] else '未通过'} (需要 ≥ 4.5:1)\")\n    lines.append(f\"  {'✅' if acc['aaa_large'] else '❌'} AAA 大文本：{'通过' if acc['aaa_large'] else '未通过'} (需要 ≥ 4.5:1)\")\n    lines.append(f\"  {'✅' if acc['aaa_normal'] else '❌'} AAA 普通文本：{'通过' if acc['aaa_normal'] else '未通过'} (需要 ≥ 7:1)\")\n    lines.append(\"\")\n\n    if not acc['aa_normal']:\n        suggestion = suggest_improvement(fg, bg, 4.5)\n        if suggestion:\n            si = format_color_info(*suggestion)\n            new_ratio = contrast_ratio(fg, suggestion)\n            lines.append(\"💡 改进建议：\")\n            lines.append(f\"  将背景色调整为 {si['hex']} {ansi_color_block(*suggestion)}\")\n            lines.append(f\"  新对比度：{new_ratio:.2f} : 1（通过 AA 普通文本）\")\n            lines.append(\"\")\n\n    lines.append(\"━\" * 50)\n    return \"\\n\".join(lines)\n\n\ndef generate_css(r: int, g: int, b: int) -> str:\n    \"\"\"生成 CSS 变量\"\"\"\n    info = format_color_info(r, g, b)\n    h, s, l = rgb_to_hsl(r, g, b)\n    comp = generate_complementary(r, g, b)[1]\n    comp_info = format_color_info(*comp)\n    light = hsl_to_rgb(h, s, min(0.85, l + 0.15))\n    dark = hsl_to_rgb(h, s, max(0.15, l - 0.15))\n    light_info = format_color_info(*light)\n    dark_info = format_color_info(*dark)\n\n    return f\"\"\":root {{\n  /* 主色 */\n  --color-primary: {info['hex']};\n  --color-primary-light: {light_info['hex']};\n  --color-primary-dark: {dark_info['hex']};\n\n  /* 互补色 */\n  --color-complementary: {comp_info['hex']};\n\n  /* 中性色 */\n  --color-bg: #F8F9FA;\n  --color-surface: #FFFFFF;\n  --color-text: #2C3E50;\n  --color-text-muted: #7F8C8D;\n  --color-border: #E9ECEF;\n\n  /* 语义色 */\n  --color-success: #28A745;\n  --color-warning: #FFC107;\n  --color-danger: #DC3545;\n  --color-info: {info['hex']};\n}}\"\"\"\n\n\ndef generate_tailwind(r: int, g: int, b: int) -> str:\n    \"\"\"生成 Tailwind 配色配置（50-900 色阶）\"\"\"\n    h, s, _ = rgb_to_hsl(r, g, b)\n    shades = [\n        (50, 0.95), (100, 0.88), (200, 0.78), (300, 0.68),\n        (400, 0.58), (500, 0.50), (600, 0.42), (700, 0.34),\n        (800, 0.26), (900, 0.18),\n    ]\n\n    lines = [\"module.exports = {\", \"  theme: {\", \"    extend: {\", \"      colors: {\", \"        primary: {\"]\n    for level, lightness in shades:\n        color = hsl_to_rgb(h, s, lightness)\n        hex_val = rgb_to_hex(*color)\n        lines.append(f\"          {level}: '{hex_val}',\")\n    lines.append(\"        },\")\n    lines.append(\"      },\")\n    lines.append(\"    },\")\n    lines.append(\"  },\")\n    lines.append(\"}\")\n    return \"\\n\".join(lines)\n\n\ndef palette_to_dict(r: int, g: int, b: int) -> Dict:\n    \"\"\"将配色方案转为字典\"\"\"\n    result = {\"base\": format_color_info(r, g, b), \"schemes\": {}}\n    for key, (name, generator) in SCHEME_GENERATORS.items():\n        colors = generator(r, g, b)\n        result[\"schemes\"][key] = {\n            \"name\": name,\n            \"colors\": [format_color_info(*c) for c in colors],\n        }\n    return result\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"配色方案生成工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--color\", \"-c\", help=\"基础颜色（HEX/RGB/HSL 格式）\")\n    parser.add_argument(\"--scheme\", \"-s\", default=\"\",\n                        help=\"配色方案类型（逗号分隔）：complementary,analogous,triadic,tetradic,split-complementary,monochromatic\")\n    parser.add_argument(\"--convert\", action=\"store_true\", help=\"颜色格式转换\")\n    parser.add_argument(\"--contrast\", metavar=\"BG_COLOR\", help=\"对比度检查（背景色）\")\n    parser.add_argument(\"--format\", \"-f\", choices=[\"text\", \"css\", \"tailwind\", \"json\"],\n                        default=\"text\", help=\"输出格式\")\n    parser.add_argument(\"--save\", metavar=\"FILE\", help=\"保存配色方案到 JSON 文件\")\n    parser.add_argument(\"--load\", metavar=\"FILE\", help=\"从 JSON 文件加载配色方案\")\n    args = parser.parse_args()\n\n    # 加载模式\n    if args.load:\n        if not os.path.exists(args.load):\n            print(f\"错误：文件不存在：{args.load}\", file=sys.stderr)\n            sys.exit(1)\n        with open(args.load, 'r', encoding='utf-8') as f:\n            data = json.load(f)\n        print(json.dumps(data, ensure_ascii=False, indent=2))\n        return\n\n    if not args.color:\n        print(\"错误：请使用 --color 指定基础颜色\", file=sys.stderr)\n        parser.print_help()\n        sys.exit(1)\n\n    # 解析颜色\n    try:\n        r, g, b = parse_color(args.color)\n    except ValueError as e:\n        print(f\"错误：{e}\", file=sys.stderr)\n        sys.exit(1)\n\n    # 对比度检查\n    if args.contrast:\n        try:\n            bg_r, bg_g, bg_b = parse_color(args.contrast)\n        except ValueError as e:\n            print(f\"错误：{e}\", file=sys.stderr)\n            sys.exit(1)\n        output = format_contrast((r, g, b), (bg_r, bg_g, bg_b))\n        print(output)\n        return\n\n    # 颜色格式转换\n    if args.convert:\n        print(format_conversion(r, g, b))\n        return\n\n    # 解析方案类型\n    schemes = None\n    if args.scheme:\n        schemes = [s.strip() for s in args.scheme.split(\",\") if s.strip()]\n\n    # 输出格式\n    if args.format == \"css\":\n        print(generate_css(r, g, b))\n    elif args.format == \"tailwind\":\n        print(generate_tailwind(r, g, b))\n    elif args.format == \"json\":\n        print(json.dumps(palette_to_dict(r, g, b), ensure_ascii=False, indent=2))\n    else:\n        print(format_palette(r, g, b, schemes))\n\n    # 保存\n    if args.save:\n        data = palette_to_dict(r, g, b)\n        with open(args.save, 'w', encoding='utf-8') as f:\n            json.dump(data, f, ensure_ascii=False, indent=2)\n        print(f\"\\n已保存到：{args.save}\", file=sys.stderr)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-css-variables.css": ":root {\n  /* 主色 */\n  --color-primary: #3498DB;\n  --color-primary-light: #75B9E7;\n  --color-primary-dark: #1D6FA5;\n\n  /* 互补色 */\n  --color-complementary: #DB7734;\n\n  /* 中性色 */\n  --color-bg: #F8F9FA;\n  --color-surface: #FFFFFF;\n  --color-text: #2C3E50;\n  --color-text-muted: #7F8C8D;\n  --color-border: #E9ECEF;\n\n  /* 语义色 */\n  --color-success: #28A745;\n  --color-warning: #FFC107;\n  --color-danger: #DC3545;\n  --color-info: #3498DB;\n}\n", "examples/sample-palette.json": "{\n  \"base\": {\n    \"hex\": \"#3498DB\",\n    \"rgb\": \"rgb(52,152,219)\",\n    \"hsl\": \"hsl(204,70%,53%)\",\n    \"hsv\": \"hsv(204,76%,86%)\",\n    \"r\": 52,\n    \"g\": 152,\n    \"b\": 219,\n    \"h\": 204.07185628742513,\n    \"s\": 0.6987447698744769,\n    \"l\": 0.5313725490196078\n  },\n  \"schemes\": {\n    \"complementary\": {\n      \"name\": \"互补色\",\n      \"colors\": [\n        {\n          \"hex\": \"#3498DB\",\n          \"rgb\": \"rgb(52,152,219)\",\n          \"hsl\": \"hsl(204,70%,53%)\",\n          \"hsv\": \"hsv(204,76%,86%)\",\n          \"r\": 52,\n          \"g\": 152,\n          \"b\": 219,\n          \"h\": 204.07185628742513,\n          \"s\": 0.6987447698744769,\n          \"l\": 0.5313725490196078\n        },\n        {\n          \"hex\": \"#DB7734\",\n          \"rgb\": \"rgb(219,119,52)\",\n          \"hsl\": \"hsl(24,70%,53%)\",\n          \"hsv\": \"hsv(24,76%,86%)\",\n          \"r\": 219,\n          \"g\": 119,\n          \"b\": 52,\n          \"h\": 24.071856287425152,\n          \"s\": 0.6987447698744769,\n          \"l\": 0.5313725490196078\n        }\n      ]\n    },\n    \"analogous\": {\n      \"name\": \"类比色\",\n      \"colors\": [\n        {\n          \"hex\": \"#34DBCA\",\n          \"rgb\": \"rgb(52,219,202)\",\n          \"hsl\": \"hsl(174,70%,53%)\",\n          \"hsv\": \"hsv(174,76%,86%)\",\n          \"r 说「帮我看看这个编译错误」「这个报错怎么解决」\n3. 用户说「gcc 报错看不懂」「clang 错误解释一下」\n4. 用户上传包含编译输出的文本文件\n5. 用户说「总结一下我常犯的编译错误」\n6. 用户说「这个 undefined reference 是什么」\n7. 用户说「expected 开头的错误怎么修」\n\n## 三、支持的错误类型\n\n### 3.1 语法错误（Syntax）\n\n| 错误模式 | 说明 |\n|---|---|\n| `expected ';' before` | 缺少分号 |\n| `expected '}' at end of input` | 缺少右大括号 |\n| `expected unqualified-id before` | 语法位置错误 |\n| `expected primary-expression before` | 表达式不完整 |\n| `expected constructor, destructor, or type conversion` | 函数定义语法错误 |\n| `stray '\\xxx' in program` | 非法字符（中文标点等） |\n\n### 3.2 声明与作用域错误（Declaration/Scope）\n\n| 错误模式 | 说明 |\n|---|---|\n| `was not declared in this scope` | 变量/函数未声明 |\n| `does not name a type` | 类型名错误或缺少头文件 |\n| `redefinition of` | 重复定义 |\n| `previous declaration of` | 与之前声明冲突 |\n| `is not a member of` | 类/命名空间中无此成员 |\n| `'xxx' has not been declared` | 名称未声明 |\n\n### 3.3 类型错误（Type）\n\n| 错误模式 | 说明 |\n|---|---|\n| `invalid conversion from` | 类型转换不合法 |\n| `no matching function for call to` | 函数参数不匹配 |\n| `cannot convert` | 类型无法转换 |\n| `ambiguous overload for` | 重载歧义 |\n| `no type named in` | 类型不存在 |\n| `incompatible types in assignment` | 赋值类型不兼容 |\n\n### 3.4 链接错误（Linker）\n\n| 错误模式 | 说明 |\n|---|---|\n| `undefined reference to` | 函数/变量未定义（只有声明没有实现） |\n| `multiple definition of` | 重复定义 |\n| `relocation truncated to fit` | 代码段过大（大模型问题） |\n| `ld returned 1 exit status` | 链接失败汇总 |\n\n### 3.5 头文件与文件错误（Header/File）\n\n| 错误模式 | 说明 |\n|---|---|\n| `fatal error: xxx: No such file or directory` | 头文件不存在 |\n| `error: xxx: Permission denied` | 文件权限不足 |\n| `fatal error: too many errors emitted` | 错误过多停止编译 |\n\n### 3.6 警告（Warning）\n\n| 警告模式 | 说明 |\n|---|---|\n| `unused variable` | 变量声明未使用 |\n| `unused function` | 函数定义未使用 |\n| `control reaches end of non-void function` | 非 void 函数缺少 return |\n| `division by zero` | 除零 |\n| `array subscript is above array bounds` | 数组越界 |\n| `format expects argument of type` | printf/scanf 格式不匹配 |\n| `implicit declaration of function` | 函数隐式声明（C 语言） |\n| `return type defaults to 'int'` | 返回类型默认 int（C 语言） |\n\n## 四、操作步骤\n\n### 步骤 1：获取编译输出\n\n- 用户直接粘贴编译报错文本\n- 或用户上传包含编译输出的文件\n- 或通过管道传入：`g++ main.cpp 2>&1 | python3 decode_errors.py`\n\n### 步骤 2：运行脚本\n\n使用 `scripts/decode_errors.py`：\n\n```bash\n# 从文件读取编译输出\npython3 scripts/decode_errors.py --file compile_output.txt\n\n# 从标准输入读取\ng++ main.cpp 2>&1 | python3 scripts/decode_errors.py\n\n# 只显示错误（忽略警告）\npython3 scripts/decode_errors.py --file output.txt --no-warnings\n\n# 显示前 N 条错误\npython3 scripts/decode_errors.py --file output.txt --limit 10\n\n# JSON 格式输出\npython3 scripts/decode_errors.py --file output.txt --format json\n\n# 生成学习笔记\npython3 scripts/decode_errors.py --file output.txt --notes\n```\n\n### 步骤 3：解读结果\n\n- **错误统计**：错误/警告数量、类型分布\n- **逐条解码**：原始错误、中文解释、修复建议、代码示例\n- **高频易错点**：标记最常出现的错误类型\n- **学习笔记**：总结错误规律和预防方法\n\n### 步骤 4：安全提示\n\n1. 本技能只解释错误，不自动修改代码\n2. 修复建议仅供参考，请结合实际代码判断\n3. 某些错误可能是由之前的错误连锁引起的，建议从第一条错误开始修\n4. 警告也可能隐藏严重问题，不要忽视\n\n## 五、输出规范\n\n### 5.1 解码报告\n\n```\n🔍 编译错误解码报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n源文件：compile_output.txt\n错误数：3\n警告数：2\n编译器：GCC/Clang\n\n📊 错误类型分布：\n  语法错误：1 个\n  声明错误：1 个\n  链接错误：1 个\n\n━━━━━━━━━━━━━━━━━━━━━━━━\n❌ 错误 1/3（语法错误）\n━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:5:18\n📝 原始：error: expected ';' before '}' token\n💡 中文解释：\n  第 5 行第 18 列缺少分号。编译器在遇到 '}' 时期望前面有\n  分号结尾，通常是上一行语句忘记写分号。\n🔧 修复建议：\n  检查第 5 行附近的语句，确保每条语句以分号结尾。\n  错误示例：\n    int x = 5    // ← 缺少分号\n    }\n  正确写法：\n    int x = 5;   // ← 加上分号\n    }\n\n━━━━━━━━━━━━━━━━━━━━━━━━\n❌ 错误 2/3（声明错误）\n━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:8:5\n📝 原始：error: 'cout' was not declared in this scope\n💡 中文解释：\n  'cout' 在当前作用域中未声明。cout 是 std 命名空间中的\n  对象，需要包含 <iostream> 头文件并使用 std::cout 或\n  using namespace std。\n🔧 修复建议：\n  1. 确保文件开头包含 #include <iostream>\n  2. 使用 std::cout 代替 cout，或添加 using namespace std;\n  错误示例：\n    #include <iostream>\n    int main() {\n        cout << \"hello\";  // ← 缺少 std:: 前缀\n    }\n  正确写法：\n    #include <iostream>\n    int main() {\n        std::cout << \"hello\";  // ← 加上 std:: 前缀\n    }\n\n━━━━━━━━━━━━━━━━━━━━━━━━\n⚠️  警告 1/2\n━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:12:9\n📝 原始：warning: unused variable 'x' [-Wunused-variable]\n💡 中文解释：\n  变量 'x' 声明了但从未使用。这可能是忘记使用，也可能\n  是调试时遗留的代码。\n🔧 修复建议：\n  - 如果确实不需要，删除该变量声明\n  - 如果需要使用，补充使用逻辑\n  - 如果是有意保留，可加 (void)x; 消除警告\n\n📚 学习笔记：\n  本次编译最常见的错误类型是：语法错误\n  建议重点复习：语句结尾分号、命名空间使用\n  预防方法：\n  1. 写完一行语句立即加分号\n  2. 使用标准库函数前确认包含对应头文件\n  3. 养成使用 std:: 前缀的习惯\n```\n\n## 六、常见场景处理\n\n### 场景 1：初学者看不懂报错\n**用户**：「这个 expected ';' before 是什么意思啊」\n**处理**：解析错误 → 中文解释 → 给出代码对比示例 → 提醒检查上一行。\n\n### 场景 2：大量错误不知从何下手\n**用户**：「一下报了 20 个错误，怎么改」\n**处理**：统计错误类型 → 指出第一条错误往往是根源 → 建议逐条修复重新编译。\n\n### 场景 3：链接错误 undefined reference\n**用户**：「undefined reference to 是什么，代码明明写了函数」\n**处理**：解释声明与定义的区别 → 检查函数实现是否编译链接 → 检查函数签名是否一致。\n\n### 场景 4：头文件找不到\n**用户**：「fatal error: iostream: No such file or directory」\n**处理**：检查头文件拼写 → 确认编译器是否正确安装 → 检查 include 路径。\n\n### 场景 5：总结常犯错误\n**用户**：「帮我总结一下我这些错误的规律」\n**处理**：统计错误类型分布 → 标记高频错误 → 生成学习笔记和预防建议。\n\n## 七、注意事项\n\n1. **错误连锁反应**：一个语法错误可能引发后续多条错误，建议从第一条开始修，修完重新编译。\n2. **警告不可忽视**：某些警告（如数组越界、除零）可能导致运行时崩溃。\n3. **行号定位**：错误行号可能指向错误发生的下一行，需要结合上下文判断。\n4. **编译器差异**：GCC 和 Clang 的错误信息格式略有不同，本技能兼容两种主要格式。\n5. **中文标点**：代码中混入中文分号、引号会导致 `stray` 错误，注意区分中英文标点。\n6. **不修改代码**：本技能只提供解释和建议，不自动修改用户代码。\n7. **模式匹配局限**：无法匹配所有可能的错误信息，未匹配的错误会原样显示并标注\"未识别模式\"。\n8. **C 与 C++**：部分错误（如 implicit declaration）只在 C 语言中出现，C++ 中会直接报错。\n9. **模板错误**：C++ 模板错误信息通常很长且复杂，本技能会提取关键信息。\n10. **建议仅供参考**：修复建议基于常见模式，具体修复需结合实际代码上下文。\n\n## 八、文件结构\n\n```\ncompile-error-decoder/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── error-patterns-reference.md       # 错误模式速查表\n├── scripts/\n│   └── decode_errors.py                  # 错误解码脚本（含 50+ 模式数据库）\n└── examples/\n    ├── sample-compile-output.txt          # 示例编译输出（含多种错误）\n    └── sample-decode-report.md            # 示例解码报告\n```\n\n## 九、使用示例\n\n### 示例 1：快速解码\n**用户**：粘贴编译报错\n**AI**：运行 `--file output.txt` → 输出逐条解码报告。\n\n### 示例 2：管道传入\n**用户**：「帮我看看编译结果」\n**AI**：运行 `g++ main.cpp 2>&1 | python3 decode_errors.py` → 实时解码。\n\n### 示例 3：生成学习笔记\n**用户**：「总结一下这些错误」\n**AI**：运行 `--notes` → 输出错误规律总结和预防建议。\n", "files": {"SKILL.md": "---\nname: compile-error-decoder\ndescription: '编译错误解码助手。解析 GCC/Clang 等编译器的错误输出，自动识别 50+ 种常见错误模式（语法错误、类型不匹配、未声明、链接错误、头文件缺失、警告等），用中文通俗解释每条错误的原因，给出具体的修复建议和代码示例，统计错误类型分布，标记高频易错点，生成学习笔记。适用于 C/C++ 初学者排查编译错误、理解报错信息、总结常见错误规律。'\n---\n\n# 编译错误解码助手\n\n## 一、技能定位\n\n本技能用于**解析和解释编译器错误输出**。核心价值：\n\n- 自动识别 50+ 种 GCC/Clang 常见错误模式\n- 用中文通俗解释每条错误的根本原因\n- 给出具体的修复建议和代码对比示例\n- 统计错误类型分布，找出薄弱环节\n- 标记高频易错点，生成学习笔记\n- 支持从文件读取编译输出或管道传入\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户粘贴编译报错信息，说「这是什么意思」「怎么改」\n2. 用户说「帮我看看这个编译错误」「这个报错怎么解决」\n3. 用户说「gcc 报错看不懂」「clang 错误解释一下」\n4. 用户上传包含编译输出的文本文件\n5. 用户说「总结一下我常犯的编译错误」\n6. 用户说「这个 undefined reference 是什么」\n7. 用户说「expected 开头的错误怎么修」\n\n## 三、支持的错误类型\n\n### 3.1 语法错误（Syntax）\n\n| 错误模式 | 说明 |\n|---|---|\n| `expected ';' before` | 缺少分号 |\n| `expected '}' at end of input` | 缺少右大括号 |\n| `expected unqualified-id before` | 语法位置错误 |\n| `expected primary-expression before` | 表达式不完整 |\n| `expected constructor, destructor, or type conversion` | 函数定义语法错误 |\n| `stray '\\xxx' in program` | 非法字符（中文标点等） |\n\n### 3.2 声明与作用域错误（Declaration/Scope）\n\n| 错误模式 | 说明 |\n|---|---|\n| `was not declared in this scope` | 变量/函数未声明 |\n| `does not name a type` | 类型名错误或缺少头文件 |\n| `redefinition of` | 重复定义 |\n| `previous declaration of` | 与之前声明冲突 |\n| `is not a member of` | 类/命名空间中无此成员 |\n| `'xxx' has not been declared` | 名称未声明 |\n\n### 3.3 类型错误（Type）\n\n| 错误模式 | 说明 |\n|---|---|\n| `invalid conversion from` | 类型转换不合法 |\n| `no matching function for call to` | 函数参数不匹配 |\n| `cannot convert` | 类型无法转换 |\n| `ambiguous overload for` | 重载歧义 |\n| `no type named in` | 类型不存在 |\n| `incompatible types in assignment` | 赋值类型不兼容 |\n\n### 3.4 链接错误（Linker）\n\n| 错误模式 | 说明 |\n|---|---|\n| `undefined reference to` | 函数/变量未定义（只有声明没有实现） |\n| `multiple definition of` | 重复定义 |\n| `relocation truncated to fit` | 代码段过大（大模型问题） |\n| `ld returned 1 exit status` | 链接失败汇总 |\n\n### 3.5 头文件与文件错误（Header/File）\n\n| 错误模式 | 说明 |\n|---|---|\n| `fatal error: xxx: No such file or directory` | 头文件不存在 |\n| `error: xxx: Permission denied` | 文件权限不足 |\n| `fatal error: too many errors emitted` | 错误过多停止编译 |\n\n### 3.6 警告（Warning）\n\n| 警告模式 | 说明 |\n|---|---|\n| `unused variable` | 变量声明未使用 |\n| `unused function` | 函数定义未使用 |\n| `control reaches end of non-void function` | 非 void 函数缺少 return |\n| `division by zero` | 除零 |\n| `array subscript is above array bounds` | 数组越界 |\n| `format expects argument of type` | printf/scanf 格式不匹配 |\n| `implicit declaration of function` | 函数隐式声明（C 语言） |\n| `return type defaults to 'int'` | 返回类型默认 int（C 语言） |\n\n## 四、操作步骤\n\n### 步骤 1：获取编译输出\n\n- 用户直接粘贴编译报错文本\n- 或用户上传包含编译输出的文件\n- 或通过管道传入：`g++ main.cpp 2>&1 | python3 decode_errors.py`\n\n### 步骤 2：运行脚本\n\n使用 `scripts/decode_errors.py`：\n\n```bash\n# 从文件读取编译输出\npython3 scripts/decode_errors.py --file compile_output.txt\n\n# 从标准输入读取\ng++ main.cpp 2>&1 | python3 scripts/decode_errors.py\n\n# 只显示错误（忽略警告）\npython3 scripts/decode_errors.py --file output.txt --no-warnings\n\n# 显示前 N 条错误\npython3 scripts/decode_errors.py --file output.txt --limit 10\n\n# JSON 格式输出\npython3 scripts/decode_errors.py --file output.txt --format json\n\n# 生成学习笔记\npython3 scripts/decode_errors.py --file output.txt --notes\n```\n\n### 步骤 3：解读结果\n\n- **错误统计**：错误/警告数量、类型分布\n- **逐条解码**：原始错误、中文解释、修复建议、代码示例\n- **高频易错点**：标记最常出现的错误类型\n- **学习笔记**：总结错误规律和预防方法\n\n### 步骤 4：安全提示\n\n1. 本技能只解释错误，不自动修改代码\n2. 修复建议仅供参考，请结合实际代码判断\n3. 某些错误可能是由之前的错误连锁引起的，建议从第一条错误开始修\n4. 警告也可能隐藏严重问题，不要忽视\n\n## 五、输出规范\n\n### 5.1 解码报告\n\n```\n🔍 编译错误解码报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n源文件：compile_output.txt\n错误数：3\n警告数：2\n编译器：GCC/Clang\n\n📊 错误类型分布：\n  语法错误：1 个\n  声明错误：1 个\n  链接错误：1 个\n\n━━━━━━━━━━━━━━━━━━━━━━━━\n❌ 错误 1/3（语法错误）\n━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:5:18\n📝 原始：error: expected ';' before '}' token\n💡 中文解释：\n  第 5 行第 18 列缺少分号。编译器在遇到 '}' 时期望前面有\n  分号结尾，通常是上一行语句忘记写分号。\n🔧 修复建议：\n  检查第 5 行附近的语句，确保每条语句以分号结尾。\n  错误示例：\n    int x = 5    // ← 缺少分号\n    }\n  正确写法：\n    int x = 5;   // ← 加上分号\n    }\n\n━━━━━━━━━━━━━━━━━━━━━━━━\n❌ 错误 2/3（声明错误）\n━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:8:5\n📝 原始：error: 'cout' was not declared in this scope\n💡 中文解释：\n  'cout' 在当前作用域中未声明。cout 是 std 命名空间中的\n  对象，需要包含 <iostream> 头文件并使用 std::cout 或\n  using namespace std。\n🔧 修复建议：\n  1. 确保文件开头包含 #include <iostream>\n  2. 使用 std::cout 代替 cout，或添加 using namespace std;\n  错误示例：\n    #include <iostream>\n    int main() {\n        cout << \"hello\";  // ← 缺少 std:: 前缀\n    }\n  正确写法：\n    #include <iostream>\n    int main() {\n        std::cout << \"hello\";  // ← 加上 std:: 前缀\n    }\n\n━━━━━━━━━━━━━━━━━━━━━━━━\n⚠️  警告 1/2\n━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:12:9\n📝 原始：warning: unused variable 'x' [-Wunused-variable]\n💡 中文解释：\n  变量 'x' 声明了但从未使用。这可能是忘记使用，也可能\n  是调试时遗留的代码。\n🔧 修复建议：\n  - 如果确实不需要，删除该变量声明\n  - 如果需要使用，补充使用逻辑\n  - 如果是有意保留，可加 (void)x; 消除警告\n\n📚 学习笔记：\n  本次编译最常见的错误类型是：语法错误\n  建议重点复习：语句结尾分号、命名空间使用\n  预防方法：\n  1. 写完一行语句立即加分号\n  2. 使用标准库函数前确认包含对应头文件\n  3. 养成使用 std:: 前缀的习惯\n```\n\n## 六、常见场景处理\n\n### 场景 1：初学者看不懂报错\n**用户**：「这个 expected ';' before 是什么意思啊」\n**处理**：解析错误 → 中文解释 → 给出代码对比示例 → 提醒检查上一行。\n\n### 场景 2：大量错误不知从何下手\n**用户**：「一下报了 20 个错误，怎么改」\n**处理**：统计错误类型 → 指出第一条错误往往是根源 → 建议逐条修复重新编译。\n\n### 场景 3：链接错误 undefined reference\n**用户**：「undefined reference to 是什么，代码明明写了函数」\n**处理**：解释声明与定义的区别 → 检查函数实现是否编译链接 → 检查函数签名是否一致。\n\n### 场景 4：头文件找不到\n**用户**：「fatal error: iostream: No such file or directory」\n**处理**：检查头文件拼写 → 确认编译器是否正确安装 → 检查 include 路径。\n\n### 场景 5：总结常犯错误\n**用户**：「帮我总结一下我这些错误的规律」\n**处理**：统计错误类型分布 → 标记高频错误 → 生成学习笔记和预防建议。\n\n## 七、注意事项\n\n1. **错误连锁反应**：一个语法错误可能引发后续多条错误，建议从第一条开始修，修完重新编译。\n2. **警告不可忽视**：某些警告（如数组越界、除零）可能导致运行时崩溃。\n3. **行号定位**：错误行号可能指向错误发生的下一行，需要结合上下文判断。\n4. **编译器差异**：GCC 和 Clang 的错误信息格式略有不同，本技能兼容两种主要格式。\n5. **中文标点**：代码中混入中文分号、引号会导致 `stray` 错误，注意区分中英文标点。\n6. **不修改代码**：本技能只提供解释和建议，不自动修改用户代码。\n7. **模式匹配局限**：无法匹配所有可能的错误信息，未匹配的错误会原样显示并标注\"未识别模式\"。\n8. **C 与 C++**：部分错误（如 implicit declaration）只在 C 语言中出现，C++ 中会直接报错。\n9. **模板错误**：C++ 模板错误信息通常很长且复杂，本技能会提取关键信息。\n10. **建议仅供参考**：修复建议基于常见模式，具体修复需结合实际代码上下文。\n\n## 八、文件结构\n\n```\ncompile-error-decoder/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── error-patterns-reference.md       # 错误模式速查表\n├── scripts/\n│   └── decode_errors.py                  # 错误解码脚本（含 50+ 模式数据库）\n└── examples/\n    ├── sample-compile-output.txt          # 示例编译输出（含多种错误）\n    └── sample-decode-report.md            # 示例解码报告\n```\n\n## 九、使用示例\n\n### 示例 1：快速解码\n**用户**：粘贴编译报错\n**AI**：运行 `--file output.txt` → 输出逐条解码报告。\n\n### 示例 2：管道传入\n**用户**：「帮我看看编译结果」\n**AI**：运行 `g++ main.cpp 2>&1 | python3 decode_errors.py` → 实时解码。\n\n### 示例 3：生成学习笔记\n**用户**：「总结一下这些错误」\n**AI**：运行 `--notes` → 输出错误规律总结和预防建议。\n", "templates/error-patterns-reference.md": "# 编译错误模式速查表\n\n> 常见 GCC/Clang 编译错误模式、原因和修复方法速查。\n\n---\n\n## 语法错误\n\n| 错误信息 | 原因 | 修复 |\n|---|---|---|\n| `expected ';' before` | 缺少分号 | 检查上一行语句末尾 |\n| `expected '}' at end of input` | 缺少右大括号 | 从后向前检查括号配对 |\n| `stray '\\xxx' in program` | 非法字符（中文标点） | 将中文标点替换为英文 |\n| `expected primary-expression before` | 表达式不完整 | 确保运算符两侧有操作数 |\n| `lvalue required as left operand` | 赋值号左侧不是变量 | 检查 = 左侧是否为可修改变量 |\n\n## 声明与作用域错误\n\n| 错误信息 | 原因 | 修复 |\n|---|---|---|\n| `'xxx' was not declared in this scope` | 变量/函数未声明 | 检查拼写、头文件、std:: 前缀 |\n| `'xxx' does not name a type` | 类型名错误或缺头文件 | 检查类型拼写，包含对应头文件 |\n| `redefinition of` | 重复定义 | 头文件加 include guard，定义放 .cpp |\n| `'xxx' is not a member of` | 类中无此成员 | 检查成员名拼写和访问权限 |\n| `'xxx' is private` | 访问私有成员 | 添加 getter/setter 或改为 public |\n\n## 类型错误\n\n| 错误信息 | 原因 | 修复 |\n|---|---|---|\n| `invalid conversion from` | 类型转换不合法 | 检查赋值/参数类型，使用显式转换 |\n| `no matching function for call to` | 函数参数不匹配 | 检查参数数量和类型 |\n| `ambiguous overload for` | 重载歧义 | 添加显式类型转换 |\n| `cannot convert` | 类型无法转换 | 修改变量类型或添加转换 |\n| `incompatible types in assignment` | 赋值类型不兼容 | 检查等号两侧类型 |\n\n## 链接错误\n\n| 错误信息 | 原因 | 修复 |\n|---|---|---|\n| `undefined reference to` | 函数只有声明没有实现 | 确认实现存在且 .cpp 已编译 |\n| `multiple definition of` | 重复定义 | 头文件只放声明，定义放 .cpp |\n| `ld returned 1 exit status` | 链接失败汇总 | 查看上方具体链接错误 |\n\n## 头文件错误\n\n| 错误信息 | 原因 | 修复 |\n|---|---|---|\n| `fatal error: xxx: No such file or directory` | 头文件不存在 | 检查拼写，确认库已安装，添加 -I 路径 |\n\n## 常见警告\n\n| 警告信息 | 原因 | 修复 |\n|---|---|---|\n| `unused variable` | 变量未使用 | 删除或添加 (void)x; |\n| `control reaches end of non-void function` | 缺少 return | 确保所有分支有 return |\n| `division by zero` | 除零 | 确保除数不为零 |\n| `array subscript is above array bounds` | 数组越界 | 检查下标范围（0 到 size-1） |\n| `format '%d' expects argument of type` | 格式不匹配 | 检查 %d/%s/%f 与参数类型 |\n| `implicit declaration of function` | 函数未声明（C） | 添加前向声明或包含头文件 |\n| `uninitialized use` | 变量未初始化 | 声明时立即赋初值 |\n\n---\n\n## 调试技巧\n\n1. **从第一条错误开始修**：一个语法错误可能引发多条连锁错误\n2. **修完重新编译**：不要试图一次修完所有错误\n3. **注意行号偏移**：错误行号可能指向错误发生的下一行\n4. **区分中英文标点**：中文分号（；）和英文分号（;）是不同的字符\n5. **警告也要看**：某些警告可能导致运行时崩溃\n6. **使用 -Wall -Wextra**：开启更多警告帮助发现潜在问题\n7. **简化代码定位**：注释掉部分代码缩小错误范围\n\n---\n\n*速查表由 compile-error-decoder 技能提供*\n", "scripts/decode_errors.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\n编译错误解码脚本\n\n解析 GCC/Clang 编译输出，识别 50+ 种常见错误模式，\n用中文解释原因并给出修复建议。\n\n用法：\n  python3 decode_errors.py --file compile_output.txt\n  g++ main.cpp 2>&1 | python3 decode_errors.py\n  python3 decode_errors.py --file output.txt --no-warnings\n  python3 decode_errors.py --file output.txt --limit 10\n  python3 decode_errors.py --file output.txt --format json\n  python3 decode_errors.py --file output.txt --notes\n\"\"\"\n\nimport argparse\nimport json\nimport os\nimport re\nimport sys\nfrom collections import defaultdict\nfrom typing import Dict, List, Optional, Tuple\n\n\n# ============================================================\n# 错误模式数据库\n# ============================================================\n# 每个模式：(regex, category, severity, explanation, fix, example)\n\nERROR_PATTERNS = [\n    # --- 语法错误 ---\n    (\n        r\"error:\\s*expected\\s+';'\\s+before\",\n        \"语法错误\", \"error\",\n        \"缺少分号。编译器在遇到某个标记时期望前面有分号结尾，\"\n        \"通常是上一行语句忘记写分号。\",\n        \"         \"文件权限不足。无法读取或写入指定文件。\",\n        \"检查文件权限，使用 chmod 修改权限，或以合适的用户身份运行。\",\n        None\n    ),\n    (\n        r\"fatal\\s+error:\\s*too\\s+many\\s+errors\\s+emitted\",\n        \"编译限制\", \"error\",\n        \"错误过多，编译器停止输出。这不是新的错误，而是编译器达到了错误数量上限\"\n        \"（默认 20 个）后停止报告。\",\n        \"修复前面的错误后重新编译。可以使用 -fmax-errors=N 选项调整上限。\",\n        None\n    ),\n\n    # --- 警告 ---\n    (\n        r\"warning:\\s*unused\\s+variable\",\n        \"警告\", \"warning\",\n        \"变量声明了但从未使用。可能是忘记使用，也可能是调试时遗留的代码。\",\n        \"如果确实不需要，删除该变量声明；如果需要使用，补充使用逻辑；\"\n        \"如果是有意保留，可加 (void)变量名; 消除警告。\",\n        \"错误：int x = 5;   // x 从未使用\\n修复：删除该行，或添加 (void)x;\"\n    ),\n    (\n        r\"warning:\\s*unused\\s+function\",\n        \"警告\", \"warning\",\n        \"函数定义了但从未调用。可能是调试遗留代码，或函数声明在头文件中但未被使用。\",\n        \"如果不需要，删除该函数；如果是库函数，可在头文件中声明而不报警告。\",\n        None\n    ),\n    (\n        r\"(?:warning|error):\\s*control\\s+reaches\\s+end\\s+of\\s+non-void\\s+function\",\n        \"警告\", \"warning\",\n        \"非 void 函数缺少 return 语句。函数声明了返回类型，但某些代码路径\"\n        \"（特别是条件分支中）没有 return 语句。这会导致未定义行为！\",\n        \"检查函数的所有代码路径，确保每个分支都有 return 语句。\"\n        \"特别注意 if-else、switch 等条件语句。\",\n        \"错误：int func(int x) {\\n        if (x > 0) return 1;\\n        // x <= 0 时没有 return\\n      }\\n正确：int func(int x) {\\n        if (x > 0) return 1;\\n        return 0;   // 添加默认 return\\n      }\"\n    ),\n    (\n        r\"warning:\\s*division\\s+by\\s+zero\",\n        \"警告\", \"warning\",\n        \"检测到除零操作。除数为常量 0，这会导致运行时崩溃或未定义行为。\",\n        \"检查除数，确保不会为零。如果除数是变量，添加除零检查。\",\n        \"错误：int x = 5 / 0;   // 除零\\n修复：确保除数不为零\"\n    ),\n    (\n        r\"warning:\\s*array\\s+subscript\\s+is\\s+above\\s+array\\s+bounds\",\n        \"警告\", \"warning\",\n        \"数组下标越界。访问数组时使用了超出数组大小的下标，\"\n        \"这会导致缓冲区溢出和未定义行为。\",\n        \"检查数组下标，确保在 0 到 数组大小-1 的范围内。注意数组下标从 0 开始。\",\n        \"错误：int arr[5];\\n      arr[5] = 10;   // 越界，有效下标是 0-4\\n正确：arr[4] = 10;\"\n    ),\n    (\n        r\"warning:\\s*format\\s+'[^']+'\\s+expects\\s+argument\\s+of\\s+type\",\n        \"警告\", \"warning\",\n        \"printf/scanf 格式说明符与参数类型不匹配。例如用 %d 打印字符串，\"\n        \"或用 %s 打印整数。这会导致未定义行为。\",\n        \"检查格式说明符与对应参数的类型是否匹配。%d 对应 int，%s 对应 char*，\"\n        \"%f 对应 double，%c 对应 char，%p 对应指针。\",\n        \"错误：printf(\\\"%d\\\", \\\"hello\\\");  // %d 对应 int，传入了字符串\\n正确：printf(\\\"%s\\\", \\\"hello\\\");\"\n    ),\n    (\n        r\"warning:\\s*implicit\\s+declaration\\s+of\\s+function\",\n        \"警告\", \"warning\",\n        \"函数隐式声明（C 语言）。在 C 中调用未声明的函数时，编译器会假设其返回 int。\"\n        \"在 C++ 中这会直接报错。\",\n        \"在调用函数前包含声明该函数的头文件，或添加函数前向声明。\",\n        \"错误：int main() {\\n        func();   // func 未声明\\n      }\\n正确：void func();  // 前向声明\\n      int main() {\\n        func();\\n      }\"\n    ),\n    (\n        r\"warning:\\s*return\\s+type\\s+defaults\\s+to\\s+'int'\",\n        \"警告\", \"warning\",\n        \"返回类型默认为 int（C 语言）。函数定义时未指定返回类型，\"\n        \"C 语言默认返回 int。C++ 中不允许。\",\n        \"显式指定函数返回类型，即使是 int 也要写出来。\",\n        \"错误：func() { return 0; }   // 缺少返回类型\\n正确：int func() { return 0; }\"\n    ),\n    (\n        r\"warning:\\s*suggest\\s+parentheses\\s+around\",\n        \"警告\", \"warning\",\n        \"建议添加括号。运算符优先级可能导致与预期不同的计算顺序。\",\n        \"添加括号明确表达计算意图，提高代码可读性。\",\n        None\n    ),\n    (\n        r\"warning:\\s*comparison\\s+between\\s+signed\\s+and\\s+unsigned\",\n        \"警告\", \"warning\",\n        \"有符号与无符号整数比较。这可能导致意外结果，因为有符号数会被转换为无符号数。\",\n        \"确保比较两侧类型一致，使用显式转换，或使用相同类型的变量。\",\n        None\n    ),\n    (\n        r\"warning:\\s*uninitialized\\s+use\",\n        \"警告\", \"warning\",\n        \"使用了未初始化的变量。变量声明后未赋值就被使用，值是不确定的。\",\n        \"在使用变量前进行初始化。声明时立即赋初值是好习惯。\",\n        \"错误：int x; cout << x;   // x 未初始化\\n正确：int x = 0; cout << x;\"\n    ),\n\n    # --- 其他常见错误 ---\n    (\n        r\"error:\\s*'([^']+)'\\s+undeclared\\s+\\(first\\s+use\\s+in\\s+this\\s+function\\)\",\n        \"声明错误\", \"error\",\n        \"名称未声明（首次在该函数中使用）。同上，检查拼写、头文件和作用域。\",\n        \"检查名称拼写，确认包含必要头文件，使用 std:: 前缀或 using 声明。\",\n        None\n    ),\n    (\n        r\"error:\\s*lvalue\\s+required\\s+as\\s+left\\s+operand\",\n        \"语法错误\", \"error\",\n        \"赋值号左侧需要左值。左值是可以出现在赋值号左侧的表达式（变量、解引用指针等），\"\n        \"不能是常量或临时值。\",\n        \"检查赋值号左侧是否是可修改的变量。注意 ==（比较）和 =（赋值）的区别。\",\n        \"错误：5 = x;   // 常量不能被赋值\\n正确：x = 5;\"\n    ),\n    (\n        r\"error:\\s*invalid\\s+use\\s+of\\s+non-static\\s+member\",\n        \"类型错误\", \"error\",\n        \"非法使用非静态成员。在静态成员函数或没有对象实例的情况下访问了非静态成员。\",\n        \"1. 如果是静态函数中访问非静态成员，需要传入对象实例\\n\"\n        \"2. 确认通过对象实例（obj.member）或指针（ptr->member）访问成员\",\n        None\n    ),\n    (\n        r\"error:\\s*'([^']+)'\\s+is\\s+private\",\n        \"声明错误\", \"error\",\n        \"访问了私有成员。类的 private 成员只能在类内部访问，外部无法直接访问。\",\n        \"1. 将成员改为 public（不推荐，破坏封装）\\n2. 添加 public 的 getter/setter 函数\\n\"\n        \"3. 将访问代码移到类的成员函数或友元函数中\",\n        None\n    ),\n    (\n        r\"error:\\s*expected\\s+initializer\\s+before\",\n        \"语法错误\", \"error\",\n        \"期望初始化表达式。变量声明时缺少初始化值，或语法结构不完整。\",\n        \"检查变量声明，确保有正确的初始化值或使用默认构造。\",\n        None\n    ),\n    (\n        r\"error:\\s*'operator\\s+[^']+'\\s+must\\s+be\\s+a\\s+member\\s+function\",\n        \"类型错误\", \"error\",\n        \"运算符必须是成员函数。某些运算符（如 =、()、[]、->）必须作为成员函数重载，\"\n        \"不能作为全局函数。\",\n        \"将该运算符重载移到类内部作为成员函数。\",\n        None\n    ),\n    (\n        r\"error:\\s*template\\s+argument\",\n        \"类型错误\", \"error\",\n        \"模板参数错误。模板实例化时传入的参数不满足模板要求。\",\n        \"检查模板参数的类型和数量是否与模板声明匹配。\",\n        None\n    ),\n    (\n        r\"error:\\s*'([^']+)'\\s+does\\s+not\\s+have\\s+class\\s+type\",\n        \"类型错误\", \"error\",\n        \"对象不是类类型。对非类类型的变量使用了 . 或 -> 运算符访问成员。\",\n        \"检查变量类型，确保它是类/结构体/联合体，或使用正确的访问方式。\",\n        \"错误：int x; x.func();   // int 没有成员函数\\n正确：定义类类型的对象\"\n    ),\n    (\n        r\"error:\\s*request\\s+for\\s+member\\s+'([^']+)'\\s+in\",\n        \"类型错误\", \"error\",\n        \"请求成员失败。在某个对象中找不到指定的成员，可能是成员名错误或对象类型不对。\",\n        \"检查成员名拼写，确认对象类型确实有该成员。注意 . 和 -> 的使用区别。\",\n        None\n    ),\n    (\n        r\"error:\\s*cannot\\s+declare\\s+variable\\s+to\\s+be\\s+of\\s+abstract\\s+type\",\n        \"类型错误\", \"error\",\n        \"不能声明抽象类型的变量。类中有纯虚函数（=0）导致类成为抽象类，\"\n        \"抽象类不能实例化。\",\n        \"1. 在派生类中实现所有纯虚函数\\n2. 使用指针或引用指向抽象类（多态）\",\n        None\n    ),\n    (\n        r\"error:\\s*no\\s+matching\\s+function\\s+for\\s+call\\s+to\\s+'([^']+)'\",\n        \"类型错误\", \"error\",\n        \"构造函数调用不匹配。创建对象时传入的参数与任何构造函数都不匹配。\",\n        \"检查构造函数的参数列表，确保传入参数的数量和类型匹配。\",\n        None\n    ),\n]\n\n\n# ============================================================\n# 编译输出行解析\n# ============================================================\n\n# GCC/Clang 错误行格式：\n#   file:line:col: error: message\n#   file:line: error: message\n#   file:line:col: warning: message [-Wflag]\nLINE_PATTERN = re.compile(\n    r'^(?P<file>[^:]+):(?P<line>\\d+):(?P<col>\\d+)?\\s*:\\s*'\n    r'(?P<severity>error|warning|fatal error):\\s*(?P<message>.+)$'\n)\n\n# 有些格式没有列号\nLINE_PATTERN_NOCOL = re.compile(\n    r'^(?P<file>[^:]+):(?P<line>\\d+):\\s*'\n    r'(?P<severity>error|warning|fatal error):\\s*(?P<message>.+)$'\n)\n\n\nclass CompileIssue:\n    \"\"\"一条编译问题\"\"\"\n    def __init__(self, file: str, line: int, col: Optional[int],\n                 severity: str, message: str, raw_line: str):\n        self.file = file\n        self.line = line\n        self.col = col\n        self.severity = severity  # error / warning / fatal error\n        self.message = message\n        self.raw_line = raw_line\n        self.category = \"未识别\"\n        self.explanation = \"\"\n        self.fix = \"\"\n        self.example = None\n        self.matched = False\n\n    def match_pattern(self):\n        \"\"\"匹配错误模式\"\"\"\n        # 构造包含 severity 的完整字符串用于匹配\n        full_text = f\"{self.severity}: {self.message}\"\n        for pattern, category, severity, explanation, fix, example in ERROR_PATTERNS:\n            if re.search(pattern, full_text, re.IGNORECASE):\n                self.category = category\n                self.explanation = explanation\n                self.fix = fix\n                self.example = example\n                self.matched = True\n                return\n        # 未匹配\n        self.category = \"其他\"\n        self.explanation = \"未匹配到已知错误模式。请仔细阅读原始错误信息，\" \\\n                           \"或检查错误位置附近的代码语法。\"\n        self.fix = \"1. 仔细阅读原始错误信息\\n2. 检查错误行及附近代码\\n\" \\\n                   \"3. 确认拼写、标点、括号配对\\n4. 搜索错误关键词获取更多信息\"\n        self.matched = False\n\n\ndef parse_compile_output(text: str) -> List[CompileIssue]:\n    \"\"\"解析编译输出\"\"\"\n    issues = []\n    for line in text.split('\\n'):\n        line = line.rstrip()\n        if not line:\n            continue\n\n        match = LINE_PATTERN.match(line)\n        if not match:\n            match = LINE_PATTERN_NOCOL.match(line)\n        if match:\n            severity = match.group('severity')\n            if severity == 'fatal error':\n                severity = 'error'\n\n            issue = CompileIssue(\n                file=match.group('file'),\n                line=int(match.group('line')),\n                col=int(match.group('col')) if match.group('col') else None,\n                severity=severity,\n                message=match.group('message'),\n                raw_line=line,\n            )\n            issue.match_pattern()\n            issues.append(issue)\n            continue\n\n        # 链接错误：undefined reference to / multiple definition of\n        linker_match = re.search(r\"(undefined reference to|multiple definition of)\\s+`?([^']+)'?\", line)\n        if linker_match:\n            # 尝试提取文件名\n            file_match = re.match(r'^([^:]+):', line)\n            issue = CompileIssue(\n                file=file_match.group(1) if file_match else \"(linker)\",\n                line=0,\n                col=None,\n                severity=\"error\",\n                message=f\"error: {linker_match.group(0)}\",\n                raw_line=line,\n            )\n            issue.match_pattern()\n            issues.append(issue)\n            continue\n\n        # collect2 链接错误汇总\n        if 'ld returned' in line and 'error' in line:\n            issue = CompileIssue(\n                file=\"(linker)\",\n                line=0,\n                col=None,\n                severity=\"error\",\n                message=\"error: ld returned 1 exit status\",\n                raw_line=line,\n            )\n            issue.match_pattern()\n            issues.append(issue)\n\n    return issues\n\n\n# ============================================================\n# 输出格式化\n# ============================================================\n\ndef format_report(issues: List[CompileIssue], limit: int = 0,\n                  show_warnings: bool = True, show_notes: bool = False) -> str:\n    \"\"\"格式化解码报告\"\"\"\n    errors = [i for i in issues if i.severity == 'error']\n    warnings = [i for i in issues if i.severity == 'warning']\n\n    if not show_warnings:\n        display_issues = errors\n    else:\n        display_issues = issues\n\n    if limit > 0:\n        display_issues = display_issues[:limit]\n\n    lines = []\n    lines.append(\"🔍 编译错误解码报告\")\n    lines.append(\"━\" * 40)\n    lines.append(f\"错误数：{len(errors)}\")\n    lines.append(f\"警告数：{len(warnings)}\")\n    if not show_warnings:\n        lines.append(\"（已忽略警告）\")\n\n    # 类型分布\n    cat_counts = defaultdict(int)\n    for i in issues:\n        cat_counts[i.category] += 1\n    if cat_counts:\n        lines.append(\"\")\n        lines.append(\"📊 错误类型分布：\")\n        for cat, count in sorted(cat_counts.items(), key=lambda x: x[1], reverse=True):\n            lines.append(f\"  {cat}：{count} 个\")\n\n    # 逐条解码\n    for idx, issue in enumerate(display_issues, 1):\n        lines.append(\"\")\n        if issue.severity == 'error':\n            lines.append(f\"❌ 错误 {idx}/{len(display_issues)}（{issue.category}）\")\n        else:\n            lines.append(f\"⚠️  警告 {idx}/{len(display_issues)}（{issue.category}）\")\n        lines.append(\"━\" * 40)\n\n        # 位置\n        if issue.col:\n            lines.append(f\"📄 位置：{issue.file}:{issue.line}:{issue.col}\")\n        else:\n            lines.append(f\"📄 位置：{issue.file}:{issue.line}\")\n\n        # 原始信息\n        lines.append(f\"📝 原始：{issue.severity}: {issue.message}\")\n\n        # 中文解释\n        lines.append(\"💡 中文解释：\")\n        for expl_line in issue.explanation.split('\\n'):\n            lines.append(f\"  {expl_line}\")\n\n        # 修复建议\n        lines.append(\"🔧 修复建议：\")\n        for fix_line in issue.fix.split('\\n'):\n            lines.append(f\"  {fix_line}\")\n\n        # 代码示例\n        if issue.example:\n            lines.append(\"📝 代码示例：\")\n            for ex_line in issue.example.split('\\n'):\n                lines.append(f\"  {ex_line}\")\n\n    # 学习笔记\n    if show_notes and issues:\n        lines.append(\"\")\n        lines.append(\"📚 学习笔记\")\n        lines.append(\"━\" * 40)\n\n        # 最常见错误类型\n        if cat_counts:\n            top_cat = max(cat_counts.items(), key=lambda x: x[1])\n            lines.append(f\"本次最常见的错误类型：{top_cat[0]}（{top_cat[1]} 个）\")\n\n        # 未匹配的错误\n        unmatched = [i for i in issues if not i.matched]\n        if unmatched:\n            lines.append(f\"未识别模式：{len(unmatched)} 个（建议手动检查）\")\n\n        # 通用建议\n        lines.append(\"\")\n        lines.append(\"💡 通用建议：\")\n        lines.append(\"  1. 从第一条错误开始修，修完重新编译\")\n        lines.append(\"  2. 一个语法错误可能引发多条连锁错误\")\n        lines.append(\"  3. 注意中英文标点区别，代码中必须用英文标点\")\n        lines.append(\"  4. 使用标准库前确认包含对应头文件\")\n        lines.append(\"  5. 警告也可能隐藏严重问题，不要忽视\")\n        lines.append(\"  6. 善用编辑器的语法高亮和括号匹配功能\")\n        lines.append(\"━\" * 40)\n\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"编译错误解码工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--file\", \"-f\", help=\"编译输出文件路径（不指定则从标准输入读取）\")\n    parser.add_argument(\"--no-warnings\", action=\"store_true\", help=\"只显示错误，忽略警告\")\n    parser.add_argument(\"--limit\", \"-n\", type=int, default=0, help=\"最多显示 N 条（0 表示全部）\")\n    parser.add_argument(\"--format\", choices=[\"text\", \"json\"], default=\"text\", help=\"输出格式\")\n    parser.add_argument(\"--notes\", action=\"store_true\", help=\"生成学习笔记\")\n    parser.add_argument(\"--output\", \"-o\", metavar=\"FILE\", help=\"输出到文件\")\n    args = parser.parse_args()\n\n    # 读取输入\n    if args.file:\n        if not os.path.exists(args.file):\n            print(f\"错误：文件不存在：{args.file}\", file=sys.stderr)\n            sys.exit(1)\n        with open(args.file, 'r', encoding='utf-8', errors='replace') as f:\n            text = f.read()\n    else:\n        if sys.stdin.isatty():\n            print(\"请通过 --file 指定文件，或通过管道传入编译输出：\", file=sys.stderr)\n            print(\"  g++ main.cpp 2>&1 | python3 decode_errors.py\", file=sys.stderr)\n            sys.exit(1)\n        text = sys.stdin.read()\n\n    if not text.strip():\n        print(\"未检测到编译输出。\", file=sys.stderr)\n        sys.exit(0)\n\n    # 解析\n    issues = parse_compile_output(text)\n\n    if not issues:\n        print(\"✅ 未检测到编译错误或警告。编译成功！\")\n        return\n\n    # 输出\n    if args.format == 'json':\n        data = {\n            \"total_errors\": len([i for i in issues if i.severity == 'error']),\n            \"total_warnings\": len([i for i in issues if i.severity == 'warning']),\n            \"issues\": [\n                {\n                    \"file\": i.file,\n                    \"line\": i.line,\n                    \"col\": i.col,\n                    \"severity\": i.severity,\n                    \"message\": i.message,\n                    \"category\": i.category,\n                    \"explanation\": i.explanation,\n                    \"fix\": i.fix,\n                    \"example\": i.example,\n                    \"matched\": i.matched,\n                }\n                for i in issues\n            ]\n        }\n        output = json.dumps(data, ensure_ascii=False, indent=2)\n    else:\n        output = format_report(issues, limit=args.limit,\n                                show_warnings=not args.no_warnings,\n                                show_notes=args.notes)\n\n    print(output)\n\n    if args.output:\n        with open(args.output, 'w', encoding='utf-8') as f:\n            f.write(output + \"\\n\")\n        print(f\"\\n已保存到：{args.output}\", file=sys.stderr)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-decode-report.md": "🔍 编译错误解码报告\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n错误数：6\n警告数：1\n\n📊 错误类型分布：\n  警告：2 个\n  链接错误：2 个\n  语法错误：1 个\n  声明错误：1 个\n  其他：1 个\n\n❌ 错误 1/7（语法错误）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:5:18\n📝 原始：error: expected ';' before '}' token\n💡 中文解释：\n  缺少分号。编译器在遇到某个标记时期望前面有分号结尾，通常是上一行语句忘记写分号。\n🔧 修复建议：\n  检查错误位置附近的语句，确保每条语句以分号结尾。特别注意上一行。\n📝 代码示例：\n  错误：int x = 5    // 缺少分号\n  正确：int x = 5;   // 加上分号\n\n❌ 错误 2/7（声明错误）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:8:5\n📝 原始：error: 'cout' was not declared in this scope\n💡 中文解释：\n  变量或函数在当前作用域中未声明。可能的原因：①变量名拼写错误；②变量在其他作用域（如函数内）声明；③缺少 using 声明；④标准库对象缺少 std:: 前缀。\n🔧 修复建议：\n  1. 检查变量名拼写是否正确\n  2. 确认变量声明的作用域是否包含使用位置\n  3. 如果是标准库对象（cout/cin/string等），确保包含对应头文件并使用 std:: 前缀\n📝 代码示例：\n  错误：cout << \"hello\";   // 缺少 std:: 前缀\n  正确：std::cout << \"hello\";\n\n⚠️  警告 3/7（警告）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:12:9\n📝 原始：warning: unused variable 'y' [-Wunused-variable]\n💡 中文解释：\n  变量声明了但从未使用。可能是忘记使用，也可能是调试时遗留的代码。\n🔧 修复建议：\n  如果确实不需要，删除该变量声明；如果需要使用，补充使用逻辑；如果是有意保留，可加 (void)变量名; 消除警告。\n📝 代码示例：\n  错误：int x = 5;   // x 从未使用\n  修复：删除该行，或添加 (void)x;\n\n❌ 错误 4/7（警告）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:15:1\n📝 原始：error: control reaches end of non-void function [-Wreturn-type]\n💡 中文解释：\n  非 void 函数缺少 return 语句。函数声明了返回类型，但某些代码路径（特别是条件分支中）没有 return 语句。这会导致未定义行为！\n🔧 修复建议：\n  检查函数的所有代码路径，确保每个分支都有 return 语句。特别注意 if-else、switch 等条件语句。\n📝 代码示例：\n  错误：int func(int x) {\n          if (x > 0) return 1;\n          // x <= 0 时没有 return\n        }\n  正确：int func(int x) {\n          if (x > 0) return 1;\n          return 0;   // 添加默认 return\n        }\n\n❌ 错误 5/7（其他）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:18:20\n📝 原始：error: missing.h: No such file or directory\n💡 中文解释：\n  未匹配到已知错误模式。请仔细阅读原始错误信息，或检查错误位置附近的代码语法。\n🔧 修复建议：\n  1. 仔细阅读原始错误信息\n  2. 检查错误行及附近代码\n  3. 确认拼写、标点、括号配对\n  4. 搜索错误关键词获取更多信息\n\n❌ 错误 6/7（链接错误）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：main.cpp:0\n📝 原始：error: error: undefined reference to `func(int)'\n💡 中文解释：\n  函数或变量未定义。代码中有声明（头文件中），但链接器找不到对应的实现（定义）。常见原因：①函数只声明未实现；②实现文件未加入编译；③函数签名（参数类型）与声明不一致；④C++ 函数在 C 文件中实现导致名字修饰不匹配。\n🔧 修复建议：\n  1. 确认函数/变量有对应的实现代码\n  2. 确认实现文件（.cpp）已加入编译命令\n  3. 检查函数签名（参数类型、const 修饰）是否与声明完全一致\n  4. 如果是 C/C++ 混合，使用 extern \"C\" 包裹 C 函数声明\n📝 代码示例：\n  // 声明（头文件）\n  void func(int x);\n  // 实现（.cpp 文件）— 必须存在且签名一致\n  void func(int x) { /* ... */ }\n  // 编译时必须包含实现文件：g++ main.cpp func.cpp\n\n❌ 错误 7/7（链接错误）\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n📄 位置：(linker):0\n📝 原始：error: error: ld returned 1 exit status\n💡 中文解释：\n  链接失败汇总。这是链接器的总结性错误，真正的原因在上面的错误信息中（通常是 undefined reference 或 multiple definition）。\n🔧 修复建议：\n  向上滚动查看具体的链接错误信息，根据具体错误修复。本条本身不需要单独处理。\n\n📚 学习笔记\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n本次最常见的错误类型：警告（2 个）\n未识别模式：1 个（建议手动检查）\n\n💡 通用建议：\n  1. 从第一条错误开始修，修完重新编译\n  2. 一个语法错误可能引发多条连锁错误\n  3. 注意中英文标点区别，代码中必须用英文标点\n  4. 使用标准库前确认包含对应头文件\n  5. 警告也可能隐藏严重问题，不要忽视\n  6. 善用编辑器的语法高亮和括号匹配功能\n━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━\n", "examples/sample-compile-output.txt": "main.cpp: In function 'int main()':\nmain.cpp:5:18: error: expected ';' before '}' token\n     int x = 5\n                  ^\nmain.cpp:8:5: error: 'cout' was not dec Google Test 配置」\n6. 用户说「C++ 项目规范」「C++ 项目结构最佳实践」\n\n## 三、项目结构规范\n\n### 3.1 可执行文件项目\n\n```\nmy-project/\n├── CMakeLists.txt          # 顶层构建配置\n├── README.md               # 项目说明\n├── .gitignore              # Git 忽略规则\n├── .clang-format           # 代码格式化配置\n├── include/                # 公共头文件\n│   └── my_project/\n│       └── utils.h\n├── src/                    # 源代码\n│   ├── main.cpp            # 入口文件\n│   └── utils.cpp\n└── tests/                  # 单元测试\n    ├── CMakeLists.txt\n    └── test_utils.cpp\n```\n\n### 3.2 静态库项目\n\n```\nmy-library/\n├── CMakeLists.txt\n├── README.md\n├── .gitignore\n├── .clang-format\n├── include/\n│   └── my_library/\n│       └── api.h\n├── src/\n│   └── api.cpp\n└── tests/\n    ├── CMakeLists.txt\n    └── test_api.cpp\n```\n\n### 3.3 头文件库项目\n\n```\nmy-header-only/\n├── CMakeLists.txt\n├── README.md\n├── .gitignore\n├── .clang-format\n├── include/\n│   └── my_header_only/\n│       └── utils.h\n└── tests/\n    ├── CMakeLists.txt\n    └── test_utils.cpp\n```\n\n## 四、操作步骤\n\n### 步骤 1：确认需求\n\n确认用户需要：\n- 项目名称\n- 项目类型（可执行文件/静态库/头文件库）\n- C++ 标准（11/14/17/20/23）\n- 是否需要单元测试\n- 输出目录\n\n### 步骤 2：运行脚本\n\n使用 `scripts/init_cpp_project.py`：\n\n```bash\n# 基本用法（可执行文件项目，C++17，含测试）\npython3 scripts/init_cpp_project.py --name my-project\n\n# 指定项目类型\npython3 scripts/init_cpp_project.py --name my-lib --type library\npython3 scripts/init_cpp_project.py --name my-header --type header-only\n\n# 指定 C++ 标准\npython3 scripts/init_cpp_project.py --name my-project --std 20\n\n# 不包含测试\npython3 scripts/init_cpp_project.py --name my-project --no-tests\n\n# 指定输出目录\npython3 scripts/init_cpp_project.py --name my-project --output /path/to/projects\n\n# 指定作者\npython3 scripts/init_cpp_project.py --name my-project --author \"Your Name\"\n\n# 指定许可证\npython3 scripts/init_cpp_project.py --name my-project --license MIT\n\n# 完整配置\npython3 scripts/init_cpp_project.py \\\n    --name my-project \\\n    --type executable \\\n    --std 17 \\\n    --author \"Your Name\" \\\n    --license MIT \\\n    --output /path/to/projects\n```\n\n### 步骤 3：构建项目\n\n```bash\ncd my-project\nmkdir build && cd build\ncmake ..\nmake -j$(nproc)\n\n# 运行可执行文件\n./my-project\n\n# 运行测试（如果启用了测试）\nctest --output-on-failure\n```\n\n### 步骤 4：安全提示\n\n1. 本技能只生成项目文件，不执行编译或安装\n2. 生成的 CMakeLists.txt 为通用模板，复杂项目可能需要手动调整\n3. Google Test 通过 FetchContent 下载，需要网络连接\n4. 建议根据实际需求修改 README.md 和项目描述\n\n## 五、CMake 配置说明\n\n### 5.1 核心配置\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(my-project VERSION 1.0.0 LANGUAGES CXX)\n\n# C++ 标准\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\nset(CMAKE_CXX_EXTENSIONS OFF)\n\n# 构建类型\nif(NOT CMAKE_BUILD_TYPE)\n    set(CMAKE_BUILD_TYPE Release)\nendif()\n\n# 编译器警告\nif(CMAKE_CXX_COMPILER_ID MATCHES \"GNU|Clang\")\n    add_compile_options(-Wall -Wextra -Wpedantic -Wshadow -Wconversion)\nendif()\n```\n\n### 5.2 目标配置\n\n```cmake\n# 可执行文件\nadd_executable(my-project src/main.cpp src/utils.cpp)\ntarget_include_directories(my-project PRIVATE include)\n\n# 静态库\nadd_library(my-library STATIC src/api.cpp)\ntarget_include_directories(my-library PUBLIC include)\n\n# 头文件库\nadd_library(my-header-only INTERFACE)\ntarget_include_directories(my-header-only INTERFACE include)\n```\n\n### 5.3 测试配置\n\n```cmake\ninclude(FetchContent)\nFetchContent_Declare(\n    googletest\n    GIT_REPOSITORY https://github.com/google/googletest.git\n    GIT_TAG v1.14.0\n)\nFetchContent_MakeAvailable(googletest)\n\nenable_testing()\nadd_executable(tests test_utils.cpp)\ntarget_link_libraries(tests PRIVATE GTest::gtest_main my-library)\ninclude(GoogleTest)\ngtest_discover_tests(tests)\n```\n\n## 六、常见场景处理\n\n### 场景 1：课程作业项目\n**用户**：「帮我创建一个 C++ 课程作业项目」\n**处理**：生成可执行文件项目，C++17，含基本 main.cpp 和 .gitignore。\n\n### 场景 2：算法竞赛项目\n**用户**：「创建一个算法练习项目」\n**处理**：生成可执行文件项目，C++17，关闭测试，添加常用头文件模板。\n\n### 场景 3：开源库项目\n**用户**：「创建一个 C++ 静态库项目，要支持单元测试」\n**处理**：生成静态库项目，含 Google Test 配置，MIT 许可证，详细 README。\n\n### 场景 4：头文件库项目\n**用户**：「创建一个 header-only 的 C++ 工具库」\n**处理**：生成头文件库项目，INTERFACE 库类型，含测试和示例。\n\n### 场景 5：现代 C++ 项目\n**用户**：「创建一个 C++20 项目」\n**处理**：生成项目，C++20 标准，启用 concepts/ranges 相关警告。\n\n## 七、注意事项\n\n1. **CMake 版本**：生成的 CMakeLists.txt 要求 CMake 3.14 或更高版本。\n2. **网络依赖**：Google Test 通过 FetchContent 下载，首次构建需要网络连接。\n3. **编译器支持**：C++20/23 需要较新版本的 GCC（10+）、Clang（10+）或 MSVC（2019+）。\n4. **项目命名**：项目名称建议使用小写字母和连字符，避免空格和特殊字符。\n5. **目录冲突**：如果目标目录已存在且非空，脚本会提示并退出，不会覆盖已有文件。\n6. **跨平台**：生成的 CMakeLists.txt 支持 Linux、macOS、Windows（MSYS2/MinGW/MSVC）。\n7. **警告级别**：默认启用 -Wall -Wextra -Wpedantic，可根据需要调整。\n8. **构建类型**：默认 Release，调试时使用 `-DCMAKE_BUILD_TYPE=Debug`。\n9. **不修改系统**：本技能只在指定目录生成文件，不修改系统配置。\n10. **手动调整**：复杂项目（多库依赖、自定义构建步骤）可能需要手动修改 CMakeLists.txt。\n\n## 八、文件结构\n\n```\ncpp-project-init/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── cpp-style-guide.md                 # C++ 编码规范与项目结构指南\n├── scripts/\n│   └── init_cpp_project.py                # C++ 项目初始化脚本\n└── examples/\n    ├── sample-executable-project/         # 示例可执行文件项目\n    ├── sample-library-project/            # 示例静态库项目\n    └── sample-cmake-output.txt            # 示例 CMake 配置输出\n```\n\n## 九、使用示例\n\n### 示例 1：快速创建\n**用户**：「创建一个叫 hello 的 C++ 项目」\n**AI**：运行 `--name hello` → 生成可执行文件项目（C++17，含测试）。\n\n### 示例 2：静态库项目\n**用户**：「创建一个 C++ 静态库项目，名字叫 math-lib，C++20」\n**AI**：运行 `--name math-lib --type library --std 20` → 生成静态库项目。\n\n### 示例 3：无测试项目\n**用户**：「创建一个简单的 C++ 项目，不需要测试」\n**AI**：运行 `--name simple --no-tests` → 生成不含测试目录的项目。\n", "files": {"SKILL.md": "---\nname: cpp-project-init\ndescription: 'C++ 项目初始化助手。一键生成标准 C++ 项目结构，包含 CMakeLists.txt 构建配置、src/ 源码目录、include/ 头文件目录、tests/ 测试目录、.gitignore、README.md、.clang-format 等文件。支持三种项目类型（可执行文件/静态库/头文件库），支持 C++11/14/17/20/23 标准选择，内置 Google Test 测试框架配置，支持编译器选项、警告级别、构建类型配置。适用于快速搭建 C++ 项目脚手架、课程作业项目初始化、开源项目结构规范等场景。'\n---\n\n# C++ 项目初始化助手\n\n## 一、技能定位\n\n本技能用于**快速生成标准 C++ 项目脚手架**。核心价值：\n\n- 一键生成完整项目结构（CMakeLists.txt、src/、include/、tests/）\n- 三种项目类型：可执行文件、静态库、头文件库\n- 支持 C++11/14/17/20/23 标准\n- 内置 Google Test 测试框架配置\n- 生成 .gitignore、.clang-format、README.m
