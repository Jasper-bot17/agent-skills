：「创建一个算法练习项目」\n**处理**：生成可执行文件项目，C++17，关闭测试，添加常用头文件模板。\n\n### 场景 3：开源库项目\n**用户**：「创建一个 C++ 静态库项目，要支持单元测试」\n**处理**：生成静态库项目，含 Google Test 配置，MIT 许可证，详细 README。\n\n### 场景 4：头文件库项目\n**用户**：「创建一个 header-only 的 C++ 工具库」\n**处理**：生成头文件库项目，INTERFACE 库类型，含测试和示例。\n\n### 场景 5：现代 C++ 项目\n**用户**：「创建一个 C++20 项目」\n**处理**：生成项目，C++20 标准，启用 concepts/ranges 相关警告。\n\n## 七、注意事项\n\n1. **CMake 版本**：生成的 CMakeLists.txt 要求 CMake 3.14 或更高版本。\n2. **网络依赖**：Google Test 通过 FetchContent 下载，首次构建需要网络连接。\n3. **编译器支持**：C++20/23 需要较新版本的 GCC（10+）、Clang（10+）或 MSVC（2019+）。\n4. **项目命名**：项目名称建议使用小写字母和连字符，避免空格和特殊字符。\n5. **目录冲突**：如果目标目录已存在且非空，脚本会提示并退出，不会覆盖已有文件。\n6. **跨平台**：生成的 CMakeLists.txt 支持 Linux、macOS、Windows（MSYS2/MinGW/MSVC）。\n7. **警告级别**：默认启用 -Wall -Wextra -Wpedantic，可根据需要调整。\n8. **构建类型**：默认 Release，调试时使用 `-DCMAKE_BUILD_TYPE=Debug`。\n9. **不修改系统**：本技能只在指定目录生成文件，不修改系统配置。\n10. **手动调整**：复杂项目（多库依赖、自定义构建步骤）可能需要手动修改 CMakeLists.txt。\n\n## 八、文件结构\n\n```\ncpp-project-init/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── cpp-style-guide.md                 # C++ 编码规范与项目结构指南\n├── scripts/\n│   └── init_cpp_project.py                # C++ 项目初始化脚本\n└── examples/\n    ├── sample-executable-project/         # 示例可执行文件项目\n    ├── sample-library-project/            # 示例静态库项目\n    └── sample-cmake-output.txt            # 示例 CMake 配置输出\n```\n\n## 九、使用示例\n\n### 示例 1：快速创建\n**用户**：「创建一个叫 hello 的 C++ 项目」\n**AI**：运行 `--name hello` → 生成可执行文件项目（C++17，含测试）。\n\n### 示例 2：静态库项目\n**用户**：「创建一个 C++ 静态库项目，名字叫 math-lib，C++20」\n**AI**：运行 `--name math-lib --type library --std 20` → 生成静态库项目。\n\n### 示例 3：无测试项目\n**用户**：「创建一个简单的 C++ 项目，不需要测试」\n**AI**：运行 `--name simple --no-tests` → 生成不含测试目录的项目。\n", "templates/cpp-style-guide.md": "# C++ 编码规范与项目结构指南\n\n> 适用于 C++11/14/17/20/23 项目开发。\n\n---\n\n## 一、项目结构规范\n\n### 1.1 标准目录结构\n\n```\nproject-name/\n├── CMakeLists.txt          # 顶层构建配置\n├── README.md               # 项目说明\n├── LICENSE                 # 许可证文件\n├── .gitignore              # Git 忽略规则\n├── .clang-format           # 代码格式化配置\n├── .clang-tidy             # 静态分析配置（可选）\n├── docs/                   # 文档\n├── include/                # 公共头文件\n│   └── project_name/       # 按项目名组织\n│       ├── api.h\n│       └── utils.h\n├── src/                    # 源代码\n│   ├── main.cpp            # 入口文件（仅可执行文件）\n│   ├── api.cpp\n│   └── utils.cpp\n├── tests/                  # 单元测试\n│   ├── CMakeLists.txt\n│   ├── test_api.cpp\n│   └── test_utils.cpp\n├── examples/               # 示例代码（可选）\n├── third_party/            # 第三方依赖（可选）\n└── cmake/                  # CMake 模块（可选）\n```\n\n### 1.2 命名规范\n\n| 类型 | 规范 | 示例 |\n|---|---|---|\n| 项目名 | 小写字母+连字符 | `my-project` |\n| 命名空间 | 小写字母+下划线 | `my_project` |\n| 类名 | 大驼峰 | `MyClass` |\n| 函数名 | 小驼峰 | `doSomething` |\n| 变量名 | 小写下划线 | `my_variable` |\n| 成员变量 | 小写下划线+尾下划线 | `member_var_` |\n| 常量 | 全大写下划线 | `MAX_SIZE` |\n| 枚举值 | 全大写下划线 | `RED_COLOR` |\n| 头文件 | 小写下划线 | `my_class.h` |\n| 源文件 | 小写下划线 | `my_class.cpp` |\n| 头文件保护 | 全大写下划线+H | `MY_CLASS_H` |\n\n### 1.3 头文件规范\n\n```cpp\n// 1. 使用 #ifndef 保护（不使用 #pragma once，兼容性更好）\n#ifndef MY_CLASS_H\n#define MY_CLASS_H\n\n// 2. 包含标准库头文件\n#include <string>\n#include <vector>\n\n// 3. 包含项目头文件\n#include \"my_project/other_class.h\"\n\nnamespace my_project {\n\n// 4. 类声明\nclass MyClass {\npublic:\n    MyClass();\n    ~MyClass();\n\n    // 5. 公共接口\n    void doSomething();\n    int getValue() const;\n\nprivate:\n    // 6. 私有成员\n    int value_;\n};\n\n}  // namespace my_project\n\n#endif  // MY_CLASS_H\n```\n\n### 1.4 源文件规范\n\n```cpp\n// 1. 首先包含对应头文件\n#include \"my_project/my_class.h\"\n\n// 2. 然后包含标准库\n#include <iostream>\n\n// 3. 最后包含其他项目头文件\n#include \"my_project/helper.h\"\n\nnamespace my_project {\n\nMyClass::MyClass() : value_(0) {}\n\nMyClass::~MyClass() = default;\n\nvoid MyClass::doSomething() {\n    // 实现\n}\n\nint MyClass::getValue() const {\n    return value_;\n}\n\n}  // namespace my_project\n```\n\n---\n\n## 二、CMake 最佳实践\n\n### 2.1 基本配置\n\n```cmake\ncmake_minimum_required(VERSION 3.14)\nproject(my-project VERSION 1.0.0 LANGUAGES CXX)\n\n# C++ 标准\nset(CMAKE_CXX_STANDARD 17)\nset(CMAKE_CXX_STANDARD_REQUIRED ON)\nset(CMAKE_CXX_EXTENSIONS OFF)\n\n# 默认构建类型\nif(NOT CMAKE_BUILD_TYPE)\n    set(CMAKE_BUILD_TYPE Release)\nendif()\n\n# 编译选项\nif(CMAKE_CXX_COMPILER_ID MATCHES \"GNU|Clang\")\n    add_compile_options(-Wall -Wextra -Wpedantic -Wshadow)\nelseif(MSVC)\n    add_compile_options(/W4 /permissive-)\nendif()\n```\n\n### 2.2 目标配置\n\n```cmake\n# 可执行文件\nadd_executable(my-app src/main.cpp)\ntarget_include_directories(my-app PRIVATE include)\ntarget_link_libraries(my-app PRIVATE my-lib)\n\n# 静态库\nadd_library(my-lib STATIC src/my_lib.cpp)\ntarget_include_directories(my-lib PUBLIC include)\n\n# 头文件库\nadd_library(my-header INTERFACE)\ntarget_include_directories(my-header INTERFACE include)\n```\n\n### 2.3 测试配置\n\n```cmake\nenable_testing()\n\ninclude(FetchContent)\nFetchContent_Declare(\n    googletest\n    GIT_REPOSITORY https://github.com/google/googletest.git\n    GIT_TAG v1.14.0\n)\nFetchContent_MakeAvailable(googletest)\n\nadd_executable(tests test_my_lib.cpp)\ntarget_link_libraries(tests PRIVATE GTest::gtest_main my-lib)\n\ninclude(GoogleTest)\ngtest_discover_tests(tests)\n```\n\n### 2.4 安装配置\n\n```cmake\ninclude(GNUInstallDirs)\n\ninstall(TARGETS my-lib\n    ARCHIVE DESTINATION ${CMAKE_INSTALL_LIBDIR}\n    LIBRARY DESTINATION ${CMAKE_INSTALL_LIBDIR}\n    RUNTIME DESTINATION ${CMAKE_INSTALL_BINDIR}\n)\ninstall(DIRECTORY include/ DESTINATION ${CMAKE_INSTALL_INCLUDEDIR})\n```\n\n---\n\n## 三、现代 C++ 特性使用\n\n### 3.1 智能指针\n\n```cpp\n// 优先使用 std::unique_ptr\nauto obj = std::make_unique<MyClass>();\n\n// 共享所有权使用 std::shared_ptr\nauto shared = std::make_shared<MyClass>();\n\n// 避免使用裸指针拥有资源\n// 不推荐: MyClass* obj = new MyClass();\n```\n\n### 3.2 移动语义\n\n```cpp\n// 优先使用移动而非拷贝\nstd::vector<int> createVector() {\n    std::vector<int> v;\n    v.push_back(1);\n    return v;  // 自动移动或 NRVO\n}\n\n// 显式移动\nstd::vector<int> v1 = {1, 2, 3};\nstd::vector<int> v2 = std::move(v1);\n```\n\n### 3.3 类型推导\n\n```cpp\n// 使用 auto 简化类型声明\nauto value = 42;\nauto text = std::string(\"hello\");\n\n// 范围 for 循环\nfor (const auto& item : container) {\n    // 使用 item\n}\n```\n\n### 3.4 Lambda 表达式\n\n```cpp\n// 简单 lambda\nauto add = [](int a, int b) { return a + b; };\n\n// 捕获变量\nint factor = 2;\nauto multiply = [factor](int x) { return x * factor; };\n\n// 泛型 lambda (C++14)\nauto print = [](const auto& value) { std::cout << value; };\n```\n\n### 3.5 结构化绑定 (C++17)\n\n```cpp\nstd::map<std::string, int> scores = {{\"Alice\", 95}, {\"Bob\", 87}};\n\nfor (const auto& [name, score] : scores) {\n    std::cout << name << \": \" << score << std::endl;\n}\n\n// 函数返回多值\nauto [iter, inserted] = scores.insert({\"Charlie\", 90});\n```\n\n### 3.6 Concepts (C++20)\n\n```cpp\ntemplate <typename T>\nconcept Addable = requires(T a, T b) {\n    { a + b } -> std::convertible_to<T>;\n};\n\ntemplate <Addable T>\nT add(T a, T b) {\n    return a + b;\n}\n```\n\n---\n\n## 四、常见错误与陷阱\n\n| 错误 | 说明 | 修正 |\n|---|---|---|\n| 头文件循环包含 | A.h 包含 B.h，B.h 包含 A.h | 使用前向声明 |\n| 未初始化成员变量 | 构造函数未初始化所有成员 | 使用成员初始化列表 |\n| 虚析构函数缺失 | 基类无虚析构函数导致内存泄漏 | 基类析构函数声明为 virtual |\n| 切片问题 | 按值传递派生类对象 | 使用引用或指针 |\n| 隐式类型转换 | 单参数构造函数导致隐式转换 | 使用 explicit 关键字 |\n| 悬垂引用 | 返回局部变量的引用 | 按值返回或使用智能指针 |\n| 迭代器失效 | 修改容器后使用旧迭代器 | 重新获取迭代器 |\n| 未检查空指针 | 解引用可能为空的指针 | 使用断言或空指针检查 |\n| 异常安全 | 构造函数中抛出异常导致资源泄漏 | 使用 RAII |\n| 未定义行为 | 有符号整数溢出、空指针解引用等 | 避免未定义行为 |\n\n---\n\n## 五、编译与调试\n\n### 5.1 常用编译选项\n\n```bash\n# Debug 构建\ncmake -DCMAKE_BUILD_TYPE=Debug ..\n\n# Release 构建\ncmake -DCMAKE_BUILD_TYPE=Release ..\n\n# 启用地址消毒 (AddressSanitizer)\ncmake -DCMAKE_CXX_FLAGS=\"-fsanitize=address -g\" ..\n\n# 启用未定义行为消毒 (UBSan)\ncmake -DCMAKE_CXX_FLAGS=\"-fsanitize=undefined -g\" ..\n\n# 生成编译数据库（用于 clangd 等工具）\ncmake -DCMAKE_EXPORT_COMPILE_COMMANDS=ON ..\n```\n\n### 5.2 调试技巧\n\n```bash\n# 使用 gdb 调试\ngdb ./my-app\n(gdb) break main\n(gdb) run\n(gdb) print variable\n(gdb) backtrace\n(gdb) next\n(gdb) step\n\n# 使用 valgrind 检查内存泄漏\nvalgrind --leak-check=full ./my-app\n\n# 使用 strace 跟踪系统调用\nstrace ./my-app\n```\n\n---\n\n*规范参考由 cpp-project-init 技能提供*\n", "scripts/init_cpp_project.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\nC++ 项目初始化脚本\n\n功能：\n- 一键生成标准 C++ 项目结构\n- 支持三种项目类型：可执行文件(executable)、静态库(library)、头文件库(header-only)\n- 支持 C++11/14/17/20/23 标准\n- 内置 Google Test 测试框架配置\n- 生成 CMakeLists.txt、.gitignore、.clang-format、README.md\n- 支持自定义作者、许可证、输出目录\n\n用法：\n  python3 init_cpp_project.py --name my-project\n  python3 init_cpp_project.py --name my-lib --type library\n  python3 init_cpp_project.py --name my-header --type header-only\n  python3 init_cpp_project.py --name my-project --std 20\n  python3 init_cpp_project.py --name my-project --no-tests\n  python3 init_cpp_project.py --name my-project --output /path/to/projects\n  python3 init_cpp_project.py --name my-project --author \"Your Name\" --license MIT\n\"\"\"\n\nimport argparse\nimport os\nimport re\nimport sys\nfrom datetime import datetime\n\n\n# ============================================================\n# 工具函数\n# ============================================================\n\ndef to_camel_case(name: str) -> str:\n    \"\"\"将 kebab-case 或 snake_case 转为 CamelCase\"\"\"\n    parts = re.split(r'[-_]', name)\n    return ''.join(p.capitalize() for p in parts)\n\n\ndef to_snake_case(name: str) -> str:\n    \"\"\"将 kebab-case 或 CamelCase 转为 snake_case\"\"\"\n    s1 = re.sub(r'(.)([A-Z][a-z]+)', r'\\1_\\2', name)\n    s2 = re.sub(r'([a-z0-9])([A-Z])', r'\\1_\\2', s1)\n    return s2.replace('-', '_').lower()\n\n\ndef write_file(path: str, content: str, verbose: bool = True):\n    \"\"\"写入文件并创建父目录\"\"\"\n    os.makedirs(os.path.dirname(path), exist_ok=True)\n    with open(path, 'w', encoding='utf-8') as f:\n        f.write(content)\n    if verbose:\n        print(f\"  创建: {path}\")\n\n\n# ============================================================\n# CMakeLists.txt 模板\n# ============================================================\n\ndef generate_top_cmake(name: str, project_type: str, cpp_std: str,\n                        author: str, license: str, has_tests: bool) -> str:\n    \"\"\"生成顶层 CMakeLists.txt\"\"\"\n    camel = to_camel_case(name)\n    snake = to_snake_case(name)\n    year = datetime.now().year\n\n    lines = []\n    lines.append(\"cmake_minimum_required(VERSION 3.14)\")\n    lines.append(f\"project({name} VERSION 1.0.0 LANGUAGES CXX)\")\n    lines.append(\"\")\n    lines.append(\"# C++ 标准\")\n    lines.append(f\"set(CMAKE_CXX_STANDARD {cpp_std})\")\n    lines.append(\"set(CMAKE_CXX_STANDARD_REQUIRED ON)\")\n    lines.append(\"set(CMAKE_CXX_EXTENSIONS OFF)\")\n    lines.append(\"\")\n    lines.append(\"# 构建类型\")\n    lines.append(\"if(NOT CMAKE_BUILD_TYPE)\")\n    lines.append(\"    set(CMAKE_BUILD_TYPE Release)\")\n    lines.append(\"endif()\")\n    lines.append(\"\")\n    lines.append(\"# 编译器警告选项\")\n    lines.append(\"if(CMAKE_CXX_COMPILER_ID MATCHES \\\"GNU|Clang\\\")\")\n    lines.append(\"    add_compile_options(\")\n    lines.append(\"        -Wall\")\n    lines.append(\"        -Wextra\")\n    lines.append(\"        -Wpedantic\")\n    lines.append(\"        -Wshadow\")\n    lines.append(\"        -Wnon-virtual-dtor\")\n    lines.append(\"    )\")\n    lines.append(\"elseif(MSVC)\")\n    lines.append(\"    add_compile_options(/W4 /permissive-)\")\n    lines.append(\"endif()\")\n    lines.append(\"\")\n    lines.append(\"# 输出目录\")\n    lines.append(\"set(CMAKE_RUNTIME_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/bin)\")\n    lines.append(\"set(CMAKE_LIBRARY_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/lib)\")\n    lines.append(\"set(CMAKE_ARCHIVE_OUTPUT_DIRECTORY ${CMAKE_BINARY_DIR}/lib)\")\n    lines.append(\"\")\n\n    if project_type == \"executable\":\n        lines.append(f\"# 可执行文件目标\")\n        lines.append(f\"add_executable({name}\")\n        lines.append(f\"    src/main.cpp\")\n        lines.append(f\"    src/{snake}.cpp\")\n        lines.append(f\")\")\n        lines.append(f\"target_include_directories({name} PRIVATE include)\")\n        lines.append(\"\")\n    elif project_type == \"library\":\n        lines.append(f\"# 静态库目标\")\n        lines.append(f\"add_library({name} STATIC\")\n        lines.append(f\"    src/{snake}.cpp\")\n        lines.append(f\")\")\n        lines.append(f\"target_include_directories({name} PUBLIC include)\")\n        lines.append(f\"target_compile_definitions({name} PRIVATE {snake.upper()}_EXPORTS)\")\n        lines.append(\"\")\n    elif project_type == \"header-only\":\n        lines.append(f\"# 头文件库目标（INTERFACE）\")\n        lines.append(f\"add_library({name} INTERFACE)\")\n        lines.append(f\"target_include_directories({name} INTERFACE include)\")\n        lines.append(f\"target_compile_features({name} INTERFACE cxx_std_{cpp_std})\")\n        lines.append(\"\")\n\n    if has_tests:\n        lines.append(\"# 单元测试\")\n        lines.append(\"enable_testing()\")\n        lines.append(\"add_subdirectory(tests)\")\n        lines.append(\"\")\n\n    lines.append(\"# 安装规则\")\n    if project_type == \"executable\":\n        lines.append(f\"install(TARGETS {name} RUNTIME DESTINATION bin)\")\n    elif project_type == \"library\":\n        lines.append(f\"install(TARGETS {name} ARCHIVE DESTINATION lib)\")\n        lines.append(f\"install(DIRECTORY include/ DESTINATION include)\")\n    elif project_type == \"header-only\":\n        lines.append(f\"install(DIRECTORY include/ DESTINATION include)\")\n    lines.append(\"\")\n\n    return \"\\n\".join(lines) + \"\\n\"\n\n\ndef generate_test_cmake(name: str, project_type: str) -> str:\n    \"\"\"生成 tests/CMakeLists.txt\"\"\"\n    snake = to_snake_case(name)\n\n    lines = []\n    lines.append(\"# Google Test 通过 FetchContent 获取\")\n    lines.append(\"include(FetchContent)\")\n    lines.append(\"FetchContent_Declare(\")\n    lines.append(\"    googletest\")\n    lines.append(\"    GIT_REPOSITORY https://github.com/google/googletest.git\")\n    lines.append(\"    GIT_TAG v1.14.0\")\n    lines.append(\")\")\n    lines.append(\"# 防止 Google Test 覆盖父项目的编译器/链接器设置\")\n    lines.append(\"set(gtest_force_shared_crt ON CACHE BOOL \\\"\\\" FORCE)\")\n    lines.append(\"FetchContent_MakeAvailable(googletest)\")\n    lines.append(\"\")\n    lines.append(f\"add_executable(tests test_{snake}.cpp)\")\n    lines.append(f\"target_link_libraries(tests PRIVATE GTest::gtest_main)\")\n\n    if project_type in (\"library\", \"header-only\"):\n        lines.append(f\"target_link_libraries(tests PRIVATE {name})\")\n    elif project_type == \"executable\":\n        # 可执行文件项目中，测试直接包含源文件\n        lines.append(f\"target_include_directories(tests PRIVATE ${{CMAKE_SOURCE_DIR}}/include)\")\n        lines.append(f\"target_sources(tests PRIVATE ${{CMAKE_SOURCE_DIR}}/src/{snake}.cpp)\")\n\n    lines.append(\"\")\n    lines.append(\"include(GoogleTest)\")\n    lines.append(\"gtest_discover_tests(tests)\")\n    lines.append(\"\")\n\n    return \"\\n\".join(lines) + \"\\n\"\n\n\n# ============================================================\n# 源代码模板\n# ============================================================\n\ndef generate_header(name: str, project_type: str) -> str:\n    \"\"\"生成头文件\"\"\"\n    snake = to_snake_case(name)\n    camel = to_camel_case(name)\n    guard = f\"{snake.upper()}_H\"\n    year = datetime.now().year\n    is_header_only = (project_type == \"header-only\")\n\n    lines = []\n    lines.append(f\"#ifndef {guard}\")\n    lines.append(f\"#define {guard}\")\n    lines.append(\"\")\n    lines.append(f\"/// @file {snake}.h\")\n    lines.append(f\"/// @brief {camel} 工具类\")\n    lines.append(f\"/// @author Auto-generated\")\n    lines.append(f\"/// @date {year}\")\n    lines.append(\"\")\n    lines.append(f\"namespace {snake} {{\")\n    lines.append(\"\")\n    lines.append(f\"/**\")\n    lines.append(f\" * @brief 示例工具类\")\n    lines.append(f\" */\")\n    lines.append(f\"class {camel} {{\")\n    lines.append(\"public:\")\n    lines.append(f\"    {camel}() = default;\")\n    lines.append(f\"    ~{camel}() = default;\")\n    lines.append(\"\")\n    lines.append(f\"    /// @brief 示例方法\")\n    lines.append(f\"    /// @param x 输入值\")\n    lines.append(f\"    /// @return 计算结果\")\n    if is_header_only:\n        lines.append(f\"    int add(int x, int y) const {{ return x + y; }}\")\n    else:\n        lines.append(f\"    int add(int x, int y) const;\")\n    lines.append(\"\")\n    lines.append(\"private:\")\n    lines.append(f\"    int value_ = 0;  ///< 示例成员变量\")\n    lines.append(\"};\")\n    lines.append(\"\")\n    lines.append(f\"}}  // namespace {snake}\")\n    lines.append(\"\")\n    lines.append(f\"#endif  // {guard}\")\n    lines.append(\"\")\n\n    return \"\\n\".join(lines)\n\n\ndef generate_source(name: str, project_type: str) -> str:\n    \"\"\"生成源文件\"\"\"\n    snake = to_snake_case(name)\n    camel = to_camel_case(name)\n\n    lines = []\n    lines.append(f\"#include \\\"{snake}/{snake}.h\\\"\")\n    lines.append(\"\")\n    lines.append(f\"namespace {snake} {{\")\n    lines.append(\"\")\n    lines.append(f\"int {camel}::add(int x, int y) const {{\")\n    lines.append(\"    return x + y;\")\n    lines.append(\"}\")\n    lines.append(\"\")\n    lines.append(f\"}}  // namespace {snake}\")\n    lines.append(\"\")\n\n    return \"\\n\".join(lines)\n\n\ndef generate_main(name: str) -> str:\n    \"\"\"生成 main.cpp\"\"\"\n    snake = to_snake_case(name)\n    camel = to_camel_case(name)\n\n    lines = []\n    lines.append(f\"#include <iostream>\")\n    lines.append(f\"#include \\\"{snake}/{snake}.h\\\"\")\n    lines.append(\"\")\n    lines.append(\"int main(int argc, char* argv[]) {\")\n    lines.append(\"    (void)argc;\")\n    lines.append(\"    (void)argv;\")\n    lines.append(\"\")\n    lines.append(f\"    {snake}::{camel} app;\")\n    lines.append(f\"    std::cout << \\\"{name} v1.0.0\\\" << std::endl;\")\n    lines.append(f\"    std::cout << \\\"2 + 3 = \\\" << app.add(2, 3) << std::endl;\")\n    lines.append(\"\")\n    lines.append(\"    return 0;\")\n    lines.append(\"}\")\n    lines.append(\"\")\n\n    return \"\\n\".join(lines)\n\n\ndef generate_test(name: str, project_type: str) -> str:\n    \"\"\"生成测试文件\"\"\"\n    snake = to_snake_case(name)\n    camel = to_camel_case(name)\n\n    lines = []\n    lines.append(\"#include <gtest/gtest.h>\")\n    lines.append(f\"#include \\\"{snake}/{snake}.h\\\"\")\n    lines.append(\"\")\n    lines.append(f\"TEST({camel}Test, AddPositiveNumbers) {{\")\n    lines.append(f\"    {snake}::{camel} obj;\")\n    lines.append(\"    EXPECT_EQ(obj.add(2, 3), 5);\")\n    lines.append(\"    EXPECT_EQ(obj.add(0, 0), 0);\")\n    lines.append(\"}\")\n    lines.append(\"\")\n    lines.append(f\"TEST({camel}Test, AddNegativeNumbers) {{\")\n    lines.append(f\"    {snake}::{camel} obj;\")\n    lines.append(\"    EXPECT_EQ(obj.add(-1, 1), 0);\")\n    lines.append(\"    EXPECT_EQ(obj.add(-5, -3), -8);\")\n    lines.append(\"}\")\n    lines.append(\"\")\n\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 配置文件模板\n# ============================================================\n\ndef generate_gitignore() -> str:\n    \"\"\"生成 .gitignore\"\"\"\n    return \"\"\"# 构建目录\nbuild/\ncmake-build-*/\nout/\nbin/\nlib/\n\n# CMake\nCMakeCache.txt\nCMakeFiles/\ncmake_install.cmake\ninstall_manifest.txt\ncompile_commands.json\nCTestTestfile.cmake\n_deps/\n\n# 编译产物\n*.o\n*.obj\n*.a\n*.lib\n*.so\n*.dll\n*.dylib\n*.exe\n*.out\n*.app\n\n# 调试文件\n*.pdb\n*.ilk\n*.idb\n*.suo\n*.user\n*.userosscache\n*.sln.docstates\n\n# IDE\n.vscode/\n.idea/\n*.swp\n*.swo\n*~\n.DS_Store\n\n# 测试覆盖率\n*.gcno\n*.gcda\ncoverage.info\ncoverage/\n\n# 文档\ndocs/html/\ndocs/latex/\n\"\"\"\n\n\ndef generate_clang_format() -> str:\n    \"\"\"生成 .clang-format\"\"\"\n    return \"\"\"---\nLanguage: Cpp\nBasedOnStyle: LLVM\nIndentWidth: 4\nTabWidth: 4\nUseTab: Never\nColumnLimit: 100\nAccessModifierOffset: -4\nAlignAfterOpenBracket: Align\nAlignConsecutiveAssignments: false\nAlignConsecutiveDeclarations: false\nAlignEscapedNewlines: Right\nAlignOperands: true\nAlignTrailingComments: true\nAllowAllParametersOfDeclarationOnNextLine: true\nAllowShortBlocksOnASingleLine: false\nAllowShortCaseLabelsOnASingleLine: false\nAllowShortFunctionsOnASingleLine: Inline\nAllowShortIfStatementsOnASingleLine: false\nAllowShortLoopsOnASingleLine: false\nAlwaysBreakAfterDefinitionReturnType: None\nAlwaysBreakAfterReturnType: None\nAlwaysBreakBeforeMultilineStrings: true\nBreakBeforeBinaryOperators: None\nBreakBeforeBraces: Attach\nBreakBeforeTernaryOperators: true\nBreakConstructorInitializers: BeforeColon\nCompactNamespaces: false\nConstructorInitializerAllOnOneLineOrOnePerLine: true\nCpp11BracedListStyle: true\nDerivePointerAlignment: false\nFixNamespaceComments: true\nIncludeBlocks: Regroup\nIndentCaseLabels: true\nIndentPPDirectives: None\nNamespaceIndentation: None\nPointerAlignment: Left\nReflowComments: true\nSortIncludes: true\nSortUsingDeclarations: true\nSpaceAfterCStyleCast: false\nSpaceAfterTemplateKeyword: true\nSpaceBeforeAssignmentOperators: true\nSpaceBeforeParens: ControlStatements\nSpaceInEmptyParentheses: false\nSpacesBeforeTrailingComments: 2\nSpacesInAngles: false\nSpacesInContainerLiterals: true\nSpacesInCStyleCastParentheses: false\nSpacesInParentheses: false\nStandard: c++17\n...\n\"\"\"\n\n\ndef generate_readme(name: str, project_type: str, cpp_std: str,\n                     author: str, license: str, has_tests: bool) -> str:\n    \"\"\"生成 README.md\"\"\"\n    camel = to_camel_case(name)\n    year = datetime.now().year\n\n    type_desc = {\n        \"executable\": \"可执行文件\",\n        \"library\": \"静态库\",\n        \"header-only\": \"头文件库\",\n    }\n\n    lines = []\n    lines.append(f\"# {name}\")\n    lines.append(\"\")\n    lines.append(f\"> {camel} - C++{cpp_std} {type_desc.get(project_type, '项目')}\")\n    lines.append(\"\")\n    lines.append(\"## 特性\")\n    lines.append(\"\")\n    lines.append(f\"- C++{cpp_std} 标准\")\n    lines.append(\"- CMake 构建系统\")\n    if has_tests:\n        lines.append(\"- Google Test 单元测试\")\n    lines.append(\"- 跨平台支持（Linux / macOS / Windows）\")\n    lines.append(\"- 严格编译器警告\")\n    lines.append(\"\")\n    lines.append(\"## 项目结构\")\n    lines.append(\"\")\n    lines.append(\"```\")\n    lines.append(f\"{name}/\")\n    lines.append(\"├── CMakeLists.txt      # 构建配置\")\n    lines.append(\"├── README.md             # 项目说明\")\n    lines.append(\"├── .gitignore            # Git 忽略规则\")\n    lines.append(\"├── .clang-format         # 代码格式化配置\")\n    lines.append(\"├── include/              # 公共头文件\")\n    if project_type == \"executable\":\n        lines.append(\"├── src/                  # 源代码\")\n        lines.append(\"│   ├── main.cpp          # 入口文件\")\n    else:\n        lines.append(\"├── src/                  # 源代码\")\n    if has_tests:\n        lines.append(\"└── tests/                # 单元测试\")\n    lines.append(\"```\")\n    lines.append(\"\")\n    lines.append(\"## 快速开始\")\n    lines.append(\"\")\n    lines.append(\"### 依赖\")\n    lines.append(\"\")\n    lines.append(\"- CMake >= 3.14\")\n    lines.append(f\"- 支持 C++{cpp_std} 的编译器（GCC 8+ / Clang 7+ / MSVC 2019+）\")\n    if has_tests:\n        lines.append(\"- Git（用于下载 Google Test）\")\n    lines.append(\"\")\n    lines.append(\"### 构建\")\n    lines.append(\"\")\n    lines.append(\"```bash\")\n    lines.append(\"mkdir build && cd build\")\n    lines.append(\"cmake ..\")\n    lines.append(\"make -j$(nproc)\")\n    lines.append(\"```\")\n    lines.append(\"\")\n    if project_type == \"executable\":\n        lines.append(\"### 运行\")\n        lines.append(\"\")\n        lines.append(\"```bash\")\n        lines.append(f\"./bin/{name}\")\n        lines.append(\"```\")\n        lines.append(\"\")\n    if has_tests:\n        lines.append(\"### 测试\")\n        lines.append(\"\")\n        lines.append(\"```bash\")\n        lines.append(\"cd build\")\n        lines.append(\"ctest --output-on-failure\")\n        lines.append(\"```\")\n        lines ndif  // DEMO_APP_H\n", "examples/sample-executable-project/tests/CMakeLists.txt": "# Google Test 通过 FetchContent 获取\ninclude(FetchContent)\nFetchContent_Declare(\n    googletest\n    GIT_REPOSITORY https://github.com/google/googletest.git\n    GIT_TAG v1.14.0\n)\n# 防止 Google Test 覆盖父项目的编译器/链接器设置\nset(gtest_force_shared_crt ON CACHE BOOL \"\" FORCE)\nFetchContent_MakeAvailable(googletest)\n\nadd_executable(tests test_demo_app.cpp)\ntarget_link_libraries(tests PRIVATE GTest::gtest_main)\ntarget_include_directories(tests PRIVATE ${CMAKE_SOURCE_DIR}/include)\ntarget_sources(tests PRIVATE ${CMAKE_SOURCE_DIR}/src/demo_app.cpp)\n\ninclude(GoogleTest)\ngtest_discover_tests(tests)\n\n", "examples/sample-executable-project/tests/test_demo_app.cpp": "#include <gtest/gtest.h>\n#include \"demo_app/demo_app.h\"\n\nTEST(DemoAppTest, AddPositiveNumbers) {\n    demo_app::DemoApp obj;\n    EXPECT_EQ(obj.add(2, 3), 5);\n    EXPECT_EQ(obj.add(0, 0), 0);\n}\n\nTEST(DemoAppTest, AddNegativeNumbers) {\n    demo_app::DemoApp obj;\n    EXPECT_EQ(obj.add(-1, 1), 0);\n    EXPECT_EQ(obj.add(-5, -3), -8);\n}\n", "examples/sample-executable-project/src/main.cpp": "#include <iostream>\n#include \"demo_app/demo_app.h\"\n\nint main(int argc, char* argv[]) {\n    (void)argc;\n    (void)argv;\n\n    demo_app::DemoApp app;\n    std::cout << \"demo-app v1.0.0\" << std::endl;\n    std::cout << \"2 + 3 = \" << app.add(2, 3) << std::endl;\n\n    return 0;\n}\n", "examples/sample-executable-project/src/demo_app.cpp": "#include \"demo_app/demo_app.h\"\n\nnamespace demo_app {\n\nint DemoApp::add(int x, int y) const {\n    return x + y;\n}\n\n}  // namespace demo_app\n"}, "file_count": 21, "script_lines": 629}, {"name": "csv-data-cleaner", "title": "csv-data-cleaner", "description": "CSV 数据清洗助手。读取 CSV/TSV 文件，自动检测并修复常见数据质量问题：重复行、缺失值、前后空格、大小写不一致、空行、异常值、日期格式不统一、数值列混入文本。支持 dry-run 预览清洗方案，输出清洗后的数据文件和清洗报告（清洗前后对比、问题统计、修复动作）。适用于导出数据整理、实验数据清洗、表格数据预处理、数据分析前的数据准备等场景。", "category": "数据处理", "icon": "🧹", "color": "#14b8a6", "skill_md": "---\nname: csv-data-cleaner\ndescription: 'CSV 数据清洗助手。读取 CSV/TSV 文件，自动检测并修复常见数据质量问题：重复行、缺失值、前后空格、大小写不一致、空行、异常值、日期格式不统一、数值列混入文本。支持 dry-run 预览清洗方案，输出清洗后的数据文件和清洗报告（清洗前后对比、问题统计、修复动作）。适用于导出数据整理、实验数据清洗、表格数据预处理、数据分析前的数据准备等场景。'\n---\n\n# CSV 数据清洗助手\n\n## 一、技能定位\n\n本技能用于**自动检测和修复 CSV/TSV 表格数据中的常见质量问题**。核心价值：\n\n- 全面检测：重复行、缺失值、空行、空格污染、大小写不一致、异常值、格式不统一\n- 安全修复：dry-run 预览 → 确认后执行，不破坏原始数据\n- 智能处理：自动识别列类型（数值/文本/日期/布尔），按类型选择合适的清洗策略\n- 完整报告：清洗前后对比、问题统计、每列修复动作明细\n- 零依赖：纯 Python 标准库，无需 pandas/openpyxl 等外部依赖\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我清洗一下这个 CSV」「这个表格数据太乱了，帮我整理」\n2. 用户说「帮我检查一下这个 CSV 有什么问题」\n3. 用户说「这个 CSV 有重复行/空值，帮我清理」\n4. 用户说「导出的数据格式不统一，帮我标准化」\n5. 用户说「数据分析前帮我把数据预处理一下」\n6. 用户提供 CSV 文件路径或内容，要求「清洗」「整理」「去重」「补全缺失值」\n\n## 三、检测的问题类型\n\n### 3.1 结构问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 空行 | 完全为空的行 | 低 |\n| 列数不一致 | 某行字段数与表头不匹配 | 高 |\n| 表头缺失 | 文件没有列名 | 中 |\n| BOM 头 | UTF-8 BOM 导致首列名异常 | 低 |\n\n### 3.2 重复问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 完全重复行 | 所有列值完全相同 | 高 |\n| 近似重复行 | 关键字段相同，其他字段略有差异 | 中 |\n\n### 3.3 缺失值问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 空单元格 | 值为空字符串或 null/NA/N/A | 中 |\n| 整行缺失率过高 | 某行超过 50% 的列为空 | 高 |\n| 整列缺失率过高 | 某列超过 50% 的值为空 | 中 |\n\n### 3.4 格式问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 前后空格 | 值首尾有空格（如「 北京 」） | 中 |\n| 大小写不一致 | 如「Beijing」「beijing」「BEIJING」混用 | 中 |\n| 日期格式不统一 | 如「2024-01-15」「2024/1/15」「01-15-2024」混用 | 中 |\n| 数值混入文本 | 数值列中有「N/A」「未知」「」等非数值 | 中 |\n| 数值格式不统一 | 如「1,000」「1000」「1.000」混用 | 低 |\n\n### 3.5 异常值问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 数值离群点 | 超出均值±3标准差的极端值 | 低（仅报告） |\n| 文本列异常长值 | 超过平均长度3倍的值 | 低（仅报告） |\n\n## 四、清洗操作\n\n### 4.1 默认执行的清洗\n\n| 操作 | 说明 |\n|---|---|\n| 删除空行 | 完全为空的行直接删除 |\n| 去除首尾空格 | 所有文本值 strip() |\n| 统一大小写选项 | 可选：标题化/全小写/全大写 |\n| 删除完全重复行 | 保留首次出现的行 |\n| 标准化日期 | 识别常见日期格式，统一为 YYYY-MM-DD |\n| 数值列清洗 | 去除千分位逗号，转换为数值；非数值值标记为缺失 |\n| 清理 BOM | 移除 UTF-8 BOM 头 |\n\n### 4.2 缺失值处理策略\n\n| 策略 | 说明 | 适用 |\n|---|---|---|\n| `drop` | 删除含缺失值的行 | 缺失少、不能估算 |\n| `fill_na` | 填充为 `N/A` 或用户指定值 | 文本列 |\n| `fill_mean` | 填充为列均值 | 数值列 |\n| `fill_median` | 填充为列中位数 | 数值列（有离群点时） |\n| `forward` | 前向填充（用上一个有效值） | 时间序列 |\n| `ignore` | 不处理，保留原样 | 仅检测不清洗 |\n\n### 4.3 清洗模式\n\n| 模式 | 说明 |\n|---|---|\n| `analyze` | 仅检测问题，不修改数据 |\n| `dry-run` | 预览清洗方案，输出清洗后数据但不写文件 |\n| `execute` | 实际执行清洗，输出清洗后文件和报告 |\n\n## 五、操作步骤\n\n### 步骤 1：接收数据文件\n\n1. 确认 CSV 文件路径（必须是本地文件路径）\n2. 检测分隔符（自动识别逗号/制表符/分号）\n3. 检测编码（UTF-8/GBK/Latin-1）\n4. 读取表头和数据行\n5. 如果数据量很大（>10000行），告知用户处理时间\n\n### 步骤 2：运行检测脚本\n\n使用 `scripts/clean_csv.py` 进行检测和清洗：\n\n```bash\n# 仅分析（检测问题，不修改）\npython3 scripts/clean_csv.py --input data.csv --mode analyze\n\n# 预览清洗方案（dry-run）\npython3 scripts/clean_csv.py --input data.csv --mode dry-run\n\n# 执行清洗\npython3 scripts/clean_csv.py --input data.csv --mode execute --output cleaned.csv\n\n# 指定缺失值处理策略\npython3 scripts/clean_csv.py --input data.csv --mode execute --missing-strategy fill_na\n\n# 删除完全重复行\npython3 scripts/clean_csv.py --input data.csv --mode execute --remove-duplicates\n\n# 去除首尾空格\npython3 scripts/clean_csv.py --input data.csv --mode execute --trim-whitespace\n\n# 自动检测编码和分隔符\npython3 scripts/clean_csv.py --input data.csv --mode analyze\n```\n\n### 步骤 3：解读检测结果\n\n脚本输出包含：\n\n```\n📊 CSV 数据检测报告\n━━━━━━━━━━━━━━━━━━\n文件：data.csv\n行数：1000 | 列数：8 | 分隔符：, | 编码：utf-8\n\n📋 列信息：\n  列名          类型    缺失率  唯一值数\n  ─────────────────────────────\n  姓名          文本    0.0%    950\n  年龄          数值    2.5%    45\n  入职日期      日期    1.0%    300\n  部门          文本    0.0%    12\n  薪资          数值    5.0%    800\n\n⚠ 发现的问题：\n  1. 5 行完全重复\n  2. 3 个空行\n  3. \"部门\"列有大小写不一致：研发/研发部/R&D\n  4. \"年龄\"列有2个非数值值：'未知', 'N/A'\n  5. 2 个异常值：年龄 150、薪资 0\n  6. 所有文本列有首尾空格\n\n💡 建议清洗操作：\n  - 删除空行（3行）\n  - 删除完全重复行（5行）\n  - 去除所有文本首尾空格\n  - 统一\"部门\"列大小写\n  - 将\"年龄\"列的非数值值标记为缺失\n  - 用中位数填充年龄缺失值\n```\n\n### 步骤 4：确认清洗策略\n\n根据检测结果和用户需求，确认清洗策略：\n\n1. **是否删除重复行？** 默认删除完全重复行，近似重复行需用户确认\n2. **缺失值如何处理？** 根据列类型推荐策略：\n   - 数值列：中位数填充（抗离群）\n   - 文本列：填充为 \"N/A\" 或删除\n   - 日期列：前向填充或删除\n3. **是否去除首尾空格？** 默认去除\n4. **是否统一日期格式？** 默认统一为 YYYY-MM-DD\n5. **异常值如何处理？** 默认仅报告不处理（不轻易删除数据）\n\n### 步骤 5：执行清洗\n\n1. 运行清洗脚本（execute 模式）\n2. 输出清洗后的数据文件（CSV 格式）\n3. 生成清洗报告（清洗前后对比）\n4. 原始数据不修改，清洗后数据另存\n\n### 步骤 6：交付结果\n\n输出：\n1. **清洗后 CSV 文件**：`cleaned.csv`\n2. **清洗报告**：统计清洗前后对比\n3. **修改摘要**：每列做了什么操作\n\n## 六、输出规范\n\n### 6.1 分析报告\n\n```\n📊 CSV 数据检测报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n文件：data.csv\n行数：1,000 | 列数：8\n分隔符：逗号 | 编码：UTF-8\n\n📋 列信息：\n┌──────────┬──────┬────────┬──────────┐\n│ 列名     │ 类型 │ 缺失率 │ 唯一值数 │\n├──────────┼──────┼────────┼──────────┤\n│ 姓名     │ 文本 │ 0.0%   │ 950      │\n│ 年龄     │ 数值 │ 2.5%   │ 45       │\n│ 入职日期 │ 日期 │ 1.0%   │ 300      │\n│ 部门     │ 文本 │ 0.0%   │ 12       │\n│ 薪资     │ 数值 │ 5.0%   │ 800      │\n└──────────┴──────┴────────┴──────────┘\n\n⚠ 问题列表：\n  1. [高] 5行完全重复\n  2. [中] 3个空行\n  3. [中] \"部门\"列大小写不一致（研发/研发部/R&D）\n  4. [中] \"年龄\"列2个非数值值\n  5. [低] 2个异常值（年龄150、薪资0）\n  6. [低] 所有文本列有首尾空格\n```\n\n### 6.2 清洗报告\n\n```\n✅ CSV 数据清洗报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n原始文件：data.csv\n清洗后文件：cleaned.csv\n\n📈 清洗前后对比：\n┌──────────┬──────────┬──────────┐\n│ 指标     │ 清洗前   │ 清洗后   │\n├──────────┼──────────┼──────────┤\n│ 行数     │ 1,000    │ 992      │\n│ 空行数   │ 3        │ 0        │\n│ 重复行数 │ 5        │ 0        │\n│ 缺失值数 │ 23       │ 0        │\n│ 列数     │ 8        │ 8        │\n└──────────┴──────────┴──────────┘\n\n🔧 执行的操作：\n  ✅ 删除空行：3行\n  ✅ 删除完全重复行：5行\n  ✅ 去除首尾空格：1,000个单元格\n  ✅ 统一日期格式：10个单元格\n  ✅ 数值列清洗：2个非数值值标记为缺失\n  ✅ 缺失值填充：23个单元格（数值列中位数填充）\n\n📋 列级清洗明细：\n  - 姓名：trim空格，无缺失\n  - 年龄：2个非数值→缺失→中位数填充\n  - 入职日期：统一为YYYY-MM-DD\n  - 部门：trim空格\n  - 薪资：5个缺失值→中位数填充\n```\n\n## 七、常见场景处理\n\n### 场景 1：导出数据去重\n**用户**：「这是从系统导出的 CSV，有重复行，帮我清理」\n**处理**：检测重复行 → dry-run 预览 → 确认后删除重复行 → 输出清洗后文件。\n\n### 场景 2：实验数据预处理\n**用户**：「实验数据有缺失值和异常值，帮我预处理一下」\n**处理**：检测缺失值分布 → 数值列用中位数填充 → 异常值仅报告不删除（标记） → 输出清洗后数据。\n\n### 场景 3：数据格式统一\n**用户**：「这个 CSV 日期格式乱七八糟，帮我统一」\n**处理**：检测日期列的各种格式 → 统一为 YYYY-MM-DD → 报告转换了多少个值。\n\n### 场景 4：仅检测不修改\n**用户**：「帮我看看这个 CSV 有什么问题，先不要改」\n**处理**：analyze 模式 → 输出问题列表和建议 → 不修改数据。\n\n### 场景 5：多列缺失值处理\n**用户**：「帮我把这个 CSV 的缺失值都处理一下」\n**处理**：分析每列缺失率和类型 → 数值列中位数填充 → 文本列填充 \"N/A\" → 输出清洗后文件。\n\n## 八、注意事项\n\n1. **不修改原始文件**：清洗后数据另存为新文件，原始文件保持不变。\n2. **异常值不自动删除**：异常值仅报告，不自动删除（避免误删真实数据）。\n3. **近似重复需确认**：完全重复行可自动删除，近似重复行需用户确认。\n4. **大文件处理**：超过 10 万行的文件，告知用户可能需要较长时间。\n5. **编码检测**：自动检测 UTF-8/GBK/Latin-1，检测失败时提示用户指定编码。\n6. **列类型推断**：基于采样（前100行）推断列类型，可能有误差。\n7. **保留表头**：清洗不修改表头行。\n8. **不替代专业数据工具**：复杂数据清洗（如正则替换、业务规则）建议结合 AI 语义处理。\n9. **隐私保护**：不读取文件以外的数据，清洗过程在本地完成。\n10. **备份原始数据**：建议用户在清洗前备份原始文件。\n\n## 九、文件结构\n\n```\ncsv-data-cleaner/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── cleaning-report-template.md      # 清洗报告模板\n├── scripts/\n│   └── clean_csv.py                      # CSV 检测与清洗脚本\n└── examples/\n    ├── sample-messy-data.csv             # 示例：混乱的 CSV 数据\n    └── sample-cleaned-report.md          # 示例：清洗报告\n```\n\n## 十、使用示例\n\n### 示例 1：检测 CSV 问题\n**用户**：「帮我看看这个 CSV 有什么问题」\n**AI**：运行 analyze 模式 → 输出检测报告 → 列出所有问题和建议。\n\n### 示例 2：清洗并输出\n**用户**：「帮我清洗这个 CSV，去重去空行」\n**AI**：dry-run 预览 → 用户确认 → execute 执行 → 输出清洗后文件和报告。\n\n### 示例 3：处理缺失值\n**用户**：「这个 CSV 有很多空值，帮我处理一下」\n**AI**：分析缺失值分布 → 推荐填充策略 → 用户确认 → 执行填充 → 输出报告。\n", "files": {"SKILL.md": "---\nname: csv-data-cleaner\ndescription: 'CSV 数据清洗助手。读取 CSV/TSV 文件，自动检测并修复常见数据质量问题：重复行、缺失值、前后空格、大小写不一致、空行、异常值、日期格式不统一、数值列混入文本。支持 dry-run 预览清洗方案，输出清洗后的数据文件和清洗报告（清洗前后对比、问题统计、修复动作）。适用于导出数据整理、实验数据清洗、表格数据预处理、数据分析前的数据准备等场景。'\n---\n\n# CSV 数据清洗助手\n\n## 一、技能定位\n\n本技能用于**自动检测和修复 CSV/TSV 表格数据中的常见质量问题**。核心价值：\n\n- 全面检测：重复行、缺失值、空行、空格污染、大小写不一致、异常值、格式不统一\n- 安全修复：dry-run 预览 → 确认后执行，不破坏原始数据\n- 智能处理：自动识别列类型（数值/文本/日期/布尔），按类型选择合适的清洗策略\n- 完整报告：清洗前后对比、问题统计、每列修复动作明细\n- 零依赖：纯 Python 标准库，无需 pandas/openpyxl 等外部依赖\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我清洗一下这个 CSV」「这个表格数据太乱了，帮我整理」\n2. 用户说「帮我检查一下这个 CSV 有什么问题」\n3. 用户说「这个 CSV 有重复行/空值，帮我清理」\n4. 用户说「导出的数据格式不统一，帮我标准化」\n5. 用户说「数据分析前帮我把数据预处理一下」\n6. 用户提供 CSV 文件路径或内容，要求「清洗」「整理」「去重」「补全缺失值」\n\n## 三、检测的问题类型\n\n### 3.1 结构问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 空行 | 完全为空的行 | 低 |\n| 列数不一致 | 某行字段数与表头不匹配 | 高 |\n| 表头缺失 | 文件没有列名 | 中 |\n| BOM 头 | UTF-8 BOM 导致首列名异常 | 低 |\n\n### 3.2 重复问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 完全重复行 | 所有列值完全相同 | 高 |\n| 近似重复行 | 关键字段相同，其他字段略有差异 | 中 |\n\n### 3.3 缺失值问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 空单元格 | 值为空字符串或 null/NA/N/A | 中 |\n| 整行缺失率过高 | 某行超过 50% 的列为空 | 高 |\n| 整列缺失率过高 | 某列超过 50% 的值为空 | 中 |\n\n### 3.4 格式问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 前后空格 | 值首尾有空格（如「 北京 」） | 中 |\n| 大小写不一致 | 如「Beijing」「beijing」「BEIJING」混用 | 中 |\n| 日期格式不统一 | 如「2024-01-15」「2024/1/15」「01-15-2024」混用 | 中 |\n| 数值混入文本 | 数值列中有「N/A」「未知」「」等非数值 | 中 |\n| 数值格式不统一 | 如「1,000」「1000」「1.000」混用 | 低 |\n\n### 3.5 异常值问题\n\n| 问题 | 说明 | 严重度 |\n|---|---|---|\n| 数值离群点 | 超出均值±3标准差的极端值 | 低（仅报告） |\n| 文本列异常长值 | 超过平均长度3倍的值 | 低（仅报告） |\n\n## 四、清洗操作\n\n### 4.1 默认执行的清洗\n\n| 操作 | 说明 |\n|---|---|\n| 删除空行 | 完全为空的行直接删除 |\n| 去除首尾空格 | 所有文本值 strip() |\n| 统一大小写选项 | 可选：标题化/全小写/全大写 |\n| 删除完全重复行 | 保留首次出现的行 |\n| 标准化日期 | 识别常见日期格式，统一为 YYYY-MM-DD |\n| 数值列清洗 | 去除千分位逗号，转换为数值；非数值值标记为缺失 |\n| 清理 BOM | 移除 UTF-8 BOM 头 |\n\n### 4.2 缺失值处理策略\n\n| 策略 | 说明 | 适用 |\n|---|---|---|\n| `drop` | 删除含缺失值的行 | 缺失少、不能估算 |\n| `fill_na` | 填充为 `N/A` 或用户指定值 | 文本列 |\n| `fill_mean` | 填充为列均值 | 数值列 |\n| `fill_median` | 填充为列中位数 | 数值列（有离群点时） |\n| `forward` | 前向填充（用上一个有效值） | 时间序列 |\n| `ignore` | 不处理，保留原样 | 仅检测不清洗 |\n\n### 4.3 清洗模式\n\n| 模式 | 说明 |\n|---|---|\n| `analyze` | 仅检测问题，不修改数据 |\n| `dry-run` | 预览清洗方案，输出清洗后数据但不写文件 |\n| `execute` | 实际执行清洗，输出清洗后文件和报告 |\n\n## 五、操作步骤\n\n### 步骤 1：接收数据文件\n\n1. 确认 CSV 文件路径（必须是本地文件路径）\n2. 检测分隔符（自动识别逗号/制表符/分号）\n3. 检测编码（UTF-8/GBK/Latin-1）\n4. 读取表头和数据行\n5. 如果数据量很大（>10000行），告知用户处理时间\n\n### 步骤 2：运行检测脚本\n\n使用 `scripts/clean_csv.py` 进行检测和清洗：\n\n```bash\n# 仅分析（检测问题，不修改）\npython3 scripts/clean_csv.py --input data.csv --mode analyze\n\n# 预览清洗方案（dry-run）\npython3 scripts/clean_csv.py --input data.csv --mode dry-run\n\n# 执行清洗\npython3 scripts/clean_csv.py --input data.csv --mode execute --output cleaned.csv\n\n# 指定缺失值处理策略\npython3 scripts/clean_csv.py --input data.csv --mode execute --missing-strategy fill_na\n\n# 删除完全重复行\npython3 scripts/clean_csv.py --input data.csv --mode execute --remove-duplicates\n\n# 去除首尾空格\npython3 scripts/clean_csv.py --input data.csv --mode execute --trim-whitespace\n\n# 自动检测编码和分隔符\npython3 scripts/clean_csv.py --input data.csv --mode analyze\n```\n\n### 步骤 3：解读检测结果\n\n脚本输出包含：\n\n```\n📊 CSV 数据检测报告\n━━━━━━━━━━━━━━━━━━\n文件：data.csv\n行数：1000 | 列数：8 | 分隔符：, | 编码：utf-8\n\n📋 列信息：\n  列名          类型    缺失率  唯一值数\n  ─────────────────────────────\n  姓名          文本    0.0%    950\n  年龄          数值    2.5%    45\n  入职日期      日期    1.0%    300\n  部门          文本    0.0%    12\n  薪资          数值    5.0%    800\n\n⚠ 发现的问题：\n  1. 5 行完全重复\n  2. 3 个空行\n  3. \"部门\"列有大小写不一致：研发/研发部/R&D\n  4. \"年龄\"列有2个非数值值：'未知', 'N/A'\n  5. 2 个异常值：年龄 150、薪资 0\n  6. 所有文本列有首尾空格\n\n💡 建议清洗操作：\n  - 删除空行（3行）\n  - 删除完全重复行（5行）\n  - 去除所有文本首尾空格\n  - 统一\"部门\"列大小写\n  - 将\"年龄\"列的非数值值标记为缺失\n  - 用中位数填充年龄缺失值\n```\n\n### 步骤 4：确认清洗策略\n\n根据检测结果和用户需求，确认清洗策略：\n\n1. **是否删除重复行？** 默认删除完全重复行，近似重复行需用户确认\n2. **缺失值如何处理？** 根据列类型推荐策略：\n   - 数值列：中位数填充（抗离群）\n   - 文本列：填充为 \"N/A\" 或删除\n   - 日期列：前向填充或删除\n3. **是否去除首尾空格？** 默认去除\n4. **是否统一日期格式？** 默认统一为 YYYY-MM-DD\n5. **异常值如何处理？** 默认仅报告不处理（不轻易删除数据）\n\n### 步骤 5：执行清洗\n\n1. 运行清洗脚本（execute 模式）\n2. 输出清洗后的数据文件（CSV 格式）\n3. 生成清洗报告（清洗前后对比）\n4. 原始数据不修改，清洗后数据另存\n\n### 步骤 6：交付结果\n\n输出：\n1. **清洗后 CSV 文件**：`cleaned.csv`\n2. **清洗报告**：统计清洗前后对比\n3. **修改摘要**：每列做了什么操作\n\n## 六、输出规范\n\n### 6.1 分析报告\n\n```\n📊 CSV 数据检测报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n文件：data.csv\n行数：1,000 | 列数：8\n分隔符：逗号 | 编码：UTF-8\n\n📋 列信息：\n┌──────────┬──────┬────────┬──────────┐\n│ 列名     │ 类型 │ 缺失率 │ 唯一值数 │\n├──────────┼──────┼────────┼──────────┤\n│ 姓名     │ 文本 │ 0.0%   │ 950      │\n│ 年龄     │ 数值 │ 2.5%   │ 45       │\n│ 入职日期 │ 日期 │ 1.0%   │ 300      │\n│ 部门     │ 文本 │ 0.0%   │ 12       │\n│ 薪资     │ 数值 │ 5.0%   │ 800      │\n└──────────┴──────┴────────┴──────────┘\n\n⚠ 问题列表：\n  1. [高] 5行完全重复\n  2. [中] 3个空行\n  3. [中] \"部门\"列大小写不一致（研发/研发部/R&D）\n  4. [中] \"年龄\"列2个非数值值\n  5. [低] 2个异常值（年龄150、薪资0）\n  6. [低] 所有文本列有首尾空格\n```\n\n### 6.2 清洗报告\n\n```\n✅ CSV 数据清洗报告\n━━━━━━━━━━━━━━━━━━━━━━━━\n原始文件：data.csv\n清洗后文件：cleaned.csv\n\n📈 清洗前后对比：\n┌──────────┬──────────┬──────────┐\n│ 指标     │ 清洗前   │ 清洗后   │\n├──────────┼──────────┼──────────┤\n│ 行数     │ 1,000    │ 992      │\n│ 空行数   │ 3        │ 0        │\n│ 重复行数 │ 5        │ 0        │\n│ 缺失值数 │ 23       │ 0        │\n│ 列数     │ 8        │ 8        │\n└──────────┴──────────┴──────────┘\n\n🔧 执行的操作：\n  ✅ 删除空行：3行\n  ✅ 删除完全重复行：5行\n  ✅ 去除首尾空格：1,000个单元格\n  ✅ 统一日期格式：10个单元格\n  ✅ 数值列清洗：2个非数值值标记为缺失\n  ✅ 缺失值填充：23个单元格（数值列中位数填充）\n\n📋 列级清洗明细：\n  - 姓名：trim空格，无缺失\n  - 年龄：2个非数值→缺失→中位数填充\n  - 入职日期：统一为YYYY-MM-DD\n  - 部门：trim空格\n  - 薪资：5个缺失值→中位数填充\n```\n\n## 七、常见场景处理\n\n### 场景 1：导出数据去重\n**用户**：「这是从系统导出的 CSV，有重复行，帮我清理」\n**处理**：检测重复行 → dry-run 预览 → 确认后删除重复行 → 输出清洗后文件。\n\n### 场景 2：实验数据预处理\n**用户**：「实验数据有缺失值和异常值，帮我预处理一下」\n**处理**：检测缺失值分布 → 数值列用中位数填充 → 异常值仅报告不删除（标记） → 输出清洗后数据。\n\n### 场景 3：数据格式统一\n**用户**：「这个 CSV 日期格式乱七八糟，帮我统一」\n**处理**：检测日期列的各种格式 → 统一为 YYYY-MM-DD → 报告转换了多少个值。\n\n### 场景 4：仅检测不修改\n**用户**：「帮我看看这个 CSV 有什么问题，先不要改」\n**处理**：analyze 模式 → 输出问题列表和建议 → 不修改数据。\n\n### 场景 5：多列缺失值处理\n**用户**：「帮我把这个 CSV 的缺失值都处理一下」\n**处理**：分析每列缺失率和类型 → 数值列中位数填充 → 文本列填充 \"N/A\" → 输出清洗后文件。\n\n## 八、注意事项\n\n1. **不修改原始文件**：清洗后数据另存为新文件，原始文件保持不变。\n2. **异常值不自动删除**：异常值仅报告，不自动删除（避免误删真实数据）。\n3. **近似重复需确认**：完全重复行可自动删除，近似重复行需用户确认。\n4. **大文件处理**：超过 10 万行的文件，告知用户可能需要较长时间。\n5. **编码检测**：自动检测 UTF-8/GBK/Latin-1，检测失败时提示用户指定编码。\n6. **列类型推断**：基于采样（前100行）推断列类型，可能有误差。\n7. **保留表头**：清洗不修改表头行。\n8. **不替代专业数据工具**：复杂数据清洗（如正则替换、业务规则）建议结合 AI 语义处理。\n9. **隐私保护**：不读取文件以外的数据，清洗过程在本地完成。\n10. **备份原始数据**：建议用户在清洗前备份原始文件。\n\n## 九、文件结构\n\n```\ncsv-data-cleaner/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── cleaning-report-template.md      # 清洗报告模板\n├── scripts/\n│   └── clean_csv.py                      # CSV 检测与清洗脚本\n└── examples/\n    ├── sample-messy-data.csv             # 示例：混乱的 CSV 数据\n    └── sample-cleaned-report.md          # 示例：清洗报告\n```\n\n## 十、使用示例\n\n### 示例 1：检测 CSV 问题\n**用户**：「帮我看看这个 CSV 有什么问题」\n**AI**：运行 analyze 模式 → 输出检测报告 → 列出所有问题和建议。\n\n### 示例 2：清洗并输出\n**用户**：「帮我清洗这个 CSV，去重去空行」\n**AI**：dry-run 预览 → 用户确认 → execute 执行 → 输出清洗后文件和报告。\n\n### 示例 3：处理缺失值\n**用户**：「这个 CSV 有很多空值，帮我处理一下」\n**AI**：分析缺失值分布 → 推荐填充策略 → 用户确认 → 执行填充 → 输出报告。\n", "templates/cleaning-report-template.md": "# CSV 数据清洗报告模板\n\n> 本模板用于生成标准化的 CSV 数据清洗报告。\n\n---\n\n## 📊 CSV 数据检测/清洗报告\n\n**文件**：`data.csv`\n**清洗时间**：YYYY-MM-DD HH:MM:SS\n**模式**：analyze / dry-run / execute\n**编码**：UTF-8 | **分隔符**：逗号\n\n---\n\n### 一、基本信息\n\n| 指标 | 数值 |\n|---|---|\n| 行数 | X,XXX |\n| 列数 | X |\n| 列名 | 列1, 列2, 列3, ... |\n\n---\n\n### 二、列信息\n\n| 列名 | 推断类型 | 缺失率 | 说明 |\n|---|---|---|---|\n| 列1 | numeric / date / text / boolean | X.X% | ... |\n| 列2 | ... | ... | ... |\n\n---\n\n### 三、检测到的问题\n\n| # | 严重度 | 问题类型 | 详情 |\n|---|---|---|---|\n| 1 | 🔴 高 | 完全重复行 | X 行与其他行完全相同 |\n| 2 | 🟡 中 | 缺失值 | '列名'列有 X 个缺失值（X.X%） |\n| 3 | 🟡 中 | 首尾空格 | X 个值有首尾空格 |\n| 4 | 🟡 中 | 类型不匹配 | '列名'列有 X 个非数值值 |\n| 5 | 🟢 低 | 空行 | X 个完全为空的行 |\n| 6 | 🟢 低 | 异常值 | '列名'列有 X 个离群值 |\n\n---\n\n### 四、清洗前后对比（execute 模式）\n\n| 指标 | 清洗前 | 清洗后 |\n|---|---|---|\n| 行数 | X,XXX | X,XXX |\n| 空行 | X | 0 |\n| 重复行 | X | 0 |\n| 缺失值 | XX | 0 |\n\n---\n\n### 五、执行的操作\n\n- ✅ 删除空行：X 行\n- ✅ 删除完全重复行：X 行\n- ✅ 去除首尾空格：X 个单元格\n- ✅ 缺失值填充：X 个单元格（策略：fill_median）\n- ✅ 统一日期格式：X 个单元格\n\n---\n\n### 六、输出文件\n\n- 清洗后数据：`cleaned.csv`\n- 清洗报告：`cleaning-report.md`\n\n---\n\n*报告由 csv-data-cleaner 技能自动生成*\n", "scripts/clean_csv.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\n\"\"\"\nCSV 数据清洗脚本\n\n读取 CSV/TSV 文件，检测数据质量问题并执行清洗。\n支持三种模式：analyze（仅检测）、dry-run（预览）、execute（执行）。\n\n用法：\n  python3 clean_csv.py --input data.csv --mode analyze\n  python3 clean_csv.py --input data.csv --mode dry-run\n  python3 clean_csv.py --input data.csv --mode execute --output cleaned.csv\n  python3 clean_csv.py --input data.csv --mode execute --missing-strategy fill_na\n  python3 clean_csv.py --input data.csv --mode execute --remove-duplicates --trim-whitespace\n\"\"\"\n\nimport argparse\nimport csv\nimport io\nimport os\nimport re\nimport sys\nfrom collections import Counter\nfrom datetime import datetime\nfrom statistics import mean, median, stdev\nfrom typing import Dict, List, Optional, Tuple\n\n\n# ============================================================\n# 工具函数\n# ============================================================\n\n# 缺失值标记\nMISSING_TOKENS = {\"\", \" \", \"na\", \"n/a\", \"n.a\", \"null\", \"none\", \"nil\",\n                  \"nan\", \"undefined\", \"-\", \"--\", \"未知\", \"无\", \"不适用\"}\n\n# 日期格式模式\nDATE_PATTERNS = [\n    (r'^\\d{4}[-/]\\d{1,2}[-/]\\d{1,2}$', '%Y-%m-%d', ['-', '/']),\n    (r'^\\d{1,2}[-/]\\d{1,2}[-/]\\d{4}$', None, ['-', '/']),  # 月/日/年 or 日/月/年\n    (r'^\\d{4}年\\d{1,2}月\\d{1,2}日$', None, None),\n    (r'^\\d{4}\\d{2}\\d{2}$', '%Y%m%d', None),\n]\n\n\ndef is_missing(value: str) -> bool:\n    \"\"\"判断值是否为缺失\"\"\"\n    return value.strip().lower() in MISSING_TOKENS\n\n\ndef try_numeric(value: str) -> Optional[float]:\n    \"\"\"尝试将值转换为数值，失败返回 None\"\"\"\n    if is_missing(value):\n        return None\n    # 去除千分位逗号和货币符号\n    cleaned = re.sub(r'[¥$€£,，\\s]', '', value)\n    try:\n        return float(cleaned)\n    except ValueError:\n        return None\n\n\ndef try_date(value: str) -> Optional[str]:\n    \"\"\"尝试将值解析为日期，返回标准化的 YYYY-MM-DD 或 None\"\"\"\n    if is_missing(value):\n        return None\n    value = value.strip()\n\n    # 尝试常见格式\n    formats = [\n        '%Y-%m-%d', '%Y/%m/%d', '%Y.%m.%d',\n        '%m/%d/%Y', '%d/%m/%Y',\n        '%Y年%m月%d日',\n        '%Y%m%d',\n        '%Y-%m-%d %H:%M:%S',\n        '%Y/%m/%d %H:%M:%S',\n    ]\n    for fmt in formats:\n        try:\n            dt = datetime.strptime(value, fmt)\n            return dt.strftime('%Y-%m-%d')\n        except ValueError:\n            continue\n    return None\n\n\ndef detect_delimiter(filepath: str) -> str:\n    \"\"\"自动检测 CSV 分隔符\"\"\"\n    with open(filepath, 'r', encoding='utf-8-sig', errors='replace') as f:\n        sample = f.read(8192)\n    try:\n        dialect = csv.Sniffer().sniff(sample, delimiters=',;\\t|')\n        return dialect.delimiter\n    except csv.Error:\n        # 默认逗号\n        return ','\n\n\ndef detect_encoding(filepath: str) -> str:\n    \"\"\"自动检测文件编码\"\"\"\n    encodings = ['utf-8-sig', 'utf-8', 'gbk', 'gb18030', 'latin-1']\n    for enc in encodings:\n        try:\n            with open(filepath, 'r', encoding=enc) as f:\n                f.read(8192)\n            return enc\n        except (UnicodeDecodeError, UnicodeError):\n            continue\n    return 'utf-8'\n\n\n# ============================================================\n# 列类型推断\n# ============================================================\n\ndef infer_column_types(rows: List[List[str]], sample_size: int = 100) -> List[str]:\n    \"\"\"推断每列的类型：numeric / date / text / boolean\"\"\"\n    if not rows:\n        return []\n\n    ncols = len(rows[0])\n    types = []\n    sample = rows[:sample_size]\n\n    for col_idx in range(ncols):\n        col_values = [r[col_idx] for r in sample if col_idx < len(r) and not is_missing(r[col_idx])]\n        if not col_values:\n            types.append(\"text\")\n            continue\n\n        numeric_count = sum(1 for v in col_values if try_numeric(v) is not None)\n        date_count = sum(1 for v in col_values if try_date(v) is not None)\n        boolean_count = sum(1 for v in col_values if v.strip().lower() in\n                           {\"true\", \"false\", \"yes\", \"no\", \"是\", \"否\", \"1\", \"0\"})\n\n        if numeric_count / len(col_values) > 0.8:\n            types.append(\"numeric\")\n        elif date_count / len(col_values) > 0.8:\n            types.append(\"date\")\n        elif boolean_count / len(col_values) > 0.8:\n            types.append(\"boolean\")\n        else:\n            types.append(\"text\")\n\n    return types\n\n\n# ============================================================\n# CSV 分析器\n# ============================================================\n\nclass CSVCleaner:\n    \"\"\"CSV 数据清洗器\"\"\"\n\n    def __init__(self, filepath: str, missing_strategy: str = \"fill_na\",\n                 remove_duplicates: bool = True, trim_whitespace: bool = True):\n        self.filepath = filepath\n        self.missing_strategy = missing_strategy\n        self.remove_duplicates = remove_duplicates\n        self.trim_whitespace = trim_whitespace\n\n        self.encoding = detect_encoding(filepath)\n        self.delimiter = detect_delimiter(filepath)\n\n        self.header: List[str] = []\n        self.rows: List[List[str]] = []\n        self.column_types: List[str] = []\n\n        self.issues: List[dict] = []\n        self.actions: List[dict] = []\n        self.original_row_count = 0\n        self.cleaned_row_count = 0\n\n    def load(self):\n        \"\"\"读取 CSV 文件\"\"\"\n        with open(self.filepath, 'r', encoding=self.encoding) as f:\n            reader = csv.reader(f, delimiter=self.delimiter)\n            all_rows = list(reader)\n\n        if not all_rows:\n            print(\"错误：文件为空\", file=sys.stderr)\n            sys.exit(1)\n\n        # 处理 BOM\n        self.header = [h.strip().lstrip('\\ufeff') for h in all_rows[0]]\n        self.rows = all_rows[1:]\n        self.original_row_count = len(self.rows)\n\n        # 推断列类型\n        self.column_types = infer_column_types(self.rows)\n\n    def analyze(self) -> dict:\n        \"\"\"分析数据质量问题\"\"\"\n        self._detect_empty_rows()\n        self._detect_duplicates()\n        self._detect_missing_values()\n        self._detect_whitespace()\n        self._detect_type_mismatches()\n        self._detect_outliers()\n        return {\n            \"issues\": self.issues,\n            \"header\": self.header,\n            \"column_types\": self.column_types,\n            \"row_count\": self.original_row_count,\n            \"col_count\": len(self.header),\n        }\n\n    def clean(self) -> List[List[str]]:\n        \"\"\"执行清洗，返回清洗后的行数据\"\"\"\n        cleaned_rows = []\n        seen = set()\n\n        for row in self.rows:\n            # 跳过空行\n            if all(is_missing(v) for v in row):\n                self.actions.append({\"action\": \"删除空行\", \"detail\": f\"行: {row[:3]}\"})\n                continue\n\n            # 跳过列数不一致的行\n            if len(row) != len(self.header):\n                self.issues.append({\n                    \"severity\": \"high\",\n                    \"type\": \"列数不一致\",\n                    \"detail\": f\"行有{len(row)}列，应为{len(self.header)}列\",\n                })\n                continue\n\n            # 去除首尾空格\n            if self.trim_whitespace:\n                row = [v.strip() if isinstance(v, str) else v for v in row]\n\n            # 去重\n            if self.remove_duplicates:\n                row_key = tuple(row)\n                if row_key in seen:\n                    self.actions.append({\"action\": \"删除重复行\", \"detail\": str(row[:3])})\n                    continue\n                seen.add(row_key)\n\n            cleaned_rows.append(row)\n\n        # 处理缺失值\n        cleaned_rows = self._handle_missing_values(cleaned_rows)\n\n        self.cleaned_row_count = len(cleaned_rows)\n        return cleaned_rows\n\n    def _detect_empty_rows(self):\n        \"\"\"检测空行\"\"\"\n        empty_count = sum(1 for row in self.rows if all(is_missing(v) for v in row))\n        if empty_count > 0:\n            self.issues.append({\n                \"severity\": \"low\",\n                \"type\": \"空行\",\n                \"detail\": f\"{empty_count} 个完全为空的行\",\n            })\n\n    def _detect_duplicates(self):\n        \"\"\"检测重复行\"\"\"\n        seen = set()\n        dup_count = 0\n        for row in self.rows:\n            key = tuple(row)\n            if key in seen:\n                dup_count += 1\n            else:\n                seen.add(key)\n        if dup_count > 0:\n            self.issues.append({\n                \"severity\": \"high\",\n                \"type\": \"完全重复行\",\n                \"detail\": f\"{dup_count} 行与其他行完全相同\",\n            })\n\n    def _detect_missing_values(self):\n        \"\"\"检测缺失值\"\"\"\n        for col_idx, col_name in enumerate(self.header):\n            missing_count = 0\n            total = len(self.rows)\n            for row in self.rows:\n                if col_idx < len(row) and is_missing(row[col_idx]):\n                    missing_count += 1\n            if missing_count > 0:\n                pct = missing_count / total * 100 if total > 0 else 0\n                severity = \"high\" if pct > 30 else (\"medium\" if pct > 5 else \"low\")\n                self.issues.append({\n                    \"severity\": severity,\n                    \"type\": \"缺失值\",\n                    \"detail\": f\"'{col_name}'列有 {missing_count} 个缺失值（{pct:.1f}%）\",\n                })\n\n    def _detect_whitespace(self):\n        \"\"\"检测首尾空格\"\"\"\n        count = 0\n        examples = []\n        for row in self.rows[:200]:  # 采样前200行\n            for v in row:\n                if isinstance(v, str) and v != v.strip() and v.strip():\n                    count += 1\n                    if len(examples) < 3:\n                        examples.append(f\"'{v}' → '{v.strip()}'\")\n        if count > 0:\n            self.issues.append({\n                \"severity\": \"medium\",\n                \"type\": \"首尾空格\",\n                \"detail\": f\"采样中发现 {count} 个带首尾空格的值（如: {'; '.join(examples)}）\",\n            })\n\n    def _detect_type_mismatches(self):\n        \"\"\"检测类型不匹配\"\"\"\n        for col_idx, col_name in enumerate(self.header):\n            col_type = self.column_types[col_idx] if col_idx < len(self.column_types) else \"text\"\n            if col_type == \"numeric\":\n                non_numeric = 0\n                examples = []\n                for row in self.rows[:200]:\n                    if col_idx < len(row) and not is_missing(row[col_idx]):\n                        if try_numeric(row[col_idx]) is None:\n                            non_numeric += 1\n                            if len(examples) < 3:\n                                examples.append(row[col_idx])\n                if non_numeric > 0:\n                    self.issues.append({\n                        \"severity\": \"medium\",\n                        \"type\": \"数值列类型不匹配\",\n                        \"detail\": f\"'{col_name}'列（数值型）有 {non_numeric} 个非数值值（如: {examples}）\",\n                    })\n\n    def _detect_outliers(self):\n        \"\"\"检测数值列异常值\"\"\"\n        for col_idx, col_name in enumerate(self.header):\n            if col_idx >= len(self.column_types):\n                continue\n            if self.column_types[col_idx] != \"numeric\":\n                continue\n            values = []\n            for row in self.rows:\n                if col_idx < len(row):\n                    v = try_numeric(row[col_idx])\n                    if v is not None:\n                        values.append(v)\n            if len(values) < 10:\n                continue\n            avg = mean(values)\n            std = stdev(values) if len(values) > 1 else 0\n            if std == 0:\n                continue\n            threshold = 3 * std\n            outliers = [v for v in values if abs(v - avg) > threshold]\n            if outliers:\n                self.issues.append({\n                    \"severity\": \"low\",\n                    \"type\": \"数值异常值\",\n                    \"detail\": f\"'{col_name}'列有 {len(outliers)} 个异常值（均值{avg:.1f}，超出±3σ），如: {outliers[:3]}\",\n                })\n\n    def _handle_missing_values(self, rows: List[List[str]]) -> List[List[str]]:\n        \"\"\"处理缺失值\"\"\"\n        if self.missing_strategy == \"ignore\":\n            return rows\n\n        for col_idx, col_name in enumerate(self.header):\n            if col_idx >= len(self.column_types):\n                continue\n            col_type = self.column_types[col_idx]\n\n            # 收集该列的有效值\n            valid_values = []\n            for row in rows:\n                if col_idx < len(row) and not is_missing(row[col_idx]):\n                    if col_type == \"numeric\":\n                        v = try_numeric(row[col_idx])\n                        if v is not None:\n                            valid_values.append(v)\n                    else:\n                        valid_values.append(row[col_idx])\n\n            if not valid_values:\n                continue\n\n            # 根据策略填充\n            fill_value = None\n            if self.missing_strategy == \"fill_na\":\n                fill_value = \"N/A\" if col_type == \"text\" else \"\"\n            elif self.missing_strategy == \"fill_mean\" and col_type == \"numeric\":\n                fill_value = str(mean(valid_values))\n            elif self.missing_strategy == \"fill_median\" and col_type == \"numeric\":\n                fill_value = str(median(valid_values))\n            elif self.missing_strategy == \"forward\":\n                # 前向填充\n                last_valid = \"\"\n                for row in rows:\n                    if col_idx < len(row):\n                        if is_missing(row[col_idx]):\n                            row[col_idx] = last_valid\n                        else:\n                            last_valid = row[col_idx]\n                continue\n            elif self.missing_strategy == \"drop\":\n                # 删除含缺失值的行\n                rows = [r for r in rows if col_idx >= len(r) or not is_missing(r[col_idx])]\n                continue\n\n            if fill_value is not None:\n                filled = 0\n                for row in rows:\n                    if col_idx < len(row) and is_missing(row[col_idx]):\n                        row[col_idx] = fill_value\n                        filled += 1\n                if filled > 0:\n                    self.actions.append({\n                        \"action\": f\"缺失值填充({self.missing_strategy})\",\n                        \"detail\": f\"'{col_name}'列填充 {filled} 个值为: {fill_value}\",\n                    })\n\n        return rows\n\n\n# ============================================================\n# 报告格式化\n# ============================================================\n\ndef format_analyze_report(result: dict) -> str:\n    \"\"\"格式化为分析报告\"\"\"\n    lines = []\n    lines.append(\"=\" * 60)\n    lines.append(\"📊 CSV 数据检测报告\")\n    lines.append(\"=\" * 60)\n    lines.append(\"\")\n    lines.append(f\"行数: {result['row_count']} | 列数: {result['col_count']}\")\n    lines.append(\"\")\n\n    # 列信息\n    lines.append(\"📋 列信息:\")\n    lines.append(f\"  {'列名':<20} {'类型':<8}\")\n    lines.append(\"  \" + \"-\" * 30)\n    for name, ctype in zip(result[\"header\"], result[\"column_types\"]):\n        lines.append(f\"  {name:<20} {ctype:<8}\")\n    lines.append(\"\")\n\n    # 问题列表\n    if result[\"issues\"]:\n        lines.append(f\"⚠ 发现 {len(result['issues'])} 个问题:\")\n        severity_icon = {\"high\": \"🔴\", \"medium\": \"🟡\", \"low\": \"🟢\"}\n        for i, issue in enumerate(result[\"issues\"], 1):\n            icon = severity_icon.get(issue[\"severity\"], \"⚪\")\n            lines.append(f\"  {i}. {icon} [{issue['type']}] {issue['detail']}\")\n    else:\n        lines.append(\"✅ 未发现明显数据质量问题。\")\n    lines.append(\"\")\n    lines.append(\"=\" * 60)\n    return \"\\n\".join(lines)\n\n\ndef format_clean_report(cleaner: CSVCleaner, cleaned_rows: List[List[str]]) -> str:\n    \"\"\"格式化为清洗报告\"\"\"\n    lines = []\n    lines.append(\"=\" * 60)\n    lines.append(\"✅ CSV 数据清洗报告\")\n    lines.append(\"=\" * 60)\n    lines.append(\"\")\n\n    lines.append(\"📈 清洗前后对比:\")\n    lines.append(f\"  {'指标':<15} {'清洗前':>10} {'清洗后':>10}\")\n    lines.append(\"  \" + \"-\" * 40)\n    lines.append(f\"  {'行数':<15} {cleaner.original_row_count:>10} {cleaner.cleaned_row_count:>10}\")\n    lines.append(f\"  {'列数':<15} {len(cleaner.header):>10} {len(cleaner.header):>10}\")\n    lines.append(\"\")\n\n    if cleaner.actions:\n        lines.append(f\"🔧 执行的操作 ({len(cleaner.actions)} 项):\")\n        for action in cleaner.actions:\n            lines.append(f\"  ✅ {action['action']}: {action['detail']}\")\n    else:\n        lines.append(\"ℹ 未执行清洗操作。\")\n    lines.append(\"\")\n\n    if cleaner.issues:\n        severity_icon = {\"high\": \"🔴\", \"medium\": \"🟡\", \"low\": \"🟢\"}\n        lines.append(f\"📋 检测到的问题 ({len(cleaner.issues)} 项):\")\n        for issue in cleaner.issues:\n            icon = severity_icon.get(issue[\"severity\"], \"⚪\")\n            lines.append(f\"  {icon} [{issue['type']}] {issue['detail']}\")\n    lines.append(\"\")\n    lines.append(\"=\" * 60)\n    return \"\\n\".join(lines)\n\n\n# ============================================================\n# 主函数\n# ============================================================\n\ndef main():\n    parser = argparse.ArgumentParser(\n        description=\"CSV 数据清洗工具\",\n        formatter_class=argparse.RawDescriptionHelpFormatter,\n    )\n    parser.add_argument(\"--input\", \"-i\", required=True, help=\"输入 CSV 文件路径\")\n    parser.add_argument(\"--output\", \"-o\", help=\"输出清洗后 CSV 文件路径\")\n    parser.add_argument(\"--mode\", \"-m\", choices=[\"analyze\", \"dry-run\", \"execute\"],\n                        default=\"analyze\", help=\"运行模式（默认 analyze）\")\n    parser.add_argument(\"--missing-strategy\", choices=[\n                        \"fill_na\", \"fill_mean\", \"fill_median\",\n                        \"forward\", \"drop\", \"ignore\"],\n                        default=\"fill_na\", help=\"缺失值处理策略（默认 fill_na）\")\n    parser.add_argument(\"--remove-duplicates\", action=\"store_true\", default=True,\n                        help=\"删除完全重复行（默认开启）\")\n    parser.add_argument(\"--keep-duplicates\", action=\"store_true\",\n                        help=\"保留重复行\")\n    parser.add_argument(\"--trim-whitespace\", action=\"store_true\", default=True,\n                        help=\"去除首尾空格（默认开启）\")\n    parser.add_argument(\"--output-report\", \"-r\", help=\"将清洗报告写入文件\")\n    args = parser.parse_args()\n\n    # 检查输入文件\n    if not os.path.exists(args.input):\n        print(f\"错误：文件不存在 - {args.input}\", file=sys.stderr)\n        sys.exit(1)\n\n    # 处理参数\n    remove_dups = not args.keep_duplicates\n    trim_ws = args.trim_whitespace\n\n    # 创建清洗器\n    cleaner = CSVCleaner(\n        args.input,\n        missing_strategy=args.missing_strategy,\n        remove_duplicates=remove_dups,\n        trim_whitespace=trim_ws,\n    )\n\n    # 读取数据\n    print(f\"读取文件: {args.input}\", file=sys.stderr)\n    print(f\"编码: {cleaner.encoding} | 分隔符: '{cleaner.delimiter}'\", file=sys.stderr)\n    cleaner.load()\n    print(f\"读取完成: {cleaner.original_row_count} 行, {len(cleaner.header)} 列\", file=sys.stderr)\n\n    # 分析\n    result = cleaner.analyze()\n\n    if args.mode == \"analyze\":\n        report = format_analyze_report(result)\n        print(report)\n        return\n\n    # 清洗\n    cleaned_rows = cleaner.clean()\n\n    if args.mode == \"dry-run\":\n        print(\"🔍 Dry-run 模式（预览，不写文件）\", file=sys.stderr)\n        report = format_clean_report(cleaner, cleaned_rows)\n        print(report)\n        print(\"\")\n        print(\"清洗后前5行预览:\")\n        for row in cleaned_rows[:5]:\n            print(\"  | \" + \" | \".join(str(v)[:20] for v in row))\n        return\n\n    if args.mode == \"execute\":\n        if not args.output:\n            # 默认输出文件名\n            base, ext = os.path.splitext(args.input)\n            args.output = f\"{base}_cleaned{ext or '.csv'}\"\n\n        # 写入清洗后文件\n        with open(args.output, 'w', encoding='utf-8', newline='') as f:\n            writer = csv.writer(f, delimiter=cleaner.delimiter)\n            writer.writerow(cleaner.header)\n            writer.writerows(cleaned_rows)\n\n        report = format_clean_report(cleaner, cleaned_rows)\n        print(report)\n        print(f\"\\n清洗后文件已保存: {args.output}\", file=sys.stderr)\n\n        if args.output_report:\n            with open(args.output_report, 'w', encoding='utf-8') as f:\n                f.write(report)\n            print(f\"清洗报告已保存: {args.output_report}\", file=sys.stderr)\n\n\nif __name__ == \"__main__\":\n    main()\n", "examples/sample-cleaned-report.md": "# 示例：CSV 数据清洗报告\n\n> 本报告由 `clean_csv.py` 对 `sample-messy-data.csv` 执行清洗后生成。\n> 示例数据为一份员工信息表（49行×6列），刻意包含重复行、缺失值、首尾空格、异常值等问题。\n\n---\n\n## 检测结果摘要\n\n**文件**：`sample-messy-data.csv`\n**原始数据**：49 行 × 6 列\n**清洗后**：41 行 × 6 列\n\n### 列类型推断\n\n| 列名 | 推断类型 | 缺失率 |\n|---|---|---|\n| 姓名 | text | 4.1% |\n| 年龄 | numeric | 14.3% |\n| 入职日期 | date | 8.2% |\n| 部门 | text | 4.1% |\n| 薪资 | numeric | 12.2% |\n| 城市 | text | 2.0% |\n\n### 发现的问题（11 项）\n\n| # | 严重度 | 问题类型 | 详情 |\n|---|---|---|---|\n| 1 | 🟢 低 | 空行 | 1 个完全为空的行 |\n| 2 | 🔴 高 | 完全重复行 | 7 行与其他行完全相同 |\n| 3 | 🟢 低 | 缺失值 | \"姓名\"列 2 个缺失（4.1%） |\n| 4 | 🟡 中 | 缺失值 | \"年龄\"列 7 个缺失（14.3%） |\n| 5 | 🟡 中 | 缺失值 | \"入职日期\"列 4 个缺失（8.2%） |\n| 6 | 🟢 低 | 缺失值 | \"部门\"列 2 个缺失（4.1%） |\n| 7 | 🟡 中 | 缺失值 | \"薪资\"列 6 个缺失（12.2%） |\n| 8 | 🟢 低 | 缺失值 | \"城市\"列 1 个缺失（2.0%） |\n| 9 | 🟡 中 | 首尾空格 | 5 个值有首尾空格（如\" 32 \"→\"32\"） |\n| 10 | 🟢 低 | 异常值 | \"年龄\"列 1 个离群值（150岁） |\n| 11 | 🟢 低 | 异常值 | \"薪资\"列 1 个离群值（999999元） |\n\n---\n\n## 清洗执行结果\n\n### 清洗前后对比\n\n| 指标 | 清洗前 | 清洗后 |\n|---|---|---|\n| 行数 | 49 | 41 |\n| 列数 | 6 | 6 |\n| 空行 | 1 | 0 |\n| 重复行 | 7 | 0 |\n| 缺失值（年龄） | 7 | 0（中位数填充） |\n| 缺失值（薪资） | 6 | 0（中位数填充） |\n\n### 执行的操作\n\n1. **删除空行**：1 行（完全为空的行）\n2. **删除完全重复行**：7 行（张三、钱七、孙八、周九、吴十、郑十一、王十二各重复一次）\n3. **去除首尾空格**：所有文本值自动 strip（如\" 32 \"→\"32\"、\" 市场部 \"→\"市场部\"）\n4. **缺失值填充（中位数策略）**：\n   - \"年龄\"列：5 个缺失值填充为中位数 **33.0**\n   - \"薪资\"列：4 个缺失值填充为中位数 **16000.0**\n\n### 未自动处理的问题（仅报告）\n\n- **异常值**：年龄 150 岁、薪资 999999 元 — 可能是录入错误，但不自动删除，建议人工确认\n- **日期格式不统一**：存在 `2023-01-15`、`2023/02/20`、`2023年3月10日` 等多种格式 — 如需统一可进一步处理\n- **\"N/A\"等缺失标记**：已被识别为缺失值并填充\n\n---\n\n## 清洗后数据预览\n\n```\n姓名,年龄,入职日期,部门,薪资,城市\n张三,28,2023-01-15,研发部,15000,北京\n李四,32,2023/02/20,研发部,18000,上海\n王五,33.0,2023年3月10日,产品部,20000,北京\n赵六,45,2023-04-01,市场部,12000,广州\n钱七,29,N/A,研发部,16000,深圳\n孙八,33.0,2023-05-15,人事部,16000.0,杭州\n...\n```\n\n---\n\n## 建议的后续处理\n\n1. **人工确认异常值**：年龄 150 岁和薪资 999999 元可能是录入错误，建议核实\n2. **统一日期格式**：将 `2023/02/20`、`2023年3月10日` 等统一为 `YYYY-MM-DD`\n3. **处理\"N/A\"标记**：钱七的入职日期为 N/A，建议确认真实日期\n4. **补充缺失姓名**：2 行姓名为空，建议补充\n", "examples/sample-messy-data.csv": "姓名,年龄,入职日期,部门,薪资,城市\n张三,28,2023-01-15,研发部,15000,北京\n李四, 32 ,2023/02/20,研发部, 18000 ,上海\n王五,未知,2023年3月10日,产品部,20000,北京\n赵六,45,2023-04-01, 市场部 ,12000,广州\n钱七,29,N/A,研发部,16000,深圳\n孙八,,2023-05-15,人事部,,杭州\n周九,38,2023/06/20,研发部,25000,北京\n吴十,26,2023-07-01,设计部,13000,成都\n郑十一, 31 ,2023年8月15日,产品部,19000,上海\n王十二,42,2023-09-01,研发部,22000,北京\n张三,28,2023-01-15,研发部,15000,北京\n李十三,35,2023/10/10,市场部,14000,广州\n,29,2023-11-05,研发部,17000,深圳\n钱七,29,N/A,研发部,16000,深圳\n孙八,,2023-05-15,人事部,,杭州\n周九,38,2023/06/20,研发部,25000,北京\n吴十,26,2023-07-01,设计部,13000,成都\n郑十一, 31 ,2023年8月15日,产品部,19000,上海\n王十二,42,2023-09-01,研发部,22000,北京\n冯十三,50,2023-12-01,研发部,30000,北京\n陈十四,27,2024/01/15,市场部,11000,广州\n褚十五,150,2024-02-01,研发部,999999,上海\n卫十六,33,2024年3月10日,,18000,深圳\n蒋十七,,2024-04-01,人事部,10000,杭州\n沈十八,41,2024/05/20,产品部,,北京\n韩十九,29,2024-06-15,研发部,16000,上海\n杨二十,36,2024/07/01,市场部,13000,广州\n, , , , ,\n朱二十一,28,2024-08-01,设计部,14000,成都\n秦二十二,,2024/09/10,研发部,,深圳\n尤二十三,34,2024年10月15日,产品部,21000,北京\n许二十四,47,2024-11-01,市场部,15000,广州\n何二十五,30,2024/12/01,研发部,17000,上海\n吕二十六,39,,人事部,11000,杭州\n施二十七,33,2025-01-15,产品部,19000,北京\n张二十八,25,2025/02/20,设计部,12000,成都\n孔二十九,44,2025年3月10日,研发部,26000,深圳\n曹三十,28,2025-04-01,市场部,13000,广州\n严三十一,31,2025/05/15,研发部,18000,北京\n华三十二,,2025-06-01,人事部,,杭州\n金三十三,37,2025/07/01,产品部,20000,上海\n魏三十四,29,2025年8月15日,研发部,16000,北京\n陶三十五,43,2025-09-01,市场部,14000,广州\n姜三十六,27,2025/10/01,设计部,13000,成都\n戚三十七,35,2025年11月15日,研发部,19000,深圳\n谢三十八,32,2025-12-01,产品部,20000,上海\n邹三十九,38,2026/01/15,人事部,12000,杭州\n喻四十,30,2026年2月20日,研发部,17000,北京\n柏四十一,36,2026-03-01,市场部,14000,广州\n"}, "file_count": 5, "script_lines": 583}, {"name": "date-extractor", "title": "date-extractor", "description": "日期提取与倒计时助手。从任意文本（邮件、会议记录、文档、聊天记录）中自动提取所有日期和截止事项，支持多种日期格式（YYYY-MM-DD、中文日期、相对日期），计算距离今天的倒计时天数，按时间排序输出即将到来的截止清单，并标注上下文（是什么事的截止日期）。适用于整理会议截止事项、追踪项目deadline、从邮件中提取待办时间节点、生成倒计时清单等场景。", "category": "日程管理", "icon": "📅", "color": "#0ea5e9", "skill_md": "---\nname: date-extractor\ndescription: '日期提取与倒计时助手。从任意文本（邮件、会议记录、文档、聊天记录）中自动提取所有日期和截止事项，支持多种日期格式（YYYY-MM-DD、中文日期、相对日期），计算距离今天的倒计时天数，按时间排序输出即将到来的截止清单，并标注上下文（是什么事的截止日期）。适用于整理会议截止事项、追踪项目deadline、从邮件中提取待办时间节点、生成倒计时清单等场景。'\n---\n\n# 日期提取与倒计时助手\n\n## 一、技能定位\n\n本技能用于**从任意文本中自动提取日期和截止事项，并生成倒计时清单**。核心价值：\n\n- 自动识别：从邮件、会议记录、文档中识别所有日期\n- 多格式支持：YYYY-MM-DD、YYYY/MM/DD、中文日期（2024年3月15日）、相对日期（下周、月底）\n- 倒计时计算：自动计算距离今天还有多少天\n- 上下文关联：提取日期周围的文字，说明\"这是什么事的截止\"\n- 智能排序：按时间先后排序，突出即将到来的事项\n- 逾期提醒：已过期的事项单独标注\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我从这段文字里找出所有日期/截止时间」\n2. 用户说「帮我看看还有哪些事快到截止了」\n3. 用户说「这些文档里有哪些 deadline」\n4. 用户说「帮我整理一下会议纪要里的时间节点」\n5. 用户说「距离某个截止日期还有多少天」\n6. 用户说「帮我从邮件里提取待办事项和时间」\n7. 用户说「最近有哪些事情要到期了」\n8. 用户给出一段文本，要求\"找出日期\"\"提取截止时间\"\"生成倒计时\"\n\n## 三、支持的日期格式\n\n### 3.1 标准日期\n\n| 格式 | 示例 |\n|---|---|\n| YYYY-MM-DD | 2024-03-15 |\n| YYYY/MM/DD | 2024/03/15 |\n| YYYY.MM.DD | 2024.03.15 |\n| YYYYMMDD | 20240315 |\n\n### 3.2 中文日期\n\n| 格式 | 示例 |\n|---|---|\n| 完整中文 | 2024年3月15日 |\n| 简短中文 | 3月15日 |\n| 中文+星期 | 3月15日星期五 |\n\n### 3.3 相对日期\n\n| 格式 | 示例 | 说明 |\n|---|---|---|\n| 今天/明天/后天 | 明天截止 | 相对今天 |\n| X天后 | 3天后提交 | 相对今天 |\n| 本周/下周 | 周五前提交 | 本周工作日 |\n| 月底/月初 | 月底前完成 | 本月最后一天 |\n| 本周X | 本周三 | 本周星期几 |\n\n### 3.4 时间表达式\n\n| 格式 | 示例 |\n|---|---|\n| 带时间 | 2024-03-15 14:00 |\n| 上午/下午 | 3月15日下午 |\n| 截止/deadline | 截止日期：2024-03-15 |\n\n## 四、操作步骤\n\n### 步骤 1：接收文本\n\n确认用户输入的文本来源：\n- 直接粘贴的文本\n- 文件路径（.txt/.md/.docx 等文本文件）\n- 邮件内容\n- 会议记录\n\n### 步骤 2：运行提取脚本\n\n使用 `scripts/extract_dates.py` 进行日期提取：\n\n```bash\n# 从文件提取日期\npython3 scripts/extract_dates.py --file notes.txt\n\n# 直接传入文本\npython3 scripts/extract_dates.py --text \"报告截止3月15日，下周开会\"\n\n# 从 stdin 读取\ncat notes.txt | python3 scripts/extract_dates.py\n\n# 只显示未来30天内的事项\npython3 scripts/extract_dates.py --file notes.txt --within-days 30\n\n# 包含已过期事项\npython3 scripts/extract_dates.py --file notes.txt --include-overdue\n\n# 输出 JSON 格式\npython3 scripts/extract_dates.py --file notes.txt --output json\n```\n\n### 步骤 3：解读提取结果\n\n脚本输出包含：\n\n```\n📅 日期与截止事项清单\n━━━━━━━━━━━━━━━━━━\n分析日期：2026-09-20\n共发现 5 个日期事项\n\n⏳ 即将到来（按时间排序）：\n  🔴 3天后（09-23 周二）\n     提交季度报告\n     来源：\"报告截止3月15日\"\n\n  🟡 7天后（09-27 周六）\n     项目演示\n     来源：\"下周三演示\"\n\n  🟢 14天后（10-04 周六）\n     团队聚餐\n     来源：\"月底前团建\"\n\n⚠ 已过期：\n  🔴 已过期 2 天\n     月度总结\n     来源：\"9月18日前提交\"\n```\n\n### 步骤 4：与用户确认\n\n1. **日期是否准确**：有没有识别错误的日期？\n2. **上下文是否完整**：提取的事项描述是否清楚？\n3. **相对日期计算**：相对日期（下周/月底）的计算是否合理？\n4. **是否遗漏**：有没有文本中提到但未识别的日期？\n\n### 步骤 5：输出最终清单\n\n根据用户确认后输出：\n- 按时间排序的截止事项\n- 倒计时天数\n- 事项描述\n- 重要事项标注\n\n## 五、输出规范\n\n### 5.1 倒计时清单\n\n```\n📅 截止事项倒计时清单\n━━━━━━━━━━━━━━━━━━━━━━\n分析日期：YYYY-MM-DD\n共发现 X 个日期事项\n\n⏳ 即将到来：\n  🔴 X天后（MM-DD 周X）\n     事项描述\n     原文：\"...\"\n\n  🟡 X天后（MM-DD 周X）\n     事项描述\n     原文：\"...\"\n\n⚠ 已过期：\n  🔴 已过期 X 天\n     事项描述\n     原文：\"...\"\n\n📊 统计：\n  未来7天内：X 项\n  未来30天内：X 项\n  已过期：X 项\n```\n\n### 5.2 单条日期详情\n\n```\n事项：提交季度报告\n日期：2026-09-23（周二）\n倒计时：3 天\n原文：\"报告截止3月15日前提交\"\n重要度：🔴 紧急（3天内）\n```\n\n## 六、常见场景处理\n\n### 场景 1：整理会议纪要中的截止事项\n**用户**：「帮我从这份会议纪要里找出所有要做的事和截止时间」\n**处理**：运行提取脚本 → 输出所有日期事项 → 按时间排序 → 标注即将到期的。\n\n### 场景 2：追踪项目 deadline\n**用户**：「这个项目还有哪些 deadline 快到了」\n**处理**：提取所有日期 → 筛选未来14天内 → 输出紧急程度排序。\n\n### 场景 3：从邮件中提取待办\n**用户**：「帮我看看这封邮件里有什么时间要求」\n**处理**：粘贴邮件内容 → 提取日期 → 输出截止事项。\n\n### 场景 4：生成倒计时清单\n**用户**：「帮我做个本月待办倒计时清单」\n**处理**：提取文本中所有日期 → 按时间排序 → 标注重要事项。\n\n## 七、注意事项\n\n1. **相对日期需确认**：相对日期（下周、月底）基于今天计算，可能存在歧义，需与用户确认。\n2. **年份推断**：没有年份的日期默认按当前年份；如果月份已过，可能需要推断为下一年。\n3. **上下文提取**：日期周围的文字不一定完整描述事项，可能需要结合上下文理解。\n4. **多种日期格式**：同一文本可能混用多种格式，脚本尽量兼容，但复杂格式可能遗漏。\n5. **时区问题**：脚本不处理时区，默认按本地日期计算。\n6. **不替代日历**：本工具用于从文本中提取日期，不是日历管理工具。\n7. **重复日期合并**：同一日期的多个事项会分别列出，不会自动合并。\n8. **模糊日期**：如\"过几天\"\"不久后\"等模糊表达无法精确计算，会标注为模糊。\n9. **跨年处理**：12月提到的\"1月\"可能是下一年1月，脚本会尝试推断。\n10. **隐私保护**：文本内容不离开本地，提取过程在本地完成。\n\n## 八、文件结构\n\n```\ndate-extractor/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── countdown-checklist-template.md   # 倒计时清单模板\n├── scripts/\n│   └── extract_dates.py                  # 日期提取脚本\n└── examples/\n    ├── sample-notes.txt                  # 示例：含日期的文本\n    └── sample-countdown-report.md        # 示例：倒计时报告\n```\n\n## 九、使用示例\n\n### 示例 1：从文本提取日期\n**用户**：「帮我从这段文字里找出所有截止时间」\n**AI**：运行提取脚本 → 输出日期清单和倒计时。\n\n### 示例 2：即将到期提醒\n**用户**：「最近有什么事快到截止了？」\n**AI**：提取文本 → 筛选未来7天内 → 输出紧急事项。\n\n### 示例 3：会议纪要整理\n**用户**：「这是会议记录，帮我整理一下时间节点」\n**AI**：提取所有日期和行动项 → 按时间排序 → 输出清单。\n", "files": {"SKILL.md": "---\nname: date-extractor\ndescription: '日期提取与倒计时助手。从任意文本（邮件、会议记录、文档、聊天记录）中自动提取所有日期和截止事项，支持多种日期格式（YYYY-MM-DD、中文日期、相对日期），计算距离今天的倒计时天数，按时间排序输出即将到来的截止清单，并标注上下文（是什么事的截止日期）。适用于整理会议截止事项、追踪项目deadline、从邮件中提取待办时间节点、生成倒计时清单等场景。'\n---\n\n# 日期提取与倒计时助手\n\n## 一、技能定位\n\n本技能用于**从任意文本中自动提取日期和截止事项，并生成倒计时清单**。核心价值：\n\n- 自动识别：从邮件、会议记录、文档中识别所有日期\n- 多格式支持：YYYY-MM-DD、YYYY/MM/DD、中文日期（2024年3月15日）、相对日期（下周、月底）\n- 倒计时计算：自动计算距离今天还有多少天\n- 上下文关联：提取日期周围的文字，说明\"这是什么事的截止\"\n- 智能排序：按时间先后排序，突出即将到来的事项\n- 逾期提醒：已过期的事项单独标注\n\n## 二、触发场景\n\n当用户出现以下需求时使用本技能：\n\n1. 用户说「帮我从这段文字里找出所有日期/截止时间」\n2. 用户说「帮我看看还有哪些事快到截止了」\n3. 用户说「这些文档里有哪些 deadline」\n4. 用户说「帮我整理一下会议纪要里的时间节点」\n5. 用户说「距离某个截止日期还有多少天」\n6. 用户说「帮我从邮件里提取待办事项和时间」\n7. 用户说「最近有哪些事情要到期了」\n8. 用户给出一段文本，要求\"找出日期\"\"提取截止时间\"\"生成倒计时\"\n\n## 三、支持的日期格式\n\n### 3.1 标准日期\n\n| 格式 | 示例 |\n|---|---|\n| YYYY-MM-DD | 2024-03-15 |\n| YYYY/MM/DD | 2024/03/15 |\n| YYYY.MM.DD | 2024.03.15 |\n| YYYYMMDD | 20240315 |\n\n### 3.2 中文日期\n\n| 格式 | 示例 |\n|---|---|\n| 完整中文 | 2024年3月15日 |\n| 简短中文 | 3月15日 |\n| 中文+星期 | 3月15日星期五 |\n\n### 3.3 相对日期\n\n| 格式 | 示例 | 说明 |\n|---|---|---|\n| 今天/明天/后天 | 明天截止 | 相对今天 |\n| X天后 | 3天后提交 | 相对今天 |\n| 本周/下周 | 周五前提交 | 本周工作日 |\n| 月底/月初 | 月底前完成 | 本月最后一天 |\n| 本周X | 本周三 | 本周星期几 |\n\n### 3.4 时间表达式\n\n| 格式 | 示例 |\n|---|---|\n| 带时间 | 2024-03-15 14:00 |\n| 上午/下午 | 3月15日下午 |\n| 截止/deadline | 截止日期：2024-03-15 |\n\n## 四、操作步骤\n\n### 步骤 1：接收文本\n\n确认用户输入的文本来源：\n- 直接粘贴的文本\n- 文件路径（.txt/.md/.docx 等文本文件）\n- 邮件内容\n- 会议记录\n\n### 步骤 2：运行提取脚本\n\n使用 `scripts/extract_dates.py` 进行日期提取：\n\n```bash\n# 从文件提取日期\npython3 scripts/extract_dates.py --file notes.txt\n\n# 直接传入文本\npython3 scripts/extract_dates.py --text \"报告截止3月15日，下周开会\"\n\n# 从 stdin 读取\ncat notes.txt | python3 scripts/extract_dates.py\n\n# 只显示未来30天内的事项\npython3 scripts/extract_dates.py --file notes.txt --within-days 30\n\n# 包含已过期事项\npython3 scripts/extract_dates.py --file notes.txt --include-overdue\n\n# 输出 JSON 格式\npython3 scripts/extract_dates.py --file notes.txt --output json\n```\n\n### 步骤 3：解读提取结果\n\n脚本输出包含：\n\n```\n📅 日期与截止事项清单\n━━━━━━━━━━━━━━━━━━\n分析日期：2026-09-20\n共发现 5 个日期事项\n\n⏳ 即将到来（按时间排序）：\n  🔴 3天后（09-23 周二）\n     提交季度报告\n     来源：\"报告截止3月15日\"\n\n  🟡 7天后（09-27 周六）\n     项目演示\n     来源：\"下周三演示\"\n\n  🟢 14天后（10-04 周六）\n     团队聚餐\n     来源：\"月底前团建\"\n\n⚠ 已过期：\n  🔴 已过期 2 天\n     月度总结\n     来源：\"9月18日前提交\"\n```\n\n### 步骤 4：与用户确认\n\n1. **日期是否准确**：有没有识别错误的日期？\n2. **上下文是否完整**：提取的事项描述是否清楚？\n3. **相对日期计算**：相对日期（下周/月底）的计算是否合理？\n4. **是否遗漏**：有没有文本中提到但未识别的日期？\n\n### 步骤 5：输出最终清单\n\n根据用户确认后输出：\n- 按时间排序的截止事项\n- 倒计时天数\n- 事项描述\n- 重要事项标注\n\n## 五、输出规范\n\n### 5.1 倒计时清单\n\n```\n📅 截止事项倒计时清单\n━━━━━━━━━━━━━━━━━━━━━━\n分析日期：YYYY-MM-DD\n共发现 X 个日期事项\n\n⏳ 即将到来：\n  🔴 X天后（MM-DD 周X）\n     事项描述\n     原文：\"...\"\n\n  🟡 X天后（MM-DD 周X）\n     事项描述\n     原文：\"...\"\n\n⚠ 已过期：\n  🔴 已过期 X 天\n     事项描述\n     原文：\"...\"\n\n📊 统计：\n  未来7天内：X 项\n  未来30天内：X 项\n  已过期：X 项\n```\n\n### 5.2 单条日期详情\n\n```\n事项：提交季度报告\n日期：2026-09-23（周二）\n倒计时：3 天\n原文：\"报告截止3月15日前提交\"\n重要度：🔴 紧急（3天内）\n```\n\n## 六、常见场景处理\n\n### 场景 1：整理会议纪要中的截止事项\n**用户**：「帮我从这份会议纪要里找出所有要做的事和截止时间」\n**处理**：运行提取脚本 → 输出所有日期事项 → 按时间排序 → 标注即将到期的。\n\n### 场景 2：追踪项目 deadline\n**用户**：「这个项目还有哪些 deadline 快到了」\n**处理**：提取所有日期 → 筛选未来14天内 → 输出紧急程度排序。\n\n### 场景 3：从邮件中提取待办\n**用户**：「帮我看看这封邮件里有什么时间要求」\n**处理**：粘贴邮件内容 → 提取日期 → 输出截止事项。\n\n### 场景 4：生成倒计时清单\n**用户**：「帮我做个本月待办倒计时清单」\n**处理**：提取文本中所有日期 → 按时间排序 → 标注重要事项。\n\n## 七、注意事项\n\n1. **相对日期需确认**：相对日期（下周、月底）基于今天计算，可能存在歧义，需与用户确认。\n2. **年份推断**：没有年份的日期默认按当前年份；如果月份已过，可能需要推断为下一年。\n3. **上下文提取**：日期周围的文字不一定完整描述事项，可能需要结合上下文理解。\n4. **多种日期格式**：同一文本可能混用多种格式，脚本尽量兼容，但复杂格式可能遗漏。\n5. **时区问题**：脚本不处理时区，默认按本地日期计算。\n6. **不替代日历**：本工具用于从文本中提取日期，不是日历管理工具。\n7. **重复日期合并**：同一日期的多个事项会分别列出，不会自动合并。\n8. **模糊日期**：如\"过几天\"\"不久后\"等模糊表达无法精确计算，会标注为模糊。\n9. **跨年处理**：12月提到的\"1月\"可能是下一年1月，脚本会尝试推断。\n10. **隐私保护**：文本内容不离开本地，提取过程在本地完成。\n\n## 八、文件结构\n\n```\ndate-extractor/\n├── SKILL.md                              # 本文件，技能定义与使用说明\n├── templates/\n│   └── countdown-checklist-template.md   # 倒计时清单模板\n├── scripts/\n│   └── extract_dates.py                  # 日期提取脚本\n└── examples/\n    ├── sample-notes.txt                  # 示例：含日期的文本\n    └── sample-countdown-report.md        # 示例：倒计时报告\n```\n\n## 九、使用示例\n\n### 示例 1：从文本提取日期\n**用户**：「帮我从这段文字里找出所有截止时间」\n**AI**：运行提取脚本 → 输出日期清单和倒计时。\n\n### 示例 2：即将到期提醒\n**用户**：「最近有什么事快到截止了？」\n**AI**：提取文本 → 筛选未来7天内 → 输出紧急事项。\n\n### 示例 3：会议纪要整理\n**用户**：「这是会议记录，帮我整理一下时间节点」\n**AI**：提取所有日期和行动项 → 按时间排序 → 输出清单。\n", "templates/countdown-checklist-template.md": "# 倒计时清单模板\n\n> 使用 date-extractor 技能生成后，填入以下模板。\n\n## 📅 截止事项倒计时清单\n\n**生成日期**：YYYY-MM-DD\n**数据来源**：__________\n\n---\n\n### 🔴 紧急（3天内）\n\n| 日期 | 事项 | 倒计时 | 状态 |\n|---|---|---|---|\n| MM-DD | | X天 | ☐ |\n\n### 🟡 本周内（7天）\n\n| 日期 | 事项 | 倒计时 | 状态 |\n|---|---|---|---|\n| MM-DD | | X天 | ☐ |\n\n### 🟢 本月内（30天）\n\n| 日期 | 事项 | 倒计时 | 状态 |\n|---|---|---|---|\n| MM-DD | | X天 | ☐ |\n\n### ⚪ 较远（30天+）\n\n| 日期 | 事项 | 倒计时 | 状态 |\n|---|---|---|---|\n| MM-DD | | X天 | ☐ |\n\n### ⚠ 已逾期\n\n| 日期 | 事项 | 逾期天数 | 处理 |\n|---|---|---|---|\n| MM-DD | | X天 | |\n\n---\n\n*模板由 date-extractor 技能提供*\n", "scripts/extract_dates.py": "#!/usr/bin/env python3\n# -*- coding: utf-8 -*-\nr\"\"\"\n日期提取与倒计时脚本\n\n从文本中提取所有日期和截止事项，计算倒计时天数，按时间排序输出。\n\n用法：\n  python3 extract_dates.py --file notes.txt\n  python3 extract_dates.py --text \"报告截止3月15日\"\n  python3 extract_dates.py --file notes.txt --within-days 30\n  python3 extract_dates.py --file notes.txt --include-overdue\n  python3 extract_dates.py --file notes.txt --output json\n  cat notes.txt | python3 extract_dates.py\n\"\"\"\n\nimport argparse\nimport json\nimport re\nimport sys\nfrom datetime import datetime, date, timedelta\nfrom typing import List, Optional, Tuple\n\n\n# ============================================================\n# 数据结构\n# ============================================================\n\nclass DateItem:\n    \"\"\"单个日期事项\"\"\"\n    def __init__(self, date_str: str, context: str, raw_text: str,\n                 parsed_date: Optional[date] = None, relative: bool = False):\n        self.date_str = date_str          # 原始日期文本\n        self.context = context            # 上下文描述\n        self.raw_text = raw_text          # 整行原文\n        self.parsed_date = parsed_date    # 解析后的日期\n        self.relative = relative          # 是否为相对日期\n        self.days_until = None            # 倒计时天数\n\n    def __repr__(self):\n        return f\"<DateItem {self.date_str}>\"\n\n\n# ============================================================\n# 日期解析\n# ============================================================\n\n# 星期映射\nWEEKDAY_MAP = {\n    \"一\": 0, \"二\": 1, \"三\": 2, \"四\": 3,\n    \"五\": 4, \"六\": 5, \"日\": 6, \"天\": 6,\n}\n\n\ndef parse_standard_date(text: str, today: date) -> Optional[date]:\n    \"\"\"解析标准日期格式\"\"\"\n    # YYYY-MM-DD 或 YYYY/MM/DD 或 YYYY.MM.DD\n    m = re.match(r'(\\d{4})[-/.](\\d{1,2})[-/.](\\d{1,2})', text)\n    if m:\n        try:\n            return date(int(m.group(1)), int(m.group(2)), int(m.group(3)))\n        except ValueError:\n            return None\n\n    # YYYYMMDD\n    m = re.match(r'(\\d{4})(\\d{2})(\\d{2})$', text)\n    if m:\n        try:\n            return date(int(m.group(1)), int(m.group(2)), int(m.group(3)))\n        except ValueError:\n            return None\n\n    return None\n\n\ndef parse_chinese_date(text: str, today: date) -> Optional[date]:\n    \"\"\"解析中文日期格式\"\"\"\n    # YYYY年M月D日\n    m = re.match(r'(\\d{4})年(\\d{1,2})月(\\d{1,2})日?', text)\n    if m:\n        try:\n            return date(int(m.group(1)), int(m.group(2)), int(m.group(3)))\n        except ValueError:\n            return None\n\n    # M月D日（无年份，用当前年份）\n    m = re.match(r'(\\d{1,2})月(\\d{1,2})日?', text)\n    if m:\n        month, day = int(m.group(1)), int(m.group(2))\n        year = today.year\n        try:\n            d = date(year, month, day)\n            # 如果日期已过，推断为下一年\n            if d < today - timedelta(days=7):\n                d = date(year + 1, month, day)\n            return d\n        except ValueError:\n            return None\n\n    return None\n\n\ndef parse_relative_date(text: str, today: date) -> Optional[date]:\n    \"\"\"解析相对日期\"\"\"\n    text = text.strip()\n\n    # 今天\n    if text in (\"今天\", \"今日\", \"今天内\", \"今天截止\"):\n        return today\n\n    # 明天/后天\n    if text in (\"明天\", \"明日\"):\n        return today + timedelta(days=1)\n    if text in (\"后天\",):\n        return today + timedelta(days=2)\n\n    # X天后\n    m = re.match(r'(\\d+)天后', text)\n    if m:\n        return today + timedelta(days=int(m.group(1)))\n\n    # 本周X / 这周日X\n    m = re.match(r'本周([一二三四五六日天])', text)\n    if m:\n        target_weekday = WEEKDAY_MAP.get(m.group(1))\n        if target_weekday is not None:\n            days_ahead = target_weekday - today.weekday()\n            if days_ahead <= 0:\n                days_ahead += 7\n            return today + timedelta(days=days_ahead)\n\n    # 下周X\n    m = re.match(r'下周([一二三四五六日天])', text)\n    if m:\n        target_weekday = WEEKDAY_MAP.get(m.group(1))\n        if target_weekday is not None:\n            days_ahead = 7 - today.weekday() + target_weekday\n            return today + timedelta(days=days_ahead)\n\n    # 月底\n    if text in (\"月底\", \"月末\", \"月底前\", \"月末前\"):\n    # 下个月最后一天\n        if today.month == 12:\n            return date(today.year + 1, 1, 1) - timedelta(days=1)\n        else:\n            return date(today.year, today.month + 1, 1) - timedelta(days=1)\n\n    # 本周（周五前等）\n    if text in (\"本周\", \"这周\", \"本周内\"):\n        # 本周日\n        days_ahead = 6 - today.weekday()\n        if days_ahead < 0:\n            days_ahead = 7\n        return today + timedelta(days=days_ahead)\n\n    return None\n\n\ndef extract_context(line: str, date_match: str) -> str:\n    \"\"\"从行中
